       VISION METERS
       Each meter captures a small region of the game screen and
       measures what percentage of its pixels match the given HSL
       range. The JS Meter class smooths readings over N frames
       before firing a callback.

       Detection strategy: every game state uses a POSITIVE meter
       (confirms the expected color IS present) paired with a
       NEGATIVE "Not" meter (confirms the region does NOT show that
       color during baseline/off state). A state is considered active
       only when positive is high AND negative is low, preventing
       false positives from ambient lighting or UI transitions.

       TESTER NOTE: If an effect never fires, first check the QA Tool
       — load a screenshot from the target resolution and verify the
       meter region actually captures the right pixels at the right
       color. Then adjust HSL ranges or region coordinates as needed.
       ═══════════════════════════════════════════════════════════ -->

<body style="margin: 0; padding: 0; background: #000;">
    <canvas id="exCanvas" width="320" height="200"></canvas>
</body>

<script>
    // ═══════════════════════════════════════════════════════════
    // CANVAS SETUP
    // SignalRGB renders this 320x200 canvas onto the device layout.
    // All effects draw to the hidden canvas, composited to ctx once per frame.
    // ═══════════════════════════════════════════════════════════
    const canvas = document.getElementById('exCanvas');
    const ctx    = canvas.getContext('2d');
    const width  = 320;
    const height = 200;

    const hiddenCanvas = document.createElement('canvas');
    hiddenCanvas.width  = 320;
    hiddenCanvas.height = 200;
    const hiddenCtx = hiddenCanvas.getContext('2d');

    let effects = [];

    //#region Update
    function update() {
        DrawRect(0, 0, 320, 200, 'black')
        backgroundHandler()

        inGame1_Meter.setValue(engine.vision.inGame1)
        inGame2_Meter.setValue(engine.vision.inGame2)
        inGame3_Meter.setValue(engine.vision.inGame3)
        gSignColor.setValue(engine.vision.signColor)
        signBright_Meter.setValue(engine.vision.signBright)
        signYellow_Meter.setValue(engine.vision.signYellow)
        signYellowConfirm_Meter.setValue(engine.vision.signYellowConfirm)
        toxicLength_Meter.setValue(engine.vision.toxicLength)
        toxicHealth_Meter.setValue(engine.vision.toxicHealth)
        healthLength_Meter.setValue(engine.vision.healthLength)
        healthBar_Meter.setValue(engine.vision.healthLength)
        adrenaline1_Meter.setValue(engine.vision.adrenaline1)
        adrenaline2_Meter.setValue(engine.vision.adrenaline2)
        adrenaline3_Meter.setValue(engine.vision.adrenaline3)
        xpWhite_Meter.setValue(engine.vision.xpWhite)
        xpNotWhite_Meter.setValue(engine.vision.xpNotWhite)
        goodGreen_Meter.setValue(engine.vision.goodGreen)
        goodNotGreen_Meter.setValue(engine.vision.goodNotGreen)
        cardRed1_Meter.setValue(engine.vision.cardRed1)
        cardBlack1_Meter.setValue(engine.vision.cardBlack1)
        cardRed2_Meter.setValue(engine.vision.cardRed2)
        cardBlack2_Meter.setValue(engine.vision.cardBlack2)
        deathGrey_Meter.setValue(engine.vision.deathGrey)
        deathBlack_Meter.setValue(engine.vision.deathBlack)
        deathText_Meter.setValue(engine.vision.deathText)
        horseOrange_Meter.setValue(engine.vision.horseOrange)
        horseNotOrange_Meter.setValue(engine.vision.horseNotOrange)

        checkTimedTriggers()
        effects.forEach(ele => { ele.draw() })
        effects = effects.filter(ele => !(ele.lifetime <= 0))
        DrawHUD()

        ctx.drawImage(hiddenCanvas, 0, 0)
        window.requestAnimationFrame(update)
    }
    //#endregion

    //#region Meter Declarations

    function healthLengthMeterCallback() {
        tookDamageCallback()
    }

    // -------------------------------------------------------------------------
    // Meter objects
    // -------------------------------------------------------------------------
    const inGame1_Meter = new Meter(3, inGameDetect)
    const inGame2_Meter = new Meter(3, inGameDetect)
    const inGame3_Meter = new Meter(3, inGameDetect)
    const gSignColor = new Meter(10, ()=>"")
    const signBright_Meter = new Meter(5, signUseCallback)
    const signYellow_Meter = new Meter(5, signUseCallback)
    const signYellowConfirm_Meter = new Meter(5, signUseCallback)
    const toxicLength_Meter = new Meter(5, toxicCallback)
    const toxicHealth_Meter = new Meter(5, toxicCallback)
    const healthLength_Meter = new Meter(5, healthLengthMeterCallback)
    const healthBar_Meter = new Meter(25, () => "")
    const adrenaline1_Meter = new Meter(5, adrenalineCallback)
    const adrenaline2_Meter = new Meter(5, adrenalineCallback)
    const adrenaline3_Meter = new Meter(5, adrenalineCallback)
    const xpWhite_Meter = new Meter(5, xPGainCallback)
    const xpNotWhite_Meter = new Meter(5, xPGainCallback)
    const goodGreen_Meter = new Meter(5, goodEffectCallback)
    const goodNotGreen_Meter = new Meter(5, goodEffectCallback)
    const cardRed1_Meter = new Meter(5, playingCardsCallback)
    const cardBlack1_Meter = new Meter(5, playingCardsCallback)
    const cardRed2_Meter = new Meter(5, playingCardsCallback)
    const cardBlack2_Meter = new Meter(5, playingCardsCallback)
    const deathGrey_Meter = new Meter(5, deathCallback)
    const deathBlack_Meter = new Meter(5, deathCallback)
    const deathText_Meter = new Meter(5, deathCallback)
    const horseOrange_Meter = new Meter(5, horseCallback)
    const horseNotOrange_Meter = new Meter(5, horseCallback)
    //#endregion

    //#region Callbacks

    // -------------------------------------------------------------------------
    // Global state flags
    // -------------------------------------------------------------------------
    let gInGame = false
    let signUseGoing = false
    let toxicGoing = false
    let tookDamageOnGoing = false
    let adrenalineFullGoing = false
    let adrenalineOffGoing = false
    let xPGainOnGoing = false
    let goodEffectOnGoing = false
    let playingCardsOnGoing = false
    let deathOnGoing = false
    let horseOnGoing = false
    let tookDamageUntil = 0

    // -------------------------------------------------------------------------
    // Callbacks
    // -------------------------------------------------------------------------

    function inGameDetect() {
        if (inGame1_Meter.value >= .95 && inGame2_Meter.value >= .95 && inGame3_Meter.value > .33 && !gInGame) {
            gInGame = true
        } else if (inGame1_Meter.value < .1 || inGame2_Meter.value < .1 || inGame3_Meter.value < .1 && gInGame) {
            gInGame = false
        }
        // death evidence can settle before the HUD meters do, so re-check on HUD changes
        deathCallback()
    }

    function signUseCallback() {
        if (gInGame && (signBright_Meter.value >=.1 && signBright_Meter.value < .3) && signYellow_Meter.value < .1 && signYellowConfirm_Meter.value < .1) {
            if (!signUseGoing) {
                if (signUseOn) effects.push(new SignUse())
                signUseGoing = true
            }
        } else if (!gInGame || (gInGame && signBright_Meter.value >= .25 && signYellowConfirm_Meter.value >= .95)) {
            signUseGoing = false
        }
    }

    function toxicCallback() {
        if (toxicLength_Meter.value >= .33 && toxicHealth_Meter.value >= .95 && gInGame) {
            if (!toxicGoing) {
                if (toxicOn) effects.push(new Toxic())
                toxicGoing = true
            }
        } else if (!gInGame || (toxicHealth_Meter.value < .1 && gInGame)) {
            toxicGoing = false
        }
    }

    function tookDamageTurnOff() {
        tookDamageOnGoing = false
        tookDamageUntil = 0
    }

    function tookDamageCallback() {
        if (gInGame && healthLength_Meter.value >= .05 && (healthLength_Meter.decreased && healthLength_Meter.diff >= .05)) {
            if (!tookDamageOnGoing) {
                if (tookDamageOn) effects.push(new TookDamageOn())
                tookDamageOnGoing = true
            }
            tookDamageUntil = Date.now() + 1000
        } else if (false) {
            tookDamageTurnOff()
        }
    }

    function adrenalineCallback() {
        if (gInGame && adrenaline1_Meter.value >= .95 || adrenaline2_Meter.value >= .95 || adrenaline3_Meter.value >= .95) {
            if (!adrenalineFullGoing) {
                if (adrenalineOn) effects.push(new AdrenalineFull())
                adrenalineFullGoing = true
            }
            adrenalineOffGoing = false
        } else if (gInGame && adrenalineFullGoing && (adrenaline1_Meter.value < .1 || adrenaline2_Meter.value < .1 || adrenaline3_Meter.value < .1)) {
            // "used" only plays after a real Full, never while charging or when the HUD hides
            if (!adrenalineOffGoing) {
                if (adrenalineOn) effects.push(new AdrenalineOff())
                adrenalineOffGoing = true
            }
            adrenalineFullGoing = false
        }
    }

    function xPGainCallback() {
        if (xpWhite_Meter.value >= .95 && xpNotWhite_Meter.value < .1) {
            if (!xPGainOnGoing) {
                if (xPGainOn) effects.push(new XPGainOn())
                xPGainOnGoing = true
            }
        } else if (xpWhite_Meter.value < .1) {
            xPGainOnGoing = false
        }
    }

    function goodEffectCallback() {
        if (gInGame && goodGreen_Meter.value >= .95 && goodNotGreen_Meter.value < .1) {
            if (!goodEffectOnGoing) {
                if (goodEffectOn) effects.push(new GoodEffectOn())
                goodEffectOnGoing = true
            }
        } else if (!gInGame || (gInGame && goodGreen_Meter.value < .1)) {
            goodEffectOnGoing = false
        }
    }

    function playingCardsCallback() {
        if (!gInGame && cardRed1_Meter.value >= .95 && cardRed2_Meter.value >= .95 && cardBlack1_Meter.value >= .95 && cardBlack2_Meter.value >= .95) {
            if (!playingCardsOnGoing) {
                if (playingCardsOn) effects.push(new PlayingCardsOn())
                playingCardsOnGoing = true
            }
        } else if (gInGame || (cardRed1_Meter.value < .1 && cardRed2_Meter.value < .1)) {
            playingCardsOnGoing = false
        }
    }

    function deathCallback() {
        // HUD gone = inGame2/3 low; gInGame itself can stay true because inGame1 reads dark on the death screen
        var hudGone = inGame2_Meter.value < .1 && inGame3_Meter.value < .1
        if (hudGone && deathGrey_Meter.value >= .95 && deathBlack_Meter.value >= .95 && deathText_Meter.value >= .15) {
            if (!deathOnGoing) {
                if (deathOn) effects.push(new DeathOn())
                deathOnGoing = true
            }
        } else if (!hudGone || deathBlack_Meter.value < .1) {
            deathOnGoing = false
        }
    }

    function horseCallback() {
        if (gInGame && horseOrange_Meter.value >= .8 && horseNotOrange_Meter.value < .1) {
            if (!horseOnGoing) {
                if (horseOn) effects.push(new HorseOn())
                horseOnGoing = true
            }
        } else if (!gInGame || horseOrange_Meter.value < .1) {
            horseOnGoing = false
        }
    }

    function checkTimedTriggers() {
        var now = Date.now()
        if (tookDamageUntil && now >= tookDamageUntil) tookDamageTurnOff()
    }
    //#endregion

    //#region Background Modes
    // ═══════════════════════════════════════════════════════════
    // BACKGROUND SYSTEM
    // Eight modes selected by the backgroundMode control.
    // ═══════════════════════════════════════════════════════════
    let proBack = [0, 0, 0]
    function onbackColorChanged() {
        proBack = hexToHSL(backColor)
    }

    let audioEase = { sat: 0, lit: 0 }
    let gCycle = 0

    function updateAudioEase() {
        const targetDensity = engine.audio.density * 100
        audioEase.sat += (targetDensity - audioEase.sat) / 10
        audioEase.lit += (targetDensity - audioEase.lit) / 10
    }

    function getColorString(hue, sat, lit, alpha) {
        return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`
    }

    function updateColorCycle() {
        gCycle = (gCycle + 0.5) % 360
    }

    function backgroundHandler() {
        const alpha = ambienceAlpha / 100

        if (backgroundMode.includes('Color Cycle')) updateColorCycle()
        if (backgroundMode.includes('Audio'))       updateAudioEase()

        if (backgroundMode.includes('Ambience')) {
            if (backgroundMode === 'Ambience Audio Visualizer') {
                copyScreenAudio(alpha)
            } else {
                copyScreen(alpha)
            }
            return
        }

        const hue = proBack[0] + (backgroundMode.includes('Color Cycle') ? gCycle : 0)
        const sat = backgroundMode.includes('Audio') ? audioEase.sat * 0.33 + 66 : proBack[1]
        const lit = backgroundMode.includes('Audio') ? audioEase.lit * 0.9  + 10 : proBack[2]
        DrawRect(0, 0, 320, 200, getColorString(hue, sat, lit, alpha))
    }

    const ZONE_COLS   = 28
    const ZONE_ROWS   = 20
    const TOTAL_ZONES = ZONE_COLS * ZONE_ROWS

    function copyScreenAudio(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat       = new Int8Array(engine.zone.saturation)
        const hue       = new Int16Array(engine.zone.hue)
        const w = 320 / ZONE_COLS
        const h = 200 / ZONE_ROWS
        const satMultiplier = audioEase.sat / 200 + 0.5
        const litMultiplier = audioEase.lit / 100
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            hiddenCtx.fillStyle = getColorString(
                hue[iZone],
                sat[iZone] * satMultiplier,
                lightness[iZone] * litMultiplier,
                alpha
            )
            hiddenCtx.fillRect(col * w, row * h, w, h)
        }
    }

    function copyScreen(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat       = new Int8Array(engine.zone.saturation)
        const hue       = new Int16Array(engine.zone.hue)
        const w = 320 / ZONE_COLS
        const h = 200 / ZONE_ROWS
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const finalHue = backgroundMode === 'Custom Ambience'
                ? proBack[0]
                : hue[iZone] + (backgroundMode === 'Color Cycle Ambience' ? gCycle : 0)
            hiddenCtx.fillStyle = getColorString(finalHue, sat[iZone], lightness[iZone], alpha)
            hiddenCtx.fillRect(col * w, row * h, w, h)
        }
    }

    // Health bar is a HUD element drawn every frame, not a pooled effect
    function DrawHUD() {
        if (!healthBarOn) return
        if (gInGame) {
            DrawRect(healthBarX * 3.2, healthBarY * 2, healthBar_Meter.value * (healthBarWidth * 3.2), healthBarHeight * 2, 'hsla(0, 100%, 40%, 1)')
        } else if (adjToggle) {
            DrawRect(healthBarX * 3.2, healthBarY * 2, healthBarWidth * 3.2, healthBarHeight * 2, 'hsla(0, 100%, 40%, 1)')
        }
    }

    function DrawRect(x, y, w, h, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.fillRect(x, y, w, h)
    }

    function strokeRect(x, y, w, h, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.rect(x, y, w, h)
        hiddenCtx.stroke()
    }

    function DrawCircle(x, y, radius, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
        hiddenCtx.fill()
    }

    function DrawStroke(x, y, radius, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
        hiddenCtx.stroke()
    }

    function DrawLine(start, end, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.moveTo(start[0], start[1])
        hiddenCtx.lineTo(end[0], end[1])
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.stroke()
    }

    function DrawArc(x, y, start, end, radius, direction, color) {
        hiddenCtx.beginPath()
        hiddenCtx.arc(x, y, radius, start, end, direction)
        hiddenCtx.fillStyle = color
        hiddenCtx.fill()
    }

    function DrawEllipse(x, y, w, h, rotation, color) {
        hiddenCtx.beginPath()
        hiddenCtx.ellipse(x, y, w, h, rotation, 0, Math.PI * 2)
        hiddenCtx.fillStyle = color
        hiddenCtx.fill()
    }

    function DrawTriangle(x1, y1, x2, y2, x3, y3, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.moveTo(x1, y1)
        hiddenCtx.lineTo(x2, y2)
        hiddenCtx.lineTo(x3, y3)
        hiddenCtx.lineTo(x1, y1)
        hiddenCtx.fill()
    }

    function DrawPath(x, y, path, color, scaleX, scaleY) {
        hiddenCtx.fillStyle = color
        hiddenCtx.save()
        hiddenCtx.translate(x, y)
        hiddenCtx.scale(scaleX, scaleY)
        hiddenCtx.fill(new Path2D(path))
        hiddenCtx.restore()
    }

    function hexToRgb(hex) {
        var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex)
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : null
    }

    function hexToHSL(hex) {
        const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || []
        const rgb = [r, g, b].map(x => parseInt(x, 16) / 255)
        const max = Math.max(...rgb)
        const min = Math.min(...rgb)
        const l = (max + min) / 2
        if (max === min) return [0, 0, Math.round(l * 100)]
        const d = max - min
        const s = l > 0.5 ? d / (2 - max - min) : d / (max + min)
        let h
        const [nr, ng, nb] = rgb
        if      (max === nr) h = (ng - nb) / d + (ng < nb ? 6 : 0)
        else if (max === ng) h = (nb - nr) / d + 2
        else                 h = (nr - ng) / d + 4
        return [Math.round(h * 60), Math.round(s * 100), Math.round(l * 100)]
    }

    // Meter(size, callback): frame-stabilizing debouncer for vision signals.
    function Meter(size, callback) {
        this.size = size
        this.value = 0
        this.diff = 0
        this.increased = false
        this.decreased = false
        var values = []
        this.setValue = function (updatedValue) {
            values.push(updatedValue)
            if (values.length > this.size) values.shift()
            for (var i = 0; i < values.length - 1; i++) {
                if (values[i] !== values[i + 1]) return
            }
            if (this.value !== values[0]) {
                this.diff = Math.abs(this.value - values[0])
                this.increased = this.value < values[0]
                this.decreased = this.value > values[0]
                this.value = values[0]
                callback()
            }
        }
    }

    // SignUse: Turns on Sign Use effect
    function SignUse() {
        this.frame = 0
        this.lifetime = 1
        this.cols = 4
        this.rows = 3
        this.triW = 106.4
        this.triH = 106.4 * Math.sqrt(3) / 2
        this.bgMax = 0.33
        this.duration = 120
        this.fade = 60
        this.pulseSpeed = 0.175

        this.draw = function () {
            this.frame++

            // hue tracks the live sign colour read from the signColor meter
            this.signColor = gSignColor.value
            this.hue = this.signColor[0]

            if (this.frame >= this.duration) {
                this.lifetime = 0
                return
            }

            var env
            if (this.frame <= this.fade) {
                env = this.frame / this.fade
            } else {
                env = (this.duration - this.frame) / this.fade
            }
            env = Math.max(0, Math.min(1, env))

            DrawRect(0, 0, 320, 200, 'hsla(' + this.hue + ', 100%, 18%, ' + (this.bgMax * env) + ')')

            var w = this.triW
            var h = this.triH
            var t = this.frame * this.pulseSpeed

            for (var r = 0; r < this.rows; r++) {
                for (var c = -1; c < this.cols; c++) {
                    var x = c * w
                    var y = r * h

                    if (c >= 0) {
                        var pulseUp = 0.5 + 0.5 * Math.sin(t + r * 1.3 + c * 0.9)
                        hiddenCtx.fillStyle = 'hsla(' + this.hue + ', 100%, 50%, ' + (pulseUp * 0.6 * env) + ')'
                        hiddenCtx.beginPath()
                        hiddenCtx.moveTo(x, y + h)
                        hiddenCtx.lineTo(x + w, y + h)
                        hiddenCtx.lineTo(x + w / 2, y)
                        hiddenCtx.closePath()
                        hiddenCtx.fill()
                    }

                    var pulseDown = 0.5 + 0.5 * Math.sin(t + 2.1 + r * 1.1 + c * 1.7)
                    hiddenCtx.fillStyle = 'hsla(' + this.hue + ', 100%, 45%, ' + (pulseDown * 0.6 * env) + ')'
                    hiddenCtx.beginPath()
                    hiddenCtx.moveTo(x + w / 2, y)
                    hiddenCtx.lineTo(x + w * 1.5, y)
                    hiddenCtx.lineTo(x + w, y + h)
                    hiddenCtx.closePath()
                    hiddenCtx.fill()
                }
            }
        }
    }

    // Toxic: Turn on Toxic effect
    function Toxic() {
        this.lifetime = 1
        this.bubbles = []
        this.particles = []
        this.spawnTimer = 0
        this.maxBubbles = 11
        this.maxParticles = 78
        this.bgAlpha = 0
        this.bgMax = 0.33
        this.bgFadeIn = 60

        this.spawnBubble = function () {
            var r = 22.5 + Math.random() * 17.5
            var x = r + Math.random() * (320 - r * 2)
            this.bubbles.push({
                x: x,
                y: 200 + r,
                r: r,
                vy: 1.05 + Math.random() * 1.2,
                phase: Math.random() * Math.PI * 2,
                sway: 0.2 + Math.random() * 0.4,
                baseX: x,
                age: 0,
                popChance: (0.002 + Math.random() * 0.003) * 1.33
            })
        }

        this.pop = function (b) {
            var n = 26
            var overflow = this.particles.length + n - this.maxParticles
            if (overflow > 0) {
                this.particles.splice(0, overflow)
            }
            var golden = 2.39996
            for (var i = 0; i < n; i++) {
                var f = (i + 0.5) / n
                var d = b.r * Math.sqrt(f)
                var a = i * golden
                var centre = 1 - d / b.r
                var size = b.r * (0.2 + centre * 0.13) * (0.9 + Math.random() * 0.2)
                var speed = 0.3 + (d / b.r) * 1.1
                this.particles.push({
                    x: b.x + Math.cos(a) * d,
                    y: b.y + Math.sin(a) * d,
                    vx: Math.cos(a) * speed,
                    vy: Math.sin(a) * speed,
                    size: size,
                    life: 0,
                    maxLife: 35 + Math.random() * 20,
                    hue: 28 + Math.random() * 22
                })
            }
        }

        this.draw = function () {
            // dark green wash fades in over 1s behind the bubbles, and fades back
            // out on the same ramp once the toxic state clears
            if (toxicGoing) {
                this.bgAlpha = Math.min(this.bgMax, this.bgAlpha + this.bgMax / this.bgFadeIn)
            } else {
                this.bgAlpha = Math.max(0, this.bgAlpha - this.bgMax / this.bgFadeIn)
            }
            if (this.bgAlpha > 0) {
                DrawRect(0, 0, 320, 200, 'hsla(125, 75%, 10%, ' + this.bgAlpha + ')')
            }

            if (toxicGoing) {
                this.spawnTimer--
                if (this.spawnTimer <= 0 && this.bubbles.length < this.maxBubbles) {
                    this.spawnBubble()
                    this.spawnTimer = (25 + Math.random() * 45) / 1.6
                }
            }

            for (var i = this.bubbles.length - 1; i >= 0; i--) {
                var b = this.bubbles[i]
                b.age++
                b.y -= b.vy
                b.x = b.baseX + Math.sin(b.age * 0.09 + b.phase) * b.sway * 30

                if (b.y < -b.r) {
                    this.bubbles.splice(i, 1)
                    continue
                }
                if (b.age > 20 && b.y < 200 && Math.random() < b.popChance) {
                    this.pop(b)
                    this.bubbles.splice(i, 1)
                    continue
                }

                DrawCircle(b.x, b.y, b.r, 'hsla(46, 95%, 32%, 0.6)')
                DrawStroke(b.x, b.y, b.r, 'hsla(28, 100%, 50%, 1)', 5)
            }

            for (var j = this.particles.length - 1; j >= 0; j--) {
                var p = this.particles[j]
                p.life++
                if (p.life >= p.maxLife) {
                    this.particles.splice(j, 1)
                    continue
                }
                p.x += p.vx
                p.y += p.vy
                p.vx *= 0.97
                p.vy *= 0.97
                var t = p.life / p.maxLife
                DrawCircle(p.x, p.y, p.size * (1 - t * 0.3), 'hsla(' + p.hue + ', 100%, 50%, ' + (1 - t) + ')')
            }

            // same cancel condition as before, held open until the wash has faded
            if (!toxicGoing && this.bubbles.length === 0 && this.particles.length === 0 && this.bgAlpha <= 0) {
                this.lifetime = 0
            }
        }
    }

    // TookDamageOn: Turns on the Took Damage effect.
    function TookDamageOn() {
        this.frame = 0
        this.angle = Math.random() * Math.PI * 2
        this.startX = -300
        this.fly = 18
        this.grow = 4
        this.fadeTime = 120
        this.parts = []

        for (var i = 0; i < 40; i++) {
            var big = i < 8
            this.parts.push({
                tx: -150 + Math.random() * 190,
                ty: (Math.random() + Math.random() + Math.random() - 1.5) * 80,
                r: (big ? 14 + Math.random() * 14 : 4 + Math.random() * 9) * 1.5,
                size: 2 + Math.random() * 2.5
            })
        }

        this.toScreen = function (x, y) {
            var c = Math.cos(this.angle)
            var s = Math.sin(this.angle)
            return [160 + x * c - y * s, 100 + x * s + y * c]
        }

        this.draw = function () {
            var f = this.frame
            var landed = this.fly
            var total = landed + this.grow + this.fadeTime
            var alpha = 1
            var creep = 1
            var g = 0
            var flying = f < landed

            if (!flying) {
                var s = f - landed
                g = Math.min(1, s / this.grow)
                g = 1 - (1 - g) * (1 - g)
                alpha = 0.95
                if (s > this.grow) {
                    var q = (s - this.grow) / this.fadeTime
                    if (q > 1) q = 1
                    alpha = 0.95 * (1 - q)
                    creep = 1 + q * 0.12
                }
            }

            hiddenCtx.beginPath()

            for (var i = 0; i < this.parts.length; i++) {
                var p = this.parts[i]
                var pos
                var rad

                if (flying) {
                    var k = f / landed
                    var x = this.startX + (p.tx - this.startX) * k * k
                    pos = this.toScreen(x, p.ty)
                    rad = p.size
                } else {
                    pos = this.toScreen(p.tx, p.ty)
                    rad = (p.size + (p.r - p.size) * g) * creep
                }

                hiddenCtx.moveTo(pos[0] + rad, pos[1])
                hiddenCtx.arc(pos[0], pos[1], rad, 0, Math.PI * 2)
            }

            hiddenCtx.fillStyle = 'hsla(0, 90%, 30%, ' + alpha + ')'
            hiddenCtx.fill()

            this.frame++
            if (this.frame >= total) {
                this.lifetime = 0
            }
        }
    }

    // AdrenalineFull: Turns on the Adrenaline Full effect
    function AdrenalineFull() {
        this.frame = 0
        this.lifetime = 1
        this.fadeIn = 80
        this.fadeOut = 160
        this.toothWidth = 32
        this.toothCount = 10
        this.toothHeight = 90
        this.gumHeight = 60
        this.gnashSpeed = 0.09375
        this.travel = 120

        this.draw = function () {
            var f = this.frame
            var env = 0

            if (f < this.fadeIn) {
                env = f / this.fadeIn
            } else {
                env = 1 - (f - this.fadeIn) / this.fadeOut
            }

            if (env <= 0 && f > 0) {
                this.lifetime = 0
                return
            }
            if (env < 0) env = 0
            if (env > 1) env = 1

            // black background, 50% opacity at its peak
            DrawRect(0, 0, 320, 200, 'hsla(0, 0%, 0%, ' + (0.5 * env) + ')')

            // jaws oscillate up and down; teeth keep a fixed size
            // close is held at 1 briefly so the jaws stay shut for a moment
            var close = Math.min(1, Math.abs(Math.sin(f * this.gnashSpeed)) * 1.1)
            var th = this.toothHeight
            var gh = this.gumHeight
            var w = this.toothWidth
            var open = 1 - close

            // closed position is unchanged; the open position now swings three times as far
            var topBase = 100 - th / 2 - this.travel * open
            var bottomBase = 100 + th / 2 - 1 + this.travel * open
            var i, x0
            var ctx = hiddenCtx

            // teeth read lighter and yellower than the gums so they stand off the jaw
            var gumColor = 'hsla(0, 80%, 30%, ' + env + ')'
            var toothColor = 'hsla(14, 55%, 62%, ' + env + ')'
            var root = w / 2

            // gums
            DrawRect(0, topBase - gh, 320, gh, gumColor)
            DrawRect(0, bottomBase, 320, gh + 60, gumColor)

            ctx.fillStyle = toothColor

            // bottom jaw teeth, pointing up; base bulges into the gum as a rounded root
            ctx.beginPath()
            for (i = 0; i < this.toothCount; i++) {
                x0 = i * w
                ctx.moveTo(x0, bottomBase)
                ctx.lineTo(x0 + w / 2, bottomBase - th)
                ctx.lineTo(x0 + w, bottomBase)
                ctx.arc(x0 + w / 2, bottomBase, root, 0, Math.PI, false)
                ctx.closePath()
            }
            ctx.fill()

            // top jaw teeth, pointing down, offset by half a tooth so they interlock
            ctx.beginPath()
            for (i = 0; i <= this.toothCount; i++) {
                x0 = i * w - w / 2
                ctx.moveTo(x0, topBase)
                ctx.lineTo(x0 + w / 2, topBase + th)
                ctx.lineTo(x0 + w, topBase)
                ctx.arc(x0 + w / 2, topBase, root, 0, Math.PI, true)
                ctx.closePath()
            }
            ctx.fill()

            this.frame++
            if (this.frame >= this.fadeIn + this.fadeOut) {
                this.lifetime = 0
            }
        }
    }

    // AdrenalineOff: Turns on the Adrenaline Used effect
    function AdrenalineOff() {
        this.lifetime = 1
        this.frame = 0
        this.fadeInFrames = 30
        this.fadeOutFrames = 180
        this.maxAlpha = 0.33
        this.bump = 0
        this.slashes = []

        this.makeSlash = function (x1, y1, x2, y2, start) {
            var drips = []
            for (var i = 0; i < 7; i++) {
                drips.push({
                    t: 0.24 + (i / 6) * 0.52 + (Math.random() - 0.5) * 0.04,
                    max: 120 + Math.random() * 180,
                    speed: 0.8 + Math.random() * 1.2,
                    w: 9.8 + Math.random() * 9.8
                })
            }
            return { x1: x1, y1: y1, x2: x2, y2: y2, start: start, drips: drips, bumped: false }
        }

        this.slashes.push(this.makeSlash(-60, -78, 380, 278, 0))
        this.slashes.push(this.makeSlash(380, -78, -60, 278, 14))

        this.draw = function () {
            var f = this.frame
            var total = this.fadeInFrames + this.fadeOutFrames

            if (f >= total) {
                this.lifetime = 0
                return
            }

            var base
            var fade
            if (f < this.fadeInFrames) {
                base = this.maxAlpha * (f / this.fadeInFrames)
                fade = 1
            } else {
                fade = 1 - (f - this.fadeInFrames) / this.fadeOutFrames
                base = this.maxAlpha * fade
            }

            this.bump *= 0.86
            for (var n = 0; n < this.slashes.length; n++) {
                var sl = this.slashes[n]
                if (!sl.bumped && f >= sl.start) {
                    sl.bumped = true
                    this.bump = 0.3
                }
            }

            var alpha = Math.min(1, base + this.bump)
            DrawRect(0, 0, 320, 200, 'hsla(0, 85%, 15%, ' + alpha + ')')

            for (var i = 0; i < this.slashes.length; i++) {
                var s = this.slashes[i]
                var age = f - s.start
                if (age < 0) continue

                var p = Math.min(1, age / 6)
                var dx = s.x2 - s.x1
                var dy = s.y2 - s.y1
                var hx = s.x1 + dx * p
                var hy = s.y1 + dy * p

                var hue, light
                if (age < 8) {
                    hue = 55
                    light = 60
                } else if (age < 16) {
                    var k = (age - 8) / 8
                    hue = 55 * (1 - k)
                    light = 60 - 15 * k
                } else {
                    hue = 0
                    light = 40
                }

                var inner = 'hsla(' + hue + ', 100%, ' + light + '%, ' + fade + ')'

                DrawLine([s.x1, s.y1], [hx, hy], 'hsla(0, 90%, 25%, ' + (fade * 0.85) + ')', 36)
                DrawLine([s.x1, s.y1], [hx, hy], inner, 16)

                for (var d = 0; d < s.drips.length; d++) {
                    var dr = s.drips[d]
                    if (dr.t > p) continue
                    var len = Math.min(dr.max, Math.max(0, age - dr.t * 6) * dr.speed)
                    var px = s.x1 + dx * dr.t
                    var py = s.y1 + dy * dr.t
                    var w = dr.w * (0.6 + 0.4 * Math.min(1, len / 50))
                    DrawLine([px, py], [px, py + len], inner, w)
                    DrawCircle(px, py + len, w * 0.65, inner)
                }
            }

            this.frame++
        }
    }

    // XPGainOn: Turn on XP Gain effect
    function XPGainOn() {
        this.frame = 0
        this.fadeFrames = 45
        this.totalFrames = 90
        this.maxAlpha = 0.6
        this.arrowScale = 1.62
        this.arrowHeight = 120 * this.arrowScale
        this.ringRadius = 135
        this.ringStroke = 20
        this.centerFrame = this.totalFrames * (100 + this.arrowHeight / 2) / (200 + this.arrowHeight)
        this.lifetime = 1

        this.draw = function () {
            var alpha
            if (this.frame < this.fadeFrames) {
                alpha = this.maxAlpha * (this.frame / this.fadeFrames)
            } else {
                alpha = this.maxAlpha * (1 - (this.frame - this.fadeFrames) / this.fadeFrames)
            }
            if (alpha < 0) {
                alpha = 0
            }

            DrawRect(0, 0, 320, 200, 'hsla(25, 100%, 12%, ' + alpha + ')')

            var r = this.ringRadius * (this.frame / this.centerFrame)
            if (r > 0) {
                DrawStroke(160, 100, r, 'hsla(0, 0%, 100%, 1)', this.ringStroke)
            }

            var s = this.arrowScale
            var t = this.frame / this.totalFrames
            var top = 200 - t * (200 + this.arrowHeight)
            var cx = 160

            hiddenCtx.save()
            hiddenCtx.fillStyle = 'hsla(0, 0%, 100%, 1)'
            hiddenCtx.beginPath()
            hiddenCtx.moveTo(cx, top)
            hiddenCtx.lineTo(cx + 55 * s, top + 65 * s)
            hiddenCtx.lineTo(cx + 22 * s, top + 65 * s)
            hiddenCtx.lineTo(cx + 22 * s, top + this.arrowHeight)
            hiddenCtx.lineTo(cx - 22 * s, top + this.arrowHeight)
            hiddenCtx.lineTo(cx - 22 * s, top + 65 * s)
            hiddenCtx.lineTo(cx - 55 * s, top + 65 * s)
            hiddenCtx.closePath()
            hiddenCtx.fill()
            hiddenCtx.restore()

            this.frame++
            if (this.frame >= this.totalFrames) {
                this.lifetime = 0
            }
        }
    }

    // GoodEffectOn: Turn on Good Effect effect
    function GoodEffectOn() {
        this.frame = 0
        this.fadeInFrames = 120
        this.fadeOutFrames = 60
        this.totalFrames = 180
        this.lifetime = this.totalFrames

        this.draw = function () {
            var f = this.frame
            var t = f / this.totalFrames
            var env

            if (f < this.fadeInFrames) {
                env = f / this.fadeInFrames
            } else {
                env = 1 - (f - this.fadeInFrames) / this.fadeOutFrames
            }
            if (env < 0) env = 0
            if (env > 1) env = 1

            // background, 0.6 opacity at peak
            DrawRect(0, 0, 320, 200, 'hsla(130, 60%, 18%, ' + (0.6 * env) + ')')

            // black circle, shrinks from past the screen edges to nothing
            var blackRadius = 200 * (1 - t)
            if (blackRadius > 0) {
                DrawCircle(160, 100, blackRadius, 'hsla(0, 0%, 0%, ' + env + ')')
            }

            // green circle, grows to 50% of screen width
            var greenRadius = 160 * t
            if (greenRadius > 0) {
                DrawCircle(160, 100, greenRadius, 'hsla(130, 90%, 45%, ' + (0.6 * env) + ')')
            }

            this.frame++
            if (this.frame >= this.totalFrames) {
                this.lifetime = 0
            }
        }
    }

    // PlayingCardsOn: candle-lit Gwent table. Cards are dealt onto the siege /
    // ranged / melee rows, flip face-up with a faction-colored frame, settle
    // with a tiny bounce and a warm ember pulse, then slip away. Stays up
    // until playingCardsOnGoing clears, then everything fades out.
    function PlayingCardsOn() {
        this.lifetime = 1
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.cards = []
        this.rows = 2
        this.perRow = 3
        this.slots = []
        this.spawnTimer = 30
        this.cardW = 50
        this.cardH = 70
        // faction frames: neutral brown, Northern Realms blue, Monsters red,
        // Scoia'tael green, Nilfgaard black, Skellige purple
        this.factions = [
            { h: 30, s: 40, l: 28 },
            { h: 215, s: 55, l: 32 },
            { h: 355, s: 60, l: 30 },
            { h: 125, s: 45, l: 26 },
            { h: 0, s: 0, l: 12 },
            { h: 275, s: 40, l: 30 }
        ]
        for (var i = 0; i < this.rows * this.perRow; i++) {
            this.slots.push(false)
        }

        this.spawnCard = function () {
            var free = []
            for (var i = 0; i < this.slots.length; i++) {
                if (!this.slots[i]) free.push(i)
            }
            if (free.length === 0) return
            var slot = free[Math.floor(Math.random() * free.length)]
            var row = Math.floor(slot / this.perRow)
            var col = slot % this.perRow
            this.slots[slot] = true
            this.cards.push({
                slot: slot,
                t: 0,
                tx: 80 + col * 80 + (Math.random() - 0.5) * 8,
                ty: 52 + row * 96,
                tr: (Math.random() - 0.5) * 0.12,
                sx: 160 + (Math.random() - 0.5) * 40,
                sy: -70,
                hold: 200 + Math.floor(Math.random() * 160),
                gold: Math.random() < 0.2,
                faction: this.factions[Math.floor(Math.random() * this.factions.length)],
                x: 160, y: -70, rot: 0, flip: 0, glow: 0, out: 0
            })
        }

        this.drawCard = function (c, a) {
            var w = this.cardW, h = this.cardH
            // flip: width squeezes to a line at the half-way point and back
            var sx = Math.abs(Math.cos(c.flip * Math.PI))
            var faceUp = c.flip >= 0.5
            hiddenCtx.save()
            hiddenCtx.globalAlpha = a
            hiddenCtx.translate(c.x, c.y)
            hiddenCtx.rotate(c.rot)
            hiddenCtx.scale(Math.max(sx, 0.02), 1)
            if (c.glow > 0) {
                hiddenCtx.shadowColor = 'hsla(35, 90%, 55%, ' + c.glow + ')'
                hiddenCtx.shadowBlur = 14
            }
            if (faceUp) {
                var f = c.faction
                hiddenCtx.fillStyle = 'hsla(35, 25%, 14%, 1)'
                hiddenCtx.fillRect(-w / 2, -h / 2, w, h)
                hiddenCtx.strokeStyle = c.gold ? 'hsla(45, 80%, 50%, 1)' : 'hsla(' + f.h + ', ' + f.s + '%, ' + f.l + '%, 1)'
                hiddenCtx.lineWidth = 3
                hiddenCtx.strokeRect(-w / 2 + 1.5, -h / 2 + 1.5, w - 3, h - 3)
                // portrait block + strength pip
                hiddenCtx.fillStyle = 'hsla(' + f.h + ', ' + Math.round(f.s * 0.6) + '%, ' + (f.l * 0.6) + '%, 1)'
                hiddenCtx.fillRect(-w / 2 + 7, -h / 2 + 16, w - 14, h - 28)
                hiddenCtx.fillStyle = c.gold ? 'hsla(45, 80%, 50%, 1)' : 'hsla(40, 20%, 60%, 1)'
                hiddenCtx.fillRect(-w / 2 + 5, -h / 2 + 5, 8, 8)
            } else {
                // card back: dark leather with a thin brass inset
                hiddenCtx.fillStyle = 'hsla(25, 35%, 12%, 1)'
                hiddenCtx.fillRect(-w / 2, -h / 2, w, h)
                hiddenCtx.strokeStyle = 'hsla(40, 45%, 30%, 1)'
                hiddenCtx.lineWidth = 1.5
                hiddenCtx.strokeRect(-w / 2 + 3, -h / 2 + 3, w - 6, h - 6)
            }
            hiddenCtx.restore()
        }

        this.draw = function () {
            this.frame++

            if (!playingCardsOnGoing) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 1 / 90
                if (this.alpha <= 0) {
                    this.lifetime = 0
                    return
                }
            } else if (this.alpha < 1) {
                this.alpha = Math.min(1, this.alpha + 1 / 120)
            }
            var a = this.alpha

            // tavern table: near-black wood with slow candle flicker
            var flick = 0.5 + 0.5 * Math.sin(this.frame * 0.05) * Math.sin(this.frame * 0.013 + 1.7)
            DrawRect(0, 0, 320, 200, 'hsla(25, 40%, 4%, ' + a + ')')
            var g = hiddenCtx.createRadialGradient(160, 100, 10, 160, 100, 190)
            g.addColorStop(0, 'hsla(32, 85%, 30%, ' + (a * (0.16 + 0.07 * flick)) + ')')
            g.addColorStop(1, 'hsla(25, 60%, 8%, 0)')
            hiddenCtx.fillStyle = g
            hiddenCtx.fillRect(0, 0, 320, 200)

            // faint row lanes (siege / ranged / melee)
            for (var r = 0; r < this.rows; r++) {
                DrawRect(20, 52 + r * 96 + this.cardH / 2 + 5, 280, 1, 'hsla(40, 40%, 30%, ' + (a * 0.25) + ')')
            }

            if (!this.fadingOut) {
                this.spawnTimer--
                if (this.spawnTimer <= 0) {
                    this.spawnCard()
                    this.spawnTimer = 75 + Math.floor(Math.random() * 40)
                }
            }

            for (var i = this.cards.length - 1; i >= 0; i--) {
                var c = this.cards[i]
                c.t++
                if (c.t <= 45) {
                    // dealt in with ease-out, spinning flat
                    var p = c.t / 45
                    var e = 1 - Math.pow(1 - p, 3)
                    c.x = c.sx + (c.tx - c.sx) * e
                    c.y = c.sy + (c.ty - c.sy) * e
                    c.rot = (1 - e) * 0.5 + c.tr * e
                } else {
                    c.x = c.tx
                    c.rot = c.tr
                    // landing bounce
                    var b = c.t - 45
                    c.y = c.ty - (b < 14 ? Math.sin(b / 14 * Math.PI) * 3 : 0)
                    // flip face-up shortly after landing
                    if (b > 10) c.flip = Math.min(1, (b - 10) / 24)
                    // ember pulse once it turns over
                    if (b > 34) c.glow = Math.max(0, 0.8 - (b - 34) / 50)
                }
                if (c.t > 45 + c.hold) {
                    c.out += 1 / 50
                    c.y -= 0.15
                    if (c.out >= 1) {
                        this.slots[c.slot] = false
                        this.cards.splice(i, 1)
                    }
                }
            }

            this.cards.sort(function (x, y) { return x.ty - y.ty })
            for (var j = 0; j < this.cards.length; j++) {
                var cd = this.cards[j]
                this.drawCard(cd, a * (1 - cd.out) * 0.85)
            }
        }
    }

    // DeathOn: DeathOn
    function DeathOn() {
        this.frame = 0
        this.cancelled = false
        this.bgAlpha = 0
        this.skullOut = 0
        this.bgFadeIn = 60
        this.skullTime = 600
        this.skullFade = 90
        this.bgFadeOut = 60
        this.size = 65.55
        this.cols = 7
        this.rows = 4
        this.pitchX = 53
        this.pitchY = 49.368
        this.spawned = 0
        this.heights = []
        this.skulls = []
        this.colorTime = 300
        this.capacity = 0

        this.rowsFor = function (col) {
            return col === this.cols - 1 ? this.rows / 2 : this.rows
        }

        for (var i = 0; i < this.cols; i++) {
            this.heights.push(0)
            this.capacity += this.rowsFor(i)
        }

        this.spawn = function () {
            var open = []
            for (var i = 0; i < this.cols; i++) {
                if (this.heights[i] < this.rowsFor(i)) {
                    open.push(i)
                }
            }
            if (open.length === 0) {
                return
            }
            var col = open[Math.floor(Math.random() * open.length)]
            var edge = col === this.cols - 1
            var row = this.heights[col] * (edge ? 2 : 1)
            var odd = row % 2 === 1
            this.heights[col] += 1
            this.spawned += 1
            this.skulls.push({
                x: col * this.pitchX + (odd ? this.pitchX / 2 : 0),
                y: -this.size,
                vy: 1 + Math.random(),
                targetY: 200 - 30.4 - row * this.pitchY,
                flip: odd,
                landed: false,
                t: 0
            })
        }

        this.skullColor = function (t, alpha) {
            var p = Math.min(t / this.colorTime, 1)
            var s, l
            if (p < 1 / 3) {
                var a = p * 3
                s = 0 + 90 * a
                l = 60 + (50 - 60) * a
            } else if (p < 2 / 3) {
                var b = (p - 1 / 3) * 3
                s = 90
                l = 50 + (25 - 50) * b
            } else {
                var c = (p - 2 / 3) * 3
                s = 90 - 90 * c
                l = 25 + (2 - 25) * c
            }
            return 'hsla(0, ' + s.toFixed(1) + '%, ' + l.toFixed(1) + '%, ' + alpha.toFixed(3) + ')'
        }

        this.drawSkull = function (cx, cy, s, color, flip, alpha) {
            var c = hiddenCtx
            var TAU = Math.PI * 2
            var r, x, y
            c.save()
            if (flip) {
                c.translate(cx, cy - s * 0.01)
                c.rotate(Math.PI)
                c.translate(-cx, -(cy - s * 0.01))
            }
            c.fillStyle = color
            c.beginPath()

            // round head (clockwise)
            r = s * 0.36
            x = cx
            y = cy - s * 0.1
            c.moveTo(x + r, y)
            c.arc(x, y, r, 0, TAU, false)

            // two round cheekbones (clockwise)
            r = s * 0.14
            y = cy + s * 0.14
            x = cx - s * 0.2
            c.moveTo(x + r, y)
            c.arc(x, y, r, 0, TAU, false)
            x = cx + s * 0.2
            c.moveTo(x + r, y)
            c.arc(x, y, r, 0, TAU, false)

            // upper teeth rectangle (clockwise)
            c.moveTo(cx - s * 0.18, cy + s * 0.2)
            c.lineTo(cx + s * 0.18, cy + s * 0.2)
            c.lineTo(cx + s * 0.18, cy + s * 0.44)
            c.lineTo(cx - s * 0.18, cy + s * 0.44)
            c.closePath()

            // tooth gaps (counter-clockwise holes)
            var gw = s * 0.03
            for (var g = -1; g <= 1; g++) {
                var gx = cx + g * s * 0.09 - gw / 2
                c.moveTo(gx, cy + s * 0.31)
                c.lineTo(gx, cy + s * 0.42)
                c.lineTo(gx + gw, cy + s * 0.42)
                c.lineTo(gx + gw, cy + s * 0.31)
                c.closePath()
            }

            c.fill()

            // small glowing red eyes
            var pulse = 0.5 + 0.5 * Math.sin(this.frame * 0.1 + cx * 0.05)
            c.shadowColor = 'hsla(0, 100%, 50%, ' + alpha.toFixed(3) + ')'
            c.shadowBlur = s * 0.12 + s * 0.08 * pulse
            c.fillStyle = 'hsla(0, 100%, ' + (52 + 10 * pulse).toFixed(1) + '%, ' + alpha.toFixed(3) + ')'
            c.beginPath()
            r = s * 0.06
            y = cy - s * 0.1 + s * 0.192
            x = cx - s * 0.175
            c.moveTo(x + r, y)
            c.arc(x, y, r, 0, TAU, false)
            x = cx + s * 0.175
            c.moveTo(x + r, y)
            c.arc(x, y, r, 0, TAU, false)
            c.fill()

            c.restore()
        }

        // Timeline, in frames at 60fps:
        //   0-60      black fades in, nothing else on screen
        //   60-570    skulls drop, land, and run their white-to-black colour shift
        //   570-660   skulls fade out on a deadline, so they always clear in time
        //   660-720   black fades out
        // The existing cancel still applies: deathOnGoing going false starts the
        // skull fade early, and the black follows it out.
        this.draw = function () {
            this.frame++

            var fadeStart = this.bgFadeIn + this.skullTime - this.skullFade

            if (!deathOnGoing) {
                this.cancelled = true
            }

            // skulls fade on whichever comes first, the deadline or a cancel
            if (this.cancelled || this.frame > fadeStart) {
                this.skullOut++
            }
            var alpha = Math.max(0, 1 - this.skullOut / this.skullFade)

            // black holds behind the skulls, then clears once they are gone
            if (alpha <= 0) {
                this.bgAlpha = Math.max(0, this.bgAlpha - 1 / this.bgFadeOut)
            } else if (!this.cancelled) {
                this.bgAlpha = Math.min(1, this.bgAlpha + 1 / this.bgFadeIn)
            }
            DrawRect(0, 0, 320, 200, 'hsla(0, 0%, 0%, ' + this.bgAlpha + ')')

            if (alpha <= 0) {
                if (this.bgAlpha <= 0) {
                    this.lifetime = 0
                }
                return
            }

            // nothing drops until the backdrop is fully black
            if (this.bgAlpha < 1) {
                return
            }

            if (!this.cancelled && this.spawned < this.capacity && Math.random() < 0.15) {
                this.spawn()
            }

            for (var i = 0; i < this.skulls.length; i++) {
                var k = this.skulls[i]
                if (!k.landed) {
                    k.vy += 0.25
                    k.y += k.vy
                    if (k.y >= k.targetY) {
                        k.y = k.targetY
                        k.landed = true
                    }
                } else if (k.t < this.colorTime) {
                    k.t++
                }
                this.drawSkull(k.x, k.y, this.size, this.skullColor(k.landed ? k.t : 0, alpha), k.flip, alpha)
            }
        }
    }

    // HorseOn: HorseOn
    function HorseOn() {
        this.frame = 0
        this.alpha = 0
        this.lifetime = 1
        this.rows = 4
        this.pitch = 112
        this.speed = 4.8
        this.opacity = 0.5
        this.scale = 1.25

        this.rot = function (px, py, ang) {
            var dx = px + 22
            var c = Math.cos(ang)
            var s = Math.sin(ang)
            return [-22 + dx * c - py * s, dx * s + py * c]
        }

        this.drawFish = function (x, y, white, a, phase) {
            var body = white ? 'hsla(0, 0%, 96%, ' + a + ')' : 'hsla(0, 0%, 4%, ' + a + ')'
            var eye = white ? 'hsla(0, 0%, 4%, ' + a + ')' : 'hsla(0, 0%, 96%, ' + a + ')'
            var ang = Math.sin(this.frame * 0.3 + phase) * 0.2
            var t1 = this.rot(-45, -20, ang)
            var t2 = this.rot(-36, 0, ang)
            var t3 = this.rot(-45, 20, ang)
            hiddenCtx.save()
            hiddenCtx.translate(x, y)
            hiddenCtx.scale(this.scale, this.scale)
            hiddenCtx.beginPath()
            hiddenCtx.moveTo(45, 0)
            hiddenCtx.bezierCurveTo(25, -26, -5, -22, -22, -5)
            hiddenCtx.lineTo(t1[0], t1[1])
            hiddenCtx.quadraticCurveTo(t2[0], t2[1], t3[0], t3[1])
            hiddenCtx.lineTo(-22, 5)
            hiddenCtx.bezierCurveTo(-5, 22, 25, 26, 45, 0)
            hiddenCtx.closePath()
            hiddenCtx.fillStyle = body
            hiddenCtx.fill()
            hiddenCtx.restore()
            DrawCircle(x + 27 * this.scale, y - 4 * this.scale, 3.5 * this.scale, eye)
        }

        this.draw = function () {
            this.frame++

            if (horseOnGoing) {
                this.alpha = Math.min(1, this.alpha + 1 / 60)
            } else {
                this.alpha -= 1 / 60
                if (this.alpha <= 0) {
                    this.lifetime = 0
                    return
                }
            }

            var a = this.alpha * this.opacity
            var total = this.frame * this.speed
            var k = Math.floor(total / this.pitch)
            var s = total - k * this.pitch
            var rowH = 200 / this.rows

            for (var r = 0; r < this.rows; r++) {
                var y = rowH * (r + 0.5)
                var shift = r % 2 === 0 ? 0 : this.pitch / 2
                for (var i = -1; i <= 3; i++) {
                    var x = i * this.pitch + shift + s
                    var white = (((i - k + r) % 2) + 2) % 2 === 0
                    var phase = (i - k) * 1.7 + r * 2.3
                    this.drawFish(x, y, white, a, phase)
                }
            }
        }
    }
    //#endregion

    window.requestAnimationFrame(update)
</script>
