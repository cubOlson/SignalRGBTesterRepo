      vehicleHandler()
      inGameBool = false;
      boostHandler();
    }
  }

      function hexToHSL(H) {
    // Convert hex to RGB first
    let r = 0, g = 0, b = 0;
    if (H.length == 4) {
      r = "0x" + H[1] + H[1];
      g = "0x" + H[2] + H[2];
      b = "0x" + H[3] + H[3];
    } else if (H.length == 7) {
      r = "0x" + H[1] + H[2];
      g = "0x" + H[3] + H[4];
      b = "0x" + H[5] + H[6];
    }
    // Then to HSL
    r /= 255;
    g /= 255;
    b /= 255;
    let cmin = Math.min(r,g,b),
        cmax = Math.max(r,g,b),
        delta = cmax - cmin,
        h = 0,
        s = 0,
        l = 0;
  
    if (delta == 0)
      h = 0;
    else if (cmax == r)
      h = ((g - b) / delta) % 6;
    else if (cmax == g)
      h = (b - r) / delta + 2;
    else
      h = (r - g) / delta + 4;
  
    h = Math.round(h * 60);
  
    if (h < 0)
      h += 360;
  
    l = (cmax + cmin) / 2;
    s = delta == 0 ? 0 : delta / (1 - Math.abs(2 * l - 1));
    s = +(s * 100).toFixed(1);
    l = +(l * 100).toFixed(1);
  
    return [h, s, l];
  }

     let backgroundEaseHue = 0;

    function backgroundHandler(){
        switch(backgroundMode){

            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)

            case "Color Cycle Ambience":

            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;

            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            break;
            case "Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Custom Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Ambience Audio Visualizer": 
            copyScreenAudio(ambienceAlpha / 100)
            break;

            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;

            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
        }
    }

    let audioScreenSat = 0
    let audioScreenLit = 0
    function copyScreenAudio(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      audioScreenSat += (engine.audio.density * 100 - audioScreenSat) / 10
      audioScreenLit += (engine.audio.density * 100 - audioScreenLit) / 10
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        ctx.fillStyle = `hsla(${hue[iZone]}, ${sat[iZone] * (audioScreenSat / 200 + .5)}%, ${lightness[iZone] * (audioScreenLit / 100)}%, ${alpha})`;
        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }
  
    function copyScreen(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        ctx.fillStyle = `hsla(${(backgroundMode == "Custom Ambience" ? proBack[0] : hue[iZone] + gCycle * (backgroundMode == "Color Cycle Ambience"))}, ${sat[iZone]}%, ${lightness[iZone]}%, ${alpha})`;
        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }

  function healthHandler() {
    if (HealthPinkMeter.value < .1 && HealthRedMeter.value < .1 && HealthYellowMeter.value < .1) {
      lowHealth = false;
    }
    if (HealthWhiteMeter.value == 1 && HealthWhiteMeter.increased && lowHealth && hpOn) {
      lowHealth = false;
      effects.push(new healthEffect("good"))
    } else if (HealthYellowMeter.value == 1 && HealthYellowMeter.increased && hpOn) {
      lowHealth = true;
      effects.push(new healthEffect("medium"))
    } else if (HealthPinkMeter.value == 1 && HealthPinkMeter.increased && hpOn) {
      lowHealth = true;
      effects.push(new healthEffect("bad"))
    } else if (HealthRedMeter.value == 1 && !playerDowned && hpOn) {
      lowHealth = true;
      playerDowned = true;
      effects.push(new healthEffect("downed"))
    }
  }

  function winHandler() {
    if (WinMeter.value == 1 && InGameMeter.value == 0 && winOn) {
      stopTriggering = true;
      effects.push(new winEffect())
    }
  }

  function ammoHandler() {
    if (NoAmmo1Meter.value + NoAmmo2Meter.value > .8 && ammoOn && !noAmmo) {
      effects.push(new noAmmoEffect())
      noAmmo = true;
    } if (noAmmo && NoAmmo1Meter.value == 0 && NoAmmo2Meter.value == 0 && ammoOn) {
      noAmmo = false;
      effects.push(new reloadEffect())
    }
  }

  function zoneHandler() {
    if (ZoneClosingMeter.value > .75 && !zoneClosingNow && zoneOn && inGameBool) {
      effects.push(new zoneCloseEffect())
      zoneClosingNow = true;
    } else if (ZoneClosingMeter.value == 0 && engine.vision.zoneClosing2 == 0 && zoneClosingNow && zoneOn && inGameBool) {
      effects.push(new RippleEffect(10, 3000, 30, "red", 10));
      zoneClosingNow = false;
    }
  }

  function boostHandler() {
    if (BoostMeter.value > .9 && boostOn) {
      effects.push(new boostedEffect())
    }
  }

  function killHandler() {
    if (KillMeter.value > .4 && KillMeter.diff > .25 && killOn) {
      effects.push(new killEffect())
    }
  }

  function assistHandler() {
    if (AssistMeter.value > .5 && AssistMeter.diff > .25 && assistOn) {
      effects.push(new assistEffect())
    }
  }

  function vehicleHandler() {
    if (vehicleGasMeter.value >= .95 && VehicleHPMeter.value >= .95 && engine.vision.vehicleNotWhite <= .05 && vehicleOn && inGameBool) {
      effects.push(new vehicleEffect())
    }
  }

  function DrawRect(x, y, width, height, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
  };

  function boostedEffect() {
    this.lifetime = 10;
    this.alpha = 1;
    this.done = false;
    this.draw = function () {
      var gradient = ctx.createRadialGradient(160, 100, 50, 160, 100, 120);
      BoostMeter.value < .1 ? this.done = true : null;
      if (this.done) {
        ctx.globalAlpha = this.alpha;
        gradient.addColorStop(0, 'transparent');
        gradient.addColorStop(.4, 'transparent');
        gradient.addColorStop(1, `hsl(0, ${90 + Math.sin(Date.now() / 300) * 10}%, ${50 + Math.sin(Date.now() / 300) * 10}%)`);
        this.alpha -= .01;
      } else {
        gradient.addColorStop(0, 'transparent');
        gradient.addColorStop(.4, 'transparent');
        gradient.addColorStop(1, `hsl(60, ${90 + Math.sin(Date.now() / 300) * 10}%, ${50 + Math.sin(Date.now() / 300) * 10}%)`);
      }
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 320, 200);
      ctx.globalAlpha = 1;
      if (this.alpha <= 0) {
        this.lifetime = 0;
      }
    }
  }

  function winEffect() {
    this.x = 150;
    this.y = -120;
    this.lifetime = 10;
    this.effects = [];
    this.start = Date.now();
    this.draw = function () {
      this.effects.forEach((ele, i) => {
        ele.draw();
        if (ele.lifetime <= 0) {
          this.effects.splice(i, 1);
        }
      });
      renderPath(this.x - 80, this.y + 30, plate, "white")
      renderPath(this.x - 65, this.y - 15, chicken, "yellow")
      if (this.y < 40) {
        this.y += 2
      } else {
        for (let i = 0; i < 3; i++) {
          this.effects.push(new explosionParticle(160, 100, 20, "orange"));
        }
      }
      var elapsed = Date.now() - this.start;
      if (elapsed > 10000) {
        this.lifetime = 0;
        stopTriggering = false;
      }
    }
  }

  function explosionParticle(x, y, min, color) {
    this.x = x;
    this.y = y;
    this.vx = Math.random() * -min + min / 2;
    this.vy = Math.random() * -min + min / 2;
    this.min = min;
    this.color = color;
    this.lifetime = 10;
    this.draw = function () {
      DrawCircle(this.x, this.y, Math.random() * 10 + 10, this.color)
      this.x += this.vx;
      this.y += this.vy;
      if (this.x > 320 || this.x < 0 || this.y > 200 || this.y < 0) {
        this.lifetime = 0;
      }
    }
  }

  function vehicleEffect() {
    this.lifetime = 10;
    this.wheel1 = new wheel(80, 80, 40);
    this.wheel2 = new wheel(240, 80, 40);
    this.draw = function () {
      drawRect(50, -20 + Math.sin((Date.now() - 400) / 100) * 5, 220, 90, "black")
      for (let i = 0; i < 20; i++) {
        drawRect(320 / 20 * i, 200, 320 / 20, -75 + Math.sin((Date.now() - 100 * i) / 100) * 10, "green")
      }
      this.wheel1.draw();
      this.wheel2.draw();
      if ((vehicleGasMeter.value < .1 && VehicleHPMeter.value < .1) || !inGameBool) {
        this.lifetime = 0;
      }
    }
  }

  function wheel(x, y, radius) {
    this.x = x;
    this.y = y;
    this.radius = radius;
    this.rotate = 0;
    this.draw = function () {
      DrawCircle(this.x, this.y + Math.sin((Date.now() - 400) / 100) * 5, this.radius, "grey")
      DrawStroke(this.x, this.y + Math.sin((Date.now() - 400) / 100) * 5, this.radius, "black", 10)
      ctx.save()
      ctx.translate(this.x, this.y)
      ctx.rotate(this.rotate)
      ctx.translate(-this.x, -this.y)
      ctx.moveTo(this.x, this.y - this.radius)
      ctx.lineTo(this.x, this.y + this.radius)
      ctx.stroke()
      ctx.restore()
      this.rotate -= .2
    }
  }

  function assistEffect() {
    this.lifetime = 10;
    this.start = Date.now();
    this.y = 200;
    this.lineWidth = 20;
    this.alpha = 1;
    this.draw = function () {
      var elapsed = Date.now() - this.start;
      ctx.globalAlpha = this.alpha;
      if (elapsed > 100) {
        ctx.beginPath();
        ctx.moveTo(0, 0)
        ctx.lineTo(320, 200)
        ctx.strokeStyle = "yellow";
        ctx.lineWidth = this.lineWidth;
        ctx.stroke()
      }
      if (elapsed > 300) {
        ctx.beginPath();
        ctx.moveTo(320, 0)
        ctx.lineTo(0, 200)
        ctx.strokeStyle = "#yellow";
        ctx.lineWidth = this.lineWidth;
        ctx.stroke()
        if (this.y > 40) {
          this.y -= 5;
        }
      }
      if (elapsed > 1500) {
        this.alpha -= .01;
      }
      drawRect(140, this.y, 40, 120, "white")
      drawRect(100, this.y + 40, 120, 40, "white")
      ctx.globalAlpha = 1;
      if (this.alpha <= 0) {
        this.lifetime = 0;
      }
      this.lineWidth++;
    }
  }

  function killEffect() {
    this.lifetime = 10;
    this.start = Date.now();
    this.y = 200;
    this.lineWidth = 20;
    this.alpha = 1;
    this.draw = function () {
      var elapsed = Date.now() - this.start;
      ctx.globalAlpha = this.alpha;
      if (elapsed > 100) {
        ctx.beginPath();
        ctx.moveTo(0, 0)
        ctx.lineTo(320, 200)
        ctx.strokeStyle = "#FF8C00";
        ctx.lineWidth = this.lineWidth;
        ctx.stroke()
      }
      if (elapsed > 300) {
        ctx.beginPath();
        ctx.moveTo(320, 0)
        ctx.lineTo(0, 200)
        ctx.strokeStyle = "#FF8C00";
        ctx.lineWidth = this.lineWidth;
        ctx.stroke()
        if (this.y > 40) {
          this.y -= 5;
        }
      }
      if (elapsed > 1500) {
        this.alpha -= .005;
      }
      renderPath(120, this.y + Math.cos(Date.now() / 50) * 2, skullTop, "black")
      renderPath(123, this.y + 60 + Math.sin(Date.now() / 50) * 8, skullBottom, "black")
      ctx.globalAlpha = 1;
      if (this.alpha <= 0) {
        this.lifetime = 0;
      }
      this.lineWidth++;
    }
  }

  function zoneCloseEffect() {
    this.lifetime = 10;
    this.start = Date.now();
    this.draw = function () {
      var elapsed = Date.now() - this.start;
      if (elapsed > 5000) {
        this.start = Date.now();
        effects.push(new RippleEffect(8, 1000, 30, "blue", 2));
      }
      if (!zoneClosingNow) {
        this.lifetime = 0;
      }
    }
  }

  function RippleEffect(speed, duration, rippleWidth, color, amountOfRipples) {
    this.col = color;
    this.speed = -speed;
    this.dur = duration;
    this.width = rippleWidth;
    this.start = Date.now();
    this.lifetime;
    this.amount = amountOfRipples;
    this.radius = 200 + (this.width * (this.amount * 2));


    this.draw = function () {
      ctx.globalAlpha = 0.2;
      if (this.lifetime < (this.dur / 4) * 3) {
        drawRect(0, 0, 320, 200, this.col)
      }

      ctx.globalAlpha = 1;
      ctx.lineWidth = this.width;
      ctx.beginPath();
      for (let i = 0; i < this.amount; i++) {
        if (this.radius - i * (this.width * 2) > 0) {
          ctx.arc(160, 100, this.radius - i * (this.width * 2), 0, 2 * Math.PI);
        }
      }
      ctx.strokeStyle = this.col;
      ctx.stroke();
      this.radius += this.speed;
      this.lifetime = this.dur - (Date.now() - this.start);
      ctx.lineWidth = 1;
    }
  }



  function reloadEffect() {
    this.start = Date.now();
    this.lifetime = 10;
    this.radius = 1;
    this.alpha = 1;
    this.draw = function () {
      var elapsed = Date.now() - this.start;
      var index = Math.floor(elapsed / 250);
      if (elapsed < 500) {
        DrawCircle(160, 100, this.radius, "black");
        for (let i = 0; i < index; i++) {
          drawRect(50, 200 - 35 * i, 220, 25, "gold")
        }
        this.radius += 10;
      } else {
        ctx.globalAlpha = this.alpha;
        DrawCircle(160, 100, this.radius, "black");
        for (let i = 0; i < index; i++) {
          drawRect(50, 200 - 35 * i, 220, 25, "gold")
        }
        ctx.globalAlpha = 1;
        this.alpha -= .0075;
      }
      if (this.alpha <= 0) {
        this.lifetime = 0;
      }
    }
  }

  function noAmmoEffect() {
    this.start = Date.now();
    this.lifetime = 10;
    this.radius = 1;
    this.alpha = 1;
    this.draw = function () {
      var elapsed = Date.now() - this.start;
      if (elapsed < 500) {
        DrawCircle(160, 100, this.radius, "black");
        this.radius += 10;
      } else {
        ctx.globalAlpha = this.alpha;
        DrawCircle(160, 100, this.radius, "black");
        DrawStroke(160, 100, 50, `hsl(0, 100%, ${30 + Math.sin(Date.now() / 100) * 20}%)`, 30);
        ctx.globalAlpha = 1;
        this.alpha -= .0075;
      }
      if (this.alpha <= 0) {
        this.lifetime = 0;
      }
    }
  }

  function healthEffect(type) {
    this.type = type;
    this.effects = [];
    this.pushed = false;
    this.start = Date.now();
    this.dstart = Date.now()
    this.lifetime = 10;

    this.draw = function () {
      if (!this.pushed && this.type != "downed") {
        for (let i = 0; i < 10; i++) {
          switch (this.type) {
            case "good":
              setTimeout(() => { this.effects.push(new healthArrow(160, 200, 160, -75, 30, 20, "white")) }, 100 * i)
              break;
            case "medium":
              setTimeout(() => { this.effects.push(new healthArrow(160, 100, -75, 100, 30, 20, "yellow")) }, 100 * i)
              setTimeout(() => { this.effects.push(new healthArrow(160, 100, 395, 100, 30, 20, "yellow")) }, 100 * i)
              break;
            case "bad":
              setTimeout(() => { this.effects.push(new healthArrow(160, 0, 160, 275, 30, 20, "red")) }, 100 * i)
              break;
          }
        }
        this.pushed = true;
      } else if (!this.pushed && Date.now() - this.dstart > 400) {
        this.effects.push(new healthArrow(160, 100, -75, 100, 30, 20, "red"))
        this.effects.push(new healthArrow(160, 100, 395, 100, 30, 20, "red"))
        this.effects.push(new healthArrow(160, 100, 160, -75, 30, 20, "red"))
        this.effects.push(new healthArrow(160, 100, 160, 275, 30, 20, "red"))
        this.dstart = Date.now();
        if (HealthRedMeter.value == 0) {
          this.pushed = true;
          playerDowned = false;
          this.lifetime = 0;
        }
      }

      this.effects.forEach((ele, i) => {
        ele.draw();
        if (ele.lifetime <= 0) {
          this.effects.splice(i, 1);
        }
      });
      if (Date.now() - this.start > 3000 && this.pushed == true) {
        this.lifetime = 0;
      }
    }
  }

  function healthArrow(startX, startY, endX, endY, strokeWidth, steps, color) {
    this.x = startX;
    this.y = startY;
    this.endX = endX;
    this.endY = endY;
    this.vx = (endX - startX) / steps;
    this.vy = (endY - startY) / steps;
    this.angle = Math.atan2(endY - startY, endX - startX) + Math.PI / 2
    this.stroke = strokeWidth;
    this.color = color;
    this.lifetime = 10;

    this.draw = function () {
      ctx.strokeStyle = this.color;
      ctx.lineWidth = this.stroke;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle)
      ctx.translate(-this.x, -this.y);
      ctx.beginPath();
      ctx.moveTo(this.x - 150, this.y + 75);
      ctx.lineTo(this.x, this.y);
      ctx.lineTo(this.x + 150, this.y + 75);
      ctx.stroke();
      ctx.restore();
      this.x += this.vx;
      this.y += this.vy;
      if (this.x == this.endX && this.y == this.endY) {
        this.lifetime = 0;
      }
    }
  }

  function renderPath(x, y, path, color) {
    ctx.fillStyle = color;
    ctx.save();
    ctx.translate(x, y);
    let ex = new Path2D(path);
    ctx.fill(ex);
    ctx.restore();
  }

  function DrawCircle(x, y, radius, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.fill();
  };

  function DrawStroke(x, y, radius, color, stroke) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = stroke;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.stroke();
  };

  function drawRect(x, y, height, width, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.fillRect(x, y, height, width);
  }

  function StateHandler() {
    var stack = [];
    var state = null;

    var updateState = function () {
      if (stack.length > 0) {
        state = stack[stack.length - 1];
      } else {
        state = null;
      }
    };

    this.Push = function (newState) {
      stack.push(newState);
      updateState();
    };

    this.Pop = function () {
      stack.pop();
      updateState();
    };

    this.Process = function () {
      if (state != null) {
        state.Process();
      }
    };
  }

  function Meter(size, callback) {
    this.size = size;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    var values = [];

    this.setValue = function (updatedValue) {
      values.push(updatedValue);
      if (values.length > this.size) {
        values.shift();
      }

      for (var i = 0; i < values.length - 1; i++) {
        if (values[i] !== values[i + 1]) return;
      }
      if (this.value !== values[0]) {
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        callback();
      }
    };
  }

  function timedMeter(size, callback) {
    this.size = size;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    this.start = Date.now();
    this.elapsed = 0;
    var values = [];

    this.setValue = function (updatedValue) {
      values.push(updatedValue);
      this.elapsed = Date.now() - this.start;
      if (values.length > this.size) {
        values.shift();
      }

      for (var i = 0; i < values.length - 1; i++) {
        if (values[i] !== values[i + 1]) return;
      }
      if (this.value !== values[0]) {
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        this.start = Date.now();
        callback();
      }
    };
  }
  window.requestAnimationFrame(update)
</script>
