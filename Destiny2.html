  function damageSetter(m1, m2, m3, m4,m5) {
    let orange = m1
    let purple = m2
    let blue = m3
    let darkBlue = m4;
    let green = m5;

    if (orange.diff > purple.diff && orange.diff > blue.diff && orange.diff > darkBlue.diff && orange.diff > green.diff) {
      damageType = "orange"
    } else if (purple.diff > orange.diff && purple.diff > blue.diff && purple.diff > darkBlue.diff && purple.diff > green.diff) {
      damageType = "purple"
    } else if (blue.diff > orange.diff && blue.diff > purple.diff && blue.diff > darkBlue.diff  && blue.diff > green.diff) {
      damageType = "blue"
    } else if (darkBlue.diff > orange.diff && darkBlue.diff > purple.diff && darkBlue.diff > blue.diff && darkBlue.diff > green.diff) {
      damageType = "darkBlue"
    } else if ( green.diff > orange.diff && green.diff > purple.diff && green.diff > blue.diff && green.diff > darkBlue.diff){
      damageType = "green"
    }else if (orange.diff == purple.diff && orange.diff == 1 ) {
      orange.elapsed < purple.elapsed ? damageType = "orange" : damageType = "purple";
    } else if (purple.diff == blue.diff && purple.diff == 1) {
      purple.elapsed < blue.elapsed ? damageType = "purple" : damageType = "blue";
    } else if (blue.diff == orange.diff && blue.diff == 1) {
      blue.elapsed < orange.elapsed ? damageType = "blue" : damageType = "orange";
    }

    if (damageType == "orange") {
      m2.diff = 0;
      m3.diff = 0;
      m4.diff = 0;
      m5.diff = 0;
    }
    if (damageType == "purple") {
      m1.diff = 0;
      m3.diff = 0;
      m4.diff = 0;
      m5.diff =0
    }
    if (damageType == "blue") {
      m2.diff = 0;
      m1.diff = 0;
      m4.diff = 0;
      m5.diff = 0;
    }
    if (damageType == "darkBlue") {
      m2.diff = 0;
      m3.diff = 0;
      m1.diff = 0;
      m5.diff = 0;
    }
    if (damageType == "green") {
      m2.diff = 0;
      m3.diff = 0;
      m1.diff = 0;
      m4.diff = 0;
    }
  }

  function crucibleAheadEffect(color){
    this.start = Date.now()
    this.color = color
    this.y = 240;

      this.elapsed = Date.now() - this.start
      drawRect(0,200 - this.elapsed/5,canvas.width,canvas.height*2.3,"hsl(0,0%,0%,0.9)")

  function crucibleDefeat() {
    this.lifetime = 10;
    this.lightness1 = 100;
    this.lightness2 = 100;
    this.lightness3 = 100;
    this.alpha = 1;

    this.draw = function () {
      let grd = ctx.createLinearGradient(160, 0, 160, 200);
      grd.addColorStop(0, `hsl(0, 100%, ${this.lightness1}%)`);
      grd.addColorStop(.5, `hsl(0, 100%, ${this.lightness2}%)`);
      grd.addColorStop(1, `hsl(0, 100%, ${this.lightness3}%)`);
      this.lightness1 > 50 ? this.lightness1-- : this.lightness2 > 50 ? this.lightness2-- : this.lightness3 > 50 ? this.lightness3-- : null;
      this.lightness3 <= 50 ? this.alpha -= .01 : null;
      ctx.globalAlpha = this.alpha
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, 320, 200);
      renderPath(105, 15, skull, "white");
      DrawCircle(140, 90, 15, `hsl(0, 100%, ${this.lightness2}%)`)
      DrawCircle(180, 90, 15, `hsl(0, 100%, ${this.lightness2}%)`)
      ctx.globalAlpha = 1;
      this.alpha <= 0 ? this.lifetime = 0 : null;
    }
  }

    this.start = Date.now();
    this.lifetime = 10;
    this.effects = []
    this.hues = ["black", `hsl(0, 100%, 25%)`, "red", "white"]
    this.done = false;
    this.draw = function () {
      let elapsed = Date.now() - this.start;
      if (!this.done) {
        for (let i = 0; i < 4; i++) {
          setTimeout(() => { this.effects.push(new crucibleV(160, 150 - i * 25, 5, this.hues[i])) }, i * 200)

        this.done = true;

          effects.push(new downedParticle("red"))

    this.lifetime = 20;

        this.lifetime = 0;

      if (this.y > 0) {
        this.y -= 15;

        null;

      drawRect(0, this.y, 320, 300, "black");

        ele.draw();
        if (ele.lifetime <= 0) {
          this.effects.splice(i, 1);

  function grenade(color) {
    this.color = color == "darkBlue" ? "hsl(218, 74%, 62%)" : color;

    this.radius = 15;
    this.lifetime = 10;
    this.y = 300;

        this.y -= 15;

        this.y = 0;
      }
      drawRect(0, this.y, 320, 300, "black");
      if (elapsed < 400) {
        DrawCircle(160, 100, this.radius, this.color);

        DrawCircle(160, 100, this.radius, "white");

        this.radius <= 0 ? this.radius = .01 : null;
      } else {
        if (!this.done) {
          setTimeout(() => { this.lifetime = 0 }, 1000)
          for (let i = 0; i < 35; i++) {

            for (let i = 0; i < 35; i++) {

    for (let index = 0; index < 130; index++) {
      this.stars.push(new star(Math.random() * 320, Math.random() * 200, 0, 1));
    }

    this.Process = function (){
      if(inMenu && this.alpha<0.9 && !inGame && !inVehicle && !inTower){
        this.alpha += 0.005;
      } else {
        this.alpha -= 0.01;
      }
      this.elapsed = Date.now() - this.start;
      
      if(this.alpha > 0 && menuOn){
        ctx.globalAlpha = this.alpha;
        drawRect(0,0,320,200,"hsla(270, 100%, 3%,1)")
      for (let index = 0; index < this.stars.length; index++) {
        this.stars[index].draw();
      }
      for (let index = 0; index < this.planets.length; index++) {
        this.planets[index].draw();
      }
      ctx.globalAlpha = 1;
      } else {
        inMenu = false;
        stateHdlr.Pop();
      }
    }
  }



  function publicEventEffect (){
    this.start = Date.now();
    this.elapsed = 0;
    this.scale = 0.7;
    this.moveY = -50;
    this.sinY = 0
    this.ripples = [];
    this.counter = 0;
    this.endTimer = 0;
    this.endStart = 0;
    this.globalAlpha =0;
    this.Process = function (){
      if (this.endStart == 0){
        this.globalAlpha = setRange((this.elapsed/1000),0,1)
      } else {
        this.globalAlpha = setRange((1- (this.endTimer/2000)),0,1)
      }
    
      this.elapsed = Date.now() - this.start;
      drawRect(0,0,320,200,`hsla(209, 100%, 9%, ${this.globalAlpha})`)
      if(this.moveY<0){
        this.moveY += 1;
      }

      this.counter++
      if (this.counter % 50 == 0){
        this.ripples.push(new simpleRipple(160,100,`hsla(42, 100%, 55%,${this.globalAlpha})`,1.5,10))
      }

      for (let i = 0; i < this.ripples.length; i++) {
        this.ripples[i].draw();
        if(this.ripples[i].size > 600){
          this.ripples.splice(i,1)
        }
      }
      this.sinY = Math.sin(this.elapsed/500)*10
      ctx.beginPath();
      ctx.save();
      ctx.translate(160,100)
      ctx.scale(this.scale,this.scale)
      ctx.translate(-160,-100)
      ctx.translate(37 ,-10+ this.moveY + this.sinY)
      renderPath(0,0,publicEventsvg,`hsla(42, 68%, 55%,${this.globalAlpha})`)
       renderPath(0,0,publicEventsvg2,`hsla(42, 68%, 100%,${this.globalAlpha})`)
       ctx.restore();

      if (this.elapsed > 5000){
        if (this.endStart == 0){
          this.endStart = Date.now();
        } 
        this.endTimer = Date.now() - this.endStart;
        if (this.endTimer > 5000){
          this.lifetime = 0;
          stateHdlr.Pop();
        }
    }
  }}

  function publicEventCompletionEffect (){
    this.particles = [];
    this.start = Date.now();
    this.elapsed = 0;
    this.y = 120;
    this.Process = function (){
      this.elapsed = Date.now() - this.start;

      this.yMoveVal = this.elapsed <6000?-200+setRange(this.elapsed/5,0,200): setRange((this.elapsed-6000)/5,0,200)
      drawRect(0,this.yMoveVal,320,200,"hsla(0,0%,0%,1)")
      drawRect(110,this.y+this.yMoveVal,100,60,"hsla(0,0%,20%,1)")
      if (this.elapsed > 2000){
        if (this.elapsed < 3000){
          for (let index = 0; index < 3; index++) {
            setTimeout(() => {
              this.particles.push(new gravityParticle({x:160 + (Math.random()-0.5)*10,y:this.y},{x:(Math.random()-0.5)*5,y:Math.random()*-8 -3},"hsla(180, 100%, 55%,1)",0.15,300,Math.random()*10+1))
            }, Math.random()*1000);      
          }     
        }
        for (let i = 0; i < this.particles.length; i++) {
          this.particles[i].draw();
          if(this.particles[i].lifetime == 0){
            this.particles.splice(i,1)
          }
        }
      }

      if(this.elapsed>10000){
        stateHdlr.Pop();
      }
    }
  }

  function punch(color) {
    this.color = color == "darkBlue" ? "hsl(218, 74%, 62%)" : color;
    this.start = Date.now();
    this.y = 200;
    this.lifetime = 10;
    this.drew = false;
    this.draw = function () {
      let elapsed = Date.now() - this.start;
      ctx.globalAlpha = .75;
      drawRect(0, 0, 320, 200, "black")
      ctx.globalAlpha = 1;
      drawRect(120, this.y, 70, 70, "white")
      drawRect(170, this.y + 30, 35, 30, "white")
      drawRect(130, this.y + 30, 50, 120, "white")
      if (this.y > 65) {
        this.y -= 20;
      } else {
        if (!this.drew) {
          this.drew = true;
          effects.push(new expandingRing(160, 100, 15, this.color))
          setTimeout(() => { effects.push(new expandingRing(160, 100, 10, this.color)) }, 200)
        }
        setTimeout(() => { this.lifetime = 0 }, 200)
      }
    }
  }

  function ultimateDone() {
    this.start = Date.now();
    this.lifetime = 10;
    this.lightness1 = 50;
    this.lightness2 = 50;
    this.lightness3 = 50;
    this.alpha = 1;
    this.clear = true;

    this.draw = function () {
      let elapsed = Date.now() - this.start;
      let grd = ctx.createRadialGradient(160, 100, 100, 160, 100, 400);
      grd.addColorStop(0, `hsl(0, 100%, ${this.lightness1}%)`);
      grd.addColorStop(.5, `hsl(0, 100%, ${this.lightness2}%)`);
      grd.addColorStop(1, `hsl(0, 100%, ${this.lightness3}%)`);
      this.lightness1 > 0 ? this.lightness1-- : this.lightness2 > 0 ? this.lightness2-- : this.lightness3 > 0 ? this.lightness3-- : null;
      this.lightness3 <= 0 ? this.alpha -= .05 : null;
      ctx.globalAlpha = this.alpha
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, 320, 200);
      ctx.globalAlpha = 1;
      this.alpha <= 0 ? this.lifetime = 0 : null;
      if (this.lifetime == 0) {
        ultCharged = false;
        ultInUse = false;
      }
    }
  }

  function ultimateInUse(speed) {
    this.start = Date.now();
    this.lifetime = 10;
    this.speed = speed;
    this.hue = 60;
    this.draw = function () {
      let elapsed = Date.now() - this.start;
      if (elapsed > this.speed) {
        effects.push(new ultRect(45, 12, `hsl(${this.hue}, 100%, 50%)`));
        this.hue > 0 ? this.hue-- : null;
        this.start = Date.now()
      }
      if (UltimateIconMeter.value == 0) {
        this.lifetime = 0;
        ultInUse = false;
      }
    }
  }

  function ultimateCharged() {
    this.start = Date.now();
    this.radius = 5;
    this.count = 0;
    this.clear = true;
    this.x = 0;
    this.width = 160;
    this.lifetime = 10;
    this.draw = function () {
      let elapsed = Date.now() - this.start;
      if (elapsed < 200) {
        DrawCircle(160, 100, this.radius, "yellow");
      } else if (this.radius < 75) {
        DrawCircle(160, 100, this.radius, "yellow");
        this.radius += 5;
      } else if (this.x < 400) {
        DrawCircle(160, 100, this.radius, "yellow")
        drawRect(160 - this.x, 25, this.x, 150, "yellow");
        drawRect(160, 25, this.x, 150, "yellow");
        this.x += 15;
      } else if (this.width > 0) {
        drawRect(0, 25, this.width, 150, "yellow");
        drawRect(320 - this.width, 25, this.width, 150, "yellow");
        this.width -= 15;
      } else {
        this.lifetime = 0;
      }
    }
  }

  function vehicleEffect(){
    this.startY =95;
    this.x = 230;
    this.y = this.startY;
    this.xSize = 80;
    this.ySize = 60;
    this.startTimer = 0;
    this.endTimer =0;
    this.endStart = 0;
    this.elapsed = 0;
    this.start = Date.now();
    this.exhaustParticles = [];
    this.randHue = Math.floor(Math.random()*360);
    this.draw = function (){
      this.elapsed = Date.now() - this.start;
      if (this.startTimer < 200){
        this.startTimer+=3;
      } else {
        this.startTimer = 200;
      }

      ctx.globalAlpha =(setRange(1- (this.endTimer/1000),0,1))
  
      drawRect(0,-200 + this.startTimer, 320, 200, "hsla(0,0%,0%,0.95)")
      ctx.beginPath();
      ctx.fillStyle = `hsl(${this.randHue}, 100%, 50%)`;
      this.y = this.startY + Math.sin(this.elapsed/400)* 10
      ctx.save();
      ctx.translate(this.x,this.y)
      ctx.rotate(Math.sin(this.elapsed/400 + (Math.PI/2))* Math.PI/20)
      ctx.moveTo(0- this.xSize/2, 0+ this.ySize/2);
      ctx.lineTo(0+ this.xSize/2, 0+ this.ySize/2);
      ctx.lineTo(0- this.xSize/2, 0- this.ySize/2);
      ctx.lineTo(0- this.xSize/2, 0+ this.ySize/2);
      ctx.fill();
      ctx.restore();


      this.getXmodifier = Math.cos((Math.sin(this.elapsed/400 + (Math.PI/2))* Math.PI/10))
      this.getYmodifier = -Math.sin((Math.sin(this.elapsed/400 + (Math.PI/2))* Math.PI/10))*2
      this.exhaustParticles.push(new movingParticle({x:this.x-this.xSize/2,y:this.y + 10*this.getYmodifier + (Math.random()-0.5)*20},{x:-10 * this.getXmodifier,y:5*this.getYmodifier + (Math.random()-0.5)*3},Math.random() *10,`hsl(${Math.random() *50},100%,${40 + 60*Math.random()}%)`,100,true))

      for (var i = 0; i < this.exhaustParticles.length; i++){
        this.exhaustParticles[i].draw();
        if (this.exhaustParticles[i].lifetime < 0){
          this.exhaustParticles.splice(i,1)
        }
      }
      ctx.globalAlpha = 1;

      if(inVehicle == false){
        if(this.endStart == 0){
          this.endStart = Date.now();
        } else {
          this.endTimer = Date.now() - this.endStart;
          if (this.endTimer > 1000){
            this.lifetime = 0;
          }
        } 
      }
    }
  }

  //#endregion
  //#region helperClasses
  function arcParticle() {
    this.effects = []
    this.lifetime = 10;
    this.x = Math.random() * 320;
    this.y = 200;
    this.vx = Math.random() > .5 ? 16 : -16;
    this.vy = -16;
    this.change = 1;
    this.hue = Math.cos(Date.now()) * Math.random() * 30 + 215;
    this.start = Date.now();
    this.draw = function () {
      let elapsed = Date.now() - this.start;
      if (this.effects.length > 4) {
        this.effects.shift();
      }
      this.effects.forEach((ele) => {
        DrawCircle(ele[0], ele[1], 10, damageType == "darkBlue" ? "hsl(218, 74%, 62%)" : `hsl(${this.hue}, 100%, 50%)`)
      });
      DrawCircle(this.x, this.y, 15, damageType == "darkBlue" ? "hsl(218, 74%, 62%)" : `hsl(${this.hue}, 100%, 50%)`)
      this.effects.push([this.x, this.y]);
      if (elapsed > 50) {
        this.start = Date.now();
        this.change ? this.change = 0 : this.change = 1;
      }
      if (this.change) {
        this.x += this.vx;
      } else {
        this.y += this.vy;
      }
      if (this.x > 320 || this.x < 0 || this.y > 200 || this.y < 0) {
        this.lifetime = 0;
      }
    }
  }

  function crucibleV(x, y, speed, color) {
    this.lifetime = 10;
    this.x = x;
    this.y = y - 200;
    this.goal = y;
    this.vy = speed;
    this.color = color;
    this.draw = function () {
      ctx.beginPath();
      ctx.moveTo(this.x - 100, this.y - 30)
      ctx.lineTo(this.x, this.y)
      ctx.lineTo(this.x + 100, this.y - 30)
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 25;
      ctx.stroke()
      this.y < this.goal ? this.y += this.vy : null;
    }
  }

  function downedParticle(color) {
    this.x = 160;
    this.y = 100;
    this.vx = (2 - Math.random() * 4) * 2;
    this.vy = (2 - Math.random() * 4) * 2;
    this.radius = 10 * Math.random() + 10;
    this.color = color;
    this.draw = function () {
      DrawCircle(this.x, this.y, this.radius, this.color);
      this.x += this.vx;
      this.y += this.vy;
    }
  }

  function expandingRing(x, y, speed, color) {
    this.x = x;
    this.y = y;
    this.speed = speed;
    this.radius = 1;
    this.color = color;
    this.draw = function () {
      DrawStroke(this.x, this.y, this.radius, this.color, 40)
      this.radius += this.speed;
      if (this.radius > 200) {
        this.lifetime = 0;
      }
    }
  }

  function explosionParticle(x, y, min, color) {
    this.x = x;
    this.y = y;
    this.vx = Math.random() * -min + min / 2;
    this.vy = Math.random() * -min + min / 2;
    this.min = min;
    this.color = color;
    this.lifetime = 10;
    this.draw = function () {
      DrawCircle(this.x, this.y, Math.random() * 10 + 10, this.color)
      this.x += this.vx;
      this.y += this.vy;
      if (this.x > 320 || this.x < 0 || this.y > 200 || this.y < 0) {
        this.lifetime = 0;
      }
    }
  }

  function flameParticle() {
    this.lifetime = 10;
    this.x = Math.random() * 320;
    this.y = 200;
    this.vx = Math.cos(Date.now() / 100) * 5;
    this.vy = Math.random() * 10 + 3;
    this.hue = Math.cos(Date.now()) * Math.random() * 30 + 35;
    this.draw = function () {
      this.vx = Math.cos(Date.now() / 75) * Math.random() * 10;
      DrawCircle(this.x, this.y, Math.random() * 10 + 10, `hsl(${this.hue}, 100%, ${Math.cos(Date.now() / 200) * Math.random() * 10 + 60}%)`)
      this.x += this.vx;
      this.y -= this.vy;
      if (this.y < 0) {
        this.lifetime = 0;
      }
    }
  }

  function gravityParticle(pos,speed,color,gravity,lifetime,size){
    this.pos = pos;
    this.speed = speed;
    this.color = color;
    this.gravity = gravity;
    this.lifetime = lifetime;
    this.size = size;
    this.trail = [];
    this.draw = function (){
      ctx.beginPath();
      ctx.arc(this.pos.x,this.pos.y,this.size,0,Math.PI*2)
      ctx.fillStyle = this.color;
      ctx.fill();
      this.pos.x += this.speed.x;
      this.pos.y += this.speed.y;
      this.speed.y += this.gravity;
      this.lifetime--;
      if (this.lifetime < 0){
        this.lifetime = 0;
      }
      this.trail.push(new TrailParticle(this.pos.x,this.pos.y,this.size,this.color,20))
      for (let i = 0; i < this.trail.length; i++) {
        this.trail[i].draw();
        if(this.trail[i].lifetime == 0){
          this.trail.splice(i,1)
        }
      }
    }
  }

  function greenParticle (){
    this.lifetTime = 10;
    this.dir = Math.random()>0.5
    this.x = this.dir?0:320;
    this.y = 80;
    this.vx = this.dir?1+ Math.random() * 2:-1- Math.random() * 2;
    this.vy = 1 + Math.random() * 1;
    this.hue = Math.cos(Date.now()) * Math.random() * 30 + 120;
    this.start = Date.now();
    this.draw = function () {
      DrawCircle(this.x, this.y, 10, `hsl(${this.hue}, 100%, 50%)`)
      this.x += this.vx;
      this.y += this.vy;
      this.vy += .1;
      if(this.y >200){
        this.vy = -this.vy;
        this.y = 200;
      }
      if (Date.now() - this.start > 2000) {
        this.lifetime = 0;
      }
    }
  }

  function movingArrow(pos,size,speed,rotation,color){
    this.pos = pos;
    this.size = size;
    this.speed = speed;
    this.rotation = rotation;
    this.color = color;
    this.lifetime = 400;
    this.alpha = 0;
    this.draw = function(){
      if (this.lifetime > 300){
        this.alpha += 0.01;
      } else if (this.lifetime < 100){
        this.alpha -= 0.01;
      }
      this.lifetime -= 1;
      this.pos.x += this.speed.x;
      this.pos.y += this.speed.y;
      ctx.globalAlpha = this.alpha;
      drawArrow(this.pos.x,this.pos.y,this.size.x,this.size.y,this.rotation,this.color);
      ctx.globalAlpha = 1;
    }
  }

  function movingParticle(pos,speed,size,color,lifetime,trail){
    this.pos = pos;
    this.speed = speed;
    this.size = size;
    this.color = color;
    this.lifetime = lifetime;
    this.trail = trail;
    this.trails = [];
    this.draw = function(){
      DrawCircle(this.pos.x,this.pos.y,this.size,this.color)
      this.pos.x += this.speed.x;
      this.pos.y += this.speed.y;
      this.lifetime--;
      if (this.trail){
        this.trails.push(new TrailParticle(this.pos.x,this.pos.y,this.size,this.color,10))
      }
      for (var i = 0; i < this.trails.length; i++){
        this.trails[i].draw();
        if (this.trails[i].lifetime < 0){
          this.trails.splice(i,1)
        }
      }
    }
  }

  function Planet(size, color, orbitSize, orbitSpeed, name = "nothing", planetBloom = 0, orbitColor = color, orbitPlanet = null) {
    this.size = size;
    this.color = color;
    this.orbitSize = orbitSize;
    this.orbitSpeed = 100;
    this.orbitColor = orbitColor;
    this.planetBloom = planetBloom;
    this.orbitPlanet = orbitPlanet;
    this.name = name;
    this.followPlanet = orbitPlanet;
    this.x = 160;
    this.y = 100;
    this.start = Date.now();
    this.elapsed = Date.now();
    this.draw = function () {
      if (this.planetBloom != 0) {

        ctx.beginPath();
        let grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.planetBloom + this.size);
        grad.addColorStop(0, this.color);
        grad.addColorStop(1, "hsla(0,0%,10%,0)");
        ctx.fillStyle = grad;
        ctx.arc(this.x, this.y, this.size + this.planetBloom, 0, 2 * Math.PI);
        ctx.fill();
      }
      this.elapsed = Date.now() - this.start;
      ctx.beginPath();
      ctx.fillStyle = this.color;
      ctx.arc(this.x, this.y, this.size, 0, 2 * Math.PI);
      ctx.fill();
      if (showOrbit && !this.orbitPlanet) {
        ctx.beginPath();
        ctx.fillStyle = this.orbitColor;
        ctx.arc(160, 100, this.orbitSize, 0, 2 * Math.PI);
        ctx.strokeStyle = this.orbitColor;
        ctx.stroke();
      } else if (showOrbit) {
        ctx.beginPath();
        ctx.fillStyle = this.orbitColor;
        ctx.arc(this.orbitPlanet.x, this.orbitPlanet.y, this.orbitSize, 0, 2 * Math.PI);
        ctx.strokeStyle = this.orbitColor;
        ctx.stroke();
      }

      if (this.orbitSize > 0 && this.orbitPlanet == null) {
        this.x = 160 + ((Math.sin(this.elapsed / orbitSpeed)) * (orbitSize));
        this.y = 100 + ((Math.cos(this.elapsed / orbitSpeed)) * (orbitSize));
      } else if (this.orbitPlanet != null) {
        this.x = this.followPlanet.x + ((Math.sin(this.elapsed / orbitSpeed)) * (orbitSize));
        this.y = this.followPlanet.y + ((Math.cos(this.elapsed / orbitSpeed)) * (orbitSize));
      }

      if (showPlanetName) {
        ctx.beginPath();
        ctx.font = "10px Arial";
        ctx.fillStyle = "white";
        ctx.fillText(this.name, this.x, this.y - (this.size / 2));
      }
    }
  }

  function simpleRipple(x,y,color,speed,width){
    this.x = x;
    this.y = y;
    this.size = 0;
    this.color = color;
    this.speed = speed;
    this.draw = function (){
      ctx.beginPath();
      ctx.lineWidth = width;
      ctx.arc(this.x,this.y,this.size,0,Math.PI*2)
      ctx.strokeStyle = this.color;
      ctx.stroke();
      this.size += this.speed;
      if (this.size > 600){
        this.lifetTime =0;
      }
    }
  }

  class star {
    constructor(x, y, color, size) {
      this.x = x;
      this.y = y;
      this.color = color;
      this.offset = Math.random() * 2000;
      this.size = size;
    }

    draw() {
      ctx.beginPath();
      let calcVal = Math.sin(Date.now() / 1000 + this.offset)
      ctx.fillStyle = `hsl(${this.color},0%,${calcVal * 100}%)`;
      ctx.arc(this.x, this.y, this.size, 0, 2 * Math.PI)
      ctx.fill();
    }
  }

  function TrailParticle (x,y,size,color, lifetime){
    this.totallifetime = lifetime;
    this.lifetime = lifetime;
    this.x = x;
    this.y = y;
    this.size = size;
    this.color = color;
    this.draw = function () {

      ctx.globalAlpha = this.lifetime/this.totallifetime;
      DrawCircle(this.x, this.y, this.size * (this.lifetime/this.totallifetime), this.color)
      ctx.globalAlpha = 1;
      this.lifetime--;
    }
  }

  function ultRect(height, speed, color) {
    this.lifetime = 10;
    this.y = 200;
    this.height = height;
    this.speed = speed;
    this.color = color;
    this.draw = function () {
      ctx.beginPath();
      ctx.fillStyle = this.color;
      ctx.fillRect(0, this.y, 320, this.height);
      this.y -= this.speed;
      if (this.y < -30) {
        this.lifetime = 0;
      }
    }
  }

  function voidParticle() {
    this.lifetime = 10;
    this.x = Math.random() * 320;
    this.y = Math.random() * 200;
    this.hue = Math.cos(Date.now()) * Math.random() * 30 + 290;
    this.radius = 1;
    this.start = Date.now();
    this.draw = function () {
      let elapsed = Date.now() - this.start;
      DrawCircle(this.x, this.y, this.radius, `hsl(${this.hue}, 100%, 50%)`)
      if (elapsed < 250) {
        this.radius += 4;
      } else {
        this.radius--;
        if (this.radius <= 0) {
          this.lifetime = 0;
        }
      }
    }
  }

//#endregion
  //#region helperfunctions

  function setRange(input,min,max){
  return Math.min(Math.max(input,min),max);
 }

  function drawCrown(x,y,width,height,color){
    ctx.save();
    ctx.translate(x,y);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;

    ctx.beginPath();
    ctx.moveTo(-height/2,-width/2);
    ctx.lineTo(-height/2,width/2);
    ctx.lineTo(0,height/2);
    ctx.lineTo(height/2,width/2);
    ctx.lineTo(height/2,-width/2);
    let amount = width /6;
    for (let index = 0; index < 7; index++) {
      ctx.lineTo(index*-amount+width/2,index%2 == 0 ? -height/2 : -height/8);
    
    }
    ctx.lineWidth = 3
    ctx.stroke();
    ctx.fill();
    ctx.restore();
  }

  function drawArrow(x,y,width,height,rotation,color){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rotation);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(width,0);
    ctx.lineTo(width,height);
    ctx.lineTo(width*2,0);
    ctx.lineTo(width,-height);
    ctx.lineTo(width,0);
    
    ctx.lineWidth = 10
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function renderPath(x, y, path, color, type="fill") {
    ctx.fillStyle = color;
    ctx.save();
    ctx.translate(x, y);
    let ex = new Path2D(path);
    ctx.fill(ex);
    ctx.restore();
  }

  function DrawCircle(x, y, radius, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.fill();
  };

  function DrawStroke(x, y, radius, color, stroke) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = stroke;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.stroke();
  };

  function drawRect(x, y, height, width, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.fillRect(x, y, height, width);
  }

  function copyScreen(alpha) {
    let lightness = new Int8Array(engine.zone.lightness);
    let sat = new Int8Array(engine.zone.saturation);
    let hue = new Int16Array(engine.zone.hue);
    ctx.save();
    ctx.translate(screenAmbyOffsetX, screenAmbyOffsetY);
    for (let iZone = 0; iZone < 560; iZone++) {
      let iRow = Math.floor(iZone / 28);
      let iCol = iZone % 28;
      let iWidth = 320 / 28;
      let iHeight = 200 / 20;
      let iZx = iCol * iWidth;
      let iZy = iRow * iHeight;
      if(!inPublicEvent){
        ctx.fillStyle =
        "hsla(" +
        (forcedAmbyColor!=-1? forcedAmbyColor: hue[iZone]) +
        "," +
        (forcedAmbyColor!=-1? 80: sat[iZone]) +
        "%," +
        lightness[iZone] * keyScreenBrightness / 100 +
        "%, " +
        `${alpha}` +
        ")";
      ctx.fillRect(iZx, iZy, iWidth, iHeight);
      } else{
        ctx.fillStyle =
        "hsla(" +
        (forcedAmbyColor!=-1? forcedAmbyColor: setRange(hue[iZone],190,250)) +
        "," +
        (forcedAmbyColor!=-1? 80: sat[iZone] +30) +
        "%," +
        lightness[iZone] * keyScreenBrightness / 100 +
        "%, " +
        `${alpha}` +
        ")";
      ctx.fillRect(iZx, iZy, iWidth, iHeight);
      } 
    }
    ctx.restore();
  }

  //#endregion

  function hexToHSL(hex) {
    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);

    var r = parseInt(result[1], 16);
    var g = parseInt(result[2], 16);
    var b = parseInt(result[3], 16);

    (r /= 255), (g /= 255), (b /= 255);
    var max = Math.max(r, g, b),
      min = Math.min(r, g, b);
    var h,
      s,
      l = (max + min) / 2;

    if (max === min) {
      h = s = 0; // achromatic
    } else {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r:
          h = (g - b) / d + (g < b ? 6 : 0);
          break;
        case g:
          h = (b - r) / d + 2;
          break;
        case b:
          h = (r - g) / d + 4;
          break;
      }
      h /= 6;
    }

    s = s * 100;
    s = Math.round(s);
    l = l * 100;
    l = Math.round(l);
    h = Math.round(360 * h);

    return [h, s, l];
  }

  function StateHandler() {
    let stack = [];
    let state = null;

    let updateState = function () {
      if (stack.length > 0) {
        state = stack[stack.length - 1];
      } else {
        state = null;
      }
    };

    this.Push = function (newState) {
      stack.push(newState);
      updateState();
    };

    this.Pop = function () {
      stack.pop();
      updateState();
    };

    this.Process = function () {
      if (state != null) {
        state.Process();
      }
    };
  }

  function Meter(size, callback) {
    this.size = size;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    let values = [];

    this.setValue = function (updatedValue) {
      values.push(updatedValue);
      if (values.length > this.size) {
        values.shift();
      }

      for (let i = 0; i < values.length - 1; i++) {
        if (values[i] !== values[i + 1]) return;
      }
      if (this.value !== values[0]) {
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        callback();
      }
    };
  }

  function timedMeter(size, callback) {
    this.size = size;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    this.start = Date.now();
    this.elapsed = 0;
    let values = [];

    this.setValue = function (updatedValue) {
      values.push(updatedValue);
      this.elapsed = Date.now() - this.start;
      if (values.length > this.size) {
        values.shift();
      }

      for (let i = 0; i < values.length - 1; i++) {
        if (values[i] !== values[i + 1]) return;
      }
      if (this.value !== values[0]) {
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        this.start = Date.now();
        callback();
      }
    };
  }

  inMenu = true;
  stateHdlr.Push(new menuEffect())


  window.requestAnimationFrame(update);
</script>
