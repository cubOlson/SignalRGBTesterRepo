       VISION METERS
       Each meter captures a small region of the game screen and
       measures what percentage of its pixels match the given HSL
       range. The JS Meter class smooths readings over N frames
       before firing a callback.

       Detection strategy: every game state uses a POSITIVE meter
       (confirms the expected color IS present) paired with a
       NEGATIVE "Not" meter (confirms the region does NOT show that
       color during baseline/off state). A state is considered active
       only when positive is high AND negative is low, preventing
       false positives from ambient lighting or UI transitions.

       TESTER NOTE: If an effect never fires, first check the QA Tool
       — load a screenshot from the target resolution and verify the
       meter region actually captures the right pixels at the right
       color. Then adjust HSL ranges or region coordinates as needed.
       ═══════════════════════════════════════════════════════════ -->

<body style="margin: 0; padding: 0; background: #000;">
    <canvas id="exCanvas" width="320" height="200"></canvas>
</body>

<script>
    // ═══════════════════════════════════════════════════════════
    // CANVAS SETUP
    // SignalRGB renders this 320x200 canvas onto the device layout.
    // All effects draw to the hidden canvas, composited to ctx once per frame.
    // ═══════════════════════════════════════════════════════════
    const canvas = document.getElementById('exCanvas');
    const ctx    = canvas.getContext('2d');
    const width  = 320;
    const height = 200;

    const hiddenCanvas = document.createElement('canvas');
    hiddenCanvas.width  = 320;
    hiddenCanvas.height = 200;
    const hiddenCtx = hiddenCanvas.getContext('2d');

    let effects = [];

    //#region Update
    function update() {
        DrawRect(0, 0, 320, 200, 'black')
        backgroundHandler()

        buildingWhite1_Meter.setValue(engine.vision.buildingWhite1)
        buildingWhite2_Meter.setValue(engine.vision.buildingWhite2)
        buildingNotWhite_Meter.setValue(engine.vision.buildingNotWhite)
        downedWhite1_Meter.setValue(engine.vision.downedWhite1)
        downedWhite2_Meter.setValue(engine.vision.downedWhite2)
        downedRed_Meter.setValue(engine.vision.downedRed)
        drivingWhiteTank_Meter.setValue(engine.vision.drivingWhiteTank)
        drivingNotWhite_Meter.setValue(engine.vision.drivingNotWhite)
        healingWhite_Meter.setValue(engine.vision.healingWhite)
        healingNotWhite_Meter.setValue(engine.vision.healingNotWhite)
        healingWhiteBar_Meter.setValue(engine.vision.healingWhiteBar)
        inGameBlue_Meter.setValue(engine.vision.inGameBlue)
        inGameRed_Meter.setValue(engine.vision.inGameRed)
        inGameGreen_Meter.setValue(engine.vision.inGameGreen)
        killWhite1_Meter.setValue(engine.vision.killWhite1)
        killWhite2_Meter.setValue(engine.vision.killWhite2)
        killNotWhite_Meter.setValue(engine.vision.killNotWhite)
        lowAmmoRed_Meter.setValue(engine.vision.lowAmmoRed)
        lowAmmoNotRed_Meter.setValue(engine.vision.lowAmmoNotRed)
        pilotWhiteTank_Meter.setValue(engine.vision.pilotWhiteTank)
        pilotNotWhite_Meter.setValue(engine.vision.pilotNotWhite)
        revivedGreen_Meter.setValue(engine.vision.revivedGreen)
        revivedGreen2_Meter.setValue(engine.vision.revivedGreen2)
        teamAdvanceBlue_Meter.setValue(engine.vision.teamAdvanceBlue)
        teamAdvanceRed_Meter.setValue(engine.vision.teamAdvanceRed)
        teamAdvanceGreen_Meter.setValue(engine.vision.teamAdvanceGreen)
        winWhiteText_Meter.setValue(engine.vision.winWhiteText)
        winNotWhiteText_Meter.setValue(engine.vision.winNotWhiteText)
        winTeamRed_Meter.setValue(engine.vision.winTeamRed)
        winTeamBlue_Meter.setValue(engine.vision.winTeamBlue)
        winTeamGreen_Meter.setValue(engine.vision.winTeamGreen)
        zoneContestedBar_Meter.setValue(engine.vision.zoneContestedBar)
        zoneContestedWhiteText_Meter.setValue(engine.vision.zoneContestedWhiteText)
        parachuteGreyBar_Meter.setValue(engine.vision.parachuteGreyBar)
        parachuteWhiteConfirm_Meter.setValue(engine.vision.parachuteWhiteConfirm)
        parachuteNotGrey_Meter.setValue(engine.vision.parachuteNotGrey)

        // Driving is a sustained state — end it only after the tank icon has been
        // gone for a sustained stretch (the meter is noisy while driving), or the
        // moment you are back in the normal HUD. Prevents on/off flicker.
        if (drivingGoing) {
            if (gInGame) {
                drivingGoing = false
            } else if (drivingWhiteTank_Meter.value < 0.15) {
                if (++drivingLow > 20) drivingGoing = false
            } else {
                drivingLow = 0
            }
        }

        // Pilot — same sustained-state hysteresis as Driving.
        if (pilotGoing) {
            if (gInGame) {
                pilotGoing = false
            } else if (pilotWhiteTank_Meter.value < 0.15) {
                if (++pilotLow > 20) pilotGoing = false
            } else {
                pilotLow = 0
            }
        }

        effects.forEach(ele => { ele.draw() })
        effects = effects.filter(ele => !(ele.lifetime <= 0))

        ctx.drawImage(hiddenCanvas, 0, 0)
        window.requestAnimationFrame(update)
    }
    //#endregion

    //#region Meter Declarations

    // -------------------------------------------------------------------------
    // Meter objects
    // -------------------------------------------------------------------------
    const buildingWhite1_Meter = new Meter(5, buildingCallback)
    const buildingWhite2_Meter = new Meter(5, buildingCallback)
    const buildingNotWhite_Meter = new Meter(5, buildingCallback)
    const downedWhite1_Meter = new Meter(5, downedCallback)
    const downedWhite2_Meter = new Meter(5, downedCallback)
    const downedRed_Meter = new Meter(5, downedCallback)
    const drivingWhiteTank_Meter = new Meter(10, drivingCallback)
    const drivingNotWhite_Meter = new Meter(10, drivingCallback)
    const healingWhite_Meter = new Meter(10, healingCallback)
    const healingNotWhite_Meter = new Meter(10, healingCallback)
    const healingWhiteBar_Meter = new Meter(10, healingCallback)
    const inGameBlue_Meter = new Meter(3, inGameDetect)
    const inGameRed_Meter = new Meter(3, inGameDetect)
    const inGameGreen_Meter = new Meter(3, inGameDetect)
    const killWhite1_Meter = new Meter(5, killCallback)
    const killWhite2_Meter = new Meter(5, killCallback)
    const killNotWhite_Meter = new Meter(5, killCallback)
    const lowAmmoRed_Meter = new Meter(10, lowAmmoCallback)
    const lowAmmoNotRed_Meter = new Meter(10, lowAmmoCallback)
    const pilotWhiteTank_Meter = new Meter(10, pilotCallback)
    const pilotNotWhite_Meter = new Meter(10, pilotCallback)
    const revivedGreen_Meter = new Meter(5, revivedCallback)
    const revivedGreen2_Meter = new Meter(5, revivedCallback)
    const teamAdvanceBlue_Meter = new Meter(10, teamAdvanceBlueCallback)
    const teamAdvanceRed_Meter = new Meter(10, teamAdvanceRedCallback)
    const teamAdvanceGreen_Meter = new Meter(10, teamAdvanceGreenCallback)
    const winWhiteText_Meter = new Meter(3, winCallback)
    const winNotWhiteText_Meter = new Meter(3, winCallback)
    const winTeamRed_Meter = new Meter(3, winCallback)
    const winTeamBlue_Meter = new Meter(3, winCallback)
    const winTeamGreen_Meter = new Meter(3, winCallback)
    const zoneContestedBar_Meter = new Meter(5, zoneContestedCallback)
    const zoneContestedWhiteText_Meter = new Meter(5, zoneContestedCallback)
    const parachuteGreyBar_Meter = new Meter(3, parachuteCallback)
    const parachuteWhiteConfirm_Meter = new Meter(3, parachuteCallback)
    const parachuteNotGrey_Meter = new Meter(3, parachuteCallback)
    //#endregion

    //#region Callbacks

    // -------------------------------------------------------------------------
    // WARDOGS palette (shared by the effects) — three factions + HUD accents.
    // -------------------------------------------------------------------------
    const TEAM = {
        blue:  { h: 210, s: 90 },
        red:   { h: 2,   s: 92 },
        green: { h: 120, s: 78 }
    }
    const AMBER = { h: 42, s: 100 }   // objective / HUD
    const STEEL = { h: 210, s: 12 }   // metal

    // -------------------------------------------------------------------------
    // Global state flags (latches — set true on spawn, cleared when the meter
    // drops, so each event fires once per occurrence).
    // -------------------------------------------------------------------------
    let gInGame = false
    let killGoing = false
    let buildingGoing = false
    let downedGoing = false
    let healingGoing = false
    let revivedGoing = false
    let drivingGoing = false
    let drivingLow = 0                 // frames the tank icon has read low (hysteresis)
    let pilotGoing = false
    let pilotLow = 0                   // frames the pilot icon has read low (hysteresis)
    let lowAmmoGoing = false
    let teamAdvanceBlueGoing = false
    let teamAdvanceRedGoing = false
    let teamAdvanceGreenGoing = false
    let zoneContestedGoing = false
    let winGoing = false
    let parachuteGoing = false        // no meter yet; kept so Parachute() is valid

    // -------------------------------------------------------------------------
    // Callbacks — thresholds are QA-tunable starting points. Each follows the
    // POSITIVE-high + NEGATIVE("Not")-low pattern, gated on gInGame + its toggle.
    // -------------------------------------------------------------------------

function inGameDetect() {
        if ((inGameBlue_Meter.value >= 0.4 && inGameRed_Meter.value >= 0.4 && inGameGreen_Meter.value >= 0.4) && !gInGame) {
            gInGame = true
        } else if ((inGameBlue_Meter.value < 0.1 || inGameRed_Meter.value < 0.1 || inGameGreen_Meter.value < 0.1) && gInGame) {
            gInGame = false
        }
    }

    function killCallback() {
        if (gInGame && killOn && (killWhite1_Meter.value >= 0.95 && killWhite2_Meter.value >= 0.15 && killNotWhite_Meter.value < 0.1) && !killGoing && !downedGoing && !revivedGoing) {
            effects.push(new Kill())
            killGoing = true
        } else if (!gInGame || (killWhite1_Meter.value < 0.1 || killWhite2_Meter.value < 0.1)) {
            killGoing = false
        }
    }

    function buildingCallback() {
        if (gInGame && buildingOn && (buildingWhite1_Meter.value >= 0.95 && buildingWhite2_Meter.value >= 0.95 && buildingNotWhite_Meter.value < 0.1) && !buildingGoing && !downedGoing && !revivedGoing) {
            effects.push(new Building())
            buildingGoing = true
        } else if (!gInGame || (buildingWhite1_Meter.value < 0.1 && buildingWhite2_Meter.value < 0.1)) {
            buildingGoing = false
        }
    }

    // Downed has PRIORITY: it clears the screen on spawn, blocks every other
    // effect while active (via the `&& !downedGoing` guards below), and stays up
    // until the red clears (< 0.1) or you leave the game.
    function downedCallback() {
        if (gInGame && downedOn && (downedWhite1_Meter.value >= 0.95 && downedWhite2_Meter.value >= 0.95 && downedRed_Meter.value >= 0.95) && !downedGoing && !revivedGoing) {
            effects = []
            effects.push(new Downed())
            downedGoing = true
        } else if (!gInGame || downedRed_Meter.value < 0.1) {
            downedGoing = false
        }
    }

    // Spawns when the heal symbol appears; the healingWhiteBar meter then drives
    // how far the fill rises (see the Healing effect).
    function healingCallback() {
        if (gInGame && healingOn && (healingWhite_Meter.value >= 0.95 && healingWhiteBar_Meter.value >= 0.95 && healingNotWhite_Meter.value < 0.2) && !healingGoing && !downedGoing && !revivedGoing) {
            effects.push(new Healing())
            healingGoing = true
        } else if (!gInGame || healingWhite_Meter.value < 0.2) {
            healingGoing = false
        }
    }

    // Revived also has PRIORITY: it clears the screen on spawn (taking over from
    // a fading Downed) and blocks the other effects while active (via the
    // `&& !revivedGoing` guards). Not gated on downed â€” it IS the exit from it.
    function revivedCallback() {
        if (gInGame && revivedOn && (revivedGreen_Meter.value >= 0.95 && revivedGreen2_Meter.value >= 0.4) && !revivedGoing) {
            effects = []
            effects.push(new Revived())
            revivedGoing = true
        } else if (!gInGame || (revivedGreen_Meter.value < 0.1 && revivedGreen2_Meter.value < 0.1)) {
            revivedGoing = false
        }
    }

    // Driving is a SUSTAINED state and the tank icon reads noisily, so the
    // callback only STARTS it (on a clear rising edge); the end is handled with
    // hysteresis every frame in update() (drivingLow streak), so brief dips in
    // the meter don't flicker it on and off.
    function drivingCallback() {
        if (!gInGame && drivingOn && (drivingWhiteTank_Meter.value >= 0.4 && drivingNotWhite_Meter.value < 0.1) && !drivingGoing && !downedGoing && !revivedGoing) {
            effects.push(new Driving())
            drivingGoing = true
            drivingLow = 0
        }
    }

    // Pilot is a SUSTAINED state (like Driving) and reads noisily â€” the callback
    // only STARTS it on a clean rising edge; the end is handled with hysteresis
    // every frame in update() (pilotLow streak) so brief dips don't flicker it.
    function pilotCallback() {
        if (!gInGame && pilotOn && (pilotWhiteTank_Meter.value >= 0.4 && pilotNotWhite_Meter.value < 0.1) && !pilotGoing && !downedGoing && !revivedGoing) {
            effects.push(new Pilot())
            pilotGoing = true
            pilotLow = 0
        }
    }

    function lowAmmoCallback() {
        if (gInGame && lowAmmoOn && (lowAmmoRed_Meter.value >= 0.95 && lowAmmoNotRed_Meter.value < 0.1) && !lowAmmoGoing && !downedGoing && !revivedGoing) {
            effects.push(new LowAmmo())
            lowAmmoGoing = true
        } else if (!gInGame || lowAmmoRed_Meter.value < 0.1) {
            lowAmmoGoing = false
        }
    }

    function teamAdvanceBlueCallback() {
        if (gInGame && teamAdvanceOn && teamAdvanceBlue_Meter.value >= 0.95 && !teamAdvanceBlueGoing && !downedGoing && !revivedGoing) {
            effects.push(new TeamAdvanceBlue())
            teamAdvanceBlueGoing = true
        } else if (!gInGame || teamAdvanceBlue_Meter.value < 0.1) {
            teamAdvanceBlueGoing = false
        }
    }

    function teamAdvanceRedCallback() {
        if (gInGame && teamAdvanceOn && teamAdvanceRed_Meter.value >= 0.95 && !teamAdvanceRedGoing && !downedGoing && !revivedGoing) {
            effects.push(new TeamAdvanceRed())
            teamAdvanceRedGoing = true
        } else if (!gInGame || teamAdvanceRed_Meter.value < 0.1) {
            teamAdvanceRedGoing = false
        }
    }

    function teamAdvanceGreenCallback() {
        if (gInGame && teamAdvanceOn && teamAdvanceGreen_Meter.value >= 0.95 && !teamAdvanceGreenGoing && !downedGoing && !revivedGoing) {
            effects.push(new TeamAdvanceGreen())
            teamAdvanceGreenGoing = true
        } else if (!gInGame || teamAdvanceGreen_Meter.value < 0.1) {
            teamAdvanceGreenGoing = false
        }
    }

    function zoneContestedCallback() {
        if (gInGame && zoneContestedOn && (zoneContestedBar_Meter.value >= 0.4 && zoneContestedWhiteText_Meter.value >= 0.15) && !zoneContestedGoing && !downedGoing && !revivedGoing) {
            effects.push(new ZoneContested())
            zoneContestedGoing = true
        } else if (!gInGame || zoneContestedBar_Meter.value < 0.1) {
            zoneContestedGoing = false
        }
    }

    // Win screen: NOT gated on gInGame (the HUD is gone on the victory card).
    // The winning faction is chosen by whichever team-color meter reads high
    // (>= 0.8): red → red, green → green, otherwise blue. The Win effect is then
    // spawned in that team's color.
    // The team color and the "WINS" text do NOT cross threshold on the same
    // frame — the color usually appears first and can drop before the text
    // shows. So LATCH the winning color when a team meter reads high, then fire
    // once the text is present. Order-independent; cleared when the card is gone.
    let winPendingTeam = null
    function winCallback() {
        if (winTeamRed_Meter.value >= 0.8) winPendingTeam = TEAM.red
        else if (winTeamGreen_Meter.value >= 0.8) winPendingTeam = TEAM.green
        else if (winTeamBlue_Meter.value >= 0.8) winPendingTeam = TEAM.blue

        if (!gInGame && winOn && !winGoing && winPendingTeam && winWhiteText_Meter.value >= 0.4 && winNotWhiteText_Meter.value < 0.1) {
            effects.push(new Win(winPendingTeam))
            winGoing = true
        } else if (winGoing && winWhiteText_Meter.value < 0.1) {
            // Only reset AFTER the effect has fired and the card is gone â€” so the
            // latched color survives the gap before the text appears.
            winGoing = false
            winPendingTeam = null
        }
    }

    // Parachute deploy â€” grey deploy bar present (parachuteGreyBar) with its
    // negative pair low (parachuteNotGrey). parachuteWhiteConfirm is also fed and
    // available if you want to require the confirm too (add it to the condition).
    function parachuteCallback() {
        if (gInGame && parachuteOn && (parachuteGreyBar_Meter.value >= 0.95 && parachuteWhiteConfirm_Meter.value >= 0.95 && parachuteNotGrey_Meter.value < 0.1) && !parachuteGoing && !downedGoing && !revivedGoing) {
            effects.push(new Parachute())
            parachuteGoing = true
        } else if (!gInGame || parachuteGreyBar_Meter.value < 0.1) {
            parachuteGoing = false
        }
    }
    //#endregion

    //#region Background Modes
    // ═══════════════════════════════════════════════════════════
    // BACKGROUND SYSTEM
    // Eight modes selected by the backgroundMode control.
    // ═══════════════════════════════════════════════════════════
    let proBack = [0, 0, 0]
    function onbackColorChanged() {
        proBack = hexToHSL(backColor)
    }

    let audioEase = { sat: 0, lit: 0 }
    let gCycle = 0

    function updateAudioEase() {
        const targetDensity = engine.audio.density * 100
        audioEase.sat += (targetDensity - audioEase.sat) / 10
        audioEase.lit += (targetDensity - audioEase.lit) / 10
    }

    function getColorString(hue, sat, lit, alpha) {
        return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`
    }

    function updateColorCycle() {
        gCycle = (gCycle + 0.5) % 360
    }

    function backgroundHandler() {
        const alpha = ambienceAlpha / 100

        if (backgroundMode.includes('Color Cycle')) updateColorCycle()
        if (backgroundMode.includes('Audio'))       updateAudioEase()

        if (backgroundMode.includes('Ambience')) {
            if (backgroundMode === 'Ambience Audio Visualizer') {
                copyScreenAudio(alpha)
            } else {
                copyScreen(alpha)
            }
            return
        }

        const hue = proBack[0] + (backgroundMode.includes('Color Cycle') ? gCycle : 0)
        const sat = backgroundMode.includes('Audio') ? audioEase.sat * 0.33 + 66 : proBack[1]
        const lit = backgroundMode.includes('Audio') ? audioEase.lit * 0.9  + 10 : proBack[2]
        DrawRect(0, 0, 320, 200, getColorString(hue, sat, lit, alpha))
    }

    const ZONE_COLS   = 28
    const ZONE_ROWS   = 20
    const TOTAL_ZONES = ZONE_COLS * ZONE_ROWS

    function copyScreenAudio(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat       = new Int8Array(engine.zone.saturation)
        const hue       = new Int16Array(engine.zone.hue)
        const w = 320 / ZONE_COLS
        const h = 200 / ZONE_ROWS
        const satMultiplier = audioEase.sat / 200 + 0.5
        const litMultiplier = audioEase.lit / 100
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            hiddenCtx.fillStyle = getColorString(
                hue[iZone],
                sat[iZone] * satMultiplier,
                lightness[iZone] * litMultiplier,
                alpha
            )
            hiddenCtx.fillRect(col * w, row * h, w, h)
        }
    }

    function copyScreen(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat       = new Int8Array(engine.zone.saturation)
        const hue       = new Int16Array(engine.zone.hue)
        const w = 320 / ZONE_COLS
        const h = 200 / ZONE_ROWS
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const finalHue = backgroundMode === 'Custom Ambience'
                ? proBack[0]
                : hue[iZone] + (backgroundMode === 'Color Cycle Ambience' ? gCycle : 0)
            hiddenCtx.fillStyle = getColorString(finalHue, sat[iZone], lightness[iZone], alpha)
            hiddenCtx.fillRect(col * w, row * h, w, h)
        }
    }
    //#endregion

    //#region Helper Functions
    // ═══════════════════════════════════════════════════════════
    // HELPER FUNCTIONS — draw primitives target hiddenCtx
    // ═══════════════════════════════════════════════════════════
    function DrawRect(x, y, w, h, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.fillRect(x, y, w, h)
    }

    function strokeRect(x, y, w, h, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.rect(x, y, w, h)
        hiddenCtx.stroke()
    }

    function DrawCircle(x, y, radius, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
        hiddenCtx.fill()
    }

    function DrawStroke(x, y, radius, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
        hiddenCtx.stroke()
    }

    function DrawLine(start, end, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.moveTo(start[0], start[1])
        hiddenCtx.lineTo(end[0], end[1])
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.stroke()
    }

    function DrawArc(x, y, start, end, radius, direction, color) {
        hiddenCtx.beginPath()
        hiddenCtx.arc(x, y, radius, start, end, direction)
        hiddenCtx.fillStyle = color
        hiddenCtx.fill()
    }

    function DrawEllipse(x, y, w, h, rotation, color) {
        hiddenCtx.beginPath()
        hiddenCtx.ellipse(x, y, w, h, rotation, 0, Math.PI * 2)
        hiddenCtx.fillStyle = color
        hiddenCtx.fill()
    }

    function DrawTriangle(x1, y1, x2, y2, x3, y3, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.moveTo(x1, y1)
        hiddenCtx.lineTo(x2, y2)
        hiddenCtx.lineTo(x3, y3)
        hiddenCtx.lineTo(x1, y1)
        hiddenCtx.fill()
    }

    function DrawPath(x, y, path, color, scaleX, scaleY) {
        hiddenCtx.fillStyle = color
        hiddenCtx.save()
        hiddenCtx.translate(x, y)
        hiddenCtx.scale(scaleX, scaleY)
        hiddenCtx.fill(new Path2D(path))
        hiddenCtx.restore()
    }

    function hexToRgb(hex) {
        var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex)
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : null
    }

    function hexToHSL(hex) {
        const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || []
        const rgb = [r, g, b].map(x => parseInt(x, 16) / 255)
        const max = Math.max(...rgb)
        const min = Math.min(...rgb)
        const l = (max + min) / 2
        if (max === min) return [0, 0, Math.round(l * 100)]
        const d = max - min
        const s = l > 0.5 ? d / (2 - max - min) : d / (max + min)
        let h
        const [nr, ng, nb] = rgb
        if      (max === nr) h = (ng - nb) / d + (ng < nb ? 6 : 0)
        else if (max === ng) h = (nb - nr) / d + 2
        else                 h = (nr - ng) / d + 4
        return [Math.round(h * 60), Math.round(s * 100), Math.round(l * 100)]
    }

    // Meter(size, callback): frame-stabilizing debouncer for vision signals.
    function Meter(size, callback) {
        this.size = size
        this.value = 0
        this.diff = 0
        this.increased = false
        this.decreased = false
        var values = []
        this.setValue = function (updatedValue) {
            values.push(updatedValue)
            if (values.length > this.size) values.shift()
            for (var i = 0; i < values.length - 1; i++) {
                if (values[i] !== values[i + 1]) return
            }
            if (this.value !== values[0]) {
                this.diff = Math.abs(this.value - values[0])
                this.increased = this.value < values[0]
                this.decreased = this.value > values[0]
                this.value = values[0]
                callback()
            }
        }
    }

    // ── Kill ──────────────────────────────────────────────────────────
    function Kill() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.motes = []
        for (var i = 0; i < 26; i++) {
            var ang = Math.random() * Math.PI * 2
            var sp = 3 + Math.random() * 6
            this.motes.push({ x: 160, y: 100, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, size: 2 + Math.random() * 4 })
        }
        this.draw = function () {
            this.frame++
            const HOLD = 46
            if ((!killGoing || this.frame > HOLD) && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.08
                if (this.alpha <= 0) { this.alpha = 0; this.lifetime = 0; return }
            } else if (this.alpha < 1) {
                this.alpha += 0.35
                if (this.alpha > 1) this.alpha = 1
            }
            var a = this.alpha, cx = 160, cy = 100
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)
            var punch = Math.max(0, 1 - this.frame / 26)
            var fg = hiddenCtx.createRadialGradient(cx, cy, 10, cx, cy, 260)
            fg.addColorStop(0, `hsla(${TEAM.red.h}, ${TEAM.red.s}%, ${44 + punch * 12}%, ${a * (0.5 + punch * 0.5)})`)
            fg.addColorStop(0.5, `hsla(0, 90%, 24%, ${a * (0.34 + punch * 0.4)})`)
            fg.addColorStop(1, `hsla(0, 90%, 8%, 0)`)
            hiddenCtx.fillStyle = fg
            hiddenCtx.fillRect(0, 0, 320, 200)
            var ringP = this.frame / 18
            if (ringP < 1) {
                DrawStroke(cx, cy, 8 + ringP * 150, `hsla(0, 100%, 70%, ${a * (1 - ringP)})`, 18 * (1 - ringP) + 5)
            }
            for (var i = 0; i < this.motes.length; i++) {
                var m = this.motes[i]
                m.x += m.vx; m.y += m.vy; m.vx *= 0.95; m.vy *= 0.95
                DrawCircle(m.x, m.y, m.size, `hsla(0, 0%, 90%, ${a * punch})`)
            }
            var form = Math.min(1, this.frame / 8)
            var eForm = 1 - Math.pow(1 - form, 3)
            hiddenCtx.save()
            hiddenCtx.translate(cx, cy)
            hiddenCtx.scale(eForm * 1.5, eForm * 1.5)     // larger skull
            var WHITE = `hsla(0, 0%, 97%, ${a})`
            hiddenCtx.beginPath()
            hiddenCtx.moveTo(-30, 6)
            hiddenCtx.quadraticCurveTo(-34, -40, 0, -40)
            hiddenCtx.quadraticCurveTo(34, -40, 30, 6)
            hiddenCtx.quadraticCurveTo(28, 20, 16, 22)
            hiddenCtx.lineTo(-16, 22)
            hiddenCtx.quadraticCurveTo(-28, 20, -30, 6)
            hiddenCtx.closePath()
            hiddenCtx.fillStyle = WHITE
            hiddenCtx.fill()
            hiddenCtx.beginPath()
            hiddenCtx.moveTo(-15, 22); hiddenCtx.lineTo(-15, 34); hiddenCtx.lineTo(15, 34); hiddenCtx.lineTo(15, 22); hiddenCtx.closePath()
            hiddenCtx.fillStyle = WHITE
            hiddenCtx.fill()
            for (var t = -2; t <= 2; t++) { DrawLine([t * 6, 22], [t * 6, 34], `hsla(0, 0%, 0%, ${a})`, 3.5) }
            for (var s = -1; s <= 1; s += 2) {
                var eg = hiddenCtx.createRadialGradient(s * 13, -12, 0, s * 13, -12, 12)
                eg.addColorStop(0, `hsla(0, 100%, 55%, ${a})`)
                eg.addColorStop(1, `hsla(0, 100%, 20%, 0)`)
                hiddenCtx.fillStyle = eg
                hiddenCtx.beginPath(); hiddenCtx.arc(s * 13, -12, 12, 0, Math.PI * 2); hiddenCtx.fill()
                DrawCircle(s * 13, -12, 6.5, `hsla(0, 0%, 4%, ${a})`)
            }
            DrawTriangle(0, -6, -5, 6, 5, 6, `hsla(0, 0%, 4%, ${a})`)
            hiddenCtx.restore()
        }
    }

        this.draw = function () {
            this.frame++
            // No fixed timeout — Downed has priority and stays up until its latch

            if (!downedGoing && !this.fadingOut) this.fadingOut = true

    // ── Healing ─────────────────────────────────────────────────────────
    function Healing() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.draw = function () {
            this.frame++
            const HOLD = 170
            if ((!healingGoing || this.frame > HOLD) && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.025
                if (this.alpha <= 0) { this.alpha = 0; this.lifetime = 0; return }
            } else if (this.alpha < 1) {
                this.alpha += 0.03
                if (this.alpha > 1) this.alpha = 1
            }
            var a = this.alpha, cx = 160, cy = 100
            var pulse = 0.5 + 0.5 * Math.sin(this.frame * 0.08)
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)
            var grad = hiddenCtx.createRadialGradient(cx, cy, 6, cx, cy, 150)
            grad.addColorStop(0, `hsla(190, 12%, ${42 + pulse * 12}%, ${a * 0.45})`)
            grad.addColorStop(0.45, `hsla(200, 14%, 20%, ${a * 0.28})`)
            grad.addColorStop(1, `hsla(210, 20%, 6%, 0)`)
            hiddenCtx.fillStyle = grad
            hiddenCtx.fillRect(0, 0, 320, 200)
            var R = 64, T = 32
            // Fill rises smoothly bottom → top, holds full, then repeats.
            var PERIOD = 165
            var ph = this.frame % PERIOD
            var fill = Math.min(1, ph / 125)
            var eFill = fill
            hiddenCtx.save()
            hiddenCtx.translate(cx, cy)
            var sc = 0.94 + pulse * 0.06
            hiddenCtx.scale(sc, sc)
            DrawCircle(0, 0, 80, `hsla(0, 0%, 0%, ${a})`)
            DrawStroke(0, 0, 80, `hsla(0, 0%, 82%, ${a})`, 5)
            // Medical symbol: vertical bar + an X (three bars crossing at center),
            // fills up with white from the bottom (bandage wraps).
            var dgl = R * 0.72
            function addBar(x1, y1, x2, y2, w) {
                var vx = x2 - x1, vy = y2 - y1, L = Math.hypot(vx, vy)
                var nx = -vy / L * (w / 2), ny = vx / L * (w / 2)
                hiddenCtx.moveTo(x1 + nx, y1 + ny)
                hiddenCtx.lineTo(x2 + nx, y2 + ny)
                hiddenCtx.lineTo(x2 - nx, y2 - ny)
                hiddenCtx.lineTo(x1 - nx, y1 - ny)
                hiddenCtx.closePath()
            }
            function symbolPath() {
                hiddenCtx.beginPath()
                addBar(0, -R, 0, R, T)
                addBar(-dgl, -dgl, dgl, dgl, T)
                addBar(dgl, -dgl, -dgl, dgl, T)
            }
            symbolPath()
            hiddenCtx.fillStyle = `hsla(${STEEL.h}, ${STEEL.s}%, 30%, ${a})`
            hiddenCtx.fill('nonzero')
            var topFill = R - eFill * (R * 2)
            hiddenCtx.save()
            symbolPath()
            hiddenCtx.clip('nonzero')
            hiddenCtx.fillStyle = `hsla(0, 0%, 97%, ${a})`
            hiddenCtx.fillRect(-R, topFill, R * 2, R - topFill)
            hiddenCtx.beginPath()
            hiddenCtx.rect(-R, topFill, R * 2, R - topFill)
            hiddenCtx.clip()
            hiddenCtx.strokeStyle = `hsla(200, 8%, 68%, ${a * 0.8})`
            hiddenCtx.lineWidth = 3
            for (var yy = -R; yy <= R; yy += 9) {
                hiddenCtx.beginPath()
                hiddenCtx.moveTo(-R, yy)
                hiddenCtx.lineTo(R, yy)
                hiddenCtx.stroke()
            }
            hiddenCtx.restore()
            if (fill < 1) {
                hiddenCtx.save()
                symbolPath()
                hiddenCtx.clip('nonzero')
                DrawLine([-R, topFill], [R, topFill], `hsla(0, 0%, 96%, ${a})`, 3)
                hiddenCtx.restore()
            }
            hiddenCtx.restore()
        }
    }

        this.draw = function () {
            this.frame++

            if (this.fadingOut) {
                this.alpha -= 0.025

            var arm = 20, len = 47
            DrawRect(-arm, -len, arm * 2, len * 2, `hsla(0, 0%, 97%, ${a})`)

    // ── Building (hammer) ─────────────────────────────────────────────────
    function Building() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.build = 0
        this.segBorn = []
        this.sparks = []
        this.rings = []
        this.prevP = 1
        this.lastHit = -100
        this.hitY = 0
        const ANVX = 112, ANVY = 162
        const P = { x: 222, y: 152 }
        const segH = 18
        const ARC = 1.6
        const SWING = 46
        const MAXSEG = 5
        this.topY = function () { return ANVY - this.build * segH }
        this.onImpact = function () {
            var ty = this.topY() - 2
            this.lastHit = this.frame
            this.hitY = ty
            this.rings.push({ r: 6, amp: 1, y: ty })
            for (var s = 0; s < 20; s++) {
                var ang = -Math.PI / 2 + (Math.random() - 0.5) * 2.4
                var sp = 2 + Math.random() * 5.5
                this.sparks.push({ x: ANVX + (Math.random() - 0.5) * 20, y: ty, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, size: 1.5 + Math.random() * 3, life: 1 })
            }
            if (this.build < MAXSEG) { this.segBorn[this.build] = this.frame; this.build++ }
        }
        this.draw = function () {
            this.frame++
            const HOLD = 210
            if ((!buildingGoing || this.frame > HOLD) && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.03
                if (this.alpha <= 0) { this.alpha = 0; this.lifetime = 0; return }
            } else if (this.alpha < 1) {
                this.alpha += 0.05
                if (this.alpha > 1) this.alpha = 1
            }
            var a = this.alpha
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)
            for (var gx = 0; gx <= 320; gx += 32) DrawLine([gx, 0], [gx, 200], `hsla(${STEEL.h}, ${STEEL.s}%, 30%, ${a * 0.16})`, 1)
            for (var gy = 0; gy <= 200; gy += 32) DrawLine([0, gy], [320, gy], `hsla(${STEEL.h}, ${STEEL.s}%, 30%, ${a * 0.16})`, 1)
            var Tx = ANVX, Ty = this.topY() - 2
            var dx = Tx - P.x, dy = Ty - P.y
            var R = Math.hypot(dx, dy)
            var aim = Math.atan2(dy, dx)
            var phase = (this.frame % SWING) / SWING
            var lift
            if (phase < 0.55) { lift = 1 - Math.pow(1 - phase / 0.55, 2) }
            else { var t = (phase - 0.55) / 0.45; lift = 1 - t * t }
            var theta = aim + ARC * lift
            if (this.prevP > 0.9 && phase < 0.15) this.onImpact()
            this.prevP = phase
            DrawRect(ANVX - 50, ANVY, 100, 24, `hsla(${STEEL.h}, ${STEEL.s}%, 16%, ${a})`)
            strokeRect(ANVX - 50, ANVY, 100, 24, `hsla(${STEEL.h}, ${STEEL.s}%, 34%, ${a})`, 2)
            for (var i = 0; i < this.build; i++) {
                var age = this.frame - this.segBorn[i]
                var snap = Math.min(1, age / 6)
                var eSnap = 1 - Math.pow(1 - snap, 3)
                var segLift = (1 - eSnap) * 8
                var sy = ANVY - (i + 1) * segH + segLift
                var sw = 88 - i * 5
                var sx = ANVX - sw / 2
                var fresh = Math.max(0, 1 - age / 10)
                DrawRect(sx, sy, sw, segH - 2, `hsla(${AMBER.h}, 90%, ${18 + fresh * 22}%, ${a * eSnap})`)
                strokeRect(sx, sy, sw, segH - 2, `hsla(${AMBER.h}, ${AMBER.s}%, ${55 + fresh * 25}%, ${a * eSnap})`, 2)
                DrawLine([sx, sy], [sx + sw, sy + segH - 2], `hsla(${AMBER.h}, 90%, 45%, ${a * eSnap * 0.7})`, 1.5)
                DrawLine([sx + sw, sy], [sx, sy + segH - 2], `hsla(${AMBER.h}, 90%, 45%, ${a * eSnap * 0.7})`, 1.5)
            }
            var flash = Math.max(0, 1 - (this.frame - this.lastHit) / 9)
            if (flash > 0) {
                var fgb = hiddenCtx.createRadialGradient(ANVX, this.hitY, 2, ANVX, this.hitY, 66)
                fgb.addColorStop(0, `hsla(${AMBER.h}, 100%, 75%, ${a * flash})`)
                fgb.addColorStop(0.5, `hsla(${AMBER.h}, 100%, 50%, ${a * flash * 0.5})`)
                fgb.addColorStop(1, `hsla(${AMBER.h}, 100%, 40%, 0)`)
                hiddenCtx.fillStyle = fgb
                hiddenCtx.beginPath(); hiddenCtx.arc(ANVX, this.hitY, 66, 0, Math.PI * 2); hiddenCtx.fill()
            }
            for (var i = 0; i < this.rings.length; i++) {
                var rg = this.rings[i]
                rg.r += 5; rg.amp -= 0.06
                DrawStroke(ANVX, rg.y, rg.r, `hsla(${AMBER.h}, 100%, 65%, ${a * Math.max(0, rg.amp)})`, 3)
            }
            this.rings = this.rings.filter(r => r.amp > 0 && r.r < 150)
            for (var i = 0; i < this.sparks.length; i++) {
                var sp = this.sparks[i]
                sp.x += sp.vx; sp.y += sp.vy; sp.vy += 0.22; sp.life -= 0.03
                var hue = AMBER.h + (Math.random() < 0.3 ? 10 : 0)
                DrawCircle(sp.x, sp.y, sp.size, `hsla(${hue}, 100%, ${60 + sp.life * 30}%, ${a * Math.max(0, sp.life)})`)
            }
            this.sparks = this.sparks.filter(s => s.life > 0)
            var headX = P.x + Math.cos(theta) * R
            var headY = P.y + Math.sin(theta) * R
            DrawLine([P.x, P.y], [headX, headY], `hsla(28, 45%, 26%, ${a})`, 11)
            DrawLine([P.x, P.y], [headX, headY], `hsla(34, 40%, 42%, ${a})`, 4)
            DrawCircle(P.x, P.y, 9, `hsla(${STEEL.h}, ${STEEL.s}%, 22%, ${a})`)
            DrawStroke(P.x, P.y, 9, `hsla(${STEEL.h}, ${STEEL.s}%, 45%, ${a})`, 3)
            hiddenCtx.save()
            hiddenCtx.translate(headX, headY)
            hiddenCtx.rotate(theta)
            DrawRect(-16, -34, 34, 68, `hsla(${STEEL.h}, ${STEEL.s}%, 30%, ${a})`)
            strokeRect(-16, -34, 34, 68, `hsla(${STEEL.h}, ${STEEL.s}%, 55%, ${a})`, 2)
            DrawRect(12, -34, 6, 68, `hsla(${STEEL.h}, ${STEEL.s}%, 68%, ${a})`)
            hiddenCtx.restore()
        }
    }

    // ── Driving (top-down tank) ───────────────────────────────────────────
    function Driving() {
        this.frame = 0; this.alpha = 0; this.fadingOut = false
        this.dust = []; this.tracks = []
        this.draw = function () {
            this.frame++
            // Sustained state — persists while driving (no fixed timeout); ends
            // when the latch clears (managed with hysteresis in update()).
            if (!drivingGoing && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) { this.alpha -= 0.035; if (this.alpha <= 0) { this.alpha = 0; this.lifetime = 0; return } }
            else if (this.alpha < 1) { this.alpha += 0.05; if (this.alpha > 1) this.alpha = 1 }
            var a = this.alpha, vy = 100
            var vx = ((this.frame * 3.2) % 500) - 50
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)
            if (this.frame % 3 === 0) {
                this.tracks.push({ x: vx - 42, life: 1 })
                for (var k = 0; k < 3; k++) this.dust.push({ x: vx - 48, y: vy + (Math.random() - 0.5) * 56, vx: -(0.6 + Math.random() * 1.8), vy: (Math.random() - 0.5) * 0.7, size: 4 + Math.random() * 7, life: 1 })
            }
            for (var i = this.tracks.length - 1; i >= 0; i--) {
                var tk = this.tracks[i]; tk.life -= 0.008
                if (tk.life <= 0) { this.tracks.splice(i, 1); continue }
                DrawRect(tk.x, vy - 25, 8, 6, `hsla(30, 25%, 40%, ${a * tk.life * 0.6})`)
                DrawRect(tk.x, vy + 19, 8, 6, `hsla(30, 25%, 40%, ${a * tk.life * 0.6})`)
            }
            for (var i = this.dust.length - 1; i >= 0; i--) {
                var d = this.dust[i]; d.x += d.vx; d.y += d.vy; d.life -= 0.02
                if (d.life <= 0) { this.dust.splice(i, 1); continue }
                DrawCircle(d.x, d.y, d.size, `hsla(40, 30%, 55%, ${a * d.life * 0.4})`)
            }
            DrawRect(vx - 40, vy - 32, 80, 11, `hsla(${STEEL.h}, ${STEEL.s}%, 22%, ${a})`)
            DrawRect(vx - 40, vy + 21, 80, 11, `hsla(${STEEL.h}, ${STEEL.s}%, 22%, ${a})`)
            DrawRect(vx - 36, vy - 27, 72, 54, `hsla(72, 25%, 32%, ${a})`)
            strokeRect(vx - 36, vy - 27, 72, 54, `hsla(72, 25%, 50%, ${a})`, 3)
            DrawCircle(vx, vy, 18, `hsla(72, 22%, 42%, ${a})`)

    // ── Pilot (helicopter) ────────────────────────────────────────────────
    function Pilot() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.draw = function () {
            this.frame++
            // Sustained state — persists while piloting (no fixed timeout); ends
            // when the latch clears (managed with hysteresis in update()).
            if (!pilotGoing && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.03
                if (this.alpha <= 0) { this.alpha = 0; this.lifetime = 0; return }
            } else if (this.alpha < 1) {
                this.alpha += 0.05
                if (this.alpha > 1) this.alpha = 1
            }
            var a = this.alpha, cx = 160, cy = 100
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)
            var bg = hiddenCtx.createRadialGradient(cx, cy, 20, cx, cy, 220)
            bg.addColorStop(0, `hsla(200, 45%, 12%, ${a * 0.5})`)
            bg.addColorStop(1, `hsla(210, 50%, 3%, 0)`)
            hiddenCtx.fillStyle = bg
            hiddenCtx.fillRect(0, 0, 320, 200)
            var rot = this.frame * 0.60
            hiddenCtx.save()
            hiddenCtx.translate(cx, cy)
            hiddenCtx.rotate(rot)
            for (var i = 0; i < 3; i++) {
                hiddenCtx.rotate((Math.PI * 2) / 3)
                var bg2 = hiddenCtx.createLinearGradient(0, 0, 260, 0)
                bg2.addColorStop(0, `hsla(${STEEL.h}, ${STEEL.s}%, 42%, ${a * 0.6})`)
                bg2.addColorStop(1, `hsla(${STEEL.h}, ${STEEL.s}%, 42%, 0)`)
                hiddenCtx.fillStyle = bg2
                hiddenCtx.fillRect(0, -13, 260, 26)
            }
            hiddenCtx.restore()
            DrawCircle(cx, cy, 16, `hsla(${STEEL.h}, ${STEEL.s}%, 30%, ${a})`)
            DrawStroke(cx, cy, 16, `hsla(${STEEL.h}, ${STEEL.s}%, 62%, ${a})`, 4)
            var lock = Math.min(1, this.frame / 24)
            var eLock = 1 - Math.pow(1 - lock, 3)
            var rr = 86 - eLock * 20
            var rc = `hsla(${AMBER.h}, 100%, 62%, ${a})`
            DrawStroke(cx, cy, rr, rc, 10)
            for (var q = 0; q < 4; q++) {
                var ang = q * Math.PI / 2 + Math.PI / 4
                var bx = cx + Math.cos(ang) * rr, by = cy + Math.sin(ang) * rr
                var ex = cx + Math.cos(ang) * (rr + 18), ey = cy + Math.sin(ang) * (rr + 18)
                DrawLine([bx, by], [ex, ey], rc, 10)
            }
            DrawLine([cx - rr - 10, cy], [cx - rr + 12, cy], rc, 8)
            DrawLine([cx + rr - 12, cy], [cx + rr + 10, cy], rc, 8)
            DrawLine([cx, cy - rr - 10], [cx, cy - rr + 12], rc, 8)
            DrawLine([cx, cy + rr - 12], [cx, cy + rr + 10], rc, 8)
            var off = (this.frame * 2) % 24
            for (var y = -24; y < 200; y += 24) {
                var ty = y + off
                DrawLine([298, ty], [314, ty], `hsla(${AMBER.h}, 95%, 58%, ${a * 0.9})`, 4)
            }
        }
    }

    // ── TeamAdvance ───────────────────────────────────────────────────────
    // One shared design; three faction-locked variants each with their own
    // latch (blue/red/green), passed in as isGoing().
    function TeamAdvanceBase(self, team, isGoing) {
        self.frame = 0
        self.alpha = 0
        self.fadingOut = false
        self.draw = function () {
            self.frame++
            const HOLD = 200
            if ((!isGoing() || self.frame > HOLD) && !self.fadingOut) self.fadingOut = true
            if (self.fadingOut) {
                self.alpha -= 0.04
                if (self.alpha <= 0) { self.alpha = 0; self.lifetime = 0; return }
            } else if (self.alpha < 1) {
                self.alpha += 0.06
                if (self.alpha > 1) self.alpha = 1
            }
            var a = self.alpha
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)
            var wash = hiddenCtx.createLinearGradient(0, 0, 320, 0)
            wash.addColorStop(0, `hsla(${team.h}, ${team.s}%, 22%, ${a * 0.4})`)
            wash.addColorStop(1, `hsla(${team.h}, ${team.s}%, 6%, 0)`)
            hiddenCtx.fillStyle = wash
            hiddenCtx.fillRect(0, 0, 320, 200)
            var speed = 3.0
            var cycle = 340
            var CH = 20, STK = 8
            var STEP = 22
            var GROUP_W = 2 * STEP + CH
            var leadGap = GROUP_W + 12
            var groupPitch = 70
            var rows = [40, 80, 120, 160]
            var lead = (self.frame * speed) % cycle
            for (var n = -1; n <= 1; n++) {
                var fx = lead + n * cycle
                for (var g = 0; g < 4; g++) {
                    var gx = fx - leadGap - g * groupPitch
                    var ry = rows[g]
                    for (var k = 0; k < 3; k++) {
                        var ax = gx + k * STEP
                        if (ax < -30 || ax > 330) continue
                        var fade = 0.5 + k * 0.22
                        DrawLine([ax, ry - CH], [ax + CH, ry], `hsla(${team.h}, ${team.s}%, 60%, ${a * fade})`, STK)
                        DrawLine([ax + CH, ry], [ax, ry + CH], `hsla(${team.h}, ${team.s}%, 60%, ${a * fade})`, STK)
                    }
                }
                if (fx > -30 && fx < 350) {
                    var fgl = hiddenCtx.createLinearGradient(fx - 34, 0, fx + 4, 0)
                    fgl.addColorStop(0, `hsla(${team.h}, ${team.s}%, 55%, 0)`)
                    fgl.addColorStop(1, `hsla(${team.h}, ${team.s}%, 70%, ${a * 0.7})`)
                    hiddenCtx.fillStyle = fgl
                    hiddenCtx.fillRect(fx - 34, 0, 38, 200)
                    DrawLine([fx, 0], [fx, 200], `hsla(${team.h}, 100%, 82%, ${a * 0.9})`, 4)
                }
            }
        }
    }
    function TeamAdvanceBlue()  { TeamAdvanceBase(this, TEAM.blue,  function () { return teamAdvanceBlueGoing }) }
    function TeamAdvanceRed()   { TeamAdvanceBase(this, TEAM.red,   function () { return teamAdvanceRedGoing }) }
    function TeamAdvanceGreen() { TeamAdvanceBase(this, TEAM.green, function () { return teamAdvanceGreenGoing }) }

    function Win(team) {
        var self = this
        self.frame = 0
        self.alpha = 0
        self.fadingOut = false
        self.sparks = []
        for (var i = 0; i < 120; i++) {
            var ang = Math.random() * Math.PI * 2
            var sp = 5 + Math.random() * 13
            self.sparks.push({ x: 160, y: 100, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, size: 6 + Math.random() * 4, born: Math.floor(Math.random() * 30), warm: Math.random() < 0.4, tw: Math.random() * 6.28 })
        }
        self.draw = function () {
            self.frame++
            const HOLD = 150
            if ((!winGoing || self.frame > HOLD) && !self.fadingOut) self.fadingOut = true
            if (self.fadingOut) {
                self.alpha -= 0.016
                if (self.alpha <= 0) { self.alpha = 0; self.lifetime = 0; return }
            } else if (self.alpha < 1) {
                self.alpha += 0.04
                if (self.alpha > 1) self.alpha = 1
            }
            var a = self.alpha, cx = 160, cy = 100
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)
            var ringP = self.frame / 34
            if (ringP < 1) {
                DrawStroke(cx, cy, 20 + ringP * 120, `hsla(${team.h}, 100%, 55%, ${a * (1 - ringP)})`, 24 * (1 - ringP) + 5)
            }
            for (var i = 0; i < self.sparks.length; i++) {
                var s = self.sparks[i]
                if (self.frame < s.born) continue
                var age = self.frame - s.born
                s.vx *= 0.94
                s.vy *= 0.94
                s.vy -= Math.max(0, age - 80) * 0.011
                s.x += s.vx
                s.y += s.vy
                var twk = 0.7 + 0.3 * Math.sin(self.frame * 0.2 + s.tw)
                DrawCircle(s.x, s.y, s.size, s.warm ? `hsla(${team.h}, 100%, 55%, ${a * twk})` : `hsla(0, 0%, 100%, ${a * twk})`)
            }
            hiddenCtx.save()
            hiddenCtx.translate(cx, cy)
            drawShield(a, team)
            hiddenCtx.restore()
        }
    }

    // ── Parachute ── deploy: canopy drops in and sways, wind streaking up. ──
    function Parachute() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.draw = function () {
            this.frame++
            // Persists while deploying — no fixed timeout. Fades when the latch
            // clears (parachuteCallback clears it on greyBar < 0.1, or !gInGame).
            if (!parachuteGoing && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.03
                if (this.alpha <= 0) { this.alpha = 0; this.lifetime = 0; return }
            } else if (this.alpha < 1) {
                this.alpha += 0.04
                if (this.alpha > 1) this.alpha = 1
            }
            var a = this.alpha, cx = 160
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)
            for (var i = 0; i < 9; i++) {
                var wx = 22 + i * 34
                var wlen = 18 + (i % 3) * 12
                var wspd = 2.4 + (i % 4) * 0.7
                var wy = (200 + wlen) - ((this.frame * wspd + i * 57) % (200 + wlen))
                DrawLine([wx, wy], [wx, wy + wlen], `hsla(100, 100%, 100%, ${a * 0.30})`, 6)
            }
            var drop = Math.min(1, this.frame / 60)
            var eDrop = 1 - Math.pow(1 - drop, 3)
            var cy = -30 + eDrop * 90
            var sway = Math.sin(this.frame * 0.045) * 0.16
            hiddenCtx.save()
            hiddenCtx.translate(cx, cy)
            hiddenCtx.rotate(sway)
            var cw = 82, ch = 46
            var hy = 74
            var pts = [-cw * 0.8, -cw * 0.4, cw * 0.4, cw * 0.8]
            for (var i = 0; i < pts.length; i++) {
                DrawLine([pts[i], 0], [0, hy], `hsla(205, 20%, 78%, ${a})`, 3)
            }
            var dome = hiddenCtx.createLinearGradient(0, -ch, 0, 0)
            dome.addColorStop(0, `hsla(0, 0%, 96%, ${a})`)
            dome.addColorStop(1, `hsla(205, 35%, 72%, ${a})`)
            hiddenCtx.fillStyle = dome
            hiddenCtx.beginPath()
            hiddenCtx.ellipse(0, 0, cw, ch, 0, Math.PI, 2 * Math.PI)
            hiddenCtx.closePath()
            hiddenCtx.fill()
            var lobes = 4
            for (var i = 0; i < lobes; i++) {
                var x0 = -cw + (i * 2) * (cw / lobes)
                var x1 = -cw + (i * 2 + 2) * (cw / lobes)
                DrawArc((x0 + x1) / 2, 0, 0, Math.PI, (x1 - x0) / 2, false, `hsla(205, 35%, 68%, ${a})`)
            }
            var DK = `hsla(210, 28%, 20%, ${a})`
            DrawCircle(0, hy + 8, 9, DK)
            DrawRect(-8, hy + 15, 16, 28, DK)
            DrawLine([0, hy + 22], [-17, hy + 32], DK, 5)
            DrawLine([0, hy + 22], [17, hy + 32], DK, 5)
            DrawLine([-4, hy + 43], [-11, hy + 62], DK, 5)
            DrawLine([4, hy + 43], [11, hy + 62], DK, 5)
            hiddenCtx.restore()
        }
