  let proBack = [0, 0, 0]

    let backgroundEaseHue = 0;
    let backgroundEaseLit = 0;
    let backgroundEaseSat = 0
    let gCycle = 0
    function backgroundHandler(){
        switch(backgroundMode){
            case "Color Cycle": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Color Cycle Ambience": 
            copyScreen(ambienceAlpha / 100)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Custom": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            break;
            case "Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Custom Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Ambience Audio Visualizer": 
            copyScreenAudio(ambienceAlpha / 100)
            break;
            case "Custom Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
            case "Color Cycle Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
        }
    }

    let audioScreenSat = 0
    let audioScreenLit = 0
    function copyScreenAudio(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      audioScreenSat += (engine.audio.density * 100 - audioScreenSat) / 10
      audioScreenLit += (engine.audio.density * 100 - audioScreenLit) / 10
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        ctx.fillStyle = `hsla(${hue[iZone]}, ${sat[iZone] * (audioScreenSat / 200 + .5)}%, ${lightness[iZone] * (audioScreenLit / 100)}%, ${alpha})`;
        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }
  
    function copyScreen(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        ctx.fillStyle = `hsla(${(backgroundMode == "Custom Ambience" ? proBack[0] : hue[iZone] + gCycle * (backgroundMode == "Color Cycle Ambience"))}, ${sat[iZone]}%, ${lightness[iZone]}%, ${alpha})`;
        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }

    function hexToHSL(hex) {
    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);

    var r = parseInt(result[1], 16);
    var g = parseInt(result[2], 16);
    var b = parseInt(result[3], 16);

    (r /= 255), (g /= 255), (b /= 255);
    var max = Math.max(r, g, b),
      min = Math.min(r, g, b);
    var h,
      s,
      l = (max + min) / 2;

    if (max === min) {
      h = s = 0; // achromatic
    } else {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r:
          h = (g - b) / d + (g < b ? 6 : 0);
          break;
        case g:
          h = (b - r) / d + 2;
          break;
        case b:
          h = (r - g) / d + 4;
          break;
      }
      h /= 6;
    }

    s = s * 100;
    s = Math.round(s);
    l = l * 100;
    l = Math.round(l);
    h = Math.round(360 * h);

    return [h, s, l];
  }

  function AkaliR(){
    this.count = 0
    this.draw = function(){
      if(this.count % 10 == 0) effects.push(new akaliRHelp(this.count * 3))
      this.count < 100 ? this.count++ : this.lifetime = 0
    }
  }

  function akaliRHelp(rad){
    this.rad = rad
    this.sat = 100
    this.a = 0
    this.half = false
    this.draw = function(){
      if(!this.half) this.a <= .95 ? this.a += .025 : this.half = true
      else this.a >= .01 ? this.a -= .01 : this.lifetime = 0
      DrawStroke(160, 100, this.rad, getColorString(140, this.sat, 50, this.a), 30)
      this.sat-=2
    }
  }

  function AkaliE(){
    this.rot = 0
    this.x = -50
    this.rad = 20
    this.a = 0
    this.half = false
    this.draw = function(){
      if(!this.half) this.a <= .45 ? this.a += .025 : this.half = true
      else this.a >= .01 ? this.a -= .01 : this.a = 0
      DrawRect(0, 0, 320, 200, getColorString(140, 100, 40, this.a))
      DrawStroke(this.x, 100, this.rad, "grey", 5)
      ctx.save()
      ctx.translate(this.x, 100)
      ctx.rotate(this.rot)
      ctx.translate(-this.x, -100)
      DrawTriangle(this.x, 100 - this.rad * 3, this.x + this.rad, 100 - this.rad, this.x - this.rad, 100 - this.rad, "grey")
      ctx.translate(this.x, 100)
      ctx.rotate(Math.PI / 2)
      ctx.translate(-this.x, -100)
      DrawTriangle(this.x, 100 - this.rad * 3, this.x + this.rad, 100 - this.rad, this.x - this.rad, 100 - this.rad, "grey")
      ctx.translate(this.x, 100)
      ctx.rotate(Math.PI / 2)
      ctx.translate(-this.x, -100)
      DrawTriangle(this.x, 100 - this.rad * 3, this.x + this.rad, 100 - this.rad, this.x - this.rad, 100 - this.rad, "grey")
      ctx.translate(this.x, 100)
      ctx.rotate(Math.PI / 2)
      ctx.translate(-this.x, -100)
      DrawTriangle(this.x, 100 - this.rad * 3, this.x + this.rad, 100 - this.rad, this.x - this.rad, 100 - this.rad, "grey")
      ctx.restore()
      this.rot += .075
      this.x < 420 ? this.x += 5 : this.lifetime = 0
    }
  }

  function AnnieQ(){
    this.start = Date.now();

    this.trails = [];

      if (this.elapsed < 2000) {

      DrawRect(0,0,320,200,`hsla(0,0%,0%,${this.alpha})`)

      this.trails.forEach(trail => {

        if (trail.lifetime <= 0) {

  function FiddleW() {

      setTimeout(() => {
        this.orbHolder.push(new MovingOrb())
      }, 50 * index);
    }
    this.draw = function () {
      this.elapsed = GetTime() - this.start;
      let gradient = ctx.createRadialGradient(160, 200, 0, 160, 200, 300);
      this.gradientElapsed = SetRange(this.elapsed, 0, 4000)


      if (this.elapsed > 3000) {
        let gradient = ctx.createRadialGradient(160, 200, 0, 160, 200, 300)
        this.calculateVal = -1660 * Math.floor(((this.elapsed - 3000) / 1660) / 1) + (((this.elapsed - 3000) / 1660) * (1660 / 1));
        gradient.addColorStop(SetRange((-0 + (this.calculateVal)), 0, 1000) / 1000, "hsla(0, 100%, 50%,0.7)");
        gradient.addColorStop(SetRange((-200 + (this.calculateVal)), 0, 1000) / 1000, "hsla(0, 0%, 0%,1)");
        gradient.addColorStop(SetRange((-400 + (this.calculateVal)), 0, 1000) / 1000, "hsla(0, 0%, 0%,0)");
        DrawBackground(gradient)
        if (this.elapsed > 3600) {
          this.lifetime = 0;
        }
      } else {

          orb.draw();
        });
      }
    }
  }

      gradient.addColorStop(SetRange((-400 + (this.calculateVal)), 0, 1000) / 1000, "hsla(0, 0%, 0%,0.7)");

  function MalphiteW() {
    this.start = GetTime();
    this.alpha = 0;
    this.leftPos = { x: 60, y: 155 }
    this.rightPos = { x: 260, y: 155 }
    this.defaultMotion = { left: true, right: false }
    this.recentSwitch = false;;
    this.particleHolder = [];
    this.draw = function () {
      ctx.globalAlpha = this.alpha;
      this.elapsed = GetTime() - this.start;
      DrawBackground("hsla(0,0%,0%,0.6)")
      if (this.defaultMotion.left) {
        DrawCircle(this.leftPos.x, this.leftPos.y + (Math.sin(this.elapsed / 200)) * 20, 40, "orange")
      } else {
        let calcval = + (Math.sin(this.elapsed / 200)) * 30
        if (Math.sin(this.elapsed / 200) < -0.9 && !this.recentSwitch) {
          for (let index = 0; index < 100; index++) {
            setTimeout(() => {
              this.particleHolder.push(new movingBall(this.leftPos.x + - calcval, this.leftPos.y + calcval, 7, { x: 5, y: -Math.random() * 10 }, `hsl(${10 + Math.random() * 40},100%,50%)`))
            }, 5 * index);

          }
          this.recentSwitch = true;
          setTimeout(() => {
            this.recentSwitch = false;
            this.defaultMotion.left = true;
            this.defaultMotion.right = false;
          }, 330);

        }
        DrawCircle(this.leftPos.x + -calcval, this.leftPos.y + calcval, 40, "orange")
      }
      if (this.defaultMotion.right) {
        DrawCircle(this.rightPos.x, this.rightPos.y + (Math.sin(this.elapsed / 200)) * 20, 40, "orange")
      } else {
        let calcval = + (Math.sin(this.elapsed / 200)) * 30
        if (Math.sin(this.elapsed / 200) < -0.9 && !this.recentSwitch) {
          for (let index = 0; index < 100; index++) {
            setTimeout(() => {
              this.particleHolder.push(new movingBall(this.rightPos.x + calcval, this.rightPos.y + calcval, 7, { x: -5, y: -Math.random() * 10 }, `hsl(${10 + Math.random() * 40},100%,50%)`))
            }, 5 * index);

          }
          this.recentSwitch = true;
          setTimeout(() => {
            this.recentSwitch = false;
            this.defaultMotion.right = true;
            this.defaultMotion.left = false;
          }, 330);
        }
        DrawCircle(this.rightPos.x + calcval, this.rightPos.y + calcval, 40, "orange")
      }
      this.particleHolder.forEach((element, i) => {
        element.draw();
        if (element.x < 0 || element.x > 320) {
          this.particleHolder.splice(i, 1);
        }
      });
      if (GetTime() - this.start > 5000) {
        this.lifetime = 0;

      }
      ctx.globalAlpha = 1;
      this.alpha < 1 ? this.alpha += .05 : this.alpha = 1;
    }
  }

    }

      this.count < 700 ? this.count++ : this.lifetime = 0;

  function MWHelp(){
    this.rot = Math.random() * Math.PI * 2
    this.points = []
    this.alpha = 1
    this.backAlpha = 0
    this.count = 0
    this.mod = 190 + Math.random() * 110
    this.lifetime = 10;
    this.draw = function(){
      ctx.save()
      ctx.translate(160, 100)
      ctx.rotate(this.rot)
      ctx.translate(-160, -100)
      ctx.beginPath()
      ctx.moveTo(160, 100)
      this.points.forEach((ele, i)=>{
        ctx.lineTo(ele[0], ele[1])
      })
      ctx.lineWidth = 30
      ctx.strokeStyle = `hsla(${this.mod}, 100%, 50%, ${this.alpha})`
      ctx.stroke()
      ctx.restore()
      this.count++
      if(this.count % 5 == 0 && this.points.length < 6) this.points.push([160 + this.count * 5, 100 + 20 - Math.random() * 40])
      if(this.points.length >= 6) this.alpha > 0 ? this.alpha -= .01 : this.lifetime = 0;

  function MundoQ(){

    this.draw = function(){
      DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${this.alpha})`)
      this.alpha < .5 ? this.alpha += .05 : this.alpha = .5
      ctx.save()
      ctx.translate(this.x, 100)
      ctx.rotate(this.rot)
      ctx.translate(-this.x, -100)
      DrawRect(this.x - 20, 50, 40, 100, `hsla(20, 100%, 50%, 1)`)
      DrawRect(this.dir ? this.x - 20: this.x + 5, 150, 15, 30, `hsla(20, 100%, 50%, 1)`)
      ctx.restore()
      if(this.dir){
        this.x < 370? this.x += this.vx : this.lifetime = 0
        this.rot += .1
      } else {
        this.x > -50? this.x += this.vx : this.lifetime = 0
        this.rot -= .1
      }
      if(this.lifetime == 0) effects.push(new ParticleExplosion(this.x, 100, `hsl(320, 100%, 40%)`, 10, 1000, 50, 20, 1.1))

        for (let i = 0; i < 2; i++) {

          ctx.stroke();
        }

      ctx.beginPath();
      ctx.save();
      ctx.translate(this.x,this.y);
      ctx.rotate(Math.PI/2);
      DrawArrowWithAngle(0,0,50,50,"black")
      DrawArrowWithAngle(0,0,45,45,"hsl(150,100%,70%)",20)
      ctx.restore();
      if (this.x ==320){
        this.secondX = SetRange(this.elapsed/3-320,0,320);

function NautilusE(){
  this.start = Date.now();
  this.ripples = [];
  for (let index = 0; index < 5; index++) {
    for (let rot = 0; rot < 10; rot++) {
      this.rotSpeed = Math.PI*2/10; ;
      this.x = 160 + Math.cos(this.rotSpeed*rot) * (40*index);
      this.y = 100 + Math.sin(this.rotSpeed*rot) * (40*index);
      const ripple = {x:this.x,y:this.y,size:0};
      setTimeout(() => {
        this.ripples.push(ripple);
      }, index*400);  
    }
  }
  this.alpha = 0;
  this.draw = function (){
    this.elapsed = (Date.now() - this.start);
    DrawRect(0,0,320,200,`hsla(0,00%,00%,${this.alpha})`);
    this.ripples.forEach(ripple => {
      ctx.beginPath();
      const calculatedAlpha = SetRange((30 -ripple.size)/20,0,1);
      ctx.arc(ripple.x,ripple.y,ripple.size,0,Math.PI*2);
      ctx.strokeStyle = `hsla(170,100%,70%,${calculatedAlpha})`;
      ctx.lineWidth = 8;
      ctx.stroke();
      ripple.size += 0.4;
    });
    if (this.elapsed > 2000){
      this.alpha -= 0.02;
      if (this.alpha <=0){
        this.lifetime = 0;
      }
    } else {
      this.alpha = SetRange(this.elapsed/1000,0,0.9);
    }
  }
}

function NautilusR(){
  this.start = Date.now();
  this.particles = [];
  this.alpha = 0;
  this.x = 0;
  this.explosion = false;

  this.draw = function (){
    this.x +=2;
    this.elapsed = (Date.now() - this.start);

    DrawRect(0,0,320,200,`hsla(0,00%,00%,${this.alpha})`);
    if (this.x % 50 == 0 && this.x < 350){
      for (let index = 0; index < 20; index++) {
        this.particles.push(new gravityParticle(this.x,200,Math.random()*20,{x:(Math.random()-0.5) *2,y:-3 - Math.random()*10},`hsl(${160 + Math.random() *50}, 100%,${50 + Math.random()*50}%)`,0.3,3000));
      }
    } else if (this.x > 350){
      if (!this.explosion){
        this.explosion = true;
        for (let index = 0; index < 100; index++) {
          this.particles.push(new gravityParticle(Math.random()*320,200,Math.random()*20,{x:(Math.random()-0.5) *2,y:-3 - Math.random()*10},`hsl(${160 + Math.random() *50}, 100%,${50 + Math.random()*50}%)`,0.3,3000));
        }
      }
    }
    this.particles.forEach(particle => {
      particle.draw();
    });

    if (this.x >320 && this.explosion){
      this.alpha -= 0.005;
      if (this.alpha <=0){
        this.lifetime = 0;
      }
    } else {
      this.alpha = SetRange(this.elapsed/1000,0,0.9);
    }
  }
}

  function point(x, y, col) {

  function DrawWing(x, y, dir, size, elapsed) {
    ctx.beginPath();
    for (let index = 0; index < 20; index++) {
      if (dir == "right") {
        ctx.lineTo(x + index * size, y + Math.sin((elapsed - (index * 10)) / 100) * 20)
      } else {
        ctx.lineTo(x - index * size, y + Math.sin((elapsed - (index * 10)) / 100) * 20)
      }
    }
    ctx.strokeStyle = "blue";
    ctx.lineWidth = size * 1.5;
    ctx.stroke();
  }

  function drawValorFace(x, y, size) {
    ctx.beginPath();
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size, size);
    ctx.arc(0, 0, 60, 0, 2 * Math.PI);
    ctx.fillStyle = "blue"
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(-25, -20, 20, 20, 0, 20 * (Math.PI / 180), 200 * (Math.PI / 180));
    ctx.fillStyle = "yellow"
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(25, -20, 20, 20, 0, -20 * (Math.PI / 180), 160 * (Math.PI / 180));
    ctx.fillStyle = "yellow"
    ctx.fill();
    DrawTriangle(-25, 20, 25, 20, 0, 50, "yellow")
    ctx.restore();
  }

        this.particles.push(new rakanMovingBall(200,100 + Math.sin(this.elapsed/200)*10,Math.random() *20,{x:Math.random()*-5,y:(Math.random()-0.5)*2}, `hsl(${60-Math.random()*50 },100%,50%)`,2000))
      }
      this.particles.forEach(particle => {
        particle.draw();
        if (particle.lifetime <= 0) {
          this.particles.splice(particle, 1);
        }
      });
      DrawCircle(260,100 + Math.sin(this.elapsed/200)*10,20,`hsl(60, 70%, 80%)`)
      ctx.globalAlpha = 1;
    }

  function shieldEffect(x,y,speed,size,dur,fillCol,StrokeCol,strokeWidth){
    this.x = x;
    this.y = y;
    this.speed = speed;
    this.size = size;
    this.as = 0;
    this.dur = dur;
    this.fillCol = fillCol;
    this.StrokeCol = StrokeCol;
    this.strokeWidth = strokeWidth;
    this.start = Date.now();
    this.draw = function(){
      this.elapsed = (Date.now() - this.start);
      if (this.as < this.size){
        this.as += this.speed
      }
;
      ctx.beginPath();
      ctx.arc(this.x,this.y,this.as,0,Math.PI*2);
      ctx.fillStyle = this.fillCol;
      ctx.fill();
      ctx.strokeStyle = this.StrokeCol;
      ctx.lineWidth = this.strokeWidth;
      ctx.stroke();

      if (this.elapsed > this.dur){
        this.as -= this.speed*2;
        if (this.as <= 0){
          this.lifetime = 0;
        }
      }
    }

  }

  function ReksaiW(burrowed) {
    this.start = Date.now();
    this.y = burrowed ? 80 : 160;
    this.y2 = burrowed ? 200 : 0;
    this.radius = burrowed ? 30 : 60;
    this.burrowed = burrowed;
    this.alpha = 0;
    this.done = false;
    this.draw = function () {
      ctx.globalAlpha = this.alpha;
      DrawRect(0, this.y2, 320, 200, `hsl(280, 80%, ${this.burrowed ? this.y2 / 2 : this.y2 / 2 + 20}%)`)
      DrawCircle(160, this.y, this.radius, `hsl(335, 80%, ${(this.y - 80) * 5 / 4}%`)
      ctx.globalAlpha = 1;
      if (this.burrowed) {
        this.y < 160 ? this.y += 3 : this.y = 160;
        this.y2 >= 6 ? this.y2 -= 5 : this.done = true;
        this.radius < 60 ? this.radius++ : this.radius = 60;
      } else {
        this.y > 80 ? this.y -= 3 : this.y = 80;
        this.y2 <= 194 ? this.y2 += 5 : this.done = true;
        this.radius < 30 ? this.radius-- : this.radius = 30;
      }
      if (this.done) {
        this.alpha >= .02 ? this.alpha -= .02 : this.lifetime = 0;
      } else {
        this.alpha <= .95 ? this.alpha += .05 : this.alpha = 1;
      }

  function SennaQ (){
    this.start = Date.now();
    this.alpha = 0;
    this.gradCounter = 0;
    this.streaks = [];
    this.fadeAlpha = 1;
    this.lifetime = 200;
    this.draw = function(){
      this.elapsed = (Date.now() - this.start)*2;
      this.alpha = SetRange(this.elapsed / 500,0,1);
      DrawRect(0,0,320,200,`hsla(0,0%,0%,${this.elapsed<2000? this.alpha:this.fadeAlpha})`)
      if(this.elapsed > 2000){
        this.fadeAlpha -= 0.01;
      }
      if(this.fadeAlpha < 0){
        this.lifetime--;
      }
      if(this.elapsed >1000){
        this.gradCounter+=10
        let grad = ctx.createLinearGradient(-800 +  this.gradCounter,0,0+ this.gradCounter,0);
        grad.addColorStop(0,`hsla(0,0%,0%,0)`)
        grad.addColorStop(0.8,`hsla(90, 100%, 30%, 1)`)
        grad.addColorStop(1,`hsla(0, 0%, 0%,0)`)
        ctx.fillStyle = grad;
        ctx.fillRect(0,80,320,50)
        if(this.elapsed >1300 && Math.random() > 0.8 && this.fadeAlpha >=0){
            let path = [];
            let rand = Math.random() *1000;
            for (let index = 0; index < 64; index++) {
                path.push({x:index*5,y:Math.sin(index/10 +rand)*50 + 100})
            }
            this.streaks.push(new PathStreak(path,2000,80,8,`hsla(182, 100%, 20%, 1)`))
        }
      }
      for (let i = 0; i < 2; i++) {
        ctx.beginPath()
        let y = i == 0 ? 130 : 70;
        ctx.moveTo(0,y)
        ctx.lineTo(this.elapsed/2,y)
        ctx.strokeStyle = `hsla(202, 100%, 30%, ${this.fadeAlpha})`
        ctx.lineWidth = 20;
        ctx.stroke()
      }
      this.streaks.forEach(streak => {
        streak.draw();
      }); 
    }
  }

  function SennaW(){
    this.trails = [];
    this.start = Date.now();
    this.alpha = 0;
    this.x = 0
    this.size = 0;
    this.foreGroundAlpha = 1;
  
    this.draw = function (){
      this.alpha = SetRange((Date.now() - this.start) / 1000,0,0.7);
      let diff = 1 - this.foreGroundAlpha
      DrawRect(0,0,320,200,`hsla(0,0%,0%,${this.alpha-diff})`)

      if (Date.now() - this.start > 3000){
        this.foreGroundAlpha -= 0.01;
        this.foreGroundAlpha  = SetRange(this.foreGroundAlpha,0,1);
      }
      
      ctx.globalAlpha = this.foreGroundAlpha;
      if (this.x <160){
        this.x +=3;
        this.trails.push(new trailParticle(this.x,100,30,`hsl(180, 70%, 30%)`,800))
      } else {
        this.size += 1;
        DrawCircle(160,100,this.size,`hsla(180, 70%, 30%,0.2)`)
      }

      if (this.x >140 && this.foreGroundAlpha>=1){
        if (this.size %100==1){
          let circlePath = [];
          let rand = Math.random() *1000;
          for (let index = 0; index < 32; index++) {
            circlePath.push({x:Math.cos(index+rand/100)*(8*index)+160,y:Math.sin(index+rand/100)*(8*index) + 100})
          }
          
          this.trails.push(new PathStreak(flipArray(circlePath),3000,80,8,`hsla(182, 100%, 70%)`,20))
        }
      }
    
      this.trails.forEach(trail => {
        trail.draw();
      });

      }
    }

  function SennaR() {

  function SettQ(){
  this.trailParticles = [];
  this.stage = 0;
  this.start = Date.now();
  this.x = 0;
  this.y = 0;
  this.alpha = 0;
  this.STAGELENGTH = 1000;
  this.draw = function (){


    this.elapsed = (Date.now() - this.start);
    if (this.elapsed > this.STAGELENGTH){
      this.stage++;
      this.start = Date.now();
    }
    DrawRect(0,0,320,200,`hsla(0,0%,0%,${this.alpha})`)
    if (this.stage ==0){
      this.alpha = SetRange(this.elapsed/this.STAGELENGTH,0,0.8);
    } else if (this.stage ==1){
      this.x = 140 - Math.sin(this.elapsed/((200/4)*3 - Math.PI))*40;
      this.y = 155 - Math.cos(this.elapsed/((200/4)*3) + Math.PI)*80;
      DrawCircle(this.x,this.y,20,`hsla(0,0%,100%,0.8)`)
      this.trailParticles.push(new trailParticle(this.x,this.y,40,`hsla(${this.trailParticles.length},100%,50%,0.1)`,1000))
    } else if (this.stage ==2){
      this.x = 180 - Math.sin(this.elapsed/((200/4)*3 - Math.PI))*-40;
      this.y = 155 - Math.cos(this.elapsed/((200/4)*3) + Math.PI)*80;
      DrawCircle(this.x,this.y,20,`hsla(0,0%,100%,0.8)`)
      this.trailParticles.push(new trailParticle(this.x,this.y,40,`hsla(${this.trailParticles.length / 3},100%,50%,0.1)`,1000))
    } else if (this.stage ==3){
      this.alpha = SetRange(1-(this.elapsed/this.STAGELENGTH),0,0.8);
    } else {
      this.lifetime = 0;
    }

    this.trailParticles.forEach(trail => {
      trail.draw();
    });
  } 
}

function SettR(){
  this.start = Date.now();
  this.particles = [];
  this.start = Date.now();
  this.alpha = 0;
  this.pushedExplosion = false;
  this.FIRSTSTAGELENGTH = 1400;
  this.SECONDSTAGELENGTH = 1000;
  this.THIRDSTAGELENGTH = 1000;
  this.FORTHSTAGELENGTH = 1500;
  this.completeTime = this.FIRSTSTAGELENGTH + this.SECONDSTAGELENGTH + this.THIRDSTAGELENGTH + this.FORTHSTAGELENGTH;

  this.draw = function  (){
    this.elapsed = (Date.now() - this.start);

    if (this.elapsed < 1000){
      this.alpha = SetRange(this.elapsed/1000,0,0.9);
    } else if (this.elapsed>4000) {

      this.alpha = SetRange(1-(this.elapsed-4000)/1000,0,0.9);
    }
    ctx.globalAlpha = this.alpha;
    DrawRect(0,0,320,200,`hsla(0,0%,5%,${this.alpha})`)

    if (this.elapsed < this.FIRSTSTAGELENGTH ){
      this.particles.push(new trailParticle(-50 + (this.elapsed-1000)/3,100,30,`hsla(${this.particles.length / 5},100%,50%,0.1)`,1000))

    } else if (this.elapsed < this.FIRSTSTAGELENGTH + this.SECONDSTAGELENGTH){
      this.particles.push(new trailParticle(80+ (this.elapsed-this.FIRSTSTAGELENGTH)/9,100 + Math.sin((this.elapsed-this.FIRSTSTAGELENGTH)/300 + Math.PI)*70,30,`hsla(60,100%,60%,0.1)`,1000))
    } else if (this.elapsed< this.FIRSTSTAGELENGTH + this.SECONDSTAGELENGTH + this.THIRDSTAGELENGTH){
      if (!this.pushedExplosion){
        this.pushedExplosion = true;
        for (let index = 0; index < 150; index++) {
          setTimeout(() => {
            this.particles.push(new gravityParticle(180,100,Math.random()*15 + 15,{x:(Math.random()-0.5)*5,y:-1 + Math.random()*-7},`hsla(${Math.random()*50 + 10},100%,50%,1)`,0.1,1000))
          }, Math.random() *500);
        
        }
      }
        DrawRect(160,90,60,40,`hsla(0,100%,50%,1)`)
    } 

    this.particles.forEach(particle => {
      particle.draw();
    });
    ctx.globalAlpha = 1;
    if (this.elapsed > this.completeTime){
      this.lifetime = 0;
    }
  }
}

  function TeemoR() {
    this.state = 0;

    this.y = -50;
    this.explosion = new ParticleExplosion(160, 100, "purple", 7, 1000, 150, 20, 1);

    StopEffects = true;
    this.Process = function () {
      this.Draw();

      if (this.state == 0) {
        this.background.draw();
        if (this.background.y >= 0) {
          this.state = 1;
        }
      } else if (this.state == 1) {
        DrawBackground("black");
        puffcap(this.y);
        if (this.y <= 100) {
          this.y += 5;
        } else {
          this.state = 2;
        }
      } else if (this.state == 2) {
        DrawBackground("black");
        this.explosion.draw();
        if (this.start == null) {
          this.start = GetTime();
          StopEffects = false
        }
        if (GetTime() - this.start > 2000) {
          stateMgr.Pop();
          freezeBackground = false;
          effects.length = 0;
          goldAnimPushed = false;
        }
      }
    }
  }

  function eyeParticle(x, y, moveVal, color, speed) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.speed = speed;
    this.draw = function () {
      ctx.beginPath();
      ctx.ellipse(this.x, this.y, 20 * moveVal, 15 * moveVal, 0, 0, 2 * Math.PI);
      ctx.fillStyle = this.color;
      ctx.fill();
      this.x += this.speed.x;
      this.y += this.speed.y;
    }
  }

  function drawHelmet(x, y, size, color) {
    ctx.beginPath();
    ctx.ellipse(x, y + size / 2, size * 2, size, 0, 1 * Math.PI, 2 * Math.PI);
    ctx.fillStyle = color;
    ctx.fill();

    DrawRect(x - (size * 2), y + size / 2, size * 4, size / 2, color);
    DrawRect(x - size * 2, y + size, size / 1.5, size, color);
    DrawRect(x - size / 3, y + size, size / 1.5, size, color);
    DrawRect(x + size * 1.33, y + size, size / 1.5, size, color);
  }

  function ViktorR() {

    this.timer = 0;
    this.ripple = true;
    this.speed = {
      x: (Math.random() * 2) + 1,
      y: (Math.random() * 2) + 1
    }
    this.start = GetTime();
    this.draw = function () {

      this.elapsed = GetTime() - this.start
      if (this.point.x + this.point.radius > 320 && this.speed.x > 0) {
        this.speed.x = -this.speed.x
      } else if (this.point.x - this.point.radius < 0 && this.speed.x < 0) {
        this.speed.x = -this.speed.x
      }
      if (this.point.y + this.point.radius > 200 && this.speed.y > 0) {
        this.speed.y = -this.speed.y
      } else if (this.point.y - this.point.radius < 0 && this.speed.y < 0) {
        this.speed.y = -this.speed.y
      }
      this.point.x += this.speed.x;
      this.point.y += this.speed.y;
      this.point.draw();
      ctx.beginPath();
      ctx.arc(this.point.x, this.point.y, this.point.radius * 4, 0, Math.PI * 2)
      ctx.fillStyle = "hsla(193, 100%, 48%, 0.3)"
      ctx.fill()
      if (this.elapsed - this.timer > 2000) {
        this.ripple = true;
        this.timer = this.elapsed;
      }
      if (this.ripple) {
        this.circleradius = this.point.radius * 4 - (this.elapsed - this.timer) / 10;
        if (this.circleradius > 0) {
          ctx.beginPath()
          ctx.arc(this.point.x, this.point.y, this.circleradius, 0, Math.PI * 2);
          ctx.strokeStyle = "red";
          ctx.lineWidth = 10;
          ctx.stroke()
        } else {
          this.ripple = false;
          effects.push(new ParticleExplosion(this.point.x, this.point.y, "blue", 20, 1000, 10, 20, 1, false, false))
        }
      }
    }
  }

  function ZacUltOrb(x, y, duration, size, color, bouncePoints) {
    this.x = x;
    this.y = y;
    this.duration = duration;
    this.size = size;
    this.color = color;
    this.bouncePoints = bouncePoints;
    this.speed = { x: 0, y: 0 };
    this.start = Date.now();
    this.counter = 0;
    this.bounceIndex = 0;
    this.prevBounce = 0;
    this.draw = function () {
      this.counter++;
      this.drawSize = ((Math.sin(this.counter / (this.duration / 10)) + 1) / 2) * (this.size * 0.4) + this.size * 0.2;
      SetRange(this.bounceIndex = Math.floor((this.counter / 45)) % 3, 0, 2);
      if (this.prevBounce != this.bounceIndex) {
        effects.push(new ParticleExplosion(this.x, this.y, "green", 5, 1000, 5, 5, 1, false, false))
        this.prevBounce = this.bounceIndex;
      }
      this.speed.x = (this.bouncePoints[this.bounceIndex].x - this.x) / 45;
      this.speed.y = (this.bouncePoints[this.bounceIndex].y - this.y) / 45;
      DrawCircle(this.x, this.y, this.drawSize, this.color)
      this.x += this.speed.x;
      this.y += this.speed.y
    }
  }




  function drawArm(x, y, size, length, color, wobblestrength, wobbleSize, wobbleloc) {

    ctx.moveTo(x, y);
    for (let index = 0; index < length; index++) {
      ctx.lineTo(x + size * index, y + Math.sin(wobbleloc + (index / wobbleSize)) * wobblestrength)
    }
    ctx.strokeStyle = "green";
    ctx.lineWidth = 20;
    ctx.stroke();
  }

  //#region EFFECT/HELPER FUNCTIONS --------------------------------------------------------------------
  function getColorString(hue, sat, lit, alpha) {
        return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`;
    }

  function drawWave(y, color, frequency, direction, waveSize) {

    ctx.beginPath();

    ctx.moveTo(0, y);
    for (let i = 0; i < 320; i++) {
      ctx.lineTo(i, y + Math.sin(i * 0.01 + frequency) * waveSize);
    }
    ctx.lineTo(320, direction == "up" ? 200 : 0)
    ctx.lineTo(0, direction == "up" ? 200 : 0)
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }


  function SetRange(num, min, max) {

    return Math.min(Math.max(num, min), max)
  }


  function DrawSineWave(x, y, color, WaveLength, WaveHeight, elapsed, lineWidth) {
    ctx.beginPath();
    ctx.lineWidth = lineWidth;
    ctx.moveTo(x, 100);
    for (let i = 0; i < 320; i++) {
      ctx.lineTo(x + i, y + (Math.sin(i * (WaveLength / 1000) + elapsed / 100) - 1) * WaveHeight - 50)
    }
    ctx.strokeStyle = color;
    ctx.stroke()
    ctx.lineWidth = 1;
  }

  function DrawRandomArc(x, y, size, col, strokeSize) {
    ctx.beginPath()
    let randomVal = Math.random() * 100;
    ctx.moveTo(x, y)
    ctx.lineTo(x + Math.cos(randomVal) * size * 2, y + Math.sin(randomVal) * size * 2)
    ctx.strokeStyle = col;
    ctx.lineWidth = strokeSize;
    ctx.stroke();
    ctx.lineWidth = 1;
  }


  function DrawCircle(x, y, radius, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.fill();
  };

  function DrawTrident(x, y, size, rotation) {
    ctx.beginPath();
    ctx.save();
    ctx.translate(x, y)
    ctx.rotate(rotation * Math.PI / 180);
    ctx.moveTo(0, 0);
    ctx.lineTo(0, size)
    ctx.moveTo(0, 0)
    ctx.lineTo(0, -size / 2);
    ctx.moveTo(0, 0)
    ctx.lineTo(-size / 2, 0)
    ctx.lineTo(-size / 2, -size / 2)
    ctx.moveTo(0, 0)
    ctx.lineTo(size / 2, 0)
    ctx.lineTo(size / 2, -size / 2)
    ctx.restore();
    ctx.lineWidth = size / 7;
    ctx.strokeStyle = "Blue";
    ctx.stroke();
  }

  function DrawTriangle(cord1X, cord1Y, cord2X, cord2Y, cord3X, cord3Y, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.moveTo(cord1X, cord1Y);
    ctx.lineTo(cord2X, cord2Y);
    ctx.lineTo(cord3X, cord3Y);
    ctx.lineTo(cord1X, cord1Y);
    ctx.fill();
  };

  function DrawArrow(color, x) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0 + x, 0);
    ctx.lineTo(60 + x, 0);
    ctx.lineTo(120 + x, 100);
    ctx.lineTo(60 + x, 200);
    ctx.lineTo(0 + x, 200);
    ctx.lineTo(60 + x, 100)
    ctx.lineTo(0 + x, 0)
    ctx.fill();
  }

  function DrawArrowWithAngle(x, y, width, angle, color,linewidth=30) {
ctx.beginPath();
ctx.moveTo(x - width, y + angle);
ctx.lineTo(x, y);
ctx.lineTo(x + width, y + angle);
ctx.strokeStyle = color;
ctx.lineWidth = linewidth;
ctx.stroke();
}

  function flipArray(arr) {
  let flippedArr = [];
  for (let i = arr.length - 1; i >= 0; i--) {
    flippedArr.push(arr[i]);
  }
  return flippedArr;
}

  class movingPoint {
    constructor(x, y, radius, color) {
      this.x = x;
      this.y = y;
      this.radius = radius;
      this.color = color;
    }

    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2)
      ctx.fillStyle = this.color;
      ctx.fill();
    }
  }

  function trailParticle(x,y,size,color,duration, colorspeed =0){
    this.x = x;
    this.y = y;
    this.size = size;
    this.color = color;
    this.duration = duration;
    this.start = Date.now();
    this.draw = function(){
      this.elapsed = (Date.now() - this.start);
      this.alpha = SetRange(1-(this.elapsed / this.duration),0,1);
      ctx.globalAlpha = this.alpha;
      if (colorspeed != 0){
        this.color.h -= colorspeed;
        DrawCircle(this.x,this.y,this.size*this.alpha,`hsla(${this.color.h},${this.color.s}%,${this.color.l}%)`)
      } else {
        DrawCircle(this.x,this.y,this.size*this.alpha,this.color)

          ctx.lineTo(0, this.lifetime / 1.5 - (200 * i));
          ctx.lineTo(160, this.lifetime / 1.5 - (200 * i) - 150);
          ctx.fill();
        }
      } else {
        ctx.fillStyle = this.color;
        for (let i = 0; i < this.amount; i++) {
          ctx.beginPath();
          ctx.moveTo(160, 300 - this.lifetime / 1.5 + (200 * i));
          ctx.lineTo(320, 240 - this.lifetime / 1.5 + (200 * i));

          ctx.lineTo(160, 300 - this.lifetime / 1.5 + (200 * i));

  function PathStreak(path, duration, quality, length, color, lineWidth) {
    this.points = path;
    this.start = Date.now();
    let pointAmount = path.length
    this.betweenPoint = 1 / pointAmount + 2
    this.duration = duration;
    this.quality = quality;
    this.length = length;
    this.totalDistance = 0;
    this.color = color;
    this.lineWidth = lineWidth;
    this.draw = function () {
      ctx.beginPath();
      let value = (this.duration - (this.duration - (Date.now() - this.start))) / this.duration;
      ctx.moveTo(this.points[0].x, this.points.y)
      for (let index = 0; index < this.quality; index++) {
        let pointVal = Math.floor((value * pointAmount) - (index * (this.length / this.quality)));
        if (pointVal >= 1) {
          if (pointVal < pointAmount) {
            let movePoint = getXAndYForPathPoint(this.points[pointVal - 1], this.points[pointVal], (((value) * pointAmount) - (index * (this.length / this.quality))) - pointVal);
            ctx.lineTo(movePoint.x, movePoint.y)
          }
        }
      }
      ctx.lineWidth = this.lineWidth;
      ctx.strokeStyle = this.color;
      ctx.stroke();
      if (value > 1) {
        this.lifetime = 0;
      }
    }
  }

  function getXAndYForPathPoint(point1, point2, percentage) {
    let speed = { x: (point2.x - point1.x) * percentage, y: (point2.y - point1.y) * percentage }
    return { x: point1.x + speed.x, y: point1.y + speed.y }
  }

          y: this.yspeed
        }, this.size, this.size / 2, DrawHeart, this.col, this.duration, this.fadeSpeed))

  function RippleEffect(x, y, speed, duration, rippleWidth, color, inOrOut, fillOrStroke, amountOfRipples, background) {

    this.fill = fillOrStroke;
    this.radius = 0;
    this.amount = amountOfRipples;
    this.background = background;
    if (inOrOut == "in") {
      this.radius = 200 + (this.width * (this.amount * 2));

    }
    this.draw = function () {

        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, 320, 200);

        }
      }
      if (this.fill == "fill") {
        ctx.fillStyle = this.col;
        ctx.fill();
      } else {
        ctx.strokeStyle = this.col;
        ctx.stroke();
      }
      this.radius += this.speed;

  function StateHandler() {
    var stack = [];
    var state = null;
    var updateState = function () {
      if (stack.length > 0) {
        state = stack[stack.length - 1];
      } else {
        state = null;
      }
    };
    this.Push = function (newState) {
      stack.push(newState);
      updateState();
    }

    this.Pop = function () {
      stack.pop();
      updateState();
    };

    this.Process = function () {
      if (state != null) {
        state.Process();
      }
    };
  }

  function Meter(count, callback) {
    this.size = count;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    var values = [];

    this.setValue = function (updatedValue) {
      values.push(updatedValue);
      if (values.length > this.size) {
        values.shift();
      }
      for (var i = 0; i < values.length - 1; i++) {
        if (values[i] !== values[i + 1]) return;
      }
      if (this.value !== values[0]) {
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        callback();
      }
    };
  }
  //refactorClasses
  function SimpleMoveEffect(x, y, speed, xSize, ySize, shapeFunction, color, duration, fadeSpeed = 100, rotationSpeed = 0, rotationOrigin = { x: 0, y: 0 }, fadeAmount = 0.01) {
    this.x = x;
    this.y = y;
    this.speed = speed;
    this.xSize = xSize;
    this.ySize = ySize;
    this.shapeFunction = shapeFunction;
    this.color = color;
    this.duration = duration;
    this.start = GetTime();
    this.lifetime;
    this.fadeSpeed = fadeSpeed;
    this.rotationSpeed = rotationSpeed;
    this.rotation = 0;
    this.draw = function () {
      ctx.globalAlpha = this.fadeSpeed;
      this.fadeSpeed -= fadeAmount;
      this.lifetime = this.duration - (GetTime() - this.start);
      if (this.lifetime > 0 || this.fadeSpeed == 0) {
        ctx.beginPath();
        ctx.save()
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        this.shapeFunction(rotationOrigin.x, rotationOrigin.y, this.xSize, this.ySize, this.color);
        ctx.restore();
        this.rotation += this.rotationSpeed;
        this.x += this.speed.x;
        this.y += this.speed.y;
      }
      ctx.globalAlpha = 1;
    }
  }
//#endregion

  function onEngineReady() {
    // Grab canvas and rendering context.
    c = document.getElementById("exCanvas");
    ctx = c.getContext("2d");
    window.requestAnimationFrame(update);
  }
