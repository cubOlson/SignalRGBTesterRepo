  //Temporary before testing
  let enableRadar = false
  let enableTower = false


  var Health_Meter = new Meter(10, () => "");
  var Mana_Meter = new Meter(5, () => "");
  var Death_Meter = new Meter(5, Deathcallback);
  var LevelUp_Meter = new Meter(10, LevelUpcallback);
  var VictoryDefeatConfirm_Meter = new Meter(5, VictoryDefeatcallback);
  var RadiantVictory_Meter = new Meter(5, VictoryDefeatcallback);
  var DireVictory_Meter = new Meter(5, VictoryDefeatcallback);
  var NightDay_Meter = new Meter(5, NightDaycallback);
  var TeleportBlack_Meter = new Meter(5, Teleportcallback);
  var TeleportYellow_Meter = new Meter(15, Teleportcallback);
  var TeleportBlue_Meter = new Meter(5,Teleportcallback)
  var PlayingHero_Meter = new Meter(2, InGamecallback);
  var Courier_Meter = new Meter(5, Couriercallback);
  var searchingMatch_Meter = new Meter(50, searchingMatchcallback);
  var radarBlue_Meter = new Meter(5,RadarCallback);
  var towerYellow_Meter = new Meter(5,TowerCallback);



  //Declaring variables
  var canvas, ctx;
  var stateMgr = new StateHandler();
  var effects = [];
  var aboveHudEffects = [];
  let inGame = false;
  let isSun = true;
  let isDelivering = false;
  let designatedHealthSize = 0;
  let currentHealthSize = 0;
  let designatedManaSize = 0;
  let currentManaSize = 0;
  let beenInGame = false;
  let beenInGameTimer = 0;
  let courierTick = 0;


  let lowHpPlaying = false;
  let lowManaPlaying = false;
  let deathPlaying = false;
  let dayNightPlaying = false;
  let searchingMatchPlaying = false;
  let hoverTimer = 0;


  //Declaring meters
  function update() {
    InGamecallback();
    if (engine.vision.HoverBlock < 0.5) {
      hoverTimer = Date.now();
    }
    if (!dayNightPlaying) {
      PlayingHero_Meter.setValue(engine.vision.PlayingHero)

      if (Date.now() - beenInGameTimer < 10000 && Date.now() - beenInGameTimer > 0) {
        VictoryDefeatConfirm_Meter.setValue(engine.vision.VictoryDefeatConfirm)
        RadiantVictory_Meter.setValue(engine.vision.RadiantVictory)
        DireVictory_Meter.setValue(engine.vision.DireVictory)
        Death_Meter.setValue(engine.vision.Death)
      }
      if (!inGame) {
        searchingMatch_Meter.setValue(engine.vision.searchingMatch)
      }

      if (engine.vision.VictoryDefeatConfirm < 0.8) {
        Health_Meter.setValue(engine.vision.Health)
        Mana_Meter.setValue(engine.vision.Mana)
        if (PlayingHero_Meter.value > 0) {
          beenInGame = true;
          beenInGameTimer = Date.now();
        }

        if (inGame) {
          
          LevelUp_Meter.setValue(engine.vision.LevelUp)
          TeleportBlack_Meter.setValue(engine.vision.TeleportBlack)
          TeleportYellow_Meter.setValue(engine.vision.TeleportYellow)
          TeleportBlue_Meter.setValue(engine.vision.TeleportBlue)
          Courier_Meter.setValue(engine.vision.CourierCircle)
          towerYellow_Meter.setValue(engine.vision.towerYellow)
          radarBlue_Meter.setValue(engine.vision.radarBlue)
        }

        
          
       

        if (Health_Meter.value > 0) {
          NightDay_Meter.setValue(engine.vision.NightDay[0])
        }
      }

    }

    //Effect handler 
    if (!deathPlaying)
      if (keyScreenBrightness != 0) {
        IdleState();
      } else {
        DrawRect(0, 0, canvas.width, canvas.height, "black");
      }


    for (let i = 0; i < effects.length; i++) {
      effects[i].draw();
      if (effects[i].lifetime <= 0) {
        effects.splice(i, 1);
      }
    }
    stateMgr.Process();
    if (!deathPlaying)
    drawHud();

    for (let i = 0; i < aboveHudEffects.length; i++) {
      aboveHudEffects[i].draw();
      if (aboveHudEffects[i].lifetime <= 0) {
        aboveHudEffects.splice(i, 1);
      }
    }

    window.requestAnimationFrame(update);
  }



  function drawHud() {
    let hpColor = hexToHSL(healthColor)
    designatedHealthSize = Health_Meter.value;
    designatedManaSize = Mana_Meter.value;
    if (Date.now() - hoverTimer > 1000 || Health_Meter.value > 0.9) {
      if(inGame) currentHealthSize = lerp(currentHealthSize, designatedHealthSize, 0.05);
      let colorOffset = currentHealthSize - designatedHealthSize;
      if (colorOffset > 0) {
        hpColor.h = hpColor.h - colorOffset * 2000
        if (hpColor.h < 0) hpColor.h = 0
      }
      currentManaSize = lerp(currentManaSize, designatedManaSize, 0.05);
    }


    let healthString = `hsl(${hpColor.h}, ${hpColor.s}%, ${hpColor.l}%)`

    if (enableHealth)
      DrawRect((healthX * 3.2), (healthY * 2), (adjToggle && !inGame) ? (healthWidth * 3.2) : currentHealthSize * (healthWidth * 3.2), healthHeight, healthString);
    if (enableMana)
      DrawRect((manaX * 3.2), (manaY * 2), (adjToggle && !inGame) ? (manaWidth * 3.2) : currentManaSize * (manaWidth * 3.2), manaHeight, manaColor);


  }

  function InGamecallback() {
    if (Health_Meter.value >= 0.1 && PlayingHero_Meter.value >= 0.0001 && Mana_Meter.value >= 0.1) {
      inGame = true;
    } else {
      inGame = false;
    }
  }

  function RadarCallback(){
    if(enableRadar){
      if(inGame && radarBlue_Meter.value <.1 && radarBlue_Meter.decreased && radarBlue_Meter.diff > 0.5){
        effects.push(new RadarEffect(160,100,70, 90))
      }
    }

  }

  function TowerCallback(){
    if(enableTower){
      if(inGame && towerYellow_Meter.value <.1 && towerYellow_Meter.decreased && towerYellow_Meter.diff > 0.5){
        effects.push(new TowerEnforcementEffect(160,50))
      }
    }
    
  }

  function Healthcallback() {
    if (inGame && engine.vision.HoverBlock >= 0.9 && enableHealth && Date.now() - hoverTimer > 2000) {
      if (Health_Meter.decreased && Health_Meter.diff > 0.05 && Health_Meter.value > 0.1 ) {
        effects.push(new fadingSplatter(160, 100, 70, "red"))
        for (let i = 0; i < 20; i++) {
          setTimeout(() => {
            effects.push(new damageOrb(160, 100, Math.random() * 20 + 10))
          }, i * 10);
        }
      } else if (Health_Meter.increased && Health_Meter.diff > 0.02 && Health_Meter.value > 0.1 ) {
        effects.push(new healingEffect())
      }
      if (Health_Meter.value < 0.3 && !lowHpPlaying && enableLowHp) {
        lowHpPlaying = true;
        effects.push(new LowHpEffect)
      } else {
        if (Health_Meter.value > 0.3)
          lowHpPlaying = false;
      }
    }
    InGamecallback();
  }

  function Manacallback() {
    if (enableMana)
      if (inGame && Mana_Meter.value < 0.3 && !lowManaPlaying) {
        lowManaPlaying = true;
        effects.push(new lowManaEffect)
      } else {
        if (inGame && lowManaPlaying && Mana_Meter.value > 0.3)
          lowManaPlaying = false;
      }
  }

  function Deathcallback() {
    if (enableDeath)
      if (Death_Meter.increased && Death_Meter.value >= 0.1 && Death_Meter.diff > 0.1 && !deathPlaying) {
        aboveHudEffects.push(new deathEffect())
        lowHpPlaying = false;
        lowManaPlaying = false;
      }
  }

  function LevelUpcallback() {
    if (enableLevelUp)
      if (inGame && LevelUp_Meter.decreased && LevelUp_Meter.value <= 0.01 && LevelUp_Meter.diff > 0.1) {
        aboveHudEffects.push(new LevelUpEffect())
      }
  }

  function VictoryDefeatcallback() {
    if (enableVictoryDefeat)
      if (VictoryDefeatConfirm_Meter.value >= .95) {
        if (RadiantVictory_Meter.value >= .95) {
          aboveHudEffects.push(new VictoryEffect(false))
        } else if (DireVictory_Meter.value >= .95) {
          aboveHudEffects.push(new VictoryEffect(true))
        }
      }
  }

  function searchingMatchcallback() {
    if (enableSearchingMatch)
      if (searchingMatch_Meter.value >= .95 && !searchingMatchPlaying) {
        searchingMatchPlaying = true;
        aboveHudEffects.push(new searchingMatchEffect())
      }
    if (searchingMatch_Meter.value <.1 && searchingMatchPlaying) {
      searchingMatchPlaying = false;
    }
  }

  function NightDaycallback() {
    if (enableNightDay)
      if (inGame && NightDay_Meter.value > 190 && NightDay_Meter.value < 210 && isSun == true) {
        aboveHudEffects.push(new dayNightEffect(false))
        isSun = false;
      } else if (inGame && NightDay_Meter.value > 30 && NightDay_Meter.value < 55 && isSun == false) {
        aboveHudEffects.push(new dayNightEffect(true))
        isSun = true;
      }

  }

  function Teleportcallback() {
    if (enableTeleport)
      if (inGame && TeleportBlue_Meter.value >= .95 && TeleportBlack_Meter.value >= 0.95 && TeleportYellow_Meter.value >=.95) {
        aboveHudEffects.push(new TeleportEffect())
      }
  }

  function Couriercallback() {
    if (enableCourier) {
      if (inGame && !isDelivering && Courier_Meter.value <.1 && Courier_Meter.decreased && Courier_Meter.diff > 0.5) {
        isDelivering = true;
        
        aboveHudEffects.push(new courierStartEffect())
      }

      if (inGame && Courier_Meter.value >=.95  && isDelivering) {
        aboveHudEffects.push(new courierFinishEffect());
      }
    }
  }

  function TowerEnforcementEffect(x, y) {
      this.x = x;
      this.y = y;
      this.alpha = 1;
      this.offset = 0;
      this.timer = 0;          
      this.fadeDelay = 500;   
      this.fadeSpeed = 0.01;   

      this.drawTower = () => {
        ctx.save();
        ctx.globalAlpha = this.alpha; 
        ctx.translate(this.x, this.y);
        ctx.fillStyle = "rgba(0, 100, 255, 1)";

        ctx.fillRect(-60, 100, 120, 20);
        ctx.fillRect(-45, 0, 90, 100);
        ctx.fillRect(-70, -30, 40, 30);
        ctx.fillRect(-20, -30, 40, 30);
        ctx.fillRect(30, -30, 40, 30);

        ctx.restore();
      };

      this.drawGradient = () => {
        const gradHeight = 150;
        this.offset += 2;
        if (this.offset > 300) this.offset = -gradHeight;

        const gradient = ctx.createLinearGradient(0, this.y + 220 - this.offset, 0, this.y + 100 - this.offset - gradHeight);
        gradient.addColorStop(0, `rgba(100,200,255,0)`);
        gradient.addColorStop(1, `rgba(100,200,255,${0.6 * this.alpha})`); 

        ctx.fillStyle = gradient;
        ctx.fillRect(this.x - 160, this.y - 100, 400, 280); 
      };

      this.draw = () => {
        this.timer++;
        if (this.timer > this.fadeDelay) {
          this.alpha -= this.fadeSpeed;
          if (this.alpha < 0) this.alpha = 0;
        }

        this.drawTower();
        this.drawGradient();
      };
    }



    function RadarEffect(x, y, outerRadius, innerRadius) {
      this.x = x;
      this.y = y;
      this.outerRadius = outerRadius;
      this.innerRadius = innerRadius;
      this.angle = 0;
      this.alpha = 1;
      this.fadeDir = -0.02; 
      this.alive = true;
      this.speed = 0.01;     
      this.lifetime = 700;   
      this.age = 0;

      
      this.glowWidth = 100;      
      this.glowMaxAlpha = 0.3;   
      this.glowPulseSpeed = 0.05;

      this.draw = () => {
        this.angle += this.speed;
        this.age++;

       
        if (this.age > this.lifetime) {
          this.alpha += this.fadeDir;
          if (this.alpha <= 0) {
            this.alive = false; 
          }
        }

        const pulse = 0.5 + 0.5 * Math.sin(this.age * this.glowPulseSpeed);
        const glowA = this.glowMaxAlpha * pulse * this.alpha;

        ctx.save();
        ctx.globalCompositeOperation = 'lighter'; 
        const grad = ctx.createRadialGradient(
          this.x, this.y, this.outerRadius,                      
          this.x, this.y, this.outerRadius + this.glowWidth     
        );
        grad.addColorStop(0, `rgba(0, 255, 0, ${glowA})`); 
        grad.addColorStop(1, `rgba(0, 255, 0, 0)`);        

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.outerRadius + this.glowWidth, 0, 2 * Math.PI);
        ctx.arc(this.x, this.y, this.outerRadius, 2 * Math.PI, 0, true);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.restore();
       
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.outerRadius, 0, 2 * Math.PI);
        ctx.arc(this.x, this.y, this.innerRadius, 2 * Math.PI, 0, true);
        ctx.strokeStyle = `rgba(0, 200, 0, ${this.alpha})`; 
        ctx.lineWidth = 4;
        ctx.stroke();

       
        const sweep = Math.PI / 4; 
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.outerRadius, this.angle, this.angle + sweep);
        ctx.arc(this.x, this.y, this.innerRadius, this.angle + sweep, this.angle, true);
        ctx.closePath();
        ctx.fillStyle = `rgba(0, 255, 0, ${this.alpha})`;
        ctx.fill();
      };
    }


  function courierStartEffect() {
    this.start = Date.now();
    this.timer = 0;
    this.draw = function () {
      let counter = Math.round((Date.now() - this.start) / 70);
      ctx.beginPath();
      ctx.save();
      ctx.translate(160, 100);
      ctx.scale(-1, 1);
      DrawPath(200 - counter * 6, -90, horseRunning[counter % horseRunning.length], 0.33, "orange");
      ctx.restore();
      if (Date.now() - this.start > 7000) {
        this.lifetime = 0;
      }
    }
  }


    function searchingMatchEffect() {
      this.start = Date.now();
      this.clouds = [];
      this.timer = 0;
      this.phase = "playing"; 
      this.alpha = 1;

      this.draw = function () {
        if (this.phase === "fading") {
          let t = (Date.now() - this.timer) / 2000; 
          this.alpha = 1 - Math.min(t, 1);
          if (t >= 1) {
            this.lifetime = 0;
          }
        }

        ctx.save();
        ctx.globalAlpha = this.alpha;

        DrawRect(0, 0, 320, 200, "#6B92B9");

        if (Math.random() > 0.7 && this.phase === "playing") {
          this.clouds.push(new cloud(
            330,
            Math.random() * 200 + 50,
            { x: -Math.random() - 0.5, y: -Math.random() },
            Math.random() * 20 + 10
          ));
        }

        for (let i = 0; i < this.clouds.length; i++) {
          this.clouds[i].draw();
          if (this.phase !== "playing") {
            this.clouds[i].color = "hsla(120,100%,50%,0.5)";
          }
          if (this.clouds[i].lifetime == 0) {
            this.clouds.splice(i, 1);
          }
        }

        ctx.save();
        ctx.translate(160, 100);
        ctx.rotate((Date.now() - this.start) / 500);
        ctx.lineWidth = 20;

        if (this.phase === "playing") {
          ctx.strokeStyle = "hsl(10,90%,50%)";
        } else {
          ctx.strokeStyle = "green";
        }

        ctx.beginPath();
        ctx.arc(0, 0, 50, 0, Math.PI / 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, 50, Math.PI, Math.PI * 1.5);
        ctx.stroke();

        ctx.restore();
        ctx.restore(); 
    
        if (!searchingMatchPlaying && this.phase === "playing") {
          this.phase = "green";
          this.timer = Date.now();
        }

        if (this.phase === "green" && Date.now() - this.timer > 1000) {
          this.phase = "fading";
          this.timer = Date.now();
        }
      }
    }



  function cloud(x, y, speed, size) {
    this.x = x;
    this.y = y;
    this.speed = speed;
    this.size = size;
    this.color = "hsla(0, 0%, 100%, 0.5)";
    this.draw = function () {
      DrawCircle(this.x, this.y, this.size, this.color);
      this.x += this.speed.x;
      this.y += this.speed.y;
      if (this.x > 380 || this.x < -20) {
        this.lifetime = 0;
      }
    }
  }

  function healingEffect() {
    this.start = Date.now();
    this.orbs = [];
    this.draw = function () {
      if (Date.now() - this.start < 2000) {
        if (Math.random() > 0.3 && Date.now() - this.start < 1000) {
          this.orbs.push(new healingOrb())
        }
        for (let i = 0; i < this.orbs.length; i++) {
          this.orbs[i].draw();
          if (this.orbs[i].lifetime == 0) {
            this.orbs.splice(i, 1);
          }
        }
      } else {
        this.lifetime = 0;
      }
    }
  }

  function healingOrb() {
    this.x = Math.random() * 320;
    this.y = 220;
    this.size = Math.random() * 10 + 10;
    this.color = `hsla(${120 + Math.random() * 40},${100 - Math.random() * 20}%,50%,0.5)`;
    this.draw = function () {
      DrawCircle(this.x, this.y, this.size, this.color);
      this.y -= 3;
      this.x += Math.sin((this.y / 20)) * 5
      if (this.y < -20) {
        this.lifetime = 0;
      }
    }
  }





  function LevelUpEffect() {
    this.start = Date.now();
    this.arrows = [];
    this.arrows.push(new movingArrow(60, 320, 53.3, 60, "white"))
    this.arrows.push(new movingArrow(260, 320, 53.3, 60, "white"))
    this.arrows.push(new movingArrow(160, 220, 53.3, 60, "white"))
    this.arrows.push(new movingArrow(60, 300, 53.3, 60, "yellow"))
    this.arrows.push(new movingArrow(260, 300, 53.3, 60, "yellow"))
    this.arrows.push(new movingArrow(160, 200, 53.3, 60, "yellow"))
    this.draw = function () {
      this.arrows.forEach(arrow => {
        arrow.draw();
      });
      if (Date.now() - this.start > 5000) {
        this.lifetime = 0;
      }
    }
  }

  function movingArrow(x, y, width, angle, color) {
    this.x = x;
    this.y = y;
    this.width = width;
    this.angle = angle;
    this.color = color;
    this.draw = function () {
      DrawArrow(this.x, this.y, this.width, this.angle, this.color)
      this.y -= 3;
      if (this.y < -100) {
        this.lifetime = 0;
      }
    }
  }

  function DrawArrow(x, y, width, angle, color) {
    ctx.beginPath();
    ctx.moveTo(x - width, y + angle);
    ctx.lineTo(x, y);
    ctx.lineTo(x + width, y + angle);
    ctx.strokeStyle = color;
    ctx.lineWidth = 30;
    ctx.stroke();
  }

  function LowHpEffect() {
    this.size = -100;
    this.draw = function () {
      DrawRect(0, 0, 320, 200, `hsla(0, 100%, 50%, ${((Math.sin(this.size / 50) + 1) / 4) + 0.2})`)
      this.size += 1;
      let sizeCalc = (Math.sin(this.size / 8) + 5) / 20;
      DrawPath(155 - sizeCalc * 250, 60 - sizeCalc * 100, heart, sizeCalc, "hsla(0, 100%, 50%, 0.8)")
      if (!lowHpPlaying || deathPlaying || !enableLowHp) this.lifetime = 0;
    }
  }

  function TeleportEffect() {
    this.start = Date.now();
    this.spin = 0;
    this.radius = 1;
    this.waveSize = 0;
    this.draw = function () {
      ctx.beginPath();
      ctx.moveTo(160, 100);
      for (let index = 0; index < 400; index++) {
        ctx.lineTo(160 + Math.sin(index / 10 + (this.spin / 10)) * index / this.radius, 100 + Math.cos(index / 10 + (this.spin / 10)) * index / this.radius)
      }
      ctx.lineWidth = 10;
      ctx.strokeStyle = `hsla(180,100%,50%,${(4000 - (Date.now() - this.start)) / 1000})`;
      ctx.stroke();
      this.spin += (Date.now() - this.start) / 1000;
      if (Date.now() - this.start > 3000) {
        DrawCircle(160, 100, this.waveSize, `hsla(180,100%,${50 + this.waveSize / 5}%,${(370 - this.waveSize) / 400})`)
        this.waveSize += 2;
      };
    }
  }

  function lowManaEffect() {
    this.start = Date.now();
    this.lifetime = 10;
    this.draw = function () {
      let gradient = ctx.createRadialGradient(160, 100, 0, 160, 100, 250);
      gradient.addColorStop(0, "hsla(0, 0%, 0%, 0)");
      gradient.addColorStop((Math.sin((Date.now() - this.start) / 500) * .5 + .5), `hsla(200, 100%, 40%, ${0.2 + ((Math.sin((Date.now() - this.start) / 500)) + 1) / 2})`);
      DrawRect(0, 0, 320, 200, gradient)
      if (!lowManaPlaying || !inGame) this.lifetime = 0;
    }
  }


  function damageOrb(x, y, size) {
    this.x = x;
    this.y = y;
    this.size = size;
    this.speed = {
      x: Math.sin(this.size * 1000) * 3,
      y: -((Math.sin(this.size * 5000) + 1) * 4 + 1)
    }
    this.count = 0;
    this.draw = function () {

      for (let i = 0; i < 10; i++) {
        if (i < this.count)
          DrawCircle(this.x - this.speed.x * i, this.y - (this.speed.y - (0.25 * i)) * i, this.size, "red");
      }

      this.x += this.speed.x;
      this.y += this.speed.y;
      this.speed.y += 0.25;
      this.count += 1;
      if (this.y > 300) this.lifetime = 0;
    }
  }

  function fadingSplatter(x, y, size, color) {
    this.x = x;
    this.y = y;
    this.size = size;
    this.color = color;
    this.start = Date.now();
    this.draw = function () {
      ctx.globalAlpha = 0.5 - (Date.now() - this.start) / 3000;
      DrawCircle(this.x, this.y, this.size, this.color)
      this.size -= 0.5;
      ctx.globalAlpha = 1;
      if (0.5 - (Date.now() - this.start) / 3000 < 0.01) this.lifetime = 0;
      if (this.size < 0) this.lifetime = 0;
    }
  }


  function deathEffect() {
    deathPlaying = true;
    let splatters = [];
    this.start = Date.now();


    this.draw = function () {
      DrawRect(0, 0, 320, 200, "hsla(0, 0%, 0%, 0.01)")
      if (Date.now() - this.start > 1000 && splatters.length == 0) {
        DrawRect(0, 0, 320, 200, "hsla(0, 0%, 0%, 1)")
        for (let i = 0; i < 4; i++) {
          splatters.push(new randomBloodSplatter(10, 130, { x: 12, y: -9 }))
          splatters.push(new randomBloodSplatter(310, 160, { x: -25, y: -9 }))
        }
      }
      for (let i = 0; i < splatters.length; i++) {
        splatters[i].draw();
      }

      if (Date.now() - this.start < 1000) {
        DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${(Date.now() - this.start) / 1000})`)
      }

      if (Date.now() - this.start > 6000) {
        deathPlaying = false;
        DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${1 - (Date.now() - this.start - 6000) / 2000})`)
      }
      if (Date.now() - this.start > 8000) this.lifetime = 0;
    }
  }

  function dayNightEffect(day) {
    dayNightPlaying = true;
    this.start = Date.now();
    this.firstFade = 2000;
    this.totalLength = 5000;
    this.dayCol = "hsla(230, 100%, 6%, 1)";
    this.nightCol = "hsla(196, 100%, 51%, 1)";
    this.day = day;
    this.draw = function () {
      ctx.globalAlpha = Date.now() - this.start < this.totalLength ? 1 : SetRange(1 - ((Date.now() - this.start - this.totalLength) / 1000), 0, 1);
      if (this.day) {
        if (Date.now() - this.start < this.totalLength)
          DrawRect(0, 0, 320, 200, `hsla(230, 100%, 6%, ${(Date.now() - this.start) / this.firstFade})`)
        DrawRect(0, 0, 320, 200, `hsla(196, 100%, 51%, ${((Date.now() - this.start) - this.firstFade) / (this.totalLength - this.firstFade)})`)
      }
      if (!this.day) {
        if (Date.now() - this.start < this.totalLength)
          DrawRect(0, 0, 320, 200, `hsla(196, 100%, 10%, ${(Date.now() - this.start) / this.firstFade})`)
        DrawRect(0, 0, 320, 200, `hsla(230, 100%, 3%, ${((Date.now() - this.start) - this.firstFade) / (this.totalLength - this.firstFade)})`)
      }
      ctx.beginPath();
      ctx.save();
      ctx.translate(160, 200);
      ctx.rotate((SetRange(Date.now() - this.start, 0, 4200)) / 800);
      DrawCircle(-100, 0, 30, this.day ? "white" : "yellow")
      ctx.rotate(-(SetRange(Date.now() - this.start, 0, 4200)) / 2000);
      DrawCircle(0, 100, 30, this.day ? "yellow" : "white")
      ctx.restore();
      ctx.globalAlpha = 1;
      if (Date.now() - this.start > this.totalLength + 1000) this.lifetime = 0;
      if (Date.now() - this.start > this.totalLength + 500) dayNightPlaying = false;
    }
  }
  function VictoryEffect(dire) {
    this.start = Date.now();
    this.particles = [];
    this.dire = dire;
    this.totalLength = 6000;
    this.draw = function () {
      DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${SetRange(Date.now() - this.start > this.totalLength ? 1000 - (Date.now() - this.start - this.totalLength) : Date.now() - this.start, 0, 1000) / 1000})`)
      let gradient = ctx.createRadialGradient(160, 100, 0, 160, 100, Date.now() - this.start > this.totalLength ? SetRange(100 - ((Date.now() - this.start) - this.totalLength) / 20, 0, 100) : SetRange((Date.now() - this.start) / 20, 0, 100));
      gradient.addColorStop(0, this.dire ? "hsla(0, 100%, 50%, 1)" : "hsla(112, 100%, 51%, 1)");
      gradient.addColorStop(1, "hsla(0, 0%, 0%, 0)");
      DrawRect(0, 0, 320, 200, gradient)
      if (Math.random() > 0.9) {
        this.particles.push(new randomParticle(160, 100, 1, Math.random() > 0.5 ? this.dire ? "hsla(0, 100%, 50%, 1)" : "hsla(112, 100%, 51%, 1)" : this.dire ? "black" : "white"))
        this.particles.push(new fallingParticle(this.dire ? "hsla(0, 100%, 50%, 1)" : "hsla(112, 100%, 51%, 1)"))
      }
      for (let i = 0; i < this.particles.length; i++) {
        ctx.globalAlpha = Date.now() - this.start < this.totalLength ? 1 : SetRange(1 - ((Date.now() - this.start - this.totalLength) / 1000), 0, 1);
        this.particles[i].draw();
        if (this.particles[i].lifetime == 0) this.particles.splice(i, 1);
        ctx.globalAlpha = 1;
      }
      if (Date.now() - this.start > this.totalLength + 2000) this.lifetime = 0;
    }
  }

  function randomParticle(x, y, speed, color) {
    this.start = Date.now();
    this.dir = { x: Math.random() * 2 - 1, y: Math.random() * 2 - 1 }
    this.x = x;
    this.y = y;
    this.speed = speed;
    this.color = color;
    this.size = Math.random() * 5 + 5;
    this.draw = function () {
      DrawCircle(this.x, this.y, this.size, color)
      this.x += this.dir.x * this.speed;
      this.y += this.dir.y * this.speed;
      if (Date.now() - this.start > 3000) this.lifetime = 0;
    }
  }

  function fallingParticle(color) {
    this.start = Date.now();
    this.x = Math.random() * 320;
    this.y = -20;
    this.size = Math.random() * 5 + 5;
    this.speed = Math.random() * 2 + 1;
    this.color = color;
    this.draw = function () {
      DrawCircle(this.x, this.y, this.size, this.color)
      this.y += this.speed;
      if (Date.now() - this.start > 3000) this.lifetime = 0;
    }
  }

  function randomBloodSplatter(x, y, spatterDirection) {
    this.x = x;
    this.y = y;
    this.size = Math.random() * 10 + 5;
    this.dir = spatterDirection;
    this.pointAmount = 20;
    this.pointArray = [];
    this.start = Date.now();
    this.speed = Math.random() * 0.01;
    for (let i = 0; i < this.pointAmount; i++) {
      setTimeout(() => {
        this.pointArray.push({ x: this.x + Math.random() * (this.dir.x * i), y: this.y + Math.random() * (this.dir.y * i), size: Math.random() * 8 + 3 })
      }, i * 20);

    }

    this.draw = function () {
      this.pointArray.forEach(point => {
        DrawCircle(point.x, point.y, point.size, "red")
        if (Date.now() - this.start > 1000) {
          point.y += this.speed;
          this.speed += 0.0005 * Math.random();
        }
      });

    }
  }


  function courierFinishEffect() {
    this.start = Date.now();
    this.particles = [];
    this.draw = function () {

      ctx.globalAlpha = this.elapsed < 4000 ? 1 : SetRange(1 - (this.elapsed - 4000) / 1000, 0, 1);
      this.elapsed = Date.now() - this.start;
      if (this.elapsed > 1500) {
        if (Math.random() > 0.6) {
          this.particles.push(new boxParticle(160, 100, Math.random() * 6 + 4, Math.random() > 0.5 ? "yellow" : "blue"));
        }
        this.particles.forEach(particle => {
          particle.draw();
        })
      }

      ctx.beginPath();
      ctx.save();
      ctx.translate(160, SetRange(-50 + this.elapsed / 10, -50, 100));
      if (this.elapsed > 1500)
        ctx.rotate(Math.sin((Date.now() - this.start) / 300) / 4)
      drawBox(0, -60, 40);
      ctx.restore();
      ctx.globalAlpha = 1;
      if (this.elapsed > 8000) {
        this.lifetime = 0;
      }
    }

  }

  function boxParticle(x, y, size, color) {
    this.x = x;
    this.y = y;
    this.size = size;
    this.color = color;
    this.speed = {
      x: Math.sin(this.size * 1000) * 3,
      y: -((Math.sin(this.size * 5000) + 1) * 4 + 1)
    }
    this.draw = function () {
      DrawCircle(this.x, this.y, this.size, this.color);
      this.x += this.speed.x;
      this.y += this.speed.y;
      this.speed.y += 0.25;
      if (this.y > 200) this.lifetime = 0;
    }
  }

  function drawBox(x, y, size) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + size, y + size / 1.4);
    ctx.lineTo(x + size, y + size / 1.4 + size * 1.4);
    ctx.lineTo(x - size / 8, y + size * 2.7);
    ctx.lineTo(x - size * 1.2, y + size / 1.4 + size * 1.4);
    ctx.lineTo(x - size * 1.2, y + size / 1.4);
    ctx.lineTo(x, y);
    ctx.moveTo(x - size / 8, y + size * 2.7);
    ctx.lineTo(x - size / 8, y + size * 1.3)
    ctx.lineTo(x + size, y + size / 1.4);
    ctx.moveTo(x - size / 8, y + size * 1.3);
    ctx.lineTo(x - size * 1.2, y + size / 1.4);
    ctx.strokeStyle = "black";
    ctx.lineWidth = 5;
    ctx.fillStyle = "hsla(47, 100%, 63%, 1)"
    ctx.fill();
    ctx.stroke();
  }



  function lerp(a, b, speed) {
    return a + speed * (b - a)
  }

  function IdleState() {
    let lightness = new Int8Array(engine.zone.lightness);
    let sat = new Int8Array(engine.zone.saturation);
    let hue = new Int16Array(engine.zone.hue);

    for (var iZone = 0; iZone < 560; iZone++) {
      ctx.fillStyle = 'hsl(' + hue[iZone] + ',' + sat[iZone] + '%,' + lightness[iZone] * keyScreenBrightness / 100 + '%)'

      var iRow = Math.floor(iZone / 28);
      var iCol = iZone % 28;
      var iWidth = 320 / 28;
      var iHeight = 200 / 20;
      var iZx = iCol * iWidth;
      var iZy = iRow * iHeight;

      ctx.fillRect(iZx, iZy, iWidth, iHeight);

    }
  }



  //helper functions

  function DrawCircle(x, y, radius, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.fill();
  };

  function DrawRect(x, y, width, height, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
  };

  function DrawPath(x, y, path, scale, color) {
    ctx.fillStyle = color;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale)
    let ex = new Path2D(path);
    ctx.fill(ex);
    ctx.restore();
  };

  function SetRange(num, min, max) {
    return Math.min(Math.max(num, min), max)
  }

  function hexToHSL(hex) {
    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);

    var r = parseInt(result[1], 16);
    var g = parseInt(result[2], 16);
    var b = parseInt(result[3], 16);

    (r /= 255), (g /= 255), (b /= 255);
    var max = Math.max(r, g, b),
      min = Math.min(r, g, b);
    var h,
      s,
      l = (max + min) / 2;

    if (max === min) {
      h = s = 0; // achromatic
    } else {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r:
          h = (g - b) / d + (g < b ? 6 : 0);
          break;
        case g:
          h = (b - r) / d + 2;
          break;
        case b:
          h = (r - g) / d + 4;
          break;
      }
      h /= 6;
    }

    s = s * 100;
    s = Math.round(s);
    l = l * 100;
    l = Math.round(l);
    h = Math.round(360 * h);

    var colors = [];
    colors['h'] = h;
    colors['s'] = s;
    colors['l'] = l;

    return colors;
  }






  function StateHandler() {
    var stack = [];
    var state = null;

    var updateState = function () {
      if (stack.length > 0) {
        state = stack[stack.length - 1];
      } else {
        state = null;
      }
    }

    this.Push = function (newState) {
      stack.push(newState);
      updateState();
    }

    this.Pop = function () {
      stack.pop();
      updateState();
    }

    this.Process = function () {
      if (state != null) {
        state.Process();
      }
    }
  }



  function Meter(count, callback) {
    this.size = count;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    var values = [];

    this.setValue = function (updatedValue) {
      // Add and shift.  
      values.push(updatedValue);
      if (values.length > this.size) { values.shift(); }

      // Exit early if we've got a long-term match.
      for (var i = 0; i < (values.length - 1); i++) {
        if (values[i] !== values[i + 1]) return;
      }

      // We got here, so we've got a matching value collection.
      if (this.value !== values[0]) {
        //var fromZero = this.value === 0;
        //var toZero = values[0] === 0;      
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        callback();
      }
    }
  }

  function onEngineReady() {
    // Grab canvas and rendering context.
    canvas = document.getElementById('exCanvas');
    ctx = canvas.getContext('2d');
    // Start updates *after* our engine is accessible and ready.

    window.requestAnimationFrame(update);
  }
  onEngineReady()
