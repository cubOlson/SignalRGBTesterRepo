  <!-- ═══════════════════════════════════════════════════════════
       VISION METERS
       Each meter captures a small region of the game screen and
       measures what percentage of its pixels match the given HSL
       range. The JS Meter class smooths readings over N frames
       before firing a callback.

       Detection strategy: every game state uses a POSITIVE meter
       (confirms the expected color IS present) paired with a
       NEGATIVE "Not" meter (confirms the region does NOT show that
       color during baseline/off state). A state is considered active
       only when positive is high AND negative is low, preventing
       false positives from ambient lighting or UI transitions.

       TESTER NOTE: If an effect never fires, first check the QA Tool
       — load a screenshot from the target resolution and verify the
       meter region actually captures the right pixels at the right
       color. Then adjust HSL ranges or region coordinates as needed.
       ═══════════════════════════════════════════════════════════ -->

       Any high positive reading sets gInGame = true. All feed inGameCallback.

<body style="margin: 0; padding: 0; background: #000;">
  <canvas id="exCanvas" width="320" height="200"></canvas>
</body>

<script>
    // ═══════════════════════════════════════════════════════════════
    // CANVAS SETUP
    // SignalRGB renders this 320×200 canvas onto the device layout.
    // All draw coordinates are in canvas pixels; user-facing position
    // values (0–100) are scaled to canvas pixels in JS (x * 3.2, y * 2.0).
    // ═══════════════════════════════════════════════════════════════
    const canvas = document.getElementById('exCanvas')
    const ctx    = canvas.getContext('2d')
    const width  = 320
    const height = 200

    // Hidden canvas — all effects are drawn here each frame, then
    // composited onto ctx in a single drawImage call.
    const hiddenCanvas = document.createElement('canvas')
    hiddenCanvas.width  = width
    hiddenCanvas.height = height
    const hiddenCtx = hiddenCanvas.getContext('2d')

    // Active effects pool. Each entry has a draw() method and a lifetime
    // property. Objects with lifetime <= 0 are filtered out after drawing.
    // Objects with lifetime === undefined live until self-terminated.
    let effects = []

    // ═══════════════════════════════════════════════════════════════
    // METER DECLARATIONS
    // Each Meter(size, callback) smooths the vision signal over `size`
    // consecutive identical frames before updating its .value and firing
    // the callback. Larger size = more stable but slower to react.
    // ═══════════════════════════════════════════════════════════════

    // In-game detection — three HUD regions, any positive reading sets gInGame
    let InGameBlue1  = new Meter(5, inGameCallback)
    let InGameRed1   = new Meter(5, inGameCallback)
    let InGameGreen1 = new Meter(5, inGameCallback)
    let InGameBlue2  = new Meter(5, inGameCallback)
    let InGameRed2   = new Meter(5, inGameCallback)
    let InGameBlue3  = new Meter(5, inGameCallback)
    let InGameRed3   = new Meter(5, inGameCallback)

    // Health bar — size 20 for anchor stability; size 5 for bar fill tracking
    let HealthCheckMeter  = new Meter(20, healthCallback)
    let HealthLengthMeter = new Meter(5,  healthCallback)

    // Combat / zone — size 3 for fast zone-change response
    let CombatMeter = new Meter(3, zoneCallback)
    let SafeMeter   = new Meter(3, zoneCallback)

    // Crouch — size 5; icon changes gradually when entering/leaving crouch
    let CrouchMeter = new Meter(5, crouchCallback)

    // Phone call — size 15; call state is stable once connected
    let CallMeter = new Meter(15, callCallback)

    // Encryption mini-game — size 5; UI appears abruptly
    let EncryptMeter      = new Meter(5, encryptCallback)
    let EncryptGreenMeter = new Meter(5, encryptCallback)
    let EncryptRedMeter   = new Meter(5, encryptCallback)

    // Scanner — size 5; scan lines appear quickly on activation
    let ScanMeter = new Meter(5, scanCallback)

    // Death — size 20; high confidence needed to avoid combat false positives
    let DeadMeter = new Meter(20, deadCallback)

    // Vehicle — size 10 for speedometer; size 2 for rev counter (fast-changing)
    let VehicleMeter = new Meter(10, vehicleCallback)
    let RevMeter     = new Meter(2,  vehicleCallback)

    // Progress bar — size 10 for anchor check; raw vision value used for bar width
    let ProgressCheckMeter = new Meter(10, progressCallback)

    // NCPD wanted — size 10; star icon flashes but we want stable confirmation
    let WantedBlueMeter = new Meter(10, wantedCallback)

    // Sneak kill — size 5; takedown brackets are brief
    let SneakKillMeter  = new Meter(5, sneakKillCallback)
    let SneakKillMeter2 = new Meter(5, sneakKillCallback)

    // Joytoy — size 15; scene UI is stable once loaded
    let JoytoyYellowMeter = new Meter(15, joytoyCallback)
    let JoytoyRedMeter1   = new Meter(15, joytoyCallback)
    let JoytoyRedMeter2   = new Meter(15, joytoyCallback)

    //#region Update
    // ═══════════════════════════════════════════════════════════════
    // MAIN UPDATE LOOP — called every animation frame (~60fps).
    // Order of operations:
    //   1. Clear hidden canvas to black
    //   2. Draw background (ambience / color cycle / custom)
    //   3. Spawn idle effect after 100 frames out-of-game (no meter callback)
    //   4. Feed current vision readings into each Meter — may trigger callbacks
    //   5. Draw all active effects; filter out expired ones
    //   6. Draw HUD bar overlay (always on top)
    //   7. Composite hidden canvas onto the main canvas
    // ═══════════════════════════════════════════════════════════════
    function update() {
      DrawRect(0, 0, 320, 200, 'black')
      backgroundHandler()

      // Idle is not meter-driven — spawn after 100 consecutive out-of-game frames
      if (!gInGame && idleOn && !gCall) {
        if (gIdleCount < 100) gIdleCount++
        if (gIdleCount === 100 && effects.length < 1) effects.push(new idle())
      } else {
        gIdleCount = 0
      }

      InGameBlue1.setValue(engine.vision.inGameMapBlue)
      InGameRed1.setValue(engine.vision.inGameMapRed)
      InGameGreen1.setValue(engine.vision.inGameMapGreen)
      InGameBlue2.setValue(engine.vision.inGamePhoneBlue)
      InGameRed2.setValue(engine.vision.inGamePhoneRed)
      InGameBlue3.setValue(engine.vision.inGameCarBlue)
      InGameRed3.setValue(engine.vision.inGameCarRed)
      HealthCheckMeter.setValue(engine.vision.checkHealth)
      HealthLengthMeter.setValue(engine.vision.healthLength1 + engine.vision.healthLength2)
      CombatMeter.setValue(engine.vision.combatRed)
      SafeMeter.setValue(engine.vision.safeGreen)
      CrouchMeter.setValue(engine.vision.crouchRed)
      CallMeter.setValue(engine.vision.callRed)
      EncryptMeter.setValue(engine.vision.encryptYellow)
      EncryptGreenMeter.setValue(engine.vision.encryptGreen)
      EncryptRedMeter.setValue(engine.vision.encryptRed)
      ScanMeter.setValue(engine.vision.scanRed1 + engine.vision.scanRed2)
      DeadMeter.setValue(engine.vision.deadRed)
      VehicleMeter.setValue(engine.vision.vehicleBlue)
      RevMeter.setValue(engine.vision.vehicleRevBlue)
      ProgressCheckMeter.setValue(engine.vision.progressRedCheck)
      WantedBlueMeter.setValue(engine.vision.wantedBlue)
      SneakKillMeter.setValue(engine.vision.sneakKill1)
      SneakKillMeter2.setValue(engine.vision.sneakKill2)
      JoytoyYellowMeter.setValue(engine.vision.mfJTYellowAct1)
      JoytoyRedMeter1.setValue(engine.vision.mJTRedAct1)
      JoytoyRedMeter2.setValue(engine.vision.fJTRedAct1)

      effects.forEach(ele => { ele.draw() })
      effects = effects.filter(ele => !(ele.lifetime <= 0))

      // Fade HUD alpha in when health bar is visible, out when not
      if (!gHealth) gHUDAlpha >= .01 ? gHUDAlpha -= .01 : gHUDAlpha = 0
      else          gHUDAlpha < 1   ? gHUDAlpha += .01 : gHUDAlpha = 1
      drawHud()

      ctx.drawImage(hiddenCanvas, 0, 0)
      window.requestAnimationFrame(update)
    }
    //#endregion

    //#region Callbacks
    // ═══════════════════════════════════════════════════════════════
    // CALLBACKS
    // Each callback is fired by one or more Meters when their signal
    // stabilizes. Callbacks evaluate the CURRENT state of all related
    // meters and flags, then push effects or flip state booleans.
    // ═══════════════════════════════════════════════════════════════

    // ── IN-GAME ──────────────────────────────────────────────────────
    // gInGame gates all gameplay effects. Any of the three HUD regions
    // (map, phone, car) reading high confirms the player is in-game.
    let gInGame = false
    let gIdleCount = 0  // frames elapsed since leaving game, used to delay idle spawn
    function inGameCallback() {
      if ((InGameBlue2.value >= .75 || InGameRed2.value >= .75) || (InGameBlue3.value >= .75 || InGameRed3.value >= .75)) {
        gInGame = true
      } else if (InGameBlue1.value < .25 && InGameRed1.value < .25 && InGameGreen1.value < .25 && InGameBlue2.value < .25 && InGameRed2.value < .25) {
        gInGame = false
      }
    }

    // ── HEALTH HUD ───────────────────────────────────────────────────
    // gHealth gates HUD visibility. gHUDAlpha fades in/out each frame.
    // currentHealthSize is lerped toward the actual bar length each frame.
    let gHealth          = false
    let gHUDAlpha        = 0
    let designatedHealthSize = 0
    let currentHealthSize    = 0
    function healthCallback() {
      if (HealthCheckMeter.value >= .95 && gInGame && HealthLengthMeter.value > .1) {
        gHealth = true
      } else if ((HealthCheckMeter.value < .1 && HealthLengthMeter.value < .1) || !gInGame) {
        gHealth = false
      }
    }

    // drawHud: draws the health bar directly to the hidden canvas each frame.
    // Manages its own globalAlpha so gHUDAlpha fading doesn't bleed into effects.
    function drawHud() {
      if (adjToggle) gHUDAlpha = 1
      if (!enableHealthHUD) return
      const hpHSL = hexToHSL(healthColor)
      designatedHealthSize = gInGame ? HealthLengthMeter.value * 1.6 : 0
      currentHealthSize = lerp(currentHealthSize, designatedHealthSize, 0.05)
      hiddenCtx.globalAlpha = gHUDAlpha
      if (blackToggle) DrawRect(healthX * 3.2, healthY * 2, healthWidth * 3.2, healthHeight, 'black')
      DrawRect(
        healthX * 3.2, healthY * 2,
        adjToggle ? healthWidth * 3.2 : currentHealthSize * healthWidth,
        healthHeight,
        `hsl(${hpHSL[0]}, ${hpHSL[1]}%, ${hpHSL[2]}%)`
      )
      hiddenCtx.globalAlpha = 1
    }

    // ── CROUCH / SNEAK ────────────────────────────────────────────────
    // gCrouched is set when crouchRed is mid-range — the icon is partially
    // lit when crouching and fully lit when standing. Cleared when fully
    // standing or out-of-game.
    let gCrouched = false
    function crouchCallback() {
      if ((CrouchMeter.value >= .95 && engine.vision.crouchNotRed < .1 && gInGame) || !gInGame) {
        gCrouched = false
      } else if (CrouchMeter.value >= .25 && CrouchMeter.value <= .7 && engine.vision.crouchNotRed < .1 && gInGame && sneakOn && !gCrouched) {
        gCrouched = true
        effects.push(new sneaking())
      }
    }

    // ── PHONE CALL ────────────────────────────────────────────────────
    // gCall gates the in-call audio visualizer. Cleared when callRed drops.
    let gCall = false
    function callCallback() {
      if (CallMeter.value >= .9 && engine.vision.callNotRed < .1 && callOn && !gCall) {
        gCall = true
        effects.push(new inCall())
      } else if (CallMeter.value < .1) {
        gCall = false
      }
    }

    // ── COMBAT / ZONE ─────────────────────────────────────────────────
    // gSafeZone and gCombat are mutually exclusive — the minimap shows
    // either green or red, never both. Wanted suppresses hostile() since
    // combat and wanted can overlap visually.
    let gSafeZone = false
    let gCombat   = false
    function zoneCallback() {
      if (SafeMeter.value >= .95 && gInGame && zoneOn && !gSafeZone && InGameGreen1.value >= .95) {
        gSafeZone = true
        effects.push(new safeZone())
      } else if ((SafeMeter.value < .1 && gInGame) || !gInGame) {
        gSafeZone = false
      }

      if (CombatMeter.value >= .75 && gInGame && zoneOn && !gCombat) {
        gCombat = true
        effects.push(new hostile())
      } else if ((CombatMeter.value < .1 && gInGame) || !gInGame) {
        gCombat = false
      }
    }

    // ── ENCRYPTION ────────────────────────────────────────────────────
    // gEncrypt gates the main encryption effect. gEncryptSuccess/Fail
    // are set each frame while that result color is visible — they reset
    // each callback invocation so their effects re-fire on each new result.
    let gEncrypt        = false
    let gEncryptSuccess = false
    let gEncryptFail    = false
    function encryptCallback() {
      if (EncryptMeter.value >= .95 && engine.vision.encryptNotYellow < .1 && !gInGame && !gEncrypt && encryptionOn) {
        gEncrypt = true
        effects.push(new encryption())
      } else if (EncryptMeter.value < .1 || engine.vision.encryptNotYellow > .25 || gInGame) {
        gEncrypt = false
      }

      if (EncryptGreenMeter.value >= .5 && gEncrypt && !gEncryptSuccess && encryptionOn) {
        gEncryptSuccess = true
        effects.push(new encryptionPass())
      } else {
        gEncryptSuccess = false
      }

      if (EncryptRedMeter.value >= .5 && gEncrypt && !gEncryptFail && encryptionOn) {
        gEncryptFail = true
        effects.push(new encryptionFail())
      } else {
        gEncryptFail = false
      }
    }

    // ── SCANNER ───────────────────────────────────────────────────────
    // gScan gates the scanning overlay. Sum of both scan meters must be
    // ≥1.75 to fire — requires both indicators present simultaneously.
    let gScan = false
    function scanCallback() {
      if (ScanMeter.value >= 1.75 && !gInGame && engine.vision.scanNotRed < .1 && !gScan) {
        gScan = true
        effects.push(new scanning())
      } else if (ScanMeter.value < .25 || gInGame) {
        gScan = false
      }
    }

    // ── DEATH ─────────────────────────────────────────────────────────
    // gDead gates the death particle effect. Cleared when deadRed drops.
    let gDead = false
    function deadCallback() {
      if (DeadMeter.value >= .95 && engine.vision.deadNotRed < .1 && !gInGame && !gDead) {
        gDead = true
        effects.push(new death())
      } else if (DeadMeter.value < .1) {
        gDead = false
      }
    }

    // ── VEHICLE ───────────────────────────────────────────────────────
    // gVehicle gates the driving effect. vehicleNotBlue guard prevents
    // false positives from similar-colored HUD elements on foot.
    let gVehicle = false
    function vehicleCallback() {
      if (VehicleMeter.value >= .95 && engine.vision.vehicleNotBlue < .1 && vehicleOn && !gVehicle) {
        gVehicle = true
        effects.push(new inVehicle())
      } else if (VehicleMeter.value < .1 || !gInGame) {
        gVehicle = false
      }
    }

    // ── PROGRESS BAR ──────────────────────────────────────────────────
    // gProgress gates the progress bar effect. Bar width is read directly
    // from engine.vision.progressBarRed inside the effect each frame.
    let gProgress = false
    function progressCallback() {
      if (ProgressCheckMeter.value >= .9 && engine.vision.progressNotRed < .1 && !gProgress && progressOn) {
        gProgress = true
        effects.push(new generalProgress())
      } else if (ProgressCheckMeter.value < .1) {
        gProgress = false
      }
    }

    // ── NCPD WANTED ───────────────────────────────────────────────────
    // gWanted gates the blue/red flashing wanted effect. Clears on any
    // callback invocation where the condition is not met — no stable-off
    // threshold needed since wanted state changes abruptly.
    let gWanted = false
    function wantedCallback() {
      if (WantedBlueMeter.value >= .95 && gInGame && engine.vision.wantedNotBlue < .1 && !gWanted && wantedOn) {
        gWanted = true
        effects.push(new wanted())
      } else {
        gWanted = false
      }
    }

    // ── SNEAK KILL ────────────────────────────────────────────────────
    // gSneakKill gates the takedown effect. Either bracket meter being
    // ≥95% is sufficient. Flag is cleared by the meter dropping below
    // 0.1, not by effect expiry — prevents immediate re-spawn.
    let gSneakKill = false
    function sneakKillCallback() {
      if ((SneakKillMeter.value >= .95 || SneakKillMeter2.value >= .95) && gInGame && engine.vision.sneakKillNotBlue < .1 && sneakOn && !gSneakKill) {
        gSneakKill = true
        effects.push(new sneakKill())
      } else if (SneakKillMeter.value < .1 || !gInGame) {
        gSneakKill = false
      }
    }

    // ── JOYTOY ────────────────────────────────────────────────────────
    // gJoytoy gates the heart effect. All three meters must confirm —
    // yellow header + either red element — to avoid menu false positives.
    let gJoytoy = false
    function joytoyCallback() {
      if (JoytoyYellowMeter.value >= .95 && (JoytoyRedMeter1.value >= .75 || JoytoyRedMeter2.value >= .75) && gInGame && !gJoytoy && joytoyOn) {
        gJoytoy = true
        effects.push(new joytoy())
      } else if (gInGame && JoytoyYellowMeter.value < .1 && JoytoyRedMeter1.value < .1 && JoytoyRedMeter2.value < .1) {
        gJoytoy = false
      }
    }
    //#endregion

    //#region Background Modes
    // ═══════════════════════════════════════════════════════════════
    // BACKGROUND SYSTEM
    // Eight modes supported (see backgroundMode meta property).
    // Mode routing uses string.includes() so shared keywords act as
    // feature flags.
    //
    // Mode map:
    //   Color Cycle              → flat color, rotating hue
    //   Color Cycle Ambience     → per-zone screen capture, rotating hue offset
    //   Color Cycle Audio Viz    → flat color, rotating hue, audio-driven sat/lit
    //   Custom                   → flat solid color (backColor)
    //   Ambience                 → per-zone screen capture, native hue
    //   Custom Ambience          → per-zone screen capture, hue locked to backColor
    //   Ambience Audio Viz       → per-zone screen capture, audio-modulated sat/lit
    //   Custom Audio Viz         → flat color (backColor), audio-driven sat/lit
    // ═══════════════════════════════════════════════════════════════

    // proBack: [H, S, L] for the user's custom color. Populated on backColor change.
    let proBack = [0, 0, 0]
    function onbackColorChanged() {
      proBack = hexToHSL(backColor)
    }

    // audioEase: exponentially smoothed audio density → saturation/lightness.
    let audioEase = { sat: 0, lit: 0 }
    let gCycle = 0 // current hue offset for color cycle modes (0–360, wraps)

    function updateAudioEase() {
      const targetDensity = engine.audio.density * 100
      audioEase.sat += (targetDensity - audioEase.sat) / 10
      audioEase.lit += (targetDensity - audioEase.lit) / 10
    }

    // Convenience wrapper — keeps draw calls readable
    function getColorString(hue, sat, lit, alpha) {
      return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`
    }

    // Advance the color cycle by 0.5° per frame (full cycle ≈ 12s at 60fps)
    function updateColorCycle() {
      gCycle = (gCycle + 0.5) % 360
    }

    function backgroundHandler() {
      const alpha = ambienceAlpha / 100

      if (backgroundMode.includes('Color Cycle')) updateColorCycle()
      if (backgroundMode.includes('Audio'))       updateAudioEase()

      if (backgroundMode.includes('Ambience')) {
        if (backgroundMode === 'Ambience Audio Visualizer') {
          copyScreenAudio(alpha)
        } else {
          copyScreen(alpha)
        }
        return
      }

      const hue = proBack[0] + (backgroundMode.includes('Color Cycle') ? gCycle : 0)
      const sat = backgroundMode.includes('Audio') ? audioEase.sat * 0.33 + 66 : proBack[1]
      const lit = backgroundMode.includes('Audio') ? audioEase.lit * 0.9  + 10 : proBack[2]
      DrawRect(0, 0, 320, 200, getColorString(hue, sat, lit, alpha))
    }

    // Zone grid dimensions — must match the engine's zone layout.
    const ZONE_COLS   = 28
    const ZONE_ROWS   = 20
    const TOTAL_ZONES = ZONE_COLS * ZONE_ROWS

    // copyScreenAudio: per-zone ambience with audio-modulated sat and lightness.
    function copyScreenAudio(alpha) {
      const lightness = new Int8Array(engine.zone.lightness)
      const sat       = new Int8Array(engine.zone.saturation)
      const hue       = new Int16Array(engine.zone.hue)
      const w = 320 / ZONE_COLS
      const h = 200 / ZONE_ROWS
      const satMultiplier = audioEase.sat / 200 + 0.5
      const litMultiplier = audioEase.lit / 100
      for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
        const row = Math.floor(iZone / ZONE_COLS)
        const col = iZone % ZONE_COLS
        hiddenCtx.fillStyle = getColorString(
          hue[iZone],
          sat[iZone] * satMultiplier,
          lightness[iZone] * litMultiplier,
          alpha
        )
        hiddenCtx.fillRect(col * w, row * h, w, h)
      }
    }

    // copyScreen: per-zone ambience with optional hue modification.
    //   Custom Ambience      → replace all zone hues with backColor hue
    //   Color Cycle Ambience → shift all zone hues by gCycle offset
    //   Plain Ambience       → use native zone hues unchanged
    function copyScreen(alpha) {
      const lightness = new Int8Array(engine.zone.lightness)
      const sat       = new Int8Array(engine.zone.saturation)
      const hue       = new Int16Array(engine.zone.hue)
      const w = 320 / ZONE_COLS
      const h = 200 / ZONE_ROWS
      for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
        const row = Math.floor(iZone / ZONE_COLS)
        const col = iZone % ZONE_COLS
        const finalHue = backgroundMode === 'Custom Ambience'
          ? proBack[0]
          : hue[iZone] + (backgroundMode === 'Color Cycle Ambience' ? gCycle : 0)
        hiddenCtx.fillStyle = getColorString(finalHue, sat[iZone], lightness[iZone], alpha)
        hiddenCtx.fillRect(col * w, row * h, w, h)
      }
    }
    //#endregion

    //#region Helper Functions
    // ─── DRAW PRIMITIVES ────────────────────────────────────────────

    // DrawLine: stroke a straight line between two [x,y] points
    function DrawLine(start, end, color, stroke) {
      hiddenCtx.beginPath()
      hiddenCtx.moveTo(start[0], start[1])
      hiddenCtx.lineTo(end[0], end[1])
      hiddenCtx.strokeStyle = color
      hiddenCtx.lineWidth   = stroke
      hiddenCtx.stroke()
    }

    // DrawEllipse: filled ellipse
    function DrawEllipse(x, y, w, h, rotation, color) {
      hiddenCtx.beginPath()
      hiddenCtx.ellipse(x, y, w, h, rotation, 0, Math.PI * 2)
      hiddenCtx.fillStyle = color
      hiddenCtx.fill()
    }

    // DrawCircle: filled circle
    function DrawCircle(x, y, radius, color) {
      hiddenCtx.beginPath()
      hiddenCtx.fillStyle = color
      hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
      hiddenCtx.fill()
    }

    // DrawStroke: outlined circle (no fill)
    function DrawStroke(x, y, radius, color, stroke) {
      hiddenCtx.beginPath()
      hiddenCtx.strokeStyle = color
      hiddenCtx.lineWidth   = stroke
      hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
      hiddenCtx.stroke()
    }

    // DrawRect: filled rectangle — also accepts canvas gradient objects as color
    function DrawRect(x, y, w, h, color) {
      hiddenCtx.beginPath()
      hiddenCtx.fillStyle = color
      hiddenCtx.fillRect(x, y, w, h)
    }

    // ─── UTILITIES ──────────────────────────────────────────────────

    // hexToHSL: converts a CSS hex color string to [H(0–360), S(0–100), L(0–100)]
    function hexToHSL(hex) {
      const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || []
      const rgb = [r, g, b].map(x => parseInt(x, 16) / 255)
      const max = Math.max(...rgb)
      const min = Math.min(...rgb)
      const l   = (max + min) / 2
      if (max === min) return [0, 0, Math.round(l * 100)]
      const d = max - min
      const s = l > 0.5 ? d / (2 - max - min) : d / (max + min)
      let h
      const [nr, ng, nb] = rgb
      if      (max === nr) h = (ng - nb) / d + (ng < nb ? 6 : 0)
      else if (max === ng) h = (nb - nr) / d + 2
      else                 h = (nr - ng) / d + 4
      return [Math.round(h * 60), Math.round(s * 100), Math.round(l * 100)]
    }

    // lerp: linear interpolation — used to smooth health bar width changes
    function lerp(a, b, speed) {
      return a + speed * (b - a)
    }

    // ─── METER CLASS ────────────────────────────────────────────────
    // Meter(size, callback): frame-stabilizing debouncer for vision signals.
    // setValue(v) only updates .value and fires callback when the last `size`
    // readings are ALL identical — filters single-frame noise.
    function Meter(size, callback) {
      this.size      = size
      this.value     = 0
      this.diff      = 0
      this.increased = false
      this.decreased = false
      let values = []

      this.setValue = function (updatedValue) {
        values.push(updatedValue)
        if (values.length > this.size) values.shift()

        for (let i = 0; i < values.length - 1; i++) {
          if (values[i] !== values[i + 1]) return
        }
        if (this.value !== values[0]) {
          this.diff      = Math.abs(this.value - values[0])
          this.increased = this.value < values[0]
          this.decreased = this.value > values[0]
          this.value     = values[0]
          callback()
        }
      }
    }
    //#endregion

    //#region Effects
    // ═══════════════════════════════════════════════════════════════
    // EFFECTS
    // Each effect is a constructor function. Instances are pushed into
    // the effects[] array and drawn every frame until lifetime is set
    // to 0 (or the object self-terminates).
    //
    // Coordinate system:
    //   User-facing X/Y/W/H properties are 0–100 (% of canvas).
    //   Canvas pixels: x * 3.2  (320 / 100),  y * 2.0  (200 / 100)
    // ═══════════════════════════════════════════════════════════════

    // ── encryptionPass ────────────────────────────────────────────
    // Spawner: fires a green passFailHelp particle every 2 frames while
    // encryption is succeeding. Expires when gEncryptSuccess clears.
    function encryptionPass() {
      this.count = 0
      this.draw = function () {
        if (this.count === 0) effects.push(new passFailHelp(120))
        this.count < 2 ? this.count++ : this.count = 0
        if (!gEncryptSuccess || !encryptionOn) this.lifetime = 0
      }
    }

    // ── encryptionFail ────────────────────────────────────────────
    // Spawner: fires a red passFailHelp particle every 2 frames while
    // encryption is failing. Expires when gEncryptFail clears.
    function encryptionFail() {
      this.count = 0
      this.draw = function () {
        if (this.count === 0) effects.push(new passFailHelp(0))
        this.count < 2 ? this.count++ : this.count = 0
        if (!gEncryptFail || !encryptionOn) this.lifetime = 0
      }
    }

    // ── passFailHelp ──────────────────────────────────────────────
    // Single colored square that fades in then out at a random position.
    function passFailHelp(hue) {
      this.x     = Math.random() * 320
      this.y     = Math.random() * 200
      this.color = `hsl(${hue}, 100%, ${Math.random() * 40 + 30}%)`
      this.alpha = 0
      this.half  = false
      this.draw = function () {
        if (this.half) this.alpha > 0 ? this.alpha -= .01 : this.lifetime = 0
        else           this.alpha < 1 ? this.alpha += .01 : this.half = true
        if (this.alpha < 0) this.alpha = 0
        hiddenCtx.globalAlpha = this.alpha
        DrawRect(this.x, this.y, 50, 50, this.color)
        hiddenCtx.globalAlpha = 1
      }
    }

    // ── encryption ────────────────────────────────────────────────
    // Expanding yellow rect that fills the screen, then spawns audio-reactive
    // ring bursts. Persists while gEncrypt is true.
    function encryption() {
      this.effects = []
      this.x = 160
      this.y = 100
      // Local Meter tracks audio density changes to trigger ring bursts
      const denseMeter = new Meter(1, () => '')
      this.draw = function () {
        denseMeter.setValue(engine.audio.density)
        DrawRect(this.x, this.y, (160 - this.x) * 2, (100 - this.y) * 2, `hsla(60, 100%, ${40 + Math.sin(Date.now() / 1000) * 10}%, ${(160 - this.x) / 160})`)
        this.x > 0 ? this.x -= 1.6 : this.x = 0
        this.y > 0 ? this.y--      : this.half = true
        if (this.half) {
          if (denseMeter.diff > .25) this.effects.push(new encryptStroke())
          this.effects.forEach(e => { e.draw() })
          this.effects = this.effects.filter(e => !(e.lifetime <= 0))
        }
        if (!gEncrypt || !encryptionOn) this.lifetime = 0
      }
    }

    // ── encryptStroke ─────────────────────────────────────────────
    // Expanding cyan ring burst from center, triggered by audio density spikes.
    function encryptStroke() {
      this.rad      = 1
      this.lifetime = 1
      this.draw = function () {
        DrawStroke(width / 2, height / 2, this.rad, 'hsl(190, 100%, 50%)', this.rad / 5)
        this.rad < 300 ? this.rad += 3 : this.lifetime = 0
      }
    }

    // ── inVehicle ─────────────────────────────────────────────────
    // Radial gradient vignette whose hue shifts from blue to green with
    // RPM (RevMeter). Spawns stripe sweeps at a rate inversely proportional
    // to RPM. Fades in while gVehicle, fades out when leaving the vehicle.
    function inVehicle() {
      this.alpha = 0
      this.count = 0
      this.draw = function () {
        if (gVehicle && vehicleOn && gInGame) this.alpha < 1    ? this.alpha += .01 : this.alpha = 1
        else                                  this.alpha >= .01 ? this.alpha -= .01 : this.lifetime = 0
        hiddenCtx.globalAlpha = this.alpha
        const hue  = RevMeter.value * 2 * 120 + 240
        const grad = hiddenCtx.createRadialGradient(160, 100, 10, 160, 100, 300)
        grad.addColorStop(0,                                    `hsla(${hue}, 100%, 50%, 0)`)
        grad.addColorStop(Math.sin(Date.now() / 500) * .1 + .8, `hsla(${hue}, 100%, 50%, .5)`)
        grad.addColorStop(1,                                    `hsla(${hue}, 100%, 50%, 1)`)
        DrawRect(0, 0, 320, 200, grad)
        if (this.count === 0) effects.push(new vehicleHelp(`hsl(${hue}, 100%, 50%)`, RevMeter.value * 2 / .25 + 3))
        this.count < (30 - RevMeter.value * 2 / .05) ? this.count++ : this.count = 0
        hiddenCtx.globalAlpha = 1
      }
    }

    // ── vehicleHelp ───────────────────────────────────────────────
    // Single colored stripe that sweeps down the canvas at a given speed.
    function vehicleHelp(color, speed) {
      this.x     = 0
      this.y     = -30
      this.color = color
      this.speed = speed
      this.draw = function () {
        DrawRect(this.x, this.y, 320, 30, this.color)
        this.y < 200 ? this.y += this.speed : this.lifetime = 0
      }
    }

    // ── joytoy ────────────────────────────────────────────────────
    // Pink pulsing heart spawner. Fades in while gJoytoy, fades out when
    // scene ends. Spawns a new heart every 20 frames.
    function joytoy() {
      this.alpha  = 0
      this.hearts = []
      this.count  = 0
      this.draw = function () {
        if (gJoytoy && joytoyOn) this.alpha < 1    ? this.alpha += .025 : this.alpha = 1
        else                     this.alpha >= .01 ? this.alpha -= .01  : this.lifetime = 0
        hiddenCtx.globalAlpha = this.alpha
        const color = `hsl(340, 100%, ${70 + Math.sin(Date.now() / 500) * 20}%)`
        if (this.count === 0) this.hearts.push(new heart(160, 90, color))
        this.count < 20 ? this.count++ : this.count = 0
        this.hearts.forEach(h => { h.draw() })
        this.hearts = this.hearts.filter(h => !(h.lifetime <= 0))
        hiddenCtx.globalAlpha = 1
      }
    }

    // ── heart ─────────────────────────────────────────────────────
    // Single heart shape that scales outward and fades as it grows.
    function heart(x, y, color) {
      this.x        = x
      this.y        = y
      this.color    = color
      this.scale    = 1
      this.lifetime = 1
      this.draw = function () {
        let alpha = 1 + (7 - this.scale)
        if (alpha <= 0) { alpha = 0; this.lifetime = 0 }
        hiddenCtx.globalAlpha = alpha
        hiddenCtx.save()
        hiddenCtx.translate(this.x, this.y)
        hiddenCtx.scale(this.scale, this.scale)
        hiddenCtx.translate(-this.x, -this.y)
        hiddenCtx.beginPath()
        hiddenCtx.arc(this.x,      this.y, 30, Math.PI / 2, 0,         true)
        hiddenCtx.arc(this.x + 15, this.y, 15, 0,           Math.PI,   true)
        hiddenCtx.arc(this.x - 15, this.y, 15, 0,           Math.PI,   true)
        hiddenCtx.arc(this.x,      this.y, 30, Math.PI,     Math.PI / 2, true)
        hiddenCtx.closePath()
        hiddenCtx.fillStyle = this.color
        hiddenCtx.fill()
        hiddenCtx.restore()
        this.scale += .025
        hiddenCtx.globalAlpha = 1
      }
    }

    // ── generalProgress ───────────────────────────────────────────
    // Dark overlay with a color-shifting bar that tracks engine.vision.progressBarRed
    // directly. Fades in while gProgress, fades out when bar disappears.
    function generalProgress() {
      this.alpha = 0
      this.draw = function () {
        if (gProgress && progressOn) this.alpha < .5  ? this.alpha += .01 : this.alpha = .5
        else                         this.alpha >= .01 ? this.alpha -= .01 : this.lifetime = 0
        DrawRect(0, 0, 320, 200, `hsla(0, 100%, 0%, ${this.alpha})`)
        DrawRect(0, 0, engine.vision.progressBarRed * 320, 200, `hsl(${engine.vision.progressBarRed * 1.5 + 210}, 100%, 50%)`)
      }
    }

    // ── death ─────────────────────────────────────────────────────
    // Spawner: fires a deathParticle every 10 frames while gDead is true.
    // Dim black overlay accumulates as particles fall. Expires when gDead clears.
    function death() {
      this.effects = []
      this.count   = 0
      this.draw = function () {
        DrawRect(0, 0, width, height, 'hsla(0, 0%, 0%, .025)')
        if (this.count === 0) this.effects.push(new deathParticle())
        this.count < 10 ? this.count++ : this.count = 0
        this.effects.forEach(e => { e.draw() })
        this.effects = this.effects.filter(e => !(e.lifetime <= 0))
        if (!gDead || gInGame) this.lifetime = 0
      }
    }

    // ── deathParticle ─────────────────────────────────────────────
    // Single red 20×20 tile that falls from above at 1px/frame.
    function deathParticle() {
      this.lifetime = 1
      this.y        = -20
      this.x        = Math.floor(Math.random() * 16) * 20
      this.draw = function () {
        DrawRect(this.x, this.y, 20, 20, 'red')
        this.y < 220 ? this.y++ : this.lifetime = 0
      }
    }

    // ── scanning ──────────────────────────────────────────────────
    // Green overlay with rotating red scan line and radial gradient.
    // Fades in while gScan, fades out when scanner is dismissed.
    function scanning() {
      this.alpha = 0
      this.rot   = 0
      this.draw = function () {
        DrawRect(0, 0, 320, 200, `hsla(120, 100%, 50%, ${this.alpha})`)
        const grad = hiddenCtx.createRadialGradient(160, 100, 10, 160, 100, 300)
        grad.addColorStop(0,                                    `hsla(120, 100%, 50%, 0)`)
        grad.addColorStop(Math.sin(Date.now() / 500) * .2 + .6, `hsla(0, 100%, 50%, ${this.alpha * 3})`)
        grad.addColorStop(1,                                    `hsla(0, 100%, 50%, ${this.alpha * 3})`)
        DrawRect(0, 0, 320, 200, grad)
        hiddenCtx.save()
        hiddenCtx.translate(160, 100)
        hiddenCtx.rotate(this.rot)
        hiddenCtx.translate(-160, -100)
        hiddenCtx.beginPath()
        hiddenCtx.moveTo(160, 100)
        hiddenCtx.lineTo(160, -100)
        hiddenCtx.strokeStyle = `hsla(0, 100%, 50%, ${this.alpha * 3})`
        hiddenCtx.lineWidth   = 20
        hiddenCtx.stroke()
        hiddenCtx.restore()
        this.rot += .05
        if (!gScan || !scanOn) this.alpha >= .01 ? this.alpha -= .01 : this.lifetime = 0
        else                   this.alpha < .25  ? this.alpha += .01 : null
      }
    }

    // ── inCall ────────────────────────────────────────────────────
    // Audio visualizer bars centered on canvas, driven by engine.audio.freq.
    // Fades in while gCall, fades out when call ends.
    function inCall() {
      this.alpha = 0
      this.draw = function () {
        DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${this.alpha})`)
        const density = engine.audio.density
        const freqs   = new Uint8Array(engine.audio.freq).filter((ele, i) => i % 4 === 0)
        freqs.forEach((ele, i) => {
          DrawRect(160 + i * 3.2, 100 - ele, 3.2, ele * 2 + 10, `hsla(${190 - i * 2 - density * 150}, 100%, 50%, 1)`)
          DrawRect(160 - i * 3.2, 100 - ele, 3.2, ele * 2 + 10, `hsla(${190 - i * 2 - density * 150}, 100%, 50%, 1)`)
        })
        if (!gCall || !callOn || !gInGame) this.alpha > .025 ? this.alpha -= .025 : this.lifetime = 0
        else                               this.alpha < .5   ? this.alpha += .025 : this.alpha = .5
      }
    }

    // ── idle ──────────────────────────────────────────────────────
    // Yellow ambient background with Cyberpunk-colored stripes drifting
    // left and right. Spawns when out-of-game for 100 frames. Fades in
    // slowly, expires when gInGame becomes true or another effect fires.
    function idle() {
      this.alpha = 0
      this.dots  = []
      this.count = 0
      this.draw = function () {
        if (this.count === 0) this.dots.push(new idleParticle())
        this.count < 5 ? this.count++ : this.count = 0
        hiddenCtx.globalAlpha = this.alpha
        DrawRect(0, 0, 320, 200, 'hsl(60, 100%, 30%)')
        this.dots.forEach(d => { d.draw() })
        this.dots = this.dots.filter(d => !(d.lifetime <= 0))
        hiddenCtx.globalAlpha = 1
        if (gInGame || !idleOn || effects.length > 1 || gCall) this.alpha >= .025 ? this.alpha -= .025 : this.lifetime = 0
        else                                                    this.alpha < .5   ? this.alpha += .001 : null
      }
    }

    // ── idleParticle ──────────────────────────────────────────────
    // Single colored stripe (black, cyan, or yellow) sliding in from one edge.
    function idleParticle() {
      this.lifetime = 1
      this.mod   = Math.random()
      this.y     = Math.random() * 200
      this.x     = this.mod > .5 ? 0 : 320
      this.size  = Math.random() * 50 + 50
      this.color = ['black', 'cyan', 'yellow'][Math.floor(Math.random() * 2.99)]
      this.draw = function () {
        DrawRect(this.x, this.y, this.mod > .5 ? -this.size : this.size, 20, this.color)
        this.mod > .5
          ? this.x < 420  ? this.x += 5 + 5 * this.mod : this.lifetime = 0
          : this.x > -100 ? this.x -= 5 + 5 * this.mod : this.lifetime = 0
        this.y += Math.sin((Date.now() - this.mod * 1000) / 250) * 2
      }
    }

    // ── wanted ────────────────────────────────────────────────────
    // Alternating blue/red flashing panels (NCPD police lights).
    // Fades in while gWanted, fades out when wanted level clears.
    function wanted() {
      this.alpha = 0
      this.draw = function () {
        if (gWanted && wantedOn && gInGame) this.alpha < 1    ? this.alpha += .025 : this.alpha = 1
        else                               this.alpha >= .025 ? this.alpha -= .025 : this.lifetime = 0
        hiddenCtx.globalAlpha = this.alpha
        DrawRect(  0, 0, 80, 200, `hsl(240, 100%, ${Math.sin(Date.now() / 100) * 20 + 60}%)`)
        DrawRect( 80, 0, 80, 200, `hsl(0,   100%, ${Math.sin((Date.now() - 1000) / 100) * 20 + 60}%)`)
        DrawRect(160, 0, 80, 200, `hsl(240, 100%, ${Math.sin(Date.now() / 100) * 20 + 60}%)`)
        DrawRect(240, 0, 80, 200, `hsl(0,   100%, ${Math.sin((Date.now() - 1000) / 100) * 20 + 60}%)`)
        hiddenCtx.globalAlpha = 1
      }
    }

    // ── sneakKill ─────────────────────────────────────────────────
    // Screen darkens then two red diagonal lines converge from opposite
    // corners — takedown confirmation. Fades out after the lines meet.
    function sneakKill() {
      this.dist1 = 0
      this.dist2 = 0
      this.alpha = 0
      this.alpha2 = 1
      this.draw = function () {
        if (!this.half) this.alpha <= .7 ? this.alpha += .05 : this.dist1 < 100 ? this.dist1 += 5 : this.dist2 < 100 ? this.dist2 += 5 : this.half = true
        else            this.alpha2 >= .05 ? this.alpha2 -= .05 : this.lifetime = 0
        hiddenCtx.globalAlpha = this.alpha2
        DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${this.alpha})`)
        DrawLine([0,   50], [this.dist1 * 3.2,       50 + this.dist1], 'red', 30)
        DrawLine([320, 50], [320 - this.dist2 * 3.2, 50 + this.dist2], 'red', 30)
        hiddenCtx.globalAlpha = 1
      }
    }

    // ── sneaking ──────────────────────────────────────────────────
    // Black overlay fades in, then a red ellipse expands to full height,
    // then a cyan orb pulses at center. Fades out when player stands up.
    function sneaking() {
      this.alpha  = 0
      this.alpha2 = 0
      this.alpha3 = 1
      this.height = 1
      this.draw = function () {
        hiddenCtx.globalAlpha = this.alpha3
        const x = Math.sin(Date.now() / 500) * 40 + width / 2
        DrawRect(0, 0, width, height, `hsla(0, 0%, 0%, ${this.alpha})`)
        if (this.alpha >= .5)   DrawEllipse(width / 2, height / 2, 100, this.height, 0, 'red')
        if (this.height === 100) DrawCircle(x, height / 2, 40, `hsla(190, 100%, 50%, ${this.alpha2})`)
        this.alpha < .5 ? this.alpha += .01 : this.height < 100 ? this.height++ : this.alpha2 < 1 ? this.alpha2 += .025 : this.alpha2 = 1
        hiddenCtx.globalAlpha = 1
        if (!gCrouched || !sneakOn) this.alpha3 >= .025 ? this.alpha3 -= .025 : this.lifetime = 0
      }
    }

    // ── safeZone ──────────────────────────────────────────────────
    // Dark overlay with 10 concentric pulsing green rings.
    // Fades in while gSafeZone, fades out when leaving the safe area.
    function safeZone() {
      this.alpha = 0
      this.draw = function () {
        DrawRect(0, 0, width, height, `hsla(0, 0%, 0%, ${this.alpha})`)
        if (gSafeZone && zoneOn && gInGame) this.alpha < .75  ? this.alpha += .025 : this.alpha = .75
        else                               this.alpha >= .025 ? this.alpha -= .025 : this.lifetime = 0
        for (let i = 0; i < 10; i++) {
          DrawStroke(width / 2, height / 2, i * 20, `hsla(120, 100%, 30%, ${Math.sin((Date.now() - i * 1000) / 1000) * .25 + .5})`, 20)
        }
      }
    }

    // ── hostile ───────────────────────────────────────────────────
    // Dark overlay with 10 concentric pulsing red rings.
    // Fades in while gCombat, suppressed when wanted level is active.
    function hostile() {
      this.alpha = 0
      this.draw = function () {
        DrawRect(0, 0, width, height, `hsla(0, 0%, 0%, ${this.alpha})`)
        if (gCombat && zoneOn && !gWanted && gInGame) this.alpha < .75  ? this.alpha += .025 : this.alpha = .75
        else                                          this.alpha >= .025 ? this.alpha -= .025 : this.lifetime = 0
        for (let i = 0; i < 10; i++) {
          DrawStroke(width / 2, height / 2, i * 20, `hsla(0, 100%, 50%, ${Math.sin((Date.now() - i * 100) / 250) * .5 + .5})`, 20)
        }
      }
    }
    //#endregion

    window.requestAnimationFrame(update)
</script>
