<body style="margin: 0; padding: 0; background: #000;">
  <canvas id="exCanvas" width="320" height="200"></canvas>
</body>

<script>
  var canvas, ctx;
  canvas = document.getElementById('exCanvas');
  ctx = canvas.getContext('2d');
  var width = 320;
  var height = 200;

  var effects = [];
  var inGame = false;
  var boostPushed = false;
  var boostState = 1;
  var oldBoostState = 1;
  var winPushed = false;
  var searchPushed = false;
  var recentScore = false;

  var InGameBlackMeter = new Meter(15, inGameHandler);
  var InGameWhiteMeter = new Meter(15, inGameHandler);

  var Boost1Meter = new Meter(15, boostHandler);
  var Boost2Meter = new Meter(5, boostHandler);
  var Boost3Meter = new Meter(5, boostHandler);
  var Boost4Meter = new Meter(5, boostHandler);
  var Boost5Meter = new Meter(5, boostHandler);
  var Boost6Meter = new Meter(5, boostHandler);
  var Boost7Meter = new Meter(5, boostHandler);

  var WinMeter = new Meter(18, winHandler);
  var winNotWhiteMeter = new Meter(18, winHandler)

  var ScoreLeftHueMeter = new Meter(15, () => "");
  var ScoreRightHueMeter = new Meter(15, () => "");
  var ScoreLeftSatMeter = new Meter(5, scoreHandler);
  var ScoreRightSatMeter = new Meter(5, scoreHandler);
  var ScoreLeftLitMeter = new Meter(5, scoreHandler);
  var ScoreRightLitMeter = new Meter(5, scoreHandler);

  var ScoreBallMeter = new Meter(5, scoreHandler);

  var SearchingMidMeter = new Meter(10, searchHandler);
  var SearchingBotMeter = new Meter(10, searchHandler);

  var ReplayBlockMeter = new Meter(20, replayHandler)

  var QuickChatSpamMeter = new Meter(8, quickChatSpamHandler)
  let playingWhatASave = false

  let SaveLeftMeter = new Meter(5, saveHandler)
  let SaveRightMeter = new Meter(5, saveHandler)

  let EpicSaveLeftMeter = new Meter(5, epicSaveHandler)
  let EpicSaveRightMeter = new Meter(5, epicSaveHandler)

  let DemoMeter = new Meter(5, demoHandler)
  let Demo2Meter = new Meter(5, demoHandler)
  let DemoNotOrangeMeter = new Meter(5, demoHandler)

  let OvertimeMeter = new Meter(5, overtimeHandler)

  function update() {
    QuickChatSpamMeter.setValue(engine.vision.QuickChatBlue)
    InGameBlackMeter.setValue(engine.vision.inGameBlack)
    InGameWhiteMeter.setValue(engine.vision.inGameWhite)
    SearchingMidMeter.setValue(engine.vision.searchingMid)
    SearchingBotMeter.setValue(engine.vision.searchingBot)
    WinMeter.setValue(engine.vision.win)
    winNotWhiteMeter.setValue(engine.vision.winNotWhite)
    ScoreBallMeter.setValue(engine.vision.scoreBall)
    ReplayBlockMeter.setValue(engine.vision.replayBlock)

    if (inGame) {
      Boost1Meter.setValue(engine.vision.boost1)
      Boost2Meter.setValue(engine.vision.boost2)
      Boost3Meter.setValue(engine.vision.boost3)
      Boost4Meter.setValue(engine.vision.boost4)
      Boost5Meter.setValue(engine.vision.boost5)
      Boost6Meter.setValue(engine.vision.boost6)
      Boost7Meter.setValue(engine.vision.boost7)

      ScoreLeftHueMeter.setValue(engine.vision.scoreLeft[0])
      ScoreRightHueMeter.setValue(engine.vision.scoreRight[0])
      ScoreLeftSatMeter.setValue(engine.vision.scoreLeft[1])
      ScoreRightSatMeter.setValue(engine.vision.scoreRight[1])
      ScoreLeftLitMeter.setValue(engine.vision.scoreLeft[2])
      ScoreRightLitMeter.setValue(engine.vision.scoreRight[2])

      SaveLeftMeter.setValue(engine.vision.saveLeft)
      SaveRightMeter.setValue(engine.vision.saveRight)

      EpicSaveLeftMeter.setValue(engine.vision.epicSaveLeft)
      EpicSaveRightMeter.setValue(engine.vision.epicSaveRight)

      DemoMeter.setValue(engine.vision.demo)
      Demo2Meter.setValue(engine.vision.demo2)
      DemoNotOrangeMeter.setValue(engine.vision.demoNotOrange)

      OvertimeMeter.setValue(engine.vision.overtime)
    }

    DrawRect(0, 0, 320, 200, "black");

    if (keyScreenBrightness > 0) {
      copyScreen(1);
    }

    for (let i = 0; i < effects.length; i++) {
      effects[i].draw();
      if (effects[i].lifetime <= 0) {
        effects.splice(i, 1);
      }
    };

    if (adjustHUD) {
      if (HUDStyle) {
        DrawCircle((xPos * 3.2), (yPos * 2), (HUDRadius * 2), boostColor)
      } else {
        DrawRect((xPos * 3.2), (yPos * 2), (HUDWidth* 3.2), (HUDHeight * 2), boostColor)
      }
    }


    window.requestAnimationFrame(update);
  };

  let overtimeGoing = false
  function overtimeHandler(){
    if(inGame && OvertimeMeter.value >= .95 && !overtimeGoing){
      overtimeGoing = true
      if(overtimeOn) effects.push(new overtime())
    }
  }

  let demoGoing = false
  function demoHandler(){
    if(inGame && DemoMeter.value >= .95 && Demo2Meter.value >=.95 && DemoNotOrangeMeter.value < .1 && !demoGoing){
      demoGoing = true
      if(playOn) effects.push(new demo())
      setTimeout(()=>{
        demoGoing = false
      }, 2000)
    }
  }

  let epicSaveGoing = false
  function epicSaveHandler(){
    if(inGame && EpicSaveLeftMeter.value >= .95 && EpicSaveRightMeter.value >= .95 && engine.vision.epicSaveNotOrange < .1 && ScoreBallMeter.value >= .2 && !epicSaveGoing){
      epicSaveGoing = true
      if(playOn) effects.push(new epicSave())
      setTimeout(()=>{
        epicSaveGoing = false
      }, 2000)
    }
  }

  let saveGoing = false
  function saveHandler(){
    if(inGame && SaveLeftMeter.value >= .95 && SaveRightMeter.value >= .95 && engine.vision.saveNotOrange < .1 && ScoreBallMeter.value >= .2 && !saveGoing){
      saveGoing = true
      if(playOn) effects.push(new save())
      setTimeout(()=>{
        saveGoing = false
      }, 2000)
    }
  }

  function quickChatSpamHandler() {
    if (QuickChatSpamMeter.value >= .95 & engine.vision.QuickChatWhite >= .75 && !playingWhatASave) {
      if(chatOn) effects.push(new whatASaveEffect())
      playingWhatASave = true
    } else if (QuickChatSpamMeter.value == 0 & engine.vision.QuickChatWhite < .1){
      playingWhatASave = false
    }
  }

  function inGameHandler() {
    if (InGameBlackMeter.value >= .95 && InGameWhiteMeter.value >= .95) {
      inGame = true;
    } else {
      boostPushed = false;
      inGame = false;
    }
  };

  function replayHandler() {
    if (ReplayBlockMeter.decreased) {
      recentScore = false;
    }
  }

  function boostHandler() {
    if (!boostPushed && inGame && boostOn) {
      effects.push(new boostHUD((xPos * 3.2), (yPos * 2), (HUDRadius * 2)))
      boostPushed = true;
    }
    if (Boost7Meter.value >=.95 && Boost6Meter.value >=.95) {
      boostState = 7;
    } else if (Boost6Meter.value >=.95 && Boost5Meter.value >=.95 && Boost7Meter.value <.1) {
      boostState = 6;
    } else if (Boost5Meter.value >=.95 && Boost4Meter.value >=.95 && Boost6Meter.value <.1) {
      boostState = 5;
    } else if (Boost4Meter.value >=.95 && Boost3Meter.value >=.95 && Boost5Meter.value <.1) {
      boostState = 4;
    } else if (Boost3Meter.value >=.95 && Boost2Meter.value >=.95 && Boost4Meter.value <.1) {
      boostState = 3;
    } else if (Boost2Meter.value >=.95 && Boost1Meter.value >=.95 && Boost3Meter.value <.1) {
      boostState = 2;
    } else if (Boost1Meter.value >=.95 && Boost2Meter.value <.1) {
      boostState = 1;
    } else {
      boostState = 0;
    }
    if (boostState > oldBoostState && inGame && boostOn) {
      effects.push(new boostUp((xPos * 3.2), (yPos * 2)))
    }
    oldBoostState = boostState;
  }

  function winHandler() {
    if (WinMeter.value >=.95 && ScoreBallMeter.value >= .3 && winNotWhiteMeter.value < .1  &&!winPushed && !inGame && endGameOn) {
      effects.push(new gameEnd())
      winPushed = true;
    }
  }

  function ongoalChoiceChanged(){
    effects = []
    if(goalChoice == "Ball") effects.push(new score(true, `hsl(240, 100%, 50%)`))
    if(goalChoice == "Spots") effects.push(new brightScore(240))
    if(goalChoice == "Swirl") effects.push(new swirlScore(240))
  }

  function scoreHandler() {
    if (ScoreBallMeter.value > .1 && ScoreLeftLitMeter.increased && ScoreLeftSatMeter.decreased && ScoreLeftSatMeter.diff > 5 && goalOn) {
      if(goalChoice == "Ball") effects.push(new score(true, `hsl(${ScoreLeftHueMeter.value}, 100%, 50%)`))
      if(goalChoice == "Spots") effects.push(new brightScore(ScoreLeftHueMeter.value))
      if(goalChoice == "Swirl") effects.push(new swirlScore(ScoreLeftHueMeter.value))
      setTimeout(() => {
        recentScore = true;
      }, 4000);
      setTimeout(() => {
        recentScore = false;
      }, 15000);
    } else if (ScoreBallMeter.value > .1 && ScoreRightLitMeter.increased && ScoreRightSatMeter.decreased && ScoreRightSatMeter.diff > 5 && goalOn) {
      if(goalChoice == "Ball") effects.push(new score(false, `hsl(${ScoreRightHueMeter.value}, 100%, 50%)`))
      if(goalChoice == "Spots") effects.push(new brightScore(ScoreRightHueMeter.value))
      if(goalChoice == "Swirl") effects.push(new swirlScore(ScoreRightHueMeter.value))
      setTimeout(() => {
        recentScore = true;
      }, 4000);
      setTimeout(() => {
        recentScore = false;
      }, 15000);
    }
  }

  function searchHandler() {
    if (SearchingBotMeter.value >=.95 && SearchingMidMeter.value >=.95 && !searchPushed && searchOn) {
      effects.push(new search())
      searchPushed = true
    }
  };

  function brightScore(hue){
    this.hue = hue
    this.count = 0
    this.draw = () => {
        effects.push(new brightPart(this.hue))
        this.count < 100 ? this.count++ : this.lifetime = 0
    }
  }

    function brightPart(hue){
        this.hue = hue
        this.x = Math.random() * 320
        this.y = Math.random() * 200
        this.rad = 1
        this.draw = function(){
            DrawCircle(this.x, this.y, this.rad, `hsla(${this.hue}, 100%, ${100 - this.rad}%, ${1 - this.rad / 100})`)
            this.rad < 100 ? this.rad += 3 : this.lifetime = 0
        }
    }

    function swirlScore(hue){
        this.rot = 0
        this.hue = hue
        this.draw = () => {
            effects.push(new swirlPart(this.rot, this.hue))
            effects.push(new swirlPart(this.rot + Math.PI * 2/3, this.hue))
            effects.push(new swirlPart(this.rot + Math.PI * 4/3, this.hue))
            this.rot < Math.PI * 4 ? this.rot += Math.PI / 50 : this.lifetime = 0
        }
    }

    function swirlPart(rot, hue){
        this.rot = rot
        this.hue = hue
        this.y = 100
        this.draw = () => {
            ctx.save()
            ctx.translate(160, 100)
            ctx.rotate(this.rot)
            ctx.translate(-160, -100)
            DrawCircle(160, this.y, 20, `hsl(${this.hue}, 100%, ${50 + (20 - Math.random() * 40)}%)`)
            ctx.restore()
            this.y > - 100 ? this.y -= 3 : this.lifetime = 0
        }
    }

  function overtime(){
        this.draw = () => {
            DrawRect(0, 0, 320, 200, `hsla(0, 100%, 50%, ${Math.sin(Date.now() / 500) * .25 + .25})`)
            if(OvertimeMeter.value <= .1){
              this.lifetime = 0
              overtimeGoing = false
            }
        }
    }

  function demo(){
        this.draw = () => {
            for(let i = 0; i < 50; i++){
                effects.push(new explodePart(160, 100))
                setTimeout(()=>{
                    effects.push(new explodePart(160, 100))
                }, 400)
                setTimeout(()=>{
                    effects.push(new explodePart(160, 100))
                }, 800)
            }
            this.lifetime = 0
        }
    }

    function explodePart(x, y){
        this.x = x
        this.y = y
        this.vx = 8 - Math.random() * 16
        this.vy = 8 - Math.random() * 16
        this.hue = Math.random() * 60
        this.alpha = 1
        this.draw = () => {
            DrawCircle(this.x, this.y, 30, `hsla(${this.hue}, 100%, 50%, ${this.alpha})`)
            this.x += this.vx
            this.y += this.vy
            this.alpha >= .025 ? this.alpha -= .025 : this.lifetime = 0
        }
    }

  function epicSave(){
        this.rad = 1
        this.hue = 0
        this.draw = () => {
            DrawStroke(160, 100, this.rad, `hsla(${this.hue}, 100%, 50%, ${this.rad / 100})`, this.rad / 1.5)
            DrawStroke(160, 100, this.rad * 2, `hsla(${this.hue}, 100%, 50%, ${this.rad / 100})`, this.rad / 1.5)
            DrawStroke(160, 100, this.rad * 4, `hsla(${this.hue}, 100%, 50%, ${this.rad / 100})`, this.rad / 1.5)
            this.hue+=8
            this.rad < 300 ? this.rad += 2 : this.lifetime = 0
        }
    }

  function save(){
        this.rad = 1
        this.draw = () => {
            DrawStroke(160, 100, this.rad, `hsla(60, 100%, 50%, ${this.rad / 100})`, this.rad / 1.5)
            DrawStroke(160, 100, this.rad * 2, `hsla(60, 100%, 50%, ${this.rad / 100})`, this.rad / 1.5)
            DrawStroke(160, 100, this.rad * 4, `hsla(60, 100%, 50%, ${this.rad / 100})`, this.rad / 1.5)
            this.rad < 300 ? this.rad += 2 : this.lifetime = 0
        }
    }

  function search() {
    this.lifetime = 10;
    this.effects = [];
    this.draw = function () {
      DrawRect(0, 0, 320, 200, "black")
      DrawHex(160, 100, "cyan", 70)
      if (this.effects.length < 2) {
        this.effects.push(new arrow(195, 100, "right", 70, 30, 2, "cyan"))
        this.effects.push(new arrow(125, 100, "left", 70, 30, 2, "cyan"))
      }
      this.effects.forEach((ele, i) => {
        ele.draw();
        if (ele.lifetime <= 0) {
          this.effects.splice(i, 1)
        }
      });
      if (SearchingBotMeter.value < .75 || SearchingMidMeter.value < .75 || !searchOn) {
        this.lifetime = 0
        searchPushed = false
      }
    }
  }

  function arrow(x, y, direction, size, stroke, speed, color) {
    this.x = x;
    this.y = y;
    this.direction = direction;
    this.size = size;
    this.stroke = stroke;
    this.speed = speed;
    this.color = color;
    this.draw = function () {
      var firstX = this.direction == "left" ? this.x + this.size : this.x - this.size;
      var secondX = this.direction == "left" ? this.x + this.size : this.x - this.size;
      ctx.beginPath();
      ctx.moveTo(firstX, this.y - this.size)
      ctx.lineTo(this.x, this.y)
      ctx.lineTo(secondX, this.y + this.size)
      ctx.lineWidth = this.stroke;
      ctx.strokeStyle = this.color
      ctx.stroke()
      this.direction == "left" ? this.x -= this.speed : this.x += this.speed;
      if (this.x > 370 || this.x < -50) {
        this.lifetime = 0;
      }
    }
  }

  function score(you, color) {
    this.you = you;
    this.you ? this.x = 0 : this.x = 320;
    this.y = 100;
    this.lifetime = 10;
    this.color = color;
    this.draw = function () {
      DrawCircle(this.x, this.y, 50, "grey")
      DrawStroke(this.x, this.y, 50, "black", 15)
      if (Math.abs(160 - this.x) <= 20) {
        for (let i = 0; i < 30; i++) {
          effects.push(new explosionParticle(160, 100, 10, this.color))
        }
      }
      this.you ? this.x += 10 : this.x -= 10;
      if (this.x > 350 || this.x < -20) {
        this.lifetime = 0;
      }
    }
  }

  function explosionParticle(x, y, min, color) {
    this.x = x;
    this.y = y;
    this.vx = Math.random() * -min + min / 2;
    this.vy = Math.random() * -min + min / 2;
    this.min = min;
    this.color = color;
    this.lifetime = 10;
    this.start = Date.now()
    this.draw = function () {
      DrawCircle(this.x, this.y, Math.random() * 10 + 10, this.color)
      this.x += this.vx;
      this.y += this.vy;
      if (this.x > 320 || this.x < 0 || this.y > 200 || this.y < 0 || Date.now() - this.start >= 3000) {
        this.lifetime = 0;
      }
    }
  }

  function gameEnd() {
    this.lifetime = 10;
    this.start1 = Date.now();
    this.start2 = Date.now();
    this.effects = []
    this.draw = function () {
      var elapsed = Date.now() - this.start2;
      var color = `hsl(${(Math.sin(Date.now() / 50) * .5 + .5) * 360}, 100%, 50%)`
      var level = 100 * (Math.sin(Date.now() / 200) * .5 + .5)
      if (level > 30 && elapsed > 100) {
        this.effects.push(new winStroke(160, 200, color))
        this.start2 = Date.now()
      }
      this.effects.forEach((ele, i) => {
        ele.draw();
        if (ele.lifetime <= 0) {
          this.effects.splice(i, 1);
        }
      });

      if (Date.now() - this.start1 > 15000 || !endGameOn) {
        this.lifetime = 0;
        winPushed = false;
      }
    }
  }

  function winStroke(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.radius = 1;
    this.alpha = 1;
    this.draw = function () {
      ctx.globalAlpha = this.alpha;
      DrawStroke(this.x, this.y, this.radius, this.color, 30)
      ctx.globalAlpha = 1;
      this.radius += 5;
      this.radius > 100 ? this.alpha -= .05 : null;
      this.alpha <= 0 ? this.lifetime = 0 : null;
    }
  }

  function getAlpha(elapsed, fadeInTime, duration, fadeOutTime, maxAlpha = 1) {
  if (elapsed < fadeInTime) {
    return (elapsed / fadeInTime) * maxAlpha;
  } else if (elapsed < fadeInTime + duration) {
    return maxAlpha;
  } else if (elapsed < fadeInTime + duration + fadeOutTime) {
    return maxAlpha - ((elapsed - fadeInTime - duration) / fadeOutTime) * maxAlpha;
  } else {
    return 0;
  }
}

function whatASaveEffect(){
        this.count = 0
        this.effects = []
        this.half = false
        this.alpha = 0
        this.draw = function (){
          if(!this.half) this.alpha < .75 ? this.alpha += .0025 : this.half = true
          else this.alpha >= .005 ? this.alpha -= .005 : this.lifetime = 0
          this.count++
          ctx.globalAlpha = this.alpha;
          DrawRect(0, 0, 400, 200, "hsla(90, 100%, 20%, 1)");
          if(this.count % 10 == 0) this.effects.push(new saveHelp())
          this.effects.forEach((ele, i)=>{
            ele.draw()
            if(ele.lifetime <= 0) this.effects.splice(i, 1)
          })
          ctx.globalAlpha = 1;
          if(this.lifetime == 0) playingWhatASave = false
        }
      }

      function saveHelp(){
        this.x = Math.random() * 320
        this.y = Math.random() * 200
        this.rad = 1
        this.draw = function(){
          if(this.rad < 50) DrawCircle(this.x, this.y, this.rad, "hsla(80, 100%, 60%, 1)")
          DrawStroke(this.x, this.y, this.rad, `hsla(60, 100%, 60%, ${(100 - this.rad) / 50})`, 10)
          this.rad < 50 ? this.rad ++ : this.rad < 100 ? this.rad += 5 : this.lifetime = 0
        }
      }


  function boostHUD(x, y, radius) {
    this.x = x;
    this.y = y;
    this.prevBoostVal = 0;
    this.radius = radius;
    this.lifetime = 10;
    this.draw = function () {
      this.x = (xPos * 3.2);
      this.y = (yPos * 2);
      this.radius = (HUDRadius * 2)
      if (!recentScore) {
        switch (boostState) {
          case 0:
            HUDStyle ? DrawCircle(this.x, this.y, this.radius, `hsl(0, 100%, ${Math.sin(Date.now() / 200) * 20 + 30}%)`) :
              DrawRect(this.x, this.y, 320, 50, `hsl(0, 100%, ${Math.sin(Date.now() / 200) * 20 + 30}%)`);
            break;
          case 7:
            var thisColor = hexToHSL(boostColor)
            HUDStyle ? DrawCircle(this.x, this.y, this.radius, `hsl(${thisColor[0]}, 100%, ${Math.sin(Date.now() / 200) * 20 + 60}%)`) :
              DrawRect(this.x, this.y, 320, 50, `hsl(${thisColor[0]}, 100%, ${Math.sin(Date.now() / 100) * 10 + 60}%)`);
            break;
          default:
            if (HUDStyle) {
              var endAngle = -Math.PI / 2 + (Math.PI * 2 / 6) * boostState
              ctx.fillStyle = boostColor;
              ctx.beginPath();
              ctx.moveTo(this.x, this.y);
              ctx.arc(this.x, this.y, this.radius, -Math.PI / 2, endAngle);
              ctx.closePath();
              ctx.fill();
            } else {
              DrawRect(this.x, this.y, 320 / 7 * boostState, 50, boostColor)
            }
            break;
        }
      }
      if (!inGame || !boostOn) {
        this.lifetime = 0;
        boostPushed = false;
      }
    }
  }

  function boostUp(x, y) {
    this.x = (xPos * 3.2);
    this.y = (yPos * 2);
    this.radius = 1;
    this.width = (HUDWidth* 3.2);
    this.height = (HUDHeight * 2);
    this.lifetime = 10;
    this.alpha = 1;
    this.draw = function () {
      if (HUDStyle) {
        DrawStroke(this.x, this.y, this.radius, "white", 30)
        this.radius += 5;
        if (this.radius > 200) {
          this.lifetime = 0;
        }
      } else {
        ctx.globalAlpha = this.alpha;
        DrawRect(this.x, this.y, this.width, this.height, "white")
        ctx.globalAlpha = 1;
        this.alpha -= .04;
        this.x -= 5;
        this.y -= 5;
        this.width += 10;
        this.height += 10;
        if (this.alpha <= 0) {
          this.lifetime = 0;
        }
      }
    }
  }



  function DrawCircle(x, y, radius, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.fill();
  };

  function DrawHex(x, y, color, size) {
    ctx.beginPath();
    for (var i = 0; i < 7; i++) {
      ctx.lineTo(x + size * Math.cos(2 * Math.PI / 6 * i), y + size * 0.9 * Math.sin(2 * Math.PI / 6 * i));
    }
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = "black"
    ctx.stroke()
  };

  function DrawStroke(x, y, radius, color, stroke) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = stroke;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.stroke();
  };

  function DrawRect(x, y, height, width, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.fillRect(x, y, height, width);
  }

  function copyScreen(alpha) {
    var shine = engine.vision.ShineMeter
    let lightness = new Int8Array(engine.zone.lightness);
    let sat = new Int8Array(engine.zone.saturation);
    let hue = new Int16Array(engine.zone.hue);
    for (var iZone = 0; iZone < 560; iZone++) {
      var iRow = Math.floor(iZone / 28);
      var iCol = iZone % 28;
      var iWidth = 320 / 28;
      var iHeight = 200 / 20;
      var iZx = iCol * iWidth;
      var iZy = iRow * iHeight;
      ctx.fillStyle =
        "hsla(" +
        hue[iZone] +
        "," +
        sat[iZone] +
        "%," +
        lightness[iZone] * keyScreenBrightness / 100 +
        "%, " +
        `${alpha}` +
        ")";

      ctx.fillRect(iZx, iZy, iWidth, iHeight);
    }
  }

  function hexToHSL(H) {
    // Convert hex to RGB first
    let r = 0, g = 0, b = 0;
    if (H.length == 4) {
      r = "0x" + H[1] + H[1];
      g = "0x" + H[2] + H[2];
      b = "0x" + H[3] + H[3];
    } else if (H.length == 7) {
      r = "0x" + H[1] + H[2];
      g = "0x" + H[3] + H[4];
      b = "0x" + H[5] + H[6];
    }
    // Then to HSL
    r /= 255;
    g /= 255;
    b /= 255;
    let cmin = Math.min(r, g, b),
      cmax = Math.max(r, g, b),
      delta = cmax - cmin,
      h = 0,
      s = 0,
      l = 0;

    if (delta == 0)
      h = 0;
    else if (cmax == r)
      h = ((g - b) / delta) % 6;
    else if (cmax == g)
      h = (b - r) / delta + 2;
    else
      h = (r - g) / delta + 4;

    h = Math.round(h * 60);

    if (h < 0)
      h += 360;

    l = (cmax + cmin) / 2;
    s = delta == 0 ? 0 : delta / (1 - Math.abs(2 * l - 1));
    s = +(s * 100).toFixed(1);
    l = +(l * 100).toFixed(1);

    return [h, s, l];
  }



  function Meter(size, callback) {
    this.size = size;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    var values = [];

    this.setValue = function (updatedValue) {
      values.push(updatedValue);
      if (values.length > this.size) {
        values.shift();
      }

      for (var i = 0; i < values.length - 1; i++) {
        if (values[i] !== values[i + 1]) return;
      }
      if (this.value !== values[0]) {
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        callback();
      }
    };
  }


  window.requestAnimationFrame(update)
</script>
