  <!-- ═══════════════════════════════════════════════════════════
       VISION METERS
       Each meter captures a small region of the game screen and
       measures what percentage of its pixels match the given HSL
       range. The JS Meter class smooths readings over N frames
       before firing a callback.

       Detection strategy: every game state uses a POSITIVE meter
       (confirms the expected color IS present) paired with a
       NEGATIVE "Not" meter (confirms the region does NOT show that
       color during baseline/off state). A state is considered active
       only when positive is high AND negative is low, preventing
       false positives from ambient lighting or UI transitions.

       TESTER NOTE: If an effect never fires, first check the QA Tool
       — load a screenshot from the target resolution and verify the
       meter region actually captures the right pixels at the right
       color. Then adjust HSL ranges or region coordinates as needed.
       ═══════════════════════════════════════════════════════════ -->

       ──────────────────────────────────────────────────────────── -->

<body style="margin: 0; padding: 0; background: #000;">
    <canvas id="exCanvas" width="320" height="200"></canvas>
</body>

<script>
    // ═══════════════════════════════════════════════════════════════
    // CANVAS SETUP
    // SignalRGB renders this 320×200 canvas onto the device layout.
    // All draw coordinates are in canvas pixels; user-facing position
    // values (0–100) are scaled to canvas pixels in JS (x * 3.2, y * 2.0).
    // ═══════════════════════════════════════════════════════════════
    const canvas = document.getElementById('exCanvas')
    const ctx    = canvas.getContext('2d')
    const width  = 320
    const height = 200

    // Hidden canvas — all effects are drawn here each frame, then
    // composited onto ctx in a single drawImage call.
    const hiddenCanvas = document.createElement('canvas')
    hiddenCanvas.width  = width
    hiddenCanvas.height = height
    const hiddenCtx = hiddenCanvas.getContext('2d')

    // Active effects pool. Each entry has a draw() method and a lifetime
    // property. Objects with lifetime <= 0 are filtered out after drawing.
    let effects = []

    // ═══════════════════════════════════════════════════════════════
    // METER DECLARATIONS
    // Each Meter(size, callback) smooths the vision signal over `size`
    // consecutive identical frames before updating its .value and firing
    // the callback. Larger size = more stable but slower to react.
    // ═══════════════════════════════════════════════════════════════

    // Hide count — how many chameleons are hidden
    const hide1_Meter             = new Meter(3, hideAmountCallback)
    const hide2_Meter             = new Meter(3, hideAmountCallback)
    const hide3_Meter             = new Meter(3, hideAmountCallback)
    const notHideWhite_Meter      = new Meter(3, hideAmountCallback)

    // In-game detect — gates every other effect
    const hunt1_Meter             = new Meter(3, inGameDetect)
    const hourglassWhite_Meter    = new Meter(3, inGameDetect)
    const notHourglassWhite_Meter = new Meter(3, inGameDetect)

    // Round timer hourglass
    const hGreenTop_Meter         = new Meter(3, hourglassCallback)
    const hGreenBottom_Meter      = new Meter(3, hourglassCallback)

    // Buried banner
    const buried1_Meter           = new Meter(3, buriedCallback)
    const buried2_Meter           = new Meter(3, buriedCallback)
    const buriedNotYellow_Meter   = new Meter(3, buriedCallback)

    // End turn prompt
    const endTurnBlack_Meter      = new Meter(3, endTurnCallback)
    const endTurnWhite_Meter      = new Meter(3, endTurnCallback)
    const endTurnNotWhite_Meter   = new Meter(3, endTurnCallback)

    // Hide score bonus
    const hideScoreWhite_Meter    = new Meter(3, hideScoreCallback)
    const hideScoreBlue_Meter     = new Meter(3, hideScoreCallback)
    const hideScoreNotWhite_Meter = new Meter(3, hideScoreCallback)

    // Hunt score catch
    const huntScoreOrange_Meter   = new Meter(3, huntScoreCallback)
    const huntScoreBlue_Meter     = new Meter(3, huntScoreCallback)
    const huntScoreWhite_Meter    = new Meter(3, huntScoreCallback)

    // Paint prompt
    const paintBlack_Meter        = new Meter(3, paintCallback)
    const paintNotBlack_Meter     = new Meter(3, paintCallback)
    const paintBlue_Meter         = new Meter(3, paintCallback)

    // Pose showcase
    const poseWhite_Meter         = new Meter(3, poseCallback)
    const poseOrange_Meter        = new Meter(3, poseCallback)

    // Rank results board
    const rank1_Meter             = new Meter(3, rankCallback)
    const rank2_Meter             = new Meter(3, rankCallback)
    const rank3_Meter             = new Meter(3, rankCallback)
    const rankNotGreen_Meter      = new Meter(3, rankCallback)


    //#region Update
    // ═══════════════════════════════════════════════════════════════
    // MAIN UPDATE LOOP — called every animation frame (~60fps).
    //   1. Clear hidden canvas to black
    //   2. Draw background
    //   3. Feed current vision readings into each Meter (may fire callbacks)
    //   4. Draw all active effects; filter out expired ones
    //   5. Composite hidden canvas onto the main canvas
    // ═══════════════════════════════════════════════════════════════
    function update() {
        // Start each frame from a clean black canvas, then lay the background under everything
        DrawRect(0, 0, 320, 200, 'black')
        backgroundHandler()

        // Feed the latest vision readings into every meter — a meter only fires
        // its callback once its reading holds steady for several frames
        hide1_Meter.setValue(engine.vision.hide1)
        hide2_Meter.setValue(engine.vision.hide2)
        hide3_Meter.setValue(engine.vision.hide3)
        notHideWhite_Meter.setValue(engine.vision.notHideWhite)
        hunt1_Meter.setValue(engine.vision.hunt1)
        hourglassWhite_Meter.setValue(engine.vision.hourglassWhite)
        notHourglassWhite_Meter.setValue(engine.vision.notHourglassWhite)
        hGreenTop_Meter.setValue(engine.vision.hGreenTop)
        hGreenBottom_Meter.setValue(engine.vision.hGreenBottom)
        buried1_Meter.setValue(engine.vision.buried1)
        buried2_Meter.setValue(engine.vision.buried2)
        buriedNotYellow_Meter.setValue(engine.vision.buriedNotYellow)
        endTurnBlack_Meter.setValue(engine.vision.endTurnBlack)
        endTurnWhite_Meter.setValue(engine.vision.endTurnWhite)
        endTurnNotWhite_Meter.setValue(engine.vision.endTurnNotWhite)
        hideScoreWhite_Meter.setValue(engine.vision.hideScoreWhite)
        hideScoreBlue_Meter.setValue(engine.vision.hideScoreBlue)
        hideScoreNotWhite_Meter.setValue(engine.vision.hideScoreNotWhite)
        huntScoreOrange_Meter.setValue(engine.vision.huntScoreOrange)
        huntScoreBlue_Meter.setValue(engine.vision.huntScoreBlue)
        huntScoreWhite_Meter.setValue(engine.vision.huntScoreWhite)
        paintBlack_Meter.setValue(engine.vision.paintBlack)
        paintNotBlack_Meter.setValue(engine.vision.paintNotBlack)
        paintBlue_Meter.setValue(engine.vision.paintBlue)
        poseWhite_Meter.setValue(engine.vision.poseWhite)
        poseOrange_Meter.setValue(engine.vision.poseOrange)
        rank1_Meter.setValue(engine.vision.rank1)
        rank2_Meter.setValue(engine.vision.rank2)
        rank3_Meter.setValue(engine.vision.rank3)
        rankNotGreen_Meter.setValue(engine.vision.rankNotGreen)

        // Draw every active effect, then drop the ones that have expired
        effects.forEach(e => e.draw())
        effects = effects.filter(e => !(e.lifetime <= 0))

        // Composite the hidden canvas onto the visible one in a single blit
        ctx.drawImage(hiddenCanvas, 0, 0)
        window.requestAnimationFrame(update)
    }
    //#endregion


    //#region Callbacks
    // ═══════════════════════════════════════════════════════════════
    // CALLBACKS
    // Each callback is fired by one or more Meters when their signal
    // stabilizes. Callbacks evaluate the CURRENT state of all related
    // meters and flags, then push effects or flip state booleans.
    //
    // "Going" flags prevent duplicate spawns: once an effect is active
    // its flag is true and the spawn condition short-circuits. The flag
    // is cleared when the state ends or the effect expires.
    // ═══════════════════════════════════════════════════════════════

    // Game state flags — gInGame gates everything; the rest are per-effect latches
    let gInGame = false
    let hourglassGoing = false
    let buriedGoing = false
    let endTurnGoing = false
    let hideScoreGoing = false
    let huntScoreGoing = false
    let paintGoing = false
    let poseGoing = false


    // ── In-game detect ──────────────────────────────────────────────
    // Sets gInGame true only when the hunt marker AND white hourglass are both
    // present and the guard strip is dark; clears it when both vanish. Nothing
    // else fires unless gInGame is true.
    function inGameDetect() {
        if (hunt1_Meter.value >= .95 && hourglassWhite_Meter.value >= .95 && engine.vision.notHourglassWhite < .1) {
            gInGame = true
        } else if (hunt1_Meter.value < .1 && hourglassWhite_Meter.value < .1) {
            gInGame = false
        }
    }

    // ── Hide count ──────────────────────────────────────────────────
    // Reads how many hide pips (1-3) are lit and fires a matching splat burst.
    // hideCount latches the last count so a burst plays only when it changes.
    let hideCount = 0
    function hideAmountCallback() {
        if(gInGame && hideOn && hide3_Meter.value >= .95 && hide2_Meter.value >= .95 && hide1_Meter.value >= .95 && hideCount != 3){
            hideCount = 3
            effects.push(new PaintSplat(53, 100, 120, 0))
            effects.push(new PaintSplat(267, 100, 120, 8))
            effects.push(new PaintSplat(160, 100, 120, 16))
        } else if(gInGame && hideOn && hide3_Meter.value <= .1 && hide2_Meter.value >= .95 && hide1_Meter.value >= .95 && hideCount != 2){
            hideCount = 2
            effects.push(new PaintSplat(53, 100, 144, 0))
            effects.push(new PaintSplat(267, 100, 144, 8))
        } else if(gInGame && hideOn && hide3_Meter.value <= .1 && hide2_Meter.value <= .1 && hide1_Meter.value >= .95 && hideCount != 1){
            hideCount = 1
            effects.push(new PaintSplat(160, 100, 160, 0, true, 20, 1.3))
        }
    }

    // ── Round timer ─────────────────────────────────────────────────
    // Starts the timer sweep once the green hourglass shows; the going flag
    // clears when the match ends so the next round can start a fresh sweep.
    let hWidth = 0
    function hourglassCallback() {
        if(gInGame && timerOn && hourglassWhite_Meter.value >= .95 && (hGreenTop_Meter.value >= .1 || hGreenBottom_Meter.value >= .1) && !hourglassGoing){
            hourglassGoing = true
            effects.push(new HourglassTimer())
        } if (!gInGame) hourglassGoing = false
    }

    // ── Buried ──────────────────────────────────────────────────────
    // Both yellow bars present + the gap between them clear → draw the X once.
    // buriedGoing latches until the bars disappear or the match ends.
    function buriedCallback() {
        if (gInGame && buriedOn && buried1_Meter.value >= .33 && buried2_Meter.value >= .33 && engine.vision.buriedNotYellow < .1 && !buriedGoing) {
            effects.push(new BuriedX())
            buriedGoing = true
        } else if (!gInGame || (gInGame && buried1_Meter.value < .1 && buried2_Meter.value < .1)) {
            buriedGoing = false
        }
    }

    // ── End turn ────────────────────────────────────────────────────
    // Dark button body + white "End Turn" text + guard strip clear → flip the
    // hourglass once. endTurnGoing clears when the text leaves screen.
    function endTurnCallback() {
        if (gInGame && endTurnOn && endTurnBlack_Meter.value >= .95 && endTurnWhite_Meter.value > .33 && engine.vision.endTurnNotWhite < .1 && !endTurnGoing) {
            effects.push(new EndTurnHourglass())
            endTurnGoing = true
        } else if (!gInGame || (gInGame && endTurnWhite_Meter.value < .1)) {
            endTurnGoing = false
        }
    }

    // ── Hide score ──────────────────────────────────────────────────
    // White score text + blue hide badge → dim the screen and float a wave of
    // 15 plus marks. hideScoreGoing clears when the blue badge fades.
    function hideScoreCallback() {
        if (gInGame && hideScoreOn && hideScoreWhite_Meter.value >= .2 && hideScoreBlue_Meter.value > .05 && engine.vision.hideScoreNotWhite < .1 && !hideScoreGoing) {
            effects.push(new HideScoreBackdrop())
            for (let i = 0; i < 15; i++) effects.push(new PlusParticle(i * 9))
            hideScoreGoing = true
        } else if (!gInGame || (gInGame && hideScoreBlue_Meter.value <= .05)) {
            hideScoreGoing = false
        }
    }

    // ── Hunt score ──────────────────────────────────────────────────
    // Orange figure + blue badge + white number of the catch popup all present
    // → spawn the laughing red figure. huntScoreGoing clears when orange fades.
    function huntScoreCallback() {
        if (gInGame && huntScoreOn && huntScoreOrange_Meter.value > .15 && huntScoreBlue_Meter.value > .15 && huntScoreWhite_Meter.value > .08 && !huntScoreGoing) {
            effects.push(new RedPerson())
            huntScoreGoing = true
        } else if (!gInGame || (gInGame && huntScoreOrange_Meter.value < .1)) {
            huntScoreGoing = false
        }
    }

    // ── Paint ───────────────────────────────────────────────────────
    // Blue paint icon + dark body + guard clear → start the persistent rainbow
    // wash. It fades itself out once paintGoing drops (blue icon gone).
    function paintCallback() {
        if (gInGame && paintOn && paintBlack_Meter.value >= .95 && paintNotBlack_Meter.value <= .1 && paintBlue_Meter.value >= .95 && !paintGoing) {
            effects.push(new PaintWash())
            paintGoing = true
        } else if (!gInGame || (gInGame && paintBlue_Meter.value < .1)) {
            paintGoing = false
        }
    }

    // ── Pose ────────────────────────────────────────────────────────
    // White pose text + orange pose figure both present → spotlight the posing
    // silhouette. poseGoing clears when the white text leaves screen.
    function poseCallback() {
        if (gInGame && poseOn && poseWhite_Meter.value >= .95 && poseOrange_Meter.value >= .95 && !poseGoing) {
            effects.push(new PoseShowcase())
            poseGoing = true
        } else if (!gInGame || (gInGame && poseWhite_Meter.value <= .1)) {
            poseGoing = false
        }
    }

    // ── Rank ────────────────────────────────────────────────────────
    // Which rank row is green (1/2/3) drops the matching medal. gRank latches
    // the tier already shown and resets to 0 when out of game or rank is off.
    let gRank = 0
    function rankCallback() {
        if(gInGame && rankOn){
            if(rank1_Meter.value >= .15 && engine.vision.rankNotGreen < .1 && gRank != 1){
                gRank = 1
                effects.push(new Medal(1))
            } else if(rank2_Meter.value >= .15 && engine.vision.rankNotGreen < .1 && gRank != 2){
                gRank = 2
                effects.push(new Medal(2))
            } else if(rank3_Meter.value >= .15 && engine.vision.rankNotGreen < .1 && gRank != 3){
                gRank = 3
                effects.push(new Medal(3))
            } else gRank = 0
        } else gRank = 0
    }

    //#endregion


    //#region Background Modes
    // ═══════════════════════════════════════════════════════════════
    // BACKGROUND SYSTEM
    // Eight modes routed by string.includes() so shared keywords act as
    // feature flags (Color Cycle / Ambience / Audio Visualizer / Custom).
    // ═══════════════════════════════════════════════════════════════
    let proBack = [0, 0, 0]

    // Fires when the user picks a new Custom Color — cache it as HSL for reuse
    function onbackColorChanged() { proBack = hexToHSL(backColor) }

    let audioEase = { sat: 0, lit: 0 }
    let gCycle = 0

    // Ease the audio density toward its target so sat/lit react smoothly, not jittery
    function updateAudioEase() {
        const targetDensity = engine.audio.density * 100
        audioEase.sat += (targetDensity - audioEase.sat) / 10
        audioEase.lit += (targetDensity - audioEase.lit) / 10
    }

    function getColorString(hue, sat, lit, alpha) {
        return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`
    }

    // Slowly rotate the global hue used by every Color Cycle mode
    function updateColorCycle() {
        gCycle = (gCycle + 0.5) % 360
    }

    // Routes the chosen Background Mode to the right fill. Keyword matching means
    // a mode name can opt into several behaviors at once (e.g. Color Cycle + Audio)
    function backgroundHandler() {
        const alpha = ambienceAlpha / 100

        if (backgroundMode.includes('Color Cycle')) updateColorCycle()
        if (backgroundMode.includes('Audio'))       updateAudioEase()

        // Ambience modes mirror the screen's per-zone colors instead of a flat fill
        if (backgroundMode.includes('Ambience')) {
            backgroundMode === 'Ambience Audio Visualizer'
                ? copyScreenAudio(alpha)
                : copyScreen(alpha)
            return
        }

        const hue = proBack[0] + (backgroundMode.includes('Color Cycle') ? gCycle : 0)
        const sat = backgroundMode.includes('Audio') ? audioEase.sat * 0.33 + 66 : proBack[1]
        const lit = backgroundMode.includes('Audio') ? audioEase.lit * 0.9  + 10 : proBack[2]
        DrawRect(0, 0, 320, 200, getColorString(hue, sat, lit, alpha))
    }

    const ZONE_COLS = 28, ZONE_ROWS = 20, TOTAL_ZONES = 28 * 20

    // Screen-mirror fill with audio reactivity: each zone's saturation/lightness
    // is scaled by the eased audio level so the ambience pulses with the music
    function copyScreenAudio(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat       = new Int8Array(engine.zone.saturation)
        const hue       = new Int16Array(engine.zone.hue)
        const zw = 320 / ZONE_COLS, zh = 200 / ZONE_ROWS
        const satMul = audioEase.sat / 200 + 0.5
        const litMul = audioEase.lit / 100
        for (let i = 0; i < TOTAL_ZONES; i++) {
            const col = i % ZONE_COLS, row = i / ZONE_COLS | 0
            hiddenCtx.fillStyle = getColorString(hue[i], sat[i] * satMul, lightness[i] * litMul, alpha)
            hiddenCtx.fillRect(col * zw, row * zh, zw, zh)
        }
    }

    // Plain screen-mirror fill. Custom Ambience locks every zone to the user color;
    // Color Cycle Ambience rotates each zone's hue by the shared cycle offset
    function copyScreen(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat       = new Int8Array(engine.zone.saturation)
        const hue       = new Int16Array(engine.zone.hue)
        const zw = 320 / ZONE_COLS, zh = 200 / ZONE_ROWS
        for (let i = 0; i < TOTAL_ZONES; i++) {
            const col = i % ZONE_COLS, row = i / ZONE_COLS | 0
            const finalHue = backgroundMode === 'Custom Ambience'
                ? proBack[0]
                : hue[i] + (backgroundMode === 'Color Cycle Ambience' ? gCycle : 0)
            hiddenCtx.fillStyle = getColorString(finalHue, sat[i], lightness[i], alpha)
            hiddenCtx.fillRect(col * zw, row * zh, zw, zh)
        }
    }
    //#endregion


    //#region Helper Functions
    // -------------------------------------------------------------------------
    // Draw primitives — all target hiddenCtx; composited to ctx each frame
    // -------------------------------------------------------------------------

    // DrawLine: stroke a straight line between two [x, y] points
    function DrawLine(start, end, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.moveTo(start[0], start[1])
        hiddenCtx.lineTo(end[0], end[1])
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.stroke()
    }

    // DrawEllipse: filled ellipse centered at (x, y)
    function DrawEllipse(x, y, width, height, rotation, color) {
        hiddenCtx.beginPath()
        hiddenCtx.ellipse(x, y, width, height, rotation, 0, Math.PI * 2)
        hiddenCtx.fillStyle = color
        hiddenCtx.fill()
    }

    // DrawCircle: filled circle
    function DrawCircle(x, y, radius, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
        hiddenCtx.fill()
    }

    // DrawStroke: outlined circle (no fill)
    function DrawStroke(x, y, radius, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
        hiddenCtx.stroke()
    }

    // DrawRect: filled rectangle — also accepts a canvas gradient object as color
    function DrawRect(x, y, w, h, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.fillRect(x, y, w, h)
    }

    // -------------------------------------------------------------------------
    // Utilities
    // -------------------------------------------------------------------------

    // hexToHSL: convert a CSS hex string to [H(0-360), S(0-100), L(0-100)]
    function hexToHSL(hex) {
        const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || []
        const rgb = [r, g, b].map(x => parseInt(x, 16) / 255)
        const max = Math.max(...rgb), min = Math.min(...rgb)
        const l = (max + min) / 2
        if (max === min) return [0, 0, Math.round(l * 100)]
        const d = max - min
        const s = l > 0.5 ? d / (2 - max - min) : d / (max + min)
        const [nr, ng, nb] = rgb
        let h
        if (max === nr)      h = (ng - nb) / d + (ng < nb ? 6 : 0)
        else if (max === ng) h = (nb - nr) / d + 2
        else                 h = (nr - ng) / d + 4
        return [Math.round(h * 60), Math.round(s * 100), Math.round(l * 100)]
    }

    // ─── Meter class — frame-stabilizing debouncer for vision signals ────────
    // setValue keeps the last `size` readings; it only commits a new .value and
    // fires the callback once ALL of those readings agree, filtering 1-frame noise.
    function Meter(size, callback) {
        this.size      = size
        this.value     = 0
        this.diff      = 0
        this.increased = false
        this.decreased = false
        const values   = []
        this.setValue = function (updatedValue) {
            values.push(updatedValue)
            if (values.length > this.size) values.shift()
            // Bail unless every buffered reading is identical
            for (let i = 0; i < values.length - 1; i++) {
                if (values[i] !== values[i + 1]) return
            }
            if (this.value !== values[0]) {
                this.diff      = Math.abs(this.value - values[0])
                this.increased = this.value < values[0]
                this.decreased = this.value > values[0]
                this.value     = values[0]
                callback()
            }
        }
    }
    //#endregion


    //#region Effects
    // ═══════════════════════════════════════════════════════════════
    // EFFECTS
    // Each effect is a constructor function. Instances are pushed into
    // the effects[] array and drawn every frame until lifetime is set
    // to 0 (or the object self-terminates).
    //
    // Coordinate system:
    //   User-facing X/Y/W/H properties are 0–100 (% of canvas).
    //   Canvas pixels: x * 3.2  (320 / 100),  y * 2.0  (200 / 100)
    // ═══════════════════════════════════════════════════════════════

    // roundRectPath: trace an axis-aligned rounded rectangle (caller fills it).
    function roundRectPath(x, y, w, h, r) {
        hiddenCtx.beginPath()
        hiddenCtx.moveTo(x + r, y)
        hiddenCtx.arcTo(x + w, y, x + w, y + h, r)
        hiddenCtx.arcTo(x + w, y + h, x, y + h, r)
        hiddenCtx.arcTo(x, y + h, x, y, r)
        hiddenCtx.arcTo(x, y, x + w, y, r)
        hiddenCtx.closePath()
    }

    // drawStar: filled n-point star centered at (cx, cy).
    function drawStar(cx, cy, spikes, outerR, innerR, color) {
        let rot = -Math.PI / 2
        const step = Math.PI / spikes
        hiddenCtx.beginPath()
        hiddenCtx.moveTo(cx, cy - outerR)
        for (let i = 0; i < spikes; i++) {
            hiddenCtx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR)
            rot += step
            hiddenCtx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR)
            rot += step
        }
        hiddenCtx.closePath()
        hiddenCtx.fillStyle = color
        hiddenCtx.fill()
    }

    // hslToRgb: H(0-360), S/L(0-100) -> [r, g, b] each 0-255
    function hslToRgb(h, s, l) {
        s /= 100; l /= 100
        const a = s * Math.min(l, 1 - l)
        const f = n => {
            const k = (n + h / 30) % 12
            return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))
        }
        return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)]
    }

    // PaintSplat: a splotch built from blobs (big at the core, small at edges)
    // that pops in, holds, then fades. flash strobes red<->cycle color.
    function PaintSplat(x, y, maxRadius, delay, flash, extraBlobs = 0, spread = 1) {
        this.x = x
        this.y = y
        this.maxRadius = maxRadius
        this.delay = delay
        this.flash = flash
        this.progress = 0
        this.age = 0
        this.lifetime = 1
        this.hue = Math.floor(Math.random() * 360)
        this.blobs = []
        const spreadRadius = maxRadius * spread * 1.1
        const count = 25 + Math.floor(Math.random() * 6) + extraBlobs
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2
            const dist  = Math.random() * spreadRadius
            const t     = dist / spreadRadius
            this.blobs.push({
                dx:   Math.cos(angle) * dist,
                dy:   Math.sin(angle) * dist,
                size: maxRadius * (0.28 * (1 - t) + 0.06)
            })
        }
        this.draw = function () {
            if (this.delay > 0) { this.delay--; return }
            if (this.progress < 1) this.progress += 1 / 6
            this.age++
            let alpha = 1
            if (this.age > 120) alpha = 1 - (this.age - 120) / 30
            if (alpha <= 0) { this.lifetime = 0; return }
            this.hue = (this.hue + 0.5) % 360

            hiddenCtx.beginPath()
            this.blobs.forEach(b => {
                const cx = this.x + b.dx
                const cy = this.y + b.dy
                const r  = b.size * this.progress
                hiddenCtx.moveTo(cx + r, cy)
                hiddenCtx.arc(cx, cy, r, 0, 2 * Math.PI)
            })
            if (this.flash) {
                const c   = hslToRgb(this.hue, 80, 55)
                const r   = hslToRgb(0, 80, 55)
                const mix = (Math.sin(this.age * (Math.PI / 22)) + 1) / 2
                const rr  = Math.round(c[0] + (r[0] - c[0]) * mix)
                const gg  = Math.round(c[1] + (r[1] - c[1]) * mix)
                const bb  = Math.round(c[2] + (r[2] - c[2]) * mix)
                hiddenCtx.fillStyle = `rgba(${rr}, ${gg}, ${bb}, ${alpha})`
            } else {
                hiddenCtx.fillStyle = `hsla(${this.hue}, 80%, 55%, ${alpha})`
            }
            hiddenCtx.fill()
        }
    }

    // HideScoreBackdrop: 25% black dim that stays while any PlusParticle lives.
    function HideScoreBackdrop() {
        this.lifetime = 1
        this.draw = function () {
            if (!effects.some(e => e instanceof PlusParticle)) { this.lifetime = 0; return }
            DrawRect(0, 0, 320, 200, 'rgba(0, 0, 0, 0.25)')
        }
    }

    // PlusParticle: a thick blue/cyan plus that floats up, pulsing 25-100%.
    function PlusParticle(delay) {
        this.delay  = delay
        this.x      = 40 + Math.random() * 240
        this.y      = 180 + Math.random() * 30
        this.startY = this.y
        this.vy     = 1 + Math.random() * 0.8
        this.size   = 11.5 + Math.random() * 11.5
        this.thick  = 8 + Math.random() * 6
        this.hue    = 180 + Math.random() * 40
        this.cycles = 2 + Math.random()
        this.alpha  = 0.25
        this.lifetime = 1
        this.draw = function () {
            if (this.delay > 0) { this.delay--; return }
            this.y -= this.vy
            if (this.y < -this.size) { this.lifetime = 0; return }
            const endY     = -this.size
            const progress = (this.startY - this.y) / (this.startY - endY)
            this.alpha = 0.25 + 0.75 * (1 - Math.cos(progress * this.cycles * 2 * Math.PI)) / 2
            const color = `hsla(${this.hue}, 90%, 55%, ${this.alpha})`
            DrawLine([this.x - this.size, this.y], [this.x + this.size, this.y], color, this.thick)
            DrawLine([this.x, this.y - this.size], [this.x, this.y + this.size], color, this.thick)
        }
    }

    // RedPerson: a laughing sign-style figure with paint splotches bursting
    // behind it (manages its own splotches), holds, then fades out.
    function RedPerson() {
        this.lifetime = 1
        this.age = 0
        this.splats = []
        this.draw = function () {
            this.age++
            let alpha = 1
            if (this.age > 180) alpha = Math.max(0, 1 - (this.age - 180) / 40)
            if (this.age > 220) { this.lifetime = 0; return }

            const cx = 160, cy = 100
            const red = '#cc1f1f'
            const laugh = (Math.sin(this.age * 0.175) + 1) / 2

            hiddenCtx.save()
            hiddenCtx.globalAlpha = alpha

            if (this.age <= 180 && this.age % 5 === 0) {
                const sAng  = Math.random() * Math.PI * 2
                const sDist = 30 + Math.random() * 80
                this.splats.push(new PaintSplat(
                    160 + Math.cos(sAng) * sDist,
                    100 + Math.sin(sAng) * sDist,
                    71.9 + Math.random() * 57.5,
                    0
                ))
            }
            this.splats.forEach(s => s.draw())
            this.splats = this.splats.filter(s => !(s.lifetime <= 0))

            hiddenCtx.fillStyle = red
            const arm = (px, ang) => {
                hiddenCtx.save()
                hiddenCtx.translate(px, 158)
                hiddenCtx.rotate(ang)
                roundRectPath(-16, -15, 32, 90, 16)
                hiddenCtx.fill()
                hiddenCtx.beginPath()
                hiddenCtx.arc(0, 75, 17, 0, 2 * Math.PI)
                hiddenCtx.fill()
                hiddenCtx.restore()
            }
            arm(102, 2.356)
            arm(218, -2.356)

            roundRectPath(94, 150, 132, 56, 28)
            hiddenCtx.fill()

            hiddenCtx.beginPath()
            hiddenCtx.arc(cx, cy, 48, 0, 2 * Math.PI)
            hiddenCtx.fill()

            const my = cy + 10, mw = 32
            const lowerDip = 6 + laugh * 40
            hiddenCtx.beginPath()
            hiddenCtx.moveTo(cx - mw, my)
            hiddenCtx.quadraticCurveTo(cx, my - 16, cx + mw, my)
            hiddenCtx.quadraticCurveTo(cx, my + lowerDip, cx - mw, my)
            hiddenCtx.closePath()
            hiddenCtx.fillStyle = 'white'
            hiddenCtx.fill()

            hiddenCtx.restore()
        }
    }

    // PoseShowcase: a silhouette in a spotlight circle snapping between poses,
    // fading in and out over 3 seconds.
    function PoseShowcase() {
        this.lifetime = 1
        this.age = 0
        this.poses = [
            [ 2.4, -2.4, 0.25, -0.25, 0],
            [ 1.57, -1.57, 0.5, -0.5, 0],
            [ 2.6, -1.57, 0.3, -0.3, 0],
            [ 0.5, -0.5, 0.15, -0.15, 0],
            [ 2.9, 0.3, 0.15, -0.4, -1.5708]
        ]
        this.draw = function () {
            this.age++
            const total = 180
            if (this.age > total) { this.lifetime = 0; return }
            let alpha = 1
            if (this.age < 30) alpha = this.age / 30
            else if (this.age > total - 30) alpha = (total - this.age) / 30

            const cx = 160, cy = 100
            const pose    = this.poses[Math.floor(this.age / 36) % this.poses.length]
            const pulseT  = (this.age % 36) / 36
            const circleR = 72.5 + (1 - pulseT) * 7.5

            hiddenCtx.save()
            hiddenCtx.globalAlpha = alpha
            hiddenCtx.beginPath()
            hiddenCtx.fillStyle = 'hsl(45, 90%, 55%)'
            hiddenCtx.arc(cx, cy, circleR, 0, 2 * Math.PI)
            hiddenCtx.fill()
            hiddenCtx.beginPath()
            hiddenCtx.strokeStyle = 'white'
            hiddenCtx.lineWidth = 4
            hiddenCtx.arc(cx, cy, circleR, 0, 2 * Math.PI)
            hiddenCtx.stroke()

            hiddenCtx.save()
            hiddenCtx.translate(cx, cy)
            hiddenCtx.scale(1.5, 1.5)
            hiddenCtx.rotate(pose[4])
            hiddenCtx.translate(-cx, -cy)
            hiddenCtx.fillStyle = '#1a1a1a'
            const limb = (px, py, ang, len, w) => {
                hiddenCtx.save()
                hiddenCtx.translate(px, py)
                hiddenCtx.rotate(ang)
                roundRectPath(-w / 2, 0, w, len, w / 2)
                hiddenCtx.fill()
                hiddenCtx.restore()
            }
            limb(cx - 5, cy + 12, pose[2], 26, 9)
            limb(cx + 5, cy + 12, pose[3], 26, 9)
            limb(cx - 5, cy - 10, pose[0], 24, 8)
            limb(cx + 5, cy - 10, pose[1], 24, 8)
            roundRectPath(cx - 8, cy - 14, 16, 28, 8)
            hiddenCtx.fill()
            hiddenCtx.beginPath()
            hiddenCtx.arc(cx, cy - 26, 11, 0, 2 * Math.PI)
            hiddenCtx.fill()
            hiddenCtx.restore()

            hiddenCtx.restore()
        }
    }

    // Medal: a circular pendant lowered on a striped two-color ribbon, with a
    // shockwave ring on landing. Tier: 1 gold, 2 silver, 3 bronze.
    function Medal(tier) {
        this.lifetime = 1
        this.age = 0
        this.ringAge = null
        const metals = {
            1: { face: '#ffd700', rim: '#c9a400' },
            2: { face: '#dcdcdc', rim: '#9a9a9a' },
            3: { face: '#cd7f32', rim: '#9c5e22' }
        }
        this.metal = metals[tier] || metals[1]
        this.ribbonA = `hsl(${Math.floor(Math.random() * 360)}, 80%, 50%)`
        this.ribbonB = `hsl(${Math.floor(Math.random() * 360)}, 80%, 50%)`
        this.draw = function () {
            this.age++
            let alpha = 1
            if (this.age > 220) alpha = Math.max(0, 1 - (this.age - 220) / 40)
            if (this.age > 260) { this.lifetime = 0; return }

            const cx = 160, R = 48, restY = 115
            const lower = Math.min(1, this.age / 60)
            const ease  = 1 - Math.pow(1 - lower, 3)
            const bob   = lower >= 1 ? Math.sin(this.age * 0.12) * 3 : 0
            const my    = -R + (restY + R) * ease + bob
            const ribbonBottom = Math.max(0, my)

            hiddenCtx.save()
            hiddenCtx.globalAlpha = alpha

            DrawRect(0, 0, 320, 200, 'rgba(0, 0, 0, 0.25)')

            const ribbonW = 42, ribbonX = cx - ribbonW / 2
            hiddenCtx.save()
            hiddenCtx.beginPath()
            hiddenCtx.rect(ribbonX, 0, ribbonW, ribbonBottom)
            hiddenCtx.clip()
            hiddenCtx.fillStyle = this.ribbonA
            hiddenCtx.fillRect(ribbonX, 0, ribbonW, ribbonBottom)
            hiddenCtx.strokeStyle = this.ribbonB
            hiddenCtx.lineWidth = 11
            for (let yy = -ribbonW; yy < ribbonBottom + ribbonW; yy += 22) {
                hiddenCtx.beginPath()
                hiddenCtx.moveTo(ribbonX - 4, yy)
                hiddenCtx.lineTo(ribbonX + ribbonW + 4, yy + ribbonW)
                hiddenCtx.stroke()
            }
            hiddenCtx.restore()

            if (lower >= 1 && this.ringAge === null) this.ringAge = 0
            if (this.ringAge !== null && this.ringAge <= 45) {
                hiddenCtx.save()
                hiddenCtx.globalAlpha = alpha * Math.max(0, 1 - this.ringAge / 45)
                hiddenCtx.beginPath()
                hiddenCtx.strokeStyle = this.metal.face
                hiddenCtx.lineWidth = 12
                hiddenCtx.arc(cx, restY, this.ringAge * 5, 0, 2 * Math.PI)
                hiddenCtx.stroke()
                hiddenCtx.restore()
                this.ringAge++
            }

            DrawStroke(cx, my - R, 7, this.metal.rim, 5)
            DrawCircle(cx, my, R, this.metal.rim)
            DrawCircle(cx, my, R - 6, this.metal.face)
            drawStar(cx, my, 5, 24, 11, this.metal.rim)

            hiddenCtx.restore()
        }
    }

    // EndTurnHourglass: lime hourglass with a thick white outline; materializes,
    // flips (in-plane rotation), holds, then fades. 33% black backdrop.
    function EndTurnHourglass() {
        this.lifetime = 1
        this.age = 0
        const w = 55, h = 51.75, nw = 9
        this.draw = function () {
            this.age++
            const grow = Math.min(1, this.age / 30)
            let angle = 0
            if (this.age > 90 && this.age < 190) angle = (this.age - 90) / 100 * Math.PI
            else if (this.age >= 190) angle = Math.PI
            let alpha = 1
            if (this.age > 230) alpha = Math.max(0, 1 - (this.age - 230) / 30)
            if (this.age > 260) { this.lifetime = 0; return }

            DrawRect(0, 0, 320, 200, `rgba(0, 0, 0, ${0.33 * alpha})`)

            hiddenCtx.save()
            hiddenCtx.globalAlpha = alpha
            hiddenCtx.translate(160, 100)
            hiddenCtx.rotate(angle)
            hiddenCtx.scale(grow, grow)

            hiddenCtx.beginPath()
            hiddenCtx.moveTo(-w, -h)
            hiddenCtx.lineTo(w, -h)
            hiddenCtx.quadraticCurveTo(w, -h * 0.25, nw, 0)
            hiddenCtx.quadraticCurveTo(w, h * 0.25, w, h)
            hiddenCtx.lineTo(-w, h)
            hiddenCtx.quadraticCurveTo(-w, h * 0.25, -nw, 0)
            hiddenCtx.quadraticCurveTo(-w, -h * 0.25, -w, -h)
            hiddenCtx.closePath()
            hiddenCtx.fillStyle = 'limegreen'
            hiddenCtx.fill()
            hiddenCtx.lineWidth = 8
            hiddenCtx.lineJoin = 'round'
            hiddenCtx.strokeStyle = 'white'
            hiddenCtx.stroke()

            hiddenCtx.restore()
        }
    }

    // BuriedX: a thick orange/yellow X drawn on as two strokes, pulsing opacity.
    // Persists while buried; fades out and expires once the buried state ends.
    function BuriedX() {
        this.lifetime = 1
        this.progress = 0
        this.age = 0
        this.fade = 1
        const cx = 160, cy = 100, hx = 84, hy = 72
        this.strokes = [
            { from: [cx - hx, cy - hy], to: [cx + hx, cy + hy], color: '255, 165, 0' },
            { from: [cx + hx, cy - hy], to: [cx - hx, cy + hy], color: '255, 255, 0' }
        ]
        this.draw = function () {
            if (this.progress < 2) this.progress += 0.04
            this.age++

            // Once the buried state ends, fade out over ~50 frames, then expire
            if (!buriedGoing) this.fade -= 0.02
            if (this.fade <= 0) { this.lifetime = 0; return }

            const alpha = (0.875 + 0.125 * Math.sin(this.age * (Math.PI / 90))) * this.fade
            this.strokes.forEach((s, i) => {
                const p = Math.max(0, Math.min(1, this.progress - i))
                if (p <= 0) return
                const ex = s.from[0] + (s.to[0] - s.from[0]) * p
                const ey = s.from[1] + (s.to[1] - s.from[1]) * p
                DrawLine(s.from, [ex, ey], `rgba(${s.color}, ${alpha})`, 36)
            })
        }
    }

    // HourglassTimer: a left-to-right 50%-opaque green fill bar, shading dark to
    // light green. Width tracks how much green is left in the round's hourglass —
    // the average of the top and bottom half meters — so the bar drains with the
    // round and empties to nothing on its own. Expires when the match ends.
    function HourglassTimer() {
        this.width = 0
        this.lifetime = 1
        this.draw = function () {
            // Fraction of green left in the round (0–1); bar width is that × canvas width
            const fill = (hGreenTop_Meter.value + hGreenBottom_Meter.value) / 2
            this.width = fill * width
            const sat = 60 + 30 * fill
            const lit = 20 + 35 * fill
            DrawRect(0, 0, this.width, 200, `hsla(120, ${sat}%, ${lit}%, 0.5)`)

            // Drop the bar when the match ends so it never lingers between games
            if (!hourglassGoing) this.lifetime = 0
        }
    }

    // PaintWash: a slowly shifting rainbow — a saturated base color cycling
    // through the spectrum, with several large soft blobs of neighboring hues
    // drifting like a lava lamp and blending where they overlap (watercolor).
    // Persistent; removed when the paint state ends.
    function PaintWash() {
        this.lifetime = 1
        this.age = 0
        this.fade = 1
        this.blobs = []
        const N = 7
        for (let i = 0; i < N; i++) {
            this.blobs.push({
                baseHue: (360 / N) * i,
                phx: Math.random() * Math.PI * 2,
                phy: Math.random() * Math.PI * 2,
                sx:  0.004 + Math.random() * 0.004,
                sy:  0.004 + Math.random() * 0.004,
                r:   90 + Math.random() * 60
            })
        }
        this.draw = function () {
            this.age++

            // Once the paint state ends, fade out over ~50 frames, then expire
            if (!paintGoing) this.fade -= 0.02
            if (this.fade <= 0) { this.lifetime = 0; return }

            hiddenCtx.save()
            hiddenCtx.globalAlpha = this.fade
            DrawRect(0, 0, 320, 200, `hsl(${(this.age * 0.3) % 360}, 80%, 45%)`)
            this.blobs.forEach(b => {
                const x   = 160 + Math.sin(this.age * b.sx + b.phx) * 130
                const y   = 100 + Math.sin(this.age * b.sy + b.phy) * 80
                const hue = (b.baseHue + this.age * 0.3) % 360
                const grad = hiddenCtx.createRadialGradient(x, y, 0, x, y, b.r)
                grad.addColorStop(0, `hsla(${hue}, 90%, 55%, 0.5)`)
                grad.addColorStop(1, `hsla(${hue}, 90%, 55%, 0)`)
                hiddenCtx.fillStyle = grad
                hiddenCtx.fillRect(0, 0, 320, 200)
            })
            hiddenCtx.restore()
        }
    }

    //#endregion

    function onCanvasTapped(x, y) {}

    window.requestAnimationFrame(update)
</script>
