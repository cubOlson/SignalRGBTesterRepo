<script>
  const canvas = document.getElementById('exCanvas');
  const ctx = canvas.getContext('2d');
  // Create a hidden canvas
  const hiddenCanvas = document.createElement('canvas');
  hiddenCanvas.width = 320;
  hiddenCanvas.height = 200;
  // Don't attach to DOM
  const hiddenCtx = hiddenCanvas.getContext('2d');
  var effects = [];
  let HUDValues = []
  let HUDPOS = []
  let gInGame = false

  let InGame1Meter = new Meter(5, inGameHandler)
  let InGame2Meter = new Meter(5, inGameHandler)

  let HPMeter = new Meter(3, inGameHandler)
  let PoisonMeter = new Meter(3, poisonHandler)
  let ElectricMeter = new Meter(1, electricHandler)
  let ManaMeter = new Meter(3, inGameHandler)

  let TopShieldMeter = new Meter(5, shieldHandler)
  let BottomShieldMeter = new Meter(5, shieldHandler)

  let DeadBlackMeter = new Meter(5, deathHandler)
  let DeadRedMeter = new Meter(5, deathHandler)

  let XPMeter = new Meter(5, xpHandler)

  let TeleBlueMeter = new Meter(5, teleportHandler)
  let TeleYellowMeter = new Meter(5, teleportHandler)

  let LoadBlackMeter = new Meter(5, loadingHandler)
  let LoadBrownMeter = new Meter(5, loadingHandler)

  function update() {
    InGame1Meter.setValue(engine.vision.inGame1)
    InGame2Meter.setValue(engine.vision.inGame2)
    HPMeter.setValue(engine.vision.hpRed)
    PoisonMeter.setValue(engine.vision.hpPoison)
    ElectricMeter.setValue(engine.vision.hpElectric)
    ManaMeter.setValue(engine.vision.manaBlue)
    TopShieldMeter.setValue(engine.vision.firstShieldBlue)
    BottomShieldMeter.setValue(engine.vision.lastShieldBlue)
    XPMeter.setValue(engine.vision.xp)
    DeadBlackMeter.setValue(engine.vision.deathBlack)
    DeadRedMeter.setValue(engine.vision.deathRed)
    TeleBlueMeter.setValue(engine.vision.teleportBlue)
    TeleYellowMeter.setValue(engine.vision.teleportYellow)
    LoadBlackMeter.setValue(engine.vision.loadingBlack)
    LoadBrownMeter.setValue(engine.vision.loadingBrown)

    DrawRect(0, 0, 320, 200, "black")
    backgroundHandler()

    if(HUDOn){
      DrawHUD();
    }

    //Effect handler 
    for (let i = 0; i < effects.length; i++) {
      effects[i].draw();
    }
    // Remove dead effects with filter
    effects = effects.filter(ele =>
      ele.lifetime === undefined || ele.lifetime > 0
    );


    ctx.drawImage(hiddenCanvas, 0, 0)

    window.requestAnimationFrame(update);
  }

    let proBack = []
    function onbackColorChanged(){
      proBack = hexToHSL(backColor)
    }

    
    function inGameHandler(){
      if(InGame1Meter.value >= .95 && InGame2Meter.value >= .95 && (HPMeter.value >= .05 || ManaMeter.value >= .05)){
        gInGame = true
      }
      else {
        gInGame = false
      }
      if(gInGame){
        checkHP()
        checkMana()
      }
      
    }

    let loadGoing = false
    function loadingHandler(){
      if(LoadBlackMeter.value >= .95 && LoadBrownMeter.value >= .95 && !gInGame && !loadGoing){
        if(loadOn) effects.push(new loading())
        loadGoing = true
      } else if((LoadBlackMeter.value <= .25 && LoadBrownMeter.value <= .25) || gInGame) loadGoing = false
    }

    let teleportGoing = false
    function teleportHandler(){
      if(TeleBlueMeter.value >= .95 && TeleYellowMeter.value >= .95 && gInGame && !teleportGoing){
        if(portalOn) effects.push(new portal())
        teleportGoing = true
      } else if((TeleBlueMeter.value <= .05 && TeleYellowMeter.value <= .05) || !gInGame) teleportGoing = false
    }

    let deadGoing = false
    function deathHandler(){
      if(DeadBlackMeter.value >= .95 && DeadRedMeter.value >= .1 && gInGame && !deadGoing){
        if(deathOn) effects.push(new death())
        deadGoing = true
      } else if(DeadBlackMeter.value <= .25 && DeadRedMeter.value <= .05) deadGoing = false
    }

    let oldXP = 0
    function xpHandler(){
      if(XPMeter.increased && XPMeter.diff >= .05 && gInGame && xpOn) effects.push(new xpGain())
      if(XPMeter.decreased && gInGame && oldXP > XPMeter.value && xpOn) effects.push(new levelUp())
    }

    function DrawStroke(x, y, radius, color, stroke) {
      hiddenCtx.beginPath();
      hiddenCtx.strokeStyle = color;
      hiddenCtx.lineWidth = stroke;
      hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
      hiddenCtx.stroke();
    };

    let oldShield = 0
    let hasShield = false
    let fullShieldGoing = false
    let damagedShieldGoing = false
    let noShieldGoing = false
    function shieldHandler(){
      if(TopShieldMeter.value >= .95 && gInGame && oldShield < TopShieldMeter.value && !fullShieldGoing){
        if(shieldOn){
          effects.push(new fullShield())
          fullShieldGoing = true
        } 
      } else if (TopShieldMeter.value <= .05 && gInGame){
        fullShieldGoing = false
      } 
      if(TopShieldMeter.value <= .05 && gInGame && BottomShieldMeter.value >= .95 && !damagedShieldGoing){
        if(shieldOn){
          effects.push(new damagedShield())
          damagedShieldGoing = true 
        }
          
      } else if (TopShieldMeter.value >= .95 || BottomShieldMeter.value <= .05){
        damagedShieldGoing = false
      } 
      if(BottomShieldMeter.value <= .05 && hasShield && gInGame && !noShieldGoing){
        if(shieldOn){
          effects.push(new shieldBreak())
          noShieldGoing = true
        } 
      } else if (BottomShieldMeter.value >= .95 && gInGame){
        noShieldGoing = false
        oldShield = TopShieldMeter.value
      } 
      if(TopShieldMeter.value >= .25 || BottomShieldMeter.value >= .25){
        hasShield = true
      } 
      else{
        hasShield = false
      } 
    }

    let oldHealth = 0
    let lowHealthGoing = false
    let fullHealthGoing = false
    function checkHP(){
      if(gInGame && HPMeter.value <= .33 && PoisonMeter.value < .05  && !lowHealthGoing){
        if(hpOn){
          effects.push(new lowResource(0))
          lowHealthGoing = true
        } 
      } else if (HPMeter.value > .33 && gInGame){
          lowHealthGoing = false
      } 
      if(PoisonMeter.value <= .33 && HPMeter.value <= .05 && gInGame && !lowHealthGoing){
        if(hpOn){
          effects.push(new lowResource(0))
          lowHealthGoing = true
        } 
      } else if (((PoisonMeter.value >= .33 && HPMeter.value <= .05) || (PoisonMeter.value <= .05 && HPMeter.value >= .33)) || !gInGame){
          lowHealthGoing = false
      } 
      if(HPMeter.value >= .99 && gInGame && oldHealth < HPMeter.value && !fullHealthGoing){
        if(hpOn){
          effects.push(new fullResource(0))
          fullHealthGoing = true
        } 
      }
      if(HPMeter.value <= .75){
        fullHealthGoing = false
        oldHealth = HPMeter.value
      } 
    }

    let oldMana = 0
    let lowManaGoing = false
    let fullManaGoing = false
    function checkMana(){
      if(ManaMeter.value < .33 && gInGame && !lowManaGoing){
        if(manaOn){
          effects.push(new lowResource(240))
          lowManaGoing = true
        } 
      } else if (ManaMeter.value > .33 || !gInGame){
        lowManaGoing = false
      } 
      if(ManaMeter.value >= .99 && gInGame && oldMana < ManaMeter.value && !fullManaGoing){
        if(manaOn){
          effects.push(new fullResource(240))
          fullManaGoing = true
        } 
      } else if (ManaMeter.value <= .75){
        fullManaGoing = false
        oldMana = ManaMeter.value
      } 
    }

    let electricGoing = false
    function electricHandler(){
      if(ElectricMeter.value >= .15 && gInGame && !electricGoing){
        if(hpOn){
          effects.push(new electrified())
          electricGoing = true
          setTimeout(()=>{
            electricGoing = false
          }, 3000)
        } 
      }
    }

    let poisonGoing = false
    function poisonHandler(){
      if(PoisonMeter.value >= .15 && gInGame && !poisonGoing){
        if(hpOn){
          effects.push(new poisoned())
          poisonGoing = true
        } 
      } else if (PoisonMeter.value <= .05){
        poisonGoing = false
      } 
    }

    let smoothHealth = 0;
    let smoothMana = 0;
    function DrawHUD() {
    if (gInGame) {
      if(PoisonMeter.value >= .05 && HPMeter.value <= .05){
        const smoothFactor = 0.1; 
        smoothHealth += (PoisonMeter.value - smoothHealth) * smoothFactor;
        smoothMana   += (ManaMeter.value   - smoothMana)   * smoothFactor;
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = HealthColor;
        hiddenCtx.fillRect((HealthX * 3.2), (HealthY * 2), (smoothHealth/.71 ) * (HealthWidth * 3.2), (HealthHeight * 2))
        //Mana
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = ManaColor;
        hiddenCtx.fillRect((ManaX * 3.2), (ManaY * 2), (smoothMana/.95) * (ManaWidth * 3.2), (ManaHeight * 2))
      }else{
        const smoothFactor = 0.1; 
        smoothHealth += (HPMeter.value - smoothHealth) * smoothFactor;
        smoothMana   += (ManaMeter.value   - smoothMana)   * smoothFactor;
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = HealthColor;
        hiddenCtx.fillRect((HealthX * 3.2), (HealthY * 2), (smoothHealth/.71 ) * (HealthWidth * 3.2), (HealthHeight * 2))
        //Mana
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = ManaColor;
        hiddenCtx.fillRect((ManaX * 3.2), (ManaY * 2), (smoothMana/.95) * (ManaWidth * 3.2), (ManaHeight * 2))
      }
      
    } else if (adjToggle && !gInGame) {
      hiddenCtx.beginPath()
      hiddenCtx.fillStyle = HealthColor;
      hiddenCtx.fillRect((HealthX * 3.2), (HealthY * 2), (HealthWidth * 3.2), (HealthHeight * 2))
      //Mana
      hiddenCtx.beginPath()
      hiddenCtx.fillStyle = ManaColor;
      hiddenCtx.fillRect((ManaX * 3.2), (ManaY * 2), (ManaWidth * 3.2), (ManaHeight*2))
    }
  }

    let backgroundEaseHue = 0;
    let backgroundEaseLit = 0;
    let backgroundEaseSat = 0
    let gCycle = 0
    function backgroundHandler(){
        switch(backgroundMode){
            case "Color Cycle": 
              DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
              gCycle < 360 ? gCycle += .5 : gCycle = 0
              break;
            case "Color Cycle Ambience": 
              copyScreen(ambienceAlpha / 100)
              gCycle < 360 ? gCycle += .5 : gCycle = 0
              break;
            case "Custom": 
              DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
              break;
            case "Ambience": 
              copyScreen(ambienceAlpha / 100)
              break;
            case "Custom Ambience": 
              copyScreen(ambienceAlpha / 100)
              break;
            case "Ambience Audio Visualizer": 
              copyScreenAudio(ambienceAlpha / 100)
              break;
            case "Custom Audio Visualizer": 
              backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
              backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
              DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
              break;
            case "Color Cycle Audio Visualizer": 
              backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
              backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
              gCycle < 360 ? gCycle += .5 : gCycle = 0
              DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
              break;
        }
    }

    function DrawCircle(x, y, radius, color) {
      hiddenCtx.beginPath();
      hiddenCtx.fillStyle = color;
      hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
      hiddenCtx.fill();
    };

    function DrawRect(x, y, width, height, color) {
      hiddenCtx.beginPath();
      hiddenCtx.fillStyle = color;
      hiddenCtx.fillRect(x, y, width, height);
    };

    function StrokeRect(x, y, width, height, color, stroke){
      hiddenCtx.beginPath();
      hiddenCtx.strokeStyle = color;
      hiddenCtx.lineWidth = stroke
      hiddenCtx.rect(x, y, width, height);
      hiddenCtx.stroke()
    }

    function frozen(){
      this.alpha = 0
      this.count = 0
      this.draw = function(){
        if(!this.count) effects.push(new frozenHelper())
        this.count < 2 ? this.count++ : this.count = 0
        DrawRect(0, 0, 320, 200, `hsla(200, 100%, 50%, ${this.alpha})`)
        this.alpha < .75 ? this.alpha += .05 : this.alpha = .75
      }
    }

    function frozenHelper(){
      this.x = 30 - Math.random() * 60 
      this.y = 30 - Math.random() * 60
      this.count = 1
      this.alpha = 1
      this.draw = function(){
        hiddenCtx.beginPath()
        hiddenCtx.moveTo(160 + this.x, 100 + this.y)
        hiddenCtx.lineTo(160 + this.x * this.count, 100 + this.y * this.count)
        hiddenCtx.lineWidth = 15
        hiddenCtx.strokeStyle = `hsla(190, 100%, 70%, ${this.alpha})`
        hiddenCtx.stroke()
        this.count <= 5.5 ? this.count += .5 : this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
      }
    }

    function poisoned(){
      this.count = 0
      this.draw = function(){
        this.count < 5 ? this.count++ : this.count = 0
        if(!this.count) effects.unshift(new poisonedHelper())
        if(!poisonGoing) this.lifetime = 0
      }
    }

    function poisonedHelper(){
      this.x = Math.random() * 320
      this.y = Math.random() * 200
      this.rad = 1
      this.half = false
      this.lit = 20
      this.draw = function(){
        DrawCircle(this.x, this.y, this.rad, `hsl(100, 100%, ${this.lit}%)`)
        if(!this.half) this.rad < 75 ? this.rad += 3 : this.half = true
        else {
          this.rad >= 2 ? this.rad -= 2 : this.lifetime = 0
          if(this.lit < 95) this.lit+=2
        }
      }
    }

    function electrified(){
      this.alpha = 0
      this.count = 0
      this.effects = []
      this.lifetime = 1
      this.draw = function(){
        let mod = 25 - Math.random() * 50
        this.count < 2 ? this.count++ : this.count = 0
        if(!this.count){
          if(!this.switch) this.effects.unshift(new electricHelper(0, 100 + mod))
          else this.effects.push(new electricHelper(320, 100 + mod))
        this.switch = !this.switch
        }
        hiddenCtx.beginPath()
        hiddenCtx.moveTo(-10, 100)
        this.effects.forEach((ele, i)=>{
          ele.draw()
          hiddenCtx.lineTo(ele.x, ele.y)
        })
        
        this.effects = this.effects.filter(ele => ele.lifetime > 0)

        hiddenCtx.lineTo(330, 100)
        hiddenCtx.lineWidth = 20
        hiddenCtx.strokeStyle = `hsla(190, 100%, 50%, ${this.alpha})`
        hiddenCtx.stroke()
        if(electricGoing) this.alpha <= .95 ? this.alpha += .05 : this.alpha = 1
        else this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
      }
    }

    function electricHelper(x, y){
      this.x = x
      this.y = y
      this.lifetime = 1
      this.mod = 2 - Math.random() * 4
      this.dir = x > 160 ? -1 : 1
      this.draw = function(){
        this.x += 8 * this.dir
        this.y += Math.sin(Date.now() / 500) * this.mod * 2 * this.dir
        if(this.dir < 0 && this.x < 160) this.lifetime = 0
        if(this.dir > 0 && this.x > 160) this.lifetime = 0
      }
    }

    function xpGain(){
      this.alpha = 0
      this.half = false
      this.draw = function(){
        DrawRect(0, 0, 320, 200, `hsla(0, 0%, 100%, ${this.alpha})`)
        if(!this.half) this.alpha <= .25 ? this.alpha += .05 : this.half = true
        else this.alpha >= .01 ? this.alpha -= .01 : this.lifetime = 0
      }
    }

    function fullShield(){
      this.draw = function(){
        let grad = hiddenCtx.createRadialGradient(160, 100, 10, 160, 100, 200)
        grad.addColorStop(.33, 'hsla(190, 100%, 50%, 0)')
        grad.addColorStop(1, `hsla(190, 100%, 50%, ${Math.sin(Date.now() / 1000) * .25 + .75})`)
        DrawRect(0, 0, 320, 200, grad)
        if(!fullShieldGoing) this.lifetime = 0
      }
    }

    function damagedShield(){
      this.draw = function(){
        let grad = hiddenCtx.createRadialGradient(160, 100, 10, 160, 100, 200)
        grad.addColorStop(Math.sin(Date.now() / 500) * .25 + .33, 'hsla(300, 100%, 50%, 0)')
        grad.addColorStop(1, `hsla(210, 100%, 50%, ${Math.sin(Date.now() / 500) * .25 + .75})`)
        DrawRect(0, 0, 320, 200, grad)
        if(!damagedShieldGoing) this.lifetime = 0
      }
    }

    function shieldBreak(){
      this.grad = hiddenCtx.createRadialGradient(160, 100, 10, 160, 100, 200)
      this.grad.addColorStop(.25, 'hsla(0, 100%, 50%, 0)')
      this.grad.addColorStop(1, `hsla(0, 100%, 50%, 1)`)
      this.show = true
      this.count = 0
      this.count2 = 0
      this.draw = function(){
        if(this.show) DrawRect(0, 0, 320, 200, this.grad)
        this.count < 12 ? this.count++ : this.count = 0
        if(!this.count) {
          this.show = !this.show
          this.count2 < 5 ? this.count2++ : this.lifetime = 0
        }
        if(!noShieldGoing) this.lifetime = 0
      }
    }

    function fullResource(hue){
      this.hue = hue
      this.y = 200
      this.alpha = .75
      this.draw = function(){
        DrawRect(0, this.y, 320, 210, `hsla(${this.hue}, 100%, 50%, ${this.alpha})`)
        this.y > 0 ? this.y -= 6 : this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
      }
    }

    let gAlpha = 1
    function lowResource(hue){
      gAlpha = .05
      this.hue = hue
      this.effects = []
      this.count = 0
      this.lifetime = 1
      this.draw = function(){
        if(!this.count) this.effects.push(new lowResourceHelp(this.hue))
        this.count < 5 ? this.count++ : this.count = 0
        this.effects.forEach((ele, i)=>{
          ele.draw()
        })
        
        this.effects = this.effects.filter(ele => ele.lifetime > 0)
        if((!lowHealthGoing && this.hue == 0) || (!lowManaGoing && this.hue == 240) || !gInGame) {
          this.lifetime = 0
          gAlpha = 1
        }
      }
    }

    function lowResourceHelp(hue){
      this.hue = hue
      this.x = Math.random() * 200 + 60
      this.y = -15
      this.lifetime = 1
      this.targetX = this.x
      this.draw = function(){
        DrawCircle(this.x, this.y, 30, `hsla(${this.hue}, 100%, ${Math.cos(this.y / 20) * 10 + 30}%, 1)`)
        this.y < 215 ? this.y += 3 : this.lifetime = 0
        if(Math.random() > .75) this.targetX += (20 - Math.random() * 40)
        this.x += (this.targetX - this.x) / 20
      }
    }

    function death(){
      this.start = Date.now()
      this.lifetime = 10;
      this.radius = 1;
      this.checked = false;
      this.draw = function(){
        var elapsed = Date.now() - this.start;
        var grd = hiddenCtx.createRadialGradient(160, 200, 1, 160, 200, this.radius);
        grd.addColorStop(0, "red");
        grd.addColorStop(1, "rgba(255, 0, 0, .1)");
        DrawCircle(160, 200, 300, grd)
        if(elapsed > 310 - this.radius){
          effects.push(new ghost())
          this.start = Date.now()
        }
        if(!this.checked){
          this.radius < 300 ? this.radius+=5 : this.checked = true;
        } else {
          this.radius > 2 ? this.radius--: null;
        }
        if(!deadGoing) this.lifetime = 0
      }
    }

  function ghost(){
    this.tail = []
    this.x = 160
    this.y = 250;
    this.speed = 5 + Math.random() * 2;
    this.switch = false;
    this.rotate = -2.5 + Math.random() * 2
    this.lifetime = 10;
    this.draw = function(){
      hiddenCtx.save();
      hiddenCtx.translate(160, 250);
      hiddenCtx.rotate(this.rotate)
      hiddenCtx.translate(-160, -250)
      this.tail.forEach((ele, i) => {
        hiddenCtx.globalAlpha = .85 - .15 * i;
        DrawCircle(ele[0], ele[1], 18 - 2 * i, "black");
        hiddenCtx.globalAlpha = 1;
      })
      DrawCircle(this.x, this.y, 20, "black");
      hiddenCtx.restore();
      this.switch ? this.tail.unshift([this.x, this.y]) : this.switch = !this.switch;
      if(this.tail.length > 9){
        this.tail.pop()
      }
      this.x += this.speed;
      this.y += Math.sin(Date.now() / 100) * 5;
      if(this.x > 550) this.lifetime = 0
    }
  }

    function portal(){
    this.start = Date.now();
    this.lifetime = 10;
    this.rotate = 0;
    this.alpha = 0;
    this.count = 0
    var gradient = hiddenCtx.createRadialGradient(160, 100, 1, 160, 100, 200);
    gradient.addColorStop(0, 'rgba(25, 110, 255, 1)');
    gradient.addColorStop(.5, 'rgba(50, 110, 255, .7)');
    gradient.addColorStop(1, 'rgba(150, 150, 255, .05)');
    this.draw = function(){
      this.count < 20 ? this.count++ : this.count = 0
      hiddenCtx.globalAlpha = this.alpha;
      var elapsed = Date.now() - this.start;
      DrawCircle(160, 100, 200, gradient)
      hiddenCtx.save()
      hiddenCtx.translate(160, 100)
      hiddenCtx.rotate(this.rotate)
      hiddenCtx.translate(-160, -100)
      DrawRect(130, 70, 60, 60, 'rgba(100, 200, 255, 1)')
      hiddenCtx.translate(160, 100)
      hiddenCtx.rotate(Math.PI / 4)
      hiddenCtx.translate(-160, -100)
      DrawRect(130, 70, 60, 60, 'rgba(100, 200, 255, 1)')
      DrawRect(140, 80, 40, 40, "blue")
      hiddenCtx.restore()
      var radius = Math.sin(Date.now() / 1000) * 10 + 80;
      DrawStroke(160, 100, radius, 'rgba(100, 200, 255, 1)', 20)
      hiddenCtx.globalAlpha = 1;
      if(teleportGoing) this.alpha < 1 ? this.alpha+=.1 : null;
      else this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
      if(elapsed > 300 && !this.count){
        effects.push(new portalFlash(radius))
      }
      this.rotate+=.01
    }
  }

  function portalFlash(radius){
    this.radius = radius;
    this.lifetime = 10;
    this.draw = function(){
      DrawStroke(160, 100, this.radius, `hsla(200, 100%, 50%, ${Math.sin(this.radius / 10) * .5 + .5})`, 20)
      this.radius < 250 ? this.radius ++ : this.lifetime = 0
    }
  }

    function loading(){
      this.lifetime = 10;
      this.rotate = 0;
      this.draw = function(){
        hiddenCtx.save()
        hiddenCtx.translate(100, 100)
        hiddenCtx.rotate(this.rotate)
        hiddenCtx.translate(-100, -100)
        DrawGear(115, 100, 30, 20, 8, "gold")
        hiddenCtx.restore()
        hiddenCtx.save()
        hiddenCtx.translate(220, 100)
        hiddenCtx.rotate(-this.rotate)
        hiddenCtx.translate(-220, -100)
        DrawGear(205, 100, 30, 20, 8, "gold")
        hiddenCtx.restore()
        this.rotate+=.03
        if(!loadGoing) this.lifetime = 0
      }
    }

  function DrawGear(x, y, radius, stroke, teeth, color){
    DrawStroke(x, y, radius, color, stroke)
    for(let i = 0; i < teeth; i++){
      var ix = Math.cos(Math.PI * 2 / teeth * i) * radius + x;
      var iy = Math.sin(Math.PI * 2 / teeth * i) * radius + y;
      var rotate = Math.atan2(y - iy, x - ix) + Math.PI / 2;
      hiddenCtx.save()
      hiddenCtx.translate(ix, iy)
      hiddenCtx.rotate(rotate)
      hiddenCtx.translate(-ix, -iy)
      DrawRect(ix, iy, Math.PI * radius * 2 / teeth * .75, radius / 3 + stroke / 2, "orange")
      hiddenCtx.restore()
    }
  }

    function levelUp(){
      this.lifetime = 10;
      this.radius = 1;
      this.alpha1 = 1
      this.x = 120
      this.width = 80
      this.draw = function(){
        DrawEllipse(160, 150, this.radius, this.radius / 3, 0, `hsla(60, 100%, 50%, ${this.alpha1})`)
        DrawRect(this.x, 150, this.width, -this.radius * 2, `hsla(60, 100%, 60%, ${this.alpha1})`)
        hiddenCtx.beginPath()
        hiddenCtx.ellipse(160, 150, this.width / 2, this.width / 6, 0, 0, Math.PI)
        hiddenCtx.fillStyle = `hsla(60, 100%, 60%, ${this.alpha1})`
        hiddenCtx.fill()
        this.radius += 10
        this.x -= 1
        this.width += 2
        if(this.radius > 50) this.alpha1 >= .015 ? this.alpha1 -= .015 : this.lifetime = 0
      }
    }

  function Meter(count, callback) {
    this.size = count;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    var values = [];

    this.setValue = function (updatedValue) {
      // Add and shift.
      values.push(updatedValue);
      if (values.length > this.size) {
        values.shift();
      }

      // Exit early if we've got a long-term match.
      for (var i = 0; i < values.length - 1; i++) {
        if (values[i] !== values[i + 1]) return;
      }

      // We got here, so we've got a matching value collection.
      if (this.value !== values[0]) {
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        callback();
      }
    };
  }

  function hexToHSL(hex) {
      var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  
      var r = parseInt(result[1], 16);
      var g = parseInt(result[2], 16);
      var b = parseInt(result[3], 16);
  
      (r /= 255), (g /= 255), (b /= 255);
      var max = Math.max(r, g, b),
        min = Math.min(r, g, b);
      var h,
        s,
        l = (max + min) / 2;
  
      if (max === min) {
        h = s = 0; // achromatic
      } else {
        var d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r:
            h = (g - b) / d + (g < b ? 6 : 0);
            break;
          case g:
            h = (b - r) / d + 2;
            break;
          case b:
            h = (r - g) / d + 4;
            break;
        }
        h /= 6;
      }
  
      s = s * 100;
      s = Math.round(s);
      l = l * 100;
      l = Math.round(l);
      h = Math.round(360 * h);
  
      return [h, s, l];
    }

  let audioScreenSat = 0
    let audioScreenLit = 0
    function copyScreenAudio(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      alpha *= gAlpha
      audioScreenSat += (engine.audio.density * 100 - audioScreenSat) / 10
      audioScreenLit += (engine.audio.density * 100 - audioScreenLit) / 10
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        hiddenCtx.fillStyle = `hsla(${hue[iZone]}, ${sat[iZone] * (audioScreenSat / 200 + .5)}%, ${lightness[iZone] * (audioScreenLit / 100)}%, ${alpha})`;
        hiddenCtx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }
  
    function copyScreen(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      alpha *= gAlpha
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        hiddenCtx.fillStyle = `hsla(${(backgroundMode == "Custom Ambience" ? proBack[0] : hue[iZone] + gCycle * (backgroundMode == "Color Cycle Ambience"))}, ${sat[iZone]}%, ${lightness[iZone]}%, ${alpha})`;
        hiddenCtx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }
   
    window.requestAnimationFrame(update);
