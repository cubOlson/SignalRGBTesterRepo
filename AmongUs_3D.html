<body style="margin: 0; padding: 0; background: #000;">
  <canvas id="exCanvas" width="320" height="200"></canvas>
</body>

<script>
  //Declaring variables
  var canvas, ctx;
  var stateMgr = new StateHandler();
  var effects = [];
  var totalTasksMultiplyValue = 0;
  var taskValue = 0;
  var theHUD = new drawHud()
  //Declaring meters
  var crewmate_Meter = new Meter(10, roleCallback)
  var impostor_Meter = new Meter(10, roleCallback)
  var confirmCrewWhite_Meter = new Meter(10,roleCallback)
  var confirmImpostorRed_Meter = new Meter(10,roleCallback)

  var totalTasks_Meter = new Meter(10, () => "")
  var bodyFoundYellow_Meter = new Meter(20, deadBodyCallback)
  var bodyConfirmWhite_Meter = new Meter(20, deadBodyCallback)

  var votingGrey_Meter = new Meter(20, votingCallback)
  var votingWhite_Meter = new Meter(20, () => "")
  var mapWhite_Meter = new Meter(10, () => "")
  var pWhite_Meter = new Meter(10, () => "")

  var firstTaskGreen_Meter = new Meter(20, () => "")
  var victoryBlue_Meter = new Meter(30, VictoryCallback);
  var defeatRed_Meter = new Meter(30, DefeatCallback);
 
  var meetingBlue_Meter = new Meter(10,meetingCallback);
  var meetingWhite_Meter = new Meter(10,meetingCallback);
  
  var mainMenuMeter = new Meter(10, MenuCallback)
  var mapBlueMeter = new Meter(10, MapCallback)
  var mapRedMeter = new Meter(10, MapCallback)
  var impostorRed_Meter = new Meter(20,KillCallback)
  var vigilanteBlue_Meter = new Meter(20,KillCallback)
  var killDarkGrey_Meter = new Meter(20,KillCallback)
  var killNotDarkGrey_Meter = new Meter(20,KillCallback)
  var killWhite_Meter = new Meter(20,KillCallback)
  var deadRedMeter = new Meter(30, GetKillCallback)
  var deadPink_Meter = new Meter(30,GetKillCallback)
  var ventRed_Meter = new Meter(10,VentCallback);
  var ventNotRed_Meter = new Meter(10,VentCallback)
  let counter = 0;

  function update() {
    DrawRect(0, 0, 320, 200, "black")
    //Updating meters
    counter += 0.05;

    crewmate_Meter.setValue(engine.vision.crewmate);
    impostor_Meter.setValue(engine.vision.impostor)
    confirmCrewWhite_Meter.setValue(engine.vision.confirmCrewWhite)
    confirmImpostorRed_Meter.setValue(engine.vision.confirmImpostorRed)
    totalTasks_Meter.setValue(engine.vision.totalTasks)
    bodyFoundYellow_Meter.setValue(engine.vision.bodyFoundYellow)
    bodyConfirmWhite_Meter.setValue(engine.vision.bodyConfirmWhite)

    votingGrey_Meter.setValue(engine.vision.votingGrey)
    votingWhite_Meter.setValue(engine.vision.votingWhite)
    mapWhite_Meter.setValue(engine.vision.mapWhite)
    pWhite_Meter.setValue(engine.vision.pWhite)

    meetingBlue_Meter.setValue(engine.vision.meetingBlue)
    meetingWhite_Meter.setValue(engine.vision.meetingWhite)
 
    firstTaskGreen_Meter.setValue(engine.vision.firstTaskGreen)
    victoryBlue_Meter.setValue(engine.vision.victoryBlue);
    defeatRed_Meter.setValue(engine.vision.defeatRed);
    impostorRed_Meter.setValue(engine.vision.impostorRed);
    vigilanteBlue_Meter.setValue(engine.vision.vigilanteBlue)
    mainMenuMeter.setValue(engine.vision.mainMenuBlue);
    mapBlueMeter.setValue(engine.vision.mapBlue);
    mapRedMeter.setValue(engine.vision.mapRed);
    killDarkGrey_Meter.setValue(engine.vision.killDarkGrey)
    killNotDarkGrey_Meter.setValue(engine.vision.killNotDarkGrey)
    killWhite_Meter.setValue(engine.vision.killWhite)
    deadRedMeter.setValue(engine.vision.deadRed)
    deadPink_Meter.setValue(engine.vision.deadPink)
    ventRed_Meter.setValue(engine.vision.ventRed)
    ventNotRed_Meter.setValue(engine.vision.ventNotRed)


    //Effect handler 
    IdleState();
    if(taskbarOn) theHUD.draw();
    for (let i = 0; i < effects.length; i++) {
      effects[i].draw();
      if (effects[i].lifetime <= 0) {
        effects.splice(i, 1);
      }
    }
    stateMgr.Process();

    window.requestAnimationFrame(update);
  }


  function drawHud() {
    this.width = 0;
    this.alpha = .75;
    this.old = 0;
    this.draw = function(){
      if (pWhite_Meter.value >= .95 || adjToggle) {
        ctx.beginPath();
        ctx.fillStyle = taskColor;
        this.width = adjToggle ? TaskBarWidth * 3.2 : firstTaskGreen_Meter.value <= 0  ? 0 : (1 - totalTasks_Meter.value) * 320
        if(this.width != this.old){
          this.old = this.width
          this.alpha = .75
        }
        ctx.fillRect(TaskBarX * 3.2, TaskBarY * 2, this.width, TaskBarHeight * 2)
        ctx.globalAlpha = this.alpha
        DrawRect(TaskBarX * 3.2, TaskBarY * 2, this.width, TaskBarHeight * 2, "white")
        ctx.globalAlpha = 1;
        this.alpha > .05 ? this.alpha -= .05 : this.alpha = 0;
      }
    }
  }

  function DrawRect(x, y, width, height, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
  };

  //Callbacks 
  function meetingCallback() {
    if (meetingWhite_Meter.value >= .95 && meetingBlue_Meter.value >= .95  && !meetingPushed) {
      meetingPushed = true
        effects.push(new emergencyMeeting())
        setTimeout(()=>{
          voteGoing = true;
          effects.push(new voting())
        },10000)
    }
  }

  function deadBodyCallback(){
     if(bodyConfirmWhite_Meter.value >= .95 && bodyFoundYellow_Meter.value >= .95 && !meetingPushed){
        meetingPushed = true
        effects.push(new deadBodyEffect(`hsla(${engine.vision.bodyFoundColor[0]},${engine.vision.bodyFoundColor[1]}%,50%)`))
        setTimeout(()=>{
          voteGoing = true;
          effects.push(new voting())
        }, 15000)
     }
  }

  var isCrew = false;
  function roleCallback() {
      if (crewmate_Meter.value >= .95 && confirmCrewWhite_Meter.value >=.05 && typeOn) {
        isCrew = true;
        effects.push(new pulseEffect("cyan", 1000))
      }
      else if (impostor_Meter.value >= .95 && confirmImpostorRed_Meter.value >=.05 && typeOn) {
        isCrew = false;
        effects.push(new pulseEffect("red",1000))
      }
  }

  function VictoryCallback() {
    if (victoryBlue_Meter.value >= .2 && engine.vision.victoryDefeatWhite >= .04  && vdOn) {
      effects.push(new VDEffect("cyan"))
    }
  }

  function DefeatCallback() {
    if (defeatRed_Meter.value >= .2 && engine.vision.victoryDefeatWhite >= .04  && vdOn) {
      effects.push(new VDEffect("red"))
    }
  }

  function GetKillCallback() { 
    if (deadRedMeter.value >= .95 && deadPink_Meter.value >= .95 && killOn) {
      effects.push(new GettingKilledEffect("get"))
    }
  }

  var voteGoing = false;
  function votingCallback() {
    if ((votingGrey_Meter.value < .1 && votingWhite_Meter.value <.1)|| !meetingOn){
      voteGoing = false;
    }
  }

  function KillCallback() {
    if(impostorRed_Meter.value >= .95){
      if(killWhite_Meter.value >=.95 && killDarkGrey_Meter.value >=.95 && killNotDarkGrey_Meter.value < .1 && killOn) {
        effects.push(new GettingKilledEffect("do"))
      }
    }  
  } 

  var menuPushed = false;
  function MenuCallback(){
    if(mainMenuMeter.value >= .95 && pWhite_Meter.value < .1 && !menuPushed && mainOn){
      menuPushed = true;
      effects.push(new menuEffect())
    }
  }

  var mapGoing = false;
  function MapCallback(){
    if((mapBlueMeter.value >= .95 || mapRedMeter.value >= .95) && mapWhite_Meter.value < .1 && !mapGoing && mapOn){
      mapGoing = true;
      effects.push(new mapRow())
    } else if ((mapBlueMeter.value < .1 || mapRedMeter.value <.1) && mapWhite_Meter.value >.95 && mapGoing){
        mapGoing = false;
    } 
  }

  var ventGoing = false;
  function VentCallback(){
      if(ventRed_Meter.value >= .95 && ventNotRed_Meter.value <.1 && !ventGoing){
        ventGoing = true
        effects.push(new ventGridEffect());
      }
  }

  function ventGridEffect() {
      this.y = -200;               
      this.speed = 4;               
      this.alpha = 0;               
      this.done = false;
      this.lifetime = 999999;       

      this.draw = function() {
          ctx.globalAlpha = this.alpha;
          DrawRect(0, 0, 320, 200, "black");
          ctx.globalAlpha = 1;
          ctx.fillStyle = "rgba(255,255,255,0.5)";

          let barHeight = 40;
          let gap = 10;
          for (let i = 0; i < 4; i++) {
              let lineY = this.y + i * (barHeight + gap);
              if (lineY + barHeight >= 0 && lineY <= 200) {
                  ctx.fillRect(0, lineY, 320, barHeight);
              }
          }
          let targetY = 0;
          if (!this.done && this.y < targetY) {
              this.y += this.speed;
              if (this.y > targetY) this.y = targetY;
          }
          if (!this.done) {
              if (this.alpha < 0.7) {
                  this.alpha += 0.03;
              } else {
                  this.alpha = 0.7;
              }
          } else {
              if (this.alpha > 0) {
                  this.alpha -= 0.05;
              } else {
                  this.alpha = 0;
                  this.lifetime = 0;
              }
          }
          if (ventRed_Meter.value <.1 && votingWhite_Meter.value <.1){
              ventGoing = false
              this.done = true;
          }
      }
  }
 
  var deadGoing = false;
  function dead(){
    this.boi = new deadBoi(50, `hsl(${Math.random() * 360}, 100%, 50%)`, "left")
    this.alpha = 0;
    this.done = false;
    this.draw = function(){
      DrawRect(0, 0, 320, 200, "hsla(0, 0%, 0%, 1)")
      ctx.globalAlpha = this.alpha;
      DrawRect(0, 0, 320, 200, "grey")
      ctx.globalAlpha = this.alpha * 3 / 4;
      this.boi.draw()
      ctx.globalAlpha = 1;
      if(!this.done){
        this.alpha <= .55 ? this.alpha+=.05 : this.alpha = .6;
      } else {
        this.alpha >= .05 ? this.alpha-=.05 : this.lifetime = 0;
      }
      if(pWhite_Meter.value >.95 || engine.vision.victoryDefeatWhite >= .1){
          this.done = true;
          deadGoing = false;
      } 
    }
  }

  function deadBoi(scale, color, direction){
    this.rotate = Math.random() * 5;
    this.x = 160;
    this.y = 100;
    this.color = color;
    this.scale = scale;
    this.direction = direction;
    this.lifetime = 10;
    this.draw = function(){
      DrawCharacter(this.x, this.y, this.scale, this.color, this.direction, this.rotate)
      this.rotate+=.01
      this.alpha <= .95 ? this.alpha+=.05 : this.alpha = 1;
    }
  }

  function menuEffect(){
    this.stars = []
    this.effects = []
    this.start = Date.now()
    this.lifetime = 10;
    this.done = false;
    this.alpha = 1;
    this.draw = function(){
      var elapsed = Date.now() - this.start
      if(elapsed > 2000){
        this.effects.push(new menuBoi(Math.random() * 320, Math.random() * 200, Math.random() * 20 + 10, `hsl(${Math.random() * 360}, 90%, 50%)`, Date.now() % 2 == 0 ? "right" : "left"))
        this.start = Date.now()
      }
      ctx.globalAlpha = this.alpha;
      DrawRect(0, 0, 320, 200, "black")
      this.effects.forEach((ele, i) => {
        ele.draw()
        if(ele.lifetime <= 0){
          this.effects.splice(i, 1)
        }
      })
      if(this.stars.length < 50 && Date.now() % 4 == 0) this.stars.push(new menuStar())
      this.stars.forEach((ele, i) => {
        ele.draw()
        if(ele.lifetime <= 0){
          this.stars.splice(i, 1)
        }
      })
      ctx.globalAlpha = 1;
      if(this.done){
        if(this.alpha >= .05){
          this.alpha-=.05
          if(this.alpha < .05){
            this.lifetime = 0;
            menuPushed = false;
          }
        }
      }
      if(mainMenuMeter.value < .1 && pWhite_Meter.value >= .95) {
        this.done = true;
      }
    }
  }

  function menuStar(){
    this.x = Math.random() * 300 - 20;
    this.speed = Math.random() * .5 + .1;
    this.y = Math.random() * 200 - 10;
    this.lifetime = 10;
    this.alpha = 0;
    this.draw = function(){
      ctx.globalAlpha = this.alpha
      DrawCircle(this.x, this.y, 5, "grey")
      this.x < 340 ? this.x+=this.speed : this.lifetime = 0;
      this.y+=.01
      ctx.globalAlpha = 1;
      this.alpha <= .95 ? this.alpha+=.05 : this.alpha = 1;
    }
  }
  
  function menuBoi(x, y, scale, color, direction){
    this.rotate = 0;
    this.rv = .15 - Math.random() * .3
    this.xv = 1 - Math.random() * 2
    this.yv = 1 - Math.random() * 2
    this.x = x;
    this.y = y;
    this.color = color;
    this.scale = scale;
    this.direction = direction;
    this.lifetime = 10;
    this.alpha = 0;
    this.draw = function(){
      ctx.globalAlpha = this.alpha
      DrawCharacter(this.x, this.y, this.scale, this.color, this.direction, this.rotate)
      this.rotate+=this.rv;
      this.x+=this.xv;
      this.y+=this.yv;
      if(this.x > 350 || this.x < -30 || this.y > 230 || this.y < -30) this.lifetime = 0;
      ctx.globalAlpha = 1;
      this.alpha <= .95 ? this.alpha+=.05 : this.alpha = 1;
    }
  }


  function pulseEffect(color, speed){
    this.alpha = 0;
    this.start = Date.now();
    this.draw = function (){
      this.elapsed = Date.now() - this.start;
      ctx.beginPath();
      this.alpha = Math.sin(this.elapsed / speed);
      ctx.globalAlpha = this.alpha;
      ctx.fillStyle = color;
      ctx.fillRect(0,0,320,200);
      if(this.alpha <0 ){
        this.lifetime = 0;
      }
    }
  }


  function deadBodyEffect(color) {
    this.bloodSplatter = [];
    this.firstPoint = ({ x: 160, y: 100 })
    this.globalX = 80;
    this.start = Date.now();
    this.elapsed = 0;
    this.secondElapsed = 0;
    this.draw = function () {
      this.elapsed = Date.now() - this.start;

      if (200 - (this.elapsed - 7000) / 15 < 0) {
        let gradient = ctx.createRadialGradient(160, 100, 0, 160, 100, 200)
        this.calculateVal = -1440 * Math.floor((-(this.elapsed - 200) / 1440) / 1) + ((-(this.elapsed + 100) / 1440) * (1440 / 1));
        gradient.addColorStop(SetRange((-0 + (this.calculateVal)), 0, 1000) / 1000, "hsla(0, 0%, 0%,0)");
        gradient.addColorStop(SetRange((-200 + (this.calculateVal)), 0, 1000) / 1000, "red");
        ctx.beginPath();
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 320, 200)
        if (this.elapsed > 11400) {
          this.lifetime = 0;
        }
      } else {
        if (this.elapsed < 1300) {
          let gradient = ctx.createRadialGradient(160, 100, 0, 160, 100, 200)
          this.calculateVal = -1440 * Math.floor((-(this.elapsed - 200) / 1440) / 1) + ((-(this.elapsed + 100) / 1440) * (1440 / 1));
          gradient.addColorStop(SetRange((-0 + (this.calculateVal)), 0, 1000) / 1000, color);
          gradient.addColorStop(SetRange((-200 + (this.calculateVal)), 0, 1000) / 1000, "hsla(0, 0%, 0%,0)");
          ctx.beginPath();
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, 320, 200)
        } else {
          ctx.beginPath()
          ctx.fillStyle = "black"
          ctx.fillRect(0, 0, 320, 200);
          DrawCharacter(160, 120, SetRange(1300 - ((this.elapsed - 1400)), 35, 1300), color, "left", 90 * (Math.PI / 180));
          if (this.elapsed > 3000) {
            if (Math.random() > 0.9) {
              this.bloodSplatter.push(new bloodSplatter([{ x: this.firstPoint.x, y: this.firstPoint.y }, { x: this.globalX + 100 + Math.random() * 20, y: 0 + Math.random() * 20 }, { x: this.globalX + 200, y: 50 }, { x: this.globalX + 200 + Math.random() * 40, y: 200 + Math.random() * 40 }], 5, 20, 15, "red"))
            }
            if (Math.random() > 0.9) {
              this.bloodSplatter.push(new bloodSplatter([{ x: this.firstPoint.x, y: this.firstPoint.y }, { x: this.firstPoint.x - 40 + Math.random() * 20, y: 0 + Math.random() * 20 }, { x: this.globalX - 20, y: 50 }, { x: this.globalX - 20 + Math.random() * 40, y: 200 + Math.random() * 40 }], 5, 20, 15, "red"))
            }
          }
          if (this.elapsed > 6000) {
            if (Math.random() > 0.8) {
              this.bloodSplatter.push(new bloodSplatter([{ x: Math.random() * 320, y: -50 }, { x: Math.random() * 320, y: 50 }, { x: Math.random() * 320, y: 100 }, { x: Math.random() * 320, y: 200 }], 25, 20, 5, "red"))
            }
            ctx.beginPath();
            ctx.fillStyle = "red";
            if((220 - (this.elapsed - 7000) / 15) < 5) {
              this.lifetime = 0;
              this.bloodSplatter = []
              meetingPushed = false;
            }
            ctx.fillRect(0, 220 - (this.elapsed - 7000) / 15, 320, 200)
          }
          this.bloodSplatter.forEach(element => {
            element.draw();
            if (element.lifetime <= 0) {
              this.bloodSplatter.splice(this.bloodSplatter.indexOf(element), 1)
            }
          });
        }
      }
    }
  }

  function mapRow(){
    this.effects = []
    this.alpha = 0;
    this.lifetime = 10;
    this.done = false;
    for(let i = 0; i < 20; i++){
      let loopX = (i % 5) * 60 + 15
      let loopY = Math.floor(i / 5) * 60 + 15
      this.effects.push(new mapSquare(loopX, loopY, 50, Math.random() < .05 ? `hsla(0, 0%, 100%, ${this.alpha})` : `hsla(240, 0%, 100%, ${this.alpha})`))
    }
    this.draw = function(){
      DrawRect(0, 0, 320, 200, "black")
      this.effects.forEach((ele, i) => {
        ele.draw()
        if(ele.lifetime <= 0){
          this.effects.push(new mapSquare(ele.x, -45, ele.size, Math.random() < .05 ? `hsla(0, 0%, 100%, ${this.alpha})` : `hsla(240, 0%, 100%, ${this.alpha})`))
          this.effects.splice(i, 1)
        }
      })
      if(!this.done){
        this.alpha <= .45 ? this.alpha += .05 : this.alpha = .5;
      } else {
        this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0;
      }
      if(!mapGoing) this.done = true;
    }
  }

  function mapSquare(x, y, size, color){
    this.x = x;
    this.y = y;
    this.size = size;
    this.color = color;
    this.lifetime = 10;
    this.vy = Math.random() * 2 + .5
    this.draw = function(){
      DrawRect(this.x, this.y, this.size, this.size, this.color)
      this.y+=this.vy
      if(this.y > 200) this.lifetime = 0;
    }
  }

  function voting(){
    this.start = Date.now()
    this.effects = []
    this.num = true;
    this.lifetime = 10;
    this.count = 0;
    this.draw = function(){
      var elapsed = Date.now() - this.start;
      DrawRect(0, 0, 320, 200, "hsla(0, 0%, 0%, 1)")
      if(elapsed > 1000){
        this.start = Date.now()
        this.effects.push(new votingHelper(this.num))
        this.count++
        if(this.num == 0){
          this.num = !this.num;
          this.count = 0;
        }
        if(this.count == 2){
          this.num = !this.num;
          this.count = 0;
        }
      }
      this.effects.forEach((ele, i) => {
        ele.draw()
        if(ele.lifetime <= 0){
          this.effects.splice(i, 1)
        }
      })
      if (votingGrey_Meter.value <.1 && votingWhite_Meter.value <.1){
        voteGoing = false;
        this.lifetime = 0;
        if(meetingOn){
          deadGoing = true
          effects.push(new dead())
        } 
      }
    }
  }

  function votingHelper(dir){
    this.x = dir ? 10 : 310;
    this.y = 170;
    this.hue = Math.random() * 360
    this.target = 150;
    this.width = dir ? 200 : -200;
    this.offset = dir ? 30 : -30;
    this.lifetime = 10;
    this.start = Date.now()
    this.draw = function(){
      var elapsed = Date.now() - this.start;
      if(elapsed > 1000){
        this.target = this.y - 31;
        this.start = Date.now()
      }
      if(this.target != this.y){
        this.y -= (this.y - this.target) / 2
        if(this.y < this.target) this.y = this.target
      }
      DrawRect(this.x, this.y, this.width, 30, "hsl(0, 0%, 90%)")
      DrawCircle(this.x + this.offset, this.y + 15, 14, `hsl(${this.hue}, 75%, 50%)`)
      if(this.y < -20) this.lifetime = 0;
    }
  }

  var meetingPushed = false;
  function emergencyMeeting(){
    this.start = Date.now()
    this.radius = 1;
    this.radius2 = 40;
    this.stroke = 55;
    this.lit = 50;
    this.lifetime = 10;
    this.draw = function(){
      var elapsed = Date.now() - this.start
      if(elapsed < 900){
        DrawCircle(160, 100, this.radius, `hsl(0, 100%, ${this.lit}%)`)
        DrawStroke(160, 100, this.radius, `white`, 10)
        this.radius < 70 ? this.radius+=5 : this.lit+=.5;
      } else if (elapsed < 1800){
        this.lit = 50;
        DrawStroke(160, 100, this.radius2, "red", this.stroke)
        this.radius2+=5;
        this.stroke--;
      } else {
        this.lifetime = 0;
        meetingPushed = false;
      }
    }
  }

  function DrawStroke(x, y, radius, color, stroke) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = stroke;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.stroke();
  };

  function VDEffect(color){
  this.x = 0;
  this.color = color;
  this.lifetime = 10;
  this.effects = []
  this.draw = function(){
    if(this.x % 5 == 0 && this.x <= 160) this.effects.push(new VDHelper(this.x, this.color))
    this.effects.forEach((ele, i) => {
      ele.draw()
      if(ele.lifetime <= 0){
        this.effects.splice(i, 1)
      }
    })
    this.x++
    if(this.effects.length == 0){
      this.lifetime = 0;
      if(mainOn) effects.push(new menuEffect())
    } 
  }
 }

 function VDHelper(offset, color){
  this.x = offset;
  this.alpha = 1;
  this.radius = 1;
  this.lifetime = 10;
  this.color = color;
  this.draw = function(){
    ctx.globalAlpha = this.alpha;
    DrawCircle(160 + this.x, 100, this.radius, this.color)
    DrawCircle(160 - this.x, 100, this.radius, this.color)
    ctx.globalAlpha = 1;
    this.alpha > .01 ? this.alpha-=.01 : this.lifetime = 0;
    this.radius++
  }
 }


  function GettingKilledEffect(murder) {
    this.bloodSplatter = [];
    this.start = Date.now();
    this.elapsed = 0;
    this.globalX = 80;
    this.curve = [{ x: this.globalX, y: 100 }, { x: this.globalX, y: 140 }, { x: this.globalX + 200, y: 50 }, { x: this.globalX, y: 100 }];
    this.rotation = 0;
    this.firstPoint = ({ x: this.globalX + 80, y: 100 })
    this.murder = murder;

    let percentage = 0;
    this.draw = function () {
      this.elapsed = Date.now() - this.start;
      if (this.elapsed < 1400) {
        let gradient = ctx.createRadialGradient(160, 100, 0, 160, 100, 200)
        this.calculateVal = -1660 * Math.floor((this.elapsed / 1660) / 1) + ((this.elapsed / 1660) * (1660 / 1));
        gradient.addColorStop(SetRange((-0 + (this.calculateVal)), 0, 1000) / 1000, "hsla(0, 0%, 0%,0)");
        gradient.addColorStop(SetRange((-200 + (this.calculateVal)), 0, 1000) / 1000, "hsla(0, 100%, 50%,1)");
        gradient.addColorStop(SetRange((-400 + (this.calculateVal)), 0, 1000) / 1000, "hsla(0, 0%, 0%,1)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 320, 200);
      }
      if (this.elapsed > 1400) {
        ctx.globalAlpha = SetRange(percentage < 3 ? 1 : 4 - percentage, 0, 1);
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, 320, 200);
      }
      if (this.elapsed > 1800) {
        percentage += 0.01;
      }
      ctx.beginPath();

      DrawCharacter(this.firstPoint.x, this.firstPoint.y, 30, this.murder == "do" ? "red" : "green", "left", this.rotation)
      DrawCharacter(this.globalX, 100, 30, this.murder == "do" ? "green" : "red", "right", 0)
      if (percentage > 0 && percentage < 1) {
        ctx.beginPath();
        let point = getCubicBezierXYatPercent(this.curve[0], this.curve[1], this.curve[2], this.curve[3], percentage);
        ctx.arc(point.x, point.y, 10, 0, Math.PI * 2);
        ctx.fillStyle = this.murder == "do" ? "green" : "red"
        ctx.fill();
      }
      if (percentage > 0.6 && percentage < 0.95) {
        this.rotation += 0.044
        if (percentage < 0.75) {
          this.firstPoint.y -= 1;
        } else {
          this.firstPoint.y += 1.5;
        }
        this.firstPoint.x += 1;
      }
      if (percentage > 0.6) {
        if (Math.random() > 0.9) {
          this.bloodSplatter.push(new bloodSplatter([{ x: this.firstPoint.x, y: this.firstPoint.y }, { x: this.globalX + 100 + Math.random() * 20, y: 0 + Math.random() * 20 }, { x: this.globalX + 200, y: 50 }, { x: this.globalX + 200 + Math.random() * 40, y: 200 + Math.random() * 40 }], 5, 20, 15, "red"))
        }
        if (Math.random() > 0.9) {
          this.bloodSplatter.push(new bloodSplatter([{ x: this.firstPoint.x, y: this.firstPoint.y }, { x: this.firstPoint.x - 20 + Math.random() * 20, y: 0 + Math.random() * 20 }, { x: this.globalX + 50, y: 50 }, { x: this.globalX + 40 + Math.random() * 40, y: 200 + Math.random() * 40 }], 5, 20, 15, "red"))
        }
      }
      this.bloodSplatter.forEach(element => {
        element.draw();
        if (element.lifetime <= 0) {
          this.bloodSplatter.splice(this.bloodSplatter.indexOf(element), 1)
        }
      });
      if (percentage > 4) {
        this.lifetime = 0;
      }
      ctx.globalAlpha = 1;
    }
  }

  function bloodSplatter(curve, width, size, speed, color) {
    this.curve = curve;
    this.percentage = 0;
    this.width = width;
    this.size = size;
    this.color = color;
    this.speed = speed;

    this.draw = function () {
      this.percentage += this.speed / 1000;
      ctx.beginPath();
      ctx.fillStyle = this.color;
      let point = getCubicBezierXYatPercent(this.curve[0], this.curve[1], this.curve[2], this.curve[3], this.percentage)
      ctx.moveTo(point.x, point.y);
      for (let index = 0; index < this.size; index++) {
        let point2 = getCubicBezierXYatPercent(this.curve[0], this.curve[1], this.curve[2], this.curve[3], this.percentage + index / 100);
        ctx.lineTo(point2.x, point2.y);
      }

      ctx.strokeStyle = color;
      ctx.lineWidth = this.width;
      ctx.stroke()

      if (this.percentage > 1.2) {
        this.lifetime = 0;
      }
    }
  }

  function DrawCharacter(x, y, size, color, direction, rotation) {
    ctx.save();
    ctx.translate(x, y)
    ctx.rotate(rotation);
    ctx.beginPath();
    ctx.ellipse(0, 0 - size / 3, size / 1.5, size / 1.1, 0, 0, 2 * Math.PI)
    let moddedSize = 1.32;
    ctx.rect(0 - (size * moddedSize / 2), 0 - size / 2, size * moddedSize, size * 1.1)
    ctx.rect(0 - (size * moddedSize / 2), 0 + size / 2, size / 2, size / 1.5)
    ctx.rect(0 + size / 6, 0 + size / 2, size / 2, size / 1.5)
    ctx.fillStyle = color;
    ctx.strokeStyle = "black";
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(direction == "right" ? 0 + size / 2.5 : 0 - size / 2.5, 0 - size / 2.5, size / 2, size / 3, 0, 0, 2 * Math.PI)
    ctx.fillStyle = "#476270";
    ctx.fill();
    ctx.beginPath();
    ctx.fillStyle = "#8ec6d5"
    ctx.ellipse(direction == "right" ? 0 + size / 2 : 0 - size / 2, 0 - size / 2, size / 3, size / 5, 0, 0, 2 * Math.PI)
    ctx.fill();
    ctx.restore();
  }

  function getCubicBezierXYatPercent(startPt, controlPt1, controlPt2, endPt, percent) {
    var x = CubicN(percent, startPt.x, controlPt1.x, controlPt2.x, endPt.x);
    var y = CubicN(percent, startPt.y, controlPt1.y, controlPt2.y, endPt.y);

    return ({ x: x, y: y });
  }

  function CubicN(pct, a, b, c, d) {
    var t2 = pct * pct;
    var t3 = t2 * pct;
    return a + (-a * 3 + pct * (3 * a - a * pct)) * pct
      + (3 * b + pct * (-6 * b + b * 3 * pct)) * pct
      + (c * 3 - c * 3 * pct) * t2
      + d * t3;
  }

  function IdleState() {
    let lightness = new Int8Array(engine.zone.lightness);
    let sat = new Int8Array(engine.zone.saturation);
    let hue = new Int16Array(engine.zone.hue);

    for (var iZone = 0; iZone < 560; iZone++) {
      ctx.fillStyle = 'hsl(' + hue[iZone] + ',' + sat[iZone] + '%,' + lightness[iZone] * keyScreenBrightness / 100 + '%)'

      var iRow = Math.floor(iZone / 28);
      var iCol = iZone % 28;
      var iWidth = 320 / 28;
      var iHeight = 200 / 20;
      var iZx = iCol * iWidth;
      var iZy = iRow * iHeight;

      ctx.fillRect(iZx, iZy, iWidth, iHeight);

    }
  }

  function SetRange(num, min, max) {
    return Math.min(Math.max(num, min), max)
  }

  //helper functions
  function GetTime() {
    return new Date().getTime();
  }

  function DrawCircle(x, y, radius, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.fill();
  };







  function StateHandler() {
    var stack = [];
    var state = null;

    var updateState = function () {
      if (stack.length > 0) {
        state = stack[stack.length - 1];
      } else {
        state = null;
      }
    }

    this.Push = function (newState) {
      stack.push(newState);
      updateState();
    }

    this.Pop = function () {
      stack.pop();
      updateState();
    }

    this.Process = function () {
      if (state != null) {
        state.Process();
      }
    }
  }



  function Meter(count, callback) {
    this.size = count;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    var values = [];

    this.setValue = function (updatedValue) {
      // Add and shift.  
      values.push(updatedValue);
      if (values.length > this.size) { values.shift(); }

      // Exit early if we've got a long-term match.
      for (var i = 0; i < (values.length - 1); i++) {
        if (values[i] !== values[i + 1]) return;
      }

      // We got here, so we've got a matching value collection.
      if (this.value !== values[0]) {
        //var fromZero = this.value === 0;
        //var toZero = values[0] === 0;      
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        callback();
      }
    }
  }

  function onEngineReady() {
    // Grab canvas and rendering context.
    canvas = document.getElementById('exCanvas');
    ctx = canvas.getContext('2d');
    // Start updates *after* our engine is accessible and ready.
    window.requestAnimationFrame(update);
  }
  onEngineReady()

</script>
