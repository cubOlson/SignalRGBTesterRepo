<script>
    // Canvas initialization
    const canvas = document.getElementById('exCanvas');
    const ctx = canvas.getContext('2d');
    const width = 320;
    const height = 200;
    let effects = [];
    let gSensor = 0;
    let gAlpha = 1

    var gInGame = false;
    var lowHealthGoing = false;
    var restGoing = false
    var dialogueGoing = false;
    var bossGoing = false;

    var inGameBrownMeter = new Meter(5, inGameCallback);
    var inGameWhiteMeter = new Meter(5, inGameCallback);
    var silkWhiteMeter = new Meter(10, () => "");
    var healthWhiteMeter =  new Meter(10, healthCallback);
    var ultWhiteMeter = new Meter(5,ultCallback);
    var bossWhiteMeter = new Meter(20, bossCallback);
    var itemsWhiteMeter = new Meter(8,itemsCallback);
    var rest1WhiteMeter = new Meter(5,restCallback);
    var rest2WhiteMeter = new Meter(5,restCallback);
    var itemColorMeter = new Meter(5,itemsCallback)
    var dialogueTopWHiteMeter = new Meter(10, dialogueCallback);
    var dialogueBottowWHiteMeter = new Meter(10, dialogueCallback);



    //#region Update
    function update() {
      inGameBrownMeter.setValue(engine.vision.inGameBrown)
      inGameWhiteMeter.setValue(engine.vision.inGameWhite)
      silkWhiteMeter.setValue(engine.vision.silkWhite) 
      healthWhiteMeter.setValue(engine.vision.healthWhite) 
      ultWhiteMeter.setValue(engine.vision.ultWhite) 
      bossWhiteMeter.setValue(engine.vision.bossWhite) 
      itemsWhiteMeter.setValue(engine.vision.itemsWhite) 
      rest1WhiteMeter.setValue(engine.vision.rest1White) 
      rest2WhiteMeter.setValue(engine.vision.rest2White)
      itemColorMeter.setValue(engine.vision.itemColor[0])
      dialogueTopWHiteMeter.setValue(engine.vision.dialogueTopWHite)
      dialogueBottowWHiteMeter.setValue(engine.vision.dialogueBottowWHite)

      DrawRect(0, 0, 320, 200, "black")
      backgroundHandler()
      DrawHUD();
  
      



      effects.forEach((ele, i) => {
        ele.draw()
        if(ele.lifetime <= 0){
          effects.splice(i, 1)
        }
      })

      window.requestAnimationFrame(update);
    };
    //#endregion
    //#region Background Modes
    // Background Configuration
    let proBack = []
    function onbackColorChanged(){
      proBack = hexToHSL(backColor)
    }

    let backgroundEaseHue = 0;
    let backgroundEaseLit = 0;
    let backgroundEaseSat = 0
    let gCycle = 0
    function backgroundHandler(){
        switch(backgroundMode){
            case "Color Cycle": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Color Cycle Ambience": 
            copyScreen(ambienceAlpha / 100)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Custom": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            break;
            case "Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Custom Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Ambience Audio Visualizer": 
            copyScreenAudio(ambienceAlpha / 100)
            break;
            case "Custom Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
            case "Color Cycle Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
        }
    }
    function copyScreen(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        ctx.fillStyle = `hsla(${(backgroundMode == "Custom Ambience" ? proBack[0] : hue[iZone] + gCycle * (backgroundMode == "Color Cycle Ambience"))}, ${sat[iZone]}%, ${lightness[iZone]}%, ${alpha})`;
        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }

    let audioScreenSat = 0
    let audioScreenLit = 0
    function copyScreenAudio(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      audioScreenSat += (engine.audio.density * 100 - audioScreenSat) / 10
      audioScreenLit += (engine.audio.density * 100 - audioScreenLit) / 10
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        ctx.fillStyle = `hsla(${hue[iZone]}, ${sat[iZone] * (audioScreenSat / 200 + .5)}%, ${lightness[iZone] * (audioScreenLit / 100)}%, ${alpha})`;
        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }


    //#endregion
    
    //#region callbacks

    function inGameCallback(){
      if(inGameBrownMeter.value >= 0.95 && inGameWhiteMeter.value >= 0.95 && engine.vision.inGameNotWhite <.1 ){
        gInGame = true
      } else{
        gInGame = false

      }
    }

    function healthCallback(){
      if(enableDamage){
        if(gInGame && healthWhiteMeter.decreased && healthWhiteMeter.diff >.08){
          effects.push(new damage())
        }
      }
      if(enableLowHealth){
        if(gInGame && healthWhiteMeter.value <.28 && !lowHealthGoing){
          effects.push(new lowHealth())
          lowHealthGoing = true

        }
      }
      
      
    }



    function ultCallback(){
      if(gInGame){
        if(enableUlt){
          if(ultWhiteMeter.value >=.95){
          effects.push(new ultReady())
          }
        }
        if(enableBind){
          if(ultWhiteMeter.decreased && ultWhiteMeter.diff >.8 ){
            effects.push(new bind())
          }
        }
        

      }
      
    }

    function restCallback(){
      if(enableRest){
        if(gInGame){
          if(rest1WhiteMeter.value >=.95){
            restGoing = true
            setTimeout(()=>{
              if( rest2WhiteMeter.value >=.5 ){
                effects.push(new rest())
              }
            },500)
            
          }
        }
        
        
      }
    }

    function itemsCallback(){
      if(enableItem){

    function lowHealth() {
      this.count = 0;
      this.lifetime = 1;
      this.headX = 110;
      this.headY = 20;
      this.scalePulse = 0;
      this.particles = [];

      this.draw = function() {
        if (healthWhiteMeter.value >= 0.4 || !gInGame) {
          this.lifetime = 0;
          lowHealthGoing = false;
        }

        ctx.save();
        ctx.fillStyle = 'black';
        ctx.globalAlpha = 0.5;
        ctx.fillRect(0, 0, 320, 200);
        ctx.restore();

        this.particles.push(new SmokeParticle(this.headX + 50, this.headY + 150));
        for (let i = this.particles.length - 1; i >= 0; i--) {
          this.particles[i].draw();
          if (this.particles[i].lifetime <= 0) {
            this.particles.splice(i, 1);
          }
        }

        this.scalePulse += 0.20;
        let pulse = 0.9 + Math.sin(this.scalePulse * 2) * 0.07;

        const headWidth = 100;
        const headHeight = 100;
        const offsetX = -(headWidth * (pulse - 1)) / 2;
        const offsetY = -(headHeight * (pulse - 1)) / 2;

        ctx.save();
        ctx.translate(this.headX + offsetX, this.headY + offsetY);
        ctx.scale(pulse, pulse);
        ctx.fillStyle = "hsl(0, 100%, 100%)";
        ctx.fill(new Path2D(pathSilksong));
        ctx.restore();
      };

  function SmokeParticle(startX, startY) {
    this.x = startX + (Math.random() - 0.5) * 320; 
    this.y = startY + (Math.random() - 0.5) * 100; 
    this.vx = (Math.random() - 0.5) * 0.3;     
    this.vy = -1 - Math.random() * 0.9;           
    this.ax = 0;                                   
    this.ay = -0.002 - Math.random() * 1.5;     
    this.rad = 20 + Math.random() * 4;
    this.maxRad = this.rad;
    this.alpha = 0.6;
    this.lifetime = 1;
    this.age = 0;
    this.maxAge = 150 + Math.random() * 30;
    this.rotation = Math.random() * Math.PI * 2;
    this.rotationSpeed = (Math.random() - 0.5) * 0.05;

    this.draw = function() {
      this.age++;

  
      this.x += this.vx;
      this.y += this.vy;
      this.vx += this.ax;
      this.vy += this.ay;
      this.rotation += this.rotationSpeed;

      let progress = this.age / this.maxAge;
      this.alpha = 0.6 * (1 - progress);             
      this.rad = this.maxRad * (1 + progress * 0.8); 

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);

      ctx.globalAlpha = this.alpha * 0.3;
      ctx.fillStyle = "hsl(0, 100%, 50%)";
      ctx.beginPath();
      ctx.ellipse(0, 0, this.rad * 1.5, this.rad, 0, 0, Math.PI * 2);
      ctx.fill();


      ctx.globalAlpha = this.alpha * 0.5;
      ctx.fillStyle = 'red';
      ctx.beginPath();
      ctx.ellipse(0, 0, this.rad, this.rad * 0.9, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
      ctx.globalAlpha = 1;

      if (this.age >= this.maxAge) {
        this.lifetime = 0; 
      }
    }
  }

    function RestParticle() {

      this.y = 230 + Math.random() * 20;
      this.vy = -0.5 - Math.random() * 0.5;
      this.ay = -0.05;

      this.rad = 3 + Math.random() * 2.5;
      this.maxRad = this.rad;
      this.alpha = 1;
      this.hue = 60;
      this.lifetime = 1;
      this.age = 0;
      this.maxAge = 100 + Math.random() * 50;
      
      this.draw = function() {
        this.age++;
        

        this.y += this.vy;
        this.x += this.vx;
        this.vy += this.ay;
        

        let progress = this.age / this.maxAge;
        this.alpha = 1 - progress;
        this.rad = this.maxRad * (1 - progress * 0.5);
        

        ctx.globalAlpha = this.alpha * 0.3;
        ctx.fillStyle = `hsl(${this.hue}, 100%, 60%)`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.rad * 4, 0, Math.PI * 2);
        ctx.fill();
        

        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = `hsl(${this.hue}, 100%, 50%)`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.rad * 2.5, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.globalAlpha = 1;
        
        if (this.age >= this.maxAge) {
          this.lifetime = 0;
        }
      }
    }

    function bind() {
      this.count = 0;
      this.lifetime = 1;
      this.waveOffset = 0;
      
      this.draw = function() {
        if (this.count < 90) {

          for (let i = 0; i < 1; i++) {
            effects.push(new BindParticle(i * 40, this.waveOffset));
          }
          this.waveOffset += 0.4;
          this.count++;
        } else {
          this.lifetime = 0;
        }
      }
    }

    function BindParticle(startX, wavePhase) {
      this.x = startX;
      this.y = 180;
      this.wavePhase = wavePhase + (startX * 0.05);
      this.vy = -1.8;
      this.waveAmplitude = 120;
      this.waveFrequency = 0.15;
      this.rad = 3 + Math.random() * 2;
      this.maxRad = this.rad;
      this.alpha = 1;
      this.hue = 60;
      this.lifetime = 1;
      this.age = 0;
      this.maxAge = 110 + Math.random() * 30;
      
      this.draw = function() {
        this.age++;
        
      
        this.y += this.vy;
        this.wavePhase += this.waveFrequency;
        
     
        let waveX = 160 + Math.sin(this.wavePhase) * this.waveAmplitude;
        
 
        let progress = this.age / this.maxAge;
        this.alpha = 1 - progress;
        this.rad = this.maxRad * (1 - progress * 0.4);
        
   
        ctx.globalAlpha = this.alpha * 0.5;
        ctx.fillStyle = `hsl(${this.hue}, 100%, 60%)`;
        ctx.beginPath();
        ctx.arc(waveX, this.y, this.rad * 6, 0, Math.PI * 2);
        ctx.fill();
        
   
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = `hsl(${this.hue}, 100%, 50%)`;
        ctx.beginPath();
        ctx.arc(waveX, this.y, this.rad * 3, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.globalAlpha = 1;
        
        if (this.age >= this.maxAge || this.y < -10 ) {
          this.lifetime = 0;
        }
      }
    }

    function boss() {
      this.alpha = 1;
      this.alpha2 = 0;
      this.rad = 1;
      this.stroke = 10;
      this.width = 0;
      this.width2 = 0;
      this.cycles = 0;        
      this.maxCycles = 3;   

      this.draw = function() {
        ctx.globalAlpha = this.alpha;
        DrawRect(0, 0, 320, 200, `hsla(55, 100%, 20%, ${this.alpha2})`);
        DrawStroke(160, 100, this.rad, "Yellow", this.stroke);
        ctx.globalAlpha = 1;

  
        if (this.rad < 300) {
          this.rad += 10;
        } else if (this.width < 150) {
          this.width += 100;
        } else if (this.width2 < 200) {
          this.width2 += 10;
        } else if (this.alpha >= 0.05) {
          this.alpha -= 0.05;
        } else {
      
          this.cycles++;
          if (this.cycles < this.maxCycles) {
        
            this.alpha = 1;
            this.alpha2 = 0;
            this.rad = 1;
            this.stroke = 10;
            this.width = 0;
            this.width2 = 0;
          } else {
      
            this.lifetime = 0;
            bossGoing = false
          }
        }
        if (this.stroke < 100) this.stroke += 5;
        if (this.alpha2 <= 0.95) this.alpha2 += 0.05;
      };
    }

    function ultReady() {
      this.lifetime = 500;
      this.pulses = 0; 
      this.active = true;

      this.draw = function () {
        if (!this.active) return;

        ctx.strokeStyle = `hsl(55, 100%, 90%)`;
        ctx.lineWidth = 50;
        ctx.beginPath();
        ctx.arc(160, 100, this.lifetime, 0, Math.PI * 2);
        ctx.stroke();

        this.lifetime -= 10;

       
        if (this.lifetime <= 0) {
          this.pulses++;
          if (this.pulses < 1) {
            this.lifetime = 500; 
          } else {
            this.active = false; 
          }
        }
      };
    }

    function damage(){
        this.alpha = 1
        this.alpha2 = 0
        this.rad = 1
        this.stroke = 10
        this.width = 0

          ctx.globalAlpha = this.alpha
          DrawRect(0, 0, 320, 200, `hsla(0, 100%, 20%, ${this.alpha2})`)
          DrawStroke(160, 100, this.rad, "red", this.stroke)
          ctx.globalAlpha = 1
          this.rad < 300 ? this.rad += 10 : this.width < 150 ? this.width += 100 : this.width2 < 200 ? this.width2 += 10 : this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0;

          if(this.alpha2 <= .95) this.alpha2 += .05
        }
    }

    function ImpactEffect() {
      this.x = 160;
      this.y = 50;
      this.count = 0;
      this.lifetime = 1;
      
      this.draw = function() {
       
        if (this.count === 0) {
          for (let i = 0; i < 50; i++) {
            let angle = Math.random() * Math.PI - Math.PI;
            effects.push(new ImpactParticle(this.x, this.y, angle));
          }
        }
        this.count++;
        if (this.count >= 60) this.lifetime = 0;
      }
    }

    function ImpactParticle(x, y, angle) {
      this.x = x;
      this.y = y;
      this.vx = Math.cos(angle) * (2 + Math.random() * 3);
      this.vy = Math.sin(angle) * (1 + Math.random()) - 2;
      this.ay = 0.2;
      this.rad = 1 + Math.random() * 2;
      this.alpha = 1;
      this.lifetime = 1;
      this.age = 0;
      this.maxAge = 100;
      this.bounced = false;
      
      this.draw = function() {
        this.age++;
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.ay;
        
        if (this.y > 190 && !this.bounced) {
          this.vy *= -0.5;
          this.bounced = true;
        }
        
        let progress = this.age / this.maxAge;
        this.alpha = 1 - progress;
        
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = 'hsl(354, 100%, 40%)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.rad + 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = this.alpha * 0.3;
        ctx.fillStyle = 'hsl(354, 100%, 70%)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.rad + 13, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.globalAlpha = 1;
        if (this.age >= this.maxAge) this.lifetime = 0;
      }
    }


    function DialogueEffect() {
      this.particles = [];
      this.butterflies = [];
      this.lifetime = 1;
      this.initialized = false;
      this.particleCount = 50;
      this.butterflyCount = 20;
      
      this.draw = function() {
        if (gInGame || (dialogueBottowWHiteMeter.value <.1 && dialogueTopWHiteMeter.value <.1)) {
          this.lifetime == 0;
          dialogueGoing = false
          return; 
        }

        ctx.save();
        ctx.fillStyle = 'black';
        ctx.globalAlpha = 0.9; 
        ctx.fillRect(0, 0, 320, 200); 
        ctx.restore();
      
        if (!this.initialized) {
          for (let i = 0; i < this.particleCount; i++) {
            this.particles.push(new DialogueParticle());
          }
          for (let i = 0; i < this.butterflyCount; i++) {
            this.butterflies.push(new DialogueButterfly());
          }
          this.initialized = true;
        }
        

        for (let i = this.particles.length - 1; i >= 0; i--) {
          this.particles[i].draw(ctx);
          if (this.particles[i].lifetime === 0) {
            this.particles.splice(i, 1);
          }
        }
        

        for (let i = this.butterflies.length - 1; i >= 0; i--) {
          this.butterflies[i].draw(ctx);
          if (this.butterflies[i].lifetime === 0) {
            this.butterflies.splice(i, 1);
          }
        }
      };
    }

    function DialogueParticle() {
      this.x = Math.random() * 320;
      this.y = Math.random() * 200;
      this.size = Math.random() * 3 + 3;
      this.speedY = Math.random() * 0.5 + 0.2;
      this.speedX = (Math.random() - 0.5) * 0.3;
      this.alpha = Math.random() * 0.5 + 0.3;
      this.lifetime = 1;
      this.canvasWidth = 320;
      this.canvasHeight = 200;
      
      this.draw = function() {

        this.y -= this.speedY;
        this.x += this.speedX;
        

        if (this.y < -10) this.y = this.canvasHeight + 10;
        if (this.x < -10) this.x = this.canvasWidth + 10;
        if (this.x > this.canvasWidth + 10) this.x = -10;
        

        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = 'hsl(220, 100%, 50%)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      };
    }

    function DialogueButterfly() {
      this.x = Math.random() * 320;
      this.y = Math.random() * 200;
      this.size = Math.random() * 4 + 8;
      this.speedX = (Math.random() - 0.5) * 1.5;
      this.speedY = (Math.random() - 0.5) * 1.5;
      this.wingAngle = Math.random() * Math.PI * 2;
      this.wingSpeed = Math.random() * 0.15 + 0.1;
      this.glowPhase = Math.random() * Math.PI * 2;
      this.glowSpeed = Math.random() * 0.05 + 0.03;
      this.lifetime = 1;
      this.canvasWidth = 320;
      this.canvasHeight = 200;
      

      this.isButterfly = Math.random() > 0.5;
      if (this.isButterfly) {
        this.r = 255;
        this.g = 255;
        this.b = 0;
      } else {
        this.r = 130;
        this.g = 255;
        this.b = 130;
      }
      
      this.draw = function() {

        this.x += this.speedX;
        this.y += this.speedY + Math.sin(this.wingAngle) * 0.3;
        this.wingAngle += this.wingSpeed;
        this.glowPhase += this.glowSpeed;
        

        if (this.x < -20) this.x = this.canvasWidth + 20;
        if (this.x > this.canvasWidth + 20) this.x = -20;
        if (this.y < -20) this.y = this.canvasHeight + 20;
        if (this.y > this.canvasHeight + 20) this.y = -20;
        

        let glowIntensity = (Math.sin(this.glowPhase) + 1) * 0.5;
        
        ctx.save();
        

        let gradient = ctx.createRadialGradient(
          this.x, this.y, 0,
          this.x, this.y, this.size * 3
        );
        gradient.addColorStop(0, `rgba(${this.r}, ${this.g}, ${this.b}, ${0.6 * glowIntensity})`);
        gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
        ctx.fill();
        

        ctx.globalAlpha = 0.8 + glowIntensity * 0.2;
        ctx.fillStyle = `rgb(${this.r}, ${this.g}, ${this.b})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();

        if (this.isButterfly) {
          let wingFlap = Math.abs(Math.sin(this.wingAngle)) * 0.5 + 0.5;
          ctx.globalAlpha = 0.2 * wingFlap;
          ctx.fillStyle = `rgb(${this.r}, ${this.g}, ${this.b})`;
          

          ctx.beginPath();
          ctx.ellipse(
            this.x - this.size * 1.5, this.y,
            this.size * 2 * wingFlap, this.size * 1.5,
            -Math.PI / 4, 0, Math.PI * 2
          );
          ctx.fill();
          
    
          ctx.beginPath();
          ctx.ellipse(
            this.x + this.size * 1.5, this.y,
            this.size * 2 * wingFlap, this.size * 1.5,
            Math.PI / 4, 0, Math.PI * 2
          );
          ctx.fill();
        }
        

        ctx.globalAlpha = 0.1 * glowIntensity;
        ctx.strokeStyle = `rgb(${this.r}, ${this.g}, ${this.b})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x - this.speedX * 3, this.y - this.speedY * 3);
        ctx.stroke();
        ctx.restore();
      };
    }

  //#region Helper Functions
  function innerEffects(){
        this.effects = []
        this.Add = (cb, arr) => {
            this.effects.push(new cb(...arr))
        }
        this.draw = () => {
            this.effects.forEach((ele, i)=>{
                ele.draw()
                if(ele.lifetime <= 0) this.effects.splice(i, 1)
            })
        }
    }

    function testTranslate(start, end, rot, scaleX, scaleY){
        ctx.save()
        ctx.translate(start[0], start[1])
        ctx.scale(scaleX, scaleY)
        ctx.rotate(rot)
        ctx.translate(end[0], end[1])
    }

  function DrawArc(x, y, start, end, radius, direction, color){
    ctx.beginPath()
    ctx.arc(x, y, radius, start, end, direction)
    ctx.fillStyle = color
    ctx.fill()
  }

  function DrawLine(start, end, color, stroke){
    ctx.beginPath()
    ctx.moveTo(start[0], start[1])
    ctx.lineTo(end[0], end[1])
    ctx.strokeStyle = color
    ctx.lineWidth = stroke
    ctx.stroke()
  }

  function drawRadialGradient(color1, color2, inneRadius, fade) {
      ctx.beginPath();
      let gradient = ctx.createRadialGradient(160, 100, inneRadius, 160, 100, inneRadius + fade)
      gradient.addColorStop(0, color1);
      gradient.addColorStop(1, color2);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 320, 200);
  }

  function DrawEllipse(x, y, width, height, rotation, color){
    ctx.beginPath()
    ctx.ellipse(x, y, width, height, rotation, 0, Math.PI * 2)
    ctx.fillStyle = color
    ctx.fill()
  }

  
  function lightning(size, color, width){
      this.points = [];
      this.color = color
      this.width = width
      while(this.points.length <= size){
        this.points.push([this.points.length * (350 / size) - 25, 100])
      }
      this.draw = function(){
        drawLightning(this.points, this.color, this.width)
        this.points.forEach((ele, i)=>{
          var mod = Math.sin(Date.now() / (100000 * Math.random()))
          switch(i){
            case 0:
              this.points[i][1] < 90 ? this.points[i][1]+=2 : 
                this.points[i][1] > 110 ? this.points[i][1]-=2 : 
                  this.points[i][1] += mod * 10;
              break;
            case this.points.length - 1:
              this.points[i - 1][1] - this.points[i][1] < -30 ? this.points[i][1]-=5 : 
                  this.points[i - 1][1] - this.points[i][1] > 30 ? this.points[i][1]+=5 : 
                      this.points[i][1] += mod * 10;
              break;
            default:
              this.points[i - 1][1] - this.points[i][1] < -30 ? this.points[i][1]-=5 : 
                this.points[i - 1][1] - this.points[i][1] > 30 ? this.points[i][1]+=5 : 
                    this.points[i][1] += mod * 10;
              this.points[i][0] < i * (320 / this.points.length) ? this.points[i][0]+=5 : 
                this.points[i][0] > i * (320 / this.points.length) + (320 / this.points.length) ? this.points[i][0]-=5 : 
                    this.points[i][0] += mod * 10;
              break;
          }
        })
      }
    }

  function DrawLightning(array, color, width){
      ctx.beginPath()
      ctx.moveTo(...array[0])
      array.forEach((ele, i)=>{
        if(i){
          ctx.lineTo(...array[i])
        }
      });
      ctx.strokeStyle = color;
      ctx.lineJoin = "round";
      ctx.lineWidth = width + Math.random() * width;
      ctx.stroke()
  }

  function DrawGear(x, y, radius, stroke, teeth, color){
    DrawStroke(x, y, radius, color, stroke)
    for(let i = 0; i < teeth; i++){
      var ix = Math.cos(Math.PI * 2 / teeth * i) * radius + x;
      var iy = Math.sin(Math.PI * 2 / teeth * i) * radius + y;
      var rotate = Math.atan2(y - iy, x - ix) + Math.PI / 2;
      ctx.save()
      ctx.translate(ix, iy)
      ctx.rotate(rotate)
      ctx.translate(-ix, -iy)
      DrawRect(ix, iy, Math.PI * radius * 2 / teeth * .75, radius / 3 + stroke / 2, "orange")
      ctx.restore()
    }
  }

  function DrawPath(x, y, path, color, scaleX, scaleY) {
    ctx.fillStyle = color;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scaleX, scaleY)
    let ex = new Path2D(path);
    ctx.fill(ex);
    ctx.restore();
  };

  function DrawTriangle(cord1X, cord1Y, cord2X, cord2Y, cord3X, cord3Y, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.moveTo(cord1X, cord1Y);
    ctx.lineTo(cord2X, cord2Y);
    ctx.lineTo(cord3X, cord3Y);
    ctx.lineTo(cord1X, cord1Y);
    ctx.fill();
  };

  function DrawCircle(x, y, radius, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.fill();
  };

  function DrawStroke(x, y, radius, color, stroke) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = stroke;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.stroke();
  };

  function DrawRect(x, y, width, height, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
  };

  function strokeRect(x, y, width, height, color, stroke){
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = stroke
    ctx.rect(x, y, width, height);
    ctx.stroke()
  }

  function DrawHex(x, y, color, size) {
    ctx.beginPath();
    for (var i = 0; i < 7; i++) {
      ctx.lineTo(x + size * Math.cos(2 * Math.PI / 6 * i), y + size * 0.9 * Math.sin(2 * Math.PI / 6 * i));
    }
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = "black"
    ctx.stroke()
  };

      function getCubicBezierXYatPercent(startPt, controlPt1, controlPt2, endPt, percent) {
        var x = CubicN(percent, startPt.x, controlPt1.x, controlPt2.x, endPt.x);
        var y = CubicN(percent, startPt.y, controlPt1.y, controlPt2.y, endPt.y);

        return ({ x: x, y: y });
      }

      function CubicN(pct, a, b, c, d) {
        var t2 = pct * pct;
        var t3 = t2 * pct;
        return a + (-a * 3 + pct * (3 * a - a * pct)) * pct
          + (3 * b + pct * (-6 * b + b * 3 * pct)) * pct
          + (c * 3 - c * 3 * pct) * t2
          + d * t3;
      }

  function hexToRgb(hex) {
    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
      r: parseInt(result[1], 16),
      g: parseInt(result[2], 16),
      b: parseInt(result[3], 16)
    } : null;
  }

  function hexToHSL(hex) {
      const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || [];
      const rgb = [r, g, b].map(x => parseInt(x, 16) / 255);
      const max = Math.max(...rgb);
      const min = Math.min(...rgb);
      const l = (max + min) / 2;
      
      if (max === min) return [0, 0, Math.round(l * 100)];
      
      const d = max - min;
      const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      
      let h;
      const [nr, ng, nb] = rgb;
      if (max === nr) h = (ng - nb) / d + (ng < nb ? 6 : 0);
      else if (max === ng) h = (nb - nr) / d + 2;
      else h = (nr - ng) / d + 4;
      
      return [
        Math.round(h * 60),
        Math.round(s * 100),
        Math.round(l * 100)
      ];
    }
  
    function Meter(size, callback) {
      this.size = size;
      this.value = 0;
      this.diff = 0;
      this.increased = false;
      this.decreased = false;
      var values = [];
  
      this.setValue = function (updatedValue) {
        values.push(updatedValue);
        if (values.length > this.size) {
          values.shift();
        }
  
        for (var i = 0; i < values.length - 1; i++) {
          if (values[i] !== values[i + 1]) return;
        }
        if (this.value !== values[0]) {
          this.diff = Math.abs(this.value - values[0]);
          this.increased = this.value < values[0];
          this.decreased = this.value > values[0];
          this.value = values[0];
          callback();
        }
      }
    }


  window.requestAnimationFrame(update);
