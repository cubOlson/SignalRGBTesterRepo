<script>
  //tags="apex, apex legends"

  //#region Variable declaration
  let canvas, ctx;
  canvas = document.getElementById("exCanvas")
  ctx = canvas.getContext("2d")
  const hiddenCanvas = document.createElement('canvas');
  hiddenCanvas.width = 320;
  hiddenCanvas.height = 200;
  const hiddenCtx = hiddenCanvas.getContext('2d');

  let gUltCharged = false;
  let gUltAnimPlayed = false;
  let gZGoing = false;
  let healthHistory = [];

  let healAnimLength = 1000;
  var effects = [];
  var gInGame = false;
  var gVantageReady = true;
  var gStormObj = false;
  var gLossPlaying = false;

  var theHUD = new DrawHud()

  //#endregion
  //#region Meter declaration

  var inGameMeter = new Meter(10, InGame)
  var whiteInGameMeter = new Meter(10, InGame)
  
  var q_Meter = new Meter(15, Q_Effects);
  var q1_Meter = new Meter(15, Q1_Effects);
  var q2_Meter = new Meter(15, Q2_Effects);
  var q3_Meter = new Meter(15, Q3_Effects);

  var z_Total = new Meter(4, () => "");
  var z_TotalHue = new Meter(4, () => "")
  var z_WhiteVal = new Meter(10, Z_Effects)
  var z_CheckCharge = new Meter(10, Z_Charged);
  var grey_Z_Meter = new Meter(2, () => "")
  var checkMeter = new Meter(15, () => "");
  var get_Z = new Meter(15, () => "");
  var osdEsc_Meter = new Meter(2, () => "")
  var loba_t = new Meter(3, () => "")
  var deathProtection_Meter = new Meter(4, () => "")
  var healthMeter = new Meter(4, HpEffects)
  var shieldBar_Meter = new Meter(5, Shield_Effects)
  var shieldBarCol_Meter = new Meter(10, ShieldPickupEffect)
  var valkUltMeter = new Meter(5, valkUlt)
  var crypMeter = new Meter(20, CheckCryptoUlt)
  var reviveConfirmationMeter = new Meter(15, () => "")
  var WhiteStormBarMeter = new Meter(8, StormCallback);
  var OrangeStormBarMeter = new Meter(8, () => "")
  var osdEscOn_Meter = new Meter(5, baseMenuCallback);
  var YellowSelectMenuMeter = new Meter(10, selectMenuCallback)
  var MenuColorMeter = new Meter(3, () => "")

  var InDropShipOrangeMeter = new Meter(15, dropShipMenuCallback)
  var InDropShipWhiteMeter = new Meter(10, dropShipMenuCallback)

  var LossRedMeter = new Meter(10, LossCallback);
  var WinGoldMeter = new Meter(10, WinCallback);
  var WinLossConfirmMeter = new Meter(7, () => "")

  var Team1Meter = new Meter(10, TeamCallback);
  var Team2Meter = new Meter(10, TeamCallback);
  let logo = `M135.603 134.549 C 100.294 194.800,71.398 244.298,71.390 244.543 C 71.369 245.166,108.669 275.079,109.271 274.922 C 109.510 274.860,125.802 263.798,145.476 250.342 L 181.246 225.875 160.623 225.811 C 149.280 225.776,140.000 225.684,140.000 225.608 C 140.000 225.373,199.866 120.253,200.000 120.252 C 200.106 120.252,259.973 224.939,260.208 225.537 C 260.253 225.652,250.886 225.776,239.392 225.811 L 218.492 225.875 254.393 250.342 C 274.138 263.798,290.489 274.859,290.728 274.922 C 291.331 275.079,328.631 245.167,328.610 244.543 C 328.593 244.017,200.291 25.000,200.000 25.000 C 199.891 25.000,170.912 74.297,135.603 134.549 `
  //#endregion
  //#region  updateLoop 
  function update() {
      DrawRect(0, 0, 320, 200, "black")
    if (!gLossPlaying) {
      backgroundHandler()
    }

    whiteInGameMeter.setValue(engine.vision.WhiteInGame)
    inGameMeter.setValue(engine.vision.InGameOrange)
    LossRedMeter.setValue(engine.vision.LossRed);
    WinLossConfirmMeter.setValue(engine.vision.WinLossConfirm)
    reviveConfirmationMeter.setValue(engine.vision.reviveConfirm);
    valkUltMeter.setValue(engine.vision.valkz)
    checkMeter.setValue(engine.vision.check);
    z_Total.setValue(engine.vision.ultCol[1] + engine.vision.ultCol[2])
    z_TotalHue.setValue(engine.vision.ultCol[0])
    z_WhiteVal.setValue(engine.vision.whiteVal)
    z_CheckCharge.setValue(z_WhiteVal.value)
    deathProtection_Meter.setValue(engine.vision.dprotection)
    q_Meter.setValue(engine.vision.q)
    q1_Meter.setValue(engine.vision.q1);
    q2_Meter.setValue(engine.vision.q2);
    q3_Meter.setValue(engine.vision.q3)
    osdEsc_Meter.setValue(engine.vision.osdEsc)
    loba_t.setValue(engine.vision.loba2);
    shieldBar_Meter.setValue(engine.vision.ShieldBar)
    shieldBarCol_Meter.setValue(engine.vision.ShieldBarColor[0])
    healthMeter.setValue(engine.vision.health)
    grey_Z_Meter.setValue(engine.vision.greyZ)
    crypMeter.setValue(engine.vision.cyrp)
    WinGoldMeter.setValue(engine.vision.WinGold);
    OrangeStormBarMeter.setValue(engine.vision.OrangeStormBar);
    WhiteStormBarMeter.setValue(engine.vision.WhiteStormBar);
    Team1Meter.setValue(engine.vision.teammate1[1])
    Team2Meter.setValue(engine.vision.teammate2[1])
    osdEscOn_Meter.setValue(engine.vision.osdEscOn)
    YellowSelectMenuMeter.setValue(engine.vision.YellowSelectMenu)
    InDropShipOrangeMeter.setValue(engine.vision.InDropShipOrange)
    InDropShipWhiteMeter.setValue(engine.vision.InDropShipWhite)
    if (engine.vision.SelectMenuColor[2] > 20) {
      MenuColorMeter.setValue(engine.vision.SelectMenuColor[0])
    }
    
    if (((gUltCharged && !gUltAnimPlayed) || gVantageReady) && gInGame && enableUlt) {
      effects.push(new BurstRippleState(effectHex, '#ffffff', effectHex))
      gUltAnimPlayed = true;
      gVantageReady = false;
    }

    if (!gUltCharged) {
      gUltAnimPlayed = false;
    }

    var confirmCharge = engine.vision.confirm;
    if (enablePhoenix && gInGame) {
      if (engine.vision.phoenixKit > 0.1 && confirmCharge > 0.8) {
        drawSweep(engine.vision.phoenixKit, "rgba(139, 35, 224, 0.9)");
      }
      if (engine.vision.phoenixKit > 0.95 && confirmCharge > 0.8) {
        effects.push(new ColorBurst(160, 100, "rgb(139, 35, 224"));
      }
    }

    if (enableSyringe) {
      if (engine.vision.syringeCharge > 0.1 && confirmCharge > 0.8) {
        drawSweep(engine.vision.syringeCharge, "rgba(255, 0, 0, 0.9");
      }
      if (engine.vision.syringeCharge > 0.95 && confirmCharge > 0.8) {
        effects.push(new ColorBurst(160, 100, `hsla(${engine.vision.ShieldBarColor[0]}, ${engine.vision.ShieldBarColor[1]}%, ${engine.vision.ShieldBarColor[2]}%, 1)`));
      }
    }

    if (enableShield) {
      if (engine.vision.shieldCharge > 0.1 && confirmCharge > 0.8 && engine.vision.check >= .95) {
        drawSweep(engine.vision.shieldCharge, "rgba(19, 101, 183, 0.9");
      }

      if (engine.vision.shieldCharge > 0.95 && confirmCharge > 0.8 && engine.vision.check >= .95) {
        effects.push(new ColorBurst(160, 100, "rgb(19, 101, 183"));
      }
    }

    if (enableRevive && reviveConfirmationMeter.value >= .95) {
      if (engine.vision.revive > 0.1) {
        drawSweepUp(engine.vision.revive, "rgba(123, 174, 0, 0.9");
      }
      if (engine.vision.revive > 0.95) {
        effects.push(new ColorBurst(160, 100, "rgb(123, 174, 0"));
      }
    }

    if (gStormObj !== false) {
      gStormObj.draw();
    }

    theHUD.draw();

    effects.forEach(ele => ele.draw())
    effects = effects.filter(ele => !(ele.lifetime <= 0))

    if (effects.length === 0) {
      hiddenCtx.setTransform(1, 0, 0, 1, 0, 0);
    }

    ctx.drawImage(hiddenCanvas, 0, 0)

    window.requestAnimationFrame(update);
  }
  //#endregion
  //#region callbacks

  function oncharacterChanged(){
    characterSelected(hexToHSL(effectHex))
  }

  let proBack = []
    function onbackColorChanged(){
      proBack = hexToHSL(backColor)
    }

    let backgroundEaseHue = 0;
    let backgroundEaseLit = 0;
    let backgroundEaseSat = 0
    let gCycle = 0
    function backgroundHandler(){
        switch(backgroundMode){
            case "Color Cycle": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Color Cycle Ambience": 
            copyScreen(ambienceAlpha / 100)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Custom": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            break;
            case "Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Custom Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Ambience Audio Visualizer": 
            copyScreenAudio(ambienceAlpha / 100)
            break;
            case "Custom Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
            case "Color Cycle Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
        }
    }
    let audioScreenSat = 0
    let audioScreenLit = 0
    function copyScreenAudio(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      audioScreenSat += (engine.audio.density * 100 - audioScreenSat) / 10
      audioScreenLit += (engine.audio.density * 100 - audioScreenLit) / 10
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        if (engine.vision.health < 0.35 && engine.vision.health > 0 && gInGame) {
            hiddenCtx.fillStyle =
            "hsla(" +
            0 +
            "," +
            100 +
            "%," +
            50 +
            "%, " +
            ambienceAlpha * 0.01 +
            ")";
        } else if ((engine.vision.mini > 0.7 && character == "Rampart") || (engine.vision.dprotection > .7 && character == "Revenant") && gInGame) {
          hiddenCtx.fillStyle =
            "hsla(" +
            30 +
            "," +
            100 +
            "%," +
            lightness[iZone] +
            "%, " +
            ambienceAlpha * 0.01 +
            ")";
        } else if (engine.vision.cyrp >= .8 && character == "Crypto" && gInGame) {
            hiddenCtx.fillStyle =

    function copyScreen(alpha) {

      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        if (engine.vision.health < 0.35 && engine.vision.health > 0 && gInGame) {
            hiddenCtx.fillStyle =

  function DrawHud() {
    this.oldHPWidth = 0;
    this.HPAlpha = 0;
    this.red = false;
    this.white = false;
    this.draw = function () {
      if (adjToggle && !gInGame) {
        DrawRect(HealthBarX * 3.2, HealthBarY * 2, HealthBarWidth * 3.2, HealthBarHeight * 2, "green")
        DrawRect(ShieldBarX * 3.2, ShieldBarY * 2, ShieldBarWidth * 3.2, ShieldBarHeight * 2, "blue")
      } else if (gInGame) {
        if (Math.abs(HealthBarWidth * 3.2 * healthMeter.value - this.oldHPWidth)<-2) {
          this.white = true;
          this.HPAlpha = 1
        } else if ( Math.abs(HealthBarWidth * 3.2 * healthMeter.value - this.oldHPWidth)>2) {
          this.red = true;
          this.HPAlpha = 1
        }
        this.oldHPWidth = HealthBarWidth * 3.2 * healthMeter.value;
        if (HPHUDOn) {
          DrawRect(HealthBarX * 3.2, HealthBarY * 2, HealthBarWidth * 3.2 * healthMeter.value, HealthBarHeight * 2, `hsla(${healthMeter.value > 0.7 ? 116 : healthMeter.value > 0.5 ? 42 : healthMeter.value > 0.3 ? 321 : Math.sin(Date.now() / 200) * 5 + 10},100%,50%)`)
          hiddenCtx.globalAlpha = this.HPAlpha
          DrawRect(HealthBarX * 3.2, HealthBarY * 2, HealthBarWidth * 3.2 * healthMeter.value, HealthBarHeight * 2, this.white ? "white" : this.red ? "red" : "hsla(0, 0%, 0%, 0)")
          hiddenCtx.globalAlpha = 1;
        }
        this.HPAlpha > .05 ? this.HPAlpha -= .05 : this.HPAlpha = 0;
        if (this.HPAlpha <= 0) {
          this.white = false;
          this.red = false;
        }
        if (ShieldHUDOn) DrawRect(ShieldBarX * 3.2, ShieldBarY * 2, ShieldBarWidth * 3.2 * shieldBar_Meter.value * 1.1, ShieldBarHeight * 2, `hsl(${shieldBarCol_Meter.value},100%,50%)`)
      }
    }
  }

  function drawRadialGradient(color1, color2, inneRadius, fade) {
    hiddenCtx.beginPath();
    let gradient = hiddenCtx.createRadialGradient(160, 100, inneRadius, 160, 100, inneRadius + fade)
    gradient.addColorStop(0, color1);
    gradient.addColorStop(1, color2);
    hiddenCtx.fillStyle = gradient;

  }

  function getStormState(state) {
    let strength = 100 - ((engine.vision.WhiteStormBar - 0.03) - engine.vision.OrangeStormBar) * 95;
    if (engine.vision.WhiteStormBar > 0.97) {
      state.nextState = -1;
    } else {
      if (strength < 20) {
        state.nextState = 0;
      } else if (strength > 20 && strength < 40) {
        state.nextState = 1;
      }
      else if (strength > 40 && strength < 60) {
        state.nextState = 2;
      } else if (strength > 60 && strength < 80) {
        state.nextState = 3;
      } else if (strength > 80 && strength < 95) {
        state.nextState = 4;
      } else if (strength > 95 && strength < 103) {
        state.nextState = 5;
      } else {
        state.nextState = 6;
      }
    }

    if (state.nextState == state.prevNextState) {
      if (state.countState < 10) {
        state.countState++;
      }
    } else {
      state.countState = 0;
      state.prevNextState = state.nextState;
    }
    if (state.countState >= .950) {
      state.state = state.nextState;
    }
    return state;
  }

  function stormEffect() {
    this.start = Date.now();
    this.elapsed;
    this.storm = true;
    this.state = { prevNumber: 0, state: 0, nextState: 0, prevNextState: 0, countState: 0 }
    this.endCount = 0;

    effects.push(new PulseRippleState("orange", true, 2000, false))

    this.draw = function () {
      this.elapsed = Date.now() - this.start;
      if (WhiteStormBarMeter.value <= 0 && engine.vision.WhiteInGame >= .45 && healthMeter.value > 0 && engine.vision.InGameOrange >= .95 && gInGame) {
        if (this.endCount > 20) {
          gStormObj = false;
        }
        this.endCount++;
      } else {
        this.endCount = 0;
      }
      if (gInGame) {
        this.state = getStormState(this.state);
      }

      /*
      StateDescription
      this.state.state returns a value between 0 and 6 depending on the current distance from the circle

      0 is really far away, 1 is far away, 2 is pretty far away, 3 is medium distance, 4 is fairly close 5 is really close, 6 is in storm

      The WhiteStormBarMeter below in the if statement checks if you are in the safe circle

      */

      switch (this.state.state) {
        case -1:
          drawRadialGradient('hsla(0,0%,0%,0)', "green", Math.sin(this.elapsed / 300) * 50 + 230, 10);
          break;
        case 0:
          break;
        case 1:
          drawRadialGradient('hsla(0,0%,0%,0)', "orange", Math.sin(this.elapsed / 350) * 40 + 200, 10);
          break;
        case 2:
          drawRadialGradient('hsla(0,0%,0%,0)', "orange", Math.sin(this.elapsed / 250) * 40 + 200, 10);
          break;
        case 3:
          drawRadialGradient('hsla(0,0%,0%,0)', "orange", Math.sin(this.elapsed / 190) * 40 + 200, 10);
          break;
        case 4:
          drawRadialGradient('hsla(0,0%,0%,0)', "orange", Math.sin(this.elapsed / 150) * 40 + 200, 10);
          break;
        case 5:
          drawRadialGradient('hsla(0,0%,0%,0)', "orange", Math.sin(this.elapsed / 100) * 70 + 170, 10);
          break;
        case 6:
          drawRadialGradient('hsla(0,0%,0%,0)', "red", Math.sin(this.elapsed / 180) * 100 + 150, 10);
          break;
      }
    }
  }

  function PathStreak(path, duration, quality, length, color, lineWidth) {

    this.points = path;
    this.start = Date.now();
    let pointAmount = path.length
    this.betweenPoint = 1 / pointAmount + 2
    this.duration = duration;
    this.quality = quality;
    this.length = length;
    this.totalDistance = 0;
    this.color = color;
    this.lineWidth = lineWidth;


    this.draw = function () {
      hiddenCtx.beginPath();
      let value = (this.duration - (this.duration - (Date.now() - this.start))) / this.duration;
      hiddenCtx.moveTo(this.points[0].x, this.points.y)
      for (let index = 0; index < this.quality; index++) {
        let pointVal = Math.floor((value * pointAmount) - (index * (this.length / this.quality)));
        if (pointVal >= 1) {
          if (pointVal < pointAmount) {
            let movePoint = getXAndYForPathPoint(this.points[pointVal - 1], this.points[pointVal], (((value) * pointAmount) - (index * (this.length / this.quality))) - pointVal);
            hiddenCtx.lineTo(movePoint.x, movePoint.y)
          }
        }
      }

      hiddenCtx.lineWidth = this.lineWidth;
      hiddenCtx.strokeStyle = this.color;
      hiddenCtx.stroke();
      if (value > 1) {
        this.lifetime = 0;
      }
    }
  }

  function getXAndYForPathPoint(point1, point2, percentage) {
    let speed = { x: (point2.x - point1.x) * percentage, y: (point2.y - point1.y) * percentage }
    return { x: point1.x + speed.x, y: point1.y + speed.y }
  }

      }

          switch(i){

              this.points[i][1] < 90 ? this.points[i][1]+=2 : 
                this.points[i][1] > 110 ? this.points[i][1]-=2 :

            case this.points.length - 1:
              this.points[i - 1][1] - this.points[i][1] < -30 ? this.points[i][1]-=5 : 
                  this.points[i - 1][1] - this.points[i][1] > 30 ? this.points[i][1]+=5 : 
                      this.points[i][1] += mod * 10;
              break;
            default:
              this.points[i - 1][1] - this.points[i][1] < -30 ? this.points[i][1]-=5 : 
                this.points[i - 1][1] - this.points[i][1] > 30 ? this.points[i][1]+=5 : 
                    this.points[i][1] += mod * 10;
              this.points[i][0] < i * (320 / this.points.length) ? this.points[i][0]+=5 : 
                this.points[i][0] > i * (320 / this.points.length) + (320 / this.points.length) ? this.points[i][0]-=5 : 
                    this.points[i][0] += mod * 10;
              break;

        })
      }

  function getCubicBezierXYatPercent(startPt, controlPt1, controlPt2, endPt, percent) {
    var x = CubicN(percent, startPt.x, controlPt1.x, controlPt2.x, endPt.x);
    var y = CubicN(percent, startPt.y, controlPt1.y, controlPt2.y, endPt.y);

    return ({ x: x, y: y });
  }

  function CubicN(pct, a, b, c, d) {
    var t2 = pct * pct;
    var t3 = t2 * pct;
    return a + (-a * 3 + pct * (3 * a - a * pct)) * pct
      + (3 * b + pct * (-6 * b + b * 3 * pct)) * pct
      + (c * 3 - c * 3 * pct) * t2
      + d * t3;
  }

  function draw3ColorSpiral(spX, spY, cl1, cl2, cl3, radius, phase) {
    var currentColor;
    for (var i = 0; i < 360; i += 1) {
      var radphase = i / 360;

      var start = 2 * Math.PI * (i / 360);
      var end = 2 * Math.PI * ((i + 1) / 360);
      var offset = 2 * Math.PI * (phase / 360);

      if (i < 60 || (i > 180 && i < 240)) {
        currentColor = cl1;
      }

      if ((i > 60 && i < 120) || (i > 240 && i < 300)) {
        currentColor = cl2;
      }

      if ((i > 120 && i < 180) || (i > 300 && i < 360)) {
        currentColor = cl3;
      }

      hiddenCtx.fillStyle = currentColor;
      hiddenCtx.beginPath();
      try {
        hiddenCtx.arc(spX, spY, radius, start + offset, end + offset);
      } catch (err) {
        hiddenCtx.arc(160, 100, 50, Math.PI, 2 * Math.PI);
      }
      hiddenCtx.lineTo(spX, spY);
      hiddenCtx.closePath();
      hiddenCtx.fill();
    }
  }

function spark(x, y, scale,sparks,speed,color){
    this.startX = x
    this.endX = x + (30 - Math.random() * 60)
    this.stepX = (this.endX - this.startX) / 5
    this.startY = y
    this.endY = y + (30 - Math.random() * 60)
    this.stepY = (this.endY - this.startY) / 5
    this.count = 1
    this.scale = scale
    this.done = false
    this.lifetime = 10
    this.color = color
    this.draw = function(){
      if(this.scale < .1) this.lifetime = 0;
      hiddenCtx.beginPath()
      hiddenCtx.moveTo(this.startX, this.startY)
      hiddenCtx.lineTo(this.startX + this.stepX * this.count, this.startY + this.stepY * this.count)
      if(this.count < 5){
        this.count+=speed
        if(this.count >= 5) {
          sparks.push(new spark(this.endX, this.endY, this.scale * .8,sparks,speed,{h:this.color.h +5,s:this.color.s,l:this.color.l}))
          if(Math.random() > .75) sparks.push(new spark(this.endX, this.endY, this.scale * .8,sparks,speed,{h:this.color.h +5,s:this.color.s,l:this.color.l}))
          if(!this.done){
            this.done = true
            setTimeout(()=>{
              this.lifetime = 0;
            }, 1000 - (9 * speed))
          }
        }
      }
      hiddenCtx.lineWidth = 15 * this.scale
      hiddenCtx.strokeStyle = `hsla(${this.color.h},${this.color.s}%,${this.color.l}%)`;
      hiddenCtx.stroke()
    }
  }

  function Circle() {
    this.start = new Date().getTime()
    this.draw = function () {
      this.elapsed = new Date().getTime() - this.start;
      var gradient = hiddenCtx.createRadialGradient(160, 110, 0, 160, 110, 200);
      this.animSpeed = 0.7;
      if (this.elapsed < 3000) {
        this.mathVal = -1400 * Math.floor(this.elapsed / 1000) + this.elapsed / this.animSpeed;
        gradient.addColorStop(SetRange((-800 + this.mathVal), 0, 1000) / 1000, 'hsla(178, 100%, 58%, 1)');
        gradient.addColorStop(SetRange((-400 + this.mathVal), 0, 1000) / 1000, 'hsla(217, 100%, 30%, 1)');
        gradient.addColorStop(SetRange((0 + this.mathVal), 0, 1000) / 1000, 'hsla(178, 100%, 58%, 1)');
      } else {
        gradient.addColorStop(SetRange((0 + -1400 * 3 + this.elapsed / this.animSpeed), 0, 1000) / 1000, 'hsla(178, 100%, 58%, 1)');
        gradient.addColorStop(SetRange((-400 + -1400 * 3 + this.elapsed / this.animSpeed), 0, 1000) / 1000, 'hsla(0,0%,0%,0)')
      }
      if (this.elapsed < 1000) {
        gradient.addColorStop(SetRange((100 + this.elapsed / this.animSpeed), 0, 1000) / 1000, 'hsl(0,0%,0%)')
      }
      hiddenCtx.beginPath()
      hiddenCtx.fillStyle = gradient;
      hiddenCtx.arc(160, 120, 200, 0, Math.PI * 2)
      hiddenCtx.fill()
    }
  }

    this.size = !this.reverse ? 0 : 320;
    this.x = 160;
    this.y = 100;
    this.alpha = 1;
    this.length = 0;
    this.vignette = hiddenCtx.createRadialGradient(160, 100, 100, 160, 100, 200)
    this.vignette.addColorStop(0, "hsla(0, 0%, 0%, 0)")
    this.vignette.addColorStop(.45, "hsla(0, 0%, 0%, 0)")
    this.vignette.addColorStop(.65, "hsla(0, 0%, 0%, 1)")

   
      

      let color = "";
      if (character == "Vantage") {
        color = engine.vision.ultCheck;
      }
      
      
    

    this.draw = function () {
      this.elapsed = new Date().getTime() - this.start;
      hiddenCtx.globalAlpha = this.alpha;
      if (character == "Vantage") {
        vantageLine(50, 100, 160, 100, this.length)
        vantageLine(160, 0, 160, 100, this.length)
        vantageLine(270, 100, 160, 100, this.length)
        vantageLine(160, 200, 160, 100, this.length)
        this.length <= .98 ? this.length += .02 : this.length = 1;
        DrawRect(0, 0, 320, 200, this.vignette)
        if (this.length >= .95) {
          effects.push(new expandingStroke(160, 100, 12, 200, "black"))
          effects.push(new expandingStroke(160, 100, 10, 40, "white"))
          this.start = Date.now() - 2000
        }
      } else {
        hiddenCtx.fillStyle = "black";
        hiddenCtx.fillRect(0, 0, 320, 200);

        hiddenCtx.fillStyle = this.color1;
        hiddenCtx.beginPath();
        hiddenCtx.arc(160, 100, this.size + (this.size / 2), 0, 2 * Math.PI);
        hiddenCtx.fill();

        hiddenCtx.fillStyle = this.color2;
        hiddenCtx.beginPath();
        hiddenCtx.arc(160, 100, this.size + (this.size / 3), 0, 2 * Math.PI);
        hiddenCtx.fill();

        hiddenCtx.fillStyle = this.color1;
        hiddenCtx.beginPath();
        hiddenCtx.arc(160, 100, this.size, 0, 2 * Math.PI);
        hiddenCtx.fill();

        hiddenCtx.fillStyle = this.color2;
        hiddenCtx.beginPath();
        hiddenCtx.arc(160, 100, (this.size / 2), 0, 2 * Math.PI);
        hiddenCtx.fill();

        hiddenCtx.fillStyle = this.color1;
        hiddenCtx.beginPath();
        hiddenCtx.arc(160, 100, (this.size / 3) + 10, 0, 2 * Math.PI);
        hiddenCtx.fill();
        if (this.reverse) {
          if (this.size - 5 > 0) {
            this.size -= 5;
          }
        } else {
          this.size += 5;
        }
      }
      hiddenCtx.globalAlpha = 1
      if (this.elapsed > this.duration || (character == "Vantage" && color[0] > 180 && color[0] < 225 && color[1] > 25 && color[1] < 50 && color[2] > 75 && color[2] < 100)) {
        this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
        gZGoing = false;
      }
    };
  }

  function hexToHSL(hex) {
    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);

    var r = parseInt(result[1], 16);
    var g = parseInt(result[2], 16);
    var b = parseInt(result[3], 16);

    (r /= 255), (g /= 255), (b /= 255);
    var max = Math.max(r, g, b),
      min = Math.min(r, g, b);
    var h,
      s,
      l = (max + min) / 2;

    if (max === min) {
      h = s = 0; // achromatic
    } else {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r:
          h = (g - b) / d + (g < b ? 6 : 0);
          break;
        case g:
          h = (b - r) / d + 2;
          break;
        case b:
          h = (r - g) / d + 4;
          break;
      }
      h /= 6;
    }

    s = s * 100;
    s = Math.round(s);
    l = l * 100;
    l = Math.round(l);
    h = Math.round(360 * h);

    return [h, s, l];
  }
  function SparkleEffect(hue, saturation, lightness, size) {
    this.x = Math.random() * 320;
    this.y = Math.random() * 200;
    this.hue = hue;
    this.saturation = saturation;
    this.lightness = lightness;
    this.lifetime = 40;
    this.size = size;
    this.draw = function () {
      hiddenCtx.fillStyle = 'hsl(' + this.hue + ',' + this.saturation + '%,' + this.lightness + '%)';
      hiddenCtx.fillRect(this.x, this.y, this.size, this.size);
      this.lifetime--;
    };
  }
  //#endregion


  function Meter(count, callback) {
    this.size = count;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    var values = [];

    this.setValue = function (updatedValue) {
      // Add and shift.
      values.push(updatedValue);
      if (values.length > this.size) {
        values.shift();
      }

      // Exit early if we've got a long-term match.
      for (var i = 0; i < values.length - 1; i++) {
        if (values[i] !== values[i + 1]) return;
      }

      // We got here, so we've got a matching value collection.
      if (this.value !== values[0]) {
        //var fromZero = this.value === 0;
        //var toZero = values[0] === 0;
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        callback();
      }
    };
  }
  
  window.requestAnimationFrame(update)
