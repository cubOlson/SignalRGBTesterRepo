<body style="margin: 0; padding: 0; background: #000;">
    <canvas id="exCanvas" width="320" height="200"></canvas>
</body>
  
<script>
    // Canvas initialization
    var canvas, ctx;
    canvas = document.getElementById('exCanvas');
    ctx = canvas.getContext('2d');
    var width = 320;
    var height = 200;
    var effects = [];
    var hiddenCanvas = document.createElement("canvas");
    hiddenCanvas.width = width;
    hiddenCanvas.height = height;
    var hctx = hiddenCanvas.getContext("2d");
    let gSensor = 0;
    let gAlpha = 1


    var gInGame = false
    var lowHealthGoing = false

    var inGameBlue1Meter = new Meter(5, inGameCallback);
    var inGameBlue2Meter = new Meter(5, inGameCallback);
    var healthRedBarMeter = new Meter(5,healthCallback);
    var healthRedBar1Meter = new Meter(5,healthCallback);
    var healthRedBar2Meter = new Meter(5,healthCallback);
    var healthRedConfirm1Meter = new Meter(5,healthCallback);
    var healthRedConfirm2Meter = new Meter(5,healthCallback);
    var teleportBlackShieldMeter = new Meter(5,teleportCallback);
    var teleportWhiteMeter = new Meter(5,teleportCallback);
    var bossRedBarMeter = new Meter(5,bossCallback);
    var bossRedConfirmMeter = new Meter(5,bossCallback);
    var missionSuccessWhiteMeter = new Meter(5,missionCallback);
    var missionSuccessGreenMeter = new Meter(5,missionCallback);
    var deathRedMeter = new Meter(5,deathCallback);
    var deathWhiteMeter = new Meter(5,deathCallback);
    var dragonBarPurpleMeter = new Meter(5,dragonCallback)
    var dialogueBlackDownMeter = new Meter(5,dialogueCallback)
    var dialogueWhiteMeter = new Meter(5,dialogueCallback)
    var levelYellowMeter = new Meter(5, levelCallback)
    var levelNotYellowMeter = new Meter(5, levelCallback)
    var questOrangeMeter = new Meter(5, questCallback)
    var questNotOrangeMeter = new Meter(5, questCallback)




    //#region Update
    function update() {
      hctx.clearRect(0, 0, hiddenCanvas.width, hiddenCanvas.height);
      hctx.fillStyle = `hsla(0, 0%, 0%, ${gAlpha})`;
      hctx.fillRect(0, 0, 320, 200);
      backgroundHandler()
  
      inGameBlue1Meter.setValue(engine.vision.inGameBlue1)
      inGameBlue2Meter.setValue(engine.vision.inGameBlue2)
      healthRedBarMeter.setValue(engine.vision.healthRedBar1 + engine.vision.healthRedBar2)
      healthRedBar1Meter.setValue(engine.vision.healthRedBar1)
      healthRedBar2Meter.setValue(engine.vision.healthRedBar2)
      healthRedConfirm1Meter.setValue(engine.vision.healthRedConfirm1)
      healthRedConfirm2Meter.setValue(engine.vision.healthRedConfirm2)
      teleportBlackShieldMeter.setValue(engine.vision.teleportBlackShield)
      teleportWhiteMeter.setValue(engine.vision.teleportWhite)
      bossRedBarMeter.setValue(engine.vision.bossRedBar)
      bossRedConfirmMeter.setValue(engine.vision.bossRedConfirm)
      missionSuccessWhiteMeter.setValue(engine.vision.missionSuccessWhite)
      missionSuccessGreenMeter.setValue(engine.vision.missionSuccessGreen)
      deathRedMeter.setValue(engine.vision.deathRed)
      deathWhiteMeter.setValue(engine.vision.deathWhite)
      dragonBarPurpleMeter.setValue(engine.vision.dragonBarPurple)
      dialogueBlackDownMeter.setValue(engine.vision.dialogueBlackDown)
      dialogueWhiteMeter.setValue(engine.vision.dialogueWhite)
      levelYellowMeter.setValue(engine.vision.levelYellow)
      levelNotYellowMeter.setValue(engine.vision.levelNotYellow)
      questOrangeMeter.setValue(engine.vision.questOrange)
      questNotOrangeMeter.setValue(engine.vision.questNotOrange)

     

      //Effect handler 
      for (let i = 0; i < effects.length; i++) {
        effects[i].draw();
      }
      // Remove dead effects with filter
      effects = effects.filter(ele =>
        ele.lifetime === undefined || ele.lifetime > 0
      );

      ctx.clearRect(0, 0, width, height);
      ctx.drawImage(hiddenCanvas, 0, 0);

      window.requestAnimationFrame(update);
    };
    //#endregion
    //#region Background Modes
    // Background Configuration
    let proBack = [0, 0, 0];
    function onbackColorChanged() {
        proBack = hexToHSL(backColor);
    }

    // Audio and Color Cycle State
    let audioEase = { sat: 0, lit: 0 };
    let gCycle = 0;
    
    // Background Utility Functions
    function updateAudioEase() {
        const targetDensity = engine.audio.density * 100;
        audioEase.sat += (targetDensity - audioEase.sat) / 10;
        audioEase.lit += (targetDensity - audioEase.lit) / 10;
    }

    function getColorString(hue, sat, lit, alpha) {
        return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`;
    }

    function updateColorCycle() {
        gCycle = (gCycle + 0.5) % 360;
    }

    // Main Background Handler
    function backgroundHandler() {
        const alpha = ambienceAlpha / 100;

        // Handle color cycling first if needed
        if (backgroundMode.includes("Color Cycle")) {
            updateColorCycle();
        }

        // Handle audio processing if needed
        if (backgroundMode.includes("Audio")) {
            updateAudioEase();
        }

        // Render background based on mode
        if (backgroundMode.includes("Ambience")) {
            if (backgroundMode === "Ambience Audio Visualizer") {
                copyScreenAudio(alpha);
            } else {
                copyScreen(alpha);
            }
            return;
        }

        // Handle custom and cycle modes
        const hue = proBack[0] + (backgroundMode.includes("Color Cycle") ? gCycle : 0);
        const sat = backgroundMode.includes("Audio") ? audioEase.sat * 0.33 + 66 : proBack[1];
        const lit = backgroundMode.includes("Audio") ? audioEase.lit * 0.9 + 10 : proBack[2];
        
        DrawRect(0, 0, 320, 200, getColorString(hue, sat, lit, alpha));
    }

    // Zone Configuration Constants
    const ZONE_COLS = 28;
    const ZONE_ROWS = 20;
    const TOTAL_ZONES = ZONE_COLS * ZONE_ROWS;

    function copyScreenAudio(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat = new Int8Array(engine.zone.saturation)
        const hue = new Int16Array(engine.zone.hue)
        
        const width = 320 / ZONE_COLS
        const height = 200 / ZONE_ROWS
        
        // Use the global audioEase values we already calculated
        const satMultiplier = audioEase.sat / 200 + 0.5
        const litMultiplier = audioEase.lit / 100

        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const x = col * width
            const y = row * height
            
            hctx.fillStyle = getColorString(
                hue[iZone],
                sat[iZone] * satMultiplier,
                lightness[iZone] * litMultiplier,
                alpha
            )
            hctx.fillRect(x, y, width, height)
        }
    }
  
    function copyScreen(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat = new Int8Array(engine.zone.saturation)
        const hue = new Int16Array(engine.zone.hue)
        
        const width = 320 / ZONE_COLS
        const height = 200 / ZONE_ROWS
        
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const x = col * width
            const y = row * height
            
            const finalHue = backgroundMode === "Custom Ambience" 
                ? proBack[0] 
                : hue[iZone] + (backgroundMode === "Color Cycle Ambience" ? gCycle : 0)
            
            hctx.fillStyle = getColorString(
                finalHue,
                sat[iZone],
                lightness[iZone],
                alpha
            )
            hctx.fillRect(x, y, width, height)
        }
    }
    //#endregion  
    //#region callbacks

    function inGameCallback(){
      if((inGameBlue1Meter.value >= 0.95 || inGameBlue2Meter.value >= 0.95 ) && engine.vision.inGameNotBlue <.1){
        gInGame = true
        console.log("inGame")
      }else{
        gInGame = false
        console.log("notInGame")

      }
    }
    var lowHealthActive = false;
    
    function healthCallback(){
      if(gInGame && healthRedBarMeter.increased && healthRedBarMeter.diff >.1 && (healthRedConfirm1Meter.value >= .95 || healthRedConfirm2Meter.value >= .95) && engine.vision.healthNotRed <.1){
        console.log("Heal effect")
        effects.push(new HealPulse())
      }
      if(gInGame && healthRedBarMeter.decreased && healthRedBarMeter.diff >.1 && (healthRedConfirm1Meter.value >= .95 || healthRedConfirm2Meter.value >= .95) && engine.vision.healthNotRed <.1){
        console.log("Hit effect")
        effects.push(new HitFlash())
      }
      if(gInGame && (healthRedBar1Meter.value <.25 && healthRedBar2Meter.value <.25 ) && (healthRedConfirm1Meter.value >= .95 || healthRedConfirm2Meter.value >= .95) && engine.vision.healthNotRed <.1){
        if (!lowHealthActive) {
            console.log("Low Health effect")
            effects.push(new LowHealthBeat())
            lowHealthActive = true;
          }

      } else {
        lowHealthActive = false;
      }
      
    }
    var teleportActive = false;
    function teleportCallback(){
      if(!gInGame && teleportBlackShieldMeter.value >= .95 && teleportWhiteMeter.value >= .95){
        if (!teleportActive) {
        console.log("Teleport Effect")
        effects.push(new TeleportBurst())
        teleportActive = true
      }
 
      }
        
      
    }

    function bossCallback(){
      if(gInGame && bossRedBarMeter.value >=.95 && bossRedConfirmMeter.value >=.95){
        console.log("Boss Effect")
        effects.push(new BossCorruptionEntry())
      }
    }

    function missionCallback(){
      if(missionSuccessWhiteMeter.value >=.25 && missionSuccessGreenMeter.value >=.95){
        console.log("Mission success Effect")
        effects.push(new MissionSuccessMagic())
      }
    }

    var deathActive = false;

    function deathCallback() {

      if (!gInGame && deathRedMeter.value >= .2 && deathWhiteMeter.value >= .1 && engine.vision.deathNotRed < .1) {

        if (!deathActive) {
          console.log("Death Effect")
          effects.push(new DeathMagicalShatter())
          deathActive = true;
        }

      } else {
        deathActive = false;
      }
    }

    var dragonActive = false;
    function dragonCallback(){
      if(gInGame && dragonBarPurpleMeter.value >=.95 && engine.vision.dragonNotPurple <.1){
        if (!deathActive) {
        console.log('dragon effect')
        effects.push(new DragonPetEffect())
        dragonActive = true;
      }
      }else {
        dragonActive = false;
      }
    }

    var dialogueActive = false;
    function dialogueCallback(){
      if(!gInGame && dialogueBlackDownMeter.value >=.95 && dialogueWhiteMeter.value >.15){
        if (!dialogueActive) {
        console.log("dialogue effect")
        effects.push(new DialogueEffect())
        dialogueActive = true
        }
      }else {
        dialogueActive = false;
      }
    }

    var levelActive = false;
    var levelgoing = false;
    function levelCallback() {
      if(gInGame && levelYellowMeter.value >= .95 && engine.vision.levelNotYellow < .1) levelActive = true
      else if (gInGame && levelYellowMeter.value <= .05 && engine.vision.levelNotYellow < .1 && levelActive && !levelgoing){
        levelActive = false
        effects.push(new LevelUp())
        levelgoing = true
      }
    }

    var questActive = false;
    var questgoing = false;
    function questCallback() {
      if(gInGame && questOrangeMeter.value >= .95 && engine.vision.questNotOrange < .1) questActive = true
      else if (gInGame && questOrangeMeter.value <= .05 && engine.vision.questNotOrange < .1 && questActive && !questgoing){
        questActive = false
        effects.push(new QuestCompleted())
        questgoing = true
      }
    }

    function DialogueEffect() {
      this.lifetime = 1;
      this._dead = false;
      this._particles = [];
      this._bgAlpha = 0; 

      this._spawn = function () {
          this._particles.push({
              x: -10,
              y: Math.random() * 200,
              speed: 1.5 + Math.random() * 2.5,
              radius: 1.5 + Math.random() * 3,
              alpha: 0.6 + Math.random() * 0.4,
              pulse: Math.random() * Math.PI * 2
          });
      };

      this.draw = function () {
          if (dialogueWhiteMeter.value < 0.1 || gInGame) {
              this.lifetime = 0;
              return;
          }

          this._bgAlpha = Math.min(0.75, this._bgAlpha + 0.03);
          hctx.fillStyle = `hsla(0, 0%, 0%, ${this._bgAlpha})`;
          hctx.fillRect(0, 0, 320, 200);

          if (Math.random() < 0.6) this._spawn();
          if (Math.random() < 0.3) this._spawn();

          for (var i = this._particles.length - 1; i >= 0; i--) {
              var p = this._particles[i];
              p.x += p.speed;
              p.pulse += 0.15;

              var glow = p.alpha * (0.7 + Math.sin(p.pulse) * 0.3);

              if (p.x > 330) {
                  this._particles.splice(i, 1);
                  continue;
              }


              var grad = hctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 3);
              grad.addColorStop(0, `hsla(0, 0%, 100%, ${glow * 0.6})`);
              grad.addColorStop(1, `hsla(0, 0%, 100%, 0)`);
              hctx.fillStyle = grad;
              hctx.fillRect(p.x - p.radius*3, p.y - p.radius*3, p.radius*6, p.radius*6);


              hctx.beginPath();
              hctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
              hctx.fillStyle = `hsla(0, 0%, 100%, ${glow})`;
              hctx.fill();
          }
      };
  }

    function HitFlash() {
      this.lifetime = 1;
      this._tick = 0;

      this.draw = function () {
        this._tick++;
        let t = this._tick / 80;

        let alpha = 1 - t;
        let yOffset = t * 250;

        if ((-80 + yOffset > 200) || !gInGame) {
            this.lifetime = 0;
        }

        let radius = 120 + t * 180;
        let layers = [
            { r: radius,      a: alpha * 0.9 },
            { r: radius - 30, a: alpha * 0.6 },
            { r: radius - 60, a: alpha * 0.4 }
        ];

        layers.forEach(layer => {
            DrawArc(160, -80 + yOffset, Math.PI * 0.1, Math.PI * 0.9,
                layer.r, false, `hsla(0, 100%, 45%, ${layer.a})`);
        });
      };
    }
    

    function HealPulse() {
      this.lifetime = undefined;
      this._tick = 0;

      this.draw = function () {
        this._tick++;
        let t = this._tick / 80;

        let alpha = 1 - t;
        let yOffset = t * 250;

        if ((200 + 80 - yOffset < 0) || !gInGame) {
            this.lifetime = 0;
            return;
        }

        let radius = 120 + t * 180;
        let layers = [
            { r: radius,      a: alpha * 0.9 },
            { r: radius - 30, a: alpha * 0.6 },
            { r: radius - 60, a: alpha * 0.4 }
        ];

        layers.forEach(layer => {
            DrawArc(160, 200 + 80 - yOffset, Math.PI * 1.1, Math.PI * 1.9,
                layer.r, false, `hsla(120, 80%, 50%, ${layer.a})`);
        });
      };
    }

   function LowHealthBeat() {
      this.lifetime = 1;
      this._phase = 0;
      this._fadeOut = 0;

      this.draw = function () {

        let period = 40;

        this._phase = (this._phase + (Math.PI * 2 / period)) % (Math.PI * 2);

        let beat =
          Math.max(0, Math.sin(this._phase)) * 0.7 +
          Math.max(0, Math.sin(this._phase - 0.4)) * 0.3;

        let alpha = beat * 0.7;

        if (!gInGame || (healthRedBarMeter.value > .3 && (healthRedConfirm1Meter.value >=.95 || healthRedConfirm2Meter.value >=.95 )) || (healthRedBarMeter.value <.1 && (healthRedConfirm1Meter.value <.1 || healthRedConfirm2Meter.value <.1 )) ) {
          this._fadeOut = Math.min(this._fadeOut + 1, 30);
          alpha *= (1 - this._fadeOut / 30);

          if (this._fadeOut >= 30) {
            this.lifetime = 0;
          }
        }

        let glow = hctx.createRadialGradient(160, 100, 40, 160, 100, 130);

        glow.addColorStop(0, `hsla(0, 100%, 55%, 0)`);
        glow.addColorStop(0.6, `hsla(0, 100%, 50%, ${alpha * 2})`);
        glow.addColorStop(1, `hsla(0, 100%, 45%, ${alpha})`);

        hctx.fillStyle = glow;
        hctx.fillRect(0, 0, 320, 200);
      };
    }

    function MissionSuccessMagic() {
      this.lifetime = 100;
      this._fadeOut = 0;

      this.draw = function () {
        if (!gInGame || this.lifetime <= 0) {
          this._fadeOut = Math.min(this._fadeOut + 1, 30);
        }

        let fadeFactor = 1 - (this._fadeOut / 30);

        if (fadeFactor <= 0) {
          this.lifetime = 0;
          return;
        }
        hctx.fillStyle = `rgba(0,0,0,${0.85 * fadeFactor})`;
        hctx.fillRect(0, 0, 320, 200);
        let t = 1 - (this.lifetime / 100);
        let cx = 160;
        let cy = 100;
        let spinT  = Math.min(1, t / 0.65);
        let burstT = Math.max(0, (t - 0.65) / 0.35);
        let arms = 3;

        for (let a = 0; a < arms; a++) {

          let baseAngle = (a / arms) * Math.PI * 2;

          let prev = null;

          for (let i = 0; i < 50; i++) {

            let p = i / 50;
            let angle = baseAngle + p * 4 - spinT * Math.PI * 2;
            let radius = 140 * (1 - p) * (1 - burstT);
            let noise = Math.sin((p * 8) + (t * 6) + a) * 6;
            let x = cx + Math.cos(angle) * (radius + noise);
            let y = cy + Math.sin(angle) * (radius + noise);
            let alpha = (1 - p) * 0.7 * (1 - burstT);

            if (prev) {
              DrawLine(
                prev,
                [x, y],
                `hsla(120, 100%, 50%, ${alpha})`,
                6
              );
            }

            prev = [x, y];
          }
        }


        if (t > 0.5) {

          let pull = (t - 0.5) / 0.5;

          for (let i = 0; i < 25; i++) {

            let angle = Math.random() * Math.PI * 2;
            let dist = 200 * (1 - pull);

            let x = cx + Math.cos(angle) * dist;
            let y = cy + Math.sin(angle) * dist;

            DrawCircle(
              x,
              y,
              3,
              `hsla(120, 1000%, 50%, ${0.6 * (1 - pull)})`
            );
          }
        }

        if (burstT > 0) {

          let r = burstT * 260;

          let flash = hctx.createRadialGradient(cx, cy, 0, cx, cy, r);

          flash.addColorStop(0, `hsla(120, 100%, 55%, ${0.9 * (1 - burstT)})`);
          flash.addColorStop(0.4, `hsla(120, 90%, 50%, ${0.6 * (1 - burstT)})`);
          flash.addColorStop(1, `hsla(120, 90%, 40%, 0)`);

          hctx.fillStyle = flash;
          hctx.fillRect(0, 0, 320, 200);
        }

        this.lifetime--;
        
      };
    }

    function DeathMagicalShatter() {
      this.lifetime = 180;
      this.total    = 180;
      this._dead    = false;
      this._killing = false;
      this._flashAlpha = 0;
      this._fragments  = [];

      var fragmentCount = 16 + Math.floor(Math.random() * 5);
      for (var i = 0; i < fragmentCount; i++) {
          var angle    = (Math.PI * 2 * i / fragmentCount) + (Math.random() - 0.5) * 0.4;
          var speed    = 1.5 + Math.random() * 2.5;
          var size     = 25 + Math.random() * 40;
          var rotSpeed = (Math.random() - 0.5) * 0.12;
          var colors   = [
              'rgb(180, 20, 20)',
              'rgb(140, 0, 0)',
              'rgb(220, 30, 30)',
              'rgb(100, 0, 0)',
              'rgb(200, 10, 10)',
              'rgb(80, 0, 0)'
          ];
          this._fragments.push({
              x: 160, y: 50,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              size: size,
              rotation: 0,
              rotSpeed: rotSpeed,
              alpha: 1,
              color: colors[Math.floor(Math.random() * colors.length)]
          });
      }

      this.kill = function () { this._killing = true; };

      this.draw = function () {
          if (this._dead) return;
          if (this.lifetime <= 0 || gInGame) {
              this._dead = true;
              this.lifetime = 0;
              return;
          }

          var progress = 1 - (this.lifetime / this.total);

          if (progress < 0.15) {
              this._flashAlpha = Math.sin(progress / 0.15 * Math.PI) * 0.9;

              hctx.fillStyle = `hsla(5, 90%, 20%, ${this._flashAlpha})`;
              hctx.fillRect(0, 0, 320, 200);

              var core = hctx.createRadialGradient(160, 100, 0, 160, 100, 200);
              core.addColorStop(0, `hsla(0, 100%, 50%, ${this._flashAlpha * 0.5})`);
              core.addColorStop(1, `hsla(5, 90%, 15%, 0)`);
              hctx.fillStyle = core;
              hctx.fillRect(0, 0, 320, 200);
          }

          if (progress > 0.1) {
              var shatterProgress = Math.min(1, (progress - 0.1) / 0.9);

              for (var i = 0; i < this._fragments.length; i++) {
                  var f = this._fragments[i];
                  f.x  += f.vx;
                  f.y  += f.vy;
                  f.vy += 0.08;
                  f.rotation += f.rotSpeed;
                  f.alpha = Math.max(0, 1 - shatterProgress);

                  hctx.save();
                  hctx.translate(f.x, f.y);
                  hctx.rotate(f.rotation);
                  hctx.globalAlpha = f.alpha;
                  hctx.fillStyle   = f.color;
                  hctx.beginPath();
                  hctx.moveTo(0,          -f.size / 2);
                  hctx.lineTo(f.size / 2, -f.size / 4);
                  hctx.lineTo(f.size / 3,  f.size / 2);
                  hctx.lineTo(-f.size / 3, f.size / 3);
                  hctx.lineTo(-f.size / 2, -f.size / 3);
                  hctx.closePath();
                  hctx.fill();
                  hctx.strokeStyle = `rgba(60, 0, 0, 0.8)`;
                  hctx.lineWidth   = 1;
                  hctx.stroke();

                  hctx.restore();
              }
          }
          
          this.lifetime--;
      };
    }

    function TeleportBurst() {
      this.lifetime = 350;
      this.total = 350;

      this.draw = function () {

        let t = 1 - (this.lifetime / this.total);

        let cx = 160;
        let cy = 100;
        let chargeT = Math.min(1, t / 0.7);
        let burstT  = Math.max(0, (t - 0.6) / 0.4);
        let pullEase = Math.pow(chargeT, 0.7);
        let circleRadius = 120 * (1 - pullEase);

        if (circleRadius > 6) { 
          let circle = hctx.createRadialGradient(cx, cy, 0, cx, cy, circleRadius);
          circle.addColorStop(0, `hsla(30,100%,60%,0.4)`);
          circle.addColorStop(1, `hsla(30,100%,50%,0)`);

          hctx.fillStyle = circle;
          hctx.fillRect(0, 0, 320, 200);
        }

        let portalAlpha = 0.5 * (1 - chargeT * 0.6);

        DrawEllipse(cx, cy + 40, 90, 25, 0,
          `hsla(30,100%,50%,${portalAlpha})`
        );

        DrawEllipse(cx, cy - 40, 90, 25, 0,
          `hsla(30,100%,50%,${portalAlpha * 0.5})`
        );

        let rotation = (1 - Math.pow(1 - chargeT, 2)) * Math.PI * 2;
        let zoomBase = 1 + burstT * 4;
        let stretchX = 1 + Math.pow(burstT, 2.2) * 100;
        let stretchY = 1 + burstT * 4;

        hctx.save();
        hctx.translate(cx, cy);
        hctx.scale(zoomBase * stretchX, zoomBase * stretchY);
        hctx.rotate(rotation);

        let size = 40 + (chargeT * 60) + (burstT * 420);

        strokeRect(
          -size / 2,
          -size / 2,
          size,
          size,
          `hsla(30,100%,60%,0.9)`,
          4
        );

        let coreW = 10;
        let coreH = 30;

        hctx.fillStyle = "white";
        hctx.fillRect(
          -coreW / 2,
          -coreH / 2,
          coreW,
          coreH
        );

        hctx.restore();

        if (pullEase < 0.95) {
          for (let i = 0; i < 20; i++) {
              let angle = Math.random() * Math.PI * 2;
              let dist = 140 * (1 - pullEase);
              let x = cx + Math.cos(angle) * dist;
              let y = cy + Math.sin(angle) * dist;
              DrawCircle(x, y, 4, `hsla(40,100%,80%,${0.4 * (1 - pullEase)})`);
          }
      }
        if (burstT > 0.45) {
          this.lifetime = 0;
          teleportActive = false
          return;
        }

        this.lifetime--;
      };
    }

    function BossCorruptionEntry() {
        this.lifetime = 90
        this.total    = 90;

        this.draw = function () {
            var t = 1 - (this.lifetime / this.total);
            var r = t * 280;
            var ringAlpha = Math.sin(t * Math.PI) * 0.9;
            var ring = hctx.createRadialGradient(160, 100, Math.max(0, r - 70), 160, 100, r);
            ring.addColorStop(0,   `hsla(280, 80%, 28%,  0)`);
            ring.addColorStop(0.5, `hsla(270, 90%, 32%, ${ringAlpha})`);
            ring.addColorStop(0.8, `hsla(5,   90%, 35%, ${ringAlpha * 0.8})`);
            ring.addColorStop(1,   `hsla(280, 80%, 25%,  0)`);
            hctx.fillStyle = ring;
            hctx.fillRect(0, 0, 320, 200);
            hctx.fillStyle = `hsla(270, 60%, 5%, ${Math.sin(t * Math.PI) * 0.4})`;
            hctx.fillRect(0, 0, 320, 200);

            this.lifetime--;
        };
    }

   function DragonPetEffect() {
      this.lifetime = 9999;
      this.frames = [
        dragonpath1, dragonpath2, dragonpath3, dragonpath4, dragonpath5
      ];

      this.alpha = 1;
      this.fadeSpeed = 0.05;

      this.isDying = false; 

      this.draw = function () {

        if (dragonBarPurpleMeter.value < .1 || !gInGame) {
          this.isDying = true;
        }

        if (this.isDying) {
          this.alpha -= this.fadeSpeed;

          if (this.alpha <= 0) {
            this.lifetime = 0;
            return;
          }
        }

        let time = Date.now();
        let frameIndex = Math.floor(time / 120) % this.frames.length;

        let cx = 10; 
        let cy = 10;

        let floatY = Math.sin(time * 0.003) * 5;

        DrawPath(
          cx,
          cy + floatY,
          this.frames[frameIndex],
          `rgba(160, 60, 255, ${this.alpha})`,
          0.6,
          0.6
        );
      };
    }

    // LevelUp: golden isometric cube with radiating energy rings, fades over 270 frames.
    function LevelUp() {
        this.lifetime = 270;
        this.total    = 270;

        this.draw = function () {
            let t  = 1 - (this.lifetime / this.total);
            let cx = 160, cy = 100;
            let s  = 50;

            // fade in 0–18%, hold, fade out 70–100%
            let fadeIn  = Math.min(1, t / 0.18);
            let fadeOut = t > 0.7 ? 1 - (t - 0.7) / 0.3 : 1;
            let alpha   = fadeIn * fadeOut;

            // dark yellow/orange ring radiates outward from center, starts at t=0.2
            if (t > 0.2) {
                let radT     = Math.min(1, (t - 0.2) / 0.5);
                let radius   = 25 + radT * 230;
                let innerR   = radius * 0.35;
                let radAlpha = alpha * 0.6 * (1 - radT * 0.5);

                let grd = hctx.createRadialGradient(cx, cy, innerR, cx, cy, radius);
                grd.addColorStop(0,    `hsla(50,  90%, 20%, 0)`);
                grd.addColorStop(0.35, `hsla(45,  95%, 28%, ${radAlpha * 0.8})`);
                grd.addColorStop(0.7,  `hsla(33, 100%, 33%, ${radAlpha})`);
                grd.addColorStop(1,    `hsla(22,  85%, 18%, 0)`);
                hctx.fillStyle = grd;
                hctx.fillRect(0, 0, 320, 200);
            }

            // isometric cube — 7 visible vertices
            var p0 = [cx,      cy - s       ]; // top
            var p1 = [cx - s,  cy - s * 0.5 ]; // top-left
            var p2 = [cx + s,  cy - s * 0.5 ]; // top-right
            var p3 = [cx,      cy            ]; // center
            var p4 = [cx - s,  cy + s * 0.5 ]; // bottom-left
            var p5 = [cx + s,  cy + s * 0.5 ]; // bottom-right
            var p6 = [cx,      cy + s        ]; // bottom

            // 9 structural outline edges
            var lines = [
                [p0, p1], [p0, p2],
                [p1, p3], [p2, p3], [p3, p6],
                [p1, p4], [p2, p5],
                [p4, p6], [p5, p6]
            ];

            // 3 parallel interior lines per face (at 1/4, 1/2, 3/4 of each face)
            [0.25, 0.5, 0.75].forEach(function (tv) {
                lines.push([[cx - tv*s,      cy - s + tv*s*0.5     ], [cx + s*(1-tv), cy - s*0.5 + tv*s*0.5]]);
                lines.push([[cx - s,         cy - s*0.5 + tv*s     ], [cx,            cy + tv*s             ]]);
                lines.push([[cx + s*(1-tv),  cy - s*0.5 + tv*s*0.5 ], [cx + s*(1-tv), cy + s*0.5 + tv*s*0.5]]);
            });

            var colGlow = `hsla(52, 100%, 58%, ${alpha * 0.25})`;
            var colCore = `hsla(52, 100%, 68%, ${alpha})`;

            lines.forEach(function (ln) {
                DrawLine(ln[0], ln[1], colGlow, 5);
                DrawLine(ln[0], ln[1], colCore, 1.5);
            });

            this.lifetime--;
            if (this.lifetime <= 0) levelgoing = false;
        };
    }

    // QuestCompleted: orange circle with animated green checkmark, fades over 210 frames.
    function QuestCompleted() {
        this.lifetime = 210;
        this.total    = 210;

        this.draw = function () {
            let t  = 1 - (this.lifetime / this.total);
            let cx = 160, cy = 100;
            let r  = 55;

            // fade in 0–20%, hold, fade out 72–100%
            let fadeIn  = Math.min(1, t / 0.2);
            let fadeOut = t > 0.72 ? 1 - (t - 0.72) / 0.28 : 1;
            let alpha   = fadeIn * fadeOut;

            // 25% black background overlay
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${alpha * 0.25})`);

            // orange circle with subtle outer glow and dark border
            DrawCircle(cx, cy, r + 9, `hsla(28, 100%, 50%, ${alpha * 0.15})`);
            DrawCircle(cx, cy, r,     `hsla(25, 100%, 50%, ${alpha})`);
            DrawStroke(cx, cy, r,     `hsla(30, 100%, 35%, ${alpha * 0.55})`, 3);

            // checkmark draws in two segments from t=0.2 to t=0.65
            let checkProgress = t < 0.2 ? 0 : Math.min(1, (t - 0.2) / 0.45);

            if (checkProgress > 0) {
                let A = [cx - r * 0.90,  cy + r * 0.03]; // left start
                let B = [cx - r * 0.225, cy + r * 0.75]; // bottom vertex
                let C = [cx + r * 0.90,  cy - r * 0.75]; // upper-right end

                let lw = r * 0.15;

                hctx.save();
                hctx.lineCap  = 'round';
                hctx.lineJoin = 'round';

                hctx.beginPath();
                hctx.moveTo(A[0], A[1]);
                if (checkProgress < 0.38) {
                    let p = checkProgress / 0.38;
                    hctx.lineTo(A[0] + (B[0] - A[0]) * p, A[1] + (B[1] - A[1]) * p);
                } else {
                    let p2 = (checkProgress - 0.38) / 0.62;
                    hctx.lineTo(B[0], B[1]);
                    hctx.lineTo(B[0] + (C[0] - B[0]) * p2, B[1] + (C[1] - B[1]) * p2);
                }

                // glow pass
                hctx.strokeStyle = `hsla(120, 100%, 55%, ${alpha * 0.3})`;
                hctx.lineWidth   = lw * 2.5;
                hctx.stroke();

                // core pass (same path, no beginPath)
                hctx.strokeStyle = `hsla(120, 100%, 55%, ${alpha})`;
                hctx.lineWidth   = lw;
                hctx.stroke();

                hctx.restore();
            }

            this.lifetime--;
            if (this.lifetime <= 0) questgoing = false;
        };
    }

    //#endregion

  //#region Helper Functions
  function innerEffects(){
        this.effects = []
        this.Add = (cb, arr) => {
            this.effects.push(new cb(...arr))
        }
        this.draw = () => {
            this.effects.forEach((ele, i)=>{
                ele.draw()
                if(ele.lifetime <= 0) this.effects.splice(i, 1)
            })
        }
    }

    function testTranslate(start, end, rot, scaleX, scaleY){
        hctx.save()
        hctx.translate(start[0], start[1])
        hctx.scale(scaleX, scaleY)
        hctx.rotate(rot)
        hctx.translate(end[0], end[1])
    }

  function DrawArc(x, y, start, end, radius, direction, color){
    hctx.beginPath()
    hctx.arc(x, y, radius, start, end, direction)
    hctx.fillStyle = color
    hctx.fill()
  }

  function DrawLine(start, end, color, stroke){
    hctx.beginPath()
    hctx.moveTo(start[0], start[1])
    hctx.lineTo(end[0], end[1])
    hctx.strokeStyle = color
    hctx.lineWidth = stroke
    hctx.stroke()
  }

  function drawRadialGradient(color1, color2, inneRadius, fade) {
      hctx.beginPath();
      let gradient = hctx.createRadialGradient(160, 100, inneRadius, 160, 100, inneRadius + fade)
      gradient.addColorStop(0, color1);
      gradient.addColorStop(1, color2);
      hctx.fillStyle = gradient;
      hctx.fillRect(0, 0, 320, 200);
  }

  function DrawEllipse(x, y, width, height, rotation, color){
    hctx.beginPath()
    hctx.ellipse(x, y, width, height, rotation, 0, Math.PI * 2)
    hctx.fillStyle = color
    hctx.fill()
  }

  
  function lightning(size, color, width){
      this.points = [];
      this.color = color
      this.width = width
      while(this.points.length <= size){
        this.points.push([this.points.length * (350 / size) - 25, 100])
      }
      this.draw = function(){
        drawLightning(this.points, this.color, this.width)
        this.points.forEach((ele, i)=>{
          var mod = Math.sin(Date.now() / (100000 * Math.random()))
          switch(i){
            case 0:
              this.points[i][1] < 90 ? this.points[i][1]+=2 : 
                this.points[i][1] > 110 ? this.points[i][1]-=2 : 
                  this.points[i][1] += mod * 10;
              break;
            case this.points.length - 1:
              this.points[i - 1][1] - this.points[i][1] < -30 ? this.points[i][1]-=5 : 
                  this.points[i - 1][1] - this.points[i][1] > 30 ? this.points[i][1]+=5 : 
                      this.points[i][1] += mod * 10;
              break;
            default:
              this.points[i - 1][1] - this.points[i][1] < -30 ? this.points[i][1]-=5 : 
                this.points[i - 1][1] - this.points[i][1] > 30 ? this.points[i][1]+=5 : 
                    this.points[i][1] += mod * 10;
              this.points[i][0] < i * (320 / this.points.length) ? this.points[i][0]+=5 : 
                this.points[i][0] > i * (320 / this.points.length) + (320 / this.points.length) ? this.points[i][0]-=5 : 
                    this.points[i][0] += mod * 10;
              break;
          }
        })
      }
    }

  function DrawLightning(array, color, width){
      hctx.beginPath()
      hctx.moveTo(...array[0])
      array.forEach((ele, i)=>{
        if(i){
          hctx.lineTo(...array[i])
        }
      });
      hctx.strokeStyle = color;
      hctx.lineJoin = "round";
      hctx.lineWidth = width + Math.random() * width;
      hctx.stroke()
  }

  function DrawGear(x, y, radius, stroke, teeth, color){
    DrawStroke(x, y, radius, color, stroke)
    for(let i = 0; i < teeth; i++){
      var ix = Math.cos(Math.PI * 2 / teeth * i) * radius + x;
      var iy = Math.sin(Math.PI * 2 / teeth * i) * radius + y;
      var rotate = Math.atan2(y - iy, x - ix) + Math.PI / 2;
      hctx.save()
      hctx.translate(ix, iy)
      hctx.rotate(rotate)
      hctx.translate(-ix, -iy)
      DrawRect(ix, iy, Math.PI * radius * 2 / teeth * .75, radius / 3 + stroke / 2, "orange")
      hctx.restore()
    }
  }

  function DrawPath(x, y, path, color, scaleX, scaleY) {
    hctx.fillStyle = color;
    hctx.save();
    hctx.translate(x, y);
    hctx.scale(scaleX, scaleY)
    let ex = new Path2D(path);
    hctx.fill(ex);
    hctx.restore();
  };

  function DrawTriangle(cord1X, cord1Y, cord2X, cord2Y, cord3X, cord3Y, color) {
    hctx.beginPath();
    hctx.fillStyle = color;
    hctx.moveTo(cord1X, cord1Y);
    hctx.lineTo(cord2X, cord2Y);
    hctx.lineTo(cord3X, cord3Y);
    hctx.lineTo(cord1X, cord1Y);
    hctx.fill();
  };

  function DrawCircle(x, y, radius, color) {
    hctx.beginPath();
    hctx.fillStyle = color;
    hctx.arc(x, y, radius, 0, 2 * Math.PI)
    hctx.fill();
  };

  function DrawStroke(x, y, radius, color, stroke) {
    hctx.beginPath();
    hctx.strokeStyle = color;
    hctx.lineWidth = stroke;
    hctx.arc(x, y, radius, 0, 2 * Math.PI)
    hctx.stroke();
  };

  function DrawRect(x, y, width, height, color) {
    hctx.beginPath();
    hctx.fillStyle = color;
    hctx.fillRect(x, y, width, height);
  };

  function strokeRect(x, y, width, height, color, stroke){
    hctx.beginPath();
    hctx.strokeStyle = color;
    hctx.lineWidth = stroke
    hctx.rect(x, y, width, height);
    hctx.stroke()
  }

  function DrawHex(x, y, color, size) {
    hctx.beginPath();
    for (var i = 0; i < 7; i++) {
      hctx.lineTo(x + size * Math.cos(2 * Math.PI / 6 * i), y + size * 0.9 * Math.sin(2 * Math.PI / 6 * i));
    }
    hctx.fillStyle = color;
    hctx.fill();
    hctx.strokeStyle = "black"
    hctx.stroke()
  };

      function getCubicBezierXYatPercent(startPt, controlPt1, controlPt2, endPt, percent) {
        var x = CubicN(percent, startPt.x, controlPt1.x, controlPt2.x, endPt.x);
        var y = CubicN(percent, startPt.y, controlPt1.y, controlPt2.y, endPt.y);

        return ({ x: x, y: y });
      }

      function CubicN(pct, a, b, c, d) {
        var t2 = pct * pct;
        var t3 = t2 * pct;
        return a + (-a * 3 + pct * (3 * a - a * pct)) * pct
          + (3 * b + pct * (-6 * b + b * 3 * pct)) * pct
          + (c * 3 - c * 3 * pct) * t2
          + d * t3;
      }

  function hexToRgb(hex) {
    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
      r: parseInt(result[1], 16),
      g: parseInt(result[2], 16),
      b: parseInt(result[3], 16)
    } : null;
  }

  function hexToHSL(hex) {
      const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || [];
      const rgb = [r, g, b].map(x => parseInt(x, 16) / 255);
      const max = Math.max(...rgb);
      const min = Math.min(...rgb);
      const l = (max + min) / 2;
      
      if (max === min) return [0, 0, Math.round(l * 100)];
      
      const d = max - min;
      const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      
      let h;
      const [nr, ng, nb] = rgb;
      if (max === nr) h = (ng - nb) / d + (ng < nb ? 6 : 0);
      else if (max === ng) h = (nb - nr) / d + 2;
      else h = (nr - ng) / d + 4;
      
      return [
        Math.round(h * 60),
        Math.round(s * 100),
        Math.round(l * 100)
      ];
    }
  
    function Meter(size, callback) {
      this.size = size;
      this.value = 0;
      this.diff = 0;
      this.increased = false;
      this.decreased = false;
      var values = [];
  
      this.setValue = function (updatedValue) {
        values.push(updatedValue);
        if (values.length > this.size) {
          values.shift();
        }
  
        for (var i = 0; i < values.length - 1; i++) {
          if (values[i] !== values[i + 1]) return;
        }
        if (this.value !== values[0]) {
          this.diff = Math.abs(this.value - values[0]);
          this.increased = this.value < values[0];
          this.decreased = this.value > values[0];
          this.value = values[0];
          callback();
        }
      }
    }
    
    //#endregion


  window.requestAnimationFrame(update);
</script>
