    let backgroundEaseHue = 0;
    let backgroundEaseLit = 0;
    let backgroundEaseSat = 0
    let gCycle = 0
    function backgroundHandler(){
        switch(backgroundMode){
            case "Color Cycle": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Color Cycle Ambience": 
            copyScreen(ambienceAlpha / 100)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Custom": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            break;
            case "Ambience": 
            copyScreen(ambienceAlpha / 100,hctx)
            break;
            case "Custom Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Ambience Audio Visualizer": 
            copyScreenAudio(ambienceAlpha / 100)
            break;
            case "Custom Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
            case "Color Cycle Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
        }
    }

    let audioScreenSat = 0
    let audioScreenLit = 0
    function copyScreenAudio(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      audioScreenSat += (engine.audio.density * 100 - audioScreenSat) / 10
      audioScreenLit += (engine.audio.density * 100 - audioScreenLit) / 10
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        hctx.fillStyle = `hsla(${hue[iZone]}, ${sat[iZone] * (audioScreenSat / 200 + .5)}%, ${lightness[iZone] * (audioScreenLit / 100)}%, ${alpha})`;
        hctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }
  
    function copyScreen(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        hctx.fillStyle = `hsla(${(backgroundMode == "Custom Ambience" ? proBack[0] : hue[iZone] + gCycle * (backgroundMode == "Color Cycle Ambience"))}, ${sat[iZone]}%, ${lightness[iZone]}%, ${alpha})`;
        hctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }
  
  function bongVisible(){

  function bongHandler(){
    if(enableBong){
      const bongUI = bongVisible();
      const hud = hudVisible();

      // player is near bong
      if (hud && bongUI && !bongActive && !bongCooldown ){
        bongReady = true;
      }

      // start animation
      if (bongReady && !bongActive && !hud && !bongUI){
        bongActive = true;
        bongReady = false;
        bongStartTime = Date.now();
        effects.push(new simpleBong());
      }

      // finish animation
      if (bongActive && hud && bongUI && Date.now() - bongStartTime > 5000){
        bongActive = false;
        bongCooldown = true;
      }

      // cooldown over when leave bong 
      if (bongCooldown && !bongUI){
        bongCooldown = false;
      }
    }
  }

  //Effects
  function LowHpEffect() {
    this.lifetime = 1;
    this.start = GetTime();
    this.explosionEffect = new ParticleExplosion(160, 100, "red", 14, 1500, 50, 10, 2, false, false, true);
    this.draw = function () {

  function WastedEffect() {

  function ParticleExplosion(x, y, color, speed, duration, particleAmount, particleSize, fadeSpeed, notrandomY, useHearts, hasPhysics) {
    this.start = GetTime();
    this.col = color;
    this.speed = speed;
    this.duration = duration;
    this.lifetime = 2000;
    this.amount = particleAmount;
    this.size = particleSize
    this.x = x;
    this.y = y;
    this.fadeSpeed = fadeSpeed;
    this.particles = [];
    this.useHearts = useHearts;
    this.hasPhysics = hasPhysics;

    while (this.particles.length < this.amount) {
      if (notrandomY) {
        this.yspeed = -this.speed / 1.5;
      } else {
        this.yspeed = ((Math.random() - 0.5) * this.speed);
      }
      if (this.useHearts == null || this.useHearts == false) {
        this.particles.push(new ExplosionParticle(this.x, this.y, this.size, this.col, this.fadeSpeed,
          {
            x: ((Math.random() - 0.5) * this.speed),
            y: this.yspeed
          }, this.hasPhysics))
      } else {
        this.particles.push(new HeartParticle(this.x, this.y, this.size, this.col, this.fadeSpeed,
          {
            x: ((Math.random() - 0.5) * this.speed),
            y: this.yspeed
          }))
      }
    }

    this.draw = function () {
      this.lifetime = this.duration - (GetTime() - this.start)
      
      
      this.particles.forEach((Particle, index) => {
        Particle.draw()
      })
      
      this.particles = this.particles.filter(particle => particle.alpha > 0);
    }
  };

function hexToHSL(hex) {
    // Remove the '#' if present
    hex = hex.replace("#", "");

    // Convert hex to RGB
    let r = parseInt(hex.substring(0, 2), 16);
    let g = parseInt(hex.substring(2, 4), 16);
    let b = parseInt(hex.substring(4, 6), 16);

    // Normalize RGB values
    r /= 255;
    g /= 255;
    b /= 255;

    // Calculate HSL values
    let max = Math.max(r, g, b);
    let min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;

    if (max === min) {
      h = s = 0; // Achromatic
    } else {
      let d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);

      switch (max) {
        case r:
          h = (g - b) / d + (g < b ? 6 : 0);
          break;
        case g:
          h = (b - r) / d + 2;
          break;
        case b:
          h = (r - g) / d + 4;
          break;
      }

      h /= 6;
    }

    // Convert to percentages
    h = Math.round(h * 360);
    s = Math.round(s * 100);
    l = Math.round(l * 100);

    return [h, s, l];
  }


  //Helper effects


  function DrawHeart(x, y, xSize, Ysize, color) {
    hctx.save();
    hctx.beginPath();
    hctx.fillStyle = color;
    hctx.moveTo(x, y);
    // top left curve
    hctx.bezierCurveTo(
      x,
      y,
      x - xSize / 2,
      y - Ysize,
      x - xSize / 2,
      y + Ysize / 4
    );
    hctx.bezierCurveTo(
      x - xSize / 2,
      y + Ysize / 4,
      x - xSize / 2,
      y + Ysize / 4,
      x,
      y + Ysize
    );
    hctx.bezierCurveTo(
      x + xSize / 2,
      y + Ysize / 4,
      x + xSize / 2,
      y + Ysize / 4,
      x + xSize / 2,
      y + Ysize / 4
    );
    hctx.bezierCurveTo(
      x + xSize / 2,
      y + Ysize / 4,
      x + xSize / 2,
      y - Ysize,
      x,
      y
    );

    hctx.fill()
    hctx.restore()
  };

  function GetTime() {
    return new Date().getTime();
  }

  //classes
  class ExplosionParticle {
    constructor(x, y, radius, color, fadeSpeed, velocity, hasPhysics) {
      this.x = x;
      this.y = y;
      this.color = color;
      this.radius = radius;
      this.lifetime = 1
      this.velocity = velocity;
      this.alpha = 1 * fadeSpeed;
      this.hasPhysics = hasPhysics;
    }
    draw() {
      hctx.globalAlpha = this.alpha;
      hctx.beginPath()
      hctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false)
      hctx.fillStyle = this.color
      hctx.fill()
      this.x += this.velocity.x
      this.y += this.velocity.y
      if (this.hasPhysics != null || this.hasPhysics != false) {
        this.velocity.y += 0.3;
      }
      this.alpha -= 0.01
      hctx.globalAlpha = 1;
    }
  }

  function fallingMoney(x, speed, color) {
    this.speed = speed / 5;
    this.x = x;
    this.y = 0 - (Math.random() * 250);
    this.startVal = (Math.random() * 50);
    this.start = GetTime();
    this.color = color;
    this.lifetime = 1
    this.draw = function() {
      this.elapsed = GetTime() - this.start;
      this.moveVal = (this.elapsed / 1000);
      hctx.fillStyle = this.color;
      hctx.save();
      hctx.translate(this.x + Math.sin(this.startVal + this.moveVal) * 100, this.y);
      hctx.rotate(-Math.sin(this.moveVal + this.startVal) / 5);
      hctx.fillRect(this.x, this.y, 100, 35);
      hctx.restore();
      this.y += this.speed;
      if(this.y > 300) this.lifetime = 0
    }
  }

  function blood(x, y, color, fade) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.fade = fade;
    this.speed = (Math.random() + 0.1) * 6
    this.size = (Math.random() * 5) + 5;
    this.lifetime = 1 
    this.draw = function() {
      hctx.beginPath();
      hctx.arc(this.x, this.y, this.size, 0, 2 * Math.PI)
      hctx.fillStyle = this.color;
      hctx.fill();
      this.y += this.speed * Math.random();
      this.x += (Math.random() - 0.5) * 8;
    }
  }

  function Meter(size, callback) {
    this.size = size;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    var values = [];

    this.setValue = function (updatedValue) {
      values.push(updatedValue);
      if (values.length > this.size) {
        values.shift();
      }

      for (var i = 0; i < values.length - 1; i++) {
        if (values[i] !== values[i + 1]) return;
      }
      if (this.value !== values[0]) {
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        callback();
      }
    };
  }

  window.requestAnimationFrame(update);
