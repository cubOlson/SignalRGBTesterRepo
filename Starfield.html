  <body style="margin: 0; padding: 0; background: #000;">
    <canvas id="exCanvas" width="320" height="200"></canvas>
  </body>
  
  <script>
    var canvas, ctx;
    canvas = document.getElementById('exCanvas');
    ctx = canvas.getContext('2d');
    var width = 320;
    var height = 200;
    var effects = [];
    var stateMgr = new StateHandler()
    let INGAME = false
    let INSHIP = false
    let outGameCounter = 0
    let idleGoing = false
    let gPowers = false

    let inGameMeter = new Meter(5, inGameCallback)
    let healthMeter = new Meter(10, inGameCallback)
    let powerBlueMeter = new Meter(10, inGameCallback)

    let redHealthMeter = new Meter(5, healthCallback)

    let surveyWhiteMeter = new Meter(10, surveyCallback)

    let hazardRedMeter = new Meter(3, hazardCallback)
    let protectionGreenMeter = new Meter(3, hazardCallback)

    let digipickGreyMeter = new Meter(3, digipickCallback)
    let digipickOrangeMeter = new Meter(3, digipickCallback)

    let combatStartMeter = new Meter(3, combatCallback)
    let combatEndMeter = new Meter(5, combatCallback)

    let boostUseMeter = new Meter(5, boostCallback)
    let boostLengthMeter = new Meter(2, boostCallback)

    let o2Meter = new Meter(5, o2Callback)
    let o2RedMeter = new Meter(5, o2Callback)

    let shipBlueMeter = new Meter(10, shipCallback)
    let shipHealthMeter = new Meter(10, shipCallback)

    let missileMeter = new Meter(3, missileCallback)
    let gravJumpMeter = new Meter(5, gravJumpCallback)
   
    function update() {
      DrawRect(0, 0, 320, 200, "hsla(0, 0%, 5%, 1)")

      inGameMeter.setValue(engine.vision.inGame)
      healthMeter.setValue(!gPowers ? engine.vision.whiteHealth1NG + engine.vision.whiteHealth2NG : engine.vision.whiteHealth1 + engine.vision.whiteHealth2)
      powerBlueMeter.setValue(engine.vision.powerBlue)
      redHealthMeter.setValue(!gPowers ? engine.vision.redHealthNG : engine.vision.redHealth)
      hazardRedMeter.setValue(engine.vision.hazardRed + engine.vision.hazardRed2)
      protectionGreenMeter.setValue(engine.vision.protectionGreen)
      shipBlueMeter.setValue(engine.vision.shipBlue)
      shipHealthMeter.setValue(engine.vision.shipHealth * 3.47)


      if(INGAME){
        outGameCounter = 0
        surveyWhiteMeter.setValue(engine.vision.surveyWhite)
        combatStartMeter.setValue(engine.vision.combatRed1 + engine.vision.combatRed2)
        combatEndMeter.setValue(engine.vision.combatEnd1 + engine.vision.combatEnd2)
        boostUseMeter.setValue(!gPowers ? engine.vision.boostpackUseNG : engine.vision.boostpackUse)
        boostLengthMeter.setValue(!gPowers ? engine.vision.boostpackLengthNG : engine.vision.boostpackLength)
        o2Meter.setValue(engine.vision.o21 * .25 + engine.vision.o22 * .5 + engine.vision.o23 * .25)
        o2RedMeter.setValue(engine.vision.o2Red1 + engine.vision.o2Red2)
      } else if (INSHIP) {
        missileMeter.setValue(engine.vision.missileLock1 + engine.vision.missileLock2)
        gravJumpMeter.setValue(engine.vision.gravJump)
      } else {
        digipickGreyMeter.setValue(engine.vision.digipickGrey)
        digipickOrangeMeter.setValue(engine.vision.digipickOrange)
        outGameCounter++
      }

      if(outGameCounter > 100 && !INGAME && !INSHIP && !idleGoing && effects.length < 1) {
        if (idleOn) effects.push(new idle())
        idleGoing = true
      }
  
      copyScreen(screenBrightness / 100)
      effects.forEach((ele, i) => {
        ele.draw()
        if(ele.lifetime <= 0){
          effects.splice(i, 1)
        }
      })
      drawHud()
  
      window.requestAnimationFrame(update);
    };

    let designatedHealthSize = 0;
    let currentHealthSize = 0;
    let designatedO2Size = 0;
    let currentO2Size = 0;
    function drawHud() {
      let hpColor = hexToHSL(healthColor)
      let mnColor = hexToHSL(o2Color)
      designatedHealthSize = INGAME ? healthMeter.value * 3.2 : INSHIP ? shipHealthMeter.value * 3.2 : 0;
      designatedO2Size = INGAME ? o2Meter.value * 3.2 : 0;
      currentHealthSize = lerp(currentHealthSize, designatedHealthSize, 0.05);
      currentO2Size = lerp(currentO2Size, designatedO2Size, 0.05);
      let healthString = `hsl(${hpColor[0]}, ${hpColor[1]}%, ${hpColor[2]}%)`
      let o2String = `hsl(${mnColor[0]}, ${mnColor[1]}%, ${mnColor[2]}%)`
      if (enableHealthHUD){
        if(blackToggle) DrawRect(healthX * 3.2, healthY * 2, healthWidth * 3.2, healthHeight, "black");
        DrawRect(healthX * 3.2, healthY * 2, adjToggle ? healthWidth * 3.2 : currentHealthSize * healthWidth, healthHeight, healthString);
      }
      if (enableO2HUD){
        if(blackToggle && !INSHIP) DrawRect(o2X * 3.2, o2Y * 2, o2Width * 3.2, o2Height, "black");
        if(!INSHIP) DrawRect(o2X * 3.2, o2Y * 2, adjToggle ? o2Width * 3.2 : currentO2Size * o2Width, o2Height, o2String );
      } 
    }

    function lerp(a, b, speed) {
      return a + speed * (b - a)
    }

    let proBack = []
    function onbackColorChanged(){
      proBack = hexToHSL(backColor)
    }

    function inGameCallback(){
      if(powerBlueMeter.value == 1) gPowers = true
      else if (powerBlueMeter.value < .25) gPowers = false

      if((inGameMeter.value == 1 || hazardRedMeter.value == 1 || protectionGreenMeter.value == 1 || powerBlueMeter.value == 1) && (healthMeter.value > .2 || redHealthMeter.value > .05)) INGAME = true
      else if (inGameMeter.value < .1 && hazardRedMeter.value < .1 && protectionGreenMeter.value < .1 && healthMeter.value < .1 && redHealthMeter.value < .05) INGAME = false
    }

    function shipCallback(){
      if(!INGAME && shipBlueMeter.value > .1 && shipHealthMeter.value > .1) INSHIP = true
      else if (shipBlueMeter.value < .1 && shipHealthMeter.value < .1) INSHIP = false
    }

    let gravJumpGoing = false
    function gravJumpCallback(){
      if(INSHIP && gravJumpMeter.value == 1 && !gravJumpGoing){
        if(gravOn) effects.push(new gravJump())
      }
    }

    let missileGoing = false
    function missileCallback(){
      if(INSHIP && missileMeter.value > .75 && !missileGoing){
        if(missileOn) effects.push(new missileLock())
        missileGoing = true
      }
    }

    let o2Going = false
    function o2Callback(){
      if(INGAME && o2Meter.value < .1 && o2RedMeter.value == 1 && !o2Going){
        o2Going = true
        if(enableO2) effects.push(new lowHealth(1))
      }
    }

    let boostGoing = false
    function boostCallback(){
      if(INGAME && boostUseMeter.value == 1 && engine.vision.boostpackNotWhite < .1 && !boostGoing){
        if(boostOn) effects.push(new jetpack())
        boostGoing = true
      }
    }

    let combatGoing = false
    function combatCallback(){
      if(INGAME && combatStartMeter.value > .95 && !combatGoing){
        if(combatOn) effects.push(new combatStart())
        combatGoing = true
      }
    }

    let digipickGoing = false
    function digipickCallback(){
      if(!INGAME && digipickGreyMeter.value == 1 && digipickOrangeMeter.value == 1 && !digipickGoing){
        if(digipickOn) effects.push(new digiPick())
        digipickGoing = true
      }
    }

    let hazardGoing = false
    let protectionGoing = false
    function hazardCallback(){
      if(INGAME && hazardRedMeter.value == 1 && !hazardGoing){
        hazardGoing = true
        if(hazardOn) effects.push(new hazards(engine.vision.hazardColor[0]))
      }
      if(INGAME && protectionGreenMeter.value == 1 && !protectionGoing){
        protectionGoing = true
        if(hazardOn) effects.push(new hazards(120))
      }
    }

    let surveyGoing = false
    function surveyCallback(){
      if(surveyWhiteMeter.value == 1 && INGAME && engine.vision.surveyNotWhite < .5 && !surveyGoing){
        if(surveyOn) effects.push(new survey())
        surveyGoing = true
      }
    }

    let lowHealthGoing = false
    function healthCallback(){
      if(INGAME && redHealthMeter.value == 1 && !lowHealthGoing){
        if(enableHealth) effects.push(new lowHealth())
        lowHealthGoing = true
      }
    }

    function gravJump(){
        this.y = 0
        this.effects = []
        this.x = 160
        this.count = 0
        this.lifetime = 350
        this.draw = function(){
          ctx.globalAlpha = this.lifetime / 100
            this.effects.push(new gravParticle())
            this.effects.forEach((ele, i)=>{
                ele.draw()
                if(ele.lifetime <= 0) this.effects.splice(i, 1)
            })
            DrawRect(this.x, 90, (160 - this.x) * 2, 20, "white")
            if(this.x == 0){
                DrawRect(this.x, 95 + this.y, (160 - this.x) * 2, 10, "white")
                DrawRect(this.x, 95 - this.y, (160 - this.x) * 2, 10, "white")
                this.y < 120 ? this.y += 2 : this.y = 0
            }
            this.count < 50 ? this.count+=.5 : this.x > 0 ? this.x-=3 : this.x = 0;
            this.lifetime--
            if(this.lifetime == 0) jumpPushed = false
        }
    }

    function gravParticle(){
        this.hue = Math.random() * 100 + 200
        this.lit = Math.random() * 25 + 25
        this.y = 100
        this.rad = 10
        this.rot = Math.PI * 2 * Math.random()
        this.draw = function(){
            ctx.save()
            ctx.translate(160, 100)
            ctx.rotate(this.rot)
            ctx.translate(-160, -100)
            DrawCircle(160, this.y, this.rad+=.5, `hsla(${this.hue}, 100%, ${this.lit}%, 1)`)
            this.y > -100 ? this.y-=5 : this.lifetime = 0
            ctx.restore()
        }
    }

    function missileLock(){
      this.rad = 1
      this.draw = function(){
        DrawStroke(160, 100, this.rad, "red", 15)
        DrawStroke(160, 100, this.rad * 1.5, "red", 15)
        this.rad < 300 ? this.rad += 5 : this.rad = 1
        if(missileMeter.value == 0) {
          this.lifetime = 0
          missileGoing = false
        }
      }
    }

    function jetpack(){
      this.width = 0
      this.draw = function(){
        this.width = (1 - boostLengthMeter.value) * 320
        DrawRect(0, 0, boostUseMeter.value == 1 ? this.width : 0, 200, `hsla(${60 - (this.width / 5.3333)}, 100%, 50%, 1)`)
        effects.push(new jetHelp(this.width))
        if(!INGAME || boostUseMeter.value < .1) this.alpha > 0 ? this.alpha -= .05 : this.lifetime = 0
        else this.alpha = 1
        if(this.lifetime == 0) boostGoing = false
      }
    }

    function jetHelp(x){
      this.x = x
      this.y = Math.random() * 200
      this.rad = Math.random() * 20 + 15
      this.hue = Math.random() * 60
      this.draw = function(){
        DrawCircle(this.x, this.y, this.rad, `hsla(${this.hue}, 100%, 50%, .25)`)
        this.x > -50 ? this.x -= 3 : this.lifetime = 0

      this.increased = false;
      this.decreased = false;
      var values = [];
  
      this.setValue = function (updatedValue) {
        values.push(updatedValue);
        if (values.length > this.size) {
          values.shift();
        }
  
        for (var i = 0; i < values.length - 1; i++) {
          if (values[i] !== values[i + 1]) return;
        }
        if (this.value !== values[0]) {
          this.diff = Math.abs(this.value - values[0]);
          this.increased = this.value < values[0];
          this.decreased = this.value > values[0];
          this.value = values[0];
          callback();
        }
      }
