       false positives from ambient lighting or UI transitions.

<body style="margin: 0; padding: 0; background: #000;">
    <canvas id="exCanvas" width="320" height="200"></canvas>
</body>

<script>
    // ═══════════════════════════════════════════════════════════
    // CANVAS SETUP
    // SignalRGB renders this 320x200 canvas onto the device layout.
    // All effects draw to the hidden canvas, composited to ctx once per frame.
    // ═══════════════════════════════════════════════════════════
    const canvas = document.getElementById('exCanvas');
    const ctx    = canvas.getContext('2d');
    const width  = 320;
    const height = 200;

    const hiddenCanvas = document.createElement('canvas');
    hiddenCanvas.width  = 320;
    hiddenCanvas.height = 200;
    const hiddenCtx = hiddenCanvas.getContext('2d');

    let effects = [];

    //#region Update
    function update() {
        DrawRect(0, 0, 320, 200, 'black')
        backgroundHandler()

        deathTextRed_Meter.setValue(engine.vision.deathTextRed)
        deathNotRed_Meter.setValue(engine.vision.deathNotRed)
        deathBlack_Meter.setValue(engine.vision.deathBlack)
        endTurnGrey_Meter.setValue(engine.vision.endTurnGrey)
        endTurnBlue_Meter.setValue(engine.vision.endTurnBlue)
        endTurnWhite_Meter.setValue(engine.vision.endTurnWhite)
        inGameWhite_Meter.setValue(engine.vision.inGameWhite)
        inGameGrey_Meter.setValue(engine.vision.inGameGrey)
        endTurnWhite2_Meter.setValue(engine.vision.endTurnWhite2)
        inGameNotWhite_Meter.setValue(engine.vision.inGameNotWhite)
        missionCompleteBlue1_Meter.setValue(engine.vision.missionCompleteBlue1)
        missionCompleteBlue2_Meter.setValue(engine.vision.missionCompleteBlue2)
        missionFailedRed1_Meter.setValue(engine.vision.missionFailedRed1)
        missionFailedRed2_Meter.setValue(engine.vision.missionFailedRed2)
        missionTextWhite_Meter.setValue(engine.vision.missionTextWhite)
        moveTextWhite_Meter.setValue(engine.vision.moveTextWhite)
        moveBlue_Meter.setValue(engine.vision.moveBlue)
        overwatchBlue_Meter.setValue(engine.vision.overwatchBlue)
        reinforcementsTextWhite_Meter.setValue(engine.vision.reinforcementsTextWhite)
        reinforcementsNotWhite_Meter.setValue(engine.vision.reinforcementsNotWhite)
        shotBlue_Meter.setValue(engine.vision.shotBlue)
        downedRed_Meter.setValue(engine.vision.downedRed)
        downedNotRed_Meter.setValue(engine.vision.downedNotRed)

        effects.forEach(ele => { ele.draw() })
        effects = effects.filter(ele => !(ele.lifetime <= 0))

        ctx.drawImage(hiddenCanvas, 0, 0)
        window.requestAnimationFrame(update)
    }
    //#endregion

    //#region Meter Declarations

    // -------------------------------------------------------------------------
    // Meter objects
    // -------------------------------------------------------------------------
    const deathTextRed_Meter = new Meter(10, deathCallback)
    const deathNotRed_Meter = new Meter(10, deathCallback)
    const deathBlack_Meter = new Meter(10, deathCallback)
    const endTurnGrey_Meter = new Meter(3, turnDetect)
    const endTurnBlue_Meter = new Meter(3, turnDetect)
    const endTurnWhite_Meter = new Meter(3, inGameTurnDetect)
    const inGameWhite_Meter = new Meter(3, inGameDetect)
    const inGameGrey_Meter = new Meter(3, inGameDetect)
    const endTurnWhite2_Meter = new Meter(3, inGameTurnDetect)
    const inGameNotWhite_Meter = new Meter(3, inGameDetect)
    const missionCompleteBlue1_Meter = new Meter(10, missionCompleteCallback)
    const missionCompleteBlue2_Meter = new Meter(10, missionCompleteCallback)
    const missionFailedRed1_Meter = new Meter(10, missionFailedCallback)
    const missionFailedRed2_Meter = new Meter(10, missionFailedCallback)
    const missionTextWhite_Meter = new Meter(10, missionTextDetect)
    const moveTextWhite_Meter = new Meter(10, whiteTextDetect)
    const moveBlue_Meter = new Meter(10, moveCallback)
    const overwatchBlue_Meter = new Meter(10, overwatchCallback)
    const reinforcementsTextWhite_Meter = new Meter(10, reinforcementsCallback)
    const reinforcementsNotWhite_Meter = new Meter(10, reinforcementsCallback)
    const shotBlue_Meter = new Meter(10, shotCallback)
    const downedRed_Meter = new Meter(5, downedDetect)
    const downedNotRed_Meter = new Meter(5, downedDetect)
    //#endregion

    //#region Callbacks

    // -------------------------------------------------------------------------
    // Global state flags
    // -------------------------------------------------------------------------
    let gInGame = false
    let shotGoing = false
    let moveGoing = false
    let overwatchGoing = false
    let beginTurnGoing = false
    let endTurnGoing = false
    let missionCompleteGoing = false
    let missionFailedGoing = false
    let reinforcementsGoing = false
    let deathGoing = false
    let downedLevel = 0   // how many teammates are currently downed (the downed-red bar is ~0.2 per teammate)

    // Sequencing latch: Begin Turn may only fire after an End Turn (the "grey on / white
    // off" state also occurs during normal play, so it must be armed by an end turn first).
    let turnEnded = false

    // myTurn is driven by the turn effects (Begin Turn -> true, End Turn -> false) and gates
    // the turn-scoped detections (Downed / Recovery). It is INDEPENDENT of gInGame, which stays
    // meter-based and continues to gate the card effects (shot/move/overwatch/mission/death/reinf).
    // Starts true so downs work on the very first turn (before any end->begin cycle is seen).
    let myTurn = true

    // Set true when a Death is detected, so the downed-red spike caused by a death is NOT
    // mistaken for a downed unit. Cleared at the next Begin Turn.
    let someoneDied = false

    // -------------------------------------------------------------------------
    // Callbacks
    // -------------------------------------------------------------------------

    function inGameDetect() {
        if ((inGameWhite_Meter.value >= .1 && inGameNotWhite_Meter.value < .1 && inGameGrey_Meter.value >=.3) && !gInGame) {
            gInGame = true
            turnDetect()         // in-game meters lag the turn meters — re-check begin/end turn now
                                 // that we're finally in-game, so a begin turn that fired too early isn't lost
            shotCallback()       // back in-game -> clear shotGoing so the Shot effect fades out and dies
            downedDetect()       // back in-game (my turn): the downed-red re-appears with the HUD, so
                                 // re-check downed (a down from the enemy turn) and recovery (a heal)
        } else if (((inGameWhite_Meter.value < .1 && inGameGrey_Meter.value >=.3) || inGameNotWhite_Meter.value >=.1) && gInGame) {
            gInGame = false
            // a card just covered the HUD (that's why we left "in game"). The card effects all
            // require !gInGame, and their card meters may have fired BEFORE gInGame dropped —
            // re-check them now so a shot/move/overwatch/mission that led the HUD isn't lost.
            whiteTextDetect()    // shot + move + overwatch
            missionTextDetect()  // mission complete + failed
        }
    }

    // A vision meter can only invoke ONE callback. When a meter is read by more than one
    // detection (e.g. moveTextWhite feeds shot/move/overwatch), route it through a
    // dispatcher so every detection that depends on that meter is re-checked when it
    // changes — otherwise only the single wired callback would ever run.
    function whiteTextDetect() { shotCallback(); moveCallback(); overwatchCallback() }
    function turnDetect() { beginTurnCallback(); endTurnCallback() }
    function missionTextDetect() { missionCompleteCallback(); missionFailedCallback() }
    function inGameTurnDetect() { inGameDetect(); turnDetect() }

    function shotCallback() {
        if (!gInGame && shotOn && shotBlue_Meter.value >= .95 && moveTextWhite_Meter.value >= .3 && !shotGoing) {
            effects.push(new Shot())
            shotGoing = true
        } else if (gInGame) {
            shotGoing = false   // shot card gone -> let the effect fade out and die
        }
    }

    function moveCallback() {
        if (!gInGame && moveOn && moveBlue_Meter.value >=.95 && moveTextWhite_Meter.value >=.3 && !moveGoing) {
            effects.push(new Move())
            moveGoing = true
        } else if (gInGame) {
            moveGoing = false   // shot card gone -> let the effect fade out and die
        }
    }

    function overwatchCallback() {
        if (!gInGame && overwatchOn && overwatchBlue_Meter.value >=.95 && moveTextWhite_Meter.value >=.3 && !overwatchGoing) {
            effects.push(new Overwatch())
            overwatchGoing = true
        }else if (gInGame) {
            overwatchGoing = false   // shot card gone -> let the effect fade out and die
        }
    }

    function endTurnCallback() {
        // Turn ends: end-turn WHITE up, blue confirm gone.
        if (endTurnOn && endTurnBlue_Meter.value <.1 && endTurnWhite_Meter.value >=.95  && endTurnWhite2_Meter.value >= .95 && !endTurnGoing) {
            effects.push(new EndTurn())
            endTurnGoing = true
            turnEnded = true            // arm Begin Turn — a begin may now follow
            myTurn = false              // the turn is over -> no longer my active turn
        }
    }

    function beginTurnCallback() {
        // New turn begins, but ONLY after an end turn (turnEnded). GREY card back, WHITE gone.
        // This same grey-on/white-off state also occurs during normal play, so the turnEnded
        // latch is what keeps it from firing every frame. No gInGame gate — the turn meters +
        // latch are the reliable signal, and this is what DRIVES myTurn.
        if (beginTurnOn && turnEnded && endTurnGrey_Meter.value >=.95 && endTurnWhite_Meter.value <.1 &&  endTurnWhite2_Meter.value >= .95 && !beginTurnGoing) {
            effects.push(new BeginTurn())
            beginTurnGoing = true
            turnEnded = false           // consume: exactly one Begin per End
            myTurn = true               // a new turn -> my active turn begins
            someoneDied = false         // fresh turn -> clear the death-suppression latch
            downedDetect()              // reconcile the downed count now that it's our turn
        }
    }

    function missionCompleteCallback() {
        if (!gInGame && missionCompleteOn && missionCompleteBlue1_Meter.value >=.95 && missionCompleteBlue2_Meter.value >=.95 && missionTextWhite_Meter.value >=.2 && !missionCompleteGoing) {
            effects.push(new MissionComplete())
            missionCompleteGoing = true
        } 
    }

    function missionFailedCallback() {
        if (!gInGame && missionFailedOn && missionFailedRed1_Meter.value >=.95 && missionFailedRed2_Meter.value >=.95 && missionTextWhite_Meter.value >=.2 && !missionFailedGoing) {
            effects.push(new MissionFailed())
            missionFailedGoing = true
        }
    }

    function reinforcementsCallback() {
        if (!gInGame && reinforcementsOn &&  reinforcementsTextWhite_Meter.value >=.1 && reinforcementsNotWhite_Meter.value <.1 && !reinforcementsGoing) {
            effects.push(new Reinforcements())
            reinforcementsGoing = true
        } 
    }

    function deathCallback() {
        if (!gInGame && deathOn && deathTextRed_Meter.value >=.2 && deathNotRed_Meter.value <.1 && deathBlack_Meter.value >=.4 && !deathGoing) {
            effects.push(new Death())
            deathGoing = true
            someoneDied = true   // a death occurred -> the downed-red spike is a DEATH, not a down
        }
    }

    // The downed-red meter drives DOWNED (a red spike) and also re-checks Recovery: when the red
    // clears back to ~zero (the unit is healed) during your turn, Recovery fires here.
    // The downed-red is a BAR: each ~0.2 of fill is one downed teammate (cap 3 — a 4th is a
    // death). We track the count and fire Downed on each step UP (a new down) and Recovery on
    // each step DOWN (a heal), so healing three teammates plays Recovery three times. Only
    // processed IN GAME and on MY TURN. A death (someoneDied) doesn't count as a down.
    function downedDetect() {
        if (!gInGame || !myTurn) return
        if (downedNotRed_Meter.value >= .1) return                       // negative-meter guard
        var lvl = Math.max(0, Math.min(3, Math.round(downedRed_Meter.value / 0.2)))
        if (lvl > downedLevel) {
            if (downedOn && !someoneDied) effects.push(new Downed())     // a teammate went down
            downedLevel = lvl
        } else if (lvl < downedLevel) {
            if (recoveryOn) effects.push(new Recovery())                 // a downed teammate was healed
            downedLevel = lvl
        }
    }
    //#endregion

    //#region Background Modes
    // ═══════════════════════════════════════════════════════════
    // BACKGROUND SYSTEM
    // Eight modes selected by the backgroundMode control.
    // ═══════════════════════════════════════════════════════════
    let proBack = [0, 0, 0]
    function onbackColorChanged() {
        proBack = hexToHSL(backColor)
    }

    let audioEase = { sat: 0, lit: 0 }
    let gCycle = 0

    function updateAudioEase() {
        const targetDensity = engine.audio.density * 100
        audioEase.sat += (targetDensity - audioEase.sat) / 10
        audioEase.lit += (targetDensity - audioEase.lit) / 10
    }

    function getColorString(hue, sat, lit, alpha) {
        return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`
    }

    function updateColorCycle() {
        gCycle = (gCycle + 0.5) % 360
    }

    function backgroundHandler() {
        if (backgroundMode.includes('Color Cycle')) updateColorCycle()
        if (backgroundMode.includes('Audio'))       updateAudioEase()

        // Every one of the eight background modes is handled explicitly, and each applies
        // ambienceAlpha for brightness. The Audio Visualizer modes read engine.audio.
        switch (backgroundMode) {
            case 'Ambience':
                copyScreen(ambienceAlpha / 100); break
            case 'Color Cycle Ambience':
                copyScreen(ambienceAlpha / 100); break
            case 'Custom Ambience':
                copyScreen(ambienceAlpha / 100); break
            case 'Ambience Audio Visualizer':
                copyScreenAudio(ambienceAlpha / 100); break
            case 'Color Cycle':
                DrawRect(0, 0, 320, 200, getColorString(proBack[0] + gCycle, proBack[1], proBack[2], ambienceAlpha / 100)); break
            case 'Custom':
                DrawRect(0, 0, 320, 200, getColorString(proBack[0], proBack[1], proBack[2], ambienceAlpha / 100)); break
            case 'Color Cycle Audio Visualizer':
                DrawRect(0, 0, 320, 200, getColorString(proBack[0] + gCycle, engine.audio.density * 33 + 66, audioEase.lit * 0.9 + 10, ambienceAlpha / 100)); break
            case 'Custom Audio Visualizer':
                DrawRect(0, 0, 320, 200, getColorString(proBack[0], engine.audio.density * 33 + 66, audioEase.lit * 0.9 + 10, ambienceAlpha / 100)); break
        }
    }

    const ZONE_COLS   = 28
    const ZONE_ROWS   = 20
    const TOTAL_ZONES = ZONE_COLS * ZONE_ROWS

    function copyScreenAudio(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat       = new Int8Array(engine.zone.saturation)
        const hue       = new Int16Array(engine.zone.hue)
        const w = 320 / ZONE_COLS
        const h = 200 / ZONE_ROWS
        const satMultiplier = audioEase.sat / 200 + 0.5
        const litMultiplier = audioEase.lit / 100
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            hiddenCtx.fillStyle = getColorString(
                hue[iZone],
                sat[iZone] * satMultiplier,
                lightness[iZone] * litMultiplier,
                alpha
            )
            hiddenCtx.fillRect(col * w, row * h, w, h)
        }
    }

    function copyScreen(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat       = new Int8Array(engine.zone.saturation)
        const hue       = new Int16Array(engine.zone.hue)
        const w = 320 / ZONE_COLS
        const h = 200 / ZONE_ROWS
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const finalHue = backgroundMode === 'Custom Ambience'
                ? proBack[0]
                : hue[iZone] + (backgroundMode === 'Color Cycle Ambience' ? gCycle : 0)
            hiddenCtx.fillStyle = getColorString(finalHue, sat[iZone], lightness[iZone], alpha)
            hiddenCtx.fillRect(col * w, row * h, w, h)
        }
    }
    //#endregion

    //#region Helper Functions
    // ═══════════════════════════════════════════════════════════
    // HELPER FUNCTIONS — draw primitives target hiddenCtx
    // ═══════════════════════════════════════════════════════════
    function DrawRect(x, y, w, h, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.fillRect(x, y, w, h)
    }

    function strokeRect(x, y, w, h, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.rect(x, y, w, h)
        hiddenCtx.stroke()
    }

    function DrawCircle(x, y, radius, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
        hiddenCtx.fill()
    }

    function DrawStroke(x, y, radius, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
        hiddenCtx.stroke()
    }

    function DrawLine(start, end, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.moveTo(start[0], start[1])
        hiddenCtx.lineTo(end[0], end[1])
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.stroke()
    }

    function DrawArc(x, y, start, end, radius, direction, color) {
        hiddenCtx.beginPath()
        hiddenCtx.arc(x, y, radius, start, end, direction)
        hiddenCtx.fillStyle = color
        hiddenCtx.fill()
    }

    function DrawEllipse(x, y, w, h, rotation, color) {
        hiddenCtx.beginPath()
        hiddenCtx.ellipse(x, y, w, h, rotation, 0, Math.PI * 2)
        hiddenCtx.fillStyle = color
        hiddenCtx.fill()
    }

    function DrawTriangle(x1, y1, x2, y2, x3, y3, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.moveTo(x1, y1)
        hiddenCtx.lineTo(x2, y2)
        hiddenCtx.lineTo(x3, y3)
        hiddenCtx.lineTo(x1, y1)
        hiddenCtx.fill()
    }

    function DrawPath(x, y, path, color, scaleX, scaleY) {
        hiddenCtx.fillStyle = color
        hiddenCtx.save()
        hiddenCtx.translate(x, y)
        hiddenCtx.scale(scaleX, scaleY)
        hiddenCtx.fill(new Path2D(path))
        hiddenCtx.restore()
    }

    function hexToRgb(hex) {
        var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex)
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : null
    }

    function hexToHSL(hex) {
        const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || []
        const rgb = [r, g, b].map(x => parseInt(x, 16) / 255)
        const max = Math.max(...rgb)
        const min = Math.min(...rgb)
        const l = (max + min) / 2
        if (max === min) return [0, 0, Math.round(l * 100)]
        const d = max - min
        const s = l > 0.5 ? d / (2 - max - min) : d / (max + min)
        let h
        const [nr, ng, nb] = rgb
        if      (max === nr) h = (ng - nb) / d + (ng < nb ? 6 : 0)
        else if (max === ng) h = (nb - nr) / d + 2
        else                 h = (nr - ng) / d + 4
        return [Math.round(h * 60), Math.round(s * 100), Math.round(l * 100)]
    }

    // Meter(size, callback): frame-stabilizing debouncer for vision signals.
    function Meter(size, callback) {
        this.size = size
        this.value = 0
        this.diff = 0
        this.increased = false
        this.decreased = false
        var values = []
        this.setValue = function (updatedValue) {
            values.push(updatedValue)
            if (values.length > this.size) values.shift()
            for (var i = 0; i < values.length - 1; i++) {
                if (values[i] !== values[i + 1]) return
            }
            if (this.value !== values[0]) {
                this.diff = Math.abs(this.value - values[0])
                this.increased = this.value < values[0]
                this.decreased = this.value > values[0]
                this.value = values[0]
                callback()
            }
        }
    }

    function onCanvasTapped(x, y) {}

    // Shot: blaster fire — a volley of Republic-blue bolts streaking left-to-right
    // into an enemy, with amber muzzle/impact flashes. (Fires a gun at an enemy.)
    function Shot() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.masterAlpha = 1
        this.shots = []
        this.spawnTimer = 0
        this.maxShots = 3 + Math.floor(Math.random() * 3)   // 3 to 5 bolts per volley
        this.spawned = 0
        this.reds = []          // small red cross-fire streaks for extra firefight feeling
        this.redTimer = 0
        this.draw = function () {
            this.frame++
            if (this.alpha < 1 && !this.fadingOut) this.alpha += 0.08
            if (this.alpha > 1) this.alpha = 1
            if (!shotGoing && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.masterAlpha -= 0.05
                if (this.masterAlpha <= 0) { this.masterAlpha = 0; this.lifetime = 0; shotGoing = false; return }
            }
            var a = this.alpha * this.masterAlpha
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)   // solid black background

            // small, fast RED cross-fire streaks flying the same way as the shots — sells the
            // firefight. Drawn first so the big blue bolts read on top of them.
            this.redTimer--
            if (this.redTimer <= 0 && !this.fadingOut) {
                this.reds.push({ x: -30, y: 18 + Math.random() * 164, speed: 20 + Math.random() * 10 })
                this.redTimer = 2 + Math.floor(Math.random() * 4)
            }
            for (var j = this.reds.length - 1; j >= 0; j--) {
                var rr = this.reds[j]
                rr.x += rr.speed
                if (rr.x > 350) { this.reds.splice(j, 1); continue }
                DrawLine([rr.x - 34, rr.y], [rr.x, rr.y], `hsla(0, 100%, 55%, ${0.45 * a})`, 6)
                DrawLine([rr.x - 20, rr.y], [rr.x, rr.y], `hsla(2, 100%, 82%, ${0.85 * a})`, 3)
            }

            var impactX = 300
            this.spawnTimer--
            // fire a small volley of 3-5 staggered bolts
            if (this.spawnTimer <= 0 && !this.fadingOut && this.spawned < this.maxShots) {
                var sy = 32 + Math.random() * 136
                this.shots.push({x: -60, y: sy, ty: sy + (Math.random() - 0.5) * 16, speed: 17 + Math.random() * 6, life: 1})
                this.spawned++
                this.spawnTimer = 12 + Math.floor(Math.random() * 12)
            }
            // once the volley has fired and cleared, start a fresh one (loops the preview)
            if (!this.fadingOut && this.spawned >= this.maxShots && this.shots.length === 0) {
                this.spawned = 0
                this.maxShots = 3 + Math.floor(Math.random() * 3)
                this.spawnTimer = 10
            }
            for (var i = this.shots.length - 1; i >= 0; i--) {
                var s = this.shots[i]
                s.x += s.speed
                s.y += (s.ty - s.y) * 0.05
                if (s.x > impactX + 8) {
                    s.life -= 0.12
                    if (s.life <= 0) {
                        this.shots.splice(i, 1)
                        continue
                    }
                }
                // fast, bright laser streak: a long fading motion-trail that tapers to a white-hot head
                var hx = s.x
                DrawLine([hx - 130, s.y], [hx, s.y], `hsla(205, 100%, 60%, ${0.12 * a * s.life})`, 22)  // long faint glow tail
                DrawLine([hx - 82,  s.y], [hx, s.y], `hsla(198, 100%, 68%, ${0.30 * a * s.life})`, 15)
                DrawLine([hx - 48,  s.y], [hx, s.y], `hsla(193, 100%, 82%, ${0.60 * a * s.life})`, 9)
                DrawLine([hx - 24,  s.y], [hx, s.y], `hsla(190, 100%, 98%, ${a * s.life})`, 4)           // white-hot core
                DrawCircle(hx, s.y, 11, `hsla(196, 100%, 78%, ${0.5 * a * s.life})`)                     // head glow
                DrawCircle(hx, s.y, 5.5, `hsla(190, 100%, 100%, ${a * s.life})`)                         // white-hot head
                if (s.x >= impactX && s.life > 0.4) {
                    var flash = (s.life - 0.4) / 0.6
                    DrawCircle(impactX, s.y, 32 * flash, `hsla(30, 100%, 68%, ${0.55 * a * flash})`)
                    DrawCircle(impactX, s.y, 16 * flash, `hsla(45, 100%, 90%, ${a * flash})`)
                    DrawCircle(impactX, s.y, 7  * flash, `hsla(60, 100%, 100%, ${a * flash})`)
                }
            }
        }
    }

    // Move: tactical reposition — a glowing Republic-blue movement path arcs across
    // the grid, chevrons slide along it toward a pulsing destination reticle.
    function Move() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.masterAlpha = 1
        this.duration = 78
        // quadratic bezier: start bottom-left -> control high-center -> destination right
        this.bez = function (t) {
            var mt = 1 - t
            return [mt * mt * 20 + 2 * mt * t * 115 + t * t * 247,
                    mt * mt * 172 + 2 * mt * t * 46 + t * t * 96]
        }
        this.draw = function () {
            this.frame++
            if (this.alpha < 1 && !this.fadingOut) this.alpha += 0.08
            if (this.alpha > 1) this.alpha = 1
            if ((!moveGoing || this.frame > this.duration) && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.masterAlpha -= 0.05
                if (this.masterAlpha <= 0) { this.masterAlpha = 0; this.lifetime = 0; moveGoing = false; return }
            }
            var a = this.alpha * this.masterAlpha
            DrawRect(0, 0, 320, 200, `hsla(0,0%,0%,${a})`)

            var prog = Math.min(1, this.frame / 44)
            // draw the traced path up to progress: glow underlay + bright core
            var prev = this.bez(0)
            for (var t = 0.02; t <= prog + 0.0001; t += 0.02) {
                var p = this.bez(t)
                DrawLine(prev, p, `hsla(205, 100%, 55%, ${0.22 * a})`, 28)
                DrawLine(prev, p, `hsla(198, 100%, 78%, ${0.85 * a})`, 10)
                prev = p
            }
            // faint dotted remainder of the planned route
            for (var t2 = prog; t2 <= 1; t2 += 0.05) {
                var pd = this.bez(t2)
                DrawCircle(pd[0], pd[1], 4, `hsla(200, 90%, 70%, ${0.18 * a})`)
            }
            // chevrons sliding along the path
            for (var c = 0; c < 3; c++) {
                var ct = ((this.frame * 0.02) + c * 0.16) % 1
                if (ct > prog) continue
                var cp = this.bez(ct)
                var cp2 = this.bez(Math.min(1, ct + 0.03))
                var ang = Math.atan2(cp2[1] - cp[1], cp2[0] - cp[0])
                var back = ang + Math.PI
                DrawLine([cp[0], cp[1]], [cp[0] + Math.cos(back + 0.5) * 20, cp[1] + Math.sin(back + 0.5) * 20], `hsla(190, 100%, 92%, ${0.9 * a})`, 7)
                DrawLine([cp[0], cp[1]], [cp[0] + Math.cos(back - 0.5) * 20, cp[1] + Math.sin(back - 0.5) * 20], `hsla(190, 100%, 92%, ${0.9 * a})`, 7)
            }
            // destination reticle (diamond) — pulses brighter as the traveler arrives
            var dp = this.bez(1)
            var arrive = Math.max(0, (prog - 0.7) / 0.3)
            var pulse = 18 + Math.sin(this.frame * 0.25) * 4 + arrive * 10
            DrawStroke(dp[0], dp[1], pulse + 16, `hsla(200, 100%, 60%, ${(0.25 + 0.4 * arrive) * a})`, 6)
            hiddenCtx.save()
            hiddenCtx.translate(dp[0], dp[1]); hiddenCtx.rotate(Math.PI / 4)
            strokeRect(-pulse / 2, -pulse / 2, pulse, pulse, `hsla(190, 100%, 85%, ${(0.5 + 0.5 * arrive) * a})`, 6)
            hiddenCtx.restore()
            DrawCircle(dp[0], dp[1], 6, `hsla(190, 100%, 95%, ${(0.5 + 0.5 * arrive) * a})`)
        }
    }

    // Overwatch: a reaction cone fans out from the operator, a scan line sweeps it,
    // then a target trips the trap and a bolt snaps down the cone. (Set-and-hold.)
    function Overwatch() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.masterAlpha = 1
        this.duration = 140
        this.apex = [160, 192]
        this.lx = [40, 16]   // left far edge
        this.rx = [280, 16]  // right far edge
        this.tgt = [110 + Math.random() * 100, 34 + Math.random() * 34]
        this.fired = false
        this.draw = function () {
            this.frame++
            if (this.alpha < 1 && !this.fadingOut) this.alpha += 0.08
            if (this.alpha > 1) this.alpha = 1
            if ((!overwatchGoing || this.frame > this.duration) && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.masterAlpha -= 0.05
                if (this.masterAlpha <= 0) { this.masterAlpha = 0; this.lifetime = 0; overwatchGoing = false; return }
            }
            var a = this.alpha * this.masterAlpha
            // backdrop stays SOLID black through the fade-out (use this.alpha, not a), so the
            // amber cone fades over black instead of revealing the blue ambience behind it.
            DrawRect(0, 0, 320, 200, `hsla(0,0%,0%,${this.alpha})`)

            var trigger = this.frame > 90
            var hue = trigger ? 32 : 190          // amber on trigger, cyan while watching
            // cone fill + edges (thicker)
            DrawTriangle(this.apex[0], this.apex[1], this.lx[0], this.lx[1], this.rx[0], this.rx[1],
                `hsla(${hue}, 100%, 55%, ${(trigger ? 0.16 : 0.09) * a})`)
            DrawLine(this.apex, this.lx, `hsla(${hue}, 100%, 70%, ${0.55 * a})`, 8)
            DrawLine(this.apex, this.rx, `hsla(${hue}, 100%, 70%, ${0.55 * a})`, 8)
            DrawLine(this.lx, this.rx, `hsla(${hue}, 100%, 70%, ${0.35 * a})`, 8)
            // operator node at apex
            DrawCircle(this.apex[0], this.apex[1], 10, `hsla(${hue}, 100%, 85%, ${a})`)

            if (!trigger) {
                // scan sweep: interpolate far edge left<->right (slower)
                var s = (Math.sin(this.frame * 0.08) + 1) / 2
                var fx = this.lx[0] + (this.rx[0] - this.lx[0]) * s
                var fy = this.lx[1] + (this.rx[1] - this.lx[1]) * s
                DrawLine(this.apex, [fx, fy], `hsla(190, 100%, 90%, ${0.7 * a})`, 14)
                DrawCircle(fx, fy, 8, `hsla(190, 100%, 92%, ${0.8 * a})`)
            } else {
                // target reticle snaps on, bolt fires down the cone, impact flash
                var snap = Math.min(1, (this.frame - 90) / 8)
                var r = 24 - snap * 9
                DrawStroke(this.tgt[0], this.tgt[1], r, `hsla(32, 100%, 65%, ${a})`, 5)
                DrawLine([this.tgt[0] - r - 6, this.tgt[1]], [this.tgt[0] - r + 3, this.tgt[1]], `hsla(40,100%,80%,${a})`, 5)
                DrawLine([this.tgt[0] + r - 3, this.tgt[1]], [this.tgt[0] + r + 6, this.tgt[1]], `hsla(40,100%,80%,${a})`, 5)
                if (this.frame > 100) {
                    DrawLine(this.apex, this.tgt, `hsla(30, 100%, 60%, ${0.4 * a})`, 14)
                    DrawLine(this.apex, this.tgt, `hsla(45, 100%, 85%, ${a})`, 8)
                    var fl = Math.max(0, 1 - (this.frame - 100) / 18)
                    DrawCircle(this.tgt[0], this.tgt[1], 22 * fl, `hsla(35, 100%, 70%, ${0.8 * a * fl})`)
                    DrawCircle(this.tgt[0], this.tgt[1], 12 * fl, `hsla(50, 100%, 95%, ${a * fl})`)
                }
            }
        }
    }

    // BeginTurn: your turn opens — a Republic-blue charge rises from the base and
    // three action-point pips ignite left-to-right. (Squad is ready to act.)
    function BeginTurn() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.masterAlpha = 1
        this.duration = 66
        this.draw = function () {
            this.frame++
            if (this.alpha < 1 && !this.fadingOut) this.alpha += 0.1
            if (this.alpha > 1) this.alpha = 1
            if ((!beginTurnGoing || this.frame > this.duration) && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.masterAlpha -= 0.05
                if (this.masterAlpha <= 0) { this.masterAlpha = 0; this.lifetime = 0; beginTurnGoing = false; return }
            }
            var a = this.alpha * this.masterAlpha
            DrawRect(0, 0, 320, 200, `hsla(0,0%,0%,${a})`)

            // rising energy band sweeping bottom -> top
            var rise = Math.min(1, this.frame / 34)
            var edge = 200 - rise * 200
            for (var i = 0; i < 26; i++) {
                var yy = edge + i * 6
                if (yy > 200) break
                var g = 1 - i / 26
                DrawRect(0, yy, 320, 8, `hsla(205, 100%, ${45 + g * 25}%, ${0.12 * g * a})`)
            }
            DrawLine([0, edge], [320, edge], `hsla(195, 100%, 80%, ${0.8 * a})`, 14)

            // three AP pips igniting in sequence at center
            for (var p = 0; p < 3; p++) {
                var px = 160 + (p - 1) * 70
                var lit = this.frame > 20 + p * 9
                var pop = lit ? Math.min(1, (this.frame - (20 + p * 9)) / 6) : 0
                DrawStroke(px, 100, 27, `hsla(200, 60%, 60%, ${0.4 * a})`, 4.5)
                if (lit) {
                    DrawCircle(px, 100, 16 + pop * 5, `hsla(195, 100%, 65%, ${0.35 * a})`)
                    DrawCircle(px, 100, 12, `hsla(190, 100%, 92%, ${a})`)
                    DrawStroke(px, 100, 27 + (1 - pop) * 18, `hsla(190, 100%, 85%, ${(1 - pop) * a})`, 6)
                }
            }
        }
    }

    // EndTurn: you pass the turn — a cool grey wash falls from the top and the
    // action pips deplete to dark. (Control hands over; squad stands down.)
    function EndTurn() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.masterAlpha = 1
        this.duration = 60
        this.draw = function () {
            this.frame++
            if (this.alpha < 1 && !this.fadingOut) this.alpha += 0.1
            if (this.alpha > 1) this.alpha = 1
            if ((!endTurnGoing || this.frame > this.duration) && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.masterAlpha -= 0.05
                if (this.masterAlpha <= 0) { this.masterAlpha = 0; this.lifetime = 0; endTurnGoing = false; return }
            }
            var a = this.alpha * this.masterAlpha
            DrawRect(0, 0, 320, 200, `hsla(0,0%,0%,${a})`)

            // red band descending top -> bottom
            var fall = Math.min(1, this.frame / 34)
            var edge = fall * 200
            for (var i = 0; i < 26; i++) {
                var yy = edge - i * 6
                if (yy < 0) break
                var g = 1 - i / 26
                DrawRect(0, yy - 8, 320, 8, `hsla(0, 80%, ${20 + g * 25}%, ${0.14 * g * a})`)
            }
            DrawLine([0, edge], [320, edge], `hsla(0, 90%, 60%, ${0.7 * a})`, 14)

            // three pips depleting left-to-right (lit -> dark)
            for (var p = 0; p < 3; p++) {
                var px = 160 + (p - 1) * 70
                var off = this.frame > 12 + p * 8
                DrawStroke(px, 100, 28, `hsla(0, 70%, 50%, ${0.5 * a})`, 4.5)
                if (!off) {
                    DrawCircle(px, 100, 14, `hsla(0, 95%, 62%, ${0.9 * a})`)
                } else {
                    DrawCircle(px, 100, 11, `hsla(0, 60%, 26%, ${0.7 * a})`)
                }
            }
        }
    }

    // MissionComplete: victory — a bright cyan/white shockwave rings out from center
    // with radiating spokes and rising gold Advantage sparks. (Objective secured.)
    function MissionComplete() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.masterAlpha = 1
        this.duration = 92
        this.rain = []
        this.rainTimer = 0
        this.draw = function () {
            this.frame++
            if (this.alpha < 1 && !this.fadingOut) this.alpha += 0.1
            if (this.alpha > 1) this.alpha = 1
            if ((!missionCompleteGoing || this.frame > this.duration) && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.masterAlpha -= 0.04
                if (this.masterAlpha <= 0) { this.masterAlpha = 0; this.lifetime = 0; missionCompleteGoing = false; return }
            }
            var a = this.alpha * this.masterAlpha
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)

            // Full-screen white rain, rising bottom-to-top and out the top — drawn FIRST so
            // the blue triangles sit in front of it.
            this.rainTimer--
            if (this.rainTimer <= 0 && !this.fadingOut) {
                this.rain.push({ x: Math.random() * 320, y: 205, len: 22 + Math.random() * 22, speed: 4 + Math.random() * 3.5 })
                this.rainTimer = 1 + Math.floor(Math.random() * 3)
            }
            for (var i = this.rain.length - 1; i >= 0; i--) {
                var d = this.rain[i]
                d.y -= d.speed
                if (d.y + d.len < 0) { this.rain.splice(i, 1); continue }
                DrawLine([d.x, d.y], [d.x, d.y + d.len], `hsla(200, 20%, 100%, ${0.35 * a})`, 12)
                DrawLine([d.x, d.y], [d.x, d.y + d.len], `hsla(200, 25%, 100%, ${a})`, 6)
            }

            // Two big blue triangles slide in from the sides and settle toward the middle,
            // in front of the rain.
            var p = Math.min(1, this.frame / 26)
            var ease = 1 - Math.pow(1 - p, 3)          // ease-out
            var off = (1 - ease) * 240                 // start off-screen, settle to 0

            // left triangle (base on the left, tip pointing right) — glow + bright
            DrawTriangle(20 - off, 38, 20 - off, 162, 126 - off, 100, `hsla(205, 100%, 28%, ${0.5 * a})`)
            DrawTriangle(26 - off, 46, 26 - off, 154, 122 - off, 100, `hsla(198, 100%, 55%, ${a})`)
            // right triangle (base on the right, tip pointing left) — glow + bright
            DrawTriangle(300 + off, 38, 300 + off, 162, 194 + off, 100, `hsla(205, 100%, 28%, ${0.5 * a})`)
            DrawTriangle(294 + off, 46, 294 + off, 154, 198 + off, 100, `hsla(198, 100%, 55%, ${a})`)
        }
    }

    // MissionFailed: defeat — same shape as Mission Complete but RED triangles, and the
    // white rain falls top-to-bottom instead of rising.
    function MissionFailed() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.masterAlpha = 1
        this.duration = 96
        this.rain = []
        this.rainTimer = 0
        this.draw = function () {
            this.frame++
            if (this.alpha < 1 && !this.fadingOut) this.alpha += 0.1
            if (this.alpha > 1) this.alpha = 1
            if ((!missionFailedGoing || this.frame > this.duration) && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.masterAlpha -= 0.04
                if (this.masterAlpha <= 0) { this.masterAlpha = 0; this.lifetime = 0; missionFailedGoing = false; return }
            }
            var a = this.alpha * this.masterAlpha
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)

            // Full-screen white rain, FALLING top-to-bottom out the bottom — drawn FIRST so
            // the red triangles sit in front of it.
            this.rainTimer--
            if (this.rainTimer <= 0 && !this.fadingOut) {
                this.rain.push({ x: Math.random() * 320, y: -46, len: 22 + Math.random() * 22, speed: 4 + Math.random() * 3.5 })
                this.rainTimer = 1 + Math.floor(Math.random() * 3)
            }
            for (var i = this.rain.length - 1; i >= 0; i--) {
                var d = this.rain[i]
                d.y += d.speed
                if (d.y > 205) { this.rain.splice(i, 1); continue }
                DrawLine([d.x, d.y], [d.x, d.y + d.len], `hsla(200, 20%, 100%, ${0.35 * a})`, 12)
                DrawLine([d.x, d.y], [d.x, d.y + d.len], `hsla(200, 25%, 100%, ${a})`, 6)
            }

            // Two big red triangles slide in from the sides and settle toward the middle,
            // in front of the rain.
            var p = Math.min(1, this.frame / 26)
            var ease = 1 - Math.pow(1 - p, 3)          // ease-out
            var off = (1 - ease) * 240                 // start off-screen, settle to 0

            // left triangle (base on the left, tip pointing right) — glow + bright
            DrawTriangle(20 - off, 38, 20 - off, 162, 126 - off, 100, `hsla(2, 100%, 26%, ${0.5 * a})`)
            DrawTriangle(26 - off, 46, 26 - off, 154, 122 - off, 100, `hsla(0, 100%, 50%, ${a})`)
            // right triangle (base on the right, tip pointing left) — glow + bright
            DrawTriangle(300 + off, 38, 300 + off, 162, 194 + off, 100, `hsla(2, 100%, 26%, ${0.5 * a})`)
            DrawTriangle(294 + off, 46, 294 + off, 154, 198 + off, 100, `hsla(0, 100%, 50%, ${a})`)
        }
    }

    // Reinforcements: enemies incoming — hazard stripes flash and drop-streaks slam
    // down from the sky, each with an amber impact burst. (Hostiles are dropping in.)
    function Reinforcements() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.masterAlpha = 1
        this.duration = 90
        this.drops = []
        this.dropTimer = 0
        this.draw = function () {
            this.frame++
            if (this.alpha < 1 && !this.fadingOut) this.alpha += 0.1
            if (this.alpha > 1) this.alpha = 1
            if ((!reinforcementsGoing || this.frame > this.duration) && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.masterAlpha -= 0.05
                if (this.masterAlpha <= 0) { this.masterAlpha = 0; this.lifetime = 0; reinforcementsGoing = false; return }
            }
            var a = this.alpha * this.masterAlpha
            DrawRect(0, 0, 320, 200, `hsla(0,0%,0%,${a})`)

            // pulsing hazard stripes top & bottom
            var blink = 0.35 + 0.35 * (Math.sin(this.frame * 0.3) + 1) / 2
            for (var sx = -24; sx < 344; sx += 30) {
                DrawLine([sx, 0], [sx + 50, 70], `hsla(38, 100%, 55%, ${blink * a})`, 18)
                DrawLine([sx, 200], [sx + 50, 130], `hsla(38, 100%, 55%, ${blink * a})`, 18)
            }
            
            // two alert chevrons per side, sweeping across the screen and leaving it:
            // the left-side pair travels right, the right-side pair travels left. Each
            // chevron is one connected path (arm -> tip -> arm) so the tip joins cleanly.
            var period = 372, speed = 4
            function chevron(tipX, cy, dir) {
                hiddenCtx.save()
                hiddenCtx.beginPath()
                hiddenCtx.strokeStyle = `hsla(0, 100%, 60%, ${a})`
                hiddenCtx.lineWidth = 18
                hiddenCtx.lineJoin = 'round'
                hiddenCtx.lineCap = 'round'
                hiddenCtx.moveTo(tipX - dir * 24, cy - 28)
                hiddenCtx.lineTo(tipX, cy)
                hiddenCtx.lineTo(tipX - dir * 24, cy + 28)
                hiddenCtx.stroke()
                hiddenCtx.restore()
            }
            for (var k = 0; k < 2; k++) {
                var cy2 = 74 + k * 52
                var phase = (this.frame * speed + k * 186) % period
                chevron(-26 + phase, cy2, 1)     // left side -> sweeps right
                chevron(346 - phase, cy2, -1)    // right side -> sweeps left
            }
        }
    }

    

    // Death: an operative falls — permadeath. A red heartbeat spikes once then
    // flatlines, and a red pulse rings out before the light dims to black.
    function Death() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.masterAlpha = 1
        this.duration = 150   // spike crosses by ~frame 85, then the flatline holds
        this.draw = function () {
            this.frame++
            if (this.alpha < 1 && !this.fadingOut) this.alpha += 0.05
            if (this.alpha > 1) this.alpha = 1
            if ((!deathGoing || this.frame > this.duration) && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.masterAlpha -= 0.035
                if (this.masterAlpha <= 0) { this.masterAlpha = 0; this.lifetime = 0; deathGoing = false; return }
            }
            var a = this.alpha * this.masterAlpha
            DrawRect(0, 0, 320, 200, `hsla(0,0%,0%,${a})`)  // themed mournful red

            var cx = 160, cy = 100
            // single red pulse ring, expanding once around the beat
            var pf = this.frame
            if (pf < 70) {
                var rad = pf * 2.8
                var fade = Math.max(0, 1 - rad / 170)
                DrawStroke(cx, cy, rad, `hsla(2, 90%, 50%, ${0.5 * a * fade})`, 9)
            }

            // heartbeat: a sweep head passes left->right across the screen drawing the
            // trace. The spike is FIXED at center (it does not slide) — only the drawing
            // head moves. Behind it trails a flat red line: the beat, then the flatline.
            var midY = 100
            var beatX = this.frame * 3.4            // sweep head position, passing across
            function qrs(d) {                       // beat shape, fixed at x=160
                if (d < -40 || d > 45) return 0
                if (d < -20) return (d + 40) * 0.75      // gentle Q dip (down)
                if (d < 0)   return 15 - (d + 20) * 5    // tall sharp R rise (up)
                if (d < 20)  return -85 + d * 6.25       // R falls through S (down)
                return 40 - (d - 20) * 1.6               // S recovers to baseline
            }
            var end = Math.min(320, beatX)
            hiddenCtx.save()
            hiddenCtx.beginPath()
            hiddenCtx.strokeStyle = `hsla(0, 95%, 55%, ${0.9 * a})`
            hiddenCtx.lineWidth = 20
            hiddenCtx.lineJoin = 'round'
            hiddenCtx.lineCap = 'round'
            hiddenCtx.moveTo(0, midY + qrs(0 - 160))
            for (var x = 2; x <= end; x += 2) {
                hiddenCtx.lineTo(x, midY + qrs(x - 160))
            }
            hiddenCtx.stroke()
            hiddenCtx.restore()
            // glowing sweep head as it passes across the screen
            if (beatX < 320) {
                var hy = midY + qrs(beatX - 160)
                DrawCircle(beatX, hy, 10, `hsla(0, 100%, 60%, ${0.35 * a})`)
                DrawCircle(beatX, hy, 5, `hsla(0, 100%, 90%, ${a})`)
            }
        }
    }

    // Downed: an operative is incapacitated (but alive) — a red distress beacon pulses
    // over a slumped figure, with a blinking alert and a weak, slow life-pulse.
    function Downed() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.masterAlpha = 1
        this.duration = 120
        this.draw = function () {
            this.frame++
            if (this.alpha < 1 && !this.fadingOut) this.alpha += 0.07
            if (this.alpha > 1) this.alpha = 1
            if (this.frame > this.duration && !this.fadingOut) this.fadingOut = true   // one-shot announce
            if (this.fadingOut) {
                this.masterAlpha -= 0.05
                if (this.masterAlpha <= 0) { this.masterAlpha = 0; this.lifetime = 0; return }
            }
            var a = this.alpha * this.masterAlpha
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)

            var cx = 160, cy = 118
            // distress beacon rings — CONTRACTING inward, collapsing toward the fallen operative
            for (var r = 0; r < 3; r++) {
                var rf = (this.frame + r * 24) % 72
                var rad = 10 + (72 - rf) * 2.2      // start large, shrink toward the body
                var fade = Math.max(0, 1 - rf / 72)
                DrawStroke(cx, cy, rad, `hsla(2, 95%, 55%, ${0.5 * a * fade})`, 8)
            }
            // slumped/downed figure silhouette (lying down): body ellipse + head
            DrawEllipse(cx, cy, 42, 14, 0, `hsla(0, 55%, 40%, ${0.9 * a})`)
            DrawCircle(cx - 46, cy - 2, 12, `hsla(0, 52%, 44%, ${0.9 * a})`)
            // weak, slow life-pulse washing over the body (down but alive)
            var beat = (Math.sin(this.frame * 0.12) + 1) / 2
            DrawEllipse(cx, cy, 42, 14, 0, `hsla(4, 100%, 60%, ${0.28 * a * beat})`)
            // blinking red alert marker above the body ( "!" ) — bar and dot clearly separated
            if (Math.floor(this.frame / 16) % 2 === 0) {
                var ay = cy - 48
                DrawLine([cx, ay - 28], [cx, ay], `hsla(0, 100%, 65%, ${a})`, 14)   // bar
                DrawCircle(cx, ay + 22, 8, `hsla(0, 100%, 70%, ${a})`)              // dot (bigger gap below the bar)
            }
        }
    }

    // Recovery: the downed operative gets back up — a green revive pulse lifts a figure
    // from the ground to standing, a medical cross forms, and renewal sparks rise.
    function Recovery() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.masterAlpha = 1
        this.duration = 110
        this.sparks = []
        this.draw = function () {
            this.frame++
            if (this.alpha < 1 && !this.fadingOut) this.alpha += 0.08
            if (this.alpha > 1) this.alpha = 1
            if (this.frame > this.duration && !this.fadingOut) this.fadingOut = true   // one-shot per heal
            if (this.fadingOut) {
                this.masterAlpha -= 0.05
                if (this.masterAlpha <= 0) { this.masterAlpha = 0; this.lifetime = 0; return }
            }
            var a = this.alpha * this.masterAlpha
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)

            var cx = 160
            var groundY = 150
            // rise progress: figure lifts off the ground and stands up
            var rise = Math.min(1, this.frame / 46)
            var bodyCy = groundY - rise * 46      // moves up
            var bw = 42 - rise * 28               // wide (lying) -> narrow (standing)
            var bh = 14 + rise * 26               // short -> tall
            // green revive rings rising with the figure
            for (var r = 0; r < 2; r++) {
                var rf = (this.frame + r * 20) % 60
                var rad = 8 + rf * 1.8
                var fade = Math.max(0, 1 - rf / 60)
                DrawStroke(cx, bodyCy, rad, `hsla(135, 100%, 55%, ${0.45 * a * fade})`, 8)
            }
            // the rising / standing figure
            DrawEllipse(cx, bodyCy, bw, bh, 0, `hsla(130, 70%, 48%, ${0.9 * a})`)
            var headY = bodyCy - bh - 4
            DrawCircle(cx, headY, 11, `hsla(130, 75%, 55%, ${0.9 * a})`)
            // green medical cross forming above once mostly risen
            if (rise > 0.5) {
                var cf = (rise - 0.5) / 0.5
                var ccy = headY - 28
                DrawLine([cx - 13 * cf, ccy], [cx + 13 * cf, ccy], `hsla(130, 100%, 75%, ${a})`, 7)
                DrawLine([cx, ccy - 13 * cf], [cx, ccy + 13 * cf], `hsla(130, 100%, 75%, ${a})`, 7)
            }
            // rising green renewal sparks
            if (this.frame % 4 === 0 && !this.fadingOut && this.sparks.length < 30)
                this.sparks.push({ x: cx + (Math.random() - 0.5) * 96, y: groundY + 12, vy: -1 - Math.random() * 1.6, life: 1 })
            for (var i = this.sparks.length - 1; i >= 0; i--) {
                var sp = this.sparks[i]
                sp.y += sp.vy; sp.life -= 0.02
                if (sp.life <= 0) { this.sparks.splice(i, 1); continue }
                DrawCircle(sp.x, sp.y, 5, `hsla(130, 100%, 70%, ${a * sp.life})`)
            }
        }
    }

    //#endregion

    window.requestAnimationFrame(update)
</script>
