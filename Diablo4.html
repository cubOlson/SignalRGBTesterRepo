<script>
const health_Meter = new Meter(5,healthCallback);

const inGame_Meter = new Meter(2,inGameCallback); 
const inGame2_Meter = new Meter(2,inGameCallback); 

const flaskWhite_Meter = new Meter(8,flaskCallback); 

const dodge_Meter = new Meter(5,dodgeCallback); 

const level_Meter = new Meter(5,levelCallback); 

const SafeZoneAbility0_Meter = new Meter(15,SafeZoneCallback); 

const DeadRed_Meter = new Meter(8,DeadCallback); 
const DeadBlack_Meter = new Meter(8,DeadCallback); 

const mana_Meter = new Meter(5,manaCallback);
const manaBright_Meter = new Meter(5,()=>"")
const manaCol_Meter = new Meter(5,()=>"");

const ability1_Meter = new Meter(3, ability1Callback)
const ability2_Meter = new Meter(3, ability2Callback)
const ability3_Meter = new Meter(3, ability3Callback)
const ability4_Meter = new Meter(3, ability4Callback)
const ability5_Meter = new Meter(3, ability5Callback)
const ability6_Meter = new Meter(3, ability6Callback)
const ability1Col_Meter = new Meter(10, ability1Callback)
const ability2Col_Meter = new Meter(10, ability2Callback)
const ability3Col_Meter = new Meter(10, ability3Callback)
const ability4Col_Meter = new Meter(10, ability4Callback)
const ability5Col_Meter = new Meter(10, ability5Callback)
const ability6Col_Meter = new Meter(10, ability6Callback)

const hasSkillGreyMeter = new Meter(10, skillAvailableCallback)
const hasSkillYellowMeter = new Meter(3, skillAvailableCallback)

const eventCompleteWhiteMeter = new Meter(10, eventCompleteCallback)
const eventCompleteRedMeter = new Meter(10, eventCompleteCallback)

const questCompleteColorMeter = new Meter(1, questCompleteCallback)
const questCompleteRedMeter = new Meter(8, questCompleteCallback)
const questCompleteWhiteMeter = new Meter(8, questCompleteCallback)

const buffedGreenMeter = new Meter(10, buffedCallback)

const waypointBlueMeter = new Meter(10, waypointCallback)
const waypointRedMeter = new Meter(10, waypointCallback)


let designatedHealthSize = 0;
let currentHealthSize = 0;
let designatedManaSize = 0;
let currentManaSize = 0;

let gInGame = false;
let gInSafeZone = false;
let gPlayCopyScreen = true

let canvas, ctx;

const foreGroundEffects = new childArray();
const backGroundEffects= new childArray()

const stateHdlr = new StateHandler();
let latestLocation = {x:0,y:0}
let lowHealthPlaying = false;
let lowManaPlaying = false;

function update(){
  if(Date.now() % 2) inGameCallback()
inGame_Meter.setValue(engine.vision.inGame)
inGame2_Meter.setValue(engine.vision.inGame2)
if(engine.vision.health > 0.99 || engine.vision.health < 0.93)
health_Meter.setValue(engine.vision.health + engine.vision.health2)
mana_Meter.setValue(engine.vision.mana)
manaBright_Meter.setValue(engine.vision.manaBright)

if (engine.vision.mana > 0.3){
  manaCol_Meter.setValue(engine.vision.manaCol)
}

if (gInGame){
  flaskWhite_Meter.setValue(engine.vision.flaskWhite)
  dodge_Meter.setValue(engine.vision.dodge)
  level_Meter.setValue(engine.vision.level)
  SafeZoneAbility0_Meter.setValue(engine.vision.safeZoneAbility0)
  if(engine.vision.safeZoneAbility0 != 1){
    ability1_Meter.setValue(engine.vision.ability1[2])
    ability2_Meter.setValue(engine.vision.ability2[2])
    ability3_Meter.setValue(engine.vision.ability3[2])
    ability4_Meter.setValue(engine.vision.ability4[2])
    ability5_Meter.setValue(engine.vision.ability5[2])
    ability6_Meter.setValue(engine.vision.ability6[2])
    ability1Col_Meter.setValue(engine.vision.ability1[0])
    ability2Col_Meter.setValue(engine.vision.ability2[0])
    ability3Col_Meter.setValue(engine.vision.ability3[0])
    ability4Col_Meter.setValue(engine.vision.ability4[0])
    ability5Col_Meter.setValue(engine.vision.ability5[0])
    ability6Col_Meter.setValue(engine.vision.ability6[0])
}
  hasSkillGreyMeter.setValue(engine.vision.skillPointGrey)
  hasSkillYellowMeter.setValue(engine.vision.skillPointYellow)
  buffedGreenMeter.setValue(engine.vision.buffedGreen)
  waypointBlueMeter.setValue(engine.vision.waypointBlue)
  waypointRedMeter.setValue(engine.vision.waypointRed + engine.vision.waypointRed2)
}
DeadRed_Meter.setValue(engine.vision.deadRed)
DeadBlack_Meter.setValue(engine.vision.deadBlack)
eventCompleteWhiteMeter.setValue(engine.vision.eventCompleteWhite)
eventCompleteRedMeter.setValue(engine.vision.eventCompleteRed + engine.vision.eventCompleteRed2)
questCompleteColorMeter.setValue(engine.vision.questColor[0])
questCompleteRedMeter.setValue(engine.vision.questRed)
questCompleteWhiteMeter.setValue(engine.vision.questWhite)


  if(gPlayCopyScreen) copyScreen(1);
  backGroundEffects.draw();
  foreGroundEffects.draw();
  stateHdlr.Process();
  drawHud();
  window.requestAnimationFrame(update);
}

  function drawHud() {
      let hpColor = hexToHSL(healthColor);
      let mnColor = hexToHSL(manaColor);

      if (gInGame) {
          designatedHealthSize = health_Meter.value;
        if (engine.vision.mana > 0.3) { 
            designatedManaSize = mana_Meter.value + manaBright_Meter.value;
        } 
      } else {
          designatedHealthSize = 0;
          designatedManaSize = 0;
      }

      currentHealthSize = lerp(currentHealthSize, designatedHealthSize, 0.05);
      currentManaSize = lerp(currentManaSize, designatedManaSize, 0.05);

      let healthString = `hsl(${hpColor.h}, ${hpColor.s}%, ${hpColor.l}%)`
      let manaString = `hsl(${mnColor.h}, ${mnColor.s}%, ${mnColor.l}%)`

      if (enableHealthHUD) {
          if (blackToggle) {
              DrawRect((healthX * 3.2), (healthY * 2), (healthWidth * 3.2), healthHeight, "black");
          }

          let healthBarWidth;
          if (adjToggle) {
              healthBarWidth = (healthWidth * 3.2);
          } else {
              healthBarWidth = currentHealthSize * (healthWidth * 3.2);
          }

          DrawRect((healthX * 3.2), (healthY * 2), healthBarWidth, healthHeight, healthString);
      }

      if (enableManaHUD) {
          if (blackToggle) {
              DrawRect((manaX * 3.2), (manaY * 2), (manaWidth * 3.2), manaHeight, "black");
          }

          let manaBarWidth;
          if (adjToggle) {
              manaBarWidth = (manaWidth * 3.2);
          } else {
              manaBarWidth = currentManaSize * (manaWidth * 3.2) * 1.05;
          }

          DrawRect((manaX * 3.2), (manaY * 2), manaBarWidth, manaHeight, manaString);
      }
  }

  function lerp(a, b, speed) {
    return a + speed * (b - a)
  }

  let menuGoing = false
 function inGameCallback () {
  if (engine.vision.inGame >= 0.95 && engine.vision.inGame2 >= 0.95 && (DeadBlack_Meter.value != 1 || DeadRed_Meter.value != 1) && health_Meter.value > .05) {
    gInGame = true;
  } else {
    gInGame = false;
    backGroundEffects.clear()
    if(!menuGoing && enableMenu){
      foreGroundEffects.push(new InMenu())
      menuGoing = true
    } 
  }
}

 function flaskCallback () {
  if (flaskWhite_Meter.value > 0.95 && enableFlask && engine.vision.inGame >= 0.95) {
   foreGroundEffects.push(new flaskEffect())
  }
}

 function dodgeCallback () {
  if (dodge_Meter.value > 0.95 && enableDodge && engine.vision.inGame >= 0.95) {
    foreGroundEffects.push(new dodgeEffect())
  }
}

 function levelCallback () {
  if(engine.vision.inGame >= 0.95 && engine.vision.inGame2 >= 0.95 && level_Meter.value <= 0.1 && level_Meter.decreased && enableLevelUp){
    foreGroundEffects.push(new levelUpEffect())
  }
}

 function SafeZoneCallback () {
  if (SafeZoneAbility0_Meter.increased && SafeZoneAbility0_Meter.diff >.4 && SafeZoneAbility0_Meter.value >.5 && !gInSafeZone && enableSafeZone && engine.vision.inGame >= 0.95){
    foreGroundEffects.push(new EnterSafe())
    gInSafeZone = true;
  } else if(gInSafeZone && SafeZoneAbility0_Meter.decreased && SafeZoneAbility0_Meter.diff <.4 && SafeZoneAbility0_Meter.value <.2) {
    foreGroundEffects.push(new ExitSafe())
    gInSafeZone = false;
  }

}

 function DeadCallback () {
  if (DeadRed_Meter.value >= 0.95 && DeadBlack_Meter.value >= 0.95  && enableDead){
    foreGroundEffects.push(new deadEffect())
  }
}

const particleAmount = 50;

let ability1Delay = Date.now()
function ability1Callback(){
  if(ability1_Meter.diff >5 && ability1_Meter.decreased && enableAbility && gInGame && engine.vision.inGame >= 0.95 && Date.now() - ability1Delay > 300){
   backGroundEffects.push(new ParticleExplosion(latestLocation.x,latestLocation.y, `hsl(${ability1Col_Meter.value},100%,50%)`,5,2000,particleAmount,12,2 ))
   ability1Delay = Date.now()
  }
}

let ability2Delay = Date.now()
function ability2Callback(){
  if(ability2_Meter.diff >5 && ability2_Meter.decreased && enableAbility && gInGame && engine.vision.inGame >= 0.95 && Date.now() - ability2Delay > 300){
    backGroundEffects.push(new ParticleExplosion(latestLocation.x,latestLocation.y, `hsl(${ability2Col_Meter.value},100%,50%)`,5,2000,particleAmount,12,2 ))
    ability2Delay = Date.now()
  }
}

let ability3Delay = Date.now()
function ability3Callback(){
  if(ability3_Meter.diff >5 && ability3_Meter.decreased && enableAbility && gInGame && engine.vision.inGame >= 0.95 && Date.now() - ability3Delay > 300){
    backGroundEffects.push(new ParticleExplosion(latestLocation.x,latestLocation.y, `hsl(${ability3Col_Meter.value},100%,50%)`,5,2000,particleAmount,12,2 ))
    ability3Delay = Date.now()
  }
}

let ability4Delay = Date.now()
function ability4Callback(){
  if(ability4_Meter.diff >5 && ability4_Meter.decreased && enableAbility && gInGame && engine.vision.inGame >= 0.95 && Date.now() - ability4Delay > 300){
    backGroundEffects.push(new ParticleExplosion(latestLocation.x,latestLocation.y, `hsl(${ability4Col_Meter.value},100%,50%)`,5,2000,particleAmount,12,2 ))
    ability4Delay = Date.now()
  }
}

let ability5Delay = Date.now()
function ability5Callback(){
  if(ability5_Meter.diff >5 && ability5_Meter.decreased && enableAbility && gInGame && engine.vision.inGame >= 0.95 && Date.now() - ability5Delay > 300){
    backGroundEffects.push(new ParticleExplosion(latestLocation.x,latestLocation.y, `hsl(${ability5Col_Meter.value},100%,50%)`,5,2000,particleAmount,12,2 ))
    ability5Delay = Date.now()
  }
}

let ability6Delay = Date.now()
function ability6Callback(){
  if(ability6_Meter.diff >5 && ability6_Meter.decreased && enableAbility && gInGame && engine.vision.inGame >= 0.95 && Date.now() - ability6Delay > 300){
    backGroundEffects.push(new ParticleExplosion(latestLocation.x,latestLocation.y, `hsl(${ability6Col_Meter.value},100%,50%)`,5,2000,particleAmount,12,2 ))
    ability6Delay = Date.now()
  }
}

function healthCallback (){
  if (gInGame && enableHealth && engine.vision.inGame >= 0.95){
    if (health_Meter.value < 0.2 && !lowHealthPlaying){
      backGroundEffects.push(new lowHealth())
      lowHealthPlaying = true;
    } else if ((lowHealthPlaying && health_Meter.value > 0.25) || !gInGame || menuGoing){ 
      lowHealthPlaying = false
    }
  }
}

function manaCallback (){
  if (gInGame && enableMana && engine.vision.inGame >= 0.95){
    if (mana_Meter.value < 0.2 && !lowManaPlaying){
      backGroundEffects.push(new lowMana())
      lowManaPlaying = true
    } else if ((lowManaPlaying && mana_Meter.value > 0.25) || !gInGame || menuGoing){
      lowManaPlaying = false
    }
  }
}

let eventGoing = false
function eventCompleteCallback(){
  if(eventCompleteWhiteMeter.value >= .6 && eventCompleteRedMeter.value >= .75 && gInGame && !eventGoing && engine.vision.inGame >= 0.95){
    if(enableEvent) foreGroundEffects.push(new eventComplete())
    eventGoing = true
  } else if (eventCompleteWhiteMeter.value <= 0.1 && eventCompleteRedMeter.value <= 0.1) eventGoing = false;
}

function skillAvailableCallback(){
  if(hasSkillGreyMeter.value >= 0.95 && hasSkillYellowMeter.value >= 0.95 && gInGame && engine.vision.inGame >= 0.95){
    if(enableLevelUp) foreGroundEffects.push(new hasSkillPoint())
  }
}

let questGoing = false
function questCompleteCallback(){
  if(questCompleteRedMeter.value > .3 && questCompleteWhiteMeter.value > .1 && !questGoing && gInGame && engine.vision.inGame >= 0.95){
    if(enableQuest) foreGroundEffects.push(new questComplete())
    questGoing = true
  } else if (questCompleteRedMeter.value <= 0.1 && questCompleteWhiteMeter.value <= 0.1 && gInGame) questGoing = false
}

let buffed = false
function buffedCallback(){
  if(buffedGreenMeter.value > .3 && buffedGreenMeter.increased && engine.vision.buffedNotGreen <=.1 && gInGame && !buffed && engine.vision.inGame >= 0.95){
    if(enableBuff) foreGroundEffects.push(new gotBuffed())
    buffed = true
  } else if (gInGame && buffedGreenMeter.value <= 0.1) buffed = false
}

let waypointGoing = false;
function waypointCallback(){
  if(waypointBlueMeter.value >= 0.95 && waypointRedMeter.value >= 0.95 && gInGame && !waypointGoing){
    if(enableWaypoint) foreGroundEffects.push(new waypoint())
    waypointGoing = true
  }
}

function gotBuffed(){
    this.count = 0
    this.draw = function(){
      if(this.count == 0) foreGroundEffects.push(new rJumpHelp(120, 90, 20))
      if(this.count == 20) foreGroundEffects.push(new rJumpHelp(120, 90, 30))
      if(this.count == 40) foreGroundEffects.push(new rJumpHelp(120, 90, 40))
      this.count < 41 ? this.count++ : this.lifetime = 0;
      if(!gInGame) this.lifetime = 0
    }
  }

  function rJumpHelp(hue, sat, lit){
    this.hue = hue
    this.sat = sat
    this.lit = lit
    this.y = 300
    this.vy = 0
    this.lifetime = 100
    this.draw = function(){
      ctx.beginPath()
      ctx.moveTo(0, this.y + 100)
      ctx.lineTo(160, this.y)
      ctx.lineTo(320, this.y + 100)
      ctx.strokeStyle = `hsl(${this.hue}, ${this.sat}%, ${this.lit}%)`
      ctx.lineWidth = 50
      ctx.stroke()
      this.y > -100 ? this.y-=this.vy : this.lifetime = 0
      this.vy+=.05
      if(!gInGame) this.lifetime = 0
    }
  }

function waypoint(){
    this.effects = []
    this.alpha = 0
    this.count = 0;
    this.draw = function(){
      DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${this.alpha})`)
      this.alpha < .5 ? this.alpha += .025 : gPlayCopyScreen = false
      if(this.count < 300) this.effects.push(new wayParticle())
      this.effects.forEach((ele, i)=>{
        ele.draw()
        if(ele.lifetime <= 0) this.effects.splice(i, 1)
      })
      this.count < 300 ? this.count++ : this.effects.length > 0 ? this.effects.pop() : this.lifetime = 0
      if(!gInGame) this.lifetime = 0
      if(this.lifetime == 0){
        gPlayCopyScreen = true
        waypointGoing = false
      } 
    }
  }

  function wayParticle(){
    this.rot = Math.random() * Math.PI * 2
    this.x = -50
    this.y = 100
    this.rad = 40 + 20 * Math.random()
    this.mod = Math.random() + .5
    this.draw = function(){
      ctx.save()
      ctx.translate(160, 100)
      ctx.rotate(this.rot)
      ctx.translate(-160, -100)
      DrawCircle(this.x, this.y, this.rad, `hsl(${this.rad + 180}, 100%, 50%)`)
      this.x < 160 ? this.x++ : this.lifetime = 0;
      if(this.rad > 1) this.rad-=.25
      this.rot+=.025 * this.mod
      ctx.restore()
      if(!gInGame) this.lifetime = 0
    }
  }

  function questComplete(){
    this.count = 0
    this.draw = function(){
      if(this.count == 0) foreGroundEffects.push(new rJumpHelp(0, 100, 10))
      if(this.count == 20) foreGroundEffects.push(new rJumpHelp(questCompleteColorMeter.value, 100, 20))
      if(this.count == 40) foreGroundEffects.push(new rJumpHelp(questCompleteColorMeter.value, 100, 30))
      if(this.count == 60) foreGroundEffects.push(new rJumpHelp(0, 100, 40))
      if(this.count == 80) foreGroundEffects.push(new rJumpHelp(questCompleteColorMeter.value, 100, 50))
      if(this.count == 100) foreGroundEffects.push(new rJumpHelp(0, 100, 60))
      this.count < 101 ? this.count++ : this.lifetime = 0;
      if(!gInGame) this.lifetime = 0
    }
  }

  function eventComplete(){
    this.alpha = 0;
    this.count = 0;
    this.effects = []
    this.draw = function(){
      DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${this.alpha})`)
      this.alpha < .75 ? this.alpha += .025 : this.alpha = .75;
      if(this.effects.length < 100 && this.count < 300){
        this.effects.push(new hellParticle(50))
        if(Math.random() > .9) this.effects.push(new hellSpark())
      }
      this.effects.forEach((ele, i)=>{
        ele.draw()
        if(ele.lifetime <= 0) this.effects.splice(i, 1)
      })
      this.count < 300 ? this.count++ : this.effects.length == 0 ? null : this.lifetime = 0;
      if(!gInGame) this.lifetime = 0
    }
  }

  function hellSpark(){
    this.x = Math.random() * 320
    this.mod = Math.random()
    this.y = 250
    this.rad = 10
    this.draw = function(){
      DrawCircle(this.x, this.y, this.rad, `hsla(${this.mod * 60}, ${100}%, ${75}%, .9)`)
      this.x += Math.sin(Date.now() / (1000 * this.mod)) * 5
      this.y > -50 ? this.y -= 10: this.lifetime = 0
    }
  }

  function hellParticle(rad){
    this.x = Math.random() * 320
    this.mod = Math.random()
    this.y = 180 + Math.abs(160 - this.x) * .6
    this.rad = rad
    this.draw = function(){
      DrawCircle(this.x, this.y, this.rad, `hsla(${this.rad}, ${100}%, ${50}%, .9)`)
      this.rad > .25 ? this.rad -= .25 : this.rad = .1
      this.x += Math.sin(Date.now() / (1000 * this.mod)) * 3

  function ParticleExplosion(x, y, color, speed, duration, particleAmount, particleSize, fadeSpeed) {

  class ExplosionParticle {
    constructor(x, y, radius, color, fadeSpeed, velocity) {

      this.y = y;
      this.color = color;
      this.radius = radius;
      this.velocity = velocity;
      this.alpha = 1 * fadeSpeed;

      ctx.globalAlpha = this.alpha;
      ctx.beginPath()
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false)
      ctx.fillStyle = this.color
      ctx.fill()
      this.x += this.velocity.x
      this.y += this.velocity.y

  }

    function SetRange(num, min, max) {
      return Math.min(Math.max(num, min), max)
    }


function childArray(){
  this.children = [];
  this.push = function(child){
    this.children.push(child);
  }
  this.draw = function(){
    this.children.forEach((child,i) => {
      child.draw();
      if (child.lifetime <=0){
        this.children.splice(i,1);
      }
    });
  }
  this.clear = function(){
    this.children = [];
  }
}

function rng(amount, negative = true){
  return (Math.random()- (negative?0.5:0))*amount;
}


function getAlpha(elapsed, fadeInTime, duration, fadeOutTime, maxAlpha = 1) {
  if (elapsed < fadeInTime) {
    return (elapsed / fadeInTime) * maxAlpha;
  } else if (elapsed < fadeInTime + duration) {
    return maxAlpha;
  } else if (elapsed < fadeInTime + duration + fadeOutTime) {
    return maxAlpha - ((elapsed - fadeInTime - duration) / fadeOutTime) * maxAlpha;
  } else {
    return 0;
  }
}

class basicEffect {
  constructor( duration = 1000){
    this.start = Date.now();
    this.duration = duration;
    this.elapsed = 0;
  }
  update (){
    this.elapsed = Date.now() - this.start;
    if (this.elapsed > this.duration){
      this.lifetime = 0;
    }
  }
}

class wobblyMotion extends basicEffect {
  constructor(x,y,speed,wobbleMove, wobbleSpeed, duration = 1000){
  super(duration);
  this.x = x;
  this.y = y;
  this.speed = speed;
  this.wobbleMove = wobbleMove;
  this.wobbleSpeed = wobbleSpeed;
  this.start = Date.now();
  }
  update (){
    super.update();
    this.elapsed = Date.now() - this.start;
    this.x = this.x + this.speed.x;
    this.y = this.y + this.speed.y;
    const drawX = this.x + Math.sin(this.elapsed/this.wobbleSpeed) * this.wobbleMove.x;
    const drawY = this.y + Math.sin(this.elapsed/this.wobbleSpeed) * this.wobbleMove.y;
    return {x:drawX,y:drawY}
  }
}

class wobblyExplosionParticle extends wobblyMotion {
  constructor(x,y,speed,wobbleMove, wobbleSpeed, duration = 1000,color,radius){
    super(x,y,speed,wobbleMove, wobbleSpeed, duration = 1000);
    this.color = color;
    this.radius = radius;
    this.particles = new childArray();
  }
  draw(){
    const pos = super.update();
    this.particles.push(new TrailParticle(pos.x,pos.y,this.radius,this.color, this.duration/3))
    this.particles.draw();
    if (this.elapsed > this.duration){
      this.lifetime = 0;
    }
  }
} 

class bubble extends wobblyMotion{
  constructor(x,y,radius,speed,wobbleMove, wobbleSpeed, strokeCol, fillCol, lineWidth,duration = 1000){

  super(x,y,speed,wobbleMove, wobbleSpeed, duration = 1000);
  this.radius = radius;
  this.strokeCol = strokeCol;
  this.fillCol = fillCol;
  this.lineWidth = lineWidth;
  }
  draw(){
    ctx.beginPath();
    ctx.strokeStyle = this.strokeCol;
    ctx.fillStyle = this.fillCol;
    ctx.lineWidth = this.lineWidth;
    const pos = super.update();
    ctx.arc(pos.x, pos.y, this.radius, 0, 2 * Math.PI);
    ctx.stroke();
    ctx.fill();
    if (this.elapsed > this.duration){
      this.lifetime = 0;
    }
  }
}

function MovingArrow(x=160, y=320, width=320, height=150,rotation=90,speed=3, color="red") {
      this.x = x;
      this.y = y;
      this.width = width;
      this.height = height;
      this.color = color;
      this.rotation = rotation;
      this.speed = speed;
      this.draw = function () {
        ctx.beginPath();
        ctx.save();
        ctx.translate(160, 100);
        ctx.rotate(this.rotation * Math.PI / 180);
        ctx.translate(-160, -100);
          DrawArrow(this.x, this.y, this.width, this.height, this.color)
        ctx.restore();
        this.y -= this.speed;
        if (this.y < -this.height) {
          this.lifetime = 0;
        }
      }
    }

    function RippleEffect(x=160, y=100, speed=1, duration=3000, rippleWidth=20, color="red", inOrOut="out", fillOrStroke="stroke", amountOfRipples=4, background=true) {
          this.col = color;
          this.speed = speed;
          this.dur = duration;
          this.width = rippleWidth;
          this.start = Date.now();
          this.lifetime;
          this.x = x;
          this.y = y;
          this.fill = fillOrStroke;
          this.radius = 0;
          this.amount = amountOfRipples;
          this.background = background;
          if (inOrOut == "in") {
            this.radius = 200 + (this.width * (this.amount * 2));
            this.speed = -this.speed
          }
          this.draw = function () {
            if (this.background) {
              ctx.beginPath();
              ctx.fillStyle = "black";
              ctx.fillRect(0, 0, 320, 200);
            }
            ctx.lineWidth = this.width;
            ctx.beginPath();
            for (let i = 0; i < this.amount; i++) {
              ctx.beginPath();
              if (this.radius - i * (this.width * 2) > 0) {
                ctx.arc(this.x, this.y, this.radius - i * (this.width * 2), 0, 2 * Math.PI);
              }
              if (this.fill == "fill") {
                ctx.fillStyle = this.col;
                ctx.fill();
              } else {
                ctx.strokeStyle = this.col;
                ctx.stroke();
              }
            }

            this.radius += this.speed;
            this.lifetime = this.dur - (Date.now() - this.start);
            if (this.lifetime <= 0) {
              utilityPlayed = false;
            }
          }
        }




function DrawRect(x, y, width, height, color) {

};

function DrawCircle(x, y, radius, color) {
  ctx.beginPath();
  ctx.fillStyle = color;
  ctx.arc(x, y, radius, 0, 2 * Math.PI)
  ctx.fill();
};

function StrokeCircle(x, y, width, height, color) {
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = 30;
  ctx.arc(x, y, width, 0, 2 * Math.PI);
  ctx.stroke();
};

function renderPath(x, y, path, color, size, type="fill", strokeWidth = 5) {
  ctx.fillStyle = color;
  ctx.strokeStyle = color;
  ctx.save();
  ctx.transform(size / 10, 0, 0, size / 10, 160 - 10 * 16.5, 79 - size * 7.5);
  ctx.translate(x, y);
  let ex = new Path2D(path);

  if (type == "fill"){
    ctx.fill(ex);
  } else if (type == "stroke"){
    ctx.lineWidth = strokeWidth;
    ctx.stroke(ex);
  }

  ctx.restore();
}



  function DrawArrow(x, y, width, angle, color) {
    ctx.beginPath();
    ctx.moveTo(x - width, y + angle);
    ctx.lineTo(x, y);
    ctx.lineTo(x + width, y + angle);
    ctx.strokeStyle = color;
    ctx.lineWidth = 30;
    ctx.stroke();
  }

        



function getXAndYForPathPoint(point1, point2, percentage) {
    let speed = { x: (point2.x - point1.x) * percentage, y: (point2.y - point1.y) * percentage }
    return { x: point1.x + speed.x, y: point1.y + speed.y }
  }


function copyScreen(alpha) {
  let lightness = new Int8Array(engine.zone.lightness);
  let sat = new Int8Array(engine.zone.saturation);
  let hue = new Int16Array(engine.zone.hue);
  for (let iZone = 0; iZone < 560; iZone++) {
    ctx.fillStyle =
      "hsla(" +
      hue[iZone] +
      "," +
      sat[iZone] +
      "%," +
      lightness[iZone] * keyScreenBrightness * 0.01 +
      "%, " +
      alpha
      +
      ")";
    let iRow = Math.floor(iZone / 28);
    let iCol = iZone % 28;
    let iWidth = 320 / 28;
    let iHeight = 200 / 20;
    let iZx = iCol * iWidth;
    let iZy = iRow * iHeight;

    ctx.fillRect(iZx, iZy, iWidth, iHeight);
  }
}


function StateHandler() {
  let stack = [];
  let state = null;

  let updateState = function () {
    if (stack.length > 0) {
      state = stack[stack.length - 1];
    } else {
      state = null;
    }
  };

  this.Push = function (newState) {
    stack.push(newState);
    updateState();
  };

  this.Pop = function () {
    stack.pop();
    updateState();
  };

  this.Process = function () {
    if (state != null) {
      state.Process();
    }
  };
}



function Meter(size, Callback) {
  this.size = size;
  this.value = 0;
  this.diff = 0;
  this.increased = false;
  this.decreased = false;
  let values = [];

  this.setValue = function (updatedValue) {
    values.push(updatedValue);
    if (values.length > this.size) {
      values.shift();
    }

    for (let i = 0; i < values.length - 1; i++) {
      if (values[i] !== values[i + 1]) return;
    }
    if (this.value !== values[0]) {
      this.diff = Math.abs(this.value - values[0]);
      this.increased = this.value < values[0];
      this.decreased = this.value > values[0];
      this.value = values[0];
      Callback();
    }
  };
}


function hexToHSL(hex) {
    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);

    var r = parseInt(result[1], 16);
    var g = parseInt(result[2], 16);
    var b = parseInt(result[3], 16);

    (r /= 255), (g /= 255), (b /= 255);
    var max = Math.max(r, g, b),
      min = Math.min(r, g, b);
    var h,
      s,
      l = (max + min) / 2;

    if (max === min) {
      h = s = 0; // achromatic
    } else {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r:
          h = (g - b) / d + (g < b ? 6 : 0);
          break;
        case g:
          h = (b - r) / d + 2;
          break;
        case b:
          h = (r - g) / d + 4;
          break;
      }
      h /= 6;
    }

    s = s * 100;
    s = Math.round(s);
    l = l * 100;
    l = Math.round(l);
    h = Math.round(360 * h);

    var colors = [];
    colors['h'] = h;
    colors['s'] = s;
    colors['l'] = l;

    return colors;
  }
