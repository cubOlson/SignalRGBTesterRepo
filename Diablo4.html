<body style="margin: 0; padding: 0; background: #000;">
<canvas id="exCanvas" width="320" height="200"></canvas>

<script>
var canvas, ctx;
canvas = document.getElementById('exCanvas');
ctx = canvas.getContext('2d');
var width = 320;
var height = 200;
var hiddenCanvas = document.createElement("canvas");
hiddenCanvas.width = width;
hiddenCanvas.height = height;
var hctx = hiddenCanvas.getContext("2d");
let gAlpha = 1
var effects = [];
let designatedHealthSize = 0;
let currentHealthSize = 0;
let designatedManaSize = 0;
let currentManaSize = 0;

let gInGame = false;
let gInSafeZone = false;
let gPlayCopyScreen = true
let flaskGoing = false;
let dodgeGoing = false;
let levelUpGoing = false;
let deadGoing = false;
let lowHealthPlaying = false;
let lowManaPlaying = false;
let waypointGoing = false;
let eventCompleteGoing = false;

let latestLocation = {x:0,y:0}
var health_Meter = new Meter(5,healthCallback);

var inGame_Meter = new Meter(2,inGameCallback); 
var inGame2_Meter = new Meter(2,inGameCallback); 

var flaskWhite_Meter = new Meter(8,flaskCallback); 

var dodge_Meter = new Meter(5,dodgeCallback); 

var level_Meter = new Meter(5,levelCallback); 

var SafeZoneAbility0_Meter = new Meter(15,SafeZoneCallback); 

var DeadRed_Meter = new Meter(8,DeadCallback); 
var DeadBlack_Meter = new Meter(8,DeadCallback); 

var mana_Meter = new Meter(5,manaCallback);
var manaBright_Meter = new Meter(5,()=>"")
var manaCol_Meter = new Meter(5,()=>"");

var ability1_Meter = new Meter(3, ability1Callback)
var ability2_Meter = new Meter(3, ability2Callback)
var ability3_Meter = new Meter(3, ability3Callback)
var ability4_Meter = new Meter(3, ability4Callback)
var ability5_Meter = new Meter(3, ability5Callback)
var ability6_Meter = new Meter(3, ability6Callback)
var ability1Col_Meter = new Meter(10, ability1Callback)
var ability2Col_Meter = new Meter(10, ability2Callback)
var ability3Col_Meter = new Meter(10, ability3Callback)
var ability4Col_Meter = new Meter(10, ability4Callback)
var ability5Col_Meter = new Meter(10, ability5Callback)
var ability6Col_Meter = new Meter(10, ability6Callback)

var hasSkillGreyMeter = new Meter(10, skillAvailableCallback)
var hasSkillYellowMeter = new Meter(3, skillAvailableCallback)

var eventCompleteWhiteMeter = new Meter(10, eventCompleteCallback)
var eventCompleteRedMeter = new Meter(10, eventCompleteCallback)

var questCompleteColorMeter = new Meter(1, questCompleteCallback)
var questCompleteRedMeter = new Meter(8, questCompleteCallback)
var questCompleteWhiteMeter = new Meter(8, questCompleteCallback)

var buffedGreenMeter = new Meter(10, buffedCallback)

var waypointBlueMeter = new Meter(10, waypointCallback)
var waypointRedMeter = new Meter(10, waypointCallback)


function update(){
  hctx.clearRect(0, 0, hiddenCanvas.width, hiddenCanvas.height);
  hctx.fillStyle = `hsla(0, 0%, 0%, ${gAlpha})`;
  hctx.fillRect(0, 0, 320, 200);

  backgroundHandler()
  if(Date.now() % 2) inGameCallback()
  inGame_Meter.setValue(engine.vision.inGame)
  inGame2_Meter.setValue(engine.vision.inGame2)
  health_Meter.setValue(engine.vision.health + engine.vision.health2)
  mana_Meter.setValue(engine.vision.mana)
  manaBright_Meter.setValue(engine.vision.manaBright)
  manaCol_Meter.setValue(engine.vision.manaCol)
  flaskWhite_Meter.setValue(engine.vision.flaskWhite)
  dodge_Meter.setValue(engine.vision.dodge)
  level_Meter.setValue(engine.vision.level)
  SafeZoneAbility0_Meter.setValue(engine.vision.safeZoneAbility0)
  ability1_Meter.setValue(engine.vision.ability1[2])
  ability2_Meter.setValue(engine.vision.ability2[2])
  ability3_Meter.setValue(engine.vision.ability3[2])
  ability4_Meter.setValue(engine.vision.ability4[2])
  ability5_Meter.setValue(engine.vision.ability5[2])
  ability6_Meter.setValue(engine.vision.ability6[2])
  ability1Col_Meter.setValue(engine.vision.ability1[0])
  ability2Col_Meter.setValue(engine.vision.ability2[0])
  ability3Col_Meter.setValue(engine.vision.ability3[0])
  ability4Col_Meter.setValue(engine.vision.ability4[0])
  ability5Col_Meter.setValue(engine.vision.ability5[0])
  ability6Col_Meter.setValue(engine.vision.ability6[0])

  hasSkillGreyMeter.setValue(engine.vision.skillPointGrey)
  hasSkillYellowMeter.setValue(engine.vision.skillPointYellow)
  buffedGreenMeter.setValue(engine.vision.buffedGreen)
  waypointBlueMeter.setValue(engine.vision.waypointBlue)
  waypointRedMeter.setValue(engine.vision.waypointRed + engine.vision.waypointRed2)

  DeadRed_Meter.setValue(engine.vision.deadRed)
  DeadBlack_Meter.setValue(engine.vision.deadBlack)
  eventCompleteWhiteMeter.setValue(engine.vision.eventCompleteWhite)
  eventCompleteRedMeter.setValue(engine.vision.eventCompleteRed + engine.vision.eventCompleteRed2)
  questCompleteColorMeter.setValue(engine.vision.questColor[0])
  questCompleteRedMeter.setValue(engine.vision.questRed)
  questCompleteWhiteMeter.setValue(engine.vision.questWhite)
  flaskCallback();
  dodgeCallback();
  //Effect handler 
    for (let i = 0; i < effects.length; i++) {
      effects[i].draw(hctx);
    }
    // Remove dead effects with filter
    effects = effects.filter(ele =>
      ele.lifetime === undefined || ele.lifetime > 0
    );
  drawHud();
  ctx.clearRect(0, 0, width, height);
  ctx.drawImage(hiddenCanvas, 0, 0);

  window.requestAnimationFrame(update);
}

  function drawHud() {
      let hpColor = hexToHSL(healthColor);
      let mnColor = hexToHSL(manaColor);

      if (gInGame) {
          designatedHealthSize = health_Meter.value;
        if (engine.vision.mana > 0.3) { 
            designatedManaSize = mana_Meter.value + manaBright_Meter.value;
        } 
      } else {
          designatedHealthSize = 0;
          designatedManaSize = 0;
      }

      currentHealthSize = lerp(currentHealthSize, designatedHealthSize, 0.05);
      currentManaSize = lerp(currentManaSize, designatedManaSize, 0.05);

      let healthString = `hsl(${hpColor.h}, ${hpColor.s}%, ${hpColor.l}%)`
      let manaString = `hsl(${mnColor.h}, ${mnColor.s}%, ${mnColor.l}%)`

      if (enableHealthHUD) {
          if (blackToggle) {
              DrawRect((healthX * 3.2), (healthY * 2), (healthWidth * 3.2), healthHeight, "black");
          }

          let healthBarWidth;
          if (adjToggle) {
              healthBarWidth = (healthWidth * 3.2);
          } else {
              healthBarWidth = currentHealthSize * (healthWidth * 3.2);
          }

          DrawRect((healthX * 3.2), (healthY * 2), healthBarWidth, healthHeight, healthString);
      }

      if (enableManaHUD) {
          if (blackToggle) {
              DrawRect((manaX * 3.2), (manaY * 2), (manaWidth * 3.2), manaHeight, "black");
          }

          let manaBarWidth;
          if (adjToggle) {
              manaBarWidth = (manaWidth * 3.2);
          } else {
              manaBarWidth = currentManaSize * (manaWidth * 3.2) * 1.05;
          }

          DrawRect((manaX * 3.2), (manaY * 2), manaBarWidth, manaHeight, manaString);
      }
  }

  function lerp(a, b, speed) {
    return a + speed * (b - a)
  }

  let proBack = []
    function onbackColorChanged(){
      proBack = hexToHSL(backColor)
    }

    let backgroundEaseHue = 0;
    let backgroundEaseLit = 0;
    let backgroundEaseSat = 0
    let gCycle = 0
    function backgroundHandler(){
        switch(backgroundMode){
            case "Color Cycle": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Color Cycle Ambience": 
            copyScreen(ambienceAlpha / 100)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Custom": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            break;
            case "Ambience": 
            copyScreen(ambienceAlpha / 100,hctx)
            break;
            case "Custom Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Ambience Audio Visualizer": 
            copyScreenAudio(ambienceAlpha / 100)
            break;
            case "Custom Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
            case "Color Cycle Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
        }
    }

    let audioScreenSat = 0
    let audioScreenLit = 0
    function copyScreenAudio(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      audioScreenSat += (engine.audio.density * 100 - audioScreenSat) / 10
      audioScreenLit += (engine.audio.density * 100 - audioScreenLit) / 10
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        hctx.fillStyle = `hsla(${hue[iZone]}, ${sat[iZone] * (audioScreenSat / 200 + .5)}%, ${lightness[iZone] * (audioScreenLit / 100)}%, ${alpha})`;
        hctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }
  
    function copyScreen(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        hctx.fillStyle = `hsla(${(backgroundMode == "Custom Ambience" ? proBack[0] : hue[iZone] + gCycle * (backgroundMode == "Color Cycle Ambience"))}, ${sat[iZone]}%, ${lightness[iZone]}%, ${alpha})`;
        hctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }

  let menuGoing = false
 function inGameCallback () {
  if (engine.vision.inGame >= 0.95 && engine.vision.inGame2 >= 0.95 && (DeadBlack_Meter.value != 1 || DeadRed_Meter.value != 1) && health_Meter.value > .05) {
    gInGame = true;
  } else {
    gInGame = false;
    if(!menuGoing && enableMenu){
      effects.push(new InMenu())
      menuGoing = true
    } 
  }
}


function flaskCallback() {
  if (flaskWhite_Meter.value >= .95 && enableFlask && engine.vision.inGame >= 0.95 && !flaskGoing) {
    effects.push(new flaskEffect())
    flaskGoing = true;
  } 
}

function dodgeCallback() {
  if (dodge_Meter.value > 0.95 && enableDodge && engine.vision.inGame >= 0.95 && !dodgeGoing) {
    effects.push(new dodgeEffect())
    dodgeGoing = true;
  } 
}

 function levelCallback () {
  if(engine.vision.inGame >= 0.95 && engine.vision.inGame2 >= 0.95 && level_Meter.value <= 0.1 && level_Meter.decreased && enableLevelUp){
    effects.push(new levelUpEffect())
  }
}

 function SafeZoneCallback () {
  if (SafeZoneAbility0_Meter.increased && SafeZoneAbility0_Meter.diff >.4 && SafeZoneAbility0_Meter.value >.5 && !gInSafeZone && enableSafeZone && engine.vision.inGame >= 0.95){
    effects.push(new EnterSafe())
    gInSafeZone = true;
  } else if(gInSafeZone && SafeZoneAbility0_Meter.decreased && SafeZoneAbility0_Meter.diff <.4 && SafeZoneAbility0_Meter.value <.2) {
    effects.push(new ExitSafe())
    gInSafeZone = false;
  }

}

 function DeadCallback () {
  if (DeadRed_Meter.value >= 0.95 && DeadBlack_Meter.value >= 0.95  && enableDead){
    effects.push(new deadEffect())
  }
}

const particleAmount = 50;

let ability1Delay = Date.now()
function ability1Callback(){
  if(ability1_Meter.diff >5 && ability1_Meter.decreased && enableAbility && gInGame && engine.vision.inGame >= 0.95 && Date.now() - ability1Delay > 300){
   effects.push(new ParticleExplosion(latestLocation.x,latestLocation.y, `hsl(${ability1Col_Meter.value},100%,50%)`,5,2000,particleAmount,12,2 ))
   ability1Delay = Date.now()
  }
}

let ability2Delay = Date.now()
function ability2Callback(){
  if(ability2_Meter.diff >5 && ability2_Meter.decreased && enableAbility && gInGame && engine.vision.inGame >= 0.95 && Date.now() - ability2Delay > 300){
    effects.push(new ParticleExplosion(latestLocation.x,latestLocation.y, `hsl(${ability2Col_Meter.value},100%,50%)`,5,2000,particleAmount,12,2 ))
    ability2Delay = Date.now()
  }
}

let ability3Delay = Date.now()
function ability3Callback(){
  if(ability3_Meter.diff >5 && ability3_Meter.decreased && enableAbility && gInGame && engine.vision.inGame >= 0.95 && Date.now() - ability3Delay > 300){
    effects.push(new ParticleExplosion(latestLocation.x,latestLocation.y, `hsl(${ability3Col_Meter.value},100%,50%)`,5,2000,particleAmount,12,2 ))
    ability3Delay = Date.now()
  }
}

let ability4Delay = Date.now()
function ability4Callback(){
  if(ability4_Meter.diff >5 && ability4_Meter.decreased && enableAbility && gInGame && engine.vision.inGame >= 0.95 && Date.now() - ability4Delay > 300){
    effects.push(new ParticleExplosion(latestLocation.x,latestLocation.y, `hsl(${ability4Col_Meter.value},100%,50%)`,5,2000,particleAmount,12,2 ))
    ability4Delay = Date.now()
  }
}

let ability5Delay = Date.now()
function ability5Callback(){
  if(ability5_Meter.diff >5 && ability5_Meter.decreased && enableAbility && gInGame && engine.vision.inGame >= 0.95 && Date.now() - ability5Delay > 300){
    effects.push(new ParticleExplosion(latestLocation.x,latestLocation.y, `hsl(${ability5Col_Meter.value},100%,50%)`,5,2000,particleAmount,12,2 ))
    ability5Delay = Date.now()
  }
}

let ability6Delay = Date.now()
function ability6Callback(){
  if(ability6_Meter.diff >5 && ability6_Meter.decreased && enableAbility && gInGame && engine.vision.inGame >= 0.95 && Date.now() - ability6Delay > 300){
    effects.push(new ParticleExplosion(latestLocation.x,latestLocation.y, `hsl(${ability6Col_Meter.value},100%,50%)`,5,2000,particleAmount,12,2 ))
    ability6Delay = Date.now()
  }
}

function healthCallback (){
  if (gInGame && enableHealth && engine.vision.inGame >= 0.95){
    if (health_Meter.value < 0.2 && !lowHealthPlaying){
      effects.push(new lowHealth())
      lowHealthPlaying = true;
    } else if ((lowHealthPlaying && health_Meter.value > 0.25) || !gInGame || menuGoing){ 
      lowHealthPlaying = false
    }
  }
}

function manaCallback (){
  if (gInGame && enableMana && engine.vision.inGame >= 0.95){
    if (mana_Meter.value < 0.2 && !lowManaPlaying){
      effects.push(new lowMana())
      lowManaPlaying = true
    } else if ((lowManaPlaying && mana_Meter.value > 0.25) || !gInGame || menuGoing){
      lowManaPlaying = false
    }
  }
}

let eventGoing = false
function eventCompleteCallback(){
  if(eventCompleteWhiteMeter.value >= .6 && eventCompleteRedMeter.value >= .75 && gInGame && !eventGoing && engine.vision.inGame >= 0.95){
    if(enableEvent) effects.push(new eventComplete())
    eventGoing = true
  } else if (eventCompleteWhiteMeter.value <= 0.1 && eventCompleteRedMeter.value <= 0.1) eventGoing = false;
}

function skillAvailableCallback(){
  if(hasSkillGreyMeter.value >= 0.95 && hasSkillYellowMeter.value >= 0.95 && gInGame && engine.vision.inGame >= 0.95){
    if(enableLevelUp) effects.push(new hasSkillPoint())
  }
}

let questGoing = false
function questCompleteCallback(){
  if(questCompleteRedMeter.value > .3 && questCompleteWhiteMeter.value > .1 && !questGoing && gInGame && engine.vision.inGame >= 0.95){
    if(enableQuest) effects.push(new questComplete())
    questGoing = true
  } else if (questCompleteRedMeter.value <= 0.1 && questCompleteWhiteMeter.value <= 0.1 && gInGame) questGoing = false
}

let buffed = false
function buffedCallback(){
  if(buffedGreenMeter.value > .3 && buffedGreenMeter.increased && engine.vision.buffedNotGreen <=.1 && gInGame && !buffed && engine.vision.inGame >= 0.95){
    if(enableBuff) effects.push(new gotBuffed())
    buffed = true
  } else if (gInGame && buffedGreenMeter.value <= 0.1) buffed = false
}

function waypointCallback(){
  if(waypointBlueMeter.value >= 0.95 && waypointRedMeter.value >= 0.95 && gInGame && !waypointGoing){
    if(enableWaypoint) effects.push(new waypoint())
    waypointGoing = true
  }
}

function gotBuffed(){
    this.count = 0
    this.draw = function(){
      if(this.count == 0) effects.push(new rJumpHelp(120, 90, 20))
      if(this.count == 20) effects.push(new rJumpHelp(120, 90, 30))
      if(this.count == 40) effects.push(new rJumpHelp(120, 90, 40))
      this.count < 41 ? this.count++ : this.lifetime = 0;
      if(!gInGame) this.lifetime = 0
    }
  }

  function rJumpHelp(hue, sat, lit){
    this.hue = hue
    this.sat = sat
    this.lit = lit
    this.y = 300
    this.vy = 0
    this.lifetime = 100
    this.draw = function(){
      hctx.beginPath()

  function ParticleExplosion(x, y, color, speed, duration, particleAmount, particleSize, fadeSpeed) {

    this.lifetime = 2000;
    this.amount = particleAmount;
    this.size = particleSize

    this.y = y;
    this.fadeSpeed = fadeSpeed;

    while (this.particles.length < this.amount) {
      this.yspeed = ((Math.random() - 0.5) * this.speed);
      this.particles.push(new ExplosionParticle(this.x, this.y, this.size, this.col, this.fadeSpeed,
        {
          x: ((Math.random() - 0.5) * this.speed),
          y: this.yspeed
        }))
    }
    
    this.draw = function () {
      this.lifetime = this.duration - (Date.now() - this.start)
      
      this.particles.forEach((Particle, index) => {
        Particle.draw()
      })
      this.particles = this.particles.filter(Particle => Particle.alpha > 0)
    }
  };

  class ExplosionParticle {
    constructor(x, y, radius, color, fadeSpeed, velocity) {
      this.x = x;
      this.y = y;
      this.color = color;
      this.radius = radius;
      this.velocity = velocity;
      this.alpha = 1 * fadeSpeed;
      this.lifetime = 1
    }
    draw() {
      hctx.globalAlpha = this.alpha;
      hctx.beginPath()
      hctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false)
      hctx.fillStyle = this.color
      hctx.fill()
      this.x += this.velocity.x
      this.y += this.velocity.y
      this.alpha -= 0.01
      hctx.globalAlpha = 1;
    }
  }

function TrailParticle(x=160,y=100,size=10,color="red",duration=2000){
      this.x = x;
      this.y = y;
      this.size = size;
      this.color = color;
      this.duration = duration;
      this.start = Date.now();
      this.lifetime = 1
      this.draw = function(){
        this.elapsed = (Date.now() - this.start);
        this.alpha = SetRange(1-(this.elapsed / this.duration),0,1);
        hctx.globalAlpha = this.alpha;
        DrawCircle(this.x,this.y,this.size*this.alpha,this.color)
        hctx.globalAlpha = 1;
        if(this.elapsed > this.duration){
          this.lifetime = 0;
        }
      }
    }

    function SetRange(num, min, max) {
      return Math.min(Math.max(num, min), max)
    }

function rng(amount, negative = true){
  return (Math.random()- (negative?0.5:0))*amount;
}


function getAlpha(elapsed, fadeInTime, duration, fadeOutTime, maxAlpha = 1) {
  if (elapsed < fadeInTime) {
    return (elapsed / fadeInTime) * maxAlpha;
  } else if (elapsed < fadeInTime + duration) {
    return maxAlpha;
  } else if (elapsed < fadeInTime + duration + fadeOutTime) {
    return maxAlpha - ((elapsed - fadeInTime - duration) / fadeOutTime) * maxAlpha;
  } else {
    return 0;
  }
}

class basicEffect {
  constructor( duration = 1000){
    this.start = Date.now();
    this.duration = duration;
    this.elapsed = 0;
    this.lifetime = 1
  }
  update (){
    this.elapsed = Date.now() - this.start;
    if (this.elapsed > this.duration){
      this.lifetime = 0;
    }
  }
}

class wobblyMotion extends basicEffect {
  constructor(x,y,speed,wobbleMove, wobbleSpeed, duration){
  super(duration);
  this.x = x;
  this.y = y;
  this.speed = speed;
  this.wobbleMove = wobbleMove;
  this.wobbleSpeed = wobbleSpeed;
  this.start = Date.now();
  this.lifetime = 1
  }
  update (){
    super.update();
    this.elapsed = Date.now() - this.start;
    this.x = this.x + this.speed.x;
    this.y = this.y + this.speed.y;
    const drawX = this.x + Math.sin(this.elapsed/this.wobbleSpeed) * this.wobbleMove.x;
    const drawY = this.y + Math.sin(this.elapsed/this.wobbleSpeed) * this.wobbleMove.y;
    return {x:drawX,y:drawY}
  }
}

class wobblyExplosionParticle extends wobblyMotion {
  constructor(x,y,speed,wobbleMove, wobbleSpeed, duration = 1000,color,radius){
    super(x,y,speed,wobbleMove, wobbleSpeed, duration);
    this.color = color;
    this.radius = radius;
    this.particles = [];
    this.lifetime = 1
  }
  draw(){
    const pos = super.update();
    this.particles.push(new TrailParticle(pos.x,pos.y,this.radius,this.color, this.duration/3))
    
    this.particles.forEach(p => p.draw());
    
    this.particles = this.particles.filter(p => p.lifetime > 0);
    
    if (this.elapsed > this.duration){
      this.lifetime = 0;
    }
  }
} 

class bubble extends wobblyMotion{
  constructor(x,y,radius,speed,wobbleMove, wobbleSpeed, strokeCol, fillCol, lineWidth,duration = 1000){

  super(x,y,speed,wobbleMove, wobbleSpeed, duration);
  this.radius = radius;

  this.fillCol = fillCol;
  this.lineWidth = lineWidth;
  this.lifetime = 1
  }
  draw(){
    hctx.beginPath();
    hctx.strokeStyle = this.strokeCol;
    hctx.fillStyle = this.fillCol;

    hctx.stroke();
    hctx.fill();
    if (this.elapsed > this.duration){
      this.lifetime = 0;
    }
  }
}

function MovingArrow(x=160, y=320, width=320, height=150,rotation=90,speed=3, color="red") {
      this.x = x;
      this.y = y;
      this.width = width;
      this.height = height;
      this.color = color;
      this.rotation = rotation;
      this.speed = speed;
      this.lifetime = 1
      this.draw = function () {
        hctx.beginPath();
        hctx.save();
        hctx.translate(160, 100);
        hctx.rotate(this.rotation * Math.PI / 180);
        hctx.translate(-160, -100);
          DrawArrow(this.x, this.y, this.width, this.height, this.color)
        hctx.restore();
        this.y -= this.speed;
        if (this.y < -this.height) {
          this.lifetime = 0;
        }
      }
    }

    function RippleEffect(x=160, y=100, speed=1, duration=3000, rippleWidth=20, color="red", inOrOut="out", fillOrStroke="stroke", amountOfRipples=4, background=true) {
          this.col = color;
          this.speed = speed;
          this.dur = duration;
          this.width = rippleWidth;
          this.start = Date.now();
          this.lifetime;
          this.x = x;
          this.y = y;
          this.fill = fillOrStroke;
          this.radius = 0;
          this.amount = amountOfRipples;
          this.background = background;
          if (inOrOut == "in") {
            this.radius = 200 + (this.width * (this.amount * 2));
            this.speed = -this.speed
          }
          this.draw = function () {
            if (this.background) {
              hctx.beginPath();
              hctx.fillStyle = "black";
              hctx.fillRect(0, 0, 320, 200);
            }
            hctx.lineWidth = this.width;
            hctx.beginPath();
            for (let i = 0; i < this.amount; i++) {
              hctx.beginPath();
              if (this.radius - i * (this.width * 2) > 0) {
                hctx.arc(this.x, this.y, this.radius - i * (this.width * 2), 0, 2 * Math.PI);
              }
              if (this.fill == "fill") {
                hctx.fillStyle = this.col;
                hctx.fill();
              } else {
                hctx.strokeStyle = this.col;
                hctx.stroke();
              }
            }

            this.radius += this.speed;
            this.lifetime = this.dur - (Date.now() - this.start);
            if (this.lifetime <= 0) {
              utilityPlayed = false;
            }
          }
        }




function DrawRect(x, y, width, height, color) {
  hctx.beginPath();
  hctx.fillStyle = color;
  hctx.fillRect(x, y, width, height);
};

function DrawCircle(x, y, radius, color) {
  hctx.beginPath();
  hctx.fillStyle = color;
  hctx.arc(x, y, radius, 0, 2 * Math.PI)
  hctx.fill();
};

function StrokeCircle(x, y, width, height, color) {
  hctx.beginPath();
  hctx.strokeStyle = color;
  hctx.lineWidth = 30;
  hctx.arc(x, y, width, 0, 2 * Math.PI);
  hctx.stroke();
};

function renderPath(x, y, path, color, size, type="fill", strokeWidth = 5) {
  hctx.fillStyle = color;
  hctx.strokeStyle = color;
  hctx.save();
  hctx.transform(size / 10, 0, 0, size / 10, 160 - 10 * 16.5, 79 - size * 7.5);
  hctx.translate(x, y);
  let ex = new Path2D(path);

  if (type == "fill"){
    hctx.fill(ex);
  } else if (type == "stroke"){
    hctx.lineWidth = strokeWidth;
    hctx.stroke(ex);
  }

  hctx.restore();
}



  function DrawArrow(x, y, width, angle, color) {
    hctx.beginPath();
    hctx.moveTo(x - width, y + angle);
    hctx.lineTo(x, y);
    hctx.lineTo(x + width, y + angle);
    hctx.strokeStyle = color;
    hctx.lineWidth = 30;
    hctx.stroke();
  }


function getXAndYForPathPoint(point1, point2, percentage) {
    let speed = { x: (point2.x - point1.x) * percentage, y: (point2.y - point1.y) * percentage }
    return { x: point1.x + speed.x, y: point1.y + speed.y }
  }


function Meter(size, Callback) {
  this.size = size;
  this.value = 0;
  this.diff = 0;
  this.increased = false;
  this.decreased = false;
  let values = [];

  this.setValue = function (updatedValue) {
    values.push(updatedValue);
    if (values.length > this.size) {
      values.shift();
    }

    for (let i = 0; i < values.length - 1; i++) {
      if (values[i] !== values[i + 1]) return;
    }
    if (this.value !== values[0]) {
      this.diff = Math.abs(this.value - values[0]);
      this.increased = this.value < values[0];
      this.decreased = this.value > values[0];
      this.value = values[0];
      Callback();
    }
  };
}


function hexToHSL(hex) {
    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);

    var r = parseInt(result[1], 16);
    var g = parseInt(result[2], 16);
    var b = parseInt(result[3], 16);

    (r /= 255), (g /= 255), (b /= 255);
    var max = Math.max(r, g, b),
      min = Math.min(r, g, b);
    var h,
      s,
      l = (max + min) / 2;

    if (max === min) {
      h = s = 0; // achromatic
    } else {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r:
          h = (g - b) / d + (g < b ? 6 : 0);
          break;
        case g:
          h = (b - r) / d + 2;
          break;
        case b:
          h = (r - g) / d + 4;
          break;
      }
      h /= 6;
    }

    s = s * 100;
    s = Math.round(s);
    l = l * 100;
    l = Math.round(l);
    h = Math.round(360 * h);

    var colors = [];
    colors['h'] = h;
    colors['s'] = s;
    colors['l'] = l;

    return colors;
  }
