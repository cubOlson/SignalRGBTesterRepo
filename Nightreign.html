<script>
    // Canvas initialization
    const canvas = document.getElementById('exCanvas');
    const ctx = canvas.getContext('2d');
    const width = 320;
    const height = 200;
    let effects = [];
    let gSensor = 0;

    let InGameWhiteMeter = new Meter(5, inGameCallback)
    let InGameRedMeter = new Meter(5, inGameCallback)
    let InGameRuneMeter = new Meter(5, inGameCallback)
    let CompassMeter = new Meter(5, inGameCallback)

    let PlayerColorMeter = new Meter(5, playerCallback)

    let HitYellowMeter = new Meter(2, hitCallback)

    let PlayerDownMeter = new Meter(10, downCallback)
    let Ally1DownMeter = new Meter(10, downCallback)
    let Ally2DownMeter = new Meter(10, downCallback)

    let BossRedMeter = new Meter(10, bossCallback)

    let WinWhiteMeter = new Meter(15, winCallback)

    let LossRedMeter = new Meter(15, lossCallback)
   
    //#region Update
    function update() {
      DrawRect(0, 0, 320, 200, "black")
      backgroundHandler()

      InGameWhiteMeter.setValue(engine.vision.inGameWhite)
      InGameRedMeter.setValue(engine.vision.inGameRed)
      InGameRuneMeter.setValue(engine.vision.inGameRune)
      CompassMeter.setValue(engine.vision.compassWhite)

      PlayerColorMeter.setValue(engine.vision.playerColor[0])

      HitYellowMeter.setValue(engine.vision.yellowHit)

      PlayerDownMeter.setValue(engine.vision.playerDowned)
      Ally1DownMeter.setValue(engine.vision.ally1Downed)
      Ally2DownMeter.setValue(engine.vision.ally2Downed)

      BossRedMeter.setValue(engine.vision.bossRed)

      WinWhiteMeter.setValue(engine.vision.winWhite)

      LossRedMeter.setValue(engine.vision.defeatRed)
  
      effects.forEach((ele, i) => {
        ele.draw()
        if(ele.lifetime <= 0){
          effects.splice(i, 1)
        }
      })
  
      window.requestAnimationFrame(update);
    };

    let lossGoing = false
    function lossCallback(){
      if(InGameRuneMeter.value >= .95 && CompassMeter.value <= .05 && LossRedMeter.value >= .15 && engine.vision.lossNotRed <= .05 && !lossGoing){
        lossGoing = true
        if(wlOn) effects.push(new loss())
      }
    }

    let winGoing = false
    function winCallback(){
      if(InGameRuneMeter.value >= .95 && CompassMeter.value <= .05 && WinWhiteMeter.value >= .15 && engine.vision.winNotWhite <= .05 && !winGoing){
        winGoing = true
        if(wlOn) effects.push(new win())
      }
    }

    let bossGoing = false
    function bossCallback(){
      if(gInGame && BossRedMeter.value >= .25 && engine.vision.bossNotRed <= .05 && CompassMeter.value <= .25 && !bossGoing){
        bossGoing = true
        if(bossOn) effects.push(new bossFight())
      }
    }

    let playerDowned = false
    let allyDowned = false
    function downCallback(){
      if(gInGame && PlayerDownMeter.value >= .95 && !playerDowned){
        playerDowned = true
        if(downOn) effects.push(new playerDown())
      } else if (gInGame && PlayerDownMeter.value <= .05) playerDowned = false

      if(gInGame && (Ally1DownMeter.value >= .95 || Ally2DownMeter.value >= .95) && !allyDowned){
        allyDowned = true
        if(downOn) effects.push(new allyDown())
      } else if (gInGame && (Ally1DownMeter.value <= .05 || Ally2DownMeter.value <= .05)) allyDowned = false
    }                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              1

    let hitGoing = false
    function hitCallback(){
      if(gInGame && HitYellowMeter.value >= .05 && engine.vision.notYellowHit <= .05 && !hitGoing){
        hitGoing = true
        if(hitOn) effects.push(new hit())
      }
    }

    let playerCallbackGoing = false
    function playerCallback(){
      if(gInGame && !playerCallbackGoing){
        if(colorOn) effects.push(new PlayerColor(engine.vision.playerColor[0]))
        playerCallbackGoing = true
      } else if (!gInGame) playerCallbackGoing = false
    }

    let gInGame = false;
    function inGameCallback(){
      if((InGameRedMeter.value >= .95 || InGameWhiteMeter.value >= .95) && InGameRuneMeter.value >= .95 && engine.vision.inGameNotWhite <= .05 && engine.vision.inGameNotRune <= .05) gInGame = true
      else if (InGameWhiteMeter.value <= .05 && InGameRedMeter.value <= .05 && InGameRuneMeter.value <= .05) gInGame = false
    }

    function PlayerColor(hue){
      this.hue = hue
      this.w = 0
      this.alpha = 1
        this.draw = function(){
            DrawRect(160 - this.w, 0, this.w * 2, 200, getColorString(this.hue, 100, 50, this.alpha * .75))
            DrawRect(160 - this.w / 3, 0, this.w * 2 / 3, 200, getColorString(this.hue, 100, 50, this.alpha))
            DrawTriangle(160 - this.w / 4, 50, 160 + this.w / 4, 50, 160, 150, getColorString(0, 0, 100, this.alpha))
            this.w < 160 ? this.w += (161 - this.w) / 20 : this.alpha >= .005 ? this.alpha -= .005 : this.lifetime = 0
        }
    }

    function hit(){
      this.alpha = 0
      this.half = false
      this.width = 320
      this.hue = 0
      this.draw = function(){
        if(this.hue < 60) this.hue++
        DrawRect(0, 0, this.width, 200, getColorString(this.hue, 100, 50, this.alpha))
        this.alpha <= .99 ? this.alpha += (1 - this.alpha) / 3 : this.width > 1 ? this.width += (0 - this.width) / 20 : this.lifetime = 0
        if(this.lifetime == 0) hitGoing = false
      }
    }

    function allyDown(){
      this.lifetime = 1000
      this.dots = new playerDownHelp(8, 20, 0)
      this.draw = function(){
        this.dots.draw()
        this.lifetime--
        if((Ally1DownMeter.value <= .05 && Ally2DownMeter.value <= .05 && gInGame) || !gInGame) this.lifetime = 0
      }
    }

    function playerDown(){
      this.alpha = 0
      this.half = false
      this.dots = new playerDownHelp(3, 50, 240)
      this.lifetime = 1000
      this.draw = function(){
        DrawRect(0, 0, 320, 200, getColorString(0, 0, 0, this.alpha))
        this.alpha < .84 ? this.alpha += (.85 - this.alpha) / 5 : this.half = true
        this.dots.draw()
        this.lifetime--
        if((PlayerDownMeter.value <= .05 && gInGame) || !gInGame) this.lifetime = 0
      }
    }

    function playerDownHelp(speed, radius, color){
      this.particles = [];
      this.centerX = 160;
      this.centerY = 100;
      this.speed = speed
      const maxSafeRadius = Math.min(this.centerX, this.centerY) * 0.9;
      
      for (let i = 0; i < 10; i++) {
          let x, y, radius;

          do {
              x = Math.random() * 320;
              y = Math.random() * 200;
              const dx = x - this.centerX;
              const dy = y - this.centerY;
              radius = Math.sqrt(dx * dx + dy * dy);
          } while (radius > maxSafeRadius);

          const particle = new OrbitalParticle(x, y, this.centerX, this.centerY, speed, radius, color);

          this.particles.push(particle);
      }
      this.draw = function(){
        this.particles.forEach((ele,i)=>{
          const baseSpeed = this.speed;
          const adjustedSpeed = baseSpeed * Math.sqrt(50 / ele.radius)
          ele.speed = adjustedSpeed;
          ele.draw()
        })
      }
    }

    function OrbitalParticle(x, y, centerX = 160, centerY = 100, speed, radius, baseColor){
        this.x = x;
        this.y = y;
        this.centerX = centerX;
        this.centerY = centerY;
        this.speed = speed
        this.radius = radius
        this.hue = Math.random() * 30 + baseColor
        this.draw = function(){
          const dx = this.x - this.centerX;
          const dy = this.y - this.centerY;
          const radius = Math.sqrt(dx * dx + dy * dy);
          if (radius === 0) {
              this.vx = 0;
              this.vy = 0;
          }
          const ux = dx / radius;
          const uy = dy / radius;
          this.vx = -uy * this.speed;
          this.vy = ux * this.speed;
          this.x += this.vx;
          this.y += this.vy;
          DrawCircle(this.x, this.y, 60, getColorString(this.hue, 100, 50, .75))
        }
      }
    
    function getRadius(){
        const dx = this.x - this.centerX;
        const dy = this.y - this.centerY;
        return Math.sqrt(dx * dx + dy * dy);
    }

    function bossFight(){
      this.draw = function(){
        DrawRect(0, 0, 320, 200, getColorString(0, 0, 0, 1 - (BossRedMeter.value * 100) / 100))
        DrawRect(0, 0, 320, 200, getColorString((BossRedMeter.value * 100) * 1.2, 100, 30, Math.sin(Date.now() / (((BossRedMeter.value * 100) + 9) * 10)) * .25 + .5))
        if((BossRedMeter.value <= .05 && CompassMeter.value >= .95) || !gInGame) {
          this.lifetime = 0
          bossGoing = false
        }
      }
    }

    function loss(){
      this.effect = new wlHelp(0)
      this.draw = function(){
        this.effect.draw()
        if(this.effect.lifetime <= 0 || (InGameRuneMeter.value >= .95 && CompassMeter.value <= .95)) {
          lossGoing = false
          this.lifetime = 0
        }
      }
    }

    function win(){
      this.effect = new wlHelp(220)
      this.draw = function(){
        this.effect.draw()
        if(this.effect.lifetime <= 0 || (InGameRuneMeter.value >= .95 && CompassMeter.value <= .95)) {
          winGoing = false
          this.lifetime = 0
        }
      }
    }

    function wlHelp(hue){
      this.hue = hue
      this.w = 0
      this.alpha = 1
      this.draw = function(){
        DrawRect(0, 0, 320, 200, getColorString(0, 0, 0, this.w / 100 * this.alpha))
        DrawRect(160 - this.w * .7, 0, this.w * 1.4, 200, getColorString(this.hue, 100, 30, this.alpha))
        DrawRect(160 - this.w * .8, 40, this.w * 1.6, 120, getColorString(this.hue, 100, 50, this.alpha))
        DrawRect(160 - this.w * .9, 70, this.w * 1.8, 60, getColorString(this.hue, 100, 70, this.alpha))
        DrawRect(160 - this.w, 90, this.w * 2, 20, getColorString(this.hue, 100, 90, this.alpha))
        this.w < 390 ? this.w += (400 - this.w) / 75 : this.alpha >= .025 ? this.alpha -= .025 : this.lifetime = 0
      }
    }

    let proBack = [0, 0, 0];
    function onbackColorChanged() {
        proBack = hexToHSL(backColor);
    }

    // Audio and Color Cycle State
    let audioEase = { sat: 0, lit: 0 };
    let gCycle = 0;
    
    // Background Utility Functions
    function updateAudioEase() {
        const targetDensity = engine.audio.density * 100;
        audioEase.sat += (targetDensity - audioEase.sat) / 10;
        audioEase.lit += (targetDensity - audioEase.lit) / 10;
    }

    function getColorString(hue, sat, lit, alpha) {
        return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`;
    }

    function updateColorCycle() {
        gCycle = (gCycle + 0.5) % 360;
    }

    // Main Background Handler
    function backgroundHandler() {
        const alpha = ambienceAlpha / 100;

        // Handle color cycling first if needed
        if (backgroundMode.includes("Color Cycle")) {
            updateColorCycle();
        }

        // Handle audio processing if needed
        if (backgroundMode.includes("Audio")) {
            updateAudioEase();
        }

        // Render background based on mode
        if (backgroundMode.includes("Ambience")) {
            if (backgroundMode === "Ambience Audio Visualizer") {
                copyScreenAudio(alpha);
            } else {
                copyScreen(alpha);
            }
            return;
        }

        // Handle custom and cycle modes
        const hue = proBack[0] + (backgroundMode.includes("Color Cycle") ? gCycle : 0);
        const sat = backgroundMode.includes("Audio") ? audioEase.sat * 0.33 + 66 : proBack[1];
        const lit = backgroundMode.includes("Audio") ? audioEase.lit * 0.9 + 10 : proBack[2];
        
        DrawRect(0, 0, 320, 200, getColorString(hue, sat, lit, alpha));
    }

    // Zone Configuration Constants
    const ZONE_COLS = 28;
    const ZONE_ROWS = 20;
    const TOTAL_ZONES = ZONE_COLS * ZONE_ROWS;

    function copyScreenAudio(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat = new Int8Array(engine.zone.saturation)
        const hue = new Int16Array(engine.zone.hue)
        
        const width = 320 / ZONE_COLS
        const height = 200 / ZONE_ROWS
        
        // Use the global audioEase values we already calculated
        const satMultiplier = audioEase.sat / 200 + 0.5
        const litMultiplier = audioEase.lit / 100

        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const x = col * width
            const y = row * height
            
            ctx.fillStyle = getColorString(
                hue[iZone],
                sat[iZone] * satMultiplier,
                lightness[iZone] * litMultiplier,
                alpha
            )
            ctx.fillRect(x, y, width, height)
        }
    }
  
    function copyScreen(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat = new Int8Array(engine.zone.saturation)
        const hue = new Int16Array(engine.zone.hue)
        
        const width = 320 / ZONE_COLS
        const height = 200 / ZONE_ROWS
        
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const x = col * width
            const y = row * height
            
            const finalHue = backgroundMode === "Custom Ambience" 
                ? proBack[0] 
                : hue[iZone] + (backgroundMode === "Color Cycle Ambience" ? gCycle : 0)
            
            ctx.fillStyle = getColorString(
                finalHue,
                sat[iZone],
                lightness[iZone],
                alpha
            )
            ctx.fillRect(x, y, width, height)
        }
    }
    //#endregion

  function DrawTriangle(cord1X, cord1Y, cord2X, cord2Y, cord3X, cord3Y, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.moveTo(cord1X, cord1Y);
    ctx.lineTo(cord2X, cord2Y);
    ctx.lineTo(cord3X, cord3Y);
    ctx.lineTo(cord1X, cord1Y);
    ctx.fill();
  };

  function DrawCircle(x, y, radius, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.fill();
  };

  function DrawStroke(x, y, radius, color, stroke) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = stroke;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.stroke();
  };

  function DrawRect(x, y, width, height, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
  };

  function strokeRect(x, y, width, height, color, stroke){
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = stroke
    ctx.rect(x, y, width, height);
    ctx.stroke()
  }

  function hexToHSL(hex) {
      const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || [];
      const rgb = [r, g, b].map(x => parseInt(x, 16) / 255);
      const max = Math.max(...rgb);
      const min = Math.min(...rgb);
      const l = (max + min) / 2;
      
      if (max === min) return [0, 0, Math.round(l * 100)];
      
      const d = max - min;
      const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      
      let h;
      const [nr, ng, nb] = rgb;
      if (max === nr) h = (ng - nb) / d + (ng < nb ? 6 : 0);
      else if (max === ng) h = (nb - nr) / d + 2;
      else h = (nr - ng) / d + 4;
      
      return [
        Math.round(h * 60),
        Math.round(s * 100),
        Math.round(l * 100)
      ];
    }
  
    function Meter(size, callback) {
      this.size = size;
      this.value = 0;
      this.diff = 0;
      this.increased = false;
      this.decreased = false;
      var values = [];
  
      this.setValue = function (updatedValue) {
        values.push(updatedValue);
        if (values.length > this.size) {
          values.shift();
        }
  
        for (var i = 0; i < values.length - 1; i++) {
          if (values[i] !== values[i + 1]) return;
        }
        if (this.value !== values[0]) {
          this.diff = Math.abs(this.value - values[0]);
          this.increased = this.value < values[0];
          this.decreased = this.value > values[0];
          this.value = values[0];
          callback();
        }
      }
    }
    //#endregion


  window.requestAnimationFrame(update);
</script>
