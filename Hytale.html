<body style="margin: 0; padding: 0; background: #000;">
    <canvas id="exCanvas" width="320" height="200"></canvas>
</body>
  
<script>
    // Canvas initialization
    const canvas = document.getElementById('exCanvas');
    const ctx = canvas.getContext('2d');
    const width = 320;
    const height = 200;
    let effects = [];

    let InGameRedMeter = new Meter(3, inGameCallback)
    let InGameNotRedMeter = new Meter(3, inGameCallback)
    let InGameYellowMeter = new Meter(3, inGameCallback)

    let HealthRedMeter = new Meter(5, barCallback)
    let HealthNotRedMeter = new Meter(5, barCallback)

    let StaminaYellowMeter = new Meter(5, barCallback)
    let StaminaNotYellowMeter = new Meter(5, barCallback)

    let HealGreen1Meter = new Meter(10, conditionCallback)
    let HealGreen2Meter = new Meter(10, conditionCallback)
    let BadRedMeter = new Meter(10, conditionCallback)
    let HealNotGreenMeter = new Meter(10, conditionCallback)

    let AttackYellowMeter = new Meter(7, actionCallback)
    let DefenseYellowMeter = new Meter(7, actionCallback)
    let ADNotYellowMeter = new Meter(7, actionCallback)

    let UltYellowMeter = new Meter(5, ultCallback)
    let UltNotYellowMeter = new Meter(5, ultCallback)

    let DeadRedMeter = new Meter(5, deadCallback)
    let DeadBlueMeter = new Meter(5, deadCallback)

    //#region Update
    function update() {
      DrawRect(0, 0, 320, 200, "black")
      backgroundHandler()
  
      InGameRedMeter.setValue(engine.vision.inGameRed)
      InGameNotRedMeter.setValue(engine.vision.inGameNotRed)
      InGameYellowMeter.setValue(engine.vision.inGameYellow)

      HealthRedMeter.setValue(engine.vision.healthRed)
      HealthNotRedMeter.setValue(engine.vision.healthNotRed)

      StaminaYellowMeter.setValue(engine.vision.staminaYellow)
      StaminaNotYellowMeter.setValue(engine.vision.staminaNotYellow)

      HealGreen1Meter.setValue(engine.vision.healGreen1)
      HealGreen2Meter.setValue(engine.vision.healGreen2)
      BadRedMeter.setValue(engine.vision.badRed)
      HealNotGreenMeter.setValue(engine.vision.healNotGreen)

      AttackYellowMeter.setValue(engine.vision.attackYellow)
      DefenseYellowMeter.setValue(engine.vision.defenseYellow)
      ADNotYellowMeter.setValue(engine.vision.ADNotYellow)

      UltYellowMeter.setValue(engine.vision.ultYellow)
      UltNotYellowMeter.setValue(engine.vision.ultNotYellow)

      DeadRedMeter.setValue(engine.vision.deadRed)
      DeadBlueMeter.setValue(engine.vision.deadBlue)

      effects.forEach((ele, i) => {ele.draw()})

      effects = effects.filter(ele => !(ele.lifetime <= 0))
  
      window.requestAnimationFrame(update);
    };
    //#endregion

    //#region Callbacks
    let gInGame = false
    function inGameCallback() {
      if(InGameRedMeter.value >= .95 && InGameYellowMeter.value >= .95 && engine.vision.inGameNotRed <= .1 && !gInGame) gInGame = true
      else if (InGameRedMeter.value <= .1 && InGameYellowMeter.value <= .1 && gInGame) gInGame = false
    }

    let healthGoing = false
    let staminaGoing = false
    function barCallback() {
      if(gInGame){
        if(HealthRedMeter.value >= .05 && engine.vision.healthNotRed < .1 && !healthGoing){
          healthGoing = true
          console.log("Health Bar pushed")
        }
        if(StaminaYellowMeter.value >= .05 && engine.vision.staminaNotYellow < .1 && !staminaGoing){
          staminaGoing = true
          console.log("Stamina Bar pushed")
        }
      } else {
        healthGoing = false
        staminaGoing = false
      }
    }

    let healingGoing = false
    let badGoing = false
    function conditionCallback() {
      if(gInGame){
        if((HealGreen1Meter.value >= .95 || HealGreen2Meter.value >= .95) && engine.vision.healNotGreen < .1 && !healingGoing){
          healingGoing = true
          console.log("Healing")
        } else if ((HealGreen1Meter.value <= .1 && HealGreen2Meter.value <= .1) || !gInGame) healingGoing = false
        if(BadRedMeter.value >= .95 && engine.vision.badNotRed < .1 && !badGoing){
          badGoing = true
          console.log("Bad effect")
        } else if (BadRedMeter.value <= .1) badGoing = false
      } else {
        healingGoing = false
        badGoing = false
      }
    }

    let attackGoing = false
    let defenseGoing = false
    function actionCallback() {
      if(gInGame){
        if(AttackYellowMeter.value >= .95 && engine.vision.ADNotYellow < .1 && !attackGoing){
          attackGoing = true
          console.log("Attack")
        } else if (AttackYellowMeter.value < .1) attackGoing = false
        if(DefenseYellowMeter.value >= .95 && engine.vision.ADNotYellow < .1 && !defenseGoing){
          defenseGoing = true
          console.log("Defense")
        } else if (DefenseYellowMeter.value >= .95) defenseGoing = false
      } else {
        attackGoing = false
        defenseGoing = false
      }
    }

    let ultGoing = false
    function ultCallback() {
      if(gInGame && UltYellowMeter.value >= .95 && engine.vision.ultNotYellow < .1 && !ultGoing){
        ultGoing = true
        console.log("Ultimate pushed")
      } else if (!gInGame || UltYellowMeter.value < .1) ultGoing = false
    }

    let deadGoing = false
    function deadCallback() {
      if(!gInGame && DeadBlueMeter.value >= .95 && DeadRedMeter.value >= .95 && !deadGoing){
        deadGoing = true
        console.log("Dead")
      } if (gInGame) deadGoing = false
    }

    //#endregion
    //#region Background Modes
    // Background Configuration
    let proBack = [0, 0, 0];
    function onbackColorChanged() {
        proBack = hexToHSL(backColor);
    }

    // Audio and Color Cycle State
    let audioEase = { sat: 0, lit: 0 };
    let gCycle = 0;
    
    // Background Utility Functions
    function updateAudioEase() {
        const targetDensity = engine.audio.density * 100;
        audioEase.sat += (targetDensity - audioEase.sat) / 10;
        audioEase.lit += (targetDensity - audioEase.lit) / 10;
    }

    function getColorString(hue, sat, lit, alpha) {
        return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`;
    }

    function updateColorCycle() {
        gCycle = (gCycle + 0.5) % 360;
    }

    // Main Background Handler
    function backgroundHandler() {
        const alpha = ambienceAlpha / 100;

        // Handle color cycling first if needed
        if (backgroundMode.includes("Color Cycle")) {
            updateColorCycle();
        }

        // Handle audio processing if needed
        if (backgroundMode.includes("Audio")) {
            updateAudioEase();
        }

        // Render background based on mode
        if (backgroundMode.includes("Ambience")) {
            if (backgroundMode === "Ambience Audio Visualizer") {
                copyScreenAudio(alpha);
            } else {
                copyScreen(alpha);
            }
            return;
        }

        // Handle custom and cycle modes
        const hue = proBack[0] + (backgroundMode.includes("Color Cycle") ? gCycle : 0);
        const sat = backgroundMode.includes("Audio") ? audioEase.sat * 0.33 + 66 : proBack[1];
        const lit = backgroundMode.includes("Audio") ? audioEase.lit * 0.9 + 10 : proBack[2];
        
        DrawRect(0, 0, 320, 200, getColorString(hue, sat, lit, alpha));
    }

    // Zone Configuration Constants
    const ZONE_COLS = 28;
    const ZONE_ROWS = 20;
    const TOTAL_ZONES = ZONE_COLS * ZONE_ROWS;

    function copyScreenAudio(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat = new Int8Array(engine.zone.saturation)
        const hue = new Int16Array(engine.zone.hue)
        
        const width = 320 / ZONE_COLS
        const height = 200 / ZONE_ROWS
        
        // Use the global audioEase values we already calculated
        const satMultiplier = audioEase.sat / 200 + 0.5
        const litMultiplier = audioEase.lit / 100

        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const x = col * width
            const y = row * height
            
            ctx.fillStyle = getColorString(
                hue[iZone],
                sat[iZone] * satMultiplier,
                lightness[iZone] * litMultiplier,
                alpha
            )
            ctx.fillRect(x, y, width, height)
        }
    }
  
    function copyScreen(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat = new Int8Array(engine.zone.saturation)
        const hue = new Int16Array(engine.zone.hue)
        
        const width = 320 / ZONE_COLS
        const height = 200 / ZONE_ROWS
        
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const x = col * width
            const y = row * height
            
            const finalHue = backgroundMode === "Custom Ambience" 
                ? proBack[0] 
                : hue[iZone] + (backgroundMode === "Color Cycle Ambience" ? gCycle : 0)
            
            ctx.fillStyle = getColorString(
                finalHue,
                sat[iZone],
                lightness[iZone],
                alpha
            )
            ctx.fillRect(x, y, width, height)
        }
    }
    //#endregion
    //#region Helper Functions
  function innerEffects(){
        this.effects = []
        this.Add = (cb, arr) => {
            this.effects.push(new cb(...arr))
        }
        this.draw = () => {
            this.effects.forEach((ele, i)=>{
                ele.draw()
                if(ele.lifetime <= 0) this.effects.splice(i, 1)
            })
        }
    }

    function testTranslate(start, end, rot, scaleX, scaleY){
        ctx.save()
        ctx.translate(start[0], start[1])
        ctx.scale(scaleX, scaleY)
        ctx.rotate(rot)
        ctx.translate(end[0], end[1])
    }

  function DrawArc(x, y, start, end, radius, direction, color){
    ctx.beginPath()
    ctx.arc(x, y, radius, start, end, direction)
    ctx.fillStyle = color
    ctx.fill()
  }

  function DrawLine(start, end, color, stroke){
    ctx.beginPath()
    ctx.moveTo(start[0], start[1])
    ctx.lineTo(end[0], end[1])
    ctx.strokeStyle = color
    ctx.lineWidth = stroke
    ctx.stroke()
  }

  function DrawEllipse(x, y, width, height, rotation, color){
    ctx.beginPath()
    ctx.ellipse(x, y, width, height, rotation, 0, Math.PI * 2)
    ctx.fillStyle = color
    ctx.fill()
  }

  function lightning(size, color, width){
      this.points = [];
      this.color = color
      this.width = width
      while(this.points.length <= size){
        this.points.push([this.points.length * (350 / size) - 25, 100])
      }
      this.draw = function(){
        drawLightning(this.points, this.color, this.width)
        this.points.forEach((ele, i)=>{
          var mod = Math.sin(Date.now() / (100000 * Math.random()))
          switch(i){
            case 0:
              this.points[i][1] < 90 ? this.points[i][1]+=2 : 
                this.points[i][1] > 110 ? this.points[i][1]-=2 : 
                  this.points[i][1] += mod * 10;
              break;
            case this.points.length - 1:
              this.points[i - 1][1] - this.points[i][1] < -30 ? this.points[i][1]-=5 : 
                  this.points[i - 1][1] - this.points[i][1] > 30 ? this.points[i][1]+=5 : 
                      this.points[i][1] += mod * 10;
              break;
            default:
              this.points[i - 1][1] - this.points[i][1] < -30 ? this.points[i][1]-=5 : 
                this.points[i - 1][1] - this.points[i][1] > 30 ? this.points[i][1]+=5 : 
                    this.points[i][1] += mod * 10;
              this.points[i][0] < i * (320 / this.points.length) ? this.points[i][0]+=5 : 
                this.points[i][0] > i * (320 / this.points.length) + (320 / this.points.length) ? this.points[i][0]-=5 : 
                    this.points[i][0] += mod * 10;
              break;
          }
        })
      }
    }

  function DrawLightning(array, color, width){
      ctx.beginPath()
      ctx.moveTo(...array[0])
      array.forEach((ele, i)=>{
        if(i){
          ctx.lineTo(...array[i])
        }
      });
      ctx.strokeStyle = color;
      ctx.lineJoin = "round";
      ctx.lineWidth = width + Math.random() * width;
      ctx.stroke()
  }

  function DrawGear(x, y, radius, stroke, teeth, color){
    DrawStroke(x, y, radius, color, stroke)
    for(let i = 0; i < teeth; i++){
      var ix = Math.cos(Math.PI * 2 / teeth * i) * radius + x;
      var iy = Math.sin(Math.PI * 2 / teeth * i) * radius + y;
      var rotate = Math.atan2(y - iy, x - ix) + Math.PI / 2;
      ctx.save()
      ctx.translate(ix, iy)
      ctx.rotate(rotate)
      ctx.translate(-ix, -iy)
      DrawRect(ix, iy, Math.PI * radius * 2 / teeth * .75, radius / 3 + stroke / 2, "orange")
      ctx.restore()
    }
  }

  function DrawPath(x, y, path, color, scaleX, scaleY) {
    ctx.fillStyle = color;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scaleX, scaleY)
    let ex = new Path2D(path);
    ctx.fill(ex);
    ctx.restore();
  };

  function DrawTriangle(cord1X, cord1Y, cord2X, cord2Y, cord3X, cord3Y, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.moveTo(cord1X, cord1Y);
    ctx.lineTo(cord2X, cord2Y);
    ctx.lineTo(cord3X, cord3Y);
    ctx.lineTo(cord1X, cord1Y);
    ctx.fill();
  };

  function DrawCircle(x, y, radius, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.fill();
  };

  function DrawStroke(x, y, radius, color, stroke) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = stroke;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.stroke();
  };

  function DrawRect(x, y, width, height, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
  };

  function strokeRect(x, y, width, height, color, stroke){
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = stroke
    ctx.rect(x, y, width, height);
    ctx.stroke()
  }

  function hexToRgb(hex) {
    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
      r: parseInt(result[1], 16),
      g: parseInt(result[2], 16),
      b: parseInt(result[3], 16)
    } : null;
  }

  function hexToHSL(hex) {
      const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || [];
      const rgb = [r, g, b].map(x => parseInt(x, 16) / 255);
      const max = Math.max(...rgb);
      const min = Math.min(...rgb);
      const l = (max + min) / 2;
      
      if (max === min) return [0, 0, Math.round(l * 100)];
      
      const d = max - min;
      const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      
      let h;
      const [nr, ng, nb] = rgb;
      if (max === nr) h = (ng - nb) / d + (ng < nb ? 6 : 0);
      else if (max === ng) h = (nb - nr) / d + 2;
      else h = (nr - ng) / d + 4;
      
      return [
        Math.round(h * 60),
        Math.round(s * 100),
        Math.round(l * 100)
      ];
    }
  
    function Meter(size, callback) {
      this.size = size;
      this.value = 0;
      this.diff = 0;
      this.increased = false;
      this.decreased = false;
      var values = [];
  
      this.setValue = function (updatedValue) {
        values.push(updatedValue);
        if (values.length > this.size) {
          values.shift();
        }
  
        for (var i = 0; i < values.length - 1; i++) {
          if (values[i] !== values[i + 1]) return;
        }
        if (this.value !== values[0]) {
          this.diff = Math.abs(this.value - values[0]);
          this.increased = this.value < values[0];
          this.decreased = this.value > values[0];
          this.value = values[0];
          callback();
        }
      }
    }
    //#endregion
  window.requestAnimationFrame(update);
</script>
