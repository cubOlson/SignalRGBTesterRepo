       VISION METERS
       Each meter captures a small region of the game screen and
       measures what percentage of its pixels match the given HSL
       range. The JS Meter class smooths readings over N frames
       before firing a callback.

       Detection strategy: every game state uses a POSITIVE meter
       (confirms the expected color IS present) paired with a
       NEGATIVE "Not" meter (confirms the region does NOT show that
       color during baseline/off state). A state is considered active
       only when positive is high AND negative is low, preventing
       false positives from ambient lighting or UI transitions.

       TESTER NOTE: If an effect never fires, first check the QA Tool
       — load a screenshot from the target resolution and verify the
       meter region actually captures the right pixels at the right
       color. Then adjust HSL ranges or region coordinates as needed.
       ═══════════════════════════════════════════════════════════ -->

    const height = 200;

        roundStartNotGrey_Meter.setValue(engine.vision.roundStartNotGrey)
        roundStartLight_Meter.setValue(engine.vision.roundStartLight)
        roundStartWhite_Meter.setValue(engine.vision.roundStartWhite)
        taskBlue_Meter.setValue(engine.vision.taskBlue)
        taskNotBlue_Meter.setValue(engine.vision.taskNotBlue)
        inventoryWhite_Meter.setValue(engine.vision.inventoryWhite)
        inventoryRed_Meter.setValue(engine.vision.inventoryRed)

        effects.forEach(ele => { ele.draw() })
        effects = effects.filter(ele => !(ele.lifetime <= 0))

        DrawHUD()
        ctx.drawImage(hiddenCanvas, 0, 0)
        window.requestAnimationFrame(update)
    }
    //#endregion

    //#region Meter Declarations

    // -------------------------------------------------------------------------
    // Meter objects
    // -------------------------------------------------------------------------
    // Positive + negative pairs share one callback; the length/value bars use a
    // shorter smoothing window (3) so they track live, events use 5 for stability.
    const inGameWhite_Meter = new Meter(5, inGameDetect)
    const inGameNotWhite_Meter = new Meter(5, inGameDetect)
    const inGameHealth_Meter = new Meter(5, healthDetect)
    const healthLength_Meter = new Meter(15, healthDetect) 
    const lowHealthRed_Meter = new Meter(10,healthDetect)  // steady HUD bar (drawn from .value)
    const staminaConfirm_Meter = new Meter(5, staminaDetect)
    const staminaLength_Meter = new Meter(3, staminaDetect)
    const lowAmmoRed_Meter = new Meter(5, lowAmmoDetect)
    const lowAmmoNotRed_Meter = new Meter(5, lowAmmoDetect)
    const killOrange_Meter = new Meter(5, killDetect)
    const killIcon_Meter = new Meter(5, killDetect)
    const killIcon2_Meter = new Meter(5, killDetect)
    const killNotOrange_Meter = new Meter(5, killDetect)
    const downedRed1_Meter = new Meter(5, downedDetect)
    const downedRed2_Meter = new Meter(5, downedDetect)
    const downedNotRed_Meter = new Meter(5, downedDetect)
    const deadOrange_Meter = new Meter(5, deadDetect)
    const deadOrange2_Meter = new Meter(5, deadDetect)
    const deadNotOrange_Meter = new Meter(5, deadDetect)
    const extractFailRed_Meter = new Meter(5, extractDetect)
    const extractSuccessGreen_Meter = new Meter(5, extractDetect)
    const extractGrey_Meter = new Meter(5, extractDetect)
    const actionConfirm_Meter = new Meter(5, actionDetect)
    const actionLength_Meter = new Meter(3, actionDetect)
    const actionNotWhite_Meter = new Meter(5, actionDetect)
    const roundStartNotGrey_Meter = new Meter(5, roundStartDetect)
    const roundStartLight_Meter = new Meter(5, roundStartDetect)
    const roundStartWhite_Meter = new Meter(5, roundStartDetect)
    const taskBlue_Meter = new Meter(5, taskDetect)
    const taskNotBlue_Meter = new Meter(5, taskDetect)
    const inventoryWhite_Meter = new Meter(5, inventoryDetect)
    const inventoryRed_Meter = new Meter(5, inventoryDetect)
    //#endregion

    //#region Callbacks

    // -------------------------------------------------------------------------
    // Global state flags
    // Each event has a "Going" latch so it fires ONCE per on-screen appearance.
    // The latch is raised when the effect spawns and cleared only when the
    // triggering region has gone back to baseline (positive meter low) — so a
    // banner that lingers longer than its effect never re-fires.
    // -------------------------------------------------------------------------
    let gInGame = false
    let killGoing = false
    let deadGoing = false
    let downedGoing = false
    let extractGoing = false
    let failedExtractGoing = false
    let lowAmmoGoing = false
    let roundStartGoing = false
    let taskGoing = false
    let inventoryGoing = false
    let lowHealthGoing = false
    let staminaGoing = false
    let useActionGoing = false

    // -------------------------------------------------------------------------
    // Callbacks
    //
    // Detection strategy (see the meter header comment): a state is active when
    // its POSITIVE meter reads high AND its NEGATIVE "Not" meter reads low. All
    // thresholds below are starting points — verify each meter region in the QA
    // Tool against a target-resolution screenshot and adjust as needed.
    // -------------------------------------------------------------------------

    // In-game gate: the white compass lettering is only on screen during a live
    // match, so it stands in for "playing". Everything else is gated on gInGame.
    function inGameDetect() {
        if (inGameWhite_Meter.value >= .2 && inGameNotWhite_Meter.value < .15 && inGameHealth_Meter.value >=.95 && !gInGame) {
            gInGame = true
        } else if (inGameWhite_Meter.value < .05 && gInGame) {
            gInGame = false
        }
    }

    // Health bar HUD — drawn every frame (called from update, not a pooled effect),
    // scaled by the healthLength meter reading. In game it tracks health; with the
    // Bar Effect Adjust toggle it draws full-size out of game for positioning.
    // Modeled on Fortnite.html's DrawHUD.
    function DrawHUD() {
        if (gInGame) {
            if (enableHP) DrawRect(HealthBarX * 3.2, HealthBarY * 2, healthLength_Meter.value * (HealthBarWidth * 3.2), HealthBarHeight * 2, healthColor)
        } else if (adjToggle && !gInGame) {
            if (enableHP) DrawRect(HealthBarX * 3.2, HealthBarY * 2, HealthBarWidth * 3.2, HealthBarHeight * 2, healthColor)
        }
    }

    // Confirmed kill — orange kill text + skull/figure icon, negative baseline low.
    function killDetect() {
        if (gInGame && killEffectOn &&
            killOrange_Meter.value >= .2 && (killIcon_Meter.value >= .2 || killIcon2_Meter.value >= .2) &&
            killNotOrange_Meter.value < .1 && !killGoing) {
            effects.push(new Kill())
            killGoing = true
        } else if (killOrange_Meter.value < .1 && killIcon_Meter.value < .1) {
            killGoing = false
        }
    }

    // Killed — orange plus/health icons of the dead HUD, negative baseline low.
    function deadDetect() {
        if (!gInGame && deadEffectOn &&
            deadOrange_Meter.value >= .6 && deadOrange2_Meter.value >= .95 &&
            deadNotOrange_Meter.value < .1 && !deadGoing) {
            effects.push(new Dead())
            deadGoing = true
        } else if (deadOrange_Meter.value < .1 && deadOrange2_Meter.value < .1) {
            deadGoing = false
        }
    }

    // Downed — red EKG/health icons. downedRed1 sits on a symbol that never fully
    // fills, so it runs on a lower threshold than downedRed2.
    function downedDetect() {
        if (gInGame && downedEffectOn &&
            downedRed1_Meter.value >= .3 && downedRed2_Meter.value >= .95 &&
            downedNotRed_Meter.value < .1 && !downedGoing) {
            effects.push(new Downed())
            downedGoing = true
        } else if (downedRed1_Meter.value < .1 && downedRed2_Meter.value < .1) {
            downedGoing = false
        }
    }

    // Extraction — the grey text under the banner confirms an extraction banner is
    // up; the banner colour then decides success (green) vs failure (red).
    function extractDetect() {
        const banner = extractGrey_Meter.value >= .95

        if (!gInGame && extractEffectOn && banner &&
            extractSuccessGreen_Meter.value >= .3 && !extractGoing) {
            effects.push(new Extract())
            extractGoing = true
        } else if (extractSuccessGreen_Meter.value < .1) {
            extractGoing = false
        }

        if (!gInGame && failedExtractEffectOn && banner &&
            extractFailRed_Meter.value >= .4 && !failedExtractGoing) {
            effects.push(new FailedExtract())
            failedExtractGoing = true
        } else if (extractFailRed_Meter.value < .1) {
            failedExtractGoing = false
        }
    }

    // Low / out of ammo — the far-right ammo digit turns red, negative baseline low.
    function lowAmmoDetect() {
        if (gInGame && lowAmmoEffectOn &&
            lowAmmoRed_Meter.value >= .2 && lowAmmoNotRed_Meter.value < .1 && !lowAmmoGoing) {
            effects.push(new LowAmmo())
            lowAmmoGoing = true
        } else if (lowAmmoRed_Meter.value < .1 || !gInGame) {
            lowAmmoGoing = false
        }
    }

    // Round start — the white deploy text over the dark/light start panel.
    function roundStartDetect() {
        if (gInGame && roundStartEffectOn &&
            roundStartWhite_Meter.value >= .2 &&
            roundStartNotGrey_Meter.value <.1 && roundStartLight_Meter.value >= .95 &&
            !roundStartGoing) {
            effects.push(new RoundStart())
            roundStartGoing = true
        } else if (roundStartWhite_Meter.value < .1 || !gInGame) {
            roundStartGoing = false
        }
    }

    // New objective / task banner — the wide blue task bar, negative baseline low.
    // (InventoryScreen is defined but not wired yet — it needs its own meters.)
    function taskDetect() {
        if (gInGame && taskEffectOn &&
            taskBlue_Meter.value >= .95 && taskNotBlue_Meter.value < .1 && !taskGoing) {
            effects.push(new Task())
            taskGoing = true
        } else if (taskBlue_Meter.value < .1) {
            taskGoing = false
        }
    }

    // Inventory screen — both the white and red inventory meters read high together.
    function inventoryDetect() {
        if (!gInGame && inventoryEffectOn &&
            inventoryWhite_Meter.value >= .95 && inventoryRed_Meter.value >= .95 && !inventoryGoing) {
            effects.push(new InventoryScreen())
            inventoryGoing = true
        } else if (inventoryWhite_Meter.value < .1 && inventoryRed_Meter.value < .1) {
            inventoryGoing = false
        }
    }

    // Health — healthLength reads how full the bar is (0..1); inGameHealth confirms
    // the bar is on screen. Low Health fires below 25% and holds (the effect reads
    // healthLength live for severity) until health recovers past ~30%.
    function healthDetect() {


        if (gInGame && lowHealthEffectOn && lowHealthRed_Meter.value > .95 && !lowHealthGoing) {
            effects.push(new LowHealth())
            lowHealthGoing = true
        } else if (!gInGame|| lowHealthRed_Meter.value <.1 || deadGoing) {
            lowHealthGoing = false
        }
    }

    // Stamina — while the stamina bar is on screen and not full, show the wash;
    // StaminaUse reads staminaLength live to colour green→yellow→red.
    function staminaDetect() {
        const present = staminaConfirm_Meter.value >= .3
        if (gInGame && staminaEffectOn && present && staminaLength_Meter.value < .95 && !staminaGoing) {
            effects.push(new StaminaUse())
            staminaGoing = true
        } else if (!present || staminaLength_Meter.value >= .98) {
            staminaGoing = false
        }
    }

    // Use action / revive — while the action progress bar is up, lay the gauze;
    // UseAction reads actionLength live for how far the wrap has progressed.
    function actionDetect() {
        const present = actionConfirm_Meter.value >= .95 && actionNotWhite_Meter.value < .2
        if (gInGame && useActionEffectOn && present && !useActionGoing) {
            effects.push(new UseAction())
            useActionGoing = true
        } else if (!present) {
            useActionGoing = false
        }
    }
    //#endregion

    //#region Background Modes
    // ═══════════════════════════════════════════════════════════
    // BACKGROUND SYSTEM
    // Eight modes selected by the backgroundMode control.
    // ═══════════════════════════════════════════════════════════
    // Seed from the picked color at load so Custom modes aren't black until the
    // color is first changed.
    let proBack = typeof backColor !== 'undefined' ? hexToHSL(backColor) : [0, 0, 0]
    function onbackColorChanged() {
        proBack = hexToHSL(backColor)
    }

    let audioEase = { sat: 0, lit: 0 }
    let gCycle = 0

    function updateAudioEase() {
        const targetDensity = engine.audio.density * 100
        audioEase.sat += (targetDensity - audioEase.sat) / 10
        audioEase.lit += (targetDensity - audioEase.lit) / 10
    }

    function getColorString(hue, sat, lit, alpha) {
        return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`
    }

    function updateColorCycle() {
        gCycle = (gCycle + 0.5) % 360
    }

    function backgroundHandler() {
        const alpha = ambienceAlpha / 100

        if (backgroundMode.includes('Color Cycle')) updateColorCycle()
        if (backgroundMode.includes('Audio'))       updateAudioEase()

        if (backgroundMode.includes('Ambience')) {
            if (backgroundMode === 'Ambience Audio Visualizer') {
                copyScreenAudio(alpha)
            } else {
                copyScreen(alpha)
            }
            return
        }

        // Color Cycle uses a vivid fixed sat/lit so the rotating hue is actually
        // visible; Custom (no cycle, no audio) uses the picked color's sat/lit.
        const cycle = backgroundMode.includes('Color Cycle')
        const audio = backgroundMode.includes('Audio')
        const hue = proBack[0] + (cycle ? gCycle : 0)
        const sat = audio ? audioEase.sat * 0.33 + 66 : cycle ? 90 : proBack[1]
        const lit = audio ? audioEase.lit * 0.9  + 10 : cycle ? 50 : proBack[2]
        DrawRect(0, 0, 320, 200, getColorString(hue, sat, lit, alpha))
    }

    const ZONE_COLS   = 28
    const ZONE_ROWS   = 20
    const TOTAL_ZONES = ZONE_COLS * ZONE_ROWS

    function copyScreenAudio(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat       = new Int8Array(engine.zone.saturation)
        const hue       = new Int16Array(engine.zone.hue)
        const w = 320 / ZONE_COLS
        const h = 200 / ZONE_ROWS
        const satMultiplier = audioEase.sat / 200 + 0.5
        const litMultiplier = audioEase.lit / 100
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            hiddenCtx.fillStyle = getColorString(
                hue[iZone],
                sat[iZone] * satMultiplier,
                lightness[iZone] * litMultiplier,
                alpha
            )
            hiddenCtx.fillRect(col * w, row * h, w, h)
        }
    }

    function copyScreen(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat       = new Int8Array(engine.zone.saturation)
        const hue       = new Int16Array(engine.zone.hue)
        const w = 320 / ZONE_COLS
        const h = 200 / ZONE_ROWS
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const finalHue = backgroundMode === 'Custom Ambience'
                ? proBack[0]
                : hue[iZone] + (backgroundMode === 'Color Cycle Ambience' ? gCycle : 0)
            hiddenCtx.fillStyle = getColorString(finalHue, sat[iZone], lightness[iZone], alpha)
            hiddenCtx.fillRect(col * w, row * h, w, h)
        }
    }
    //#endregion

    //#region Helper Functions
    // ═══════════════════════════════════════════════════════════
    // HELPER FUNCTIONS — draw primitives target hiddenCtx
    // ═══════════════════════════════════════════════════════════
    function DrawRect(x, y, w, h, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.fillRect(x, y, w, h)
    }

    function strokeRect(x, y, w, h, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.rect(x, y, w, h)
        hiddenCtx.stroke()
    }

    function DrawCircle(x, y, radius, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
        hiddenCtx.fill()
    }

    function DrawStroke(x, y, radius, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
        hiddenCtx.stroke()
    }

    function DrawLine(start, end, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.moveTo(start[0], start[1])
        hiddenCtx.lineTo(end[0], end[1])
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.stroke()
    }

    function DrawArc(x, y, start, end, radius, direction, color) {
        hiddenCtx.beginPath()
        hiddenCtx.arc(x, y, radius, start, end, direction)
        hiddenCtx.fillStyle = color
        hiddenCtx.fill()
    }

    function DrawEllipse(x, y, w, h, rotation, color) {
        hiddenCtx.beginPath()
        hiddenCtx.ellipse(x, y, w, h, rotation, 0, Math.PI * 2)
        hiddenCtx.fillStyle = color
        hiddenCtx.fill()
    }

    function DrawTriangle(x1, y1, x2, y2, x3, y3, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.moveTo(x1, y1)
        hiddenCtx.lineTo(x2, y2)
        hiddenCtx.lineTo(x3, y3)
        hiddenCtx.lineTo(x1, y1)
        hiddenCtx.fill()
    }

    function DrawPath(x, y, path, color, scaleX, scaleY) {
        hiddenCtx.fillStyle = color
        hiddenCtx.save()
        hiddenCtx.translate(x, y)
        hiddenCtx.scale(scaleX, scaleY)
        hiddenCtx.fill(new Path2D(path))
        hiddenCtx.restore()
    }

    function hexToRgb(hex) {
        var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex)
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : null
    }

    function hexToHSL(hex) {
        const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || []
        const rgb = [r, g, b].map(x => parseInt(x, 16) / 255)
        const max = Math.max(...rgb)
        const min = Math.min(...rgb)
        const l = (max + min) / 2
        if (max === min) return [0, 0, Math.round(l * 100)]
        const d = max - min
        const s = l > 0.5 ? d / (2 - max - min) : d / (max + min)
        let h
        const [nr, ng, nb] = rgb
        if      (max === nr) h = (ng - nb) / d + (ng < nb ? 6 : 0)
        else if (max === ng) h = (nb - nr) / d + 2
        else                 h = (nr - ng) / d + 4
        return [Math.round(h * 60), Math.round(s * 100), Math.round(l * 100)]
    }

    // Meter(size, callback): frame-stabilizing debouncer for vision signals.
    function Meter(size, callback) {
        this.size = size
        this.value = 0
        this.diff = 0
        this.increased = false
        this.decreased = false
        var values = []
        this.setValue = function (updatedValue) {
            values.push(updatedValue)
            if (values.length > this.size) values.shift()
            for (var i = 0; i < values.length - 1; i++) {
                if (values[i] !== values[i + 1]) return
            }
            if (this.value !== values[0]) {
                this.diff = Math.abs(this.value - values[0])
                this.increased = this.value < values[0]
                this.decreased = this.value > values[0]
                this.value = values[0]
                callback()
            }
        }
    }

    function onCanvasTapped(x, y) {}
    //#endregion

    //#region Effects

    // ═══════════════════════════════════════════════════════════
    // EFFECTS
    // Ported from DeltaForceStaging.html. The nine discrete event effects are
    // verbatim (they already draw to hiddenCtx and self-terminate on their own
    // frame timer; the callbacks own the Going latches). The four value-driven
    // effects — HealthBar, StaminaUse, LowHealth, UseAction — read their length
    // meters live where staging read the effectValue slider, and fade out when
    // their latch clears.
    // ═══════════════════════════════════════════════════════════

    // ── Dead ────────────────────────────────────────────────────────
    function Dead() {
        this.lifetime = 1
        this.frame    = 0

        this.bits = []
        for (let i = 0; i < 64; i++) {
            const a = Math.random() * Math.PI * 2
            const v = 1.4 + Math.random() * 3.2
            this.bits.push({
                x:    160 + Math.cos(a) * 22,
                y:    88  + Math.sin(a) * 22,
                vx:   Math.cos(a) * v,
                vy:   Math.sin(a) * v - 1,
                w:    10 + Math.random() * 14,
                h:    6  + Math.random() * 9,
                rot:  Math.random() * 6.28,
                spin: (Math.random() - 0.5) * 0.3,
                flip: Math.random() * 6.28,
                fr:   0.07 + Math.random() * 0.11,
                hue:  352 + Math.random() * 18,
                lit:  42 + Math.random() * 28
            })
        }

        this.draw = function () {
            const f = this.frame++

            const APPEAR  = 26
            const SWELL0  = 34
            const POP     = 62
            const FADEOUT = 150
            const END     = 195

            const inP  = Math.min(1, f / APPEAR)
            const outP = f < FADEOUT ? 1 : Math.max(0, 1 - (f - FADEOUT) / (END - FADEOUT))
            const env  = inP * inP * (3 - 2 * inP) * outP * outP * (3 - 2 * outP)

            const popAge = f - POP
            const sw     = Math.min(1, Math.max(0, (f - SWELL0) / (POP - SWELL0)))
            const heat   = popAge < 0 ? sw * sw : 1

            const back = hiddenCtx.createRadialGradient(160, 90, 20, 160, 90, 210)
            back.addColorStop(0, `hsla(0, 74%, ${32 + heat * 14}%, ${(0.6 + heat * 0.12) * env})`)
            back.addColorStop(1, `hsla(0, 82%, 13%, ${0.74 * env})`)
            DrawRect(0, 0, 320, 200, back)

            if (popAge < 0) {
                hiddenCtx.save()
                hiddenCtx.translate(160 + Math.sin(f * 1.7) * sw * sw * 3, 88)
                hiddenCtx.scale(1 + sw * sw * 0.15, 1 + sw * sw * 0.15)
                hiddenCtx.translate(-160, -88)

                const ink = `rgba(0, 0, 0, ${env})`
                DrawEllipse(160, 255, 132, 70, 0, ink)
                DrawRect(140, 155, 40, 35, ink)
                DrawEllipse(160, 88, 64, 76, 0, ink)

                const col = `hsla(0, 95%, 56%, ${env})`
                for (let s = -1; s <= 1; s += 2) {
                    const ex = 160 + s * 26
                    DrawLine([ex - 20, 58], [ex + 20, 98], col, 12)
                    DrawLine([ex + 20, 58], [ex - 20, 98], col, 12)
                }

                hiddenCtx.restore()
            }

            if (popAge >= 0) {
                const pf = Math.max(0, 1 - popAge / 14)
                if (pf > 0) {
                    DrawRect(0, 0, 320, 200, `hsla(0, 100%, 62%, ${pf * pf * 0.7 * env})`)
                    DrawStroke(160, 88, 22 + (1 - pf) * 170,
                               `hsla(4, 100%, 80%, ${pf * pf * 0.85 * env})`, 3 + pf * 12)
                }

                const cf = Math.min(1, Math.max(0, 2.4 * (1 - popAge / 130)))
                this.bits.forEach(b => {
                    b.vy   += 0.07
                    b.vx   *= 0.986
                    b.vy   *= 0.986
                    b.x    += b.vx
                    b.y    += b.vy
                    b.rot  += b.spin
                    b.flip += b.fr

                    const fw = b.w * Math.abs(Math.cos(b.flip))
                    hiddenCtx.save()
                    hiddenCtx.translate(b.x, b.y)
                    hiddenCtx.rotate(b.rot)
                    hiddenCtx.fillStyle = `hsla(${b.hue}, 95%, ${b.lit}%, ${cf * env})`
                    hiddenCtx.fillRect(-fw / 2, -b.h / 2, fw, b.h)
                    hiddenCtx.restore()
                })
            }

            if (f >= END) this.lifetime = 0
        }
    }


    // ── Downed ──────────────────────────────────────────────────────
    function Downed() {
        this.lifetime = 1
        this.frame    = 0
        this.dim      = 1

        const EYES = [
            { x: 134, y: 78, at: 45 },
            { x: 186, y: 78, at: 62 }
        ]

        this.chips = EYES.map(() => {
            const list = []
            for (let i = 0; i < 8; i++) {
                list.push([
                    (i / 8) * Math.PI * 2 + (Math.random() - 0.5) * 0.5,
                    14 + Math.random() * 20
                ])
            }
            return list
        })

        this.draw = function () {
            const f = this.frame++

            const FADEOUT = 130
            const END     = 170

            // No effectValue slider in dev — hold the red/X at full strength.
            const target = 1
            this.dim += (target - this.dim) / 30

            const inP  = Math.min(1, f / 30)
            const outP = f < FADEOUT ? 1 : Math.max(0, 1 - (f - FADEOUT) / (END - FADEOUT))
            const fade = inP * inP * (3 - 2 * inP) * outP * outP * (3 - 2 * outP)
            const env  = fade * this.dim

            const back = hiddenCtx.createRadialGradient(160, 90, 20, 160, 90, 210)
            back.addColorStop(0, `hsla(0, 74%, 34%, ${0.6 * env})`)
            back.addColorStop(1, `hsla(0, 82%, 13%, ${0.74 * env})`)
            DrawRect(0, 0, 320, 200, back)

            const ink = `rgba(0, 0, 0, ${fade})`
            DrawEllipse(160, 255, 132, 70, 0, ink)
            DrawRect(140, 155, 40, 35, ink)
            DrawEllipse(160, 88, 64, 76, 0, ink)

            EYES.forEach((e, i) => {
                const age = f - e.at
                if (age < 0) return

                const sp  = Math.min(1, age / 8)
                const ez  = 1 - Math.pow(1 - sp, 3)
                const hit = Math.max(0, 1 - age / 12)

                if (hit > 0) {
                    DrawRect(0, 0, 320, 200, `hsla(0, 100%, 42%, ${hit * hit * 0.22 * env})`)

                    const bloom = hiddenCtx.createRadialGradient(e.x, e.y, 0, e.x, e.y, 60)
                    bloom.addColorStop(0,   `hsla(6, 100%, 88%, ${hit * hit * 0.9 * env})`)
                    bloom.addColorStop(0.3, `hsla(0, 100%, 52%, ${hit * hit * 0.5 * env})`)
                    bloom.addColorStop(1,   'hsla(0, 100%, 45%, 0)')
                    DrawRect(e.x - 60, e.y - 60, 120, 120, bloom)
                }

                const cp = Math.max(0, 1 - age / 16)
                if (cp > 0) {
                    this.chips[i].forEach(c => {
                        const r0 = 10 + (1 - cp) * c[1]
                        DrawLine(
                            [e.x + Math.cos(c[0]) * r0,        e.y + Math.sin(c[0]) * r0],
                            [e.x + Math.cos(c[0]) * (r0 + 9),  e.y + Math.sin(c[0]) * (r0 + 9)],
                            `hsla(4, 100%, 64%, ${cp * 0.8 * env})`,
                            3
                        )
                    })
                }

                const beat = age > 8 ? 0.86 + Math.sin(f * 0.05) * 0.14 : 1
                const R    = 20 * (2.2 - 1.2 * ez)
                const col  = `hsla(0, 95%, 56%, ${Math.min(1, age / 4) * beat * env})`
                const wide = 5 + 7 * ez

                DrawLine([e.x - R, e.y - R], [e.x + R, e.y + R], col, wide)
                DrawLine([e.x + R, e.y - R], [e.x - R, e.y + R], col, wide)
            })

            if (f >= END) this.lifetime = 0
        }
    }


    // ── Extract ─────────────────────────────────────────────────────
    function Extract() {
        this.lifetime = 1
        this.frame    = 0

        this.draw = function () {
            const f = this.frame++

            const FADEIN  = 30
            const SWEEP0  = 30
            const SWEEP1  = 116
            const FADEOUT = 140
            const END     = 190
            const BAND    = 78

            const TWINKLE = 73
            const ATTACK  = 7
            const SHINE   = 74

            const inP  = Math.min(1, f / FADEIN)
            const outP = f < FADEOUT ? 1 : Math.max(0, 1 - (f - FADEOUT) / (END - FADEOUT))
            const env  = inP * inP * (3 - 2 * inP) * outP * outP * (3 - 2 * outP)

            const grey = hiddenCtx.createLinearGradient(0, 0, 0, 200)
            grey.addColorStop(0, `hsla(210, 5%, 30%, ${0.88 * env})`)
            grey.addColorStop(1, `hsla(210, 6%, 17%, ${0.88 * env})`)
            DrawRect(0, 0, 320, 200, grey)

            const sp   = Math.min(1, Math.max(0, (f - SWEEP0) / (SWEEP1 - SWEEP0)))
            const ease = sp * sp * (3 - 2 * sp)
            const sx   = -BAND + (320 + BAND * 2) * ease

            const wipe = hiddenCtx.createLinearGradient(sx - 40, 0, sx + 40, 0)
            wipe.addColorStop(0, `hsla(140, 70%, 34%, ${0.42 * env})`)
            wipe.addColorStop(1, 'hsla(140, 70%, 34%, 0)')
            DrawRect(0, 0, 320, 200, wipe)

            if (sp > 0 && sp < 1) {
                const beam = hiddenCtx.createLinearGradient(sx - BAND, 0, sx + BAND, 0)
                beam.addColorStop(0,    'hsla(140, 90%, 50%, 0)')
                beam.addColorStop(0.35, `hsla(138, 85%, 46%, ${0.5 * env})`)
                beam.addColorStop(0.5,  `hsla(132, 95%, 66%, ${0.9 * env})`)
                beam.addColorStop(0.65, `hsla(138, 85%, 46%, ${0.5 * env})`)
                beam.addColorStop(1,    'hsla(140, 90%, 50%, 0)')
                DrawRect(sx - BAND, 0, BAND * 2, 200, beam)
            }

            const tAge = f - TWINKLE
            let glint  = 0
            if (tAge >= 0) {
                if (tAge < ATTACK) {
                    const s = tAge / ATTACK
                    glint = s * s * (3 - 2 * s)
                } else {
                    const u = (tAge - ATTACK) / SHINE
                    glint = u < 1 ? (1 + Math.cos(u * Math.PI)) / 2 : 0
                }
            }

            if (glint > 0) {
                const a = glint * env

                const shim = 0.82 + Math.sin(f * 0.35) * 0.18
                const LONG = 150 * glint * shim
                const TALL = 94  * glint * shim
                const DIAG = 58  * glint * shim

                const halo = hiddenCtx.createRadialGradient(160, 100, 0, 160, 100, 96)
                halo.addColorStop(0,   `hsla(130, 95%, 72%, ${a * 0.5})`)
                halo.addColorStop(0.4, `hsla(138, 90%, 52%, ${a * 0.22})`)
                halo.addColorStop(1,   'hsla(142, 90%, 45%, 0)')
                DrawRect(0, 0, 320, 200, halo)

                const armColor = `hsla(128, 100%, 74%, ${a * 0.9})`
                spike( 0,           LONG, 7, armColor)
                spike( Math.PI,     LONG, 7, armColor)
                spike(-Math.PI / 2, TALL, 7, armColor)
                spike( Math.PI / 2, TALL, 7, armColor)
                for (let i = 0; i < 4; i++) {
                    spike(Math.PI / 4 + i * Math.PI / 2, DIAG, 4,
                          `hsla(134, 100%, 66%, ${a * 0.6})`)
                }

                const ring = 1 - Math.min(1, tAge / 20)
                if (ring > 0) {
                    DrawStroke(160, 100, 18 + (1 - ring) * 78,
                               `hsla(126, 100%, 82%, ${ring * ring * 0.7 * env})`, 2 + ring * 4)
                }

                DrawCircle(160, 100, 22 * glint, `hsla(132, 95%, 80%, ${a * 0.85})`)
                DrawCircle(160, 100, 11 * glint, `hsla(112, 70%, 99%, ${a})`)
            }

            if (f >= END) this.lifetime = 0
        }

        function spike(ang, len, wide, color) {
            const nx = Math.cos(ang + Math.PI / 2) * wide
            const ny = Math.sin(ang + Math.PI / 2) * wide

            hiddenCtx.beginPath()
            hiddenCtx.moveTo(160 + Math.cos(ang) * len, 100 + Math.sin(ang) * len)
            hiddenCtx.lineTo(160 + nx, 100 + ny)
            hiddenCtx.lineTo(160 - nx, 100 - ny)
            hiddenCtx.closePath()
            hiddenCtx.fillStyle = color
            hiddenCtx.fill()
        }
    }


    // ── FailedExtract ───────────────────────────────────────────────
    function FailedExtract() {
        this.lifetime = 1
        this.frame    = 0

        this.cracks = []
        for (let i = 0; i < 7; i++) {
            const pts = []
            let ang   = (i / 7) * Math.PI * 2 + (Math.random() - 0.5) * 0.4
            let rad   = 30
            for (let k = 0; k < 5; k++) {
                ang += (Math.random() - 0.5) * 0.5
                rad += 22 + Math.random() * 26
                pts.push([160 + Math.cos(ang) * rad, 100 + Math.sin(ang) * rad])
            }
            this.cracks.push(pts)
        }

        this.draw = function () {
            const f = this.frame++

            const FADEIN  = 30
            const SWEEP0  = 30
            const SWEEP1  = 128
            const FADEOUT = 150
            const END     = 205
            const BAND    = 78

            const STRIKE = 75
            const SUCK   = 14

            const inP  = Math.min(1, f / FADEIN)
            const outP = f < FADEOUT ? 1 : Math.max(0, 1 - (f - FADEOUT) / (END - FADEOUT))
            const env  = inP * inP * (3 - 2 * inP) * outP * outP * (3 - 2 * outP)

            const murk = hiddenCtx.createLinearGradient(0, 0, 0, 200)
            murk.addColorStop(0, `hsla(0, 30%, 12%, ${0.9 * env})`)
            murk.addColorStop(1, `hsla(0, 40%, 5%, ${0.9 * env})`)
            DrawRect(0, 0, 320, 200, murk)

            const STEPS = 5
            const raw   = Math.min(1, Math.max(0, (f - SWEEP0) / (SWEEP1 - SWEEP0)))
            const seg   = Math.floor(raw * STEPS)
            const inSeg = Math.min(1, (raw * STEPS - seg) * 1.7)
            const ease  = (seg + inSeg * inSeg * (3 - 2 * inSeg)) / STEPS

            const sx = 320 + BAND - (320 + BAND * 2) * ease

            const wipe = hiddenCtx.createLinearGradient(sx - 40, 0, sx + 40, 0)
            wipe.addColorStop(0, 'hsla(0, 75%, 26%, 0)')
            wipe.addColorStop(1, `hsla(0, 75%, 26%, ${0.5 * env})`)
            DrawRect(0, 0, 320, 200, wipe)

            if (ease > 0 && ease < 1) {
                const flick = 0.72 + Math.abs(Math.sin(f * 0.9)) * 0.28
                const beam  = hiddenCtx.createLinearGradient(sx - BAND, 0, sx + BAND, 0)
                beam.addColorStop(0,    'hsla(0, 90%, 40%, 0)')
                beam.addColorStop(0.35, `hsla(2, 90%, 34%, ${0.45 * flick * env})`)
                beam.addColorStop(0.5,  `hsla(0, 100%, 52%, ${0.85 * flick * env})`)
                beam.addColorStop(0.65, `hsla(2, 90%, 34%, ${0.45 * flick * env})`)
                beam.addColorStop(1,    'hsla(0, 90%, 40%, 0)')
                DrawRect(sx - BAND, 0, BAND * 2, 200, beam)
            }

            const tAge = f - STRIKE

            const pull = tAge >= -SUCK && tAge < 0 ? -tAge / SUCK : 0
            if (pull > 0) {
                const armColor = `hsla(0, 95%, 46%, ${pull * 0.75 * env})`
                spike( 0,           150 * pull, 6, armColor)
                spike( Math.PI,     150 * pull, 6, armColor)
                spike(-Math.PI / 2,  94 * pull, 6, armColor)
                spike( Math.PI / 2,  94 * pull, 6, armColor)
                for (let i = 0; i < 4; i++) {
                    spike(Math.PI / 4 + i * Math.PI / 2, 58 * pull, 3.5,
                          `hsla(4, 90%, 40%, ${pull * 0.5 * env})`)
                }
            }

            if (tAge >= 0) {
                const decay = Math.max(0, 1 - Math.max(0, tAge - 10) / 90)

                const hit = Math.max(0, 1 - tAge / 12)
                if (hit > 0) {
                    DrawRect(0, 0, 320, 200, `hsla(0, 100%, 42%, ${hit * hit * 0.55 * env})`)
                }

                const vp = Math.min(1, tAge / 10)
                const vr = 84 * vp * vp * (3 - 2 * vp)
                if (vr > 1) {
                    const pit = hiddenCtx.createRadialGradient(160, 100, 0, 160, 100, vr)
                    pit.addColorStop(0,    `rgba(0, 0, 0, ${0.96 * decay * env})`)
                    pit.addColorStop(0.62, `rgba(0, 0, 0, ${0.86 * decay * env})`)
                    pit.addColorStop(0.86, `hsla(0, 100%, 46%, ${0.9 * decay * env})`)
                    pit.addColorStop(1,    'hsla(6, 100%, 40%, 0)')
                    DrawRect(0, 0, 320, 200, pit)
                }

                const cp = Math.min(1, Math.max(0, (tAge - 6) / 26))
                if (cp > 0) {
                    const reach = cp * 5
                    this.cracks.forEach(pts => {
                        let px = 160
                        let py = 100
                        for (let k = 0; k < 5; k++) {
                            const part = Math.min(1, reach - k)
                            if (part <= 0) break

                            const ex = px + (pts[k][0] - px) * part
                            const ey = py + (pts[k][1] - py) * part
                            const a  = decay * env

                            DrawLine([px, py], [ex, ey],
                                     `hsla(0, 55%, ${3 + k * 3}%, ${(1 - k * 0.08) * a})`,
                                     17 - k * 3.1)

                            DrawLine([px, py], [ex, ey],
                                     `hsla(4, 100%, ${30 + k * 9}%, ${(0.12 + k * 0.15) * a})`,
                                     Math.max(1, 4 - k * 0.6))

                            px = pts[k][0]
                            py = pts[k][1]
                        }
                    })
                }
            }

            if (f >= END) this.lifetime = 0
        }

        function spike(ang, len, wide, color) {
            const nx = Math.cos(ang + Math.PI / 2) * wide
            const ny = Math.sin(ang + Math.PI / 2) * wide

            hiddenCtx.beginPath()
            hiddenCtx.moveTo(160 + Math.cos(ang) * len, 100 + Math.sin(ang) * len)
            hiddenCtx.lineTo(160 + nx, 100 + ny)
            hiddenCtx.lineTo(160 - nx, 100 - ny)
            hiddenCtx.closePath()
            hiddenCtx.fillStyle = color
            hiddenCtx.fill()
        }
    }


    // (Health bar is a HUD element drawn by DrawHUD(), not a pooled effect —
    //  see the Callbacks region, modeled on Fortnite.html.)


    // ── InventoryScreen ─────────────────────────────────────────────
    function InventoryScreen() {
        this.lifetime = 1
        this.frame    = 0

        const BX     = 160
        const BY     = 134
        const BW     = 152
        const BH     = 76
        const HINGE  = BY - BH / 2
        const FLAP_H = 34

        const ITEMS = [
            { at: 78,  dx: -66, dy: -50, draw: drawRifle },
            { at: 96,  dx:   2, dy: -62, draw: drawArmor },
            { at: 114, dx:  68, dy: -48, draw: drawMag   }
        ]

        this.draw = function () {
            const f = this.frame++

            const APPEAR  = 30
            const OPEN0   = 38
            const OPEN1   = 78
            const RISE    = 34
            const FADEOUT = 165
            const END     = 215

            const inP  = Math.min(1, f / APPEAR)
            const outP = f < FADEOUT ? 1 : Math.max(0, 1 - (f - FADEOUT) / (END - FADEOUT))
            const env  = inP * inP * (3 - 2 * inP) * outP * outP * (3 - 2 * outP)

            DrawRect(0, 0, 320, 200, `rgba(0, 0, 0, ${0.5 * env})`)

            const pop = 1 - Math.pow(1 - inP, 3)

            hiddenCtx.save()
            hiddenCtx.translate(BX, BY)
            hiddenCtx.scale(0.86 + 0.14 * pop, 0.86 + 0.14 * pop)
            hiddenCtx.translate(-BX, -BY)

            const body = hiddenCtx.createLinearGradient(0, HINGE, 0, BY + BH / 2)
            body.addColorStop(0, `hsla(34, 33%, 43%, ${env})`)
            body.addColorStop(1, `hsla(30, 29%, 26%, ${env})`)
            roundRect(BX - BW / 2, HINGE, BW, BH, 14)
            hiddenCtx.fillStyle = body
            hiddenCtx.fill()

            for (let s = -1; s <= 1; s += 2) {
                DrawRect(BX + s * 44 - 6, HINGE + 8, 12, BH - 18, `hsla(30, 26%, 23%, ${env})`)
                DrawRect(BX + s * 44 - 9, HINGE + 34, 18, 9, `hsla(36, 22%, 55%, ${env})`)
            }

            roundRect(BX - BW / 2 + 8, HINGE - 3, BW - 16, 18, 8)
            hiddenCtx.fillStyle = `hsla(28, 24%, 14%, ${env})`
            hiddenCtx.fill()

            const op   = Math.min(1, Math.max(0, (f - OPEN0) / (OPEN1 - OPEN0)))
            const fore = Math.cos(op * op * (3 - 2 * op) * 2.4)
            const sq   = Math.abs(fore) < 0.06 ? (fore < 0 ? -0.06 : 0.06) : fore

            hiddenCtx.save()
            hiddenCtx.translate(BX, HINGE)
            hiddenCtx.scale(1, sq)
            roundRect(-BW / 2 + 3, 0, BW - 6, FLAP_H, 12)
            hiddenCtx.fillStyle = fore >= 0
                ? `hsla(35, 34%, 47%, ${env})`
                : `hsla(28, 26%, 25%, ${env})`
            hiddenCtx.fill()
            hiddenCtx.strokeStyle = `hsla(28, 28%, 17%, ${0.8 * env})`
            hiddenCtx.lineWidth   = 3
            hiddenCtx.stroke()
            hiddenCtx.restore()

            hiddenCtx.restore()

            ITEMS.forEach(it => {
                const ip = Math.min(1, (f - it.at) / RISE)
                if (ip <= 0) return

                const e = 1 - Math.pow(1 - ip, 3)
                it.draw(
                    BX + it.dx * e,
                    HINGE + 4 + (100 + it.dy - HINGE - 4) * e,
                    0.55 + 0.45 * e,
                    Math.min(1, ip * 2.5) * env
                )
            })

            if (f >= END) this.lifetime = 0
        }

        function roundRect(x, y, w, h, r) {
            hiddenCtx.beginPath()
            hiddenCtx.moveTo(x + r, y)
            hiddenCtx.lineTo(x + w - r, y)
            hiddenCtx.quadraticCurveTo(x + w, y, x + w, y + r)
            hiddenCtx.lineTo(x + w, y + h - r)
            hiddenCtx.quadraticCurveTo(x + w, y + h, x + w - r, y + h)
            hiddenCtx.lineTo(x + r, y + h)
            hiddenCtx.quadraticCurveTo(x, y + h, x, y + h - r)
            hiddenCtx.lineTo(x, y + r)
            hiddenCtx.quadraticCurveTo(x, y, x + r, y)
            hiddenCtx.closePath()
        }

        function drawRifle(x, y, s, a) {
            const steel = `hsla(210, 7%, 58%, ${a})`
            const dark  = `hsla(208, 8%, 30%, ${a})`
            const furn  = `hsla(30, 24%, 36%, ${a})`

            DrawRect(x - 40 * s, y - 2 * s, 78 * s,  5 * s, steel)
            DrawRect(x - 44 * s, y - 5 * s, 25 * s, 11 * s, furn)
            DrawRect(x - 20 * s, y - 7 * s, 34 * s, 14 * s, dark)
            DrawRect(x + 11 * s, y + 6 * s,  8 * s, 13 * s, furn)
            DrawRect(x -  6 * s, y + 6 * s, 11 * s, 17 * s, dark)
        }

        function drawArmor(x, y, s, a) {
            hiddenCtx.beginPath()
            hiddenCtx.moveTo(x - 21 * s, y - 24 * s)
            hiddenCtx.lineTo(x + 21 * s, y - 24 * s)
            hiddenCtx.lineTo(x + 21 * s, y + 10 * s)
            hiddenCtx.lineTo(x,          y + 26 * s)
            hiddenCtx.lineTo(x - 21 * s, y + 10 * s)
            hiddenCtx.closePath()
            hiddenCtx.fillStyle = `hsla(212, 8%, 50%, ${a})`
            hiddenCtx.fill()

            DrawRect(x - 21 * s, y - 12 * s, 42 * s, 5 * s, `hsla(32, 20%, 32%, ${a})`)
            DrawRect(x - 21 * s, y +  2 * s, 42 * s, 5 * s, `hsla(32, 20%, 32%, ${a})`)
        }

        function drawMag(x, y, s, a) {
            const body = `hsla(208, 8%, 34%, ${a})`
            const lip  = `hsla(212, 7%, 56%, ${a})`

            DrawRect(x - 7 * s, y - 16 * s, 14 * s, 32 * s, body)
            DrawRect(x - 8 * s, y - 20 * s, 16 * s,  6 * s, lip)
            for (let i = 0; i < 3; i++) {
                DrawRect(x - 7 * s, y - 5 * s + i * 8 * s, 14 * s, 2 * s, lip)
            }
        }
    }


    // ── Kill ────────────────────────────────────────────────────────
    function Kill() {
        this.lifetime = 1
        this.frame    = 0

        this.shards = []
        for (let i = 0; i < 14; i++) {
            this.shards.push([
                (i / 14) * Math.PI * 2 + (Math.random() - 0.5) * 0.3,
                60 + Math.random() * 80,
                5 + Math.random() * 6
            ])
        }

        this.draw = function () {
            const f = this.frame++

            const ARRIVE  = 31
            const TRACER  = 12
            const HIT     = 43
            const FLASH   = 10
            const DEBRIS  = 39
            const SPIN    = 66
            const FADEOUT = 114
            const END     = 149
            const TURNS   = 3

            const BACKDROP = 0.6
            const PUNCH    = 0.25

            const inP  = Math.min(1, f / ARRIVE)
            const outP = f < FADEOUT ? 1 : Math.max(0, 1 - (f - FADEOUT) / (END - FADEOUT))
            const env  = inP * inP * (3 - 2 * inP) * outP * outP * (3 - 2 * outP)

            const flash = f < HIT ? 0 : Math.pow(1 - Math.min(1, (f - HIT) / FLASH), 2)

            DrawRect(0, 0, 320, 200, `rgba(0, 0, 0, ${(BACKDROP + flash * PUNCH) * env})`)

            const sp     = f < HIT ? 0 : Math.min(1, (f - HIT) / SPIN)
            const ease   = 1 - Math.pow(1 - sp, 3)
            const face   = Math.cos(TURNS * Math.PI * 2 * ease)
            const squash = Math.abs(face) < 0.06 ? (face < 0 ? -0.06 : 0.06) : face

            hiddenCtx.save()
            hiddenCtx.translate(160, 100)
            hiddenCtx.scale(squash, 1)
            hiddenCtx.globalAlpha = env

            drawPlate(flash)

            hiddenCtx.restore()

            const edgeOn = 1 - Math.min(1, Math.abs(face) / 0.3)
            if (edgeOn > 0) {
                const blade = hiddenCtx.createLinearGradient(0, 0, 0, 200)
                blade.addColorStop(0,   'hsla(34, 100%, 70%, 0)')
                blade.addColorStop(0.5, `hsla(36, 100%, 92%, ${edgeOn * 0.9 * env})`)
                blade.addColorStop(1,   'hsla(34, 100%, 70%, 0)')
                DrawRect(157, 0, 6, 200, blade)
            }

            const tr = (f - (HIT - TRACER)) / TRACER
            if (tr > 0 && tr < 1) {
                const hx = -60 + 220 * tr
                const hy = 22  + 78  * tr
                const bx = hx - 110 * 0.943
                const by = hy - 110 * 0.334

                const trail = hiddenCtx.createLinearGradient(bx, by, hx, hy)
                trail.addColorStop(0,   'hsla(28, 100%, 58%, 0)')
                trail.addColorStop(0.6, `hsla(34, 100%, 72%, ${0.55 * env})`)
                trail.addColorStop(1,   `hsla(42, 100%, 96%, ${0.95 * env})`)
                DrawLine([bx, by], [hx, hy], trail, 14)

                DrawCircle(hx, hy, 8, `hsla(46, 100%, 97%, ${0.95 * env})`)
            }

            if (flash > 0) {
                const bloom = hiddenCtx.createRadialGradient(160, 100, 0, 160, 100, 190)
                bloom.addColorStop(0,    `hsla(38, 100%, 96%, ${flash * 0.95 * env})`)
                bloom.addColorStop(0.18, `hsla(30, 100%, 62%, ${flash * 0.7 * env})`)
                bloom.addColorStop(1,    'hsla(26, 100%, 48%, 0)')
                DrawRect(0, 0, 320, 200, bloom)
            }

            const dp = f < HIT ? 1 : Math.min(1, (f - HIT) / DEBRIS)
            if (dp < 1) {
                const dEase = 1 - Math.pow(1 - dp, 2)
                this.shards.forEach(s => {
                    const r0 = 18 + dEase * s[1] * 0.9
                    const r1 = r0 + s[1] * (0.35 + (1 - dp) * 0.5)
                    DrawLine(
                        [160 + Math.cos(s[0]) * r0, 100 + Math.sin(s[0]) * r0],
                        [160 + Math.cos(s[0]) * r1, 100 + Math.sin(s[0]) * r1],
                        `hsla(34, 100%, ${70 + flash * 26}%, ${(1 - dp) * 0.85 * env})`,
                        s[2] * (1 - dp * 0.45)
                    )
                })
            }

            if (f >= END) this.lifetime = 0
        }

        function drawPlate(flash) {
            const R = 100

            const steel = hiddenCtx.createLinearGradient(0, -R, 0, R)
            steel.addColorStop(0,   'hsl(30, 6%, 78%)')
            steel.addColorStop(0.5, 'hsl(28, 5%, 52%)')
            steel.addColorStop(1,   'hsl(26, 6%, 28%)')
            DrawCircle(0, 0, R, steel)

            DrawStroke(0, 0, R,       'hsla(0, 0%, 96%, 0.9)',  3)
            DrawStroke(0, 0, R * 0.7, 'hsla(0, 0%, 90%, 0.55)', 2)
            DrawStroke(0, 0, R * 0.4, 'hsla(0, 0%, 90%, 0.4)',  2)

            DrawCircle(0, 0, R * 0.22, `hsl(30, 100%, ${52 + flash * 40}%)`)

            DrawLine([-R, 0], [R, 0], 'hsla(0, 0%, 88%, 0.3)', 1)
            DrawLine([0, -R], [0, R], 'hsla(0, 0%, 88%, 0.3)', 1)
        }
    }


    // ── LowAmmo ─────────────────────────────────────────────────────
    function LowAmmo() {
        this.lifetime = 1
        this.frame    = 0

        const CLICKS = [
            { at: 40, amp: 1,    hue: 42, lit: 66 },
            { at: 68, amp: 0.65, hue: 20, lit: 52 },
            { at: 96, amp: 0.4,  hue: 4,  lit: 42 }
        ]

        this.draw = function () {
            const f = this.frame++

            const FADEIN  = 40
            const FADEOUT = 112
            const END     = 148

            const MAX_DIM = 0.75
            const DECAY   = 10

            const inP  = Math.min(1, f / FADEIN)
            const outP = f < FADEOUT ? 1 : Math.max(0, 1 - (f - FADEOUT) / (END - FADEOUT))
            const env  = inP * outP

            DrawRect(0, 0, 320, 200, `rgba(0, 0, 0, ${MAX_DIM * env})`)

            let live = null
            let hit  = 0
            for (let i = 0; i < CLICKS.length; i++) {
                const c = CLICKS[i]
                const s = c.amp * Math.max(0, 1 - (f - c.at) / DECAY)
                if (f >= c.at && s > hit) {
                    hit  = s
                    live = c
                }
            }

            if (live) {
                DrawRect(0, 0, 320, 200, `hsla(${live.hue}, 100%, ${live.lit}%, ${hit * env})`)
            }

            if (f >= END) this.lifetime = 0
        }
    }


    // ── LowHealth (value-driven) ────────────────────────────────────
    // Reads healthLength live for severity where staging read effectValue. Holds
    // until healthDetect clears lowHealthGoing (health recovered), then fades.
    function LowHealth() {
        this.frame  = 0
        this.sev    = 0
        this.wait   = 40
        this.pulses = []
        this.outEnv = 1

        const ATTACK  = 5
        const RELEASE = 26
        const DUB     = 16

        function envelope(age) {
            if (age < 0) return 0
            if (age < ATTACK) {
                const s = age / ATTACK
                return s * s * (3 - 2 * s)
            }
            const u = (age - ATTACK) / RELEASE
            return u < 1 ? (1 + Math.cos(u * Math.PI)) / 2 : 0
        }

        this.draw = function () {
            this.frame++

            // Fade out and self-terminate once the low-health state clears.
            if (!lowHealthGoing) {
                this.outEnv -= 0.03
                if (this.outEnv <= 0) { this.lifetime = 0; return }
            }

            // Severity from the live health reading (0 = full-ish, 1 = flatline).
            const hp     = healthLength_Meter.value * 100
            const target = Math.min(1, Math.max(0, (25 - hp) / 25))
            this.sev += (target - this.sev) / 30
            const sev = this.sev

            const interval = 80 - sev * 41
            const jitter   = sev * 0.45
            const skip     = sev * 0.3

            if (--this.wait <= 0) {
                if (Math.random() >= skip) {
                    this.pulses.push({ age: 0,    amp: 1 })
                    this.pulses.push({ age: -DUB, amp: 0.55 })
                }
                this.wait = interval * (1 + (Math.random() - 0.5) * 2 * jitter)
            }

            let pulse = 0
            this.pulses.forEach(p => {
                pulse += envelope(p.age) * p.amp
                p.age++
            })
            this.pulses = this.pulses.filter(p => p.age <= ATTACK + RELEASE)

            const floor = sev * sev * 0.42
            const level = Math.min(1, floor + (1 - floor) * pulse)

            const spawnP = Math.min(1, this.frame / 45)
            const alpha  = level * 0.88 * spawnP * spawnP * (3 - 2 * spawnP) * this.outEnv

            if (alpha <= 0) return

            const sat = 92 + level * 8
            const lit = 24 + level * 30

            const glow = hiddenCtx.createRadialGradient(160, 100, 0, 160, 100, 200)
            glow.addColorStop(0,    `hsla(0, ${sat}%, ${lit}%, ${alpha})`)
            glow.addColorStop(0.55, `hsla(0, ${sat}%, ${lit * 0.72}%, ${alpha})`)
            glow.addColorStop(1,    `hsla(0, ${sat}%, ${lit * 0.44}%, ${alpha})`)
            DrawRect(0, 0, 320, 200, glow)
        }
    }


    // ── RoundStart ──────────────────────────────────────────────────
    function RoundStart() {
        this.lifetime = 1
        this.frame    = 0
        this.smoke    = []

        this.pfx = null
        this.pfy = null

        this.draw = function () {
            const f = this.frame++

            const FADEIN  = 60
            const FADEOUT = 180
            const END     = 240

            const ARC_X = 160
            const ARC_Y = 140
            const ARC_R = 75
            const SWEEP = 100

            const DRAG = 0.93
            const LIFT = 0.035

            const fade = f < FADEIN  ? f / FADEIN
                       : f < FADEOUT ? 1
                       : Math.max(0, 1 - (f - FADEOUT) / (END - FADEOUT))

            hiddenCtx.save()
            hiddenCtx.globalAlpha = fade

            DrawRect(0, 0, 320, 200, 'rgba(0, 0, 0, 0.75)')

            const angle = Math.PI * (0.5 + 0.5 * Math.cos((f / SWEEP) * Math.PI * 2))
            const fx    = ARC_X + Math.cos(angle) * ARC_R
            const fy    = ARC_Y - Math.sin(angle) * ARC_R

            const sweepX = this.pfx === null ? 0 : fx - this.pfx
            const sweepY = this.pfy === null ? 0 : fy - this.pfy
            this.pfx = fx
            this.pfy = fy

            if (f < FADEOUT && f % 5 === 0) {
                const r0    = 34 + Math.random() * 28
                const dir   = -Math.PI / 2 + (Math.random() - 0.5)
                const speed = 3.2 + Math.random() * 2.4
                this.smoke.push({
                    x:    fx + Math.cos(dir) * 10 + (Math.random() - 0.5) * 6,
                    y:    fy + Math.sin(dir) * 10 + (Math.random() - 0.5) * 6,
                    vx:   Math.cos(dir) * speed + sweepX * 0.6,
                    vy:   Math.sin(dir) * speed + sweepY * 0.6,
                    r:    r0,
                    r0:   r0,
                    seed: Math.random() * 6.28,
                    age:  0,
                    life: 90 + Math.random() * 50
                })
            }

            this.smoke.forEach(p => {
                p.age++

                p.vy -= LIFT
                p.vx += Math.sin(p.age * 0.05 + p.seed) * 0.02
                p.vx *= DRAG
                p.vy *= DRAG
                p.x  += p.vx
                p.y  += p.vy
                p.r  += 0.4 + (Math.abs(p.vx) + Math.abs(p.vy)) * 0.35

                const k = 1 - p.age / p.life
                const a = 0.6 * Math.min(1, k * 2.2) * (p.r0 / p.r)

                const dx     = fx - p.x
                const dy     = fy - p.y
                const dist   = Math.max(1, Math.sqrt(dx * dx + dy * dy))
                const lightK = Math.max(0, 1 - dist / 140)
                const sat    = 8  + lightK * 82
                const lit    = 42 + lightK * 38

                const lx = p.x + (dx / dist) * p.r * 0.35
                const ly = p.y + (dy / dist) * p.r * 0.35

                const hue  = 100 + lightK * 20
                const puff = hiddenCtx.createRadialGradient(lx, ly, 0, p.x, p.y, p.r)
                puff.addColorStop(0,    `hsla(${hue}, ${sat}%, ${lit}%, ${a})`)
                puff.addColorStop(0.58, `hsla(${hue}, ${sat * 0.8}%, ${lit * 0.92}%, ${a * 0.94})`)
                puff.addColorStop(0.85, `hsla(${hue}, ${sat * 0.55}%, ${lit * 0.8}%, ${a * 0.62})`)
                puff.addColorStop(1,    `hsla(100, ${sat * 0.4}%, ${lit * 0.7}%, 0)`)
                DrawCircle(p.x, p.y, p.r, puff)
            })
            this.smoke = this.smoke.filter(p => p.age < p.life)

            const flick = 0.85 + Math.random() * 0.15
            DrawCircle(fx, fy, 42 * flick, 'hsla(120, 100%, 45%, 0.14)')
            DrawCircle(fx, fy, 26 * flick, 'hsla(120, 100%, 52%, 0.32)')
            DrawCircle(fx, fy, 15 * flick, 'hsla(115, 100%, 72%, 0.85)')
            DrawCircle(fx, fy,  7 * flick, 'hsla(95, 100%, 96%, 1)')

            hiddenCtx.restore()

            if (f >= END) this.lifetime = 0
        }
    }


    // ── StaminaUse (value-driven) ───────────────────────────────────
    // Reads staminaLength live for the green→yellow→red hue where staging read
    // effectValue. Fades out when staminaDetect clears staminaGoing.
    function StaminaUse() {
        this.hue   = staminaLength_Meter.value * 120
        this.frame = 0
        this.env   = 0

        this.draw = function () {
            this.frame++

            const target = staminaGoing ? 1 : 0
            this.env += (target - this.env) / 20
            if (!staminaGoing && this.env < 0.02) { this.lifetime = 0; return }

            // 100 -> hue 120 (green), 50 -> 60 (yellow), 0 -> 0 (red)
            const targetHue = staminaLength_Meter.value * 120
            this.hue += (targetHue - this.hue) / 20

            const alpha = (0.2 + Math.sin((this.frame / 180) * Math.PI * 2) * 0.05) * this.env

            DrawRect(0, 0, 320, 200, `hsla(${this.hue}, 100%, 50%, ${alpha})`)
        }
    }


    // ── UseAction (value-driven) ────────────────────────────────────
    // Reads actionLength live for how much gauze is laid where staging read
    // effectValue. Fades in while the action bar is up (useActionGoing) and out
    // when it clears.
    function UseAction() {
        // Forward-fill: the gauze only lays as the action bar climbs and never
        // retreats on a momentary dip in the reading — actionLength drives how far
        // the wrap gets (its "duration"). When the bar disappears (useActionGoing
        // clears) the wrap holds at its current length and fades out.
        this.prog  = Math.min(1, Math.max(0, actionLength_Meter.value))
        this.fadeP = 0

        const WRAPS = 9
        const TH    = 54
        const STEP  = 26
        const LEN   = 330
        const TILT  = -0.16
        const TOP   = -6
        const FADE  = 36

        this.draw = function () {
            // Fade in while the bar is up, out once it is gone; terminate when fully out.
            const want = useActionGoing ? 1 : -1
            this.fadeP = Math.min(1, Math.max(0, this.fadeP + want / FADE))
            const env  = this.fadeP * this.fadeP * (3 - 2 * this.fadeP)
            if (this.fadeP <= 0) { this.lifetime = 0; return }

            // Ratchet the wrap forward toward the bar's fill; never unwind.
            const target = Math.min(1, Math.max(0, actionLength_Meter.value))
            if (target > this.prog) this.prog += (target - this.prog) / 8

            DrawRect(0, 0, 320, 200, `rgba(0, 0, 0, ${0.55 * env})`)

            const laid = this.prog * WRAPS
            for (let i = 0; i < WRAPS; i++) {
                const portion = Math.min(1, laid - i)
                if (portion <= 0) break
                drawWrap(TOP + i * STEP, portion, env)
            }
        }

        function drawWrap(y, portion, env) {
            const x0 = -LEN / 2
            const w  = LEN * portion

            hiddenCtx.save()
            hiddenCtx.translate(160, y)
            hiddenCtx.rotate(TILT)
            hiddenCtx.globalAlpha = env

            const cloth = hiddenCtx.createLinearGradient(0, -TH / 2, 0, TH / 2)
            cloth.addColorStop(0,    'hsla(36, 22%, 62%, 0.62)')
            cloth.addColorStop(0.34, 'hsla(38, 26%, 90%, 0.72)')
            cloth.addColorStop(0.72, 'hsla(36, 20%, 78%, 0.68)')
            cloth.addColorStop(1,    'hsla(32, 18%, 48%, 0.6)')
            DrawRect(x0, -TH / 2, w, TH, cloth)

            DrawLine([x0, -TH / 2], [x0 + w, -TH / 2], 'hsla(40, 30%, 96%, 0.5)',  2)
            DrawLine([x0, TH / 2],  [x0 + w, TH / 2],  'hsla(28, 16%, 36%, 0.45)', 2)

            for (let n = 0; n < 3; n++) {
                const ny = -TH / 2 + TH * (0.28 + n * 0.22)
                DrawLine([x0, ny], [x0 + w, ny], 'hsla(34, 20%, 84%, 0.14)', 1)
            }

            DrawLine([x0 + w, -TH / 2], [x0 + w, TH / 2], 'hsla(40, 28%, 94%, 0.55)', 2)

            hiddenCtx.restore()
        }
    }


    // ── Task ────────────────────────────────────────────────────────
    // New objective / task assigned — the top-of-screen blue task banner. The
    // canvas dims to a deep intel-blue, then a bright cyan scan line sweeps once
    // left to right, wiping a holographic grid in behind it as it passes, like a
    // briefing feed loading. As the scan clears the middle, corner brackets snap in
    // around a central panel and a few data rows type out inside it; it holds, then
    // the whole thing fades. Blue is the intended theme. One-shot, expires at 200
    // frames (~3.3s).
    function Task() {
        this.lifetime = 1
        this.frame    = 0

        this.draw = function () {
            const f = this.frame++

            const FADEIN  = 24
            const SWEEP0  = 24
            const SWEEP1  = 104
            const LOCK    = 96
            const FADEOUT = 150
            const END     = 200

            const inP  = Math.min(1, f / FADEIN)
            const outP = f < FADEOUT ? 1 : Math.max(0, 1 - (f - FADEOUT) / (END - FADEOUT))
            const env  = inP * inP * (3 - 2 * inP) * outP * outP * (3 - 2 * outP)

            // Deep blue-black backdrop, a touch lighter at the top.
            const back = hiddenCtx.createLinearGradient(0, 0, 0, 200)
            back.addColorStop(0, `hsla(210, 60%, 9%, ${0.9 * env})`)
            back.addColorStop(1, `hsla(214, 72%, 4%, ${0.9 * env})`)
            DrawRect(0, 0, 320, 200, back)

            // Scan position, eased across the full width.
            const sp   = Math.min(1, Math.max(0, (f - SWEEP0) / (SWEEP1 - SWEEP0)))
            const ease = sp * sp * (3 - 2 * sp)
            const sx   = 320 * ease

            // Holographic grid, revealed only to the left of the scan (clip to the
            // swept region). Horizontal lines drift slowly for a live-feed feel.
            hiddenCtx.save()
            hiddenCtx.beginPath()
            hiddenCtx.rect(0, 0, sx, 200)
            hiddenCtx.clip()
            const gcol  = `hsla(196, 90%, 62%, ${0.26 * env})`
            for (let x = 0; x <= 320; x += 26) DrawLine([x, 0], [x, 200], gcol, 3)
            const drift = (f * 0.4) % 22
            for (let y = -22 + drift; y <= 200; y += 22) DrawLine([0, y], [320, y], gcol, 3)
            hiddenCtx.restore()

            // The scan line — a bright cyan bar with a soft glow either side.
            if (sp > 0 && sp < 1) {
                const beam = hiddenCtx.createLinearGradient(sx - 22, 0, sx + 22, 0)
                beam.addColorStop(0,   'hsla(196, 100%, 60%, 0)')
                beam.addColorStop(0.5, `hsla(190, 100%, 72%, ${0.9 * env})`)
                beam.addColorStop(1,   'hsla(196, 100%, 60%, 0)')
                DrawRect(sx - 22, 0, 44, 200, beam)
                DrawLine([sx, 0], [sx, 200], `hsla(185, 100%, 88%, ${0.9 * env})`, 4)
            }

            // Corner brackets snap in around the central panel once the scan has
            // crossed it — the objective locking on. The arms grow from each corner
            // and a few data rows type outward inside.
            const lock = Math.min(1, Math.max(0, (f - LOCK) / 22))
            if (lock > 0) {
                const bx = 74, by = 58, bw = 172, bh = 84
                const arm = 26 * lock
                const bc  = `hsla(192, 100%, 72%, ${lock * env})`
                const corners = [
                    [bx,      by,       1,  1],
                    [bx + bw, by,      -1,  1],
                    [bx,      by + bh,  1, -1],
                    [bx + bw, by + bh, -1, -1]
                ]
                corners.forEach(c => {
                    DrawLine([c[0], c[1]], [c[0] + arm * c[2], c[1]], bc, 3)
                    DrawLine([c[0], c[1]], [c[0], c[1] + arm * c[3]], bc, 3)
                })
                for (let i = 0; i < 3; i++) {
                    const rowP = Math.min(1, Math.max(0, lock * 1.4 - i * 0.28))
                    DrawLine(
                        [bx + 16, by + 26 + i * 18],
                        [bx + 16 + (bw - 64) * rowP, by + 26 + i * 18],
                        `hsla(196, 90%, 64%, ${0.45 * lock * env})`, 3
                    )
                }
            }

            if (f >= END) this.lifetime = 0
        }
    }


    // ── Action ──────────────────────────────────────────────────────
    // Hold-to-interact charging bar (the alternate to UseAction). Self-contained
    // one-shot: the segmented bar auto-charges left to right, flashes cyan-white
    // with a ring blow-out at full, holds, and fades. NOT wired to a callback yet
    // — parked here until it's assigned meters. Expires at 173 frames (~2.9s).
    function Action() {
        this.lifetime = 1
        this.t    = 0
        this.pop  = 0
        this.done = false

        // Bar geometry and how many segment ticks divide it.
        const BX = 30, BY = 82, BW = 260, BH = 36
        const SEGS = 10

        // One-shot timing (frames @60fps): charge, hold full, fade out, gone.
        const CHARGE = 100
        const HOLD   = 45
        const FADEO  = 28
        const END    = CHARGE + HOLD + FADEO

        this.draw = function () {
            const t = this.t++

            // Play once, then die.
            if (t >= END) { this.lifetime = 0; return }

            // Charge 0 -> 1 over CHARGE frames, then hold full.
            const prog = Math.min(1, t / CHARGE)
            if (prog > 0.999 && !this.done) { this.done = true; this.pop = 1 }

            // Envelope: quick fade in, hold, fade out.
            let env
            if (t < 10)                 env = t / 10
            else if (t < CHARGE + HOLD) env = 1
            else                        env = 1 - (t - (CHARGE + HOLD)) / FADEO
            env = Math.max(0, Math.min(1, env))
            env = env * env * (3 - 2 * env)
            if (env <= 0) return

            // Transparent black behind the bar so it reads over a bright ambience.
            DrawRect(0, 0, 320, 200, `rgba(0, 0, 0, ${0.5 * env})`)

            // Cyan outer frame, then the dark empty track inside it.
            DrawRect(BX - 3, BY - 3, BW + 6, BH + 6, `hsla(190, 80%, 45%, ${0.55 * env})`)
            DrawRect(BX - 1, BY - 1, BW + 2, BH + 2, `hsla(205, 45%, 12%, ${env})`)

            // The fill, left to right.
            const fw   = BW * prog
            const fill = hiddenCtx.createLinearGradient(BX, 0, BX + BW, 0)
            fill.addColorStop(0, `hsla(192, 90%, 48%, ${env})`)
            fill.addColorStop(1, `hsla(186, 100%, 66%, ${env})`)
            DrawRect(BX, BY, fw, BH, fill)

            // Leading-edge glow while it is still charging.
            if (prog > 0.01 && prog < 0.999) {
                DrawRect(BX + fw - 5, BY - 2, 10, BH + 4, `hsla(185, 100%, 88%, ${0.75 * env})`)
            }

            // Segment ticks cut into the bar.
            for (let s = 1; s < SEGS; s++) {
                const gx = BX + (BW / SEGS) * s
                DrawLine([gx, BY], [gx, BY + BH], `hsla(205, 45%, 6%, ${0.6 * env})`, 1)
            }

            // Completion: a flash across the bar and a ring blowing out from its centre.
            if (this.pop > 0) {
                DrawRect(BX, BY, BW, BH, `hsla(180, 100%, 92%, ${this.pop * this.pop * 0.9 * env})`)
                DrawStroke(160, BY + BH / 2, 22 + (1 - this.pop) * 140,
                           `hsla(188, 100%, 80%, ${this.pop * this.pop * 0.8 * env})`, 5 + this.pop * 12)
                this.pop -= 0.05
            }
        }
    }
    //#endregion

    window.requestAnimationFrame(update)
</script>
