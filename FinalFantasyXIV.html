  <body style="margin: 0; padding: 0; background: #000;">
  <canvas id="exCanvas" width="320" height="200"></canvas>  
  </body>
  
  <script> 
  var canvas, ctx;
  canvas = document.getElementById('exCanvas');
  ctx = canvas.getContext('2d');
  var width = 320;
  var height = 200;
  var effects = [];
  let gInGame = false


  var healthMeter = new Meter(5, healthBar);
  var levelMeter = new Meter(5, levelBar);
  var targetMeter = new Meter(5, targetBar);
  var attackMeter = new Meter(5,attackBar);
  var mpMeter = new Meter(5, mpBar);
  var inGameNRedMeter = new Meter(5, inGameCallback)
  var inGameDownRedMeter = new Meter(5, inGameCallback)

  
  function update() {
      DrawRect(0, 0, 320, 200, "black")
      backgroundHandler()
       
      attackMeter.setValue(engine.vision.attack);
      targetMeter.setValue(engine.vision.target);
      healthMeter.setValue(engine.vision.hp);
      mpMeter.setValue(engine.vision.mp);
      levelMeter.setValue(engine.vision.level);
      inGameNRedMeter.setValue(engine.vision.inGameNRed)
      inGameDownRedMeter.setValue(engine.vision.inGameDownRed)
     
  
      effects.forEach((ele, i) => {
        ele.draw()
        if(ele.lifetime <= 0){
          effects.splice(i, 1)
        }
      })

      if(enableHud){
        DrawHUD();
      }

      window.requestAnimationFrame(update);
  };

  let proBack = [0, 0, 0]
    function onbackColorChanged(){
      proBack = hexToHSL(backColor)
  }

    let backgroundEaseHue = 0;
    let backgroundEaseLit = 0;
    let backgroundEaseSat = 0
    let gCycle = 0
    function backgroundHandler(){
        switch(backgroundMode){
            case "Color Cycle": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Color Cycle Ambience": 
            copyScreen(ambienceAlpha / 100)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Custom": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            break;
            case "Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Custom Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Ambience Audio Visualizer": 
            copyScreenAudio(ambienceAlpha / 100)
            break;
            case "Custom Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
            case "Color Cycle Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
        }
    }

    let audioScreenSat = 0
    let audioScreenLit = 0
    function copyScreenAudio(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      audioScreenSat += (engine.audio.density * 100 - audioScreenSat) / 10
      audioScreenLit += (engine.audio.density * 100 - audioScreenLit) / 10
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        ctx.fillStyle = `hsla(${hue[iZone]}, ${sat[iZone] * (audioScreenSat / 200 + .5)}%, ${lightness[iZone] * (audioScreenLit / 100)}%, ${alpha})`;
        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }
  
    function copyScreen(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        ctx.fillStyle = `hsla(${(backgroundMode == "Custom Ambience" ? proBack[0] : hue[iZone] + gCycle * (backgroundMode == "Color Cycle Ambience"))}, ${sat[iZone]}%, ${lightness[iZone]}%, ${alpha})`;
        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }




  function inGameCallback(){
    if(inGameNRedMeter.value >=.95 && inGameDownRedMeter.value >=.95 && engine.vision.inGameNotRed <.1){
      gInGame = true
      
    }else{
      gInGame = false
     
    }
  }

    let smoothHealth = 0;
    let smoothMP = 0;

    function DrawHUD() {
    if (gInGame) {
      const smoothFactor = 0.1; 
      smoothHealth += (healthMeter.value - smoothHealth) * smoothFactor;
      smoothMP   += (mpMeter.value   - smoothMP)   * smoothFactor;
      ctx.beginPath()
      ctx.fillStyle = healthColor;
      ctx.fillRect((HealthBarX * 3.2), (HealthBarY * 2), (smoothHealth ) * (HealthBarWidth * 3.2), (HealthBarHeight * 2))
      //MP
      ctx.beginPath()
      ctx.fillStyle = MPColor;
      ctx.fillRect((MPBarX * 3.2), (MPBarY * 2), (smoothMP) * (MPBarWidth * 3.2), (MPBarHeight * 2))
    } else if (adjToggle || !gInGame) {
      ctx.beginPath()
      ctx.fillStyle = healthColor;
      ctx.fillRect((HealthBarX * 3.2), (HealthBarY * 2), (HealthBarWidth * 3.2), (HealthBarHeight * 2))
      //MP
      ctx.beginPath()
      ctx.fillStyle = MPColor;
      ctx.fillRect((MPBarX * 3.2), (MPBarY * 2), (MPBarWidth * 3.2), (MPBarHeight*2))
    }
    
  }


  function targetBar(){
    if(enableTarget){
      if (gInGame && targetMeter.value >= .75 && engine.vision.targetNot < .1) {
        effects.push(new TargetState());  
       
      }
    }
  }
  
  function levelBar(){
    if(enableExp){
      if(gInGame && levelMeter.decreased && levelMeter.diff > .5){
        var colors = hexToHSL(effectHex1);

        effects.push(new colorFilter(0, -100, 2200));
       
        for (let i = 0; i < 20 * 2; i++) {
              setTimeout(function () {
                effects.push(new moveableBar(-30, Math.random() * 200, 10, 30, 10, 0, colors.h + random(-10, 10), colors.s, colors.l, 0.9));
              }, Math.random() * 2000);
              setTimeout(function () {
                effects.push(new moveableBar(320, Math.random() * 200, 10, 30, -10, 0, colors.h + random(-10, 10), colors.s, colors.l, 0.9));
              }, Math.random() * 2000);
            }
      }
    }
  }
  function attackBar(){
    if(enableAttack){
      if(gInGame && attackMeter.value >= .5){
        effects.push(new attackState());  
       
      }
    }
  }

  function healthBar() {
    if(enableHealth){
      if (gInGame && healthMeter.increased && healthMeter.diff > .04) {
        
      var colors = hexToHSL(effectHex2);
      for (let i = 0; i < 20; i++) {
          setTimeout(function () {
            effects.push(
              new moveableBar(i * 20, 160, 100, 20, 0, -5, colors.h + random(-20, 20), colors.s + random(-20, 20), colors.l, 0.9)
            );
          }, i * 30);
          setTimeout(function () {
            effects.push(
              new moveableBar(i * 20, 160, 100, 20, 0, 5, colors.h + random(-20, 20), colors.s + random(-20, 20), colors.l, 0.9)
            );
          }, i * 30);
        }
      }
      if(gInGame && healthMeter.decreased && healthMeter.diff > .04){
       
      var colors = hexToHSL(effectHex3);
      for (let i = 0; i < 10 * 2; i++) {
          effects.push(new SparkleEffect(colors.h + random(-10, 10), colors.s, colors.l, 30));
        }
  
      }
    }
  }

  function mpBar() {
    if(enableMana){
      if (gInGame && mpMeter.increased && mpMeter.diff > .03) {
       
      var colors = hexToHSL(effectHex4);
      for (let i = 160; i < 320; i = i + 20) {
          effects.push(new moveableBar(i, 40 + i, 20, 200, 0, 7, colors.h + random(-20, 20), colors.s + random(-20, 20), colors.l, 0.9));
          effects.push(
            new moveableBar(320 - i, 40 + i, 20, 200, 0, 7, colors.h + random(-20, 20), colors.s + random(-20, 20), colors.l, 0.9)
          );
        }
      }
      if(gInGame && mpMeter.decreased && mpMeter.diff > .04){
       
      var colors = hexToHSL(effectHex5);
      for (let i = 0; i < 20; i++) {
          {
            setTimeout(function () {
              effects.push(
                new moveableBar(0, i * 10, 20, 320, random(-7, 7), 0, colors.h + random(-20, 20), colors.s + random(-20, 20), colors.l, 0.7)
              );
            }, i * 50);
          }
        }
        
      }
    }
  }


  function SparkleEffect(hue, saturation, lightness, size) {
    this.x = Math.random() * 320;
    this.y = Math.random() * 200;
    this.hue = hue;
    this.saturation = saturation;
    this.lightness = lightness;
    this.lifetime = 40;
    this.size = size;
    this.draw = function () {
      ctx.fillStyle = 'hsl(' + this.hue + ',' + this.saturation + '%,' + this.lightness + '%)';
      ctx.fillRect(this.x, this.y, this.size, this.size);
      this.lifetime--;
    };
  }
  
  function colorFilter(hue, lightnessOffset = 0, milliseconds = 4000) {
    this.start = new Date().getTime();
    this.duration = milliseconds;
    this.hue = hue;
    this.lightnessOffset = lightnessOffset;
    this.draw = function () {
      this.elapsed = new Date().getTime() - this.start;
      if (this.elapsed > this.duration) {
       this.lifetime = 0
      }
      this.draw();
    };
  
    this.draw = function () {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
  
      for (var iZone = 0; iZone < 560; iZone++) {
        var satBoost = sat[iZone] + 35;
        ctx.fillStyle =
          'hsla(' + this.hue + ',' + satBoost + '%,' + (lightness[iZone] + this.lightnessOffset) + '%, ' + 100 * 0.01 + ')';
  
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
  
        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    };
  }
  function CenterWave(hue, saturation, lightness, value) {
    this.start = new Date().getTime();
    this.duration = 2000;
    this.lifetime = 50;
    this.size = 0;
    this.value = value;
    this.hue = hue;
    this.saturation = saturation;
    this.lightness = lightness;
    this.flashing;
    this.draw = function () {
      this.elapsed = new Date().getTime() - this.start;
      if (this.elapsed > this.duration) {
        this.lifetime = 0
      }
      this.Draw();
    };
    this.Draw = function () {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
  
      for (var iZone = 0; iZone < 560; iZone++) {
        ctx.fillStyle = 'hsla(' + hue[iZone] + ',' + sat[iZone] + '%,' + lightness[iZone] + '%, ' + 100 * 0.01 + ')';
  
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
  
        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
  
      ctx.fillStyle = 'hsl(' + this.hue + ',' + this.saturation + '%,' + random(this.lightness - 10, this.lightness + 10) + '%)';
  
      ctx.fillRect(160, 0, this.size * 160, 200);
      ctx.fillRect(160, 0, -this.size * 160, 200);
      if (this.size < this.value) {
        this.size += 0.03;
      }
    };
    this.lifetime--;
  }
  function moveableBar(x, y, width, height, xDirection, yDirection, hue, sat, lit, alpha) {
    this.x = x;
    this.y = y;
    this.hue = hue;
    this.sat = sat;
    this.lit = lit;
    this.alpha = alpha;
    this.lifetime = 50;
    this.size = 0;
    this.ydirection = yDirection;
    this.xdirection = xDirection;
    this.width = width;
    this.height = height;
  
    this.draw = function () {
      ctx.fillStyle = 'hsla(' + this.hue + ',' + this.sat + '%,' + this.lit + '%,' + this.alpha + ' )';
      ctx.fillRect(this.x, this.y, this.height, this.width);
      this.lifetime--;
      this.y -= this.ydirection;
      this.x += this.xdirection;
    };
  }
    function attackState() {
        this.frameSkip = 0;
        
        this.draw = function () {
          this.frameSkip++;
          if (this.frameSkip % 2 !== 0) return;
          
          ctx.save();
          ctx.globalAlpha = 0.1;
          
          let lightness = new Int8Array(engine.zone.lightness);
          let sat = new Int8Array(engine.zone.saturation);
          
          let lastColor = "";
      
          for (var iZone = 0; iZone < 280; iZone++) {
            let color = "hsl(" + 0 + "," + sat[iZone] + "%," + lightness[iZone] + "%)";
            
            if (color !== lastColor) {
              ctx.fillStyle = color;
              lastColor = color;
            }
            
            var iRow = Math.floor(iZone / 28);
            var iCol = iZone % 28;
            ctx.fillRect(iCol * 320 / 28, iRow * 200 / 20, 320 / 28, 200 / 20);
          }
          
          ctx.restore();
          
          if(attackMeter.value < .1 || !gInGame){
            this.lifetime = 0
          }
        };
    }

    function TargetState() {
        this.frameSkip = 0;
        
        this.draw = function () {
          this.frameSkip++;
          if (this.frameSkip % 2 !== 0) return;
          
          ctx.save();
          ctx.globalAlpha = 0.3;
          
          let lightness = new Int8Array(engine.zone.lightness);
          let sat = new Int8Array(engine.zone.saturation);
          
          let lastColor = "";
      
          for (var iZone = 0; iZone < 280; iZone++) {
            let color = "hsl(" + 61 + "," + sat[iZone] + "%," + lightness[iZone] + "%)";
            
            if (color !== lastColor) {
              ctx.fillStyle = color;
              lastColor = color;
            }
            
            var iRow = Math.floor(iZone / 28);
            var iCol = iZone % 28;
            ctx.fillRect(iCol * 320 / 28, iRow * 200 / 20, 320 / 28, 200 / 20);
          }
          
          ctx.restore();
          
          if(targetMeter.value < .1 || !gInGame){
            this.lifetime = 0
          }
        };
    }

  
  function random(min, max) {
    return Math.floor(Math.random() * (max - min)) + min;
  }

  function DrawRect(x, y, width, height, color) {
      ctx.beginPath();
      ctx.fillStyle = color;
      ctx.fillRect(x, y, width, height);
  };
  
  function hexToHSL(hex) {
    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  
    var r = parseInt(result[1], 16);
    var g = parseInt(result[2], 16);
    var b = parseInt(result[3], 16);
  
    (r /= 255), (g /= 255), (b /= 255);
    var max = Math.max(r, g, b),
      min = Math.min(r, g, b);
    var h,
      s,
      l = (max + min) / 2;
  
    if (max === min) {
      h = s = 0; // achromatic
    } else {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r:
          h = (g - b) / d + (g < b ? 6 : 0);
          break;
        case g:
          h = (b - r) / d + 2;
          break;
        case b:
          h = (r - g) / d + 4;
          break;
      }
      h /= 6;
    }
  
    s = s * 100;
    s = Math.round(s);
    l = l * 100;
    l = Math.round(l);
    h = Math.round(360 * h);
  
    var colors = [];
    colors['h'] = h;
    colors['s'] = s;
    colors['l'] = l;
  
    return colors;
  }
  
  function Meter(count, callback) {
    this.size = count;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    var values = [];
  
    this.setValue = function (updatedValue) {
      // Add and shift.
      values.push(updatedValue);
      if (values.length > this.size) {
        values.shift();
      }
  
      // Exit early if we've got a long-term match.
      for (var i = 0; i < values.length - 1; i++) {
        if (values[i] !== values[i + 1]) return;
      }
  
      // We got here, so we've got a matching value collection.
      if (this.value !== values[0]) {
        //var fromZero = this.value === 0;
        //var toZero = values[0] === 0;
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        callback();
      }
    };
  }
 
  window.requestAnimationFrame(update);
