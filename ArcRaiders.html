<body style="margin: 0; padding: 0; background: #000;">
    <canvas id="exCanvas" width="320" height="200"></canvas>
</body>
  
<script>
    // Canvas initialization
    const canvas = document.getElementById('exCanvas');
    const ctx = canvas.getContext('2d');
    const width = 320;
    const height = 200;
    let effects = [];
    
    // Create a hidden canvas
    const hiddenCanvas = document.createElement('canvas');
    hiddenCanvas.width = 320;
    hiddenCanvas.height = 200;
    // Don't attach to DOM
    const hiddenCtx = hiddenCanvas.getContext('2d');

    let InGameCompassMeter = new Meter(3, inGameCallback)

    let HealthMeter = new Meter(3, inGameCallback)
    let RedHealthMeter = new Meter(5, healthCallback)
    let YellowHealthMeter = new Meter(5, healthCallback)

    let ShieldMeter = new Meter(3, inGameCallback)
    let RedShieldMeter = new Meter(5, shieldCallback)
    let YellowShieldMeter = new Meter(5, shieldCallback)

    let Sprint1Meter = new Meter(5, sprintCallback)
    let Sprint2Meter = new Meter(5, sprintCallback)
    let SprintNotMeter = new Meter(5, sprintCallback)
    let SprintValueMeter = new Meter(2, sprintCallback)

    let EnRedMeter = new Meter(8, encumberedCallback)
    let EnBlackMeter = new Meter(8, encumberedCallback)

    let XPYellowMeter = new Meter(8, xpCallback)
    let XPBlackMeter = new Meter(8, xpCallback)

    let LossMeter = new Meter(5, endCallback)
    let WinMeter = new Meter(5, endCallback)

    let LootWhiteMeter = new Meter(8, lootCallback)
    let LootNotWhiteMeter = new Meter(8, lootCallback)
    let LootBlueMeter = new Meter(8, lootCallback)
   
    //#region Update
    function update() {
      DrawRect(0, 0, 320, 200, "black")
      backgroundHandler()

      InGameCompassMeter.setValue(engine.vision.inGameWhiteCompass)

      HealthMeter.setValue((engine.vision.health1 + engine.vision.health2 + engine.vision.health3) / 3)
      RedHealthMeter.setValue((engine.vision.healthRed1 + engine.vision.healthRed2 + engine.vision.healthRed3) / 3)
      YellowHealthMeter.setValue((engine.vision.healthYellow1 + engine.vision.healthYellow2 + engine.vision.healthYellow3) / 3)

      ShieldMeter.setValue((engine.vision.shield1 + engine.vision.shield2 + engine.vision.shield3) / 3)
      RedShieldMeter.setValue((engine.vision.shieldRed1 + engine.vision.shieldRed2 + engine.vision.shieldRed3) / 3)
      YellowShieldMeter.setValue((engine.vision.shieldYellow1 + engine.vision.shieldYellow2 + engine.vision.shieldYellow3) / 3)

      Sprint1Meter.setValue(engine.vision.sprint1)
      Sprint2Meter.setValue(engine.vision.sprint2)
      SprintNotMeter.setValue(engine.vision.sprintNotGrey)
      SprintValueMeter.setValue(engine.vision.sprintValue)

      EnRedMeter.setValue(engine.vision.heavyRed)
      EnBlackMeter.setValue(engine.vision.heavyBlack)

      XPYellowMeter.setValue(engine.vision.xpYellow)
      XPBlackMeter.setValue(engine.vision.xpBlack)

      LossMeter.setValue(engine.vision.lossOrangeRed)
      WinMeter.setValue(engine.vision.winGreen)

      LootWhiteMeter.setValue(engine.vision.lootWhite)
      LootNotWhiteMeter.setValue(engine.vision.lootNotWhite)
      LootBlueMeter.setValue(engine.vision.lootBlue)
  
      effects.forEach((ele, i) => {
        ele.draw()
        if(ele.lifetime <= 0){
          effects.splice(i, 1)
        }
      })

      if(adjOn && !gInGame){
        if(hpOn){
          DrawRect(hpX * 3.2, hpY * 2, hpWidth * 3.2, hpHeight * 2, "red")
          DrawCircle(hpX * 3.2 + hpWidth * 3.2, hpY * 2 + hpHeight, hpHeight, "red")
        }
        if(shieldOn){
          DrawRect(shieldX * 3.2, shieldY * 2, shieldWidth * 3.2, shieldHeight * 2, getColorString(200, 100, 50, 1))
          DrawCircle(shieldX * 3.2 + shieldWidth * 3.2, shieldY * 2 + shieldHeight, shieldHeight, getColorString(200, 100, 50, 1))
        }
      }

      ctx.drawImage(hiddenCanvas, 0, 0)
  
      window.requestAnimationFrame(update);
    };
    //#endregion

    let gInGame = false
    function inGameCallback(){
      healthCallback()
      shieldCallback()
      if(InGameCompassMeter.value >= .15 && (HealthMeter.value >= .05 || RedHealthMeter.value >= .05 || YellowHealthMeter.value >= .05) && !gInGame) gInGame = true
      else if(InGameCompassMeter.value <= .05 && HealthMeter.value < .05 && RedHealthMeter.value < .05 && gInGame) gInGame = false
    }

    let hpBarGoing = false
    let hpLowGoing = false
    let hpHealGoing = false
    let downedGoing = false
    function healthCallback(){
      if(gInGame && HealthMeter.value >= .1 && !hpBarGoing){
        hpBarGoing = true
        if(hpOn) effects.push(new healthBar())
      } else if (!gInGame || downedGoing) hpBarGoing = false

      if(gInGame && HealthMeter.value <= .25 && HealthMeter.value >= .01 && !hpLowGoing && !downedGoing){
        hpLowGoing = true
        if(lowOn) effects.push(new lowHealth())
      } else if ((gInGame && HealthMeter.value > .25) || !gInGame || downedGoing) hpLowGoing = false

      if(gInGame && YellowHealthMeter.value >= .1 && !hpHealGoing){
        hpHealGoing = true
        if(healOn) effects.push(new healthHeal())
      } else if ((gInGame && YellowHealthMeter.value <= .05) || !gInGame) hpHealGoing = false

      if(gInGame && RedHealthMeter.value >= .5 && HealthMeter.value <= .05 && !downedGoing){
        downedGoing = true
        if(downOn) effects.push(new downed())
      } else if ((gInGame && HealthMeter.value >= .1) || !gInGame) downedGoing = false

      if(gInGame && HealthMeter.decreased && HealthMeter.diff > .1 && RedHealthMeter.value >= .05 && !downedGoing && !damageOn) effects.push(new tookDamage(0))
    }

    function healthHeal(){
      this.rot = 0
      this.alpha = 0
      this.draw = function(){
        if(hpHealGoing) this.alpha <= .95 ? this.alpha += .05 : this.rot += .01
        else this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
        DrawRect(0, 0, 320, 200, getColorString(60, 100, 30, this.alpha / 3))
        hiddenCtx.save()
        hiddenCtx.translate(160, 100)
        hiddenCtx.rotate(this.rot)
        hiddenCtx.translate(-160, -100)
        DrawRect(85, 80, 150, 40, getColorString(60, 100, 50, this.alpha))
        DrawRect(140, 25, 40, 150, getColorString(60, 100, 50, this.alpha))
        hiddenCtx.restore()
      }
    }

    function particleOut(x, y, speed, size, hue, sat, lit){
      this.x = x
      this.y = y
      this.vx = Math.random() * speed - speed / 2
      this.vy = Math.random() * speed - speed / 2
      this.size = size
      this.hue = hue
      this.sat = sat
      this.lit = lit
      this.lifetime = 100
      this.draw = function(){
        DrawCircle(this.x, this.y, this.size, getColorString(this.hue, this.sat, this.lit, this.lifetime / 100))
        this.x += this.vx
        this.y += this.vy
        this.lifetime -= speed / 8
      }
    }

    function tookDamage(hue){
      this.hue = hue
      this.x = 160
      this.y = 100
      this.vx = Math.random() * 10 - 5
      this.vy = Math.random() * 10 - 5
      this.width = 5
      for(let i = 0; i < 10; i++) effects.push(new particleOut(this.x, this.y, 5, 5, Math.random() * 30, 100, 50))
      this.draw = function(){
        this.x += this.vx
        this.y += this.vy
        if(this.width < 75) {
          this.width *= 1.11
          DrawCircle(this.x, this.y, this.width, getColorString(60, 100, 50, 1))
        } else {
          for(let i = 0; i < 30; i++) effects.push(new particleOut(this.x, this.y, 40, 40, this.hue, 100, 50))
          this.lifetime = 0
        }
      }
    }

    function downed(){
      this.alpha = 0
      this.draw = function(){
        if(downedGoing && gInGame) this.alpha <= .99 ? this.alpha += .01 : this.alpha = 1
        else this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
        if(victoryGoing || defeatGoing || InGameCompassMeter.value <= .05) this.lifetime = 0
        DrawRect(0, 0, 320, 200, getColorString(0, 100, Math.cos(Date.now() / 200) * 30 + 50, this.alpha))
        DrawPath(112, 45, heart, getColorString(0, 100, Math.sin(Date.now() / 200) * 30 + 50, this.alpha), .7, .7)
      }
    }

    let heart = "m84.25,150.73l56.78-50.89s42.67-40.22,13.11-82.67-69.89,9.56-69.89,9.56c0,0-27.67-50.22-69.67-10.22s23.33,93.33,23.33,93.33l46.33,40.89Z"
    function lowHealth(){
      this.alpha = 0
      this.alpha2 = 1
      this.scale = 1
      this.draw = function(){
        let mod = Math.sin(Date.now() / 200) * 30 + 50
        if(hpLowGoing){
          if(mod < 22){
            this.alpha2 = 1
            this.scale = 1
          } else {
            this.alpha2 *= .94
            this.scale *= 1.04
          }
          this.alpha <= .99 ? this.alpha += .01 : this.alpha = 1
        } else {
          this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
          if(this.alpha2 >= .05) this.alpha2 -= .05
        }
        DrawPath(109, 45, heart, getColorString(0, 100, mod, this.alpha), .7, .7)
        hiddenCtx.save()
        hiddenCtx.translate(160, 100)
        hiddenCtx.scale(this.scale, this.scale)
        hiddenCtx.translate(-160, -100)
        DrawPath(109, 45, heart, getColorString(0, 100, mod, this.alpha2), .7, .7)
        hiddenCtx.restore()
      }
    }

    function healthBar(){
      this.val = 0
      this.draw = function(){
        this.val += (HealthMeter.value - this.val) / 20
        DrawRect(hpX * 3.2, hpY * 2, this.val * hpWidth * 3.2, hpHeight * 2, "red")
        DrawCircle(hpX * 3.2 + this.val * hpWidth * 3.2, hpY * 2 + hpHeight, hpHeight, "red")
        if(!hpBarGoing || !hpOn) this.val > .05 ? this.val *= .95 : this.lifetime = 0
      }
    }

    let shieldBarGoing = false
    let shieldHealGoing = false
    function shieldCallback(){
      if(gInGame && ShieldMeter.value >= .1 && !shieldBarGoing){
        shieldBarGoing = true
        if(shieldOn) effects.push(new shieldBar())
      } else if (!gInGame || downedGoing) shieldBarGoing = false

      if(gInGame && YellowShieldMeter.value >= .1 && !shieldHealGoing){
        shieldHealGoing = true
        if(healOn) effects.push(new shieldHeal())
      } else if ((gInGame && YellowShieldMeter.value <= .05) || !gInGame) shieldHealGoing = false

      if(gInGame && ShieldMeter.decreased && ShieldMeter.diff > .1 && RedShieldMeter.value >= .05 && !damageOn) effects.push(new tookDamage(200))
    }

    function shieldHeal(){
      this.rot = 0
      this.alpha = 0
      this.draw = function(){
        if(shieldHealGoing) this.alpha <= .95 ? this.alpha += .05 : this.rot += .01
        else this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
        DrawRect(0, 0, 320, 200, getColorString(60, 100, 30, this.alpha / 3))
        hiddenCtx.save()
        hiddenCtx.translate(160, 100)
        hiddenCtx.rotate(this.rot)
        hiddenCtx.translate(-160, -100)
        DrawRect(85, 80, 150, 40, getColorString(60, 100, 50, this.alpha))
        DrawRect(140, 25, 40, 150, getColorString(60, 100, 50, this.alpha))
        hiddenCtx.restore()
      }
    }

    function shieldBar(){
      this.val = 0
      this.draw = function(){
        this.val += (ShieldMeter.value - this.val) / 20
        DrawRect(shieldX * 3.2, shieldY * 2, this.val * shieldWidth * 3.2, shieldHeight * 2, getColorString(200, 100, 45, 1))
        DrawCircle(shieldX * 3.2 + this.val * shieldWidth * 3.2, shieldY * 2 + shieldHeight, shieldHeight, getColorString(200, 100, 45, 1))
        if(!shieldBarGoing || !shieldOn) this.val > .05 ? this.val *= .95 : this.lifetime = 0
      }
    }

    let sprintGoing = false
    function sprintCallback(){
      if(gInGame && Sprint1Meter.value >= .95 && Sprint2Meter.value >= .95 && engine.vision.sprintNotGrey <= .05 && !sprintGoing){
        sprintGoing = true
        if(sprintOn) effects.push(new sprinting())
      } else if ((gInGame && Sprint1Meter.value <= .05 && Sprint2Meter.value <= .05) || !gInGame) sprintGoing = false
    }

    function sprinting(){
      this.alpha = 0
      this.draw = function(){
        if(sprintGoing) this.alpha <= .95 ? this.alpha += .05 : this.alpha = 1
        else this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
        let grad = ctx.createRadialGradient(160, 100, 10, 160, 100, 200)
        grad.addColorStop(0, getColorString(SprintValueMeter.value * 120, 100, 50, this.alpha * (Math.sin(Date.now() / (100 + 500 * SprintValueMeter.value)) * .01 + .03)))
        grad.addColorStop(1, getColorString(SprintValueMeter.value * 120, 100, 50, this.alpha * (Math.sin(Date.now() / (100 + 500 * SprintValueMeter.value)) * .1 + .2)))
        DrawRect(0, 0, 320, 200, grad)
      }
    }

    let encumberedGoing = false
    function encumberedCallback(){
      if(gInGame && EnRedMeter.value >= .95 && EnBlackMeter.value >= .95 && !encumberedGoing){
        encumberedGoing = true
        if(enOn) effects.push(new encumbered())
      } else if ((gInGame && EnRedMeter.value <= .05 && EnBlackMeter.value <= .05) || !gInGame) encumberedGoing = false
    }

    function encumbered(){
      this.count = 0
      this.count2 = 0
      this.y = -450
      this.alpha = 0
      this.draw = function(){
        if(encumberedGoing) this.alpha <= .95 ? this.alpha += .05 : this.alpha = 1
        else this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
        DrawRect(0, this.y, 320, 200, getColorString(0, 100, 50, this.alpha * (Math.sin(Date.now() / 1000) * .15 + .16)))
        if(this.y < 0) this.y += 2
        if(!this.count && this.count2 < 6){
          effects.push(new enHelp(getColorString(0, 100, this.count2 * 10, .9), 50, 2))
          this.count2++
        }
        this.count < 24 ? this.count++ : this.count = 0
      }
    }

    function enHelp(color, width, speed){
      this.x = 160
      this.y = 0
      this.speed = speed
      this.color = color
      this.width = width
      this.draw = function(){
        hiddenCtx.beginPath()
        hiddenCtx.moveTo(this.x - 180, this.y - 50)
        hiddenCtx.lineTo(this.x, this.y)
        hiddenCtx.lineTo(this.x + 180, this.y - 50)
        hiddenCtx.lineWidth = this.width
        hiddenCtx.strokeStyle = this.color
        hiddenCtx.stroke()
        this.y < 300 ? this.y += this.speed : this.lifetime = 0
      }
    }

    let xpGoing = false
    function xpCallback(){
      if(gInGame && XPYellowMeter.value >= .95 && XPBlackMeter.value >= .25 && !xpGoing){
        xpGoing = true
        if(xpOn) effects.push(new xpGain())
      } else if ((gInGame && XPYellowMeter.value <= .05 && XPBlackMeter.value <= .05) || !gInGame) xpGoing = false
    }

    function xpGain(){
      this.width = 0
      this.x = 0

      const center = (min + max) / 2;
      const range = (max - min) / 2;

      // Average multiple random values to create center bias
      const r = (Math.random() + Math.random()) / 2;

      return center + (r - 0.5) * 2 * range;
    }

        audioEase.sat += (targetDensity - audioEase.sat) / 10;
        audioEase.lit += (targetDensity - audioEase.lit) / 10;

            updateAudioEase();
        }

        const satMultiplier = audioEase.sat / 200 + 0.5
        const litMultiplier = audioEase.lit / 100

        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const x = col * width
            const y = row * height
            
            hiddenCtx.fillStyle = getColorString(
                hue[iZone],
                sat[iZone] * satMultiplier,
                lightness[iZone] * litMultiplier,
                alpha
            )
            hiddenCtx.fillRect(x, y, width, height)
        }
    }
  
    function copyScreen(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat = new Int8Array(engine.zone.saturation)
        const hue = new Int16Array(engine.zone.hue)
        
        const width = 320 / ZONE_COLS
        const height = 200 / ZONE_ROWS
        
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const x = col * width
            const y = row * height
            
            const finalHue = backgroundMode === "Custom Ambience" 
                ? proBack[0] 
                : hue[iZone] + (backgroundMode === "Color Cycle Ambience" ? gCycle : 0)
            
            hiddenCtx.fillStyle = getColorString(
                finalHue,
                sat[iZone],
                lightness[iZone],
                alpha
            )
            hiddenCtx.fillRect(x, y, width, height)
        }
    }
    //#endregion
    //#region Helper Functions
  function DrawArc(x, y, start, end, radius, direction, color){
    hiddenCtx.beginPath()
    hiddenCtx.arc(x, y, radius, start, end, direction)
    hiddenCtx.fillStyle = color
    hiddenCtx.fill()
  }

  function DrawLine(start, end, color, stroke){
    hiddenCtx.beginPath()
    hiddenCtx.moveTo(start[0], start[1])
    hiddenCtx.lineTo(end[0], end[1])
    hiddenCtx.strokeStyle = color
    hiddenCtx.lineWidth = stroke
    hiddenCtx.stroke()
  }

  function DrawEllipse(x, y, width, height, rotation, color){
    hiddenCtx.beginPath()
    hiddenCtx.ellipse(x, y, width, height, rotation, 0, Math.PI * 2)
    hiddenCtx.fillStyle = color
    hiddenCtx.fill()
  }

  function DrawPath(x, y, path, color, scaleX, scaleY) {
    hiddenCtx.fillStyle = color;
    hiddenCtx.save();
    hiddenCtx.translate(x, y);
    hiddenCtx.scale(scaleX, scaleY)
    let ex = new Path2D(path);
    hiddenCtx.fill(ex);
    hiddenCtx.restore();
  };

  function DrawTriangle(cord1X, cord1Y, cord2X, cord2Y, cord3X, cord3Y, color) {
    hiddenCtx.beginPath();
    hiddenCtx.fillStyle = color;
    hiddenCtx.moveTo(cord1X, cord1Y);
    hiddenCtx.lineTo(cord2X, cord2Y);
    hiddenCtx.lineTo(cord3X, cord3Y);
    hiddenCtx.lineTo(cord1X, cord1Y);
    hiddenCtx.fill();
  };

  function DrawCircle(x, y, radius, color) {
    hiddenCtx.beginPath();
    hiddenCtx.fillStyle = color;
    hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
    hiddenCtx.fill();
  };

  function DrawStroke(x, y, radius, color, stroke) {
    hiddenCtx.beginPath();
    hiddenCtx.strokeStyle = color;
    hiddenCtx.lineWidth = stroke;
    hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
    hiddenCtx.stroke();
  };

  function DrawRect(x, y, width, height, color) {
    hiddenCtx.beginPath();
    hiddenCtx.fillStyle = color;
    hiddenCtx.fillRect(x, y, width, height);
  };

  function strokeRect(x, y, width, height, color, stroke){
    hiddenCtx.beginPath();
    hiddenCtx.strokeStyle = color;
    hiddenCtx.lineWidth = stroke
    hiddenCtx.rect(x, y, width, height);
    hiddenCtx.stroke()
  }

  function hexToHSL(hex) {
      const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || [];
      const rgb = [r, g, b].map(x => parseInt(x, 16) / 255);
      const max = Math.max(...rgb);
      const min = Math.min(...rgb);
      const l = (max + min) / 2;
      
      if (max === min) return [0, 0, Math.round(l * 100)];
      
      const d = max - min;
      const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      
      let h;
      const [nr, ng, nb] = rgb;
      if (max === nr) h = (ng - nb) / d + (ng < nb ? 6 : 0);
      else if (max === ng) h = (nb - nr) / d + 2;
      else h = (nr - ng) / d + 4;
      
      return [
        Math.round(h * 60),
        Math.round(s * 100),
        Math.round(l * 100)
      ];
    }
  
  function Meter(size, callback) {
    this.size = size;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    var values = [];
    var stabilizedValue = null;

    this.setValue = function (updatedValue) {
      values.push(updatedValue);
      if (values.length > this.size) {
        values.shift();
      }

      // Only check for stability if we have enough values
      if (values.length < this.size) return;

      // Early exit if the new value differs from the last stabilized value
      if (stabilizedValue !== null && updatedValue !== stabilizedValue) {
        stabilizedValue = null;
        return;
      }

      // Check if all values are the same (only if we don't already know they are)
      if (stabilizedValue === null) {
        var firstValue = values[0];
        for (var i = 1; i < values.length; i++) {
          if (values[i] !== firstValue) return;
        }
        stabilizedValue = firstValue;
      }

      // Only trigger callback if value actually changed
      if (this.value !== stabilizedValue) {
        this.diff = Math.abs(this.value - stabilizedValue);
        this.increased = this.value < stabilizedValue;
        this.decreased = this.value > stabilizedValue;
        this.value = stabilizedValue;
        callback();
      }
    }
  }

  window.requestAnimationFrame(update);
</script>
