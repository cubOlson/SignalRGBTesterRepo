<body style="margin: 0; padding: 0; background: #000;">
  <canvas id="exCanvas" width="320" height="200"></canvas>
</body>

<script>
  var canvas, ctx;
  canvas = document.getElementById('exCanvas');
  ctx = canvas.getContext('2d');
  var width = 320;
  var height = 200;
  var hiddenCanvas = document.createElement("canvas");
  hiddenCanvas.width = width;
  hiddenCanvas.height = height;
  var hctx = hiddenCanvas.getContext("2d");
  var effects = [];

  let gInGame = false
  let gInHUD = false
  let gAlpha = 1

  let InGame1Meter = new Meter(5, inGameCallback)
  let InGame2Meter = new Meter(5, inGameCallback)

  let ShieldMeter = new Meter(5, ()=>"")
  let ShieldRedMeter = new Meter(2, damageCallback)

  let HealthMeter = new Meter(5, ()=>"")
  let HealthRedMeter = new Meter(2, damageCallback)

  let HungerMeter = new Meter(5, hungerCallback)

  let HUDCheckMeter = new Meter(10, hudCallback)

  let DaySunMeter = new Meter(10, timeCallback)
  let TimeYellowMeter = new Meter(5, timeCallback)

  let PalBlueMeter = new Meter(5, palCallback)
  let PalRedMeter = new Meter(5, palCallback)

  let SphereColorMeter = new Meter(6, sphereCallback)
  let SphereConfirmMeter = new Meter(5, sphereCallback)

  let LevelUpMeter = new Meter(10, levelUpCallback)

  let BaseWhiteMeter = new Meter(10, baseCallback)
  let BaseGreyMeter = new Meter(10, baseCallback)

  let DeathRedMeter = new Meter(10, deathCallback)
  let DeathBlackMeter = new Meter(10, deathCallback)

  let BossRedMeter = new Meter(10, bossCallback)

  let CaptureBlueMeter = new Meter(2, captureCallback)
  let CaptureWhiteMeter = new Meter(10, captureCallback)

  function update() {
    hctx.clearRect(0, 0, hiddenCanvas.width, hiddenCanvas.height);
    hctx.fillStyle = `hsla(0, 0%, 0%, ${gAlpha})`;
    hctx.fillRect(0, 0, 320, 200);

    backgroundHandler()

    InGame1Meter.setValue(engine.vision.inGameCompassWhite)
    InGame2Meter.setValue(engine.vision.inGameCompassLong)
    ShieldMeter.setValue(engine.vision.shield)
    ShieldRedMeter.setValue(engine.vision.shieldRed1 + engine.vision.shieldRed2)
    HealthMeter.setValue(engine.vision.health)
    HealthRedMeter.setValue(engine.vision.healthRed1 + engine.vision.healthRed2)
    HungerMeter.setValue(engine.vision.hunger)
    HUDCheckMeter.setValue(engine.vision.hungerWhite + engine.vision.healthWhite)
    DaySunMeter.setValue(engine.vision.dayTimeWhite)
    TimeYellowMeter.setValue(engine.vision.timeYellow)
    PalBlueMeter.setValue(engine.vision.palBlue)
    PalRedMeter.setValue(engine.vision.palRed1 + engine.vision.palRed2)
    LevelUpMeter.setValue(engine.vision.levelUp)
    BaseWhiteMeter.setValue(engine.vision.baseWhite)
    BaseGreyMeter.setValue(engine.vision.baseGrey)
    BossRedMeter.setValue(engine.vision.bossRed)
    CaptureBlueMeter.setValue(engine.vision.captureBlue)
    CaptureWhiteMeter.setValue(engine.vision.captureWhite0 + engine.vision.captureWhite1)
    DeathRedMeter.setValue(engine.vision.deathRed1 + engine.vision.deathRed2)
    DeathBlackMeter.setValue(engine.vision.deathBlack)
    SphereColorMeter.setValue(engine.vision.palSphereColor[0])
    SphereConfirmMeter.setValue(engine.vision.palSphereConfirm)


    //Effect handler 
    for (let i = 0; i < effects.length; i++) {
      effects[i].draw(hctx);
    }
    // Remove dead effects with filter
    effects = effects.filter(ele =>
      ele.lifetime === undefined || ele.lifetime > 0
    );

    drawHUD()
    ctx.clearRect(0, 0, width, height);
    ctx.drawImage(hiddenCanvas, 0, 0);

    window.requestAnimationFrame(update);
  };

  let proBack = []
    function onbackColorChanged(){
      proBack = hexToHSL(backColor)
    }

    let backgroundEaseHue = 0;
    let backgroundEaseLit = 0;
    let backgroundEaseSat = 0
    let gCycle = 0
    function backgroundHandler(){
        switch(backgroundMode){
            case "Color Cycle": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Color Cycle Ambience": 
            copyScreen(ambienceAlpha / 100)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Custom": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            break;
            case "Ambience": 
            copyScreen(ambienceAlpha / 100,hctx)
            break;
            case "Custom Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Ambience Audio Visualizer": 
            copyScreenAudio(ambienceAlpha / 100)
            break;
            case "Custom Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
            case "Color Cycle Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
        }
    }

    let audioScreenSat = 0
    let audioScreenLit = 0
    function copyScreenAudio(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      audioScreenSat += (engine.audio.density * 100 - audioScreenSat) / 10
      audioScreenLit += (engine.audio.density * 100 - audioScreenLit) / 10
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        hctx.fillStyle = `hsla(${hue[iZone]}, ${sat[iZone] * (audioScreenSat / 200 + .5)}%, ${lightness[iZone] * (audioScreenLit / 100)}%, ${alpha})`;
        hctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }
  
    function copyScreen(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        hctx.fillStyle = `hsla(${(backgroundMode == "Custom Ambience" ? proBack[0] : hue[iZone] + gCycle * (backgroundMode == "Color Cycle Ambience"))}, ${sat[iZone]}%, ${lightness[iZone]}%, ${alpha})`;
        hctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }
  
  function inGameCallback(){
      if(InGame1Meter.value >= .95 && InGame2Meter.value >= .95 && engine.vision.inGameCompassNotWhite <= .1){
        gInGame = true
      } 
      else if (InGame1Meter.value <= .25 && InGame2Meter.value <= .25){
        gInGame = false
      } 
  }

  let hudSphere = false
  function hudCallback(){
    if(gInGame && HUDCheckMeter.value >= 1.9) {
      gInHUD = true
      levelUpCallback()
      if(!hudSphere && engine.vision.palSphereConfirm >= .95 && engine.vision.palSphereNotColor <= .05) {
        if(palOn) effects.push(new palSphereColor())
        hudSphere = true
      }
    } else if (!gInGame || HUDCheckMeter.value < .25) {
      gInHUD = false
      hudSphere = false
    }
  }

  let timeGoing = false
  function timeCallback(){
    if(gInGame && gInHUD && DaySunMeter.value >= .95 && TimeYellowMeter.value >=.95 && !timeGoing){
      timeGoing = true
      if(timeOn) effects.push(new daytime())
    }
    if(gInGame && gInHUD && DaySunMeter.value < .95 && DaySunMeter.value > .15 && TimeYellowMeter.value >=.95 && !timeGoing){
      timeGoing = true
      if(timeOn) effects.push(new nighttime())
    }
  }

  function damageCallback(){
    if(gInGame && gInHUD && HealthMeter.value > .01 && HealthRedMeter.value >= .05 && HealthRedMeter.diff >= .05) effects.push(new streakDown())
    if(gInGame && gInHUD && ShieldMeter.value > .01 && ShieldRedMeter.value >= .05 && ShieldRedMeter.diff >= .05) effects.push(new streakDown())
  }

  let palGoing = false
  let deadPalGoing = false
  function palCallback(){
    if(gInGame && gInHUD && PalBlueMeter.value >= .95 && !palGoing) {
      if(palOn) effects.push(new palOut())
      palGoing = true
    }
    if(gInGame && gInHUD && PalBlueMeter.value <= .05 && palGoing) palGoing = false
    if(gInGame && gInHUD && PalRedMeter.value >= .95 && !deadPalGoing) {
      if(palOn) effects.push(new palDied())
      deadPalGoing = true
    }
    if(gInGame && gInHUD && PalRedMeter.value <= .05 && deadPalGoing) deadPalGoing = false
  }

  function sphereCallback(){
    if(gInGame && gInHUD && SphereColorMeter.diff > 20 && SphereConfirmMeter.value >= .95 && engine.vision.palSphereNotColor <= .05) if(palOn) effects.push(new palSphereColor())
  }

  let levelGoing = false
  function levelUpCallback(){
    if(gInGame && LevelUpMeter.value >= .95 && engine.vision.levelUpNotBlue <= .05 && !levelGoing){
      levelGoing = true
      if(levelOn) effects.push(new skillPoints())
    }
  }

  let hungerGoing = false
  function hungerCallback(){
    if(gInGame && gInHUD && HungerMeter.value <= .3 && !hungerGoing){
      hungerGoing = true
      if(hungerOn) effects.push(new hungry())
    }
  }

  let baseGoing = false
  function baseCallback(){
    if(gInGame && BaseGreyMeter.value >= .95 && BaseWhiteMeter.value >= .95 && !baseGoing){
      baseGoing = true
      if(baseOn) effects.push(new inBase())
    }
    if(gInGame && BaseGreyMeter.value <= .05 && BaseWhiteMeter.value <= .05) baseGoing = false
  }

  let deathGoing = false
  function deathCallback(){
    if(!gInGame && DeathBlackMeter.value >= .95 && DeathRedMeter.value >= .95 && !deathGoing){
      deathGoing = true
      if(deathOn) effects.push(new playerDeath())
    }
  }

  let bossGoing = false
  function bossCallback(){
    if(gInGame && BossRedMeter.value >= .95 && engine.vision.bossNotRed <.1 && !bossGoing){
      bossGoing = true
      if(bossOn) effects.push(new bossBattle())
    }
  }

  let captureGoing = false
  function captureCallback(){
    if(gInGame && CaptureBlueMeter.value >= .05 && CaptureWhiteMeter.value >= .95 && !captureGoing && engine.vision.captureNotWhite < .1){
      captureGoing = true
      if(palOn) effects.push(new palCaptured())
    }
    if(gInGame && CaptureBlueMeter.value < .1 && CaptureWhiteMeter.value < .1) captureGoing = false
  }

  function palCaptured(){
      this.alpha = 0
      this.rot = 0
      this.hue = 0
      this.target = 0
      this.count = 1
      this.draw = function(){
          DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${this.alpha})`)
          if(this.alpha < .75) this.alpha += .025
          this.hue = this.rot / Math.PI * 2 * 40
          hctx.beginPath()
          hctx.moveTo(160, 100)
          hctx.lineTo(320, 100)
          hctx.arc(160, 100, 200, 0, this.rot)
          hctx.fillStyle = `hsl(${this.hue}, 100%, 50%)`
          hctx.fill()
          if(this.rot < this.target) this.rot += (this.target - this.rot) / 10
          if(this.count == 0) this.target += Math.PI / 2
          this.count < 50 ? this.count++ : this.count = 0
          if(this.rot > Math.PI * 2) {
              this.lifetime = 0
              effects.push(new captureHelp(190))
          }
      }
  }

  function bossBattle(){
    this.effects = []
    this.count = 0
    this.lifetime = 1
    this.draw = function(){
      this.value = 100 - BossRedMeter.value * 100
      if(this.count == 0) this.effects.push(new bossParticle(this.value))
      this.count < 10 - this.value / 10 ? this.count++ : this.count = 0
      for (let i = 0; i < this.effects.length; i++) {
        this.effects[i].draw()
      }
   
      this.effects = this.effects.filter(ele => ele.lifetime === undefined || ele.lifetime > 0)
    if(!gInGame || BossRedMeter.value <= .1) this.lifetime = 0
    }
  }

  function bossParticle(val){
    this.val = val
    this.x = Math.random() * 320
    this.y = 230
    this.rad = 10
    this.mod = 20 - Math.random() * 40
    this.lifetime = 1
    this.draw = function(){
      this.y > 0 ? this.y -= this.val / 20 + 2 : this.lifetime = 0
      DrawCircle(this.x, this.y, this.rad + this.y / 5, `hsl(${190 + this.val * 1.7}, 100%, ${20 + this.mod}%)`)
    }
  }

  function playerDeath(){
      this.rot = 0
      this.length = 0
      this.mod = 0
      this.height = 0
      this.draw = function(){
        DrawRect(0, 0, 320, 200, `hsla(0, 100%, 50%, ${this.scale / 20})`)
        if(this.rot) {
          this.mod += (50 - this.mod) / 20
          DrawRect(0, 0, 320, this.height, `hsla(0, 100%, ${Math.sin(Date.now() / 1000) * 10 + 10}%, .5)`)
          this.height < 200 ? this.height++ : this.height = 200
        }
        hctx.save()
        hctx.translate(160, 175)
        hctx.rotate(-this.rot)
        hctx.translate(-160 - this.mod, -185)
        DrawCircle(133, 100, 30, "red")
        DrawTriangle(107, 113, 160, 113, 160, 175, "red")
        hctx.restore()
        hctx.save()
        hctx.translate(160, 175)
        hctx.rotate(this.rot)
        hctx.translate(-160 + this.mod, -185)
        DrawCircle(187, 100, 30, "red")
        DrawTriangle(160, 113, 213, 113, 160, 175, "red")
        hctx.restore()
        DrawLine([160, 0], [160, this.length * 4], `hsla(60, 100%, 60%, ${1 - ((this.length - 75) / 25)})`, this.length / 2)
        this.length < 100 ? this.length+=4 : this.rot < .15 ? this.rot += .05 : this.rot = .15
        if(gInGame || (DeathBlackMeter.value <= .05 && DeathRedMeter.value <= .05)) {
          this.lifetime = 0
          deathGoing = false
        }
      }
  }

  function inBase(){
    this.lifetime = 100
    this.draw = function(){
      this.globalAlpha = this.lifetime / 100 
      DrawRect(0, 0, 320, 200, `hsla(120, 100%, 30%, ${Math.sin(Date.now() / 1000) * .15 + .25})`)
      this.globalAlpha = 1
      this.lifetime--
    }
  }

  function hungry(){
    this.grad = hctx.createLinearGradient(160, 0, 160, 200)
    this.grad.addColorStop(0, "yellow")
    this.grad.addColorStop(1, "red")
    this.draw = function(){
      hctx.globalAlpha = Math.sin(Date.now() / 1000) * .25 + .35
      DrawRect(0, 0, 320, 200, this.grad)
      hctx.globalAlpha = 1
      if(!gInGame || !gInHUD || HungerMeter.value > .3) {
        this.lifetime = 0
        hungerGoing = false
      }
    }
  }

  function captureHelp(hue){
      this.rad = 1
      this.hue = hue
      this.draw = function(){
          DrawStroke(160, 100, this.rad, `hsl(${this.hue}, 100%, 50%)`, 70)
          this.rad < 200 ? this.rad += 5 : this.lifetime = 0
      }
  }

  function skillPoints(){
      this.rad = 1
      gAlpha = .1
      effects.push(new captureHelp(60))
      this.draw = function(){
          DrawStroke(160, 100, this.rad, `hsla(60, 100%, 50%, .25)`, 40)
          this.rad = Math.sin(Date.now() / 2000) * 100 + 101
          if(!gInGame || LevelUpMeter.value <= .05) {
            this.lifetime = 0
            levelGoing = false
            gAlpha = 1
          }
      }
  }

  function palDied(){
      this.x = 0
      this.x1 = 320
      this.index = 0
      this.rad = 1
      this.alpha = 1
      this.count = 0
      this.draw = function(){
          hctx.globalAlpha = this.alpha
          DrawLine([this.x, 0], [this.x + 320 / 40 * this.index, 5 * this.index], "red", 20)
          DrawLine([this.x1, 0], [this.x1 - 320 / 40 * this.index, 5 * this.index], "red", 20)
          this.index < 40 ? this.index+=2 : this.count < 15 ? this.count ++ : this.done = true
          if(this.done){
              DrawCircle(160, 100, this.rad, "red")
              this.rad < 200 ? this.rad += 5 : this.lifetime = 0
              this.alpha = 1.01 - this.rad / 200
          }
      }
  }

  function palOut(){
      this.rad = 200
      this.draw = function(){
          if(!this.done) {
              this.rad > 10 ? this.rad -= 5 : this.done = true
              DrawStroke(160, 100, this.rad, `hsl(240, 100%, ${this.rad / 4 + 40}%)`, 50)
          } else {
               this.rad < 300 ? this.rad += 5 : this.lifetime = 0
               DrawCircle(160, 100, this.rad, `hsla(240, 100%, 50%, ${1 - this.rad / 310})`)
          }
      }
  }

  function streakDown(){
      this.y = 0
      this.height = 75
      gAlpha = .25
      this.draw = function(){
          DrawRect(0, this.y, 320, - this.height, "red")
          DrawRect(0, this.y - this.height * 1.25, 320, -this.height / 1.5, "red")
          DrawRect(0, this.y - this.height * 2.25, 320, -this.height / 2, "red")
          this.y < 400 ? this.y+=8 : this.lifetime = 0
          if(this.lifetime == 0) gAlpha = 1
      }
  }

  function nighttime(){
      this.alpha = 0
      this.done = false
      this.rot = 0
      this.hue = 280
      this.lit = 0
      this.count = 50
      gAlpha = .25
      this.draw = function(){
          this.grad = hctx.createRadialGradient(60, 200, 10, 60, 200, 300)
          this.grad.addColorStop(0, `hsla(${this.hue + 10}, 100%, ${this.lit / 3}%, 1)`)
          this.grad.addColorStop(1, `hsla(${this.hue + 10}, 100%, ${this.lit / 3}%, 0)`)
          hctx.globalAlpha = this.alpha
          hctx.save()
          hctx.translate(160, 200)
          hctx.rotate(this.rot)
          hctx.translate(-160, -200)
          if(!this.done) this.alpha < 1 ? this.alpha += .025 : this.done = true
          DrawCircle(60, 200, 300, this.grad)
          DrawCircle(60, 200, 60, `hsl(${this.hue}, 100%, ${this.lit}%)`)
          DrawCircle(60, 180, 45, `hsla(${this.hue + 10}, 100%, ${this.lit / 3}%, 1)`)
          hctx.restore()
          hctx.globalAlpha = 1
          this.rot < Math.PI / 2 ? this.rot+=.005 : this.count > 0 ? this.count-- : this.alpha >= .01 ? this.alpha -= .01 : this.lifetime = 0
          if(this.hue > 220) this.hue -= .5
          if(this.lit < 75) this.lit+=.5
          if(this.lifetime == 0) {
            timeGoing = false
            gAlpha = 1
          }
      }
  }

  function daytime(){
      this.alpha = 0
      this.done = false
      this.rot = 0
      this.hue = 0
      this.lit = 10
      this.count = 50
      gAlpha = .25
      this.draw = function(){
          this.grad = hctx.createRadialGradient(60, 200, 10, 60, 200, 300)
          this.grad.addColorStop(0, `hsla(${this.hue - 10}, 100%, ${this.lit / 3}%, 1)`)
          this.grad.addColorStop(1, `hsla(${this.hue - 10}, 100%, ${this.lit / 3}%, 0)`)
          hctx.globalAlpha = this.alpha
          hctx.save()
          hctx.translate(160, 200)
          hctx.rotate(this.rot)
          hctx.translate(-160, -200)
          if(!this.done) this.alpha < 1 ? this.alpha += .025 : this.done = true
          DrawCircle(60, 200, 300, this.grad)
          DrawCircle(60, 200, 60, `hsl(${this.hue}, 100%, ${this.lit}%)`)
          hctx.restore()
          hctx.globalAlpha = 1
          this.rot < Math.PI / 2 ? this.rot+=.005 : this.count > 0 ? this.count-- : this.alpha >= .01 ? this.alpha -= .01 : this.lifetime = 0
          if(this.hue < 60) this.hue+= .5
          if(this.lit < 75) this.lit+=.5
          if(this.lifetime == 0) {
            timeGoing = false
            gAlpha = 1
          }
      }
  }

  function palSphereColor(){
      this.alpha = 0
      this.count = 0
      this.color = engine.vision.palSphereColor[0]
      this.draw = function(){
          hctx.globalAlpha = this.alpha
          DrawRect(0, 0, 320, 200, `hsl(${this.color}, 100%, 50%)`)
          hctx.globalAlpha = 1
          if(this.count % 2 == 0) this.alpha < .5 ? this.alpha += .025 : this.count++
          else this.alpha >= .025 ? this.alpha -= .025 : this.count++
          if(this.count > 3) this.lifetime = 0
      }
  }

  let designatedHealthSize = 0
  let designatedShieldSize = 0
  let designatedHungerSize = 0
  let currentHealthSize = 0
  let currentShieldSize = 0
  let currentHungerSize = 0
  function drawHUD() {
    let hpColor = hexToHSL(healthColor)
    let shColor = hexToHSL(shieldColor)
    let huColor = hexToHSL(hungerColor)
    designatedHealthSize = gInHUD? HealthMeter.value : 0;
    designatedShieldSize = gInHUD? ShieldMeter.value : 0;
    designatedHungerSize = gInHUD? HungerMeter.value : 0;
    currentHealthSize = lerp(currentHealthSize, designatedHealthSize, 0.05);
    currentShieldSize = lerp(currentShieldSize, designatedShieldSize, 0.05);
    currentHungerSize = lerp(currentHungerSize, designatedHungerSize, 0.05);
    let healthString = `hsl(${hpColor[0]}, ${hpColor[1]}%, ${hpColor[2]}%)`
    let shieldString = `hsl(${shColor[0]}, ${shColor[1]}%, ${shColor[2]}%)`
    let hungerString = `hsl(${huColor[0]}, ${huColor[1]}%, ${huColor[2]}%)`
    if (shieldHUDOn){
      if(blackToggle) DrawRect(shieldX * 3.2, shieldY * 2, shieldWidth * 3.2, shieldHeight * 2, "black");
      DrawRect(shieldX * 3.2, shieldY * 2, adjToggle ? shieldWidth * 3.2 : currentShieldSize * shieldWidth * 3.2, shieldHeight * 2, shieldString);
    }
    if (healthHUDOn){
      if(blackToggle) DrawRect(healthX * 3.2, healthY * 2, healthWidth * 3.2, healthHeight * 2, "black");
      DrawRect(healthX * 3.2, healthY * 2, adjToggle ? healthWidth * 3.2 : currentHealthSize * healthWidth * 3.2, healthHeight * 2, healthString);
    }
    
    if (hungerHUDOn){
      if(blackToggle) DrawRect(hungerX * 3.2, hungerY * 2, hungerWidth * 3.2, hungerHeight * 2, "black");
      DrawRect(hungerX * 3.2, hungerY * 2, adjToggle ? hungerWidth * 3.2 : currentHungerSize * hungerWidth * 3.2, hungerHeight * 2, hungerString);
    }
  }

function lerp(a, b, speed) {
  return a + speed * (b - a)
}

  function exampleSquare(color){
    this.lifetime = 100
    this.color = color
    this.draw = function(){
      DrawRect(0, 0, 320, 200, this.color)
      this.lifetime--
      if(this.lifetime <= 0){
        timeGoing = false
        palGoing = false
      }
    }
  }

  function DrawArc(x, y, start, end, radius, direction, color){
    hctx.beginPath()
    hctx.arc(x, y, radius, start, end, direction)
    hctx.fillStyle = color
    hctx.fill()
  }

  function DrawLine(start, end, color, stroke){
    hctx.beginPath()
    hctx.moveTo(start[0], start[1])
    hctx.lineTo(end[0], end[1])
    hctx.strokeStyle = color
    hctx.lineWidth = stroke
    hctx.stroke()
  }

  function DrawEllipse(x, y, width, height, rotation, color){
    hctx.beginPath()
    hctx.ellipse(x, y, width, height, rotation, 0, Math.PI * 2)
    hctx.fillStyle = color
    hctx.fill()
  }

  function DrawLightning(array, color, width){
      hctx.beginPath()
      hctx.moveTo(...array[0])
      array.forEach((ele, i)=>{
        if(i){
          hctx.lineTo(...array[i])
        }
      });
      hctx.strokeStyle = color;
      hctx.lineJoin = "round";
      hctx.lineWidth = width + Math.random() * width;
      hctx.stroke()
  }

  function DrawGear(x, y, radius, stroke, teeth, color){
    DrawStroke(x, y, radius, color, stroke)
    for(let i = 0; i < teeth; i++){
      var ix = Math.cos(Math.PI * 2 / teeth * i) * radius + x;
      var iy = Math.sin(Math.PI * 2 / teeth * i) * radius + y;
      var rotate = Math.atan2(y - iy, x - ix) + Math.PI / 2;
      hctx.save()
      hctx.translate(ix, iy)
      hctx.rotate(rotate)
      hctx.translate(-ix, -iy)
      DrawRect(ix, iy, Math.PI * radius * 2 / teeth * .75, radius / 3 + stroke / 2, "orange")
      hctx.restore()
    }
  }

  function DrawPath(x, y, path, color, scaleX, scaleY) {
    hctx.fillStyle = color;
    hctx.save();
    hctx.translate(x, y);
    hctx.scale(scaleX, scaleY)
    let ex = new Path2D(path);
    hctx.fill(ex);
    hctx.restore();
  };

  function DrawTriangle(cord1X, cord1Y, cord2X, cord2Y, cord3X, cord3Y, color) {
    hctx.beginPath();
    hctx.fillStyle = color;
    hctx.moveTo(cord1X, cord1Y);
    hctx.lineTo(cord2X, cord2Y);
    hctx.lineTo(cord3X, cord3Y);
    hctx.lineTo(cord1X, cord1Y);
    hctx.fill();
  };

  function DrawCircle(x, y, radius, color) {
    hctx.beginPath();
    hctx.fillStyle = color;
    hctx.arc(x, y, radius, 0, 2 * Math.PI)
    hctx.fill();
  };

  function DrawStroke(x, y, radius, color, stroke) {
    hctx.beginPath();
    hctx.strokeStyle = color;
    hctx.lineWidth = stroke;
    hctx.arc(x, y, radius, 0, 2 * Math.PI)
    hctx.stroke();
  };

  function DrawRect(x, y, width, height, color) {
    hctx.beginPath();
    hctx.fillStyle = color;
    hctx.fillRect(x, y, width, height);
  };

  function strokeRect(x, y, width, height, color, stroke){
    hctx.beginPath();
    hctx.strokeStyle = color;
    hctx.lineWidth = stroke
    hctx.rect(x, y, width, height);
    hctx.stroke()
  }

  function DrawHex(x, y, color, size) {
    hctx.beginPath();
    for (var i = 0; i < 7; i++) {
      hctx.lineTo(x + size * Math.cos(2 * Math.PI / 6 * i), y + size * 0.9 * Math.sin(2 * Math.PI / 6 * i));
    }
    hctx.fillStyle = color;
    hctx.fill();
    hctx.strokeStyle = "black"
    hctx.stroke()
  };

      function getCubicBezierXYatPercent(startPt, controlPt1, controlPt2, endPt, percent) {
        var x = CubicN(percent, startPt.x, controlPt1.x, controlPt2.x, endPt.x);
        var y = CubicN(percent, startPt.y, controlPt1.y, controlPt2.y, endPt.y);

        return ({ x: x, y: y });
      }

      function CubicN(pct, a, b, c, d) {
        var t2 = pct * pct;
        var t3 = t2 * pct;
        return a + (-a * 3 + pct * (3 * a - a * pct)) * pct
          + (3 * b + pct * (-6 * b + b * 3 * pct)) * pct
          + (c * 3 - c * 3 * pct) * t2
          + d * t3;
      }

  function hexToRgb(hex) {
    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
      r: parseInt(result[1], 16),
      g: parseInt(result[2], 16),
      b: parseInt(result[3], 16)
    } : null;
  }

  function hexToHSL(hex) {
    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);

    var r = parseInt(result[1], 16);
    var g = parseInt(result[2], 16);
    var b = parseInt(result[3], 16);

    (r /= 255), (g /= 255), (b /= 255);
    var max = Math.max(r, g, b),
      min = Math.min(r, g, b);
    var h,
      s,
      l = (max + min) / 2;

    if (max === min) {
      h = s = 0; // achromatic
    } else {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r:
          h = (g - b) / d + (g < b ? 6 : 0);
          break;
        case g:
          h = (b - r) / d + 2;
          break;
        case b:
          h = (r - g) / d + 4;
          break;
      }
      h /= 6;
    }

    s = s * 100;
    s = Math.round(s);
    l = l * 100;
    l = Math.round(l);
    h = Math.round(360 * h);

    return [h, s, l];
  }

  function GetTime() {
    return new Date().getTime()
  }

  function StateHandler() {
    var stack = [];
    var state = null;

    var updateState = function () {
      if (stack.length > 0) {
        state = stack[stack.length - 1];
      } else {
        state = null;
      }
    };

    this.Push = function (newState) {
      stack.push(newState);
      updateState();
    };

    this.Pop = function () {
      stack.pop();
      updateState();
    };

    this.Process = function () {
      if (state != null) {
        state.Process();
      }
    };
  }

  function Meter(size, callback) {
    this.size = size;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    var values = [];

    this.setValue = function (updatedValue) {
      values.push(updatedValue);
      if (values.length > this.size) {
        values.shift();
      }

      for (var i = 0; i < values.length - 1; i++) {
        if (values[i] !== values[i + 1]) return;
      }
      if (this.value !== values[0]) {
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        callback();
      }
    }
  }

  window.requestAnimationFrame(update);
