      <resolution aspect="24:10" x="0.5000" y="0.4181" width="0.0017" height="0.0056" />

<body style="margin: 0; padding: 0; background: #000;">
    <canvas id="exCanvas" width="320" height="200"></canvas>
</body>
  
<script>
    // Canvas initialization
    const canvas = document.getElementById('exCanvas');
    const ctx = canvas.getContext('2d');
    const width = 320;
    const height = 200;
    let effects = [];
    let gSensor = 0;
    let gAlpha = 1

    var inGame = false
    var armorNotGoing = true

    var inGameWhite1Meter = new Meter(10, inGameCallback);
    var inGameWhite2Meter = new Meter(10, inGameCallback);
    var inGameNotWhiteMeter = new Meter(10, inGameCallback);

    var shieldGreenMeter = new Meter(10, shieldCallback);
    var shieldRedMeter = new Meter(10, shieldCallback);

    var healthBlueMeter = new Meter(10, healthCallback);
    var healthRedMeter = new Meter(10, healthCallback);
    var healthCriticalRedMeter = new Meter(10,healthCallback);
    var healthIncreaseWhiteMeter = new Meter(10,healthCallback);
    var healthIncreaseNotWhiteMeter = new Meter(10,healthCallback);

    var armorGreenMeter = new Meter(10,armorCallback);
    var armorNotGreenMeter = new Meter(10,armorCallback);
    var armorIncreaseWhiteMeter = new Meter(10, armorCallback);
    var armorIncreaseNotWhiteMeter = new Meter(10,armorCallback);

    var SigilGreenMeter = new Meter(10, sigilCallback);
    var SigilBlackMeter = new Meter(8, sigilCallback);

    var DeathRedMeter = new Meter(10, deathCallback)

    var lowAmmoRedMeter = new Meter(10, ammoCallback);

    var leaderPurpleMeter = new Meter(10, leaderCallback);
    var leaderRedMeter = new Meter(10,leaderCallback);

    var goldYellowMeter = new Meter(10, goldCallback);
    var goldNotYellowMeter = new Meter(10, goldCallback);

    //#region Update
    function update() {
      DrawRect(0, 0, 320, 200, "black")
      backgroundHandler()
  
      inGameWhite1Meter.setValue(engine.vision.inGameWhite1)
      inGameWhite2Meter.setValue(engine.vision.inGameWhite2)
      inGameNotWhiteMeter.setValue(engine.vision.inGameNotWhite)
      SigilGreenMeter.setValue(engine.vision.sigilGreen)
      SigilBlackMeter.setValue(engine.vision.sigilConfirm)
      DeathRedMeter.setValue(engine.vision.deathRed)

      if(inGame){

        shieldGreenMeter.setValue(engine.vision.shieldGreen)
        shieldRedMeter.setValue(engine.vision.shieldRed)
        
        healthBlueMeter.setValue(engine.vision.healthBlue)
        healthRedMeter.setValue(engine.vision.healthRed)
        healthCriticalRedMeter.setValue(engine.vision.healthCriticalRed)
        healthIncreaseWhiteMeter.setValue(engine.vision.healthIncreaseWhite)
        healthIncreaseNotWhiteMeter.setValue(engine.vision.healthIncreaseNotWhite)

        armorGreenMeter.setValue(engine.vision.armorGreen)
        armorNotGreenMeter.setValue(engine.vision.armorNotGreen)
        armorIncreaseWhiteMeter.setValue(engine.vision.armorIncreaseWhite)
        armorIncreaseNotWhiteMeter.setValue(engine.vision.armorIncreaseNotWhite)
        leaderPurpleMeter.setValue(engine.vision.leaderPurple)
        leaderRedMeter.setValue(engine.vision.leaderRed)
        goldYellowMeter.setValue(engine.vision.goldYellow)
        goldNotYellowMeter.setValue(engine.vision.goldNotYellow)

        lowAmmoRedMeter.setValue(engine.vision.lowAmmoRed)
      }

      effects.forEach((ele, i) => {
        ele.draw()
        if(ele.lifetime <= 0){
          effects.splice(i, 1)
        }
      })

      window.requestAnimationFrame(update);
    };
    //#endregion
    //#region Background Modes
    // Background Configuration
    let proBack = [0, 0, 0];
    function onbackColorChanged() {
        proBack = hexToHSL(backColor);
    }

    // Audio and Color Cycle State
    let audioEase = { sat: 0, lit: 0 };
    let gCycle = 0;
    
    // Background Utility Functions
    function updateAudioEase() {
        const targetDensity = engine.audio.density * 100;
        audioEase.sat += (targetDensity - audioEase.sat) / 10;
        audioEase.lit += (targetDensity - audioEase.lit) / 10;
    }

    function getColorString(hue, sat, lit, alpha) {
        return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`;
    }

    function updateColorCycle() {
        gCycle = (gCycle + 0.5) % 360;
    }

    // Main Background Handler
    function backgroundHandler() {
        const alpha = ambienceAlpha / 100;

        // Handle color cycling first if needed
        if (backgroundMode.includes("Color Cycle")) {
            updateColorCycle();
        }

        // Handle audio processing if needed
        if (backgroundMode.includes("Audio")) {
            updateAudioEase();
        }

        // Render background based on mode
        if (backgroundMode.includes("Ambience")) {
            if (backgroundMode === "Ambience Audio Visualizer") {
                copyScreenAudio(alpha);
            } else {
                copyScreen(alpha);
            }
            return;
        }

        // Handle custom and cycle modes
        const hue = proBack[0] + (backgroundMode.includes("Color Cycle") ? gCycle : 0);
        const sat = backgroundMode.includes("Audio") ? audioEase.sat * 0.33 + 66 : proBack[1];
        const lit = backgroundMode.includes("Audio") ? audioEase.lit * 0.9 + 10 : proBack[2];
        
        DrawRect(0, 0, 320, 200, getColorString(hue, sat, lit, alpha));
    }

    // Zone Configuration Constants
    const ZONE_COLS = 28;
    const ZONE_ROWS = 20;
    const TOTAL_ZONES = ZONE_COLS * ZONE_ROWS;

    function copyScreenAudio(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat = new Int8Array(engine.zone.saturation)
        const hue = new Int16Array(engine.zone.hue)
        
        const width = 320 / ZONE_COLS
        const height = 200 / ZONE_ROWS
        
        // Use the global audioEase values we already calculated
        const satMultiplier = audioEase.sat / 200 + 0.5
        const litMultiplier = audioEase.lit / 100

        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const x = col * width
            const y = row * height
            
            ctx.fillStyle = getColorString(
                hue[iZone],
                sat[iZone] * satMultiplier,
                lightness[iZone] * litMultiplier,
                alpha
            )
            ctx.fillRect(x, y, width, height)
        }
    }
  
    function copyScreen(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat = new Int8Array(engine.zone.saturation)
        const hue = new Int16Array(engine.zone.hue)
        
        const width = 320 / ZONE_COLS
        const height = 200 / ZONE_ROWS
        
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const x = col * width
            const y = row * height
            
            const finalHue = backgroundMode === "Custom Ambience" 
                ? proBack[0] 
                : hue[iZone] + (backgroundMode === "Color Cycle Ambience" ? gCycle : 0)
            
            ctx.fillStyle = getColorString(
                finalHue,
                sat[iZone],
                lightness[iZone],
                alpha
            )
            ctx.fillRect(x, y, width, height)
        }
    }
    //#endregion
    //#region callbacks

    function inGameCallback(){
      if(inGameWhite1Meter.value >= 0.95 && inGameWhite2Meter.value >= 0.95 && inGameNotWhiteMeter.value <= .05){
        inGame = true
      } else if(inGameWhite1Meter.value <= .25 || inGameWhite2Meter.value <= .25){
        inGame = false
      }
    }

    let deathGoing = false
    function deathCallback(){
      if(!inGame && DeathRedMeter.value >= .95 && SigilBlackMeter.value >= .95 && engine.vision.deathNotRed <= .05 && !deathGoing){
        if(deathOn) effects.push(new death())
        deathGoing = true
      }
    }

    let sigilGoing = false
    function sigilCallback(){
      if(!inGame && SigilGreenMeter.value >= .95 && SigilBlackMeter.value >= .95 && engine.vision.sigilNotGreen <= .05 && !sigilGoing){
        if(deathOn) effects.push(new sigil())
        sigilGoing = true
      }
    }

    let shieldRedGoing = false
    function shieldCallback(){
      if (inGame && shieldRedMeter.value >= 0.5 && !shieldRedGoing) {
        shieldRedGoing = true;
        if(shieldOn) effects.push(new shieldBlock())
      }
      if (inGame && shieldGreenMeter.value >= 0.5 && shieldRedGoing) {
        shieldRedGoing = false;
      }
    }

    let criticalGoing = false
    let lowHealthGoing = false
    function healthCallback(){
      if(inGame && healthBlueMeter.value >= 0.95 && healthIncreaseWhiteMeter.value >= 0.95 && healthIncreaseNotWhiteMeter.value <= .05){
        if(hpOn) effects.push(new hudUp(220))
      }
      if(inGame && healthBlueMeter.value >= 0.95 && lowHealthGoing){
        lowHealthGoing = false
      }
      if(inGame && healthRedMeter.value >= 0.95 && !lowHealthGoing){
        lowHealthGoing = true
      }
      if(inGame && healthCriticalRedMeter.value > 0 && engine.vision.healthNotCriticalRed <= .05 && lowHealthGoing){
        if(hpOn) effects.push(new criticalHealth())
      }
    }

    function armorCallback(){
      if(inGame && armorGreenMeter.value >= 0.95 && armorNotGreenMeter.value <= .05 && armorNotGoing ){
        armorNotGoing = false
        if(armorOn) effects.push(new hudUp(120))
      }
      if(inGame && armorGreenMeter.value <= 0 && !armorNotGoing ){
        armorNotGoing = true
        if(armorOn) effects.push(new tookDamage())
      }
      if(inGame && armorGreenMeter.value >= 0.95 && armorIncreaseWhiteMeter.value >= 0.95 && armorIncreaseNotWhiteMeter.value <= .05){
        if(armorOn) effects.push(new hudUp(120))
      }
    }

    let lowAmmoGoing = false
    function ammoCallback(){
      if(inGame && lowAmmoRedMeter.value >= 0.1 && engine.vision.lowAmmoNotRed <= .1 && !lowAmmoGoing){
        if(ammoOn) effects.push(new lowAmmo())
        lowAmmoGoing = true
      }
    }

    let leaderHUDGoing = false
    function leaderCallback(){
      if(inGame && leaderPurpleMeter.value >= 0.5 && leaderRedMeter.value >= 0.5 && !leaderHUDGoing){
        leaderHUDGoing = true
        if(bossOn) effects.push(new boss())
      }
    }

    let goldGoing = false
    function goldCallback(){
      if(inGame && goldYellowMeter.value >= 0.95 && goldNotYellowMeter.value <= .05 && !goldGoing){
        goldGoing = true
        if(goldOn) effects.push(new goldGain())
      }
    }

    function boss(){
      this.a = 0
      this.w = 0
      this.count = 0
      this.draw = function(){
          if(this.a <= 1) this.a += .05
          this.w += (leaderRedMeter.value * 320 - this.w) / 20
          DrawRect(0, 0, this.w, 200, getColorString(0, 100, 50, this.a * (Math.sin(Date.now() / 200) * .25 + .5)))
          if(!this.count) effects.push(new bossHealth(this.w))
          this.count < 3 ? this.count++ : this.count = 0
        if(leaderRedMeter.value <= .01 && leaderPurpleMeter.value <= .01){
          this.lifetime = 0
          leaderHUDGoing = false
        }
      }
    }

    function bossHealth(x){
      this.x = x
      this.vx = 0
      this.y = Math.random() * 200
      this.rad = 20
      this.lit = Math.random() * 75
      this.draw = function(){
          DrawCircle(this.x, this.y, this.rad, getColorString(0, 100, this.lit, .33))
          this.x > -50 ? this.x += this.vx : this.lifetime = 0
          this.vx -= .02
          this.rad > 1 ? this.rad -= .01 : this.rad = 1
      }
    }

    function sigil(){
      this.rad = 1
      this.draw = function(){
          DrawCircle(160, 100, this.rad, getColorString(135, 100, 50, Math.sin(Date.now() / 500) * .25 + .5))
          this.rad < 298 ? this.rad += (300 - this.rad) / 20 : this.rad = 300
          if(SigilGreenMeter.value <= .25 || SigilBlackMeter.value <= .25) this.lifetime = 0
      }
    }

    function death(){
      this.y = 0
      this.alpha = 0
      this.draw = function(){
          DrawRect(0, 0, 320, 200, getColorString(0, 100, 30, this.alpha))
          drawTeeth(0, 100 + this.y, 0)
          drawTeeth(-30, 100 - this.y, 1)
          this.y = Math.abs(Math.sin(Date.now() / 200)) * 75 + 30
          if(this.alpha <= .95) this.alpha += .05
          if(DeathRedMeter.value <= .25 || SigilBlackMeter.value <= .25){
            this.lifetime = 0
            deathGoing = false
          }
      }
    }

    function drawTeeth(x, y, flip){
        ctx.save()
        ctx.translate(x, y)
        ctx.scale(1, flip ? -1 : 1)
        ctx.translate(-x, -y)
        DrawRect(x, y, 360, 100, getColorString(0, 100, 2, 1))
        for(let i = 0; i < 9; i++){
            DrawTriangle(i * 60 + x, y, i * 60 + x + 60, y, i * 60 + x + 30, y - 75, getColorString(0, 100, 2, 1))
        }
        ctx.restore()
    }

    function goldGain(){
      this.half = false
      this.w = 0
      this.draw = function(){
          DrawRect(160 - this.w, 0, this.w * 2, 200, getColorString(60, 100, 60, this.w / 200))
          if(!this.half) this.w < 198 ? this.w += (200 - this.w) / 20 : this.half = true
          else this.w > 2 ? this.w += (0 - this.w) / 20 : this.lifetime = 0
          if(!this.lifetime) goldGoing = false
      }
    }

    function shieldBlock(){
      this.x = 160
      this.y = 320
      this.rot = -.5
      this.alpha = 0
      this.half = false
      this.draw = function(){
          ctx.save()
          ctx.translate(this.x, this.y)
          ctx.rotate(this.rot)
          ctx.scale(4, 4)
          ctx.translate(-this.x, -this.y)
          DrawCircle(this.x, this.y, 50, getColorString(0, 100, 50, this.alpha))
          for(let i = 0; i < 8; i++){
              ctx.translate(this.x, this.y)
              ctx.rotate(.6)
              ctx.translate(-this.x, -this.y)
              DrawTriangle(this.x - 30, this.y + 60, this.x + 5, this.y + 40, this.x, this.y + 60, getColorString(0, 100, 50, this.alpha))
          }
          ctx.restore()
          if(!this.half) {
              this.alpha <= .95 ? this.alpha += .05 : this.alpha = 1
              this.rot < 1.5 ? this.rot += .04 : this.half = true
          }
          else {
              this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
              this.rot += .01
          }
      }
    }

    function criticalHealth(){
      this.count = 0
      this.draw = function(){
          this.count < 3 ? this.count++ : this.count = 0
          if(!this.count){
              effects.push(new criticalHealthHelp(120, 75, Math.random() - 2, Math.random() - 2, 20))
              effects.push(new criticalHealthHelp(200, 75, Math.random() - 2, -Math.random() + 2, 20))
              effects.push(new criticalHealthHelp(160, 140, 0, Math.random() * 4 - 2, 30))
          }
          if(healthBlueMeter.value >= .5 || !inGame) this.lifetime = 0
      }
    }

    function criticalHealthHelp(x, y, vy, vx, rad){
        this.x = x
        this.y = y
        this.vx = vx
        this.vy = vy
        this.rad = rad
        this.alpha = 1
        this.draw = function(){
            DrawCircle(this.x, this.y, this.rad, getColorString(0, 100, 50, this.alpha))
            this.alpha > 0 ? this.alpha -= .01 : this.lifetime = 0
            this.x += this.vx
            this.vx *= .99
            this.y += this.vy
            this.vy += .05
        }
    }

    function hudUp(hue){
      this.hue = hue
      this.alpha = 0
      this.y = 200
      this.draw = function(){
          DrawRect(0, 0, 320, 200, getColorString(this.hue, 100, 40, this.alpha))
          DrawRect(0, this.y, 320, 20, "white")
          this.y > -20 ? this.y -= 5 : this.lifetime = 0
          this.alpha = 1 - Math.abs(100 - this.y) / 100
      }
    }

    function tookDamage(){
      this.draw = function(){
          for(let i = 0; i < 5; i++){
              setTimeout(()=>{
                  effects.push(new tookDamageHelp())
              }, 100 * i)
          }
          this.lifetime = 0
      }
    }

    function tookDamageHelp(){
      this.x = Math.random() * 200 + 60
      this.y = Math.random() * 200
      this.rad = 1
      this.draw = function(){
          DrawStroke(this.x, this.y, this.rad, getColorString(0, 100, 50, 1 - this.rad / 100), 30)
          this.rad < 100 ? this.rad += 5 : this.lifetime = 0
      }
    }

    function lowAmmo(){
      this.count = 0
      this.draw = function(){
          if(this.count % 40 == 0) effects.push(new lowAmmoHelp())
          this.count < 80 ? this.count++ : this.lifetime = 0
      }
    }

    function lowAmmoHelp(){
      this.alpha = 0
      this.i = 6
      this.count = 0
      this.half = false
      this.draw = function(){
          DrawRect(0, 0, 320, 200, getColorString(0, 100, 30, this.alpha))
          for(let i = 0; i < this.i; i++){
              let temp = i % 2 == 0 ? i - 1 : -i
              DrawRect(170 + temp * 25, 50, 30, 100, getColorString(10, 100, 60, this.alpha))
          }
          if(this.half){
              this.alpha >= .1 ? this.alpha -= .1 : this.lifetime = 0
              if(!this.lifetime) lowAmmoGoing = false
          } else {
              this.alpha <= .6 ? this.alpha += .1 : this.count++
              if(this.count == 3){
                  this.count = 0
                  this.i > 0 ? this.i-- : this.half = true
              }
          }
      }
    }
    //#endregion
    
    //#region Helper Functions
  function DrawArc(x, y, start, end, radius, direction, color){
    ctx.beginPath()
    ctx.arc(x, y, radius, start, end, direction)
    ctx.fillStyle = color
    ctx.fill()
  }

  function DrawLine(start, end, color, stroke){
    ctx.beginPath()
    ctx.moveTo(start[0], start[1])
    ctx.lineTo(end[0], end[1])
    ctx.strokeStyle = color
    ctx.lineWidth = stroke
    ctx.stroke()
  }

  function DrawEllipse(x, y, width, height, rotation, color){
    ctx.beginPath()
    ctx.ellipse(x, y, width, height, rotation, 0, Math.PI * 2)
    ctx.fillStyle = color
    ctx.fill()
  }

  function DrawGear(x, y, radius, stroke, teeth, color){
    DrawStroke(x, y, radius, color, stroke)
    for(let i = 0; i < teeth; i++){
      var ix = Math.cos(Math.PI * 2 / teeth * i) * radius + x;
      var iy = Math.sin(Math.PI * 2 / teeth * i) * radius + y;
      var rotate = Math.atan2(y - iy, x - ix) + Math.PI / 2;
      ctx.save()
      ctx.translate(ix, iy)
      ctx.rotate(rotate)
      ctx.translate(-ix, -iy)
      DrawRect(ix, iy, Math.PI * radius * 2 / teeth * .75, radius / 3 + stroke / 2, "orange")
      ctx.restore()
    }
  }

  function DrawPath(x, y, path, color, scaleX, scaleY) {
    ctx.fillStyle = color;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scaleX, scaleY)
    let ex = new Path2D(path);
    ctx.fill(ex);
    ctx.restore();
  };

  function DrawTriangle(cord1X, cord1Y, cord2X, cord2Y, cord3X, cord3Y, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.moveTo(cord1X, cord1Y);
    ctx.lineTo(cord2X, cord2Y);
    ctx.lineTo(cord3X, cord3Y);
    ctx.lineTo(cord1X, cord1Y);
    ctx.fill();
  };

  function DrawCircle(x, y, radius, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.fill();
  };

  function DrawStroke(x, y, radius, color, stroke) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = stroke;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.stroke();
  };

  function DrawRect(x, y, width, height, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
  };

  function strokeRect(x, y, width, height, color, stroke){
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = stroke
    ctx.rect(x, y, width, height);
    ctx.stroke()
  }

  function DrawHex(x, y, color, size) {
    ctx.beginPath();
    for (var i = 0; i < 7; i++) {
      ctx.lineTo(x + size * Math.cos(2 * Math.PI / 6 * i), y + size * 0.9 * Math.sin(2 * Math.PI / 6 * i));
    }
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = "black"
    ctx.stroke()
  };

      function getCubicBezierXYatPercent(startPt, controlPt1, controlPt2, endPt, percent) {
        var x = CubicN(percent, startPt.x, controlPt1.x, controlPt2.x, endPt.x);
        var y = CubicN(percent, startPt.y, controlPt1.y, controlPt2.y, endPt.y);

        return ({ x: x, y: y });
      }

      function CubicN(pct, a, b, c, d) {
        var t2 = pct * pct;
        var t3 = t2 * pct;
        return a + (-a * 3 + pct * (3 * a - a * pct)) * pct
          + (3 * b + pct * (-6 * b + b * 3 * pct)) * pct
          + (c * 3 - c * 3 * pct) * t2
          + d * t3;
      }

  function hexToRgb(hex) {
    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
      r: parseInt(result[1], 16),
      g: parseInt(result[2], 16),
      b: parseInt(result[3], 16)
    } : null;
  }

  function hexToHSL(hex) {
      const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || [];
      const rgb = [r, g, b].map(x => parseInt(x, 16) / 255);
      const max = Math.max(...rgb);
      const min = Math.min(...rgb);
      const l = (max + min) / 2;
      
      if (max === min) return [0, 0, Math.round(l * 100)];
      
      const d = max - min;
      const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      
      let h;
      const [nr, ng, nb] = rgb;
      if (max === nr) h = (ng - nb) / d + (ng < nb ? 6 : 0);
      else if (max === ng) h = (nb - nr) / d + 2;
      else h = (nr - ng) / d + 4;
      
      return [
        Math.round(h * 60),
        Math.round(s * 100),
        Math.round(l * 100)
      ];
    }
  
    function Meter(size, callback) {
      this.size = size;
      this.value = 0;
      this.diff = 0;
      this.increased = false;
      this.decreased = false;
      var values = [];
  
      this.setValue = function (updatedValue) {
        values.push(updatedValue);
        if (values.length > this.size) {
          values.shift();
        }
  
        for (var i = 0; i < values.length - 1; i++) {
          if (values[i] !== values[i + 1]) return;
        }
        if (this.value !== values[0]) {
          this.diff = Math.abs(this.value - values[0]);
          this.increased = this.value < values[0];
          this.decreased = this.value > values[0];
          this.value = values[0];
          callback();
        }
      }
    }
    //#endregion


  window.requestAnimationFrame(update);
</script>
