<body style="margin: 0; padding: 0; background: #000;">
  <canvas id="exCanvas" width="320" height="200"></canvas>
</body>

<script>
  var canvas, ctx;
  canvas = document.getElementById('exCanvas');
  ctx = canvas.getContext('2d');
  var width = 320;
  var height = 200;
  var hiddenCanvas = document.createElement("canvas");
  hiddenCanvas.width = width;
  hiddenCanvas.height = height;
  var hctx = hiddenCanvas.getContext("2d");
  let gAlpha = 1
  var effects = [];

  var inGame = false;
  var playerSleeping = false;
  var itemSet = 0;

  var inGame1Meter = new Meter(15, inGameHandler)
  var inGame2Meter = new Meter(15, inGameHandler)

  var healthMeter = new Meter(15, meterHandler)
  var thirstMeter = new Meter(15, meterHandler)
  var hungerMeter = new Meter(15, meterHandler)

  var item1BlueMeter = new Meter(10, itemHandler)
  var item1HPMeter = new Meter(6, itemHandler)
  var item2BlueMeter = new Meter(10, itemHandler)
  var item2HPMeter = new Meter(6, itemHandler)
  var item3BlueMeter = new Meter(10, itemHandler)
  var item3HPMeter = new Meter(6, itemHandler)
  var item4BlueMeter = new Meter(10, itemHandler)
  var item4HPMeter = new Meter(6, itemHandler)
  var item5BlueMeter = new Meter(10, itemHandler)
  var item5HPMeter = new Meter(6, itemHandler)
  var item6BlueMeter = new Meter(10, itemHandler)
  var item6HPMeter = new Meter(6, itemHandler)

  var deathGreenMeter = new Meter(5, deathHandler)
  var deathBlackMeter = new Meter(5, deathHandler)

  var sleepBlackMeter = new Meter(5, sleepHandler)
  var sleepGreyMeter = new Meter(5, sleepHandler)

  var badRedMeter = new Meter(10, conditionHandler)
  var craftBlueMeter = new Meter(10, conditionHandler)

  var loadRedMeter = new Meter(5, loadHandler)
  var loadWhiteMeter = new Meter(5, loadHandler)

  var alertMeter = new Meter(15, alertHandler)
  var alertNullMeter = new Meter(15, alertHandler)

  var dialogueRedMeter = new Meter(5, dialogueHandler)
  var dialogueGreenMeter = new Meter(5, dialogueHandler)


  function update() {
    hctx.clearRect(0, 0, hiddenCanvas.width, hiddenCanvas.height);
    hctx.fillStyle = `hsla(0, 0%, 0%, ${gAlpha})`;
    hctx.fillRect(0, 0, 320, 200);

    backgroundHandler()

    //Meter updates
    inGame1Meter.setValue(engine.vision.inGameBlack)
    inGame2Meter.setValue(engine.vision.inGameGrey)
    healthMeter.setValue(engine.vision.health)
    thirstMeter.setValue(engine.vision.thirst)
    hungerMeter.setValue(engine.vision.hunger)

    item1BlueMeter.setValue(engine.vision.item1)
    item1HPMeter.setValue(engine.vision.item1HP)
    item2BlueMeter.setValue(engine.vision.item2)
    item2HPMeter.setValue(engine.vision.item2HP)
    item3BlueMeter.setValue(engine.vision.item3)
    item3HPMeter.setValue(engine.vision.item3HP)
    item4BlueMeter.setValue(engine.vision.item4)
    item4HPMeter.setValue(engine.vision.item4HP)
    item5BlueMeter.setValue(engine.vision.item5)
    item5HPMeter.setValue(engine.vision.item5HP)
    item6BlueMeter.setValue(engine.vision.item6)
    item6HPMeter.setValue(engine.vision.item6HP)

    badRedMeter.setValue(engine.vision.badEffectRed)
    craftBlueMeter.setValue(engine.vision.craftingBlue)

    alertMeter.setValue(engine.vision.alertRed)
    alertNullMeter.setValue(engine.vision.alertNotRed)

    deathGreenMeter.setValue(engine.vision.deathGreen)
    deathBlackMeter.setValue(engine.vision.deathBlack)

    sleepBlackMeter.setValue(engine.vision.sleepBlack)
    sleepGreyMeter.setValue(engine.vision.sleepGrey)

    loadRedMeter.setValue(engine.vision.loadingRed)
    loadWhiteMeter.setValue(engine.vision.loadingWhite)

    dialogueRedMeter.setValue(engine.vision.dialogueRed)
    dialogueGreenMeter.setValue(engine.vision.dialogueGreen)


    //Effect handler 
    for (let i = 0; i < effects.length; i++) {
      effects[i].draw(hctx);
    }
    // Remove dead effects with filter
    effects = effects.filter(ele =>
      ele.lifetime === undefined || ele.lifetime > 0
    );

    if(enableHUD) DrawHUD();
    ctx.clearRect(0, 0, width, height);
    ctx.drawImage(hiddenCanvas, 0, 0);

    window.requestAnimationFrame(update);
  };


  function DrawHUD() {
    if (inGame) {
      //hp
      if(healthOn){
        hctx.beginPath()
        hctx.fillStyle = healthColor;
        hctx.fillRect((hpX * 3.2), (hpY * 2), healthMeter.value * (hpWidth * 3.2), (hpHeight * 2))
      }
      
      //thirst
      if(thirstOn){
        hctx.beginPath()
        hctx.fillStyle = thirstColor;
        hctx.fillRect((thirstX * 3.2), (thirstY * 2), thirstMeter.value * (thirstWidth * 3.2), (thirstHeight * 2))
      }
      
      //hunger
      if(hungerOn){
        hctx.beginPath()
        hctx.fillStyle = hungerColor;
        hctx.fillRect((hungerX * 3.2), (hungerY * 2), hungerMeter.value * (hungerWidth * 3.2), (hungerHeight * 2))
      }
      
      //item
      if(itemOn){
        hctx.beginPath()
        hctx.fillStyle = itemColor;
        switch (itemSet) {
              case 1:
                this.value = item1HPMeter.value
                break;
              case 2:
                this.value = item2HPMeter.value
                break;
              case 3:
                this.value = item3HPMeter.value
                break;
              case 4:
                this.value = item4HPMeter.value
                break;
              case 5:
                this.value = item5HPMeter.value
                break;
              case 6:
                this.value = item6HPMeter.value
                break;
              default:
                this.value = 0;
                break;
          }
        hctx.fillRect((itemX * 3.2), (itemY * 2), this.value * (itemWidth * 3.2), (itemHeight * 2))
      }
      

    } else if (adjustHUD) {
      //hp
      if(healthOn){
      hctx.beginPath()
      hctx.fillStyle = healthColor;
      hctx.fillRect((hpX * 3.2), (hpY * 2), (hpWidth * 3.2), (hpHeight * 2))
      }
      //thirst
      if(thirstOn){
      hctx.beginPath()
      hctx.fillStyle = thirstColor;
      hctx.fillRect((thirstX * 3.2), (thirstY * 2), (thirstWidth * 3.2), (thirstHeight * 2))
      }
      //hunger
      if(hungerOn){
      hctx.beginPath()
      hctx.fillStyle = hungerColor;
      hctx.fillRect((hungerX * 3.2), (hungerY * 2), (hungerWidth * 3.2), (hungerHeight * 2))
      }
      //item
      if(itemOn){
      hctx.beginPath()
      hctx.fillStyle = itemColor;
      hctx.fillRect((itemX * 3.2), (itemY * 2), (itemWidth * 3.2), (itemHeight * 2))
      }
    }
    
  }

  let proBack = []
    function onbackColorChanged(){
      proBack = hexToHSL(backColor)
    }

    let backgroundEaseHue = 0;
    let backgroundEaseLit = 0;
    let backgroundEaseSat = 0
    let gCycle = 0
    function backgroundHandler(){
        switch(backgroundMode){
            case "Color Cycle": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Color Cycle Ambience": 
            copyScreen(ambienceAlpha / 100)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Custom": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            break;
            case "Ambience": 
            copyScreen(ambienceAlpha / 100,hctx)
            break;
            case "Custom Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Ambience Audio Visualizer": 
            copyScreenAudio(ambienceAlpha / 100)
            break;
            case "Custom Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
            case "Color Cycle Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
        }
    }

    let audioScreenSat = 0
    let audioScreenLit = 0
    function copyScreenAudio(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      audioScreenSat += (engine.audio.density * 100 - audioScreenSat) / 10
      audioScreenLit += (engine.audio.density * 100 - audioScreenLit) / 10
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        hctx.fillStyle = `hsla(${hue[iZone]}, ${sat[iZone] * (audioScreenSat / 200 + .5)}%, ${lightness[iZone] * (audioScreenLit / 100)}%, ${alpha})`;
        hctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }
  
    function copyScreen(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        hctx.fillStyle = `hsla(${(backgroundMode == "Custom Ambience" ? proBack[0] : hue[iZone] + gCycle * (backgroundMode == "Color Cycle Ambience"))}, ${sat[iZone]}%, ${lightness[iZone]}%, ${alpha})`;
        hctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }

  function inGameHandler() {
    if (inGame1Meter.value >=.95  && inGame2Meter.value >=.95) {
      inGame = true;
     
    }
    if (inGame1Meter.value <.1 || inGame2Meter.value <.1){
      inGame = false
    } 
  }
  
  let inDialogue = false;
  function dialogueHandler(){
    if(dialogueRedMeter.value >= .95 && dialogueGreenMeter.value >= .95 && !inGame && !inDialogue){
      inDialogue = true;
      if(dialogueOn) effects.push(new idleMenu())
    } else if ((dialogueRedMeter.value <.1 && dialogueGreenMeter.value <.1 && inDialogue) || (inGame && inDialogue)){
      inDialogue = false;
    }
  }

  let oldSet = 0;
  function itemHandler() {
    if (inGame) {
      if (item1BlueMeter.value >=.95 ) itemSet = 1;
      else if (item2BlueMeter.value >=.95 ) itemSet = 2;
      else if (item3BlueMeter.value >=.95 ) itemSet = 3;
      else if (item4BlueMeter.value >=.95 ) itemSet = 4;
      else if (item5BlueMeter.value >=.95 ) itemSet = 5;
      else if (item6BlueMeter.value >=.95 ) itemSet = 6;
      else itemSet = 0;
    }
    if(itemSet != oldSet){
      oldSet = itemSet
      if(itemOn) effects.push(new switchSwipe())
    }
  }

  function deathHandler() {
    if (!inGame && deathBlackMeter.value >= .95 && deathGreenMeter.value >= .95 && deathOn) effects.push(new death())
  }

  function sleepHandler() {
    if (!inGame && sleepBlackMeter.value >= .95 && sleepGreyMeter.value >=.95 ) {
      playerSleeping = true;
      if(asleepOn) effects.push(new asleep())
    } else playerSleeping = false;
  }

  function conditionHandler() {
    if (inGame && badRedMeter.value > .4 && badRedMeter.increased && badRedMeter.diff > .2 && debuffOn) effects.push(new badCondition())
    if (craftBlueMeter .value > .4 && craftBlueMeter.increased && craftBlueMeter.diff > .2 && craftOn) effects.push(new craftingItem())
  }

  function loadHandler() {
    if (!inGame && loadRedMeter.value >= .95 && loadWhiteMeter.value >= .95 && loadOn) effects.push(new drawRunningMan())
  }

  function alertHandler() {
    if (inGame && alertMeter.value >= .95 && alertMeter.increased && alertNullMeter.value <.1 && gAlertOn) effects.push(new globalAlert())
  }

  var alertPushed = false;
  function meterHandler() {
    if (inGame && healthMeter.value < .15 && !alertPushed && alertOn) {
      effects.push(new alertState())
      alertPushed = true;
    }
    if (inGame && hungerMeter.value < .15 && !alertPushed && alertOn) {
      effects.push(new alertState())
      alertPushed = true;
    }
    if (inGame && thirstMeter.value < .15 && !alertPushed && alertOn) {
      effects.push(new alertState())
      alertPushed = true;
    }
  }

  function switchSwipe(){
    this.x = -320;
    this.lifetime = 10;
    this.draw = function(){
      hctx.save()
      hctx.translate(this.x, 0)
      DrawRect(0, 0, 320, 200, "hsla(240, 100%, 70%, .1)")
      DrawRect(50, 0, 220, 200, "hsla(240, 100%, 70%, .1)")
      DrawRect(100, 0, 120, 200, "hsla(240, 100%, 70%, .1)")
      hctx.restore()
      this.x < 320 ? this.x+=20 : this.lifetime = 0;
    }
  }

  function idleMenu(){
    this.stroke = 1;
    this.radius = 1;
    this.rotate = 0;
    this.backAlpha = 0;
    this.frontAlpha = 0;
    this.totalAlpha = 1;
    this.lifetime = 10;
    this.draw = function(){
      this.radius < 90 ? this.radius+=.15 : this.frontAlpha <= .99 ? this.frontAlpha+=.01 : this.frontAlpha = 1;
      this.stroke < 30 ? this.stroke+=.05 : this.rotate += .01;
      this.backAlpha <= .99 ? this.backAlpha+=.01 : this.backAlpha = 1;
      hctx.globalAlpha = this.totalAlpha;
      DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${this.backAlpha})`)
      DrawStroke(160, 100, this.radius, "red", this.stroke)

      hctx.save()
      hctx.translate(160, 100)
      hctx.rotate(this.rotate)
      hctx.translate(-160, -100)
      menuX(120, 100, .65, Math.PI / 4, this.frontAlpha)
      menuX(200, 100, .65, Math.PI / 4, this.frontAlpha)
      hctx.restore()
      hctx.globalAlpha = 1;

      if(inGame) this.totalAlpha >= .05 ? this.totalAlpha -= .05 : this.lifetime = 0;
    }
  }

  function menuX(x, y, scale, rotate, alpha){
    hctx.save()
    hctx.translate(x, y)
    hctx.scale(scale, scale)
    hctx.rotate(rotate)
    hctx.translate(-x, -y)
    DrawRect(x, y - 10, 40, 20, `hsla(0, 100%, 50%, ${alpha})`)
    DrawRect(x, y - 10, -40, 20, `hsla(0, 100%, 50%, ${alpha})`)
    DrawRect(x - 10, y, 20, 40, `hsla(0, 100%, 50%, ${alpha})`)
    DrawRect(x - 10, y, 20, -40, `hsla(0, 100%, 50%, ${alpha})`)
    hctx.restore()
  }

  function globalAlert() {
    this.lifetime = 10;
    this.count = 0
    this.radius = 1;
    this.backAlpha = 0;
    this.draw = function () {
      DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${this.backAlpha})`)
      this.backAlpha <= .55 ? this.backAlpha += .05 : this.backAlpha = .6;
      DrawStroke(0, 100, this.radius, "red", this.radius / 5)
      DrawStroke(320, 100, this.radius, "red", this.radius / 5)
      this.radius < 320 ? this.radius += 10 : this.radius = 1
      if (this.radius == 1) this.count++
      if (this.count == 5) {
        this.lifetime = 0;
      }
    }
  }

  function alertState() {
    this.lifetime = 1;
    this.alpha = 0;
    this.backAlpha = 0;
    this.draw = function () {
      DrawRect(0, 0, 320, 200, `hsla(0, 100%, 50%, ${this.backAlpha})`)
      this.backAlpha <= .45 ? this.backAlpha += .05 : this.backAlpha = .5;

      DrawCircle(160, 100, 30, `hsla(0, 100%, 50%, ${this.alpha})`)
      DrawStroke(160, 100, 45, `hsla(0, 100%, 50%, ${this.alpha + .1})`, 30)
      DrawStroke(160, 100, 75, `hsla(0, 100%, 50%, ${this.alpha + .2})`, 30)
      DrawStroke(160, 100, 105, `hsla(0, 100%, 50%, ${this.alpha + .3})`, 30)
      DrawStroke(160, 100, 135, `hsla(0, 100%, 50%, ${this.alpha + .4})`, 30)
      DrawStroke(160, 100, 165, `hsla(0, 100%, 50%, ${this.alpha + .5})`, 30)
      DrawStroke(160, 100, 195, `hsla(0, 100%, 50%, ${this.alpha + .6})`, 30)

      this.alpha = Math.sin(Date.now() / 1000) * .25 + .25
      if ((inGame && healthMeter.value > .15 && thirstMeter.value > .15) ||!inGame) this.lifetime = 0;

    }

  function craftingItem() {
    this.backAlpha = 0;
    this.alpha = 1;
    this.a1 = 0;
    this.a2 = 0;
    this.a3 = 0;
    this.rotate = 0;
    this.lifetime = 10;
    this.draw = function () {
      hctx.globalAlpha = this.alpha;
      DrawRect(0, 0, 320, 200, `hsla(210, 100%, 50%, ${this.backAlpha})`)
      this.backAlpha <= .75 ? this.backAlpha += .05 : this.backAlpha = .8;
      hctx.save()
      hctx.translate(80, 100)
      hctx.rotate(this.rotate)
      hctx.translate(-80, -100)
      DrawGear(80, 100, 20, 20, 8, `hsla(230, 100%, 30%, ${this.a1})`)
      hctx.restore()
      hctx.save()
      hctx.translate(160, 100)
      hctx.rotate(this.rotate)
      hctx.translate(-160, -100)
      DrawGear(160, 100, 20, 20, 8, `hsla(230, 100%, 30%, ${this.a2})`)
      hctx.restore()
      hctx.save()
      hctx.translate(240, 100)
      hctx.rotate(this.rotate)
      hctx.translate(-240, -100)
      DrawGear(240, 100, 20, 20, 8, `hsla(230, 100%, 30%, ${this.a3})`)
      hctx.restore()
      this.backAlpha == .8 ? this.a1 <= .95 ? this.a1 += .05 :
        this.a2 <= .95 ? this.a2 += .05 :
          this.a3 <= .95 ? this.a3 += .05 : this.done = true : null;
      this.rotate += .01
      if (this.done) this.alpha >= .005 ? this.alpha -= .005 : this.lifetime = 0;
      hctx.globalAlpha = 1;
    }
  }

  function DrawGear(x, y, radius, stroke, teeth, color) {
    DrawStroke(x, y, radius, color, stroke)
    for (let i = 0; i < teeth; i++) {
      var ix = Math.cos(Math.PI * 2 / teeth * i) * radius + x;
      var iy = Math.sin(Math.PI * 2 / teeth * i) * radius + y;
      var rotate = Math.atan2(y - iy, x - ix) + Math.PI / 2;
      hctx.save()
      hctx.translate(ix, iy)
      hctx.rotate(rotate)
      hctx.translate(-ix, -iy)
      DrawRect(ix, iy, Math.PI * radius * 2 / teeth * .75, radius / 3 + stroke / 2, color)
      hctx.restore()
    }
  }

      this.rotate += .01

  function badX(x, y, rotate, alpha) {
    hctx.save()
    hctx.translate(x, y)
    hctx.rotate(rotate)
    hctx.translate(-x, -y)
    DrawRect(x, y - 10, 40, 20, `hsla(0, 100%, 20%, ${alpha})`)

    hctx.restore()
  }

      DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${this.backAlpha})`)

      if (this.backAlpha == 1) this.radius < 100 ? this.radius += 5 : this.radius = 100;
      if (this.radius == 100) this.y1 > 0 ? this.y1 -= 10 : this.y1 = 0;

  function asleep() {
    this.sat = Math.random() * 30 + 50
    this.lit = Math.random() * 80 + 5
    this.backAlpha = 0;
    this.effects = []
    this.start = Date.now()
    this.rotate = 0;
    this.lifetime = 1
    this.draw = function () {
      DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${this.backAlpha})`)
      this.effects.forEach((ele, i) => {
        ele.draw(playerSleeping)
      })

      this.effects = this.effects.filter(ele => ele.lifetime > 0)
      var elapsed = Date.now() - this.start
      if (elapsed > 400) {
        this.start = Date.now()
        this.effects.push(new sleepZ())
      }

      DrawRect(140, 120, 120, 30, `hsla(30, ${this.sat}%, ${this.lit}%, 1)`)
      hctx.save()
      hctx.translate(160, 120)
      hctx.rotate(this.rotate)
      hctx.translate(-160, -120)
      DrawRect(160, 120, -100, 30, `hsla(30, ${this.sat}%, ${this.lit}%, 1)`)
      hctx.restore()
      if (!playerSleeping) {
        this.rotate < Math.PI / 2 ? this.rotate += .03 : this.backAlpha >= .05 ? this.backAlpha -= .05 : this.lifetime = 0;
      } else {
        this.backAlpha <= .85 ? this.backAlpha += .05 : this.backAlpha = .9;
        if (elapsed > 400) {
          this.start = Date.now()
          this.effects.push(new sleepZ())
        }
      }
    }
  }

  function sleepZ() {
    this.x = -50;
    this.y = 90;
    this.alpha = .5
    this.lifetime = 1;
    this.draw = function (sleeping) {
      if (!sleeping) {
        this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0;
      }
      hctx.font = "100px serif";
      hctx.fillStyle = `hsla(0, 0%, 50%, ${this.alpha})`
      hctx.fillText("Z", this.x, this.y);
      this.x < 320 ? this.x += 2 : this.lifetime = 0;
      this.y = Math.sin(this.x / 25) * 20 + 90
    }
  }

  function drawRunningMan() {
    this.hue = 40;
    this.effects = []
    this.sat = Math.random() * 30 + 50
    this.lit = Math.random() * 80 + 5
    this.index = 0;
    this.count = 0
    this.backAlpha = 0;
    this.top = runningMan.length - 1
    this.lifetime = 1;
    this.draw = function () {
      DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${this.backAlpha})`)
      this.effects.forEach((ele, i) => {
        ele.draw()
      })
      
      this.effects = this.effects.filter(ele => ele.lifetime > 0)

      DrawPath(-20, -170, .7, runningMan[this.index], `hsla(30, ${this.sat}%, ${this.lit}%, ${this.backAlpha})`)
      StrokePath(-20, -170, .7, 10, runningMan[this.index], `hsla(0, 0%, 0%, ${this.backAlpha})`)
      if (this.count == 3) {
        this.index < this.top ? this.index++ : this.index = 0;
        if (Math.random() > .7) {
          this.effects.push(new runningRectangle(-25, this.hue))
          this.hue = Math.sin(Date.now() / 4000) * 75 + 115
        }
      }
      this.count < 3 ? this.count++ : this.count = 0;
      if (inGame || playerSleeping) this.backAlpha >= .05 ? this.backAlpha -= .05 : this.lifetime = 0;
      else this.backAlpha <= .95 ? this.backAlpha += .05 : this.backAlpha = 1;
    }
  }

  function runningRectangle(x, hue) {
    this.x = x;
    this.hue = hue;
    this.lifetime = 1;
    this.draw = function () {
      DrawRect(this.x, 0, 50, 200, `hsla(${this.hue}, 100%, 50%, .3)`)
      this.x < 320 ? this.x++ : this.lifetime = 0;
    }
  }

  function DrawPath(x, y, scale, path, color) {
    hctx.fillStyle = color;
    hctx.save();
    hctx.translate(x, y);
    hctx.scale(scale, scale)
    let ex = new Path2D(path);
    hctx.fill(ex);
    hctx.restore();
  };

  function StrokePath(x, y, scale, stroke, path, color) {
    hctx.strokeStyle = color;
    hctx.lineWidth = stroke;
    hctx.save();
    hctx.translate(x, y);
    hctx.scale(scale, scale)
    let ex = new Path2D(path);
    hctx.stroke(ex);
    hctx.restore();
  };

  function DrawCircle(x, y, radius, color) {
    hctx.beginPath();
    hctx.fillStyle = color;
    hctx.arc(x, y, radius, 0, 2 * Math.PI)
    hctx.fill();
  };

  function DrawStroke(x, y, radius, color, stroke) {
    hctx.beginPath();
    hctx.strokeStyle = color;
    hctx.lineWidth = stroke;
    hctx.arc(x, y, radius, 0, 2 * Math.PI)
    hctx.stroke();
  };

  function DrawRect(x, y, width, height, color) {
    hctx.beginPath();
    hctx.fillStyle = color;
    hctx.fillRect(x, y, width, height);
  };

  function copyScreen(alpha) {
    var shine = engine.vision.ShineMeter
    let lightness = new Int8Array(engine.zone.lightness);
    let sat = new Int8Array(engine.zone.saturation);
    let hue = new Int16Array(engine.zone.hue);
    for (var iZone = 0; iZone < 560; iZone++) {
      var iRow = Math.floor(iZone / 28);
      var iCol = iZone % 28;
      var iWidth = 320 / 28;
      var iHeight = 200 / 20;
      var iZx = iCol * iWidth;
      var iZy = iRow * iHeight;
      hctx.fillStyle =
        "hsla(" +
        hue[iZone] +
        "," +
        sat[iZone] +
        "%," +
        lightness[iZone] +
        "%, " +
        `${alpha}` +
        ")";

      hctx.fillRect(iZx, iZy, iWidth, iHeight);
    }

  }

  function Meter(size, callback) {
    this.size = size;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    var values = [];

    this.setValue = function (updatedValue) {
      values.push(updatedValue);
      if (values.length > this.size) {
        values.shift();
      }

      for (var i = 0; i < values.length - 1; i++) {
        if (values[i] !== values[i + 1]) return;
      }
      if (this.value !== values[0]) {
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        callback();
      }
    }
  }

  window.requestAnimationFrame(update);
</script>
