<body style=" margin: 0; padding: 0; background: #000;">
  <canvas id="exCanvas" width="320" height="200"></canvas>
</body>

<script>
  var effects = [];
  var isInGame = false;
  var calculatedHealthValue = 0;
  var usingDrone = false;
  const a = 2 * Math.PI / 6;
  var blueKills = 0;
  var oldBlueKills = 0;
  var redKills = 0;
  var oldRedKills = 0;

    const canvas = document.getElementById('exCanvas');
    const ctx = canvas.getContext('2d');
    // Create a hidden canvas
    const hiddenCanvas = document.createElement('canvas');
    hiddenCanvas.width = 320;
    hiddenCanvas.height = 200;
    // Don't attach to DOM
    const hiddenCtx = hiddenCanvas.getContext('2d');

  var healthMeter = new Meter(5, HealthChanged)
  var lobbyMeter = new Meter(5, () => "")
  var searchMeter = new Meter(5, SearchChanged)
  var selectingStageRedMeter = new Meter(15, SelectingStageChanged)
  var droneWhiteMeter = new Meter(8, DroneChanged)
  var droneBlackMeter = new Meter(8, DroneChanged)
  var droneJumpMeter = new Meter(10, DroneJumpChanged)
  var weaponOnMeter = new Meter(10, () => "")
  var ammoRedMeter = new Meter(1, ReloadChanged)
  var defendBlueMeter = new Meter(5, () => "")
  var GrenadeMeter = new Meter(3, GrenadeChanged)
  var Grenade2Meter = new Meter(3, GrenadeChanged)
  var inGameMeter = new Meter(5, inGameChanged)
  var blue1Meter = new Meter(5, blueKillChanged)
  var blue2Meter = new Meter(5, blueKillChanged)
  var blue3Meter = new Meter(5, blueKillChanged)
  var blue4Meter = new Meter(5, blueKillChanged)
  var blue5Meter = new Meter(5, blueKillChanged)
  var red1Meter = new Meter(5, redKillChanged)
  var red2Meter = new Meter(5, redKillChanged)
  var red3Meter = new Meter(5, redKillChanged)
  var red4Meter = new Meter(5, redKillChanged)
  var red5Meter = new Meter(5, redKillChanged)
  var dRedMeter = new Meter(5, defuserHandler)
  var dYellowMeter = new Meter(5, defuserHandler)

  function update() {
    inGameMeter.setValue(engine.vision.InMatch)
    healthMeter.setValue(engine.vision.health)
    lobbyMeter.setValue(engine.vision.lobbyBlack)
    searchMeter.setValue(engine.vision.searchBlue)
    selectingStageRedMeter.setValue(engine.vision.selectingStageRed)
    droneBlackMeter.setValue(engine.vision.droneBlack)
    droneWhiteMeter.setValue(engine.vision.droneWhite)
    droneJumpMeter.setValue(engine.vision.droneJump)
    weaponOnMeter.setValue(engine.vision.gunSelected)
    ammoRedMeter.setValue(engine.vision.redAmmo)
    defendBlueMeter.setValue(engine.vision.defendingBlue)
    blue1Meter.setValue(engine.vision.blueKill1)
    blue2Meter.setValue(engine.vision.blueKill2)
    blue3Meter.setValue(engine.vision.blueKill3)
    blue4Meter.setValue(engine.vision.blueKill4)
    blue5Meter.setValue(engine.vision.blueKill5)
    red1Meter.setValue(engine.vision.redKill1)
    red2Meter.setValue(engine.vision.redKill2)
    red3Meter.setValue(engine.vision.redKill3)
    red4Meter.setValue(engine.vision.redKill4)
    red5Meter.setValue(engine.vision.redKill5)
    dRedMeter.setValue(engine.vision.defuserRed)
    dYellowMeter.setValue(engine.vision.defuserYellow)
    GrenadeMeter.setValue(engine.vision.useGrenadeWhite)
    Grenade2Meter.setValue(engine.vision.useGrenadeWhite2)
    
    DrawRect(0, 0, 320, 200, "black")
    backgroundHandler()

    if(hudOn){
      DrawHUD();
    }

    for (let i = 0; i < effects.length; i++) {
      effects[i].draw();
      if (effects[i].lifetime <= 0) {
        effects.splice(i, 1);
      }
    }

    ctx.drawImage(hiddenCanvas, 0, 0)

    window.requestAnimationFrame(update);
  }

     // Background Configuration
    let proBack = [0, 0, 0];
    function onbackColorChanged() {
        proBack = hexToHSL(backColor);
    }

    // Audio and Color Cycle State
    let audioEase = { sat: 0, lit: 0 };
    let gCycle = 0;
    
    // Background Utility Functions
    function updateAudioEase() {
        const targetDensity = engine.audio.density * 100;
        audioEase.sat += (targetDensity - audioEase.sat) / 10;
        audioEase.lit += (targetDensity - audioEase.lit) / 10;
    }

    function getColorString(hue, sat, lit, alpha) {
        return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`;
    }

    function updateColorCycle() {
        gCycle = (gCycle + 0.5) % 360;
    }

    // Main Background Handler
    function backgroundHandler() {
        const alpha = ambienceAlpha / 100;

        // Handle color cycling first if needed
        if (backgroundMode.includes("Color Cycle")) {
            updateColorCycle();
        }

        // Handle audio processing if needed
        if (backgroundMode.includes("Audio")) {
            updateAudioEase();
        }

        // Render background based on mode
        if (backgroundMode.includes("Ambience")) {
            if (backgroundMode === "Ambience Audio Visualizer") {
                copyScreenAudio(alpha);
            } else {
                copyScreen(alpha);
            }
            return;
        }

        // Handle custom and cycle modes
        const hue = proBack[0] + (backgroundMode.includes("Color Cycle") ? gCycle : 0);
        const sat = backgroundMode.includes("Audio") ? audioEase.sat * 0.33 + 66 : proBack[1];
        const lit = backgroundMode.includes("Audio") ? audioEase.lit * 0.9 + 10 : proBack[2];
        
        DrawRect(0, 0, 320, 200, getColorString(hue, sat, lit, alpha));
    }

    // Zone Configuration Constants
    const ZONE_COLS = 28;
    const ZONE_ROWS = 20;
    const TOTAL_ZONES = ZONE_COLS * ZONE_ROWS;

    function copyScreenAudio(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat = new Int8Array(engine.zone.saturation)
        const hue = new Int16Array(engine.zone.hue)
        
        const width = 320 / ZONE_COLS
        const height = 200 / ZONE_ROWS
        
        // Use the global audioEase values we already calculated
        const satMultiplier = audioEase.sat / 200 + 0.5
        const litMultiplier = audioEase.lit / 100

        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const x = col * width
            const y = row * height
            
            hiddenCtx.fillStyle = getColorString(
                hue[iZone],
                sat[iZone] * satMultiplier,
                lightness[iZone] * litMultiplier,
                alpha
            )
            hiddenCtx.fillRect(x, y, width, height)
        }
    }
  
    function copyScreen(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat = new Int8Array(engine.zone.saturation)
        const hue = new Int16Array(engine.zone.hue)
        
        const width = 320 / ZONE_COLS
        const height = 200 / ZONE_ROWS
        
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const x = col * width
            const y = row * height
            
            const finalHue = backgroundMode === "Custom Ambience" 
                ? proBack[0] 
                : hue[iZone] + (backgroundMode === "Color Cycle Ambience" ? gCycle : 0)
            
            hiddenCtx.fillStyle = getColorString(
                finalHue,
                sat[iZone],
                lightness[iZone],
                alpha
            )
            hiddenCtx.fillRect(x, y, width, height)
        }
    }
    //#endregion

  function inGameChanged() {
    if (inGameMeter.value >=.95) {
      isInGame = true;
    } else {
      isInGame = false;
    }
  }

  function HealthChanged() {
    if (healthMeter.increased && healthMeter.diff > 0.8) {
      calculatedHealthValue = (1 - healthMeter.value) + 1;
    }
  }

  function SearchChanged() {
    if (searchMeter.value >=.95 && lobbyMeter.value >=.95 && !isInGame && searchOn) {
      effects.push(new SearchingEffect())
    }
  }

  function SelectingStageChanged() {
    if (lobbyMeter.value >=.95 && selectingStageRedMeter.value >= 0.1 && setupOn) {
      effects.push(new SelectingEffect())
    }
  }

  function DroneChanged() {
    if (droneBlackMeter.value >=.95 && droneWhiteMeter.value >=.95 && droneOn) {
      effects.push(new DroneEffect())
      usingDrone = true;
    } else {
      usingDrone = false;
    }
  }

  function DroneJumpChanged() {
    if (usingDrone && droneJumpMeter.increased && droneJumpMeter.diff > .5 && droneOn) {
      effects.push(new Wave("yellow", "up"))
      setTimeout(() => {
        effects.push(new Wave("yellow", "up"))
      }, 200);
    }
  }

  function blueKillChanged() {
    blueKills = 0;
    if(blue1Meter.value >=.95) blueKills++;
    if(blue2Meter.value >=.95) blueKills++;
    if(blue3Meter.value >=.95) blueKills++;
    if(blue4Meter.value >=.95) blueKills++;
    if(blue5Meter.value >=.95) blueKills++;
    if(blueKills != oldBlueKills && isInGame && killOn){
      effects.push(new killEffect(true, blueKills))
      oldBlueKills = blueKills;
    }
  }

  function redKillChanged() {
    redKills = 0;
    if(red1Meter.value >=.95) redKills++;
    if(red2Meter.value >=.95) redKills++;
    if(red3Meter.value >=.95) redKills++;
    if(red4Meter.value >=.95) redKills++;
    if(red5Meter.value >=.95) redKills++;
    if(redKills != oldRedKills && isInGame && killOn){
      effects.push(new killEffect(false, redKills))
      oldRedKills = redKills;
    }
  }

  function ReloadChanged() {
    if (isInGame && ammoRedMeter.value >= .03 && weaponOnMeter.value >=.95 && ammoOn) {
      //for (let i = 0; i < 4; i++){
        //setTimeout(()=>{
          effects.push(new lowAmmoEffect())
        //}, 75 * i)
      //}
    }
  }

  function GrenadeChanged() {
    if (GrenadeMeter.value >=.95 && Grenade2Meter.value <.1 &&  GrenadeMeter.increased && isInGame && weaponOnMeter.value >=.95 && grenadeOn) {
      effects.push(new GrenadeEffect())
    }
  }

  function defuserHandler(){
    if(isInGame && dRedMeter.value >=.95 && dYellowMeter.value >=.95 && defuserOn){
      effects.push(new defuserEffect())
    }
  }

  function defuserEffect(){
    this.lifetime = 10;
    this.y1 = 1;
    this.y2 = 30;
    this.draw = function(){
      DrawStroke(160, 100, this.y1, "red", 20)
      DrawStroke(160, 100, this.y2, "red", 20)
      hiddenCtx.beginPath()
      hiddenCtx.moveTo(160, 50)
      hiddenCtx.lineTo(210, 100)
      hiddenCtx.lineTo(160, 155)
      hiddenCtx.lineTo(110, 100)
      hiddenCtx.lineTo(160, 50)
      hiddenCtx.lineTo(210, 100)
      hiddenCtx.lineWidth = 20;
      hiddenCtx.strokeStyle = "yellow"
      hiddenCtx.stroke()
      DrawCircle(160, 100, 10, "yellow")
      this.y1 < 250 ? this.y1 += 5 : this.y1 = 1;
      this.y2 < 250 ? this.y2 += 5 : this.y2 = 1;
      if(dRedMeter.value < .5 || dYellowMeter < .5){
        this.lifetime = 0;
      }
    }
  }

  function DrawStroke(x, y, radius, color, stroke) {
    hiddenCtx.beginPath();
    hiddenCtx.strokeStyle = color;
    hiddenCtx.lineWidth = stroke;
    hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
    hiddenCtx.stroke();
  };

  function lowAmmoEffect(){
    this.alpha = .5;
    this.grad = hiddenCtx.createRadialGradient(160, 100, 10, 160, 100, 300);
    this.grad.addColorStop(0, 'hsla(0, 100%, 50%, 0)');
    this.grad.addColorStop(.5, 'hsla(0, 100%, 50%, .3)');
    this.grad.addColorStop(1, 'hsla(0, 100%, 50%, 1)');
    this.draw = function(){
      hiddenCtx.globalAlpha = this.alpha;
      DrawCircle(160, 100, 300, this.grad)
      hiddenCtx.globalAlpha = 1;
      this.alpha >= .0025 ? this.alpha-=.0025 : this.lifetime = 0;
    }
  }

  function killEffect(team, num){
    this.team = team;
    this.num = 5 - num;
    this.y = 220;
    this.up = false;
    this.flash = false;
    this.alpha = 0;
    this.lifetime = 10;
    this.i = 0;
    this.draw = function(){
      hiddenCtx.globalAlpha = this.alpha;
      DrawRect(0, this.y - 1, 320, 200, "black")
      for(let i = 0; i < this.num; i++){
        var color = team ? "blue" : `hsl(16, 100%, 50%)`;
        if(this.up && !this.flash && Math.floor(this.i / 10) == i){
          color = "white"
        }
          DrawRect((160 - this.num * 33) + i * 70, this.y * .75 + 50, 50, 100, color)

      }
      hiddenCtx.globalAlpha = 1;
      if(!this.up){
        this.y > 0 ? this.y-=(this.y / 6) : null;
        this.alpha < 1 ? this.alpha += .05 : this.alpha = 1;
        this.y < 1 ? this.up = true : null;
      } else if (!this.flash){
        this.i < this.num * 10 ? this.i++ : this.flash = true;
      } else {
        this.y-=(Math.abs(this.y - 1) * .1)
        this.alpha-=.005
      }
      this.y < -200 ? this.lifetime = 0 : null;
    }
  }


  function DrawHUD() {
    if (isInGame) {
      hiddenCtx.beginPath()
      hiddenCtx.save()
      hiddenCtx.translate(HealthBarX, RotateBar ? 200 : HealthBarY)
      if (RotateBar) {
        hiddenCtx.rotate(-90 / 180 * Math.PI)
      }
      hiddenCtx.fillStyle = healthColor;
      hiddenCtx.fillRect(0, 0, (healthMeter.value * calculatedHealthValue) * SetRange(HealthBarWidth, 0, RotateBar ? 200 : 320), HealthBarHeight)
      hiddenCtx.restore();
    } else if (adjHUD && !isInGame) {

      hiddenCtx.beginPath()
      hiddenCtx.save()
      hiddenCtx.translate(HealthBarX, RotateBar ? 200 : HealthBarY)

      if (RotateBar) {
        hiddenCtx.rotate(-90 / 180 * Math.PI)
      }
      hiddenCtx.fillStyle = healthColor;
      hiddenCtx.fillRect(0, 0, SetRange(HealthBarWidth, 0, RotateBar ? 200 : 320), HealthBarHeight)
      hiddenCtx.restore()
    }
  }

  function SetRange(num, min, max) {
    return Math.min(Math.max(num, min), max)
  }

  function SelectingEffect(){
    this.lifetime = 10;
    this.effects = []
    this.draw = function(){
      if(this.effects.length < 30) this.effects.push(new selectRect())
      DrawRect(0, 0, 320, 200, "hsl(235, 50%, 25%)")
      hiddenCtx.save()
      hiddenCtx.rotate(.52)
      for (let i = 0; i < this.effects.length; i++) {
        this.effects[i].draw();
        if (this.effects[i].lifetime <= 0) {
          this.effects.splice(i, 1);
        }
      };
      hiddenCtx.restore()
      if (selectingStageRedMeter.value == 0) {
        this.lifetime = 0;
      }
    }
  }

  function selectRect(){
    this.lifetime = Math.random() * 900 + 100;
    this.x = Math.random() * 420 - 50;
    this.y = Math.random() * 300 - 50;
    this.height = Math.random() * 150 + 30;
    this.width = Math.random() * 10 + 5;
    this.color = `hsl(${Math.random() * 180 + 180}, 40%, 65%)`
    this.direction = Date.now() % 2 == 0;
    this.alpha = 0;
    this.draw = function(){
      hiddenCtx.globalAlpha = this.alpha;
      DrawRect(this.x, this.y, this.width, this.height, this.color)
      hiddenCtx.globalAlpha = 1;
      this.direction ? this.y+=Math.random() : this.y-=Math.random();
      this.alpha < this.lifetime / 1000 ? this.alpha+=.01 : this.alpha = this.lifetime / 1000;
      this.lifetime--;
    }
  }

  function DroneEffect() {
    this.start = Date.now();
    this.draw = function () {
      this.elapsed = Date.now() - this.start;
      hiddenCtx.beginPath();
      let gradient = hiddenCtx.createLinearGradient(-200, -100, 620, 100)
      this.calculateVal = -2980 * Math.floor((this.elapsed / 2980) / 1) + ((this.elapsed / 2980) * (2980 / 1));
      gradient.addColorStop(SetRange((-0 + (this.calculateVal)), 0, 1000) / 1000, "hsla(209, 100%, 50%,0.5)");
      gradient.addColorStop(SetRange((-600 + (this.calculateVal)), 0, 1000) / 1000, "hsla(287, 100%, 50%,0.5)");
      gradient.addColorStop(SetRange((-1200 + (this.calculateVal)), 0, 1000) / 1000, "hsla(209, 100%, 50%,0.5)");
      hiddenCtx.fillStyle = gradient;
      drawRect(0, 0, 320, 200, gradient)
      if (!usingDrone) {
        this.lifetime = 0;
      }
    }
  }

  function Wave(color, direction) {
    this.color = color;
    this.direction = direction;
    this.lifetime = 300;

    this.draw = function () {
      if (this.direction == "up") {
        hiddenCtx.fillStyle = this.color;
        hiddenCtx.beginPath();
        hiddenCtx.moveTo(160, this.lifetime - 100);
        hiddenCtx.lineTo(320, this.lifetime);
        hiddenCtx.lineTo(320, this.lifetime + 50);
        hiddenCtx.lineTo(160, this.lifetime - 50);
        hiddenCtx.lineTo(0, this.lifetime + 50);
        hiddenCtx.lineTo(0, this.lifetime);
        hiddenCtx.lineTo(160, this.lifetime - 100);
        hiddenCtx.fill();
      } else if (this.direction = "down") {
        hiddenCtx.fillStyle = this.color;
        hiddenCtx.beginPath();
        hiddenCtx.moveTo(160, 300 - this.lifetime);
        hiddenCtx.lineTo(320, 200 - this.lifetime);
        hiddenCtx.lineTo(320, 100 - this.lifetime);
        hiddenCtx.lineTo(160, 200 - this.lifetime);
        hiddenCtx.lineTo(0, 100 - this.lifetime);
        hiddenCtx.lineTo(0, 200 - this.lifetime);
        hiddenCtx.lineTo(160, 300 - this.lifetime);
        hiddenCtx.fill();
      }
      this.lifetime -= 5;
    };
  };

  function GrenadeEffect() {
    this.start = Date.now()
    this.speed = {
      x: 1.8,
      y: -5
    }
    this.pos = {
      x: -10,
      y: 150
    }
    this.bounceCount = 0;
    this.size = 40;
    this.ExplosionParticles = [];
    this.hasBeenPushed = false;
    this.draw = function () {
      this.elapsed = Date.now() - this.start;
      if (this.bounceCount < 2) {
        DrawCircle(this.pos.x, this.pos.y, this.size, "yellow")
        this.pos.x += this.speed.x;
        this.pos.y += this.speed.y;
        this.speed.y += 0.2
        if (this.pos.y + this.size >= 200) {
          this.speed.y = -this.speed.y
          this.bounceCount++;
        }
      } else {
        if (!this.hasBeenPushed) {
          this.hasBeenPushed = true;
          for (let index = 0; index < 60; index++) {
            this.ExplosionParticles.push(new ExplosionParticle(this.pos.x, this.pos.y, { x: (Math.random() - 0.5) * 6, y: -(Math.random() * 2) }, Math.random() * 20 + 3, `hsla(${(Math.random() - 0.5) * 30 + 40},100%,50%,1)`, Math.random() * 5000 + 500, 5));
          }
        }
        this.ExplosionParticles.forEach((element, i) => {
          element.draw();
          if (element.lifetime <= 0) {
            this.ExplosionParticles.splice(i, 1)
          }
        });
        if (this.ExplosionParticles.length == 0) {
          this.lifetime = 0;
        }
      }
    }
  }

  class ExplosionParticle {
    constructor(x, y, speed, size, col, duration, sinSpeed) {
      this.x = x;
      this.y = y;
      this.speed = speed;
      this.size = size;
      this.color = col;
      this.sinSpeed = sinSpeed;
      this.duration = duration;
      this.start = Date.now();
      this.alpha = 1;
      this.lifetime = 1;
    }

    draw() {
      this.elapsed = Date.now() - this.start;
      hiddenCtx.beginPath();
      hiddenCtx.globalAlpha = this.alpha;
      DrawCircle(this.x, this.y, this.size, this.color)
      this.x += this.speed.x;
      this.y += this.speed.y;
      if (this.elapsed > ((this.duration / 3) * 2)) {
        this.alpha = SetRange(1 - ((this.elapsed) - (this.duration / 3 * 2)) / 1000, 0, 1)
        this.lifetime = this.alpha;
      }
      hiddenCtx.globalAlpha = 1;
    }
  }

  function DrawCircle(x, y, radius, color) {
    hiddenCtx.beginPath();
    hiddenCtx.fillStyle = color;
    hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
    hiddenCtx.fill();
  };

  function drawRect(x, y, height, width, color) {
    hiddenCtx.beginPath();
    hiddenCtx.fillStyle = color;
    hiddenCtx.fillRect(x, y, height, width);
  }

  function SearchingEffect() {
    this.start = Date.now();
    this.alpha = .01;
    this.color = "rgb(50, 200, 255)"

    this.draw = function () {
      var elapsed = Date.now() - this.start;
      hiddenCtx.globalAlpha = this.alpha;
      DrawRect(0, 0, 320, 200, this.color)
      hiddenCtx.globalAlpha = 1;
      if(elapsed > 300){
        effects.push(new searchSquare(Math.random() * 350 - 30))
        this.start = Date.now()
      }
      if (searchMeter.value != 1) {
        this.alpha-=.025
        this.color = "cyan"
      } else {
        this.alpha < 1 ? this.alpha += .05 : this.alpha = 1;
      }
      if(this.alpha <= 0){
        this.lifetime = 0;
      }
    }
  }

  function searchSquare(x){
    this.x = x;
    this.movement = Date.now() % 2 == 0 ? true : false;
    this.speed = this.movement ? Math.random() * 3 + 1 : (Math.random() * 3 + 1) * -1;
    this.scale = Math.random() * 100 + 50;
    this.alpha = Math.random() * .8;
    this.a = 0;
    this.lifetime = 10;
    this.draw = function(){
      hiddenCtx.beginPath();
      hiddenCtx.moveTo(this.x, 0)
      hiddenCtx.lineTo(this.x + this.scale, 0);
      hiddenCtx.lineTo(this.x + this.scale - this.scale / 4, 200)
      hiddenCtx.lineTo(this.x - this.scale / 4, 200)
      hiddenCtx.globalAlpha = this.a;
      hiddenCtx.fillStyle = "white"
      hiddenCtx.fill()
      hiddenCtx.globalAlpha = 1;
      this.x+=this.speed;
      this.a < this.alpha ? this.a+=.01 : this.a = this.alpha;
      if(this.x < -30 || this.x > 350){
        this.lifetime = 0;
      }
    }
  }

  function DrawRect(x, y, width, height, color) {
    hiddenCtx.beginPath();
    hiddenCtx.fillStyle = color;
    hiddenCtx.fillRect(x, y, width, height);
  };

  function drawWave(y, color, frequency, direction, waveSize) {

    hiddenCtx.beginPath();

    hiddenCtx.moveTo(0, y);
    for (let i = 0; i < 320; i++) {
      hiddenCtx.lineTo(i, y + Math.sin(i * 0.01 + frequency) * waveSize);
    }
    hiddenCtx.lineTo(320, direction == "up" ? 200 : 0)
    hiddenCtx.lineTo(0, direction == "up" ? 200 : 0)
    hiddenCtx.closePath();
    hiddenCtx.fillStyle = color;
    hiddenCtx.fill();
  }

    function hexToHSL(hex) {
      const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || [];
      const rgb = [r, g, b].map(x => parseInt(x, 16) / 255);
      const max = Math.max(...rgb);
      const min = Math.min(...rgb);
      const l = (max + min) / 2;
      
      if (max === min) return [0, 0, Math.round(l * 100)];
      
      const d = max - min;
      const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      
      let h;
      const [nr, ng, nb] = rgb;
      if (max === nr) h = (ng - nb) / d + (ng < nb ? 6 : 0);
      else if (max === ng) h = (nb - nr) / d + 2;
      else h = (nr - ng) / d + 4;
      
      return [
        Math.round(h * 60),
        Math.round(s * 100),
        Math.round(l * 100)
      ];
    }


  function StateHandler() {
    var stack = [];
    var state = null;

    var updateState = function () {
      if (stack.length > 0) {
        state = stack[stack.length - 1];
      } else {
        state = null;
      }
    }

    this.Push = function (newState) {
      stack.push(newState);
      updateState();
    }

    this.Pop = function () {
      stack.pop();
      updateState();
    }

    this.Process = function () {
      if (state != null) {
        state.Process();
      }
    }
  }


  function Meter(count, callback) {
    this.size = count;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    var values = [];

    this.setValue = function (updatedValue) {
      // Add and shift.  
      values.push(updatedValue);
      if (values.length > this.size) { values.shift(); }

      // Exit early if we've got a long-term match.
      for (var i = 0; i < (values.length - 1); i++) {
        if (values[i] !== values[i + 1]) return;
      }

      // We got here, so we've got a matching value collection.
      if (this.value !== values[0]) {
        //var fromZero = this.value === 0;
        //var toZero = values[0] === 0;      
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        callback();
      }
    }
  }

  window.requestAnimationFrame(update);
