    <script>
      var canvas, ctx;
      canvas = document.getElementById('exCanvas');
      ctx = canvas.getContext('2d');
      var width = 320;
      var height = 200;
      var effects = [];

      let gInGame = false
      let gAlpha = 1

      let InGameMeter = new Meter(4, inGameCallback)

      let EnergyCheckMeter = new Meter(5, energyCallback)
      let EnergyValMeter = new Meter(5, energyCallback)
      let EnergyVal2Meter = new Meter(5, energyCallback)
      let EnergyVal3Meter = new Meter(5, energyCallback)
      let HealthCheckMeter = new Meter(5, healthCallback)
      let HealthValMeter = new Meter(5, healthCallback)
      let HealthVal2Meter = new Meter(5, healthCallback)
      let HealthVal3Meter = new Meter(5, healthCallback)

      let SunMeter = new Meter(5, weatherCallback)
      let PetalsMeter = new Meter(5, weatherCallback)
      let LightningMeter = new Meter(5, weatherCallback)
      let FallLeavesMeter = new Meter(5, weatherCallback)
      let RainMeter = new Meter(5, weatherCallback)
      let SnowMeter = new Meter(5, weatherCallback)
      let GreenRainMeter = new Meter(5, weatherCallback)
      let FestivalMeter = new Meter(5,weatherCallback)
     
      function update() {
        DrawRect(0, 0, 320, 200, "black")
        backgroundHandler()

        if(gAlpha != ambienceAlpha) gAlpha += (ambienceAlpha - gAlpha) / 10

        InGameMeter.setValue(engine.vision.inGame1 + engine.vision.inGame2)

        if(gInGame){
          EnergyCheckMeter.setValue(engine.vision.energyCheck)
          EnergyValMeter.setValue(engine.vision.energyVal)
          EnergyVal2Meter.setValue(engine.vision.energyVal2)
          EnergyVal3Meter.setValue(engine.vision.energyVal3)

          HealthCheckMeter.setValue(engine.vision.healthCheck)
          HealthValMeter.setValue(engine.vision.healthVal)
          HealthVal2Meter.setValue(engine.vision.healthVal2)
          HealthVal3Meter.setValue(engine.vision.healthVal3)

          SunMeter.setValue(engine.vision.sunYellow)
          PetalsMeter.setValue(engine.vision.petalsPink)
          LightningMeter.setValue(engine.vision.lightningWhite)
          FallLeavesMeter.setValue(engine.vision.fallLeaves)
          RainMeter.setValue(engine.vision.umbrellaRain)
          SnowMeter.setValue(engine.vision.snow)
          GreenRainMeter.setValue(engine.vision.umbrellaGreenRain)
          FestivalMeter.setValue(engine.vision.festivalBlue)

        }
    
        effects.forEach((ele, i) => {
          ele.draw()
          if(ele.lifetime <= 0){
            effects.splice(i, 1)
          }
        })
    
        window.requestAnimationFrame(update);
      };

      let proBack = []
    function onbackColorChanged(){
      proBack = hexToHSL(backColor)
    }

    let backgroundEaseHue = 0;
    let backgroundEaseLit = 0;
    let backgroundEaseSat = 0
    let gCycle = 0
    function backgroundHandler(){
        switch(backgroundMode){
            case "Color Cycle": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${proBack[1]}%, ${proBack[2]}%, ${gAlpha / 100})`)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Color Cycle Ambience": 
            copyScreen(gAlpha / 100)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Custom": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${proBack[1]}%, ${proBack[2]}%, ${gAlpha / 100})`)
            break;
            case "Ambience": 
            copyScreen(gAlpha / 100)
            break;
            case "Custom Ambience": 
            copyScreen(gAlpha / 100)
            break;
            case "Ambience Audio Visualizer": 
            copyScreenAudio(gAlpha / 100)
            break;
            case "Custom Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${gAlpha / 100})`)
            break;
            case "Color Cycle Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${gAlpha / 100})`)
            break;
        }
    }

    function hexToHSL(hex) {
      var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  
      var r = parseInt(result[1], 16);
      var g = parseInt(result[2], 16);
      var b = parseInt(result[3], 16);
  
      (r /= 255), (g /= 255), (b /= 255);
      var max = Math.max(r, g, b),
        min = Math.min(r, g, b);
      var h,
        s,
        l = (max + min) / 2;
  
      if (max === min) {
        h = s = 0; // achromatic
      } else {
        var d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r:
            h = (g - b) / d + (g < b ? 6 : 0);
            break;
          case g:
            h = (b - r) / d + 2;
            break;
          case b:
            h = (r - g) / d + 4;
            break;
        }
        h /= 6;
      }
  
      s = s * 100;
      s = Math.round(s);
      l = l * 100;
      l = Math.round(l);
      h = Math.round(360 * h);
  
      return [h, s, l];
    }

    let audioScreenSat = 0
    let audioScreenLit = 0
    function copyScreenAudio(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      audioScreenSat += (engine.audio.density * 100 - audioScreenSat) / 10
      audioScreenLit += (engine.audio.density * 100 - audioScreenLit) / 10
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        ctx.fillStyle = `hsla(${hue[iZone]}, ${sat[iZone] * (audioScreenSat / 200 + .5)}%, ${lightness[iZone] * (audioScreenLit / 100)}%, ${alpha})`;
        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }
  
    function copyScreen(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        ctx.fillStyle = `hsla(${(backgroundMode == "Custom Ambience" ? proBack[0] : hue[iZone] + gCycle * (backgroundMode == "Color Cycle Ambience"))}, ${sat[iZone]}%, ${lightness[iZone]}%, ${alpha})`;
        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }

      function inGameCallback(){
        if(InGameMeter.value >= 1.8) gInGame = true
        else gInGame = false
      }

      let lowEnergyGoing = false
      function energyCallback(){
        if(gInGame && EnergyCheckMeter.value >= .95 && EnergyValMeter.value <= 0 && EnergyVal2Meter.value <= 0 &&EnergyVal3Meter.value > 0 && EnergyVal3Meter.value <= .5 && !lowEnergyGoing){
          lowEnergyGoing = true
          if(energyOn) effects.push(new lowEnergy())
        } else if (!gInGame || EnergyVal3Meter.value > .5) lowEnergyGoing = false
      }

      let lowHealthGoing = false
      function healthCallback(){
        if(gInGame && HealthCheckMeter.value >= .95 && HealthValMeter.value <= 0 && HealthVal2Meter.value <= 0 && HealthVal3Meter.value > 0 && HealthVal3Meter.value <= .5 && !lowHealthGoing){
          lowHealthGoing = true
          if(healthOn) effects.push(new lowHealth())
        } else if (!gInGame || HealthVal3Meter.value > .5) lowHealthGoing = false
      }

      let weatherGoing = false
      function weatherCallback(){
        if(SunMeter.value >= .95) weatherGoing = false
        if(gInGame && !weatherGoing && weatherOn){
          if (PetalsMeter.value >= .95){
            weatherGoing = true
            effects.push(new windy())
          } else if (LightningMeter.value >= .95){
            weatherGoing = true
            effects.push(new thunderstorm())
          } else if (FallLeavesMeter.value >= .95){
            weatherGoing = true
            effects.push(new windy())
          } else if (RainMeter.value >= .95){
            weatherGoing = true
            effects.push(new raining())
          } else if (SnowMeter.value >= .95 && PetalsMeter.value <= .1){
            weatherGoing = true
            effects.push(new snowing())
          } else if (GreenRainMeter.value >= .95){
            weatherGoing = true
            effects.push(new greenRain())
          }else if (FestivalMeter.value >= .95){
            weatherGoing = true
            effects.push(new rainingFest())
          }
        }
      }

    function greenRain(){
        this.count = 0
        gAlpha = .25
        this.draw = function(){
            this.count < 2 ? this.count++ : this.count = 0
            if(this.count == 0) effects.push(new gaindrop())
            if(!gInGame || GreenRainMeter.value <= .5){
              this.lifetime = 0
              weatherGoing = false
            }
            if(this.lifetime == 0) gAlpha = screenAlpha
        }
      }

      function gaindrop(){
        this.x = Math.random() * 320
        this.y = -15
        this.vy = .5
        this.draw = function(){
            DrawCircle(this.x, this.y, 15, "green")
            this.y < 330 ? this.y += this.vy : this.lifetime = 0
            this.vy += .05
        }
      }

      function thunderstorm(){
        this.count = 0
        this.count2 = 0
        this.alpha = 0
        gAlpha = .25
        this.draw = function(){
            DrawRect(0, 0, 320, 200, "hsla(0, 0%, 0%, .1)")
            this.count < 5 ? this.count++ : this.count = 0
            if(this.count == 0) {
                effects.push(new raindrop())
                this.count2 < 30 ? this.count2++ : this.count2 = 0
                if(this.count2 == 0) effects.push(new bolt())
            }
            if(!gInGame || LightningMeter.value <= .5){
              this.lifetime = 0
              weatherGoing = false
            }
            if(this.lifetime == 0) gAlpha = screenAlpha
        }
      }

      function bolt(){
        this.x = Math.random() * 320
        this.x2 = this.x
        this.y = 0
        this.points = [[this.x, this.y]]
        this.fade = false
        this.alpha = 1
        this.draw = function(){
          DrawRect(0, 0, 320, 200, `hsla(50, 100%, ${this.points.length * 1.5}%, ${this.alpha / 10})`)
          this.y < 250 ? this.y += 10 : this.fade = true
          this.x2 += Math.random() * 50 - 25
          if(!this.fade) this.points.push([this.x2, this.y])
          else this.alpha >= .025 ? this.alpha -= .025 : this.lifetime = 0
          ctx.beginPath()
          ctx.moveTo(this.x, 0)
          this.points.forEach((ele, i)=>{
            ctx.lineTo(ele[0], ele[1])
          })
          ctx.strokeStyle = `hsl(60, 100%, 75%, ${this.alpha})`
          ctx.lineWidth = 20
          ctx.stroke()
        }
      }

      function snowing(){
        this.count = 0
        this.draw = function(){
            this.count < 15 ? this.count++ : this.count = 0
            if(this.count == 0) effects.push(new snowflake())
            if(!gInGame || SnowMeter.value < .5){
              this.lifetime = 0
              weatherGoing = false
            }
        }
      }

      function snowflake(){
        this.x = Math.random() * 320
        this.y = -20
        this.mod = Math.random()
        this.draw = function(){
            DrawCircle(this.x, this.y, 20, "grey")
            this.x += Math.sin(Date.now() / 1000) * this.mod
            this.y < 220 ? this.y += .5 : this.lifetime = 0
        }
      }

      function windy(){
        this.count = 0
        this.draw = function(){
            this.count < 50 ? this.count++ : this.count = 0
            if(this.count == 0) effects.push(new petal())
            if(!gInGame || (PetalsMeter.value <= .5 && FallLeavesMeter.value < .5)){
              this.lifetime = 0
              weatherGoing = false
            }
        }
      }

      function petal(){
        this.y = Math.random() * 200
        this.x = -20
        this.mod = Math.random()
        this.rot = 0
        this.draw = function(){
            testTranslate([this.x, this.y], [-this.x, -this.y], this.rot, 1, 1)
            DrawRect(this.x - 30, this.y - 10, 60, 20, "hsl(330, 100%, 60%)")
            ctx.restore()
            this.x < 360 ? this.x += .5 : this.lifetime = 0
            this.y += Math.sin(Date.now() / 1000) / 2
            this.rot += .01 * this.mod
        }
      }

      function raining(){
        this.count = 0
        gAlpha = .25
        this.draw = function(){
            this.count < 2 ? this.count++ : this.count = 0
            if(this.count == 0) effects.push(new raindrop())
            if(!gInGame || RainMeter.value <= .5){
              this.lifetime = 0
              weatherGoing = false
            }
            if(this.lifetime == 0) gAlpha = screenAlpha
        }
      }

      function raindrop(){
        this.x = Math.random() * 320
        this.y = -15
        this.vy = .5
        this.draw = function(){
            DrawCircle(this.x, this.y, 15, "blue")
            this.y < 330 ? this.y += this.vy : this.lifetime = 0
            this.vy += .05
        }
      }

      function rainingFest() {
          this.count = 0;
          gAlpha = 0.25;
          this.draw = function () {
              this.count < 2 ? this.count++ : this.count = 0;
              if (this.count == 0) {
                  let colors = ["blue", "yellow", "green", "pink", "red"];
                  for (let i = 0; i < colors.length; i++) { 
                      effects.push(new raindropFest(colors[i]));
                  }
              }
              if (!gInGame || FestivalMeter.value <= 0.5) {
                  this.lifetime = 0;
                  weatherGoing = false;
              }
              if (this.lifetime == 0) gAlpha = screenAlpha;
          };
      }

      function raindropFest(color) {
          this.x = Math.random() * 320;
          this.y = -15;
          this.vy = 0.3;
          this.color = color; 
          this.draw = function () {
              DrawCircle(this.x, this.y, 15, this.color); 
              this.y < 330 ? this.y += this.vy : this.lifetime = 0;
              this.vy += 0.02;
          };
      }

      function lowEnergy(){
        this.x = -20
        this.half = false
        this.alpha = 1
        gAlpha = .05
        this.draw = function(){
            DrawRect(this.x, 0, 20, 200, `hsla(0, 100%, 50%, ${this.alpha})`)
            if(!this.half) this.x < 320 ? this.x += 3 : this.half = true
            else this.x > -20 ? this.x -= 3 : this.half = false
            this.alpha >= .001 ? this.alpha -= .001 : this.lifetime = 0
            if(!gInGame || EnergyVal3Meter.value >.5) this.lifetime = 0
            if(this.lifetime == 0) {
              gAlpha = screenAlpha
              lowEnergyGoing = false
            }
        }
      }

      function lowHealth(){
        this.count = 0
        gAlpha = .25
        this.draw = function(){
            this.count < 2 ? this.count++ : this.count = 0
            if(this.count == 0) effects.push(new bloodHelp())
            if(!gInGame || HealthVal3Meter.value >= .5){
              this.lifetime = 0
              lowHealthGoing = false
            }
            if(this.lifetime == 0) gAlpha = screenAlpha
        }
      }

      function bloodHelp(){
        this.x = Math.random() * 320
        this.y = -15
        this.vy = .5
        this.draw = function(){
            DrawCircle(this.x, this.y, 15, "red")
            this.y < 330 ? this.y += this.vy : this.lifetime = 0
            this.vy += .05
        }
      }
  
    function innerEffects(){
          this.effects = []
          this.Add = (cb, arr) => {
              this.effects.push(new cb(...arr))
          }
          this.draw = () => {
              this.effects.forEach((ele, i)=>{
                  ele.draw()
                  if(ele.lifetime <= 0) this.effects.splice(i, 1)
              })
          }
      }
  
      function testTranslate(start, end, rot, scaleX, scaleY){
          ctx.save()
          ctx.translate(start[0], start[1])
          ctx.scale(scaleX, scaleY)
          ctx.rotate(rot)
          ctx.translate(end[0], end[1])
      }
  
    function DrawCircle(x, y, radius, color) {
      ctx.beginPath();
      ctx.fillStyle = color;
      ctx.arc(x, y, radius, 0, 2 * Math.PI)
      ctx.fill();
    };
  
    function DrawRect(x, y, width, height, color) {
      ctx.beginPath();
      ctx.fillStyle = color;
      ctx.fillRect(x, y, width, height);
    };
  
    function Meter(size, callback) {
      this.size = size;
      this.value = 0;
      this.diff = 0;
      this.increased = false;
      this.decreased = false;
      var values = [];
  
      this.setValue = function (updatedValue) {
        values.push(updatedValue);
        if (values.length > this.size) {
          values.shift();
        }
  
        for (var i = 0; i < values.length - 1; i++) {
          if (values[i] !== values[i + 1]) return;
        }
        if (this.value !== values[0]) {
          this.diff = Math.abs(this.value - values[0]);
          this.increased = this.value < values[0];
          this.decreased = this.value > values[0];
          this.value = values[0];
          callback();
        }
      }
    }
  
    window.requestAnimationFrame(update);
  </script>
