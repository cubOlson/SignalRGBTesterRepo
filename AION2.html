       VISION METERS
       Each meter captures a small region of the game screen and
       measures what percentage of its pixels match the given HSL
       range. The JS Meter class smooths readings over N frames
       before firing a callback.

       Detection strategy: every game state uses a POSITIVE meter
       (confirms the expected color IS present) paired with a
       NEGATIVE "Not" meter (confirms the region does NOT show that
       color during baseline/off state). A state is considered active
       only when positive is high AND negative is low, preventing
       false positives from ambient lighting or UI transitions.

       TESTER NOTE: If an effect never fires, first check the QA Tool
       — load a screenshot from the target resolution and verify the
       meter region actually captures the right pixels at the right
       color. Then adjust HSL ranges or region coordinates as needed.

<body style="margin: 0; padding: 0; background: #000;">
    <canvas id="exCanvas" width="320" height="200"></canvas>
</body>

<script>
    // ═══════════════════════════════════════════════════════════
    // CANVAS SETUP
    // SignalRGB renders this 320x200 canvas onto the device layout.
    // All effects draw to the hidden canvas, composited to ctx once per frame.
    // ═══════════════════════════════════════════════════════════
    const canvas = document.getElementById('exCanvas');
    const ctx    = canvas.getContext('2d');
    const width  = 320;
    const height = 200;

    const hiddenCanvas = document.createElement('canvas');
    hiddenCanvas.width  = 320;
    hiddenCanvas.height = 200;
    const hiddenCtx = hiddenCanvas.getContext('2d');

    let effects = [];

    //#region Update
    function update() {
        DrawRect(0, 0, 320, 200, 'black')
        backgroundHandler()

        inGameBlack_Meter.setValue(engine.vision.inGameBlack)
        inGameWhite_Meter.setValue(engine.vision.inGameWhite)
        inGameNotWhite_Meter.setValue(engine.vision.inGameNotWhite)
        actionBlue_Meter.setValue(engine.vision.actionBlue)
        actionNotBlue_Meter.setValue(engine.vision.actionNotBlue)
        deathTextWhite_Meter.setValue(engine.vision.deathTextWhite)
        deathNotWhite_Meter.setValue(engine.vision.deathNotWhite)
        deathTextWhite2_Meter.setValue(engine.vision.deathTextWhite2)
        fightRed_Meter.setValue(engine.vision.fightRed)
        fightTextYellow_Meter.setValue(engine.vision.fightTextYellow)
        fightNotRed_Meter.setValue(engine.vision.fightNotRed)
        flyBlueBar_Meter.setValue(engine.vision.flyBlueBar)
        flyNotBlue_Meter.setValue(engine.vision.flyNotBlue)
        gatherGreenBar_Meter.setValue(engine.vision.gatherGreenBar)
        gatherSucessBlue_Meter.setValue(engine.vision.gatherSucessBlue)
        gatherFailOrange_Meter.setValue(engine.vision.gatherFailOrange)
        healthRedBar_Meter.setValue(engine.vision.healthRedBar)
        manaBlueBar_Meter.setValue(engine.vision.manaBlueBar)
        questWhite_Meter.setValue(engine.vision.questWhite)
        questTextWhite_Meter.setValue(engine.vision.questTextWhite)
        questNotWhite_Meter.setValue(engine.vision.questNotWhite)
        travelBlue2_Meter.setValue(engine.vision.travelBlue2)
        travelBlue1_Meter.setValue(engine.vision.travelBlue1)
        travelNotBlue_Meter.setValue(engine.vision.travelNotBlue)

        if (damageCool > 0) damageCool--

        effects.forEach(ele => { ele.draw() })
        effects = effects.filter(ele => !(ele.lifetime <= 0))

        DrawHUD()
        ctx.drawImage(hiddenCanvas, 0, 0)
        window.requestAnimationFrame(update)
    }
    //#endregion

    //#region Meter Declarations

    // -------------------------------------------------------------------------
    // Meter objects. Positive + "Not" pairs share ONE callback. Event meters use
    // smoothing ~3-5; the health/mana bars use 3 and are eased in DrawHUD.
    // -------------------------------------------------------------------------
    const inGameBlack_Meter = new Meter(3, inGameDetect)
    const inGameWhite_Meter = new Meter(3, inGameDetect)
    const inGameNotWhite_Meter = new Meter(3, inGameDetect)
    const actionBlue_Meter = new Meter(5, actionCallback)
    const actionNotBlue_Meter = new Meter(5, actionCallback)
    const deathTextWhite_Meter = new Meter(5, deathCallback)
    const deathNotWhite_Meter = new Meter(5, deathCallback)
    const deathTextWhite2_Meter = new Meter(5, deathCallback)
    const fightRed_Meter = new Meter(5, fightCallback)
    const fightTextYellow_Meter = new Meter(5, fightCallback)
    const fightNotRed_Meter = new Meter(5, fightCallback)
    const flyBlueBar_Meter = new Meter(5, flyCallback)
    const flyNotBlue_Meter = new Meter(5, flyCallback)
    const gatherGreenBar_Meter = new Meter(5, gatherCallback)
    const gatherSucessBlue_Meter = new Meter(3, () => "")
    const gatherFailOrange_Meter = new Meter(3, () => "")
    const healthRedBar_Meter = new Meter(3, useHealth)
    const manaBlueBar_Meter = new Meter(3, useMana)
    const questWhite_Meter = new Meter(5, questCallback)
    const questTextWhite_Meter = new Meter(5, questCallback)
    const questNotWhite_Meter = new Meter(5, questCallback)
    const travelBlue2_Meter = new Meter(5, travelCallback)
    const travelBlue1_Meter = new Meter(5, travelCallback)
    const travelNotBlue_Meter = new Meter(5, travelCallback)
    //#endregion

    //#region Callbacks

    // -------------------------------------------------------------------------
    // Global gameplay gate + per-effect latches (set true on spawn, cleared when
    // the positive meter drops, so each event fires once per occurrence).
    // Thresholds are QA-tunable starting points.
    // -------------------------------------------------------------------------
    let gInGame = false
    let actionGoing = false
    let gatherGoing = false
    let questGoing = false
    let fightGoing = false
    let deathGoing = false
    let lowHealthGoing = false
    let lowManaGoing = false
    let flyGoing = false
    let travelGoing = false
    let prevHp = 1          // last HP reading, to detect a drop (Damage is change-based)
    let damageCool = 0      // frames to suppress a repeat Damage

    // Current bar fills (0..1). The health bar may read red, so take the stronger.
    function currentHp() { return Math.max(healthRedBar_Meter.value) }
    function currentMana() { return manaBlueBar_Meter.value }

    function useHealth() {
        healthCallback()
    }

    function useMana() {
        manaCallback()
    }

    // In game while the HUD marker is on screen: black + white markers present and the
    // "not white" region (shared with the death text) clear.
    function inGameDetect() {
        let inGame = inGameBlack_Meter.value >= .9 && inGameWhite_Meter.value >= .4 && inGameNotWhite_Meter.value < .1
        if (inGame && !gInGame) {
            gInGame = true
        } else if (!inGame && gInGame) {
            gInGame = false
        }
    }

    // Action — blue "hold to interact" bar appears (search, heal, ...)
    function actionCallback() {
        if (gInGame && enableAction && actionBlue_Meter.value >= .95 && actionNotBlue_Meter.value < .1 && !actionGoing) {
            effects.push(new Action()); actionGoing = true
        } else if (actionBlue_Meter.value < .1) {
            actionGoing = false
        }
    }

    // Gather — green gather bar is up; the Gather effect lingers and its fills follow
    // the success (blue) and fail (orange) bars until the bar disappears.
    function gatherCallback() {
        if (gInGame && enableGather && gatherGreenBar_Meter.value >= .95 && !gatherGoing) {
            effects.push(new Gather()); gatherGoing = true
        } else if (gatherGreenBar_Meter.value < .1) {
            gatherGoing = false
        }
    }

    // Quest — white star + white text on the quest banner
    function questCallback() {
        if (enableQuest && questWhite_Meter.value >= .95 && (questTextWhite_Meter.value >= .1 && questTextWhite_Meter.value <.3) && questNotWhite_Meter.value < .1 && !questGoing) {
            effects.push(new Quest()); questGoing = true
        } else if (questWhite_Meter.value < .1 || questTextWhite_Meter.value < .02) {
            questGoing = false
        }
    }

    // Fight — enemy/boss red HP bar + yellow boss name appear
    function fightCallback() {
        if (gInGame && enableFight && fightRed_Meter.value >= .95 && fightTextYellow_Meter.value >= .2 && fightNotRed_Meter.value < .1 && !fightGoing) {
            effects.push(new Fight()); fightGoing = true
        } else if (fightRed_Meter.value < .1) {
            fightGoing = false
        }
    }

    // Death — white death text on the defeat screen
    function deathCallback() {
        if (!gInGame && enableDeath && (deathTextWhite_Meter.value >= .2 && deathTextWhite_Meter.value < .5) && (deathTextWhite2_Meter.value >= .2 && deathTextWhite2_Meter.value < .5) && deathNotWhite_Meter.value < .1 && !deathGoing) {
            effects.push(new Death()); deathGoing = true
        } else if (deathTextWhite_Meter.value < .02 || deathTextWhite2_Meter.value < .02) {
            deathGoing = false
        }
    }

    // Fly — blue flight bar appears (lingering while airborne)
    function flyCallback() {
        if (gInGame && enableFly && flyBlueBar_Meter.value >= .3 && flyNotBlue_Meter.value < .1 && !flyGoing) {
            effects.push(new Fly()); flyGoing = true
        } else if (flyBlueBar_Meter.value < .1) {
            flyGoing = false
        }
    }

    // Travel — blue boxes on the auto-path indicator (lingering)
    function travelCallback() {
        if (gInGame && enableTravel && travelBlue1_Meter.value >= .95 && travelBlue2_Meter.value >= .5 && travelNotBlue_Meter.value < .1 && !travelGoing) {
            effects.push(new Travel()); travelGoing = true
        } else if (travelBlue1_Meter.value < .1 || travelBlue2_Meter.value < .1) {
            travelGoing = false
        }
    }

    // Health — a drop fires Damage (once); critically low fires Low Health (lingering)
    function healthCallback() {
        let hp = currentHp()

        // Out of game: keep prevHp fresh so loading in never reads as a "drop".
        if (!gInGame) { prevHp = hp; lowHealthGoing = false; return }

        if (enableDamage && (prevHp - hp) >= 0.03 && hp > 0.02 && damageCool === 0) {
            effects.push(new Damage())
            damageCool = 20
        }
        prevHp = hp

        if (enableLowHealth && hp <= 0.3 && hp > 0.02 && !lowHealthGoing) {
            effects.push(new LowHealth()); lowHealthGoing = true
        } else if (hp > 0.35 || hp <= 0.02) {
            lowHealthGoing = false
        }
    }

    // Mana — critically low fires Low Mana (lingering)
    function manaCallback() {
        let mp = currentMana()
        if (!gInGame) { lowManaGoing = false; return }
        if (enableLowMana && mp <= 0.2 && mp > 0.02 && !lowManaGoing) {
            effects.push(new LowMana()); lowManaGoing = true
        } else if (mp > 0.35 || mp <= 0.02) {
            lowManaGoing = false
        }
    }
    //#endregion

    //#region Background Modes
    // ═══════════════════════════════════════════════════════════
    // BACKGROUND SYSTEM
    // Eight modes selected by the backgroundMode control.
    // ═══════════════════════════════════════════════════════════
    let proBack = [0, 0, 0]
    function onbackColorChanged() {
        proBack = hexToHSL(backColor)
    }

    let audioEase = { sat: 0, lit: 0 }
    let gCycle = 0

    function updateAudioEase() {
        const targetDensity = engine.audio.density * 100
        audioEase.sat += (targetDensity - audioEase.sat) / 10
        audioEase.lit += (targetDensity - audioEase.lit) / 10
    }

    function getColorString(hue, sat, lit, alpha) {
        return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`
    }

    function updateColorCycle() {
        gCycle = (gCycle + 0.5) % 360
    }

    function backgroundHandler() {
        const alpha = ambienceAlpha / 100

        if (backgroundMode.includes('Color Cycle')) updateColorCycle()
        if (backgroundMode.includes('Audio'))       updateAudioEase()

        if (backgroundMode.includes('Ambience')) {
            if (backgroundMode === 'Ambience Audio Visualizer') {
                copyScreenAudio(alpha)
            } else {
                copyScreen(alpha)
            }
            return
        }

        const hue = proBack[0] + (backgroundMode.includes('Color Cycle') ? gCycle : 0)
        const sat = backgroundMode.includes('Audio') ? audioEase.sat * 0.33 + 66 : proBack[1]
        const lit = backgroundMode.includes('Audio') ? audioEase.lit * 0.9  + 10 : proBack[2]
        DrawRect(0, 0, 320, 200, getColorString(hue, sat, lit, alpha))
    }

    const ZONE_COLS   = 28
    const ZONE_ROWS   = 20
    const TOTAL_ZONES = ZONE_COLS * ZONE_ROWS

    function copyScreenAudio(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat       = new Int8Array(engine.zone.saturation)
        const hue       = new Int16Array(engine.zone.hue)
        const w = 320 / ZONE_COLS
        const h = 200 / ZONE_ROWS
        const satMultiplier = audioEase.sat / 200 + 0.5
        const litMultiplier = audioEase.lit / 100
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            hiddenCtx.fillStyle = getColorString(
                hue[iZone],
                sat[iZone] * satMultiplier,
                lightness[iZone] * litMultiplier,
                alpha
            )
            hiddenCtx.fillRect(col * w, row * h, w, h)
        }
    }

    function copyScreen(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat       = new Int8Array(engine.zone.saturation)
        const hue       = new Int16Array(engine.zone.hue)
        const w = 320 / ZONE_COLS
        const h = 200 / ZONE_ROWS
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const finalHue = backgroundMode === 'Custom Ambience'
                ? proBack[0]
                : hue[iZone] + (backgroundMode === 'Color Cycle Ambience' ? gCycle : 0)
            hiddenCtx.fillStyle = getColorString(finalHue, sat[iZone], lightness[iZone], alpha)
            hiddenCtx.fillRect(col * w, row * h, w, h)
        }
    }

    //#region Helper Functions
    // ═══════════════════════════════════════════════════════════
    // HELPER FUNCTIONS — draw primitives target hiddenCtx
    // ═══════════════════════════════════════════════════════════
    function DrawRect(x, y, w, h, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.fillRect(x, y, w, h)
    }

    function strokeRect(x, y, w, h, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.rect(x, y, w, h)
        hiddenCtx.stroke()
    }

    function DrawCircle(x, y, radius, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
        hiddenCtx.fill()
    }

    function DrawStroke(x, y, radius, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
        hiddenCtx.stroke()
    }

    function DrawLine(start, end, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.moveTo(start[0], start[1])
        hiddenCtx.lineTo(end[0], end[1])
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.stroke()
    }

    function DrawArc(x, y, start, end, radius, direction, color) {
        hiddenCtx.beginPath()
        hiddenCtx.arc(x, y, radius, start, end, direction)
        hiddenCtx.fillStyle = color
        hiddenCtx.fill()
    }

    function DrawEllipse(x, y, w, h, rotation, color) {
        hiddenCtx.beginPath()
        hiddenCtx.ellipse(x, y, w, h, rotation, 0, Math.PI * 2)
        hiddenCtx.fillStyle = color
        hiddenCtx.fill()
    }

    function DrawTriangle(x1, y1, x2, y2, x3, y3, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.moveTo(x1, y1)
        hiddenCtx.lineTo(x2, y2)
        hiddenCtx.lineTo(x3, y3)
        hiddenCtx.lineTo(x1, y1)
        hiddenCtx.fill()
    }

    function DrawPath(x, y, path, color, scaleX, scaleY) {
        hiddenCtx.fillStyle = color
        hiddenCtx.save()
        hiddenCtx.translate(x, y)
        hiddenCtx.scale(scaleX, scaleY)
        hiddenCtx.fill(new Path2D(path))
        hiddenCtx.restore()
    }

    function hexToRgb(hex) {
        var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex)
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : null
    }

    function hexToHSL(hex) {
        const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || []
        const rgb = [r, g, b].map(x => parseInt(x, 16) / 255)
        const max = Math.max(...rgb)
        const min = Math.min(...rgb)
        const l = (max + min) / 2
        if (max === min) return [0, 0, Math.round(l * 100)]
        const d = max - min
        const s = l > 0.5 ? d / (2 - max - min) : d / (max + min)
        let h
        const [nr, ng, nb] = rgb
        if      (max === nr) h = (ng - nb) / d + (ng < nb ? 6 : 0)
        else if (max === ng) h = (nb - nr) / d + 2
        else                 h = (nr - ng) / d + 4
        return [Math.round(h * 60), Math.round(s * 100), Math.round(l * 100)]
    }

    // Meter(size, callback): frame-stabilizing debouncer for vision signals.
    function Meter(size, callback) {
        this.size = size
        this.value = 0
        this.diff = 0
        this.increased = false
        this.decreased = false
        var values = []
        this.setValue = function (updatedValue) {
            values.push(updatedValue)
            if (values.length > this.size) values.shift()
            for (var i = 0; i < values.length - 1; i++) {
                if (values[i] !== values[i + 1]) return
            }
            if (this.value !== values[0]) {
                this.diff = Math.abs(this.value - values[0])
                this.increased = this.value < values[0]
                this.decreased = this.value > values[0]
                this.value = values[0]
                callback()
            }
        }
    }

    function onCanvasTapped(x, y) {}

    //#region HUD
    // Health and mana bars are HUD elements (not pooled effects): drawn every frame
    // right before the hidden canvas is composited. The fill is eased so noisy vision
    // readings do not jitter the bar. While out of game, the Adjust toggle draws both
    // bars full-size so they can be positioned.
    let hpShown = 0
    let mpShown = 0

    function DrawHUD() {
        hpShown += (Math.min(1, currentHp() / 0.9) - hpShown) / 8
        mpShown += (Math.min(1, currentMana() / 0.9) - mpShown) / 8
        if (gInGame) {
            if (enableHP)   DrawRect(HealthBarX * 3.2, HealthBarY * 2, hpShown * (HealthBarWidth * 3.2), HealthBarHeight * 2, healthColor)
            if (enableMana) DrawRect(ManaBarX * 3.2, ManaBarY * 2, mpShown * (ManaBarWidth * 3.2), ManaBarHeight * 2, manaColor)
        } else if (adjToggle) {
            if (enableHP)   DrawRect(HealthBarX * 3.2, HealthBarY * 2, HealthBarWidth * 3.2, HealthBarHeight * 2, healthColor)
            if (enableMana) DrawRect(ManaBarX * 3.2, ManaBarY * 2, ManaBarWidth * 3.2, ManaBarHeight * 2, manaColor)
        }
    }

    //#region Effects

    // ═══════════════════════════════════════════════════════════
    // AION2 PALETTE
    // HP red (hue 355), MP blue (hue 210), gold trim (hue 45),
    // Elyos sky / Asmodian violet accents, soul-wisp cyan (hue 185).
    // ═══════════════════════════════════════════════════════════
    const HP_HUE = 355
    const MP_HUE = 210
    const GOLD_HUE = 45

    // Edge glow: transparent in the middle, colored toward the screen edges.
    function Vignette(hue, sat, lit, alpha, inner) {
        var g = hiddenCtx.createRadialGradient(160, 100, inner, 160, 100, 200)
        g.addColorStop(0, 'hsla(' + hue + ', ' + sat + '%, ' + lit + '%, 0)')
        g.addColorStop(1, 'hsla(' + hue + ', ' + sat + '%, ' + lit + '%, ' + alpha + ')')
        hiddenCtx.fillStyle = g
        hiddenCtx.fillRect(0, 0, 320, 200)
    }

    // 0 -> 1 -> 0 envelope for a one-shot of `dur` frames with `fade` frames in/out.
    function Env(frame, dur, fade) {
        return Math.max(0, Math.min(1, Math.min(frame / fade, (dur - frame) / fade)))
    }

    // Fight: one-shot "engage" — two blades slam in from the sides and clash at
    // the center with a white flash, shockwave, sparks and a screen shake.
    function Fight() {
        this.lifetime = 1
        this.frame = 0
        this.dur = 130
        this.hit = 26
        this.sparks = []

        this.sword = function (dir, slide, glow) {
            hiddenCtx.save()
            hiddenCtx.translate(160 + dir * (-100 - slide), 170)
            hiddenCtx.scale(dir, 1)
            hiddenCtx.rotate(-0.6)
            if (glow > 0) {
                DrawEllipse(80, 0, 110, 26, 0, 'hsla(25, 100%, 60%, ' + (0.4 * glow) + ')')
            }
            DrawRect(0, -9, 140, 18, 'hsla(210, 25%, 88%, 1)')
            DrawTriangle(140, -9, 140, 9, 175, 0, 'hsla(210, 25%, 88%, 1)')
            DrawRect(0, -3, 150, 5, 'hsla(210, 40%, 100%, 0.8)')
            DrawRect(-6, -30, 14, 60, 'hsla(45, 80%, 55%, 1)')
            DrawRect(-48, -7, 42, 14, 'hsla(20, 60%, 30%, 1)')
            DrawCircle(-52, 0, 10, 'hsla(45, 80%, 55%, 1)')
            hiddenCtx.restore()
        }

        this.draw = function () {
            this.frame++
            var f = this.frame
            if (f >= this.dur) { this.lifetime = 0; return }
            var e = Env(f, this.dur, 25)
            var clashed = f >= this.hit

            hiddenCtx.save()
            if (clashed && f < this.hit + 14) {
                hiddenCtx.translate((Math.random() - 0.5) * 16, (Math.random() - 0.5) * 10)
            }
            DrawRect(-20, -20, 360, 240, 'hsla(5, 70%, 8%, ' + (0.7 * Math.min(1, f / 15)) + ')')
            Vignette(8, 100, 30, 0.7 * Math.min(1, f / 15) * (clashed ? 1 : 0.5), 40)

            var slide = clashed ? 0 : 300 * Math.pow(1 - f / this.hit, 2)
            var glow = clashed ? e : 0
            this.sword(1, slide, glow)
            this.sword(-1, slide, glow)

            if (f === this.hit) {
                for (var i = 0; i < 34; i++) {
                    var a = Math.random() * Math.PI * 2
                    var v = 2 + Math.random() * 6
                    this.sparks.push({ x: 160, y: 100, vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.7, life: 0 })
                }
            }
            if (clashed) {
                var t = (f - this.hit) / (this.dur - this.hit)
                if (f - this.hit < 8) {
                    DrawRect(-20, -20, 360, 240, 'hsla(40, 100%, 95%, ' + (0.9 * (1 - (f - this.hit) / 8)) + ')')
                }
                DrawStroke(160, 100, t * 240, 'hsla(30, 100%, 75%, ' + ((1 - t) * 0.9) + ')', 22 * (1 - t) + 6)
                DrawCircle(160, 100, 26 * (1 - t) + 8, 'hsla(45, 100%, 92%, ' + (0.9 * (1 - t)) + ')')
            }
            for (var j = this.sparks.length - 1; j >= 0; j--) {
                var s = this.sparks[j]
                s.life++
                s.x += s.vx
                s.y += s.vy
                s.vy += 0.1
                if (s.life > 45) { this.sparks.splice(j, 1); continue }
                DrawCircle(s.x, s.y, 8, 'hsla(35, 100%, 62%, ' + (1 - s.life / 45) + ')')
            }
            hiddenCtx.restore()
        }
    }

    // Death: red drains to grey, the vignette closes in, soul wisps rise, then black.
    function Death() {
        this.lifetime = 1
        this.frame = 0
        this.dur = 420
        this.wisps = []

        this.draw = function () {
            this.frame++
            var f = this.frame
            if (f >= this.dur) { this.lifetime = 0; return }
            var p = f / this.dur
            var sat = Math.max(0, 100 - p * 120)
            DrawRect(0, 0, 320, 200, 'hsla(0, ' + sat + '%, ' + (26 - p * 14) + '%, ' + Math.min(1, 0.6 + p * 0.6) + ')')

            // iris closing from the edges
            var g = hiddenCtx.createRadialGradient(160, 100, Math.max(0, 150 - p * 160), 160, 100, 220 - p * 120)
            g.addColorStop(0, 'hsla(0, 0%, 0%, 0)')
            g.addColorStop(1, 'hsla(0, 0%, 0%, 0.8)')
            hiddenCtx.fillStyle = g
            hiddenCtx.fillRect(0, 0, 320, 200)

            if (p < 0.8 && Math.random() < 0.18) {
                this.wisps.push({ x: 60 + Math.random() * 200, y: 210, vy: 0.6 + Math.random(), ph: Math.random() * 6, life: 0 })
            }
            for (var i = this.wisps.length - 1; i >= 0; i--) {
                var w = this.wisps[i]
                w.life++
                w.y -= w.vy
                var wx = w.x + Math.sin(w.life * 0.06 + w.ph) * 14
                if (w.y < -10) { this.wisps.splice(i, 1); continue }
                DrawCircle(wx, w.y, 24, 'hsla(185, 80%, 75%, 0.25)')
                DrawCircle(wx, w.y, 11, 'hsla(185, 90%, 90%, 0.9)')
            }

            // final fade to black
            if (p > 0.85) {
                DrawRect(0, 0, 320, 200, 'hsla(0, 0%, 0%, ' + ((p - 0.85) / 0.15) + ')')
            }
        }
    }

    // Damage: one-shot hit — red flash, three claw slashes, shaken edge glow.
    function Damage() {
        this.lifetime = 1
        this.frame = 0
        this.dur = 60
        this.ang = (Math.random() - 0.5) * 0.8

        this.draw = function () {
            this.frame++
            if (this.frame >= this.dur) { this.lifetime = 0; return }
            var t = this.frame / this.dur
            var a = Math.pow(1 - t, 1.6)
            DrawRect(0, 0, 320, 200, 'hsla(' + HP_HUE + ', 100%, 35%, ' + (0.6 * a) + ')')
            Vignette(HP_HUE, 100, 25, 0.9 * a, 30)
            hiddenCtx.save()
            hiddenCtx.translate(160, 100)
            hiddenCtx.rotate(-0.6 + this.ang)
            var grow = Math.min(1, t * 6)
            for (var i = -1; i <= 1; i++) {
                DrawRect(-190 * grow, i * 44 - 7, 380 * grow, 16 * (1 - t) + 4, 'hsla(0, 0%, 96%, ' + a + ')')
                DrawRect(-190 * grow, i * 44 - 15, 380 * grow, 32 * (1 - t) + 4, 'hsla(' + HP_HUE + ', 100%, 50%, ' + (0.6 * a) + ')')
            }
            hiddenCtx.restore()
        }
    }

    // LowHealth: red double-thump heartbeat vignette. Loops while health is low.
    function LowHealth() {
        this.lifetime = 99999
        this.frame = 0
        this.alpha = 0

        this.draw = function () {
            this.frame++
            this.alpha = lowHealthGoing ? Math.min(1, this.alpha + 1 / 30) : this.alpha - 1 / 30
            if (!lowHealthGoing && this.alpha <= 0) { this.lifetime = 0; return }
            var t = (this.frame % 66) / 66
            var beat = Math.max(Math.exp(-Math.pow((t - 0.05) * 12, 2)), 0.7 * Math.exp(-Math.pow((t - 0.28) * 12, 2)))
            DrawRect(0, 0, 320, 200, 'hsla(0, 0%, 0%, ' + this.alpha + ')')
            Vignette(HP_HUE, 100, 28 + 20 * beat, (0.55 + 0.4 * beat) * this.alpha, 25 + 10 * (1 - beat))
        }
    }

    // LowMana: blue double-thump pulse vignette, same rhythm as LowHealth. Loops while mana is low.
    function LowMana() {
        this.lifetime = 99999
        this.frame = 0
        this.alpha = 0

        this.draw = function () {
            this.frame++
            this.alpha = lowManaGoing ? Math.min(1, this.alpha + 1 / 30) : this.alpha - 1 / 30
            if (!lowManaGoing && this.alpha <= 0) { this.lifetime = 0; return }
            var t = (this.frame % 66) / 66
            var beat = Math.max(Math.exp(-Math.pow((t - 0.05) * 12, 2)), 0.7 * Math.exp(-Math.pow((t - 0.28) * 12, 2)))
            DrawRect(0, 0, 320, 200, 'hsla(0, 0%, 0%, ' + this.alpha + ')')
            Vignette(MP_HUE, 100, 28 + 20 * beat, (0.55 + 0.4 * beat) * this.alpha, 25 + 10 * (1 - beat))
        }
    }

    // Action: channeled action (search, heal...) — a progress ring fills clockwise
    // then a flash and shockwave on completion.
    function Action() {
        this.lifetime = 1
        this.frame = 0
        this.dur = 170
        this.fill = 120

        this.draw = function () {
            this.frame++
            var f = this.frame
            if (f >= this.dur) { this.lifetime = 0; return }
            var e = Env(f, this.dur, 25)
            var p = Math.min(1, f / this.fill)
            DrawRect(0, 0, 320, 200, 'hsla(0, 0%, 0%, ' + e + ')')

            DrawStroke(160, 100, 70, 'hsla(150, 50%, 20%, ' + e + ')', 32)
            hiddenCtx.beginPath()
            hiddenCtx.arc(160, 100, 70, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2)
            hiddenCtx.strokeStyle = 'hsla(145, 100%, 65%, ' + e + ')'
            hiddenCtx.lineWidth = 32
            hiddenCtx.stroke()
            DrawCircle(160, 100, 22 + 14 * p, 'hsla(145, 100%, 85%, ' + (0.8 * e) + ')')

            if (f >= this.fill) {
                var t = (f - this.fill) / (this.dur - this.fill)
                DrawRect(0, 0, 320, 200, 'hsla(140, 100%, 90%, ' + (0.7 * (1 - t)) + ')')
                DrawStroke(160, 100, 70 + t * 190, 'hsla(140, 100%, 85%, ' + (1 - t) + ')', 40 * (1 - t) + 8)
            }
        }
    }

    // Gather: success (blue) fills the screen from the LEFT by the success bar's value,
    // fail (orange) fills from the RIGHT by the fail bar's value. When the two meet they
    // split at a straight white line in proportion to each other. When gathering ends,
    // the winning color floods the rest of the screen and fades out.
    function Gather() {
        this.lifetime = 99999
        this.frame = 0
        this.sparks = []
        this.sv = 0        // displayed success fill (0..1)
        this.fv = 0        // displayed fail fill (0..1)
        this.finT = 0
        this.fade = 1
        this.blueWins = true
        this.flashed = false
        this.flashT = 0

        this.draw = function () {
            this.frame++
            var f = this.frame
            var sT = gatherSucessBlue_Meter.value
            var fT = gatherFailOrange_Meter.value

            if (gatherGoing) {
                this.blueWins = sT >= fT
            } else {
                // gathering ended: the winner floods the screen, the loser drains away
                this.finT++
                sT = this.blueWins ? 1 : 0
                fT = this.blueWins ? 0 : 1
                if (this.finT > 35) { this.fade -= 1 / 25 }
                if (this.fade <= 0) { this.lifetime = 0; return }
            }
            var k = gatherGoing ? 0.15 : 0.12
            this.sv += (sT - this.sv) * k
            this.fv += (fT - this.fv) * k

            // blue edge grows right from x=0, orange edge grows left from x=320;
            // if they would overlap, split where they meet in proportion to each value
            var blueEdge = this.sv * 320
            var orangeEdge = 320 - this.fv * 320
            if (blueEdge > orangeEdge) {
                var seam = this.sv / (this.sv + this.fv) * 320
                blueEdge = seam
                orangeEdge = seam
            }

            var e = Math.min(1, f / 20) * this.fade
            DrawRect(0, 0, 320, 200, 'hsla(0, 0%, 0%, ' + e + ')')

            if (blueEdge > 0.5) {
                var bl = hiddenCtx.createLinearGradient(0, 0, 320, 0)
                bl.addColorStop(0, 'hsla(215, 100%, 40%, ' + e + ')')
                bl.addColorStop(1, 'hsla(205, 100%, 58%, ' + e + ')')
                hiddenCtx.fillStyle = bl
                hiddenCtx.fillRect(0, 0, blueEdge, 200)
            }
            if (orangeEdge < 319.5) {
                var og = hiddenCtx.createLinearGradient(0, 0, 320, 0)
                og.addColorStop(0, 'hsla(28, 100%, 38%, ' + e + ')')
                og.addColorStop(1, 'hsla(28, 100%, 55%, ' + e + ')')
                hiddenCtx.fillStyle = og
                hiddenCtx.fillRect(orangeEdge, 0, 320 - orangeEdge, 200)
            }

            // straight white line on each leading edge, with sparks
            var edges = []
            if (blueEdge > 0.5 && blueEdge < 319.5) { edges.push([blueEdge, 210]) }
            if (orangeEdge < 319.5 && orangeEdge > 0.5 && orangeEdge !== blueEdge) { edges.push([orangeEdge, 30]) }
            for (var i = 0; i < edges.length; i++) {
                var x = edges[i][0]
                DrawLine([x, 0], [x, 200], 'hsla(40, 100%, 85%, ' + (0.35 * e) + ')', 26)
                DrawLine([x, 0], [x, 200], 'hsla(0, 0%, 100%, ' + e + ')', 8)
                if (Math.random() < 0.7) {
                    var sy = Math.random() * 200
                    var a = Math.random() * Math.PI * 2
                    var v = 1 + Math.random() * 3
                    this.sparks.push({ x: x, y: sy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, hue: edges[i][1] })
                }
            }
            for (var j = this.sparks.length - 1; j >= 0; j--) {
                var sp = this.sparks[j]
                sp.life++
                sp.x += sp.vx
                sp.y += sp.vy
                if (sp.life > 28) { this.sparks.splice(j, 1); continue }
                DrawCircle(sp.x, sp.y, 8, 'hsla(' + sp.hue + ', 100%, 82%, ' + ((1 - sp.life / 28) * e) + ')')
            }

            // the winner has taken the whole screen: flash once
            if (!gatherGoing && !this.flashed && (this.blueWins ? this.sv : this.fv) > 0.97) { this.flashed = true }
            if (this.flashed && this.flashT < 20) {
                DrawRect(0, 0, 320, 200, 'hsla(' + (this.blueWins ? 200 : 40) + ', 100%, 92%, ' + (0.6 * (1 - this.flashT / 20) * this.fade) + ')')
                this.flashT++
            }
        }
    }

    // Fly: first-person flight — big soft clouds rush outward from the horizon and past
    // the viewer, while a pair of feathered wings flaps at the bottom. Loops while flying.
    function Fly() {
        this.lifetime = 99999
        this.frame = 0
        this.alpha = 0
        this.clouds = []

        this.wing = function (dir, flap) {
            var sx = 160 + dir * 26, sy = 188
            for (var i = 0; i < 6; i++) {
                var ang = -0.25 - i * 0.2 - flap
                var len = 118 - i * 11
                var ex = sx + dir * Math.cos(ang) * len * 1.5
                var ey = sy + Math.sin(ang) * len * 1.1
                var w = 20 - i * 1.5
                hiddenCtx.save()
                hiddenCtx.lineCap = 'round'
                DrawLine([sx, sy], [ex, ey], 'hsla(195, 100%, 70%, ' + (0.35 * this.alpha) + ')', w + 12)
                DrawLine([sx, sy], [ex, ey], 'hsla(195, 40%, 97%, ' + this.alpha + ')', w)
                hiddenCtx.restore()
            }
        }

        this.draw = function () {
            this.frame++
            var f = this.frame
            this.alpha = flyGoing ? Math.min(1, this.alpha + 1 / 40) : this.alpha - 1 / 30
            if (!flyGoing && this.alpha <= 0) { this.lifetime = 0; return }
            DrawRect(0, 0, 320, 200, 'hsla(215, 80%, 6%, ' + this.alpha + ')')

            if (Math.random() < 0.3) {
                this.clouds.push({ a: Math.random() * Math.PI * 2, d: 8, v: 1.5 + Math.random() * 1.5 })
            }
            for (var i = this.clouds.length - 1; i >= 0; i--) {
                var c = this.clouds[i]
                c.d += c.v
                c.v *= 1.035
                if (c.d > 280) { this.clouds.splice(i, 1); continue }
                var x = 160 + Math.cos(c.a) * c.d * 1.5
                var y = 95 + Math.sin(c.a) * c.d * 0.85
                var r = 5 + c.d * 0.16
                var a = Math.min(1, c.d / 40) * Math.min(1, (280 - c.d) / 60) * this.alpha
                DrawCircle(x, y, r * 1.8, 'hsla(205, 100%, 70%, ' + (0.2 * a) + ')')
                DrawCircle(x - r * 0.7, y + r * 0.2, r * 0.8, 'hsla(200, 60%, 95%, ' + (0.8 * a) + ')')
                DrawCircle(x + r * 0.7, y + r * 0.2, r * 0.8, 'hsla(200, 60%, 95%, ' + (0.8 * a) + ')')
                DrawCircle(x, y - r * 0.2, r, 'hsla(200, 60%, 98%, ' + a + ')')
            }

            var flap = 0.1 + 0.3 * (0.5 + 0.5 * Math.sin(f * 0.09))
            this.wing(-1, flap)
            this.wing(1, flap)
        }
    }

    // Quest: gold scroll-light — a green check draws itself in, with gold ring
    // pulses and a few big drifting sparkles.
    function Quest() {
        this.lifetime = 1
        this.frame = 0
        this.dur = 220
        this.sparkles = []

        this.draw = function () {
            this.frame++
            var f = this.frame
            if (f >= this.dur) { this.lifetime = 0; return }
            var e = Env(f, this.dur, 30)
            DrawRect(0, 0, 320, 200, 'hsla(0, 0%, 0%, ' + e + ')')

            for (var k = 0; k < 2; k++) {
                var rt = ((f * 0.012) + k * 0.5) % 1
                DrawStroke(160, 100, 40 + rt * 150, 'hsla(' + GOLD_HUE + ', 100%, 70%, ' + ((1 - rt) * 0.8 * e) + ')', 20 * (1 - rt) + 6)
            }

            // green check draws itself in
            // one continuous stroke with round joins and caps, drawn along its length
            var c = Math.min(1, f / 30)
            var P = [[100, 105], [145, 150], [232, 50]]
            var L1 = Math.hypot(P[1][0] - P[0][0], P[1][1] - P[0][1])
            var L2 = Math.hypot(P[2][0] - P[1][0], P[2][1] - P[1][1])
            var drawn = c * (L1 + L2)
            hiddenCtx.save()
            hiddenCtx.lineCap = 'round'
            hiddenCtx.lineJoin = 'round'
            var widths = [44, 30]
            var colors = ['hsla(130, 100%, 50%, ' + (0.3 * e) + ')', 'hsla(130, 100%, 58%, ' + e + ')']
            for (var w = 0; w < 2; w++) {
                hiddenCtx.beginPath()
                hiddenCtx.moveTo(P[0][0], P[0][1])
                if (drawn <= L1) {
                    hiddenCtx.lineTo(P[0][0] + (P[1][0] - P[0][0]) * drawn / L1, P[0][1] + (P[1][1] - P[0][1]) * drawn / L1)
                } else {
                    var q = (drawn - L1) / L2
                    hiddenCtx.lineTo(P[1][0], P[1][1])
                    hiddenCtx.lineTo(P[1][0] + (P[2][0] - P[1][0]) * q, P[1][1] + (P[2][1] - P[1][1]) * q)
                }
                hiddenCtx.strokeStyle = colors[w]
                hiddenCtx.lineWidth = widths[w]
                hiddenCtx.stroke()
            }
            hiddenCtx.restore()

            if (Math.random() < 0.06) {
                this.sparkles.push({ x: Math.random() * 320, y: 200, vy: 0.8 + Math.random() * 2 })
            }
            for (var j = this.sparkles.length - 1; j >= 0; j--) {
                var sp = this.sparkles[j]
                sp.y -= sp.vy
                if (sp.y < -5) { this.sparkles.splice(j, 1); continue }
                DrawCircle(sp.x, sp.y, 14, 'hsla(50, 100%, 85%, ' + e + ')')
            }
        }
    }

    // Travel: first-person auto-path — white dots rise from a vanishing point on the
    // horizon, swell as they near and sweep past the viewer along a winding route,
    // faking depth with perspective. Loops while traveling.
    function Travel() {
        this.lifetime = 99999
        this.frame = 0
        this.alpha = 0
        this.count = 14
        this.spacing = 0.9
        this.range = this.count * this.spacing
        this.near = 0.6
        this.speed = 0.03
        this.horizon = 62

        // sideways offset of the route at distance s along it (organic double wave)
        this.lateral = function (s) {
            return 2.2 * Math.sin(s * 0.45) + 0.8 * Math.sin(s * 1.1 + 1.3)
        }

        this.draw = function () {
            this.frame++
            this.alpha = travelGoing ? Math.min(1, this.alpha + 1 / 40) : this.alpha - 1 / 30
            if (!travelGoing && this.alpha <= 0) { this.lifetime = 0; return }
            DrawRect(0, 0, 320, 200, 'hsla(0, 0%, 0%, ' + this.alpha + ')')

            var cam = this.frame * this.speed
            var camLat = this.lateral(cam)
            var dots = []
            for (var i = 0; i < this.count; i++) {
                var d = ((i * this.spacing - cam) % this.range + this.range) % this.range + this.near
                dots.push(d)
            }
            // draw far to near so close dots overlap distant ones
            dots.sort(function (a, b) { return b - a })

            for (var j = 0; j < dots.length; j++) {
                var D = dots[j]
                var k = 1 / D
                var x = 160 + (this.lateral(cam + D - this.near) - camLat) * 110 * k
                var y = this.horizon + 95 * k
                var r = Math.max(9, 46 * k)
                // fade in at the horizon, fade out as the dot passes the viewer
                var a = Math.min(1, (this.range + this.near - D) / 3, (D - this.near) / 0.5) * this.alpha
                if (a <= 0) { continue }
                // color drifts cyan -> violet along the route; the core stays near-white
                var hue = 230 + 45 * Math.sin((cam + D) * 0.35)
                DrawCircle(x, y, r * 2.1, 'hsla(' + hue + ', 100%, 65%, ' + (0.3 * a) + ')')
                DrawCircle(x, y, r * 1.35, 'hsla(' + hue + ', 100%, 80%, ' + (0.45 * a) + ')')
                DrawCircle(x, y, r, 'hsla(' + hue + ', 40%, 97%, ' + a + ')')
            }
        }
    }
    //#endregion

    window.requestAnimationFrame(update)
</script>
