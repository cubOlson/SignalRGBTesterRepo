    };
    //#endregion
    //#region Background Modes
    // Background Configuration
    let proBack = [0, 0, 0];
    function onbackColorChanged() {
        proBack = hexToHSL(backColor);
    }

    // Audio and Color Cycle State
    let audioEase = { sat: 0, lit: 0 };
    let gCycle = 0;
    
    // Background Utility Functions
    function updateAudioEase() {
        const targetDensity = engine.audio.density * 100;
        audioEase.sat += (targetDensity - audioEase.sat) / 10;
        audioEase.lit += (targetDensity - audioEase.lit) / 10;
    }

    function getColorString(hue, sat, lit, alpha) {
        return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`;
    }

    function updateColorCycle() {
        gCycle = (gCycle + 0.5) % 360;
    }

    // Main Background Handler
    function backgroundHandler() {
        const alpha = ambienceAlpha / 100;

        // Handle color cycling first if needed
        if (backgroundMode.includes("Color Cycle")) {
            updateColorCycle();
        }

        // Handle audio processing if needed
        if (backgroundMode.includes("Audio")) {
            updateAudioEase();
        }

        // Render background based on mode
        if (backgroundMode.includes("Ambience")) {
            if (backgroundMode === "Ambience Audio Visualizer") {
                copyScreenAudio(alpha);
            } else {
                copyScreen(alpha);
            }
            return;
        }

        // Handle custom and cycle modes
        const hue = proBack[0] + (backgroundMode.includes("Color Cycle") ? gCycle : 0);
        const sat = backgroundMode.includes("Audio") ? audioEase.sat * 0.33 + 66 : proBack[1];
        const lit = backgroundMode.includes("Audio") ? audioEase.lit * 0.9 + 10 : proBack[2];
        
        DrawRect(0, 0, 320, 200, getColorString(hue, sat, lit, alpha));
    }

    // Zone Configuration Constants
    const ZONE_COLS = 28;
    const ZONE_ROWS = 20;
    const TOTAL_ZONES = ZONE_COLS * ZONE_ROWS;

    function copyScreenAudio(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat = new Int8Array(engine.zone.saturation)
        const hue = new Int16Array(engine.zone.hue)
        
        const width = 320 / ZONE_COLS
        const height = 200 / ZONE_ROWS
        
        // Use the global audioEase values we already calculated
        const satMultiplier = audioEase.sat / 200 + 0.5
        const litMultiplier = audioEase.lit / 100

        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const x = col * width
            const y = row * height
            
            ctx.fillStyle = getColorString(
                hue[iZone],
                sat[iZone] * satMultiplier,
                lightness[iZone] * litMultiplier,
                alpha
            )
            ctx.fillRect(x, y, width, height)
        }
    }
  
    function copyScreen(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat = new Int8Array(engine.zone.saturation)
        const hue = new Int16Array(engine.zone.hue)
        
        const width = 320 / ZONE_COLS
        const height = 200 / ZONE_ROWS
        
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const x = col * width
            const y = row * height
            
            const finalHue = backgroundMode === "Custom Ambience" 
                ? proBack[0] 
                : hue[iZone] + (backgroundMode === "Color Cycle Ambience" ? gCycle : 0)
            
            ctx.fillStyle = getColorString(
                finalHue,
                sat[iZone],
                lightness[iZone],
                alpha
            )
            ctx.fillRect(x, y, width, height)
        }
    }

    //#region callbacks
    function replayCallback(){
      if(!replayGoing && replayOrangeMeter.value >=.95 && engine.vision.replayNotOrange <.1 && deadGoing){
        replayGoing = true
        deadGoing = false
      }else{
        replayGoing = false
        deadGoing = true
      }
    }


    function healthCallback(){
      if(inGame && healthBarMeter.value >=.7 && !lowHealthGoing && !deadGoing ){
        lowHealthGoing = true
        if(lowHPOn) effects.push(new LowHealthEffect())
      }else{
        lowHealthGoing = false
      }
    }

    function inGameCallback(){
      if(inGameBrown1Meter.value >=.2 && inGameBrown2Meter.value >= .2 && engine.vision.inGameNotBrown <.5 ){
        inGame = true
      }else{
        inGame = false
      }
    }

    function discoveredCallback(){
      if(inGame && discoveredYellowMeter.value >=.95 && !deadGoing ){
        if(discoOn) effects.push(new TankWithRipple(50, 50, "green", "red"))
      }
    }

    function deadCallback(){
      if(inGame && !deadGoing && deadOrangeMeter.value >=.95 && engine.vision.deadNotOrange <.1 ){
        deadGoing = true
        if(deathOn) effects.push(new TankExplosion(50, 50, "green", "green", basetank, uptank))
      }else{
        deadGoing = false
      }
    }
    
    function DrawHUD() {
    if (inGame && !deadGoing) {
      ctx.beginPath()
      ctx.fillStyle = healthColor;
      ctx.fillRect((HealthBarX * 3.2), (HealthBarY * 2), (1 - healthBarMeter.value) * (HealthBarWidth * 3.2), (HealthBarHeight * 2))

  }

        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.fade * 0.5; 
        ctx.beginPath();
        ctx.arc(this.centerX, this.centerY, circleRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (allIn) {
          this.fade -= 0.03; 
        }
      };
    }

    function XEffect2(centerX, centerY, size, color, speed) {
      this.centerX = centerX;
      this.centerY = centerY;
      this.size = size;
      this.color = color;
      this.speed = speed;
      this.alive = true;

      const targetDist = Math.max(150, 150);
      const offset = 50;

      this.rects = [
        { x: centerX, y: centerY, angle: Math.PI / 4, targetX: centerX - targetDist - offset, targetY: centerY - targetDist - offset },
        { x: centerX, y: centerY, angle: -Math.PI / 4, targetX: centerX + targetDist + offset, targetY: centerY - targetDist - offset },
        { x: centerX, y: centerY, angle: -Math.PI / 4, targetX: centerX - targetDist - offset, targetY: centerY + targetDist + offset },
        { x: centerX, y: centerY, angle: Math.PI / 4, targetX: centerX + targetDist + offset, targetY: centerY + targetDist + offset }
      ];

      this.fade = 1;
      this.circleRadius = 5;
      this.maxCircle = Math.sqrt(canvas.width ** 2 + canvas.height ** 2); 
      this.circleGrowing = true;
      this.startFade = false;

      this.draw = () => {
        if (this.fade <= 0) {
          this.alive = false;
          return;
        }

        let allOut = true;

        for (let rect of this.rects) {
          rect.x += (rect.targetX - rect.x) * this.speed / 150;
          rect.y += (rect.targetY - rect.y) * this.speed / 150;

          const dist = Math.sqrt((rect.targetX - rect.x) ** 2 + (rect.targetY - rect.y) ** 2);
          if (dist > 10) allOut = false;

          ctx.save();
          ctx.translate(rect.x, rect.y);
          ctx.rotate(rect.angle);
          ctx.globalAlpha = this.fade;
          ctx.fillStyle = this.color;
          ctx.fillRect(-this.size / 2, -(this.size / 4) / 2, this.size , this.size / 4);
          ctx.restore();
        }

        if (this.circleGrowing) {
          this.circleRadius += 1; 
          if (this.circleRadius >= this.maxCircle) {
            this.circleRadius = this.maxCircle;
            this.circleGrowing = false;
          }
        }

        ctx.save();
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.fade * 0.3;
        ctx.beginPath();
        ctx.arc(this.centerX, this.centerY, this.circleRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (allOut && !this.startFade) {
          this.startFade = true;
        }

        if (this.startFade) {
          this.fade -= 0.09; 
        }
      };
    }


    function GearEffect(centerX, centerY, finalSize, color, speed, path) {
      this.centerX = centerX;
      this.centerY = centerY;
      this.finalSize = finalSize;
      this.color = color;
      this.speed = speed;
      this.alive = true;
      this.path = path;

      const startDist = Math.max(canvas.width, canvas.height);

      this.gear = {
        x: canvas.width + startDist,
        y: -startDist,
        angle: 0,
        size: finalSize * 3
      };

      this.fade = 1;
      this.circleRadius = startDist;

      this.draw = () => {
        if (!this.alive) return;

        this.gear.x += (this.centerX - this.gear.x - 45) * this.speed / 50;
        this.gear.y += (this.centerY - this.gear.y - 40) * this.speed / 50;

        this.gear.size += (this.finalSize - this.gear.size) * 0.05;

        this.gear.angle += 0.03;

        this.circleRadius -= 4;
        if (this.circleRadius < 0) this.circleRadius = 0;

        if (this.circleRadius === 0) {
          this.fade -= 0.02;
          if (this.fade < 0) this.fade = 0; 
        }

        ctx.save();
        ctx.globalAlpha = this.fade;
        DrawPath(
          this.gear.x,
          this.gear.y,
          this.path,
          color,
          this.gear.size / 512,
          this.gear.size / 512,
          this.gear.angle
        );
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = this.fade * 0.6;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(this.centerX, this.centerY, this.circleRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (this.fade === 0) {
          this.alive = false;
        }
      };
    }

    function TankWithFireworks(startX, startY, tankColor, cannonColor, fireworkColor) {
      this.tankX = startX;
      this.tankY = startY;
      this.tankColor = tankColor;
      this.cannonColor = cannonColor;
      this.stopped = false;
      this.fireworks = [];
      this.cannonAngle = -1.5;
      this.hue = fireworkColor
      this.count = 0

      const cannonWidth = 10;
      const cannonHeight = 60; 

      this.draw = () => {

        if (this.tankX > 120) this.tankX += (119 - this.tankX) / 30
        else this.stopped = true;

        if (!inGame || (victoryDefeatWhiteMeter.value <.1 && victoryDefeatWhite2Meter.value <.1)) {
          this.alive = false;
          return; 
        }

        if (!this.alive) return;

        DrawPath(this.tankX, this.tankY, tankNoCannon, this.tankColor, 0.15, 0.15);


        ctx.fillStyle = this.tankColor;
        ctx.beginPath();
        ctx.arc(this.tankX + 95, this.tankY + 80, 5, 0, Math.PI*2);
        ctx.fill();

        ctx.save();
        ctx.translate(this.tankX + 95, this.tankY + 80); 
        if (this.stopped) {
          const minAngle = -1; 
          const maxAngle = -1.5; 
          const amplitude = (maxAngle - minAngle) / 2;
          const offset = minAngle + amplitude;
          this.cannonAngle = offset + amplitude * Math.sin(performance.now() / 700);
        }
    
        ctx.rotate(this.cannonAngle);
        ctx.fillStyle = this.cannonColor;
        ctx.fillRect(-cannonWidth/2, 0, cannonWidth, -cannonHeight); 
        ctx.restore();


        const pivotX = this.tankX - 30;
        const pivotY = this.tankY + 70;

        this.count < 75 ? this.count++ : this.count = 0


        if (this.stopped && !this.count) {
          const tipX = pivotX - cannonHeight * Math.sin(this.cannonAngle);
          const tipY = pivotY - cannonHeight * Math.cos(this.cannonAngle);
          this.fireworks.push(new Firework(tipX, tipY, this.hue + (Math.random() * 60 - 30)));
        }
        this.fireworks.forEach(f => f.draw());
        this.fireworks = this.fireworks.filter(f => f.alive);
      };
    }

    function Firework(x, y, hue) {
      this.x = x
      this.y = y
      this.hue = hue
      this.particles = []
      this.alive = true
      this.rad = 1

      for (let i = 0; i < 25; i++) {
        let angle = Math.random() * Math.PI + Math.PI / 2
        let speed = Math.random() * 10 + 1
        this.particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: Math.random() * 50 + 50
        })
      }

      this.draw = () => {
        let stillAlive = false
        DrawStroke(this.x, this.y, this.rad, `hsla(${this.hue}, 100%, 50%, 1)`, 10)
        if(this.rad < 300) this.rad += 10
        this.particles.forEach(p => {
          if (p.life > 0) {
            stillAlive = true
            p.x += p.vx
            p.y += p.vy
            p.vy += 0.05
            p.life--

            ctx.fillStyle = `hsla(${this.hue}, 100%, 50%, ${p.life / 100})`
            ctx.beginPath()
            ctx.arc(p.x, p.y, 15, 0, 2 * Math.PI)
            ctx.fill()
          }
        })
        this.alive = stillAlive
      }
    }

    function TankExplosion(x, y, baseColor, topColor, basePath, topPath) {
      this.x = x;
      this.y = y;
      this.baseColor = baseColor;
      this.topColor = topColor;
      this.basePath = basePath;
      this.topPath = topPath;

      this.top = { 
        x: x, 
        y: y, 
        angle: 0, 
        vx: 3, 
        vy: -7, 
        rotationSpeed: 0.15 
      };

      this.particles = [];
      this.baseAlpha = 1;
      this.finished = false;
      this.explosionStarted = false;

      setTimeout(() => { 
        this.explosionStarted = true;
      }, 300);

      this.draw = () => {
        if (!this.explosionStarted) {
          DrawPath(this.x, this.y, this.basePath, this.baseColor, 0.3, 0.3);
          DrawPath(this.top.x, this.top.y, this.topPath, this.topColor, 0.3, 0.3);
          return;
        }


        this.top.x += this.top.vx;
        this.top.y += this.top.vy;
        this.top.vy += 0.25; 
        this.top.angle += this.top.rotationSpeed;
        DrawRotatedPath(this.top.x, this.top.y, this.topPath, this.topColor, 0.3, 0.3, this.top.angle);


        if (this.baseAlpha > 0) {
          this.baseAlpha -= 0.02;
          if (this.baseAlpha < 0) this.baseAlpha = 0;
          ctx.globalAlpha = this.baseAlpha;
          DrawPath(this.x, this.y, this.basePath, this.baseColor, 0.3, 0.3);
          ctx.globalAlpha = 1;

          if (this.particles.length === 0) {
            for (let i = 0; i < 100; i++) {
              let angle = Math.random() * 2 * Math.PI;
              let speed = Math.random() * 6 + 2;
              this.particles.push({
                x: this.x + 90,
                y: this.y + 40,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 60,
                width: 6 + Math.random() * 10,
                height: 4 + Math.random() * 8
              });
            }
          }
        }

        let alive = false;
        this.particles.forEach(p => {
          if (p.life > 0) {
            alive = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2;
            p.life--;
            ctx.fillStyle = `rgba(255, ${Math.floor(Math.random()*255)}, 0, ${p.life / 60})`;
            ctx.fillRect(p.x, p.y, p.width, p.height);
          }
        });

        if (!alive && this.top.y > canvas.height) {
          this.finished = true;
        }
      };
    }

    function DrawRotatedPath(x, y, path, color, scaleX, scaleY, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.scale(scaleX, scaleY);
      ctx.fillStyle = color;
      ctx.fill(new Path2D(path));
      ctx.restore();
    }


    function LowHealthEffect() {
      this.alive = true;

      this.draw = () => {
        if ((!lowHealthGoing && (deadGoing || !replayGoing)) || !inGame) {
          this.alive = false;
          return;
        }

        const t = performance.now() / 1000;

        const opacity = 0.4 + 0.2 * Math.sin(t * 4);

        ctx.save();

        ctx.fillStyle = `rgba(255, 0, 0, ${opacity})`;
        ctx.beginPath();
        ctx.arc(
          canvas.width / 2,
          canvas.height,
          canvas.width * 0.3,
          Math.PI,
          2 * Math.PI
        );
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(100 * 0.3, 0);
        ctx.lineTo(120 * 0.5, canvas.height);

        ctx.arc(
          canvas.width / 2,
          canvas.height,
          canvas.width * 0.3,
          Math.PI,
          2 * Math.PI,
          false
        );

        ctx.lineTo(520 * 0.5, canvas.height);
        ctx.lineTo(420 * 0.7, 0);
        ctx.lineTo(canvas.width, 0);
        ctx.closePath();

        const grad = ctx.createLinearGradient(
          0,
          canvas.height - canvas.width * 0.3,
          0,
          0
        );
        grad.addColorStop(0, `rgba(255, 0, 0, ${opacity * 0.4})`);
        grad.addColorStop(0.4, `rgba(255, 0, 0, ${opacity * 0.15})`);
        grad.addColorStop(1, `rgba(255, 0, 0, 0)`);

        ctx.fillStyle = grad;
        ctx.fill();

        ctx.restore();
      };
    }


    function TankWithArrow(startX, startY, colors, index, direction) {
        this.tankX = startX;
        this.tankY = startY;
        this.direction = direction; 
        this.speed = 6;

        const arrowFillColor = colors.fill;
        const arrowLineColor = colors.line;
        const tankBrightColor = colors.tank;

        const cfg = tankConfigs2[index];

        this.draw = () => {
            const dir = this.direction === "right" ? 1 : -1;
            this.tankX += this.speed * dir;

            ctx.save();

            const gradient = ctx.createLinearGradient(
                this.tankX + (dir === 1 ? -150 : 150), this.tankY,  
                this.tankX + (dir === 1 ? 250 : -250), this.tankY   
            );
            gradient.addColorStop(0, "rgba(10, 61, 10, 0)");   
            gradient.addColorStop(0.9, arrowFillColor);        
            gradient.addColorStop(1, arrowFillColor);          


            ctx.beginPath();
            if (dir === 1) { 
                ctx.moveTo(this.tankX - 80, this.tankY - 200);
                ctx.lineTo(this.tankX + 300, this.tankY + 50);
                ctx.lineTo(this.tankX - 80, this.tankY + 300);
            } else { 
                ctx.moveTo(this.tankX + 80, this.tankY - 200);
                ctx.lineTo(this.tankX - 300, this.tankY + 50);
                ctx.lineTo(this.tankX + 80, this.tankY + 300);
            }
          

            ctx.fillStyle = gradient;
            ctx.fill();

            ctx.strokeStyle = arrowLineColor; 
            ctx.lineWidth = 8;
            ctx.stroke();

            ctx.restore();

          
            DrawPath(
                this.tankX,
                this.tankY,
                cfg.path,
                tankBrightColor,
                dir === 1 ? cfg.scaleX : -cfg.scaleX, 
                cfg.scaleY
            );
        }
    }

    function RadarEffect(flagPath) { 
      this.alive = true;
      this.ripples = [];
      this.enemies = [];
      this.lastRipple = 0;
      const startTime = performance.now(); 

      for (let i = 0; i < 20; i++) {
        const angle = Math.random() * 2 * Math.PI;
        const dist = 50 + Math.random() * 120;
        this.enemies.push({
          x: canvas.width / 2 + Math.cos(angle) * dist,
          y: canvas.height / 2 + Math.sin(angle) * dist,
          vx: (Math.random() - 0.5) * 1.5,
          vy: (Math.random() - 0.5) * 1.5,
          alpha: 0.2 
        });
      }

      this.update = () => {
        const now = performance.now();

     
        if (now - startTime > 6000) {
          this.alive = false;
          return;
        }

 
        if (now - this.lastRipple > 1000) { 
          this.ripples.push({ radius: 0 });
          this.lastRipple = now;
        }


        this.ripples.forEach(r => r.radius += 2);
        this.ripples = this.ripples.filter(r => r.radius < canvas.width);


        this.enemies.forEach(e => {
          e.x += e.vx;
          e.y += e.vy;

          if (e.x < 0 || e.x > canvas.width) e.vx *= -1;
          if (e.y < 0 || e.y > canvas.height) e.vy *= -1;

          const dx = e.x - canvas.width / 2;
          const dy = e.y - canvas.height / 2;
          const dist = Math.sqrt(dx * dx + dy * dy);

          e.alpha = 0.2;
          this.ripples.forEach(r => {
            if (Math.abs(dist - r.radius) < 10) { 
              e.alpha = 1;
            }
          });
        });
      };

      this.draw = () => {
        if (!this.alive) return; 
        this.update();

        ctx.save();
        ctx.strokeStyle = "yellow";
        ctx.lineWidth = 15;
        this.ripples.forEach(r => {
          ctx.beginPath();
          ctx.arc(canvas.width / 2, canvas.height / 2, r.radius, 0, 2 * Math.PI);
          ctx.stroke();
        });
        ctx.restore();


        DrawPath(-50, 40 , flagPath, "green", 0.5, 0.5);


        this.enemies.forEach(e => {
          ctx.fillStyle = `rgba(255,0,0,${e.alpha})`;
          ctx.beginPath();
          ctx.arc(e.x, e.y, 18, 0, 2 * Math.PI);
          ctx.fill();
        });
      };
    }   
    //#endregion
    
  //#region Helper Functions

  function DrawPath(x, y, path, color, scaleX, scaleY) {
    ctx.fillStyle = color;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scaleX, scaleY)
    let ex = new Path2D(path);
    ctx.fill(ex);
    ctx.restore();
  };

  function DrawStroke(x, y, radius, color, stroke) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = stroke;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.stroke();
  };

  function DrawRect(x, y, width, height, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
  };

  function hexToHSL(hex) {
      const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || [];
      const rgb = [r, g, b].map(x => parseInt(x, 16) / 255);
      const max = Math.max(...rgb);
      const min = Math.min(...rgb);
      const l = (max + min) / 2;
      
      if (max === min) return [0, 0, Math.round(l * 100)];
      
      const d = max - min;
      const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      
      let h;
      const [nr, ng, nb] = rgb;
      if (max === nr) h = (ng - nb) / d + (ng < nb ? 6 : 0);
      else if (max === ng) h = (nb - nr) / d + 2;
      else h = (nr - ng) / d + 4;
      
      return [
        Math.round(h * 60),
        Math.round(s * 100),
        Math.round(l * 100)
      ];
    }
  
    function Meter(size, callback) {
      this.size = size;
      this.value = 0;
      this.diff = 0;
      this.increased = false;
      this.decreased = false;
      var values = [];
  
      this.setValue = function (updatedValue) {
        values.push(updatedValue);
        if (values.length > this.size) {
          values.shift();
        }
  
        for (var i = 0; i < values.length - 1; i++) {
          if (values[i] !== values[i + 1]) return;
        }
        if (this.value !== values[0]) {
          this.diff = Math.abs(this.value - values[0]);
          this.increased = this.value < values[0];
          this.decreased = this.value > values[0];
          this.value = values[0];
          callback();
        }
      }
    }
    //#endregion


  window.requestAnimationFrame(update);
</script>
