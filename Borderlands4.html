    let NoJetMeter = new Meter(1, jetCallback)
    let JetValueMeter = new Meter(1, jetCallback)

    function update() {
      hctx.clearRect(0, 0, hiddenCanvas.width, hiddenCanvas.height);
      hctx.fillStyle = `hsla(0, 0%, 0%, ${gAlpha})`;
      hctx.fillRect(0, 0, 320, 200);
      backgroundHandler()

      InGameColorMeter.setValue(engine.vision.inGameColor)
      InGameWhiteMeter.setValue(engine.vision.inGameWhite)
      InGameNotWhiteMeter.setValue(engine.vision.inGameNotWhite)

      HealthRedMeter.setValue(engine.vision.healthRed)

      ShieldBlueMeter.setValue(engine.vision.shieldBlue)
      ShieldYellowMeter.setValue(engine.vision.shieldYellow)

      CombatMeter.setValue(engine.vision.combatRed)
      CombatNotMeter.setValue(engine.vision.combatNotRed)
      MiniCombatMeter.setValue(engine.vision.miniCombatRed)
      MiniCombatNotMeter.setValue(engine.vision.miniCombatNotRed)
      MiniConfirmMeter.setValue(engine.vision.miniConfirmYellow)

      XPMeter.setValue(engine.vision.xpLevel)

      SkillMeter.setValue(engine.vision.skillPoint)

      FFYLRedMeter.setValue(engine.vision.ffylRed)
      FFYLBlackMeter.setValue(engine.vision.ffylBlack)
      FFYLLengthMeter.setValue(engine.vision.ffylLength)

      NoSprintMeter.setValue(engine.vision.noSprintLeft + engine.vision.noSprintRight)

      LeftJetMeter.setValue(engine.vision.jetPackLeft)
      RightJetMeter.setValue(engine.vision.jetPackRight)
      JetValueMeter.setValue(engine.vision.jetPackNotYellow)
      JetValueMeter.setValue(engine.vision.jetPackValue)
  
      //Effect handler 
      for (let i = 0; i < effects.length; i++) {
        effects[i].draw(hctx);
      } 
      // Remove dead effects with filter
      effects = effects.filter(effect => !(effect.lifetime <= 0));

      if(adjOn && !gInGame){
        if(hpOn) DrawRect(hpX * 3.2, hpY * 2, hpWidth * 3.2, hpHeight * 2, "red")
        if(shieldOn) DrawRect(shieldX * 3.2, shieldY * 2, shieldWidth * 3.2, shieldHeight * 2, "cyan")
      }
      
      if(miniTimer > 0) miniTimer--
      if(ffylTimer > 0) ffylTimer--

      ctx.clearRect(0, 0, width, height);
      ctx.drawImage(hiddenCanvas, 0, 0);

      window.requestAnimationFrame(update);
    };

    let gInGame = false
    function inGameCallback(){
      if((InGameColorMeter.value >= .95 || HealthRedMeter.value >= .25) && InGameWhiteMeter.value >= .2 && InGameNotWhiteMeter.value <= .1) gInGame = true
      else if (InGameColorMeter.value <= .25 && InGameWhiteMeter.value <= .05) gInGame = false
    }

    let healthGoing = false
    let lowHealthGoing = false
    function healthCallback(){
      if(gInGame && HealthRedMeter.value >= .05 && !healthGoing){
        healthGoing = true
        if(hpOn) effects.push(new healthHUD())
      } else if (!gInGame) healthGoing = false

      if(gInGame && HealthRedMeter.value <= .25 && !lowHealthGoing){
        lowHealthGoing = true
        if(lowOn && gNoSprint) effects.push(new lowHealth())
      } else if (!gInGame || (gInGame && HealthRedMeter.value > .25)) lowHealthGoing = false
    }

    let shieldGoing = false
    let breakGoing = false
    function shieldCallback(){
      if(gInGame && (ShieldBlueMeter.value >= .05 || ShieldYellowMeter.value >= .05) && !shieldGoing){
        shieldGoing = true
        if(shieldOn) effects.push(new shieldHUD())
      } else if (!gInGame) shieldGoing = false

      if(gInGame && ShieldBlueMeter.value <= .1 && ShieldYellowMeter.value <= .1 && !breakGoing){
        breakGoing = true
        if(shieldOn && gNoSprint) effects.push(new shieldBreak())
      } else if (!gInGame || (gInGame && (ShieldBlueMeter.value > .2 || ShieldYellowMeter.value > .2))) breakGoing = false
    }

    let combatGoing = false
    let peaceGoing = false
    let miniTimer = 0
    function combatCallback(){
      if(MiniCombatMeter.value >= .1) miniTimer = 2000
      if(gInGame && ((CombatMeter.value >= .95 && CombatNotMeter.value <= .1) || (MiniCombatMeter.value >= .1 && MiniCombatNotMeter.value <= .05)) && !combatGoing){
        combatGoing = true
        peaceGoing = false
        if(combatOn && gNoSprint) effects.push(new inCombat())
      } else if (gInGame && ((CombatMeter.value <= .1 && MiniConfirmMeter.value <= .05) || (MiniConfirmMeter.value >= .25 && !miniTimer))){
        if(!peaceGoing && combatGoing && combatOn && gNoSprint) effects.push(new outCombat())
        combatGoing = false
        peaceGoing = true
      }
    }

    let xpGoing = false
    function xpCallback(){
      if(gInGame && XPMeter.value <= .05 && !xpGoing){
        xpGoing = true
        if(levelOn && gNoSprint) effects.push(new levelUp())
      } else if (gInGame && XPMeter.value >= .95) xpGoing = false
    }

    let skillGoing = false
    function skillCallback(){
      if(gInGame && SkillMeter.value >= .95 && !skillGoing){
        skillGoing = true
        if(levelOn && gNoSprint) effects.push(new skillPoint())
      } else if (!gInGame || gInGame && SkillMeter.value <= .05) skillGoing = false
    }

    let ffylGoing = false
    let ffylTimer = 0
    function ffylCallback(){
      if(FFYLLengthMeter.value >= .1 && FFYLRedMeter.value >= .95) ffylTimer = 500
      if(gInGame && FFYLRedMeter.value >= .95 && FFYLBlackMeter.value >= .95 && FFYLLengthMeter.value >= .05 && !ffylGoing){
        ffylGoing = true
        if(lowOn) effects.push(new fightLife())
      } else if (!gInGame || (gInGame && FFYLRedMeter.value <= .1 && FFYLBlackMeter.value <= .1)) {
          ffylGoing = false
          if(!gInGame && deathOn && ffylTimer) effects.push(new death()) 
      }
    }

    let gNoSprint = false
    function sprintCallback(){
      if(gInGame && NoSprintMeter.value >= 1.75) gNoSprint = true
      else if (gInGame && NoSprintMeter.value <= .2) gNoSprint = false
    }

    let jetGoing = false
    function jetCallback(){
      if(gInGame && LeftJetMeter.value >= .95 && RightJetMeter.value >= .95 && NoJetMeter.value <= .1 && JetValueMeter.value >= .05 && !jetGoing){
        jetGoing = true
        effects.push(new jetpackUse())
      } else if (!gInGame || (gInGame && LeftJetMeter.value <= .05 && RightJetMeter.value <= .05)) jetGoing = false
    }

    function jetpackUse(){
        this.val = 0
        this.draw = function(){
            DrawRect(0, 0, 320, 200, getColorString(0, 100, 25, (100 - this.val) / 200))
            if(!jetGoing) this.val < .99 ? this.val *= 1.01 : this.lifetime = 0
            else this.val += (JetValueMeter.value * 100 - this.val) / 20
            DrawRect(0, 0, this.val * 3.2, 200, getColorString(this.val * .3, 100 - this.val / 1.5, 50, Math.sin(Date.now() / 100) * (101 - this.val) / 200 + .6))
        }
    }

    function death(){
        this.alpha = 0
        this.count = 1
        this.mod = 20
        this.lifetime = 150
        for(let i = 0; i < 20; i++){
          effects.push(new particleSource(160, 100, 0, 40, 10))
          setTimeout(()=>{
            effects.push(new particleSource(160, 100, 0, 25, 10))
          }, 30 * i)
        }
        this.draw = function(){
            DrawRect(0, 0, 320, 200, getColorString(0, 0, 0, this.alpha * this.lifetime / 150))

                effects.push(new particleSource(160, 100, 190 + this.mod * 3, 50 - this.mod * 2, 20 - this.mod / 2))

            DrawCircle(160, 100, 300 - this.lifetime * 2, getColorString(0, 0, 100, this.lifetime / 200))
        }
    }

    let ffylSkull = "m244.37,1s11.56,40.26-4.15,58.93c0,0,21.33-2.37,21.04,5.04s-6.22,18.37-10.52,20.44-20.89,4.74-30.96,3.56-9.48-.89-16.59-6.22l-8.59-6.22s15.11,13.63,5.93,18.67l-9.19,5.04s-10.96,4.44-11.85,4.74-5.04,2.37-1.48,4.74,12.44,2.07,14.52,2.07,8-1.19,9.48,2.67-5.04,10.96-7.11,12.15-5.04,5.33-6.22,8.89-1.78,9.78-1.78,9.78c0,0,37.93-40.52,41.19-44.26s6.52-7,11.26-5.81,9.48,5.63,8.59,9.48-3.26,9.19-4.15,10.07-2.37.89,1.48,1.78,12.15-2.37,13.33,1.78l1.19,4.15s-2.07,8-6.52,12.15-14.22,8.89-18.07,8.89h-3.85s-4.44-2.96-10.37,0-8.59,10.67-8.59,13.93.89,11.26.89,15.41v4.15s-.3,4.44-3.26,6.52-22.52,20.74-22.52,20.74l-8-5.04-2.9-18.67s-1.25,13.04-2.73,14.22-8.59,2.67-8.59,2.67l-4.26-14.52-6.7,14.81s-5.33,3.56-9.19-.89-6.52-15.11-6.52-15.11l-4.15-2.96,2.67,18.07-5.63,4.19h-5.33s-19.85-21.96-21.63-26.11.3-9.19,0-15.11-2.07-14.52-3.85-14.81-16.59-.89-20.44-.89-9.78-3.26-13.33-7.41-7.41-11.2-6.22-13.6,2.96-3.88,6.81-3.58,8.3,2.67,10.07,1.78,4.44-8.3,2.37-13.33-3.26-11.56-1.48-12.15,6.52-.22,12.15,5.22,19.85,20.85,23.7,23.81l3.85,2.96s10.96,13.63,12.15,14.52-6.22-13.63-8.3-17.19-5.04-10.07-2.67-10.67,4.15-2.67,9.19-3.56,10.07-2.07,10.07-4.74-2.37-6.81-5.33-7.7-10.67-2.37-13.93-4.44-3.26-11.26-3.26-14.81,3.85-7.41,3.85-7.41l-6.81,4.15s.89,10.07-2.96,11.85l-3.85,1.78s-19.26.3-24-2.07-13.63-5.04-16-8.3-7.55-3.56-5.85-9.78-.08-7.7,2-8,5.93,1.19,7.41-.59,8.59-6.22,7.11-8-10.37-9.78-10.37-14.22-1.19-16.59,2.07-24.89,7.41-12.7,7.41-12.7H1v204.41h320V1h-76.63Z"
    function fightLife(){
        this.alpha = 0
        this.effects = []
        this.lifetime = 1
        this.draw = function(){
          if(!ffylGoing) this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
          else if(this.alpha < 1) this.alpha += .05
            DrawRect(0, 0, 320, 200, getColorString(0, 100, 5, this.alpha))
            this.effects.forEach((ele, i)=>{
                ele.draw()
            })
            
            this.effects = this.effects.filter(ele => ele.lifetime > 0)
            DrawPath(-1, -1, ffylSkull, getColorString(0, 100, Math.sin(Date.now() / 150) * 5 + 5, this.alpha), 1, 1)

            this.effects.push(new flHelp(FFYLLengthMeter.value * 50))

    function flHelp(rad){
        this.x = Math.random() * 150 + 85
        this.y = 200
        this.rad = rad
        this.lifetime = 1
        this.mod = Math.random() * 1000
        this.draw = function(){
            DrawCircle(this.x, this.y, this.rad, getColorString(0 - this.mod / 30, 100, 50, 1))
            this.y > 0 ? this.y -= 3 : this.lifetime = 0
            this.rad > 1 ? this.rad-=.5 : this.lifetime = 0
        }
    }

    function skillPoint(){
      this.rad = 1
      this.lifetime = 5000
      this.draw = function(){
        DrawStroke(160, 100, this.rad, getColorString(45, 100, 50, .5), this.rad / 2)
        this.rad < 400 ? this.rad += 2 : this.done = true
        if(this.done) this.lifetime--
        if(!this.lifetime) skillGoing = false
      }
    }

  function levelUp(){
      this.rad = 1
      this.y = 200
      this.draw = function(){
        DrawStroke(160, 100, this.rad, getColorString(60, 100, 50, 1), this.rad / 1.1)
        DrawRect(0, this.y, 320, 40, getColorString(60, 100, 50, 1))
        if(this.rad < 400) this.rad += 8
        if(this.rad > 200) this.y > -40 ? this.y -= 10 : this.lifetime = 0
      }
    }

    function outCombat(){
        this.y = 0
        this.alpha = .5
        this.draw = function(){
            DrawRect(0, this.y, 320, -200, getColorString(120, 100, 40, this.alpha))
            this.y < 200 ? this.y += (210 - this.y) / 30 : this.alpha >= .025 ? this.alpha -= .025 : this.lifetime = 0
        }
    }

    function inCombat(){
        this.count = 0
        this.lifetime = 200
        this.draw = function(){
            this.count < 8 ? this.count++ : this.count = 0
            this.lifetime--
            if(!this.count) effects.push(new combatHelp(Math.random() > .5))
        }
    }

    function combatHelp(dir){
        this.x = 0
        this.y = Math.random() * 200
        this.stroke = 60
        this.hue = Math.random() * 360
        for(let i = 0; i < 15; i++) effects.push(new particleSource(dir ? 0 : 320, this.y, this.hue, 40, 15))
        this.draw = function(){
            DrawLine([this.x, this.y], [this.x + 320, this.y], getColorString(this.hue, 100, 40 + this.stroke, 1), this.stroke)
            this.stroke > 5 ? this.stroke -= 5 : this.lifetime = 0
        }
    }

    function particleSource(x, y, hue, rad, speed){
        this.x = x
        this.vx = Math.random() * speed - speed / 2
        this.y = y
        this.vy = Math.random() * speed - speed / 2
        this.hue = hue
        this.rad = rad
        this.draw = function(){
            DrawCircle(this.x, this.y, this.rad, getColorString(this.hue, 100, 30, 1))
            this.x += this.vx
            this.y += this.vy
            this.rad > 1 ? this.rad-- : this.lifetime = 0
        }
    }

    function lowHealth(){
      this.alpha = 0
      this.draw = function(){
          if(this.alpha < .01) this.points = generateVignettePoints()
          hctx.beginPath()
          this.points.forEach(ele => {
              hctx.arc(ele.x, ele.y, ele.radius, 0, Math.PI * 2, false)
          })
          hctx.fillStyle = getColorString(0, 100, 40, this.alpha)
          hctx.fill()
          this.alpha = Math.sin(Date.now() / 150) * .5 + .5
          if(!lowHealthGoing || !gInGame) this.lifetime = 0
      }
    }
    
    function generateVignettePoints(count = 50, rectWidth = 320, rectHeight = 200) {
      const points = [];
      const centerX = rectWidth / 2;
      const centerY = rectHeight / 2;
      const maxRadius = Math.min(centerX, centerY);
      const minRadius = maxRadius * 0.2;
    
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * 2 * Math.PI;
        const rad = Math.random() * 150 + 50
        let tempX = Math.cos(angle) * rad + centerX
        let tempY = Math.sin(angle) * rad + centerY

        points.push({
          x: tempX,
          y: tempY,
          radius: rad * rad / 600,
        });
      }

      return points;
    }

    function shieldBreak(){
      this.rad = 100
      this.hue = 220
      this.alpha = 0
      this.draw = function(){
          hctx.beginPath()
          for(let i = 0; i < 20; i++){
              let tempX = i % 5 * 75
              let tempY = Math.floor(i / 5) * 75
              hctx.arc(tempX, tempY, this.rad, 0, Math.PI * 2, false)
          }
          hctx.fillStyle = getColorString(this.hue, 100, 50, this.alpha)
          hctx.fill()
          this.alpha <= .95 ? this.alpha += .05 : this.hue < 360 ? this.hue += 14 : this.rad > 5 ? this.rad -= 2 : this.lifetime = 0
      }
    }

    function healthHUD(){
      this.val = 0
      this.oldVal = 0
      this.lit = 50
      this.draw = function(){
          if(this.done) this.val > .01 ? this.val *= .95 : this.lifetime = 0
          else this.val += (HealthRedMeter.value - this.val) / 20
          let temp = Math.abs(this.oldVal - this.val)
          if(temp > .5){
              this.lit += temp
              this.oldVal = this.val
          }
          DrawRect(hpX * 3.2, hpY * 2, this.val * hpWidth * 3.2, hpHeight * 2, getColorString(0, 100, this.lit, 1))
          if(this.lit > 40) this.lit *= .99
          if(!healthGoing || !hpOn) this.done = true
      }
    }

    function shieldHUD(){
      this.val = 0
      this.oldVal = 0
      this.lit = 50
      this.draw = function(){
          if(this.done) this.val > .01 ? this.val *= .95 : this.lifetime = 0
          else this.val += ((ShieldBlueMeter.value + ShieldYellowMeter.value) - this.val) / 20
          let temp = Math.abs(this.oldVal - this.val)
          if(temp > .5){
              this.lit += temp
              this.oldVal = this.val
          }
          DrawRect(shieldX * 3.2, shieldY * 2, this.val * shieldWidth * 3.2, shieldHeight * 2, getColorString(190, 100, this.lit, 1))
          if(this.lit > 40) this.lit *= .99
          if(!shieldGoing || !shieldOn) this.done = true
      }
    }
    //#region Background Modes
    // Background Configuration
    let proBack = [0, 0, 0];
    function onbackColorChanged() {
        proBack = hexToHSL(backColor);
    }

    // Audio and Color Cycle State
    let audioEase = { sat: 0, lit: 0 };
    let gCycle = 0;
    
    // Background Utility Functions
    function updateAudioEase() {
        const targetDensity = engine.audio.density * 100;
        audioEase.sat += (targetDensity - audioEase.sat) / 10;
        audioEase.lit += (targetDensity - audioEase.lit) / 10;
    }

    function getColorString(hue, sat, lit, alpha) {
        return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`;
    }

    function updateColorCycle() {
        gCycle = (gCycle + 0.5) % 360;
    }

    // Main Background Handler
    function backgroundHandler() {
        const alpha = ambienceAlpha / 100;

        // Handle color cycling first if needed
        if (backgroundMode.includes("Color Cycle")) {
            updateColorCycle();
        }

        // Handle audio processing if needed
        if (backgroundMode.includes("Audio")) {
            updateAudioEase();
        }

        // Render background based on mode
        if (backgroundMode.includes("Ambience")) {
            if (backgroundMode === "Ambience Audio Visualizer") {
                copyScreenAudio(alpha);
            } else {
                copyScreen(alpha);
            }
            return;
        }

        // Handle custom and cycle modes
        const hue = proBack[0] + (backgroundMode.includes("Color Cycle") ? gCycle : 0);
        const sat = backgroundMode.includes("Audio") ? audioEase.sat * 0.33 + 66 : proBack[1];
        const lit = backgroundMode.includes("Audio") ? audioEase.lit * 0.9 + 10 : proBack[2];
        
        DrawRect(0, 0, 320, 200, getColorString(hue, sat, lit, alpha));
    }

    // Zone Configuration Constants
    const ZONE_COLS = 28;
    const ZONE_ROWS = 20;
    const TOTAL_ZONES = ZONE_COLS * ZONE_ROWS;

    function copyScreenAudio(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat = new Int8Array(engine.zone.saturation)
        const hue = new Int16Array(engine.zone.hue)
        
        const width = 320 / ZONE_COLS
        const height = 200 / ZONE_ROWS
        
        // Use the global audioEase values we already calculated
        const satMultiplier = audioEase.sat / 200 + 0.5
        const litMultiplier = audioEase.lit / 100

        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const x = col * width
            const y = row * height
            
            hctx.fillStyle = getColorString(
                hue[iZone],
                sat[iZone] * satMultiplier,
                lightness[iZone] * litMultiplier,
                alpha
            )
            hctx.fillRect(x, y, width, height)
        }
    }
  
    function copyScreen(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat = new Int8Array(engine.zone.saturation)
        const hue = new Int16Array(engine.zone.hue)
        
        const width = 320 / ZONE_COLS
        const height = 200 / ZONE_ROWS
        
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const x = col * width
            const y = row * height
            
            const finalHue = backgroundMode === "Custom Ambience" 
                ? proBack[0] 
                : hue[iZone] + (backgroundMode === "Color Cycle Ambience" ? gCycle : 0)
            
            hctx.fillStyle = getColorString(
                finalHue,
                sat[iZone],
                lightness[iZone],
                alpha
            )
            hctx.fillRect(x, y, width, height)
        }
    }
    //#endregion
    //#region Helper Functions
  function DrawArc(x, y, start, end, radius, direction, color){
    hctx.beginPath()
    hctx.arc(x, y, radius, start, end, direction)
    hctx.fillStyle = color
    hctx.fill()
  }

  function DrawLine(start, end, color, stroke){
    hctx.beginPath()
    hctx.moveTo(start[0], start[1])
    hctx.lineTo(end[0], end[1])
    hctx.strokeStyle = color
    hctx.lineWidth = stroke
    hctx.stroke()
  }

  function DrawPath(x, y, path, color, scaleX, scaleY) {
    hctx.fillStyle = color;
    hctx.save();
    hctx.translate(x, y);
    hctx.scale(scaleX, scaleY)
    let ex = new Path2D(path);
    hctx.fill(ex);
    hctx.restore();
  };

  function DrawTriangle(cord1X, cord1Y, cord2X, cord2Y, cord3X, cord3Y, color) {
    hctx.beginPath();
    hctx.fillStyle = color;
    hctx.moveTo(cord1X, cord1Y);
    hctx.lineTo(cord2X, cord2Y);
    hctx.lineTo(cord3X, cord3Y);
    hctx.lineTo(cord1X, cord1Y);
    hctx.fill();
  };

  function DrawCircle(x, y, radius, color) {
    hctx.beginPath();
    hctx.fillStyle = color;
    hctx.arc(x, y, radius, 0, 2 * Math.PI)
    hctx.fill();
  };

  function DrawStroke(x, y, radius, color, stroke) {
    hctx.beginPath();
    hctx.strokeStyle = color;
    hctx.lineWidth = stroke;
    hctx.arc(x, y, radius, 0, 2 * Math.PI)
    hctx.stroke();
  };

  function DrawRect(x, y, width, height, color) {
    hctx.beginPath();
    hctx.fillStyle = color;
    hctx.fillRect(x, y, width, height);
  };

  function strokeRect(x, y, width, height, color, stroke){
    hctx.beginPath();
    hctx.strokeStyle = color;
    hctx.lineWidth = stroke
    hctx.rect(x, y, width, height);
    hctx.stroke()
  }

  function hexToHSL(hex) {
      const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || [];
      const rgb = [r, g, b].map(x => parseInt(x, 16) / 255);
      const max = Math.max(...rgb);
      const min = Math.min(...rgb);
      const l = (max + min) / 2;
      
      if (max === min) return [0, 0, Math.round(l * 100)];
      
      const d = max - min;
      const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      
      let h;
      const [nr, ng, nb] = rgb;
      if (max === nr) h = (ng - nb) / d + (ng < nb ? 6 : 0);
      else if (max === ng) h = (nb - nr) / d + 2;
      else h = (nr - ng) / d + 4;
      
      return [
        Math.round(h * 60),
        Math.round(s * 100),
        Math.round(l * 100)
      ];
    }
  
    function Meter(size, callback) {
      this.size = size;
      this.value = 0;
      this.diff = 0;
      this.increased = false;
      this.decreased = false;
      var values = [];
  
      this.setValue = function (updatedValue) {
        values.push(updatedValue);
        if (values.length > this.size) {
          values.shift();
        }
  
        for (var i = 0; i < values.length - 1; i++) {
          if (values[i] !== values[i + 1]) return;
        }
        if (this.value !== values[0]) {
          this.diff = Math.abs(this.value - values[0]);
          this.increased = this.value < values[0];
          this.decreased = this.value > values[0];
          this.value = values[0];
          callback();
        }
      }
    }
