       VISION METERS
       Each meter captures a small region of the game screen and
       measures what percentage of its pixels match the given HSL
       range. The JS Meter class smooths readings over N frames
       before firing a callback.

       Detection strategy: every game state uses a POSITIVE meter
       (confirms the expected color IS present) paired with a
       NEGATIVE "Not" meter (confirms the region does NOT show that
       color during baseline/off state). A state is considered active
       only when positive is high AND negative is low, preventing
       false positives from ambient lighting or UI transitions.

       TESTER NOTE: If an effect never fires, first check the QA Tool
       — load a screenshot from the target resolution and verify the
       meter region actually captures the right pixels at the right
       color. Then adjust HSL ranges or region coordinates as needed.
       ═══════════════════════════════════════════════════════════ -->

<body style="margin: 0; padding: 0; background: #000;">
    <canvas id="exCanvas" width="320" height="200"></canvas>
</body>

<script>
    // ═══════════════════════════════════════════════════════════
    // CANVAS SETUP
    // SignalRGB renders this 320x200 canvas onto the device layout.
    // All effects draw to the hidden canvas, composited to ctx once per frame.
    // ═══════════════════════════════════════════════════════════
    const canvas = document.getElementById('exCanvas');
    const ctx    = canvas.getContext('2d');
    const width  = 320;
    const height = 200;

    const hiddenCanvas = document.createElement('canvas');
    hiddenCanvas.width  = 320;
    hiddenCanvas.height = 200;
    const hiddenCtx = hiddenCanvas.getContext('2d');

    let effects = [];

    //#region Update
    function update() {
        DrawRect(0, 0, 320, 200, 'black')
        backgroundHandler()

        bossBarRed_Meter.setValue(engine.vision.bossBarRed)
        bossText_Meter.setValue(engine.vision.bossText)
        coinsNumber_Meter.setValue(engine.vision.coinsNumber)
        deathBlack1_Meter.setValue(engine.vision.deathBlack1)
        deathBlack2_Meter.setValue(engine.vision.deathBlack2)
        deathNotBlack_Meter.setValue(engine.vision.deathNotBlack)
        gloomNumber_Meter.setValue(engine.vision.gloomNumber)
        guardBar_Meter.setValue(engine.vision.guardBar)
        healthBarRed_Meter.setValue(engine.vision.healthBarRed)
        healthConfirmRed_Meter.setValue(engine.vision.healthConfirmRed)
        resolveBarYellow_Meter.setValue(engine.vision.resolveBarYellow)
        resolveConfirmYellow_Meter.setValue(engine.vision.resolveConfirmYellow)
        ingameBlack_Meter.setValue(engine.vision.ingameBlack)
        inGameNotBlack_Meter.setValue(engine.vision.inGameNotBlack)
        itemText_Meter.setValue(engine.vision.itemText)
        itemGrey_Meter.setValue(engine.vision.itemGrey)
        beacon_Meter.setValue(engine.vision.beacon)
        beaconNot_Meter.setValue(engine.vision.beaconNot)
        inventoryText_Meter.setValue(engine.vision.inventoryText)
        inventoryBlack_Meter.setValue(engine.vision.inventoryBlack)

        effects.forEach(ele => { ele.draw() })
        effects = effects.filter(ele => !(ele.lifetime <= 0))

        DrawHUD()
        ctx.drawImage(hiddenCanvas, 0, 0)
        window.requestAnimationFrame(update)
    }
    //#endregion

    //#region Meter Declarations

    // -------------------------------------------------------------------------
    // Meter objects
    // -------------------------------------------------------------------------
    const bossBarRed_Meter = new Meter(5, bossCallback)
    const bossText_Meter = new Meter(5, bossCallback)
    const coinsNumber_Meter = new Meter(5, coinCallback)
    const deathBlack1_Meter = new Meter(5, deathCallback)
    const deathBlack2_Meter = new Meter(5, deathCallback)
    const deathNotBlack_Meter = new Meter(5, deathCallback)
    const gloomNumber_Meter = new Meter(5, gloomCallback)
    const guardBar_Meter = new Meter(5, guardCallback)
    const healthBarRed_Meter = new Meter(5, healthDispatch)
    const healthConfirmRed_Meter = new Meter(3, inGameDetect)
    const resolveBarYellow_Meter = new Meter(5, resolveCallback)
    const resolveConfirmYellow_Meter = new Meter(5, resolveCallback)
    const ingameBlack_Meter = new Meter(3, inGameDetect)
    const inGameNotBlack_Meter = new Meter(3, inGameDetect)
    const itemText_Meter = new Meter(5, itemCallback)
    const itemGrey_Meter = new Meter(5, itemCallback)
    const beacon_Meter = new Meter(5, beaconCallback)
    const beaconNot_Meter = new Meter(5, beaconCallback)
    const inventoryText_Meter = new Meter(5, inventoryCallback)
    const inventoryBlack_Meter = new Meter(5, inventoryCallback)
    //#endregion

    //#region Callbacks

    // -------------------------------------------------------------------------
    // Global state flags
    // -------------------------------------------------------------------------
    let gInGame = false
    let deathGoing = false
    let beaconGoing = false
    let itemGoing = false
    let coinGoing = false
    let gloomGoing = false
    let bossGoing = false
    let lowHealthGoing = false
    let healingGoing = false
    let resolveGoing = false
    let guardGoing = false
    let damageGoing = false
    let inventoryGoing = false

    // -------------------------------------------------------------------------
    // Callbacks
    // -------------------------------------------------------------------------

    function inGameDetect() {
        if ((ingameBlack_Meter.value >= .95 && inGameNotBlack_Meter.value < .1 && healthConfirmRed_Meter.value >= .95) && !gInGame) {
            gInGame = true
        } else if ((healthConfirmRed_Meter.value < .1 || ingameBlack_Meter.value < .1) && gInGame) {
            gInGame = false
        }
    }

    // Health & Resolve bar HUDs — drawn every frame (called from update, not pooled
    // effects), scaled by their meter readings. In game they track the on-screen bars;
    // with Bar Adjust they draw full-size out of game for positioning. Modeled on
    // DeltaForce.html / Fortnite.html DrawHUD.
    function DrawHUD() {
        if (gInGame) {
            if (enableHP)      DrawRect(HealthBarX * 3.2,  HealthBarY * 2,  healthBarRed_Meter.value     * (HealthBarWidth * 3.2),  HealthBarHeight * 2,  healthColor)
            if (enableResolve) DrawRect(ResolveBarX * 3.2, ResolveBarY * 2, resolveBarYellow_Meter.value * (ResolveBarWidth * 3.2), ResolveBarHeight * 2, resolveColor)
        } else if (adjToggle) {
            if (enableHP)      DrawRect(HealthBarX * 3.2,  HealthBarY * 2,  HealthBarWidth * 3.2,  HealthBarHeight * 2,  healthColor)
            if (enableResolve) DrawRect(ResolveBarX * 3.2, ResolveBarY * 2, ResolveBarWidth * 3.2, ResolveBarHeight * 2, resolveColor)
        }
    }

    function deathCallback() {
        if (!gInGame && deathOn && (deathBlack1_Meter.value >= .95 && deathBlack2_Meter.value >= .95 && deathNotBlack_Meter.value < .1) && !deathGoing) {
            effects.push(new Death())
            deathGoing = true
        } else if (gInGame || (deathBlack1_Meter.value < .1 && deathBlack2_Meter.value < .1) || deathNotBlack_Meter.value >.1) {
            deathGoing = false
        }
    }

    function beaconCallback() {
        if (!gInGame && beaconOn && beacon_Meter.value >=.2 &&  beaconNot_Meter.value <.1 &&  !beaconGoing) {
            effects.push(new Beacon()) 
            beaconGoing = true
        } else if (gInGame || beacon_Meter.value <.1) {
            beaconGoing = false
        }
    }

    function itemCallback() {
        if (gInGame && itemOn && itemGrey_Meter.value >=.95 && itemText_Meter.value >=.2 && !itemGoing) {
            effects.push(new Item())
            itemGoing = true
        } else if (!gInGame || itemGrey_Meter.value <.1 || itemText_Meter.value <.1) {
            itemGoing = false
        }
    }

    function coinCallback() {
        if (gInGame && coinOn && coinsNumber_Meter.increased && coinsNumber_Meter.diff >= 0.01 &&  !coinGoing) {
            effects.push(new Coin())
            coinGoing = true
        }
    }

    function gloomCallback() {
        if (gInGame && gloomOn && gloomNumber_Meter.increased && gloomNumber_Meter.diff >= 0.01 && !gloomGoing) {
            effects.push(new Gloom())
            gloomGoing = true
        }
    }

    function bossCallback() {
        if (gInGame && bossOn && bossBarRed_Meter.value >=.95 && bossText_Meter.value >=.1 && !bossGoing) {
            effects.push(new Boss())
            bossGoing = true
        } else if(bossBarRed_Meter.value <.1 || bossText_Meter.value <.1){
            bossGoing = false
        }
    }

    function lowHealthCallback() {
        if (gInGame && lowHealthOn && healthConfirmRed_Meter.value >= .95 && healthBarRed_Meter.value < .3 && !lowHealthGoing) {
            effects.push(new LowHealth())
            lowHealthGoing = true
        } else if (!gInGame || healthBarRed_Meter.value >.3) {
            lowHealthGoing = false
        }
    }

    function healingCallback() {
        if (gInGame && healingOn && healthConfirmRed_Meter.value >= .95 && healthBarRed_Meter.increased && healthBarRed_Meter.diff >=.02 && !healingGoing) {
            effects.push(new Healing())
            healingGoing = true
        } 
            
        
    }

    function resolveCallback() {
        if (gInGame && resolveOn && resolveBarYellow_Meter.decreased && resolveBarYellow_Meter.diff > .2 && !resolveGoing) {
            effects.push(new Resolve())
            resolveGoing = true
        }
    }

    function guardCallback() {
        if (gInGame && guardOn && guardBar_Meter.increased && guardBar_Meter.diff >=.2 &&  !guardGoing) {
            effects.push(new Guard())
            guardGoing = true
        }
    }

    function damageCallback() {
        if (gInGame && damageOn && healthConfirmRed_Meter.value >= .95 && healthBarRed_Meter.decreased && healthBarRed_Meter.diff >=.05 && !damageGoing) {
            effects.push(new Damage())
            damageGoing = true
        }
    }

    // healthBarRed drives three events; fan its updates out to each.
    function healthDispatch() {
        lowHealthCallback()
        healingCallback()
        damageCallback()
    }

    function inventoryCallback() {
        if (!gInGame && inventoryOn && inventoryText_Meter.value >= .2 && inventoryBlack_Meter.value >= .95 && !inventoryGoing) {
            effects.push(new Inventory())
            inventoryGoing = true
        } else if (gInGame || inventoryText_Meter.value < .1) {
            inventoryGoing = false
        }
    }
    //#endregion

    //#region Background Modes
    // ═══════════════════════════════════════════════════════════
    // BACKGROUND SYSTEM
    // Eight modes selected by the backgroundMode control.
    // ═══════════════════════════════════════════════════════════
    let proBack = [0, 0, 0]
    function onbackColorChanged() {
        proBack = hexToHSL(backColor)
    }

    let audioEase = { sat: 0, lit: 0 }
    let gCycle = 0

    function updateAudioEase() {
        const targetDensity = engine.audio.density * 100
        audioEase.sat += (targetDensity - audioEase.sat) / 10
        audioEase.lit += (targetDensity - audioEase.lit) / 10
    }

    function getColorString(hue, sat, lit, alpha) {
        return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`
    }

    function updateColorCycle() {
        gCycle = (gCycle + 0.5) % 360
    }

    function backgroundHandler() {
        const alpha = ambienceAlpha / 100

        if (backgroundMode.includes('Color Cycle')) updateColorCycle()
        if (backgroundMode.includes('Audio'))       updateAudioEase()

        if (backgroundMode.includes('Ambience')) {
            if (backgroundMode === 'Ambience Audio Visualizer') {
                copyScreenAudio(alpha)
            } else {
                copyScreen(alpha)
            }
            return
        }

        const hue = proBack[0] + (backgroundMode.includes('Color Cycle') ? gCycle : 0)
        const sat = backgroundMode.includes('Audio') ? audioEase.sat * 0.33 + 66 : proBack[1]
        const lit = backgroundMode.includes('Audio') ? audioEase.lit * 0.9  + 10 : proBack[2]
        DrawRect(0, 0, 320, 200, getColorString(hue, sat, lit, alpha))
    }

    const ZONE_COLS   = 28
    const ZONE_ROWS   = 20
    const TOTAL_ZONES = ZONE_COLS * ZONE_ROWS

    function copyScreenAudio(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat       = new Int8Array(engine.zone.saturation)
        const hue       = new Int16Array(engine.zone.hue)
        const w = 320 / ZONE_COLS
        const h = 200 / ZONE_ROWS
        const satMultiplier = audioEase.sat / 200 + 0.5
        const litMultiplier = audioEase.lit / 100
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            hiddenCtx.fillStyle = getColorString(
                hue[iZone],
                sat[iZone] * satMultiplier,
                lightness[iZone] * litMultiplier,
                alpha
            )
            hiddenCtx.fillRect(col * w, row * h, w, h)
        }
    }

    function copyScreen(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat       = new Int8Array(engine.zone.saturation)
        const hue       = new Int16Array(engine.zone.hue)
        const w = 320 / ZONE_COLS
        const h = 200 / ZONE_ROWS
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const finalHue = backgroundMode === 'Custom Ambience'
                ? proBack[0]
                : hue[iZone] + (backgroundMode === 'Color Cycle Ambience' ? gCycle : 0)
            hiddenCtx.fillStyle = getColorString(finalHue, sat[iZone], lightness[iZone], alpha)
            hiddenCtx.fillRect(col * w, row * h, w, h)
        }
    }
    //#endregion

    //#region Helper Functions
    // ═══════════════════════════════════════════════════════════
    // HELPER FUNCTIONS — draw primitives target hiddenCtx
    // ═══════════════════════════════════════════════════════════
    function DrawRect(x, y, w, h, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.fillRect(x, y, w, h)
    }

    function strokeRect(x, y, w, h, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.rect(x, y, w, h)
        hiddenCtx.stroke()
    }

    function DrawCircle(x, y, radius, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
        hiddenCtx.fill()
    }

    function DrawStroke(x, y, radius, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
        hiddenCtx.stroke()
    }

    function DrawLine(start, end, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.moveTo(start[0], start[1])
        hiddenCtx.lineTo(end[0], end[1])
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.stroke()
    }

    function DrawArc(x, y, start, end, radius, direction, color) {
        hiddenCtx.beginPath()
        hiddenCtx.arc(x, y, radius, start, end, direction)
        hiddenCtx.fillStyle = color
        hiddenCtx.fill()
    }

    function DrawEllipse(x, y, w, h, rotation, color) {
        hiddenCtx.beginPath()
        hiddenCtx.ellipse(x, y, w, h, rotation, 0, Math.PI * 2)
        hiddenCtx.fillStyle = color
        hiddenCtx.fill()
    }

    function DrawTriangle(x1, y1, x2, y2, x3, y3, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.moveTo(x1, y1)
        hiddenCtx.lineTo(x2, y2)
        hiddenCtx.lineTo(x3, y3)
        hiddenCtx.lineTo(x1, y1)
        hiddenCtx.fill()
    }

    function DrawPath(x, y, path, color, scaleX, scaleY) {
        hiddenCtx.fillStyle = color
        hiddenCtx.save()
        hiddenCtx.translate(x, y)
        hiddenCtx.scale(scaleX, scaleY)
        hiddenCtx.fill(new Path2D(path))
        hiddenCtx.restore()
    }

    function hexToRgb(hex) {
        var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex)
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : null
    }

    function hexToHSL(hex) {
        const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || []
        const rgb = [r, g, b].map(x => parseInt(x, 16) / 255)
        const max = Math.max(...rgb)
        const min = Math.min(...rgb)
        const l = (max + min) / 2
        if (max === min) return [0, 0, Math.round(l * 100)]
        const d = max - min
        const s = l > 0.5 ? d / (2 - max - min) : d / (max + min)
        let h
        const [nr, ng, nb] = rgb
        if      (max === nr) h = (ng - nb) / d + (ng < nb ? 6 : 0)
        else if (max === ng) h = (nb - nr) / d + 2
        else                 h = (nr - ng) / d + 4
        return [Math.round(h * 60), Math.round(s * 100), Math.round(l * 100)]
    }

    // Meter(size, callback): frame-stabilizing debouncer for vision signals.
    function Meter(size, callback) {
        this.size = size
        this.value = 0
        this.diff = 0
        this.increased = false
        this.decreased = false
        var values = []
        this.setValue = function (updatedValue) {
            values.push(updatedValue)
            if (values.length > this.size) values.shift()
            for (var i = 0; i < values.length - 1; i++) {
                if (values[i] !== values[i + 1]) return
            }
            if (this.value !== values[0]) {
                this.diff = Math.abs(this.value - values[0])
                this.increased = this.value < values[0]
                this.decreased = this.value > values[0]
                this.value = values[0]
                callback()
            }
        }
    }

    // Death
function Death() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        // Black ash motes spread across the WHOLE canvas, rising slowly. Black
        // so they read as dark specks against the red death-glow rather than
        // blending into it.
        this.embers = []
        for (var i = 0; i < 90; i++) {
            this.embers.push({
                x: Math.random() * 320,
                y: Math.random() * 200,
                speed: 0.2 + Math.random() * 0.5,
                size: 10 + Math.random() * 3,
                drift: (Math.random() - 0.5) * 0.3
            })
        }
        this.draw = function () {
            this.frame++
            if (!deathGoing && !this.fadingOut) {
                this.fadingOut = true
            }
            if (this.fadingOut) {
                this.alpha -= 0.02
                if (this.alpha <= 0) {
                    this.alpha = 0
                    this.lifetime = 0
                    return
                }
            } else {
                if (this.alpha < 1) {
                    this.alpha += 0.02
                    if (this.alpha > 1) this.alpha = 1
                }
            }
            var a = this.alpha
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)
            var pulse = 0.5 + 0.5 * Math.sin(this.frame * 0.05)
            var grad = hiddenCtx.createRadialGradient(160, 100, 10, 160, 100, 230)
            grad.addColorStop(0, `hsla(0, 90%, ${25 + pulse * 15}%, ${a})`)
            grad.addColorStop(0.5, `hsla(0, 85%, 12%, ${a * 0.7})`)
            grad.addColorStop(1, `hsla(0, 0%, 0%, 0)`)
            hiddenCtx.fillStyle = grad
            hiddenCtx.fillRect(0, 0, 320, 200)
            for (var i = 0; i < this.embers.length; i++) {
                var e = this.embers[i]
                e.y -= e.speed
                e.x += e.drift
                if (e.y < -5) {
                    e.y = 205
                    e.x = Math.random() * 320
                }
                var flick = 0.6 + 0.4 * Math.sin(this.frame * 0.1 + i)
                DrawCircle(e.x, e.y, e.size, `hsla(0, 0%, 0%, ${a * flick})`)
            }
            var textAlpha = a * (0.7 + 0.3 * pulse)
            var cx = 160
            var cy = 100
            hiddenCtx.save()
            hiddenCtx.globalAlpha = textAlpha
            hiddenCtx.font = 'bold 56px serif'
            hiddenCtx.textAlign = 'center'
            hiddenCtx.textBaseline = 'middle'
            hiddenCtx.fillStyle = `hsla(0, 90%, 45%, ${textAlpha})`
            hiddenCtx.shadowColor = `hsla(0, 100%, 30%, ${textAlpha})`
            hiddenCtx.shadowBlur = 30
            hiddenCtx.fillText('YOU DIED', cx, cy)
            hiddenCtx.restore()
           // var ringR = 60 + pulse * 45
            //DrawStroke(160, 100, ringR, `hsla(0, 0%, 0%, ${a * (0.5 + (1 - pulse) * 0.4)})`, 12)
        }
    }

    // Beacon
function Beacon() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        const cy = 100
        // A row of big flames across the middle, spread edge to edge.
        this.flames = []
        const NUM = 6
        for (var i = 0; i < NUM; i++) {
            this.flames.push({
                x: 34 + i * (252 / (NUM - 1)),   // 34 → 286
                phase: Math.random() * 6.28,
                spd: 0.15 + Math.random() * 0.07
            })
        }
        // Embers, each tied to one flame so they rise off it.
        this.embers = []
        for (var i = 0; i < 54; i++) {
            var fi = Math.floor(Math.random() * NUM)
            this.embers.push({
                fi: fi,
                x: this.flames[fi].x + (Math.random() - 0.5) * 34,
                y: cy + Math.random() * 20,
                vy: 0.3 + Math.random() * 0.7,
                drift: (Math.random() - 0.5) * 0.3,
                size: 1 + Math.random() * 2,
                phase: Math.random() * 6.28
            })
        }
        this.draw = function () {
            this.frame++
            const HOLD = 240
            if ((!beaconGoing || this.frame > HOLD) && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.02
                if (this.alpha <= 0) { this.alpha = 0; this.lifetime = 0; return }
            } else if (this.alpha < 1) {
                this.alpha += 0.02
                if (this.alpha > 1) this.alpha = 1
            }
            var a = this.alpha

            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)

            // Warm horizontal band lighting the middle of the room.
            var amb = hiddenCtx.createLinearGradient(0, cy - 95, 0, cy + 95)
            amb.addColorStop(0, `hsla(28, 70%, 6%, 0)`)
            amb.addColorStop(0.5, `hsla(32, 80%, 22%, ${a * 0.4})`)
            amb.addColorStop(1, `hsla(24, 70%, 6%, 0)`)
            hiddenCtx.fillStyle = amb
            hiddenCtx.fillRect(0, 0, 320, 200)

            // Each flame flickers on its own phase — bigger stacked teardrops.
            for (var i = 0; i < this.flames.length; i++) {
                var fl = this.flames[i]
                var fx = fl.x
                var flick = 0.7 + 0.3 * Math.sin(this.frame * fl.spd + fl.phase) + 0.1 * Math.sin(this.frame * 0.37 + fl.phase)
                var fh = 72 * flick

                // Per-flame warm glow pool.
                var g = hiddenCtx.createRadialGradient(fx, cy, 4, fx, cy, 62)
                g.addColorStop(0, `hsla(36, 90%, 34%, ${a * 0.5})`)
                g.addColorStop(1, `hsla(28, 70%, 8%, 0)`)
                hiddenCtx.fillStyle = g
                hiddenCtx.fillRect(fx - 62, cy - 62, 124, 124)

                // Flame body.
                DrawEllipse(fx, cy - fh * 0.2, 24, fh * 0.9, 0, `hsla(30, 90%, 42%, ${a * 0.85})`)
                DrawEllipse(fx, cy - fh * 0.3, 15, fh * 0.7, 0, `hsla(40, 95%, 55%, ${a})`)
                DrawEllipse(fx, cy - fh * 0.35, 8, fh * 0.5, 0, `hsla(48, 100%, 78%, ${a})`)
                // Base coals.
                DrawEllipse(fx, cy + 8, 30, 8, 0, `hsla(20, 85%, 30%, ${a})`)
                DrawCircle(fx, cy + 6, 5, `hsla(44, 100%, 70%, ${a * flick})`)
            }

            // Embers rising off their flames.
            for (var i = 0; i < this.embers.length; i++) {
                var e = this.embers[i]
                e.y -= e.vy; e.x += e.drift + Math.sin(this.frame * 0.05 + e.phase) * 0.2
                if (e.y < 26) {
                    var f = this.flames[e.fi]
                    e.y = cy + Math.random() * 16
                    e.x = f.x + (Math.random() - 0.5) * 30
                }
                var tw = 0.5 + 0.5 * Math.sin(this.frame * 0.12 + e.phase)
                DrawCircle(e.x, e.y, e.size, `hsla(38, 95%, 60%, ${a * tw * 0.8})`)
            }
        }
    }

    // Item
function Item() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.draw = function () {
            this.frame++
            const HOLD = 150
            if ((!itemGoing || this.frame > HOLD) && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.02
                if (this.alpha <= 0) { this.alpha = 0; this.lifetime = 0; return }
            } else if (this.alpha < 1) {
                this.alpha += 0.02
                if (this.alpha > 1) this.alpha = 1
            }
            var a = this.alpha
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)

            // The object rises over the first ~50 frames and settles.
            var rise = Math.min(1, this.frame / 50)
            var ease = 1 - Math.pow(1 - rise, 3)
            var cx = 160
            var cy = 150 - ease * 55
            var pulse = 0.6 + 0.4 * Math.sin(this.frame * 0.08)

            // Blue ground-glow bloom behind the item.
            var grad = hiddenCtx.createRadialGradient(cx, cy, 4, cx, cy, 150)
            grad.addColorStop(0, `hsla(215, 90%, ${44 + pulse * 12}%, ${a * 0.85})`)
            grad.addColorStop(0.4, `hsla(220, 85%, 26%, ${a * 0.5})`)
            grad.addColorStop(1, `hsla(225, 80%, 8%, 0)`)
            hiddenCtx.fillStyle = grad
            hiddenCtx.fillRect(0, 0, 320, 200)

            // Single white ring pushed out — flies past the screen edges and
            // fades to nothing as it goes (corners sit ~189px from center).
            var ringP = Math.min(1, this.frame / 60)
            if (ringP < 1) {
                // Ease-in growth: begins small and tight, then flings outward.
                DrawStroke(cx, cy, 1 + ringP * ringP * 260, `hsla(0, 0%, 100%, ${a * (1 - ringP) * 0.9})`, 12)
            }

            // The relic itself: a small faceted amber gem lifting and turning.
            hiddenCtx.save()
            hiddenCtx.translate(cx, cy)
            hiddenCtx.rotate(Math.sin(this.frame * 0.04) * 0.4)
            hiddenCtx.scale(ease, ease)
            var TOP = -52, BOT = 58, SIDE = 40
            // Two facets — bright white right, warm yellow left.
            DrawTriangle(0, TOP, SIDE, 0, 0, BOT, `hsla(50, 100%, 82%, ${a})`)
            DrawTriangle(0, TOP, -SIDE, 0, 0, BOT, `hsla(48, 95%, 58%, ${a})`)
            // Bright thick facet edges + spine + girdle.
            DrawLine([0, TOP], [SIDE, 0], `hsla(0, 0%, 100%, ${a})`, 4)
            DrawLine([SIDE, 0], [0, BOT], `hsla(0, 0%, 100%, ${a})`, 4)
            DrawLine([0, BOT], [-SIDE, 0], `hsla(0, 0%, 100%, ${a})`, 4)
            DrawLine([-SIDE, 0], [0, TOP], `hsla(0, 0%, 100%, ${a})`, 4)
            DrawLine([0, TOP], [0, BOT], `hsla(0, 0%, 100%, ${a * (0.7 + pulse * 0.3)})`, 4)
            DrawLine([-SIDE, 0], [SIDE, 0], `hsla(52, 100%, 80%, ${a * 0.85})`, 3)
            hiddenCtx.restore()
        }
    }

    // Coin
function Coin() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.coins = []
        for (var i = 0; i < 18; i++) {
            this.coins.push({
                x: 55 + Math.random() * 210,
                y: 210 + Math.random() * 90,
                vy: 1.6 + Math.random() * 1.4,
                r: 14 + Math.random() * 9,
                phase: Math.random() * 6.28,
                spin: 0.08 + Math.random() * 0.06,
                born: Math.floor(Math.random() * 45)
            })
        }
        this.draw = function () {
            this.frame++
            const HOLD = 150
            if ((!coinGoing || this.frame > HOLD) && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.03
                if (this.alpha <= 0) { this.alpha = 0; this.lifetime = 0;coinGoing = false; return }
            } else if (this.alpha < 1) {
                this.alpha += 0.04
                if (this.alpha > 1) this.alpha = 1
            }
            var a = this.alpha
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)

            for (var i = 0; i < this.coins.length; i++) {
                var c = this.coins[i]
                if (this.frame < c.born) continue
                c.y -= c.vy; c.vy *= 0.992
                if (c.y < -20) { c.y = 220 + Math.random() * 40; c.vy = 1.6 + Math.random() * 1.4; c.x = 90 + Math.random() * 140 }
                // Spin: horizontal squash of the disc via a cosine.
                var squash = Math.abs(Math.cos(this.frame * c.spin + c.phase))
                squash = Math.max(0.12, squash)
                var glow = 0.55 + 0.45 * squash
                // Coin glow.
                DrawCircle(c.x, c.y, c.r + 3, `hsla(44, 90%, 55%, ${a * 0.25})`)
                // Disc.
                DrawEllipse(c.x, c.y, c.r * squash, c.r, 0, `hsla(46, 92%, ${40 + glow * 18}%, ${a})`)
                DrawEllipse(c.x, c.y, c.r * squash * 0.6, c.r * 0.6, 0, `hsla(50, 95%, ${58 + glow * 20}%, ${a})`)
                // Bright glint edge as it turns face-on.
                if (squash > 0.85) {
                    DrawLine([c.x, c.y - c.r], [c.x, c.y + c.r], `hsla(54, 100%, 92%, ${a * (squash - 0.85) * 6})`, 1.5)
                }
            }
        }
    }

    // Gloom
function Gloom() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        // Orbs scattered across the whole canvas, each pulled toward center at
        // its own speed, starting at its own time, and wandering as it drifts
        // in — so the gathering reads organic rather than a synchronized sweep.
        this.orbs = []
        for (var i = 0; i < 26; i++) {
            var ang = Math.random() * Math.PI * 2
            var dist = 110 + Math.random() * 130
            this.orbs.push({
                x: 160 + Math.cos(ang) * dist,
                y: 100 + Math.sin(ang) * dist * 0.7,
                size: 13 + Math.random() * 22,
                pull: 0.012 + Math.random() * 0.038,   // some drift in fast, some slow
                born: Math.floor(Math.random() * 48),  // staggered start times
                wobAmp: 5 + Math.random() * 14,        // how far it wanders off its path
                wobSpd: 0.03 + Math.random() * 0.05,
                wobPhase: Math.random() * 6.28,
                phase: Math.random() * 6.28
            })
        }
        this.draw = function () {
            this.frame++
            const HOLD = 150
            if ((!gloomGoing || this.frame > HOLD) && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.03
                if (this.alpha <= 0) { this.alpha = 0; this.lifetime = 0;gloomGoing = false; return }
            } else if (this.alpha < 1) {
                this.alpha += 0.04
                if (this.alpha > 1) this.alpha = 1
            }
            var a = this.alpha

            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)

            // Each orb starts on its own frame, eases toward center at its own
            // pace, and wanders sideways as it goes. Per-orb fade-in staggers
            // their arrival so they never appear all at once.
            for (var i = 0; i < this.orbs.length; i++) {
                var o = this.orbs[i]
                var age = this.frame - o.born
                if (age <= 0) continue
                o.x += (160 - o.x) * o.pull
                o.y += (100 - o.y) * o.pull
                // Organic wander — a drawn offset, so it sways without drifting
                // off course permanently.
                var wx = Math.sin(this.frame * o.wobSpd + o.wobPhase) * o.wobAmp
                var wy = Math.cos(this.frame * o.wobSpd * 0.7 + o.wobPhase) * o.wobAmp * 0.6
                var dx = o.x + wx, dy = o.y + wy
                var app = Math.min(1, age / 22)
                var tw = 0.6 + 0.4 * Math.sin(this.frame * 0.08 + o.phase)
                // Soft halo, then the bright core.
                DrawCircle(dx, dy, o.size, `hsla(0, 0%, 82%, ${a * app * 0.28 * tw})`)
                DrawCircle(dx, dy, o.size * 0.55, `hsla(0, 0%, 100%, ${a * app * tw})`)
            }
        }
    }

    // Boss
function Boss() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.draw = function () {
            this.frame++
            const HOLD = 240
            if ((!bossGoing || this.frame > HOLD) && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.02
                if (this.alpha <= 0) { this.alpha = 0; this.lifetime = 0; return }
            } else if (this.alpha < 1) {
                this.alpha += 0.02
                if (this.alpha > 1) this.alpha = 1
            }
            var a = this.alpha
            var pulse = 0.5 + 0.5 * Math.sin(this.frame * 0.06)
            var cx = 160, cy = 100

            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)

            // Pinwheel of colored rays behind — slow spin, alternating
            // red / orange / yellow.
            var rays = 18
            hiddenCtx.save()
            hiddenCtx.translate(cx, cy)
            hiddenCtx.rotate(this.frame * 0.004)
            for (var i = 0; i < rays; i++) {
                // Alternating red and black blades.
                var isRed = (i % 2) === 0
                hiddenCtx.save()
                hiddenCtx.rotate((i / rays) * Math.PI * 2)
                hiddenCtx.beginPath()
                hiddenCtx.moveTo(0, 0)
                hiddenCtx.lineTo(-16, 320)
                hiddenCtx.lineTo(16, 320)
                hiddenCtx.closePath()
                hiddenCtx.fillStyle = isRed
                    ? `hsla(0, 95%, 50%, ${a * (0.5 + pulse * 0.25)})`
                    : `hsla(0, 0%, 1%, ${a * (0.75 + pulse * 0.2)})`
                hiddenCtx.fill()
                hiddenCtx.restore()
            }
            hiddenCtx.restore()

            // ── The monster head ────────────────────────────────────
            var appear = Math.min(1, this.frame / 30)
            var eApp = 1 - Math.pow(1 - appear, 3)
            var scale = eApp * (0.9 + 0.02 * Math.sin(this.frame * 0.06))  // breathes
            var DARK = `hsla(0, 0%, 4%, ${a})`
            var RIM  = `hsla(0, 95%, 48%, ${a})`

            hiddenCtx.save()
            hiddenCtx.translate(cx, cy + 4)
            hiddenCtx.scale(scale, scale)

            // Horns sweeping up and out.
            for (var s = -1; s <= 1; s += 2) {
                hiddenCtx.beginPath()
                hiddenCtx.moveTo(s * 30, -40)
                hiddenCtx.quadraticCurveTo(s * 74, -70, s * 96, -122)
                hiddenCtx.quadraticCurveTo(s * 58, -72, s * 18, -48)
                hiddenCtx.closePath()
                hiddenCtx.fillStyle = DARK
                hiddenCtx.fill()
                hiddenCtx.strokeStyle = RIM
                hiddenCtx.lineWidth = 2.5
                hiddenCtx.stroke()
            }

            // Skull / head silhouette.
            hiddenCtx.beginPath()
            hiddenCtx.moveTo(-46, -30)
            hiddenCtx.quadraticCurveTo(-46, -80, 0, -80)
            hiddenCtx.quadraticCurveTo(46, -80, 46, -30)
            hiddenCtx.quadraticCurveTo(46, 8, 26, 22)
            hiddenCtx.quadraticCurveTo(14, 58, 0, 66)
            hiddenCtx.quadraticCurveTo(-14, 58, -26, 22)
            hiddenCtx.quadraticCurveTo(-46, 8, -46, -30)
            hiddenCtx.closePath()
            hiddenCtx.fillStyle = DARK
            hiddenCtx.fill()
            hiddenCtx.strokeStyle = RIM
            hiddenCtx.lineWidth = 2.5
            hiddenCtx.stroke()

            // Brow ridge — dark angled bar over the eyes.
            hiddenCtx.beginPath()
            hiddenCtx.moveTo(-40, -26)
            hiddenCtx.lineTo(-8, -14)
            hiddenCtx.lineTo(8, -14)
            hiddenCtx.lineTo(40, -26)
            hiddenCtx.lineTo(40, -12)
            hiddenCtx.lineTo(-40, -12)
            hiddenCtx.closePath()
            hiddenCtx.fillStyle = DARK
            hiddenCtx.fill()

            // Eyes — glowing angry slits.
            var eyeFlare = 0.6 + 0.4 * pulse
            for (var s = -1; s <= 1; s += 2) {
                var ex = s * 22, ey = -6
                var eg = hiddenCtx.createRadialGradient(ex, ey, 0, ex, ey, 22)
                eg.addColorStop(0, `hsla(50, 100%, 65%, ${a * eyeFlare})`)
                eg.addColorStop(0.5, `hsla(28, 100%, 50%, ${a * eyeFlare * 0.6})`)
                eg.addColorStop(1, `hsla(15, 100%, 40%, 0)`)
                hiddenCtx.fillStyle = eg
                hiddenCtx.beginPath()
                hiddenCtx.arc(ex, ey, 22, 0, Math.PI * 2)
                hiddenCtx.fill()
                // Bright slit, angled inward for a scowl.
                hiddenCtx.save()
                hiddenCtx.translate(ex, ey)
                hiddenCtx.rotate(s * -0.35)
                hiddenCtx.beginPath()
                hiddenCtx.ellipse(0, 0, 12, 4.5, 0, 0, Math.PI * 2)
                hiddenCtx.fillStyle = `hsla(52, 100%, 82%, ${a})`
                hiddenCtx.fill()
                hiddenCtx.restore()
            }

            // Maw — dark mouth glowing from within, ringed with teeth.
            hiddenCtx.beginPath()
            hiddenCtx.ellipse(0, 34, 22, 12, 0, 0, Math.PI * 2)
            hiddenCtx.fillStyle = `hsla(0, 60%, 4%, ${a})`
            hiddenCtx.fill()
            var mg = hiddenCtx.createRadialGradient(0, 34, 2, 0, 34, 22)
            mg.addColorStop(0, `hsla(40, 100%, 60%, ${a * (0.7 + pulse * 0.3)})`)
            mg.addColorStop(0.6, `hsla(15, 100%, 42%, ${a * 0.5})`)
            mg.addColorStop(1, `hsla(0, 90%, 20%, 0)`)
            hiddenCtx.fillStyle = mg
            hiddenCtx.beginPath()
            hiddenCtx.ellipse(0, 34, 20, 10, 0, 0, Math.PI * 2)
            hiddenCtx.fill()
            for (var t = -3; t <= 3; t++) {
                var tx = t * 6
                hiddenCtx.beginPath()      // upper fangs
                hiddenCtx.moveTo(tx - 3, 24)
                hiddenCtx.lineTo(tx + 3, 24)
                hiddenCtx.lineTo(tx, 34)
                hiddenCtx.closePath()
                hiddenCtx.fillStyle = `hsla(40, 40%, 88%, ${a})`
                hiddenCtx.fill()
                hiddenCtx.beginPath()      // lower fangs
                hiddenCtx.moveTo(tx - 3, 44)
                hiddenCtx.lineTo(tx + 3, 44)
                hiddenCtx.lineTo(tx, 36)
                hiddenCtx.closePath()
                hiddenCtx.fill()
            }

            hiddenCtx.restore()
        }
    }

    // LowHealth
function LowHealth() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.wait = 16
        this.pending = 0    // frames until the softer "dub" ring
        this.beat = 0       // 0..1 pulse strength, bumped per beat, decays
        this.rings = []     // expanding hollow rings
        const cx = 160, cy = 100
        const DOTS = 12     // satellites around center
        this.draw = function () {
            this.frame++
            const HOLD = 240
            if ((!lowHealthGoing || this.frame > HOLD) && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.03
                if (this.alpha <= 0) { this.alpha = 0; this.lifetime = 0; return }
            } else if (this.alpha < 1) {
                this.alpha += 0.04
                if (this.alpha > 1) this.alpha = 1
            }
            var a = this.alpha

            // Heartbeat ~62bpm: a strong lub, then a softer dub 15 frames later.
            if (--this.wait <= 0) {
                this.rings.push({ r: 22, amp: 1, w: 13 })
                this.beat = 1
                this.pending = 15
                this.wait = 58
            }
            if (this.pending > 0 && --this.pending === 0) {
                this.rings.push({ r: 18, amp: 0.6, w: 9 })
                this.beat = Math.max(this.beat, 0.6)
            }
            this.beat *= 0.88

            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)

            // Expanding rings — grow outward and fade as they go.
            for (var i = 0; i < this.rings.length; i++) {
                var rg = this.rings[i]
                rg.r += 3.4
                rg.amp -= 0.011
                var la = Math.max(0, rg.amp) * a
                DrawStroke(cx, cy, rg.r, `hsla(0, 92%, ${45 + rg.amp * 15}%, ${la})`, rg.w * Math.max(0.3, rg.amp))
            }
            this.rings = this.rings.filter(r => r.amp > 0 && r.r < 270)

            // Satellite dots pulsing on the beat, breathing radius.
            var orbit = 46 + this.beat * 20
            for (var d = 0; d < DOTS; d++) {
                var ang = (d / DOTS) * Math.PI * 2 + this.frame * 0.004
                var dx = cx + Math.cos(ang) * orbit
                var dy = cy + Math.sin(ang) * orbit * 0.8
                var ds = 6 + this.beat * 8
                DrawCircle(dx, dy, ds, `hsla(0, 90%, ${45 + this.beat * 20}%, ${a * (0.5 + this.beat * 0.5)})`)
            }

            // Central throbbing disc — bright core, soft red halo.
            var pr = 16 + this.beat * 26
            var core = hiddenCtx.createRadialGradient(cx, cy, 2, cx, cy, pr + 30)
            core.addColorStop(0, `hsla(0, 95%, ${45 + this.beat * 25}%, ${a})`)
            core.addColorStop(0.5, `hsla(0, 92%, 35%, ${a * (0.4 + this.beat * 0.4)})`)
            core.addColorStop(1, `hsla(0, 90%, 20%, 0)`)
            hiddenCtx.fillStyle = core
            hiddenCtx.beginPath()
            hiddenCtx.arc(cx, cy, pr + 30, 0, Math.PI * 2)
            hiddenCtx.fill()
        }
    }

    // Healing
function Healing() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.motes = []
        for (var i = 0; i < 34; i++) {
            var ang = Math.random() * Math.PI * 2
            var dist = 70 + Math.random() * 70
            this.motes.push({
                ang: ang, dist: dist,
                speed: 1.0 + Math.random() * 1.3,   // faster inward pull
                size: 8 + Math.random() * 4,        // bigger motes
                hue: 20 + Math.random() * 22        // orange → amber
            })
        }
        this.draw = function () {
            this.frame++
            const HOLD = 150
            if ((!healingGoing || this.frame > HOLD) && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.025
                if (this.alpha <= 0) { 
                    this.alpha = 0; 
                    this.lifetime = 0; 
                    healingGoing = false 
                    return
                }
            } else if (this.alpha < 1) {
                this.alpha += 0.03
                if (this.alpha > 1) this.alpha = 1
            }
            var a = this.alpha
            var cx = 160, cy = 100
            var pulse = 0.5 + 0.5 * Math.sin(this.frame * 0.09)

            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)

            // Central warm bloom — orange/amber.
            var grad = hiddenCtx.createRadialGradient(cx, cy, 6, cx, cy, 150)
            grad.addColorStop(0, `hsla(35, 90%, ${52 + pulse * 12}%, ${a * 0.75})`)
            grad.addColorStop(0.4, `hsla(25, 85%, 30%, ${a * 0.45})`)
            grad.addColorStop(1, `hsla(20, 80%, 8%, 0)`)
            hiddenCtx.fillStyle = grad
            hiddenCtx.fillRect(0, 0, 320, 200)

            // Motes spiralling inward and absorbed.
            for (var i = 0; i < this.motes.length; i++) {
                var m = this.motes[i]
                m.dist -= m.speed
                m.ang += 0.03
                if (m.dist < 4) { m.dist = 90 + Math.random() * 60; m.ang = Math.random() * Math.PI * 2 }
                var x = cx + Math.cos(m.ang) * m.dist
                var y = cy + Math.sin(m.ang) * m.dist * 0.75
                var near = 1 - m.dist / 150
                DrawCircle(x, y, m.size, `hsla(${m.hue}, 85%, 60%, ${a * near})`)
            }

            // A soft outward pulse ring, breathing — thicker and warm.
            var ringR = 30 + pulse * 60
            DrawStroke(cx, cy, ringR, `hsla(30, 90%, 58%, ${a * (1 - pulse) * 0.6})`, 6)
        }
    }

    // Resolve
function Resolve() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.exploded = false
        this.parts = []
        const cx = 160, cy = 100
        const BURST = 12        // frame the circle detonates
        // Shatter the central orb into outward-flying particles.
        this.explode = function () {
            this.exploded = true
            var M = 64
            for (var k = 0; k < M; k++) {
                var ang = Math.random() * Math.PI * 2
                var sp = 3.2 + Math.random() * 7
                this.parts.push({
                    x: cx, y: cy,
                    vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                    r: 4 + Math.random() * 6,
                    hue: 268 + Math.random() * 36,   // purple -> violet / magenta
                    lit: 55 + Math.random() * 22,
                    ph: Math.random() * 6.28
                })
            }
        }
        this.draw = function () {
            this.frame++
            const MAX = 90
            if ((!resolveGoing || this.frame > MAX) && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.1
                if (this.alpha <= 0) { this.alpha = 0; this.lifetime = 0;resolveGoing = false; return }
            } else if (this.alpha < 1) {
                this.alpha += 0.3
                if (this.alpha > 1) this.alpha = 1
            }
            var a = this.alpha

            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)

            if (!this.exploded) {
                // Charge: a purple orb grows and brightens before it bursts.
                var chg = this.frame / BURST
                var R = 14 + chg * 12
                var pulse = 0.6 + 0.4 * Math.sin(this.frame * 0.7)
                var g = hiddenCtx.createRadialGradient(cx, cy, 2, cx, cy, R + 24)
                g.addColorStop(0, `hsla(282, 95%, 72%, ${a})`)
                g.addColorStop(0.5, `hsla(276, 90%, 50%, ${a * 0.7})`)
                g.addColorStop(1, `hsla(270, 85%, 30%, 0)`)
                hiddenCtx.fillStyle = g
                hiddenCtx.beginPath(); hiddenCtx.arc(cx, cy, R + 24, 0, Math.PI * 2); hiddenCtx.fill()
                DrawCircle(cx, cy, R, `hsla(283, 92%, ${52 + pulse * 16}%, ${a})`)
                DrawCircle(cx, cy, R * 0.5, `hsla(292, 100%, 88%, ${a})`)
                if (this.frame >= BURST) this.explode()
            } else {
                // Shockwave ring from the burst.
                var since = this.frame - BURST
                if (since < 16) {
                    DrawStroke(cx, cy, since * 15, `hsla(285, 100%, 76%, ${a * (1 - since / 16) * 0.85})`, 12 * (1 - since / 16) + 2)
                }
                // Particles flying outward and off the screen.
                var live = 0
                for (var k = 0; k < this.parts.length; k++) {
                    var p = this.parts[k]
                    p.x += p.vx; p.y += p.vy; p.vx *= 0.996; p.vy *= 0.996
                    if (p.x > -12 && p.x < 332 && p.y > -12 && p.y < 212) {
                        live++
                        var tw = 0.7 + 0.3 * Math.sin(this.frame * 0.3 + p.ph)
                        DrawCircle(p.x, p.y, p.r, `hsla(${p.hue}, 90%, ${p.lit}%, ${a * tw})`)
                        DrawCircle(p.x, p.y, p.r * 0.45, `hsla(295, 100%, 90%, ${a * tw * 0.8})`)
                    }
                }
                // Once every particle has left the screen, wrap up.
                if (live === 0 && !this.fadingOut) this.fadingOut = true
            }
        }
    }

    // Guard
function Guard() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        // Cracks radiating from center, pre-rolled.
        this.cracks = []
        for (var i = 0; i < 7; i++) {
            var ang = (i / 7) * Math.PI * 2 + Math.random() * 0.4
            this.cracks.push({ ang: ang, len: 40 + Math.random() * 45, kink: (Math.random() - 0.5) * 0.5 })
        }
        this.draw = function () {
            this.frame++
            const HOLD = 90
            if ((!guardGoing || this.frame > HOLD) && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.04
                if (this.alpha <= 0) { this.alpha = 0; this.lifetime = 0;guardGoing = false; return }
            } else if (this.alpha < 1) {
                this.alpha += 0.18
                if (this.alpha > 1) this.alpha = 1
            }
            var a = this.alpha
            var cx = 160, cy = 100

            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)

            // Petrify: stone mass scales up hard in the first ~8 frames.
            var form = Math.min(1, this.frame / 8)
            var eForm = 1 - Math.pow(1 - form, 3)
            var R = 70 * eForm

            // Hardened body — bright warm core easing out to deep gold.
            var stone = hiddenCtx.createRadialGradient(cx - 20, cy - 24, 8, cx, cy, R)
            stone.addColorStop(0, `hsla(52, 100%, 92%, ${a})`)
            stone.addColorStop(0.55, `hsla(48, 95%, 62%, ${a})`)
            stone.addColorStop(1, `hsla(44, 90%, 40%, ${a})`)
            hiddenCtx.fillStyle = stone
            hiddenCtx.beginPath()
            hiddenCtx.arc(cx, cy, R, 0, Math.PI * 2)
            hiddenCtx.fill()

            // Fracture lines — kept dark, drawn thick so they read as deep cracks.
            for (var i = 0; i < this.cracks.length; i++) {
                var cr = this.cracks[i]
                var l = cr.len * eForm
                var mx = cx + Math.cos(cr.ang) * l * 0.5
                var my = cy + Math.sin(cr.ang) * l * 0.5
                var ex = cx + Math.cos(cr.ang + cr.kink) * l
                var ey = cy + Math.sin(cr.ang + cr.kink) * l
                DrawLine([cx, cy], [mx, my], `hsla(45, 30%, 10%, ${a})`, 5)
                DrawLine([mx, my], [ex, ey], `hsla(45, 30%, 10%, ${a})`, 4)
            }
            // Bright rim of light around the stone.
            DrawStroke(cx, cy, R, `hsla(50, 95%, 88%, ${a * 0.75})`, 4)

            // Deflect flash: thick yellow-white rings that snap out once early.
            var flashP = this.frame / 20
            if (flashP < 1) {
                var fr = R + flashP * 90
                DrawStroke(cx, cy, fr, `hsla(52, 100%, 92%, ${a * (1 - flashP)})`, 11 * (1 - flashP) + 3)
                DrawStroke(cx, cy, fr * 0.8, `hsla(46, 95%, 65%, ${a * (1 - flashP) * 0.7})`, 6 * (1 - flashP) + 2)
            }
        }
    }

    // Damage
function Damage() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        // The slashes are pre-rolled so they read identically every replay:
        // two roughly parallel diagonal rakes offset across the canvas.
        this.slashes = []
        for (var i = 0; i < 2; i++) {
            var oy = 60 + i * 70 + (Math.random() - 0.5) * 20
            this.slashes.push({
                x1: -30, y1: oy - 60,
                x2: 350, y2: oy + 70,
                born: 2 + i * 4,
                width: 16 - i * 3
            })
        }
        // Blood flung along the slash direction.
        this.motes = []
        for (var i = 0; i < 30; i++) {
            var ang = 0.5 + (Math.random() - 0.5) * 0.6
            var sp = 2 + Math.random() * 6
            this.motes.push({
                x: 10 + Math.random() * 240, y: 30 + Math.random() * 140,
                vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                size: 4 + Math.random() * 5,
                hue: 356 + Math.random() * 8
            })
        }
        this.draw = function () {
            this.frame++
            const HOLD = 34
            if ((!damageGoing || this.frame > HOLD) && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.06
                if (this.alpha <= 0) { this.alpha = 0; this.lifetime = 0;damageGoing = false; return }
            } else if (this.alpha < 1) {
                this.alpha += 0.25
                if (this.alpha > 1) this.alpha = 1
            }
            var a = this.alpha
            // Solid black backdrop so the slashes and spray read cleanly.
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)

            // Impact strength for the spray fade — background stays pure black.
            var punch = Math.max(0, 1 - this.frame / 22)

            // Slashes: a bright core streak that fades to a dark scar.
            for (var i = 0; i < this.slashes.length; i++) {
                var s = this.slashes[i]
                var age = this.frame - s.born
                if (age < 0) continue
                var life = Math.max(0, 1 - age / 26)
                DrawLine([s.x1, s.y1], [s.x2, s.y2], `hsla(0, 55%, 8%, ${a * life * 0.9})`, s.width + 6)
                DrawLine([s.x1, s.y1], [s.x2, s.y2], `hsla(0, 95%, 55%, ${a * life})`, s.width)
                DrawLine([s.x1, s.y1], [s.x2, s.y2], `hsla(2, 100%, 82%, ${a * life * life})`, s.width * 0.4)
            }

            // Blood spray.
            for (var i = 0; i < this.motes.length; i++) {
                var m = this.motes[i]
                m.x += m.vx; m.y += m.vy; m.vy += 0.12; m.vx *= 0.97
                DrawCircle(m.x, m.y, m.size, `hsla(${m.hue}, 90%, 42%, ${a * punch})`)
            }
        }
    }

    // Inventory
function Inventory() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.sel = 0
        this.draw = function () {
            this.frame++
            const HOLD = 190
            if ((!inventoryGoing || this.frame > HOLD) && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.04
                if (this.alpha <= 0) { this.alpha = 0; this.lifetime = 0; return }
            } else if (this.alpha < 1) {
                this.alpha += 0.05
                if (this.alpha > 1) this.alpha = 1
            }
            var a = this.alpha

            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)

            // Big panel — nearly full-screen with a margin all around, sliding
            // up into place over the first ~30 frames.
            var slide = Math.min(1, this.frame / 30)
            var ease = 1 - Math.pow(1 - slide, 3)
            var pw = 288, ph = 172
            var px = 160 - pw / 2                 // 16px side borders
            var py = (100 - ph / 2) + (1 - ease) * 30

            // Panel body — deep green gradient.
            var body = hiddenCtx.createLinearGradient(0, py, 0, py + ph)
            body.addColorStop(0, `hsla(142, 28%, 20%, ${a})`)
            body.addColorStop(1, `hsla(150, 34%, 10%, ${a})`)
            hiddenCtx.fillStyle = body
            hiddenCtx.fillRect(px, py, pw, ph)
            strokeRect(px, py, pw, ph, `hsla(130, 45%, 48%, ${a})`, 3)
            // Green title strip.
            DrawRect(px, py, pw, 22, `hsla(122, 40%, 34%, ${a * 0.9})`)

            // Slot grid — 6 x 3, appearing in reading order.
            var cols = 6, rows = 3, gap = 9, pad = 16
            var sw = (pw - pad * 2 - gap * (cols - 1)) / cols
            var gx = px + pad
            var gy = py + 30 + 8
            var total = cols * rows
            // Cursor sweeps through every slot.
            this.sel = Math.floor(this.frame / 16) % total
            for (var r = 0; r < rows; r++) {
                for (var c = 0; c < cols; c++) {
                    var idx = r * cols + c
                    var appear = Math.min(1, (this.frame - 30 - idx * 3) / 12)
                    if (appear <= 0) continue
                    var sx = gx + c * (sw + gap)
                    var sy = gy + r * (sw + gap)
                    var lit = (idx === this.sel)
                    // Slot wells in darker green; the selected one is white-bordered.
                    DrawRect(sx, sy, sw, sw, `hsla(145, 24%, ${lit ? 34 : 15}%, ${a * appear})`)
                    strokeRect(sx, sy, sw, sw,
                        lit ? `hsla(0, 0%, 100%, ${a * appear})` : `hsla(135, 30%, 40%, ${a * appear})`,
                        lit ? 3 : 1.5)
                    // Token glyph — white in the selected slot, green otherwise.
                    DrawCircle(sx + sw / 2, sy + sw / 2, sw * 0.18,
                        lit ? `hsla(0, 0%, 96%, ${a * appear})` : `hsla(140, 30%, 44%, ${a * appear})`)
                }
            }
        }
    }
    //#endregion

    window.requestAnimationFrame(update)
</script>
