<script>
  var canvas, ctx;
  var stateMgr = new StateHandler();
  var healthMeter = new Meter(3, onHealthMeterChanged);
  var manaMeter = new Meter(3, onManaMeterChanged);

  //var nightMeter = new Meter(3, onNightMeterChanged);
  var effects = [];
  var comets = [];
  var stars = [];
  var droplets = [];

  var blood = new BloodMoonState();
  blood.complete = true;

  // ----- "State" functions -----
  function DamageState() {
    this.start = new Date().getTime();
    this.duration = 2000;
    // console.log(`Damage State`);
    this.Process = function () {
      this.elapsed = new Date().getTime() - this.start;
      if (this.elapsed > this.duration) {
        stateMgr.Pop();
      }
      this.Draw();
    };

    this.Draw = function () {
      for (let i = 0; i < 20; i++) {
        effects.push(
          new moveableBar(
            random(0, 360),
            random(0, 200),
            40,
            40,
            random(-5, 5),
            random(-5, 5),
            340 + random(-20, 20),
            80 + random(-20, 20),
            50,
            0.9
          )
        );
      }

      //   var positions = [];
      //   positions.push(Math.random() * 320);
      //   positions.forEach((element) => {
      //     var hue = Math.round(Math.random() * 25) + 345;
      //     var colorString = "hsl(" + hue + ",100%,50%)";
      //     ctx.fillStyle = colorString;
      //     ctx.fillRect(element, 0, 10, 200);
      //   });
    };
  }
  function moveableBar(x, y, width, height, xDirection, yDirection, hue, sat, lit, alpha) {
    this.x = x;
    this.y = y;
    this.hue = hue;
    this.sat = sat;
    this.lit = lit;
    this.alpha = alpha;
    this.lifetime = 50;
    this.size = 0;
    this.ydirection = yDirection;
    this.xdirection = xDirection;
    this.width = width;
    this.height = height;

    this.draw = function () {
      ctx.fillStyle = 'hsla(' + this.hue + ',' + this.sat + '%,' + this.lit + '%,' + this.alpha + ' )';
      ctx.fillRect(this.x, this.y, this.height, this.width);
      this.lifetime--;
      this.y -= this.ydirection;
      this.x += this.xdirection;
    };
  }

  function HealState() {
    this.start = new Date().getTime();
    this.duration = 2000;

    this.Process = function () {
      this.elapsed = new Date().getTime() - this.start;
      if (this.elapsed > this.duration) {
        stateMgr.Pop();
      }
      this.Draw();
    };

    this.Draw = function () {
      var nAngle = this.elapsed / 1015;
      ctx.fillStyle = "yellow";
      ctx.beginPath();
      ctx.arc(160, 100, 300, 0, nAngle * Math.PI);
      ctx.fill();
    };
  }
  function BloodMoonState() {
    this.timer = 0;
    var dur = 180;
    this.duration = dur;
    this.start = new Date().getTime();

    this.xRect = 160;
    this.yRect = 100;
    this.width = 0;
    this.height = 0;
    this.complete = false;

    this.radius = 0;

    this.Process = function () {
      // this.timer++;
      // if (this.timer > 120)
      //   stateMgr.Pop;
      this.Draw();
    };

    this.Draw = function () {
      if (this.duration <= 0) {
        this.complete = true;
        this.duration = 0;
      }
      if (this.duration > 0) {
        if (this.duration >= dur / 1.5) {
          this.xRect -= 12;
          this.yRect -= 6;
          this.width += 24;
          this.height += 12;
          ctx.fillStyle = '#121212';
          ctx.fillRect(this.xRect, this.yRect, this.width, this.height);

          this.radius += 1.4;
          ctx.fillStyle = '#ede5b9';
          ctx.beginPath();
          ctx.arc(160, 100, this.radius, 0, 6.3);
          ctx.fill();
        }

        if (this.duration < dur / 1.5 && this.duration > 0 && droplets.length < 250) {
          droplets.push(new BloodDroplet());
        }
        for (i = 0; i < droplets.length; i++) {
          droplets[i].Draw();
        }
        for (j = 0; j < droplets.length; j++) {
          if (droplets[j].lifetime <= 0) {
            droplets.splice(j, 1);
          }
        }
        if (this.duration == 1) {
          this.duration = 0;
          stateMgr.Push(new IdleState());
        }
      }
      this.duration--;
    };
  }

  function CaveState() {
    this.Process = function () {
      this.Draw();
    };
    this.Draw = function () {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);

      for (var iZone = 0; iZone < 560; iZone++) {
        if (lightness[iZone] < 1) lightness[iZone] = 1.5;

        if (lightness[iZone] > 5) lightness[iZone] += 20;

        ctx.fillStyle = 'hsla(' + hue[iZone] + ',' + sat[iZone] + '%,' + lightness[iZone] + '%, ' + keyScrenBrightness * 0.01 + ')';

        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;

        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    };
  }

  function NightState() {
    this.Process = function () {
      this.Draw();
    };
    this.Draw = function () {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);

      for (var iZone = 0; iZone < 560; iZone++) {
        if (lightness[iZone] < 1) lightness[iZone] = 2;
        ctx.fillStyle = 'hsla(' + 240 + ',' + sat[iZone] + '%,' + lightness[iZone] + '%, ' + keyScrenBrightness * 0.01 + ')';

        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;

        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
      var rand = Math.floor(Math.random() * 60);
      if (rand == 0) comets.push(new Comet());

      if (stars.length < 60) stars.push(new Star());
    };
  }

  function ManaUpState() {
    this.start = new Date().getTime();
    this.duration = 2500;

    this.Process = function () {
      this.elapsed = new Date().getTime() - this.start;
      if (this.elapsed > this.duration) {
        stateMgr.Pop();
      }
      this.Draw();
    };

    this.Draw = function () {
      // console.log('Mana Drawing');
      var nDiameter = this.elapsed / 10;
      ctx.fillStyle = 'blue';
      ctx.beginPath();
      ctx.arc(160, 100, nDiameter, 0, 2 * Math.PI);
      ctx.fill();
      ctx.lineWidth = 10;
      ctx.strokeStyle = 'goldenrod';
      ctx.beginPath();
      ctx.arc(160, 100, nDiameter, 0, 2 * Math.PI);
      ctx.stroke();
      ctx.fillStyle = 'goldenrod';
      ctx.fillRect(Math.random() * 320, Math.random() * 200, 10, 10);
      ctx.fillRect(Math.random() * 320, Math.random() * 200, 10, 10);
    };
  }

  function DayState() {
    this.Process = function () {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);

      for (var iZone = 0; iZone < 560; iZone++) {

        ctx.fillStyle = 'hsla(' + hue[iZone] + ',' + sat[iZone] + '%,' + lightness[iZone] + '%, ' + keyScrenBrightness * 0.01 + ')';

        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;

        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    };
  }
  function CorruptionState() {
    this.Process = function () {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);

      for (var iZone = 0; iZone < 560; iZone++) {

        ctx.fillStyle = 'hsla(' + 250 + ',' + sat[iZone] + '%,' + lightness[iZone] + '%, ' + keyScrenBrightness * 0.01 + ')';

        var iRow = Math.floor(iZone / 28);

  // ----- StateHandler and Meter -----
  function StateHandler() {
    var stack = [];
    var state = null;

    var updateState = function () {
      if (stack.length > 0) {
        state = stack[stack.length - 1];
      } else {
        state = null;
      }
    };

    this.Push = function (newState) {
      stack = [];
      stack.push(new IdleState())
      stack.push(newState);
      updateState();
    };

    this.Pop = function () {
      stack.pop();
      updateState();
    };

    this.Process = function () {
      if (state != null) {
        state.Process();
      }
    };
  }

  function Meter(count, callback) {
    this.size = count;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    var values = [];

    this.setValue = function (updatedValue) {
      values.push(updatedValue);
      if (values.length > this.size) {
        values.shift();
      }

      for (var i = 0; i < values.length - 1; i++) {
        if (values[i] !== values[i + 1]) return;
      }

      if (this.value !== values[0]) {
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        callback();
      }
    };
  }

      this.elapsed = new Date().getTime() - this.start;

    this.Draw = function () {
      let lightness = new Int8Array(engine.zone.lightness);

      for (var iZone = 0; iZone < 560; iZone++) {

        var iCol = iZone % 28;
        var iWidth = 320 / 28;

        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;

        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }

      ctx.fillStyle = 'hsl(' + this.hue + ',' + this.saturation + '%,' + random(this.lightness - 10, this.lightness + 10) + '%)';

      ctx.fillRect(160, 0, this.size * 160, 200);
      ctx.fillRect(160, 0, -this.size * 160, 200);
      if (this.size < this.value) {
        this.size += 0.03;
      }
    };
    this.lifetime--;
  }
  function WallUpState(hue, sat, lit, alpha = 1) {
    this.start = new Date().getTime();
    this.duration = 2000;
    this.count = 2000;
    this.hue = hue;
    this.sat = sat;
    this.lit = lit;
    this.alpha = alpha;
    this.lifetime = 80;

    this.Process = function () {
      this.elapsed = new Date().getTime() - this.start;
      if (this.elapsed > this.duration) {
        stateMgr.Pop();
      }
      this.draw();
    };

    this.draw = function () {
      var pctUp = 1 - this.count / 2000;
      ctx.fillStyle =
        'hsla(' +
        (this.hue + random(-15, 15)) +
        ',' +
        (this.sat + random(-15, 15)) +
        '%,' +
        (this.lit + random(-15, 15)) +
        '%,' +
        this.alpha +
        ')';
      ctx.fillRect(0, 200 - 200 * pctUp, 320, 300);
      this.count -= 28;
      ctx.fillStyle =
        'hsla(' +
        (this.hue + random(-15, 15)) +
        ',' +
        (this.sat + random(-15, 15)) +
        '%,' +
        (this.lit + random(-15, 15)) +
        '%,' +
        this.alpha +
        ')';
      ctx.fillRect(Math.random() * 320, 200 - 200 * pctUp, 20, 300);
      ctx.fillRect(Math.random() * 320, 200 - 200 * pctUp, 20, 300);
      ctx.fillStyle =
        'hsla(' +
        (this.hue + random(-15, 15)) +
        ',' +
        (this.sat + random(-15, 15)) +
        '%,' +
        (this.lit + random(-15, 15)) +
        '%,' +
        this.alpha +
        ')';
      ctx.fillRect(Math.random() * 320, 200 - 200 * pctUp, 20, 300);
      ctx.fillRect(Math.random() * 320, 200 - 200 * pctUp, 20, 300);

      this.lifetime--;
    };
  }

  function moveableBar(x, y, width, height, xDirection, yDirection, hue, sat, lit, alpha) {
    this.x = x;
    this.y = y;
    this.hue = hue;
    this.sat = sat;
    this.lit = lit;
    this.alpha = alpha;
    this.lifetime = 50;
    this.size = 0;
    this.ydirection = yDirection;
    this.xdirection = xDirection;
    this.width = width;
    this.height = height;

    this.draw = function () {
      ctx.fillStyle = 'hsla(' + this.hue + ',' + this.sat + '%,' + this.lit + '%,' + this.alpha + ' )';
      ctx.fillRect(this.x, this.y, this.height, this.width);
      this.lifetime--;
      this.y -= this.ydirection;
      this.x += this.xdirection;
    };
  }

  function SparkleEffect(hue, saturation, lightness, size) {
    this.x = Math.random() * 320;
    this.y = Math.random() * 200;
    this.hue = hue;
    this.saturation = saturation;

    this.lifetime = 40;
    this.size = size;
    this.draw = function () {
      ctx.fillStyle = 'hsl(' + this.hue + ',' + this.saturation + '%,' + this.lightness + '%)';
      ctx.fillRect(this.x, this.y, this.size, this.size);
      this.lifetime--;
    };
  }

  function FallingSquare(down, x, y, hue, sat, lit, size) {
    this.x = x;
    this.y = y;
    this.directionDown = down;
    this.lifetime = 50;
    this.hue = hue;
    this.sat = sat;
    this.lit = lit;
    this.size = size;

    this.draw = function () {
      if (this.directionDown) {
        this.y += 5;
      } else {
        this.y -= 5;
      }
      ctx.fillStyle = ctx.fillStyle = 'hsl(' + this.hue + ',' + this.sat + '%,' + this.lit + '%)';

      ctx.fillRect(this.x, this.y, this.size, this.size);
      this.lifetime--;
    };
  }

  function ExpandingCircle(outward, x, y, hue, saturation, lightness) {
    this.start = new Date().getTime();
    this.duration = 2000;
    this.lifetime = 50;
    this.size = 0;
    this.hue = hue;
    this.saturation = saturation;
    this.lightness = lightness;
    this.x = x;
    this.y = y;
    this.outward = outward;
    if (!this.outward) {
      this.size = 200;
    }

    this.draw = function () {
      ctx.beginPath();
      ctx.lineWidth = 15;
      ctx.strokeStyle = 'hsl(' + this.hue + ',' + this.saturation + '%,' + this.lightness + '%)';
      ctx.arc(this.x, this.y, this.size, 0, 2 * Math.PI);
      ctx.stroke();

      if (this.outward) {
        this.size += 3;
      } else {
        this.size -= 3;
      }

      this.lifetime--;
    };
  }
