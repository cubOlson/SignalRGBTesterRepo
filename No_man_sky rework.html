function moveableBar(
    x,
    y,
    width,
    height,
    xDirection,
    yDirection,
    hue,
    sat,
    lit,
    alpha
  ) {
    this.x = x;
    this.y = y;
    this.hue = hue;
    this.sat = sat;
    this.lit = lit;
    this.alpha = alpha;
    this.lifetime = 50;
    this.size = 0;
    this.ydirection = yDirection;
    this.xdirection = xDirection;
    this.width = width;
    this.height = height;

    this.draw = function () {
      ctx.fillStyle =
        "hsla(" +
        this.hue +
        "," +
        this.sat +
        "%," +
        this.lit +
        "%," +
        this.alpha +
        " )";
      ctx.fillRect(this.x, this.y, this.height, this.width);
      this.lifetime--;
      this.y -= this.ydirection;
      this.x += this.xdirection;
    };
  }

  
  function WallUpState(hue, sat, lit, alpha = 1) {
    this.start = new Date().getTime();
    this.duration = 2000;

    this.sat = sat;
    this.lit = lit;
    this.alpha = alpha;
    this.lifetime = 80;

    this.Process = function () {
      this.elapsed = new Date().getTime() - this.start;
      if (this.elapsed > this.duration) {
        scanGoing = false
        stateHdlr.Pop();
      }
      this.draw();
    };

    this.draw = function () {
      var pctUp = 1 - this.count / 2000;
      ctx.fillStyle =
        "hsla(" +
        (this.hue + random(-15, 15)) +
        "," +
        (this.sat + random(-15, 15)) +

        (this.lit + random(-15, 15)) +
        "%," +
        this.alpha +
        ")";
      ctx.fillRect(0, 200 - 200 * pctUp, 320, 300);
      this.count -= 28;

        (this.hue + random(-15, 15)) +

        (this.lit + random(-15, 15)) +

function random(min, max) {
  var num = Math.floor(Math.random() * (max - min)) + min;
  // if min = 10 max = 15 random var = 0.1544465; it will return approzimately 10 because of math.floor
  return num;
}



function DrawRect(x, y, width, height, color) {
  ctx.beginPath();
  ctx.fillStyle = color;
  ctx.fillRect(x, y, width, height);
};

function DrawCircle(x, y, radius, color) {
  ctx.beginPath();
  ctx.fillStyle = color;
  ctx.arc(x, y, radius, 0, 2 * Math.PI)
  ctx.fill();
};

function StrokeCircle(x, y, width, height, color) {
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = 30;
  ctx.arc(x, y, width, 0, 2 * Math.PI);
  ctx.stroke();
};

function renderPath(x, y, path, color, size) {
  ctx.fillStyle = color;
  ctx.save();
  ctx.transform(size / 10, 0, 0, size / 10, 160 - 10 * 16.5, 79 - size * 7.5);
  ctx.translate(x, y);
  let ex = new Path2D(path);
  ctx.fill(ex);
  ctx.restore();

  function getXAndYForPathPoint(point1, point2, percentage) {
    let speed = { x: (point2.x - point1.x) * percentage, y: (point2.y - point1.y) * percentage }
    return { x: point1.x + speed.x, y: point1.y + speed.y }
  }
}


function hexToHSL(hex) {
    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);

    var r = parseInt(result[1], 16);
    var g = parseInt(result[2], 16);
    var b = parseInt(result[3], 16);

    (r /= 255), (g /= 255), (b /= 255);
    var max = Math.max(r, g, b),
      min = Math.min(r, g, b);
    var h,
      s,
      l = (max + min) / 2;

    if (max === min) {
      h = s = 0; // achromatic
    } else {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r:
          h = (g - b) / d + (g < b ? 6 : 0);
          break;
        case g:
          h = (b - r) / d + 2;
          break;
        case b:
          h = (r - g) / d + 4;
          break;
      }
      h /= 6;
    }

    s = s * 100;
    s = Math.round(s);
    l = l * 100;
    l = Math.round(l);
    h = Math.round(360 * h);

    var colors = [];
    colors["h"] = h;
    colors["s"] = s;
    colors["l"] = l;

    return colors;
  }




function copyScreen(alpha) {
  let lightness = new Int8Array(engine.zone.lightness);
  let sat = new Int8Array(engine.zone.saturation);
  let hue = new Int16Array(engine.zone.hue);
  for (var iZone = 0; iZone < 560; iZone++) {
    ctx.fillStyle =
      "hsla(" +
      hue[iZone] +
      "," +
      sat[iZone] +
      "%," +
      lightness[iZone] * keyScreenBrightness * 0.01 +
      "%, " +
      alpha
      +
      ")";
    var iRow = Math.floor(iZone / 28);
    var iCol = iZone % 28;
    var iWidth = 320 / 28;
    var iHeight = 200 / 20;
    var iZx = iCol * iWidth;
    var iZy = iRow * iHeight;

    ctx.fillRect(iZx, iZy, iWidth, iHeight);
  }
}

function colorFilter(hue, lightnessOffset = 0, milliseconds = 4000) {
    this.start = new Date().getTime();
    this.duration = milliseconds;
    this.hue = hue;
    this.lightnessOffset = lightnessOffset;
    this.Process = function () {
      this.elapsed = new Date().getTime() - this.start;
      if (this.elapsed > this.duration) {
        stateHdlr.Pop();
      }
      this.draw();
    };

    this.draw = function () {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);

      for (var iZone = 0; iZone < 560; iZone++) {
        var satBoost = sat[iZone] + 35;
        ctx.fillStyle =
          "hsla(" +
          this.hue +
          "," +
          satBoost +
          "%," +
          (lightness[iZone] + this.lightnessOffset) +
          "%, " +
          keyScrenBrightness * 0.01 +
          ")";

        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;

        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    };
  }


function StateHandler() {
  var stack = [];
  var state = null;

  var updateState = function () {
    if (stack.length > 0) {
      state = stack[stack.length - 1];
    } else {
      state = null;
    }
  };

  this.Push = function (newState) {
    stack.push(newState);
    updateState();
  };

  this.Pop = function () {
    stack.pop();
    updateState();
  };

  this.Process = function () {
    if (state != null) {
      state.Process();
    }
  };
}



function Meter(size, callback) {
  this.size = size;
  this.value = 0;
  this.diff = 0;
  this.increased = false;
  this.decreased = false;
  var values = [];

  this.setValue = function (updatedValue) {
    values.push(updatedValue);
    if (values.length > this.size) {
      values.shift();
    }

    for (var i = 0; i < values.length - 1; i++) {
      if (values[i] !== values[i + 1]) return;
    }
    if (this.value !== values[0]) {
      this.diff = Math.abs(this.value - values[0]);
      this.increased = this.value < values[0];
      this.decreased = this.value > values[0];
      this.value = values[0];
      callback();
    }
  };
}
