       VISION METERS
       Each meter captures a small region of the game screen and
       measures what percentage of its pixels match the given HSL
       range. The JS Meter class smooths readings over N frames
       before firing a callback.

       Detection strategy: every game state uses a POSITIVE meter
       (confirms the expected color IS present) paired with a
       NEGATIVE "Not" meter (confirms the region does NOT show that
       color during baseline/off state). A state is considered active
       only when positive is high AND negative is low, preventing
       false positives from ambient lighting or UI transitions.

       ⚠ PLACEHOLDER REGIONS: the x/y/width/height coordinates below are
       rough starting guesses, NOT calibrated. Before this detects
       anything you MUST calibrate each region with the QA Tool — load a
       screenshot at the target resolution, confirm the box sits on the
       right pixels, then tune the HSL ranges. Add per-resolution
       <resolution .../> overrides the same way WarThunder.html does.
       ═══════════════════════════════════════════════════════════ -->

<script>
    // ═══════════════════════════════════════════════════════════
    // CANVAS SETUP
    // SignalRGB renders this 320x200 canvas onto the device layout.
    // All effects draw to the hidden canvas, composited to ctx once per frame.
    // ═══════════════════════════════════════════════════════════
    const canvas = document.getElementById('exCanvas');
    const ctx    = canvas.getContext('2d');
    const width  = 320;
    const height = 200;

    const hiddenCanvas = document.createElement('canvas');
    hiddenCanvas.width  = 320;
    hiddenCanvas.height = 200;
    const hiddenCtx = hiddenCanvas.getContext('2d');

    let effects = [];

    //#region Update
    // Runs every frame: paint the background, push each meter's latest vision
    // reading through its debouncer (which fires callbacks on stable changes),
    // draw + prune effects, then composite the hidden canvas to the screen.
    function update() {
        DrawRect(0, 0, 320, 200, 'black')
        backgroundHandler()

        // In-game / health
        inGameBlack_Meter.setValue(engine.vision.inGameBlack)
        healthBarRed_Meter.setValue(engine.vision.healthBarRed)
        healthBarBlue_Meter.setValue(engine.vision.healthBarBlue)
        lastHealthRed_Meter.setValue(engine.vision.lastHealthRed)

        // Pickups (coin / bomb / key counters)
        coinWhite_Meter.setValue(engine.vision.coinWhite)
        BombWhite_Meter.setValue(engine.vision.BombWhite)
        keyWhite_Meter.setValue(engine.vision.keyWhite)

        // Item pickup (pedestal)
        itemWhite_Meter.setValue(engine.vision.itemWhite)
        itemBlack_Meter.setValue(engine.vision.itemBlack)

        // Boss fight
        bossBarRed_Meter.setValue(engine.vision.bossBarRed)
        bossBarNotRed_Meter.setValue(engine.vision.bossBarNotRed)

        // Death / game over
        deathWhite1_Meter.setValue(engine.vision.deathWhite1)
        deathWhite2_Meter.setValue(engine.vision.deathWhite2)
        deathNotWhite_Meter.setValue(engine.vision.deathNotWhite)
        levelUpWhite_Meter.setValue(engine.vision.levelUpWhite)
        levelUpBlack_Meter.setValue(engine.vision.levelUpBlack)


        effects.forEach(ele => { ele.draw() })
        effects = effects.filter(ele => !(ele.lifetime <= 0))

        ctx.drawImage(hiddenCanvas, 0, 0)
        window.requestAnimationFrame(update)
    }
    //#endregion

    //#region Meter Declarations
    // -------------------------------------------------------------------------
    // Meter(size, callback): size = frames a reading must hold steady before the
    // callback fires. Pair each positive + negative meter to the SAME callback.
    // -------------------------------------------------------------------------
    // In-game / health — the positive+negative pair feeds inGameDetect; the
    // health bars feed the damage / low-health callbacks.
    const inGameBlack_Meter    = new Meter(5,  inGameDetect)
    const healthBarRed_Meter   = new Meter(4,  damageCallback)
    const healthBarBlue_Meter  = new Meter(4,  healthBlueChanged)   // soul hearts drive two things: the low-health turn-off AND the eternal effect
    const lastHealthRed_Meter  = new Meter(5,  lowHealthCallback)

    // Pickups (coin / bomb / key counters)
    const coinWhite_Meter      = new Meter(10, coinChanged)
    const BombWhite_Meter      = new Meter(10, bombCallback)
    const keyWhite_Meter       = new Meter(10, keyCallback)

    // Item pickup (pedestal) — positive white banner + negative black baseline.
    const itemWhite_Meter      = new Meter(10, itemPickupCallback)
    const itemBlack_Meter      = new Meter(10, itemPickupCallback)

    // Boss fight — positive+negative pair on the boss health bar.
    const bossBarRed_Meter     = new Meter(5,  bossEffectCallback)
    const bossBarNotRed_Meter  = new Meter(5,  bossEffectCallback)

    // Death / game over — two positive samples + one negative baseline.
    const deathWhite1_Meter    = new Meter(10, deathEffectCallback)
    const deathWhite2_Meter    = new Meter(10, deathEffectCallback)
    const deathNotWhite_Meter  = new Meter(10, deathEffectCallback)
    // Level UP — two positive samples
    const levelUpWhite_Meter   = new Meter(10, levelUpCallback)
    const levelUpBlack_Meter   = new Meter(10, levelUpCallback)
    //#endregion

    //#region Callbacks
    // -------------------------------------------------------------------------
    // Global state flags — one "...Going" flag per effect stops it from
    // re-triggering every frame while its trigger colors are still on screen.
    // Each effect resets its own flag to false when it finishes fading out.
    // -------------------------------------------------------------------------
    let gInGame = false
    let hurtEffectGoing = false     // also used by damageCallback (the hurt/damage effect)
    let itemPickupGoing = false
    let deathEffectGoing = false
    let coinGoing = false
    let bombGoing = false
    let keyGoing = false
    let lowHealthGoing = false
    let bossEffectGoing = false
    let eternalGoing = false
    let levelUpGoing = false

    // Last committed counter values for coin / bomb / key. A pickup changes the
    // on-screen counter (and thus its meter value), so we only fire when the value
    // DIFFERS from the last one we saw while in game. These persist while you're
    // out of game (menu / between runs), so returning with the same counts does
    // NOT re-fire — only a real change does. null = not seen in a run yet.
    let coinPrev = null
    let bombPrev = null
    let keyPrev  = null

    // -------------------------------------------------------------------------
    // Detection callbacks. Pattern for each: gated on gInGame + its toggle, fires
    // when the POSITIVE meter is high AND the NEGATIVE meter is low, and only if
    // it isn't already going. Copy one of these to add a new effect.
    // -------------------------------------------------------------------------

    // Are we in an active run? Red hearts present in the HUD, baseline clear.
    function inGameDetect() {
        if (inGameBlack_Meter.value >= .95 && coinWhite_Meter.value >=.1 && !gInGame) {
            gInGame = true
        } else if (inGameBlack_Meter.value < .1 || coinWhite_Meter.value <.1) {
            gInGame = false
            // Leaving the run (incl. death) must end the persistent low-health
            // warning, since its own callback may not fire once health hits 0.
            lowHealthGoing = false
            // Forget the counter values so re-entering (or a fresh run) records them
            // anew instead of firing coin/bomb/key from the change on the way back in.
            coinPrev = null
            bombPrev = null
            keyPrev  = null
        }
    }

    function itemPickupCallback() {
        if (gInGame && enableItemPickupOn && itemWhite_Meter.value >= .1 && itemBlack_Meter.value >=.95 && !itemPickupGoing) {
            effects.push(new ItemPickupEffect())
            itemPickupGoing = true
        }
    }

    function deathEffectCallback() {
        if (!gInGame && enableDeathEffectOn && deathWhite1_Meter.value >= .95 && deathWhite2_Meter.value >= .95 && deathNotWhite_Meter.value < .1 && !deathEffectGoing) {
            effects.push(new DeathEffect())
            deathEffectGoing = true
        }
    }

    // Coin / bomb / key: fire only when the counter's value CHANGES from the last
    // one we saw in game (a real pickup/spend), not on the static level. The first
    // in-game reading (prev === null) just records the value without firing, and
    // the value isn't updated while out of game — so leaving and returning with the
    // same count won't re-trigger.
    function coinCallback() {
        if (!gInGame) return
        if (gInGame && coinPrev !== null && enableCoinEffectOn && !coinGoing && coinWhite_Meter.value !== coinPrev) {
            effects.push(new CoinEffect())
            coinGoing = true
        }
        coinPrev = coinWhite_Meter.value
    }

    function bombCallback() {
        if (!gInGame) return
        if (gInGame && bombPrev !== null && enableBombEffectOn && !bombGoing && BombWhite_Meter.value !== bombPrev) {
            effects.push(new BombEffect())
            bombGoing = true
        }
        bombPrev = BombWhite_Meter.value
    }

    function keyCallback() {
        if (!gInGame) return
        if (gInGame && keyPrev !== null && enableKeyEffectOn && !keyGoing && keyWhite_Meter.value !== keyPrev) {
            effects.push(new KeyEffect())
            keyGoing = true
        }
        keyPrev = keyWhite_Meter.value
    }

    function damageCallback() {
        // A decrease only counts as damage if the health bar is STILL present
        // afterward (value > .05). A drop to ~0 means the HUD vanished (leaving the
        // run / death), not a hit — otherwise the bar disappearing fires a false
        // hurt on the frame before gInGame flips to false.
        let redHit  = healthBarRed_Meter.decreased  && healthBarRed_Meter.diff  > .05 && healthBarRed_Meter.value  > .05
        let blueHit = healthBarBlue_Meter.decreased && healthBarBlue_Meter.diff > .05 && healthBarBlue_Meter.value > .05
        if (gInGame && enableHurtEffectOn && (redHit || blueHit) && !hurtEffectGoing && !lowHealthGoing) {
            effects.push(new HurtEffect())
            hurtEffectGoing = true
        }
    }

    function lowHealthCallback() {
        if (gInGame && enableLowHealthEffectOn && lastHealthRed_Meter.value >= .1 && lastHealthRed_Meter.value < .5 && !lowHealthGoing) {
            effects.push(new LowHealthEffect())
            lowHealthGoing = true
        } else if (!gInGame || lastHealthRed_Meter.value >= .7 || lastHealthRed_Meter.value < .1 || healthBarBlue_Meter.value >= .2) {
            // Turn off when: not in a run, red hearts recovered, the heart is empty
            // (< .1 — dead / no red health), OR a soul (blue) heart is present, since
            // a soul heart buffers damage — no low-health warning in any of these.
            lowHealthGoing = false
        }
    }
    function bossEffectCallback() {
        if (gInGame && enableBossEffectOn && bossBarRed_Meter.value >= .95 && bossBarNotRed_Meter.value < .1 && !bossEffectGoing) {
            effects.push(new BossEffect())
            bossEffectGoing = true
        }else if(!gInGame || bossBarRed_Meter.value <.1){
            bossEffectGoing = false
        }
    }

    // healthBarBlue drives two states, so route its meter changes through one
    // handler (the WarThunder "...Changed" pattern): the low-health warning
    // (a soul heart cancels it) and the eternal effect (lots of soul health).
    function healthBlueChanged() {
        lowHealthCallback()
        eternalCallback()
        damageCallback()
    }

    function coinChanged() {
        coinCallback()
        inGameDetect()
    }

    // Eternal: fires when a soul (blue) heart is present (value >= .2).
    function eternalCallback() {
        if (gInGame && enableEternalEffectOn && healthBarBlue_Meter.value >= .2 && !eternalGoing) {
            effects.push(new EternalEffect())
            eternalGoing = true
        }else if(!gInGame || healthBarBlue_Meter.value <.1){
            eternalGoing = false
        }
    }

    function levelUpCallback(){
        if (!gInGame && enableLevelUpEffectOn && levelUpBlack_Meter.value >= .95 && levelUpWhite_Meter.value >=.95 && !levelUpGoing) {
            effects.push(new LevelUpEffect())
            levelUpGoing = true
        }else if(gInGame || (levelUpBlack_Meter.value <.1 && levelUpWhite_Meter.value <.1)){
            levelUpGoing = false
        }
    }


    //#endregion

    //#region Background Modes
    // ═══════════════════════════════════════════════════════════
    // BACKGROUND SYSTEM
    // Eight modes selected by the backgroundMode control.
    // ═══════════════════════════════════════════════════════════
    let proBack = [0, 0, 0]
    function onbackColorChanged() {
        proBack = hexToHSL(backColor)
    }

    let audioEase = { sat: 0, lit: 0 }
    let gCycle = 0

    function updateAudioEase() {
        const targetDensity = engine.audio.density * 100
        audioEase.sat += (targetDensity - audioEase.sat) / 10
        audioEase.lit += (targetDensity - audioEase.lit) / 10
    }

    function getColorString(hue, sat, lit, alpha) {
        return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`
    }

    function updateColorCycle() {
        gCycle = (gCycle + 0.5) % 360
    }

    // One explicit case per background mode. Every case uses ambienceAlpha for
    // its brightness so the Background Brightness control works in all modes.
    function backgroundHandler() {
        switch (backgroundMode) {
            case 'Color Cycle':
                updateColorCycle()
                DrawRect(0, 0, 320, 200, getColorString(proBack[0] + gCycle, proBack[1], proBack[2], ambienceAlpha / 100))
                break
            case 'Color Cycle Ambience':
                updateColorCycle()
                copyScreen(ambienceAlpha / 100)
                break
            case 'Color Cycle Audio Visualizer':
                updateColorCycle()
                audioEase.sat += (engine.audio.density * 100 - audioEase.sat) / 10
                audioEase.lit += (engine.audio.density * 100 - audioEase.lit) / 10
                DrawRect(0, 0, 320, 200, getColorString(proBack[0] + gCycle, audioEase.sat * 0.33 + 66, audioEase.lit * 0.9 + 10, ambienceAlpha / 100))
                break
            case 'Custom':
                DrawRect(0, 0, 320, 200, getColorString(proBack[0], proBack[1], proBack[2], ambienceAlpha / 100))
                break
            case 'Ambience':
                copyScreen(ambienceAlpha / 100)
                break
            case 'Custom Ambience':
                copyScreen(ambienceAlpha / 100)
                break
            case 'Ambience Audio Visualizer':
                copyScreenAudio(ambienceAlpha / 100)
                break
            case 'Custom Audio Visualizer':
                audioEase.sat += (engine.audio.density * 100 - audioEase.sat) / 10
                audioEase.lit += (engine.audio.density * 100 - audioEase.lit) / 10
                DrawRect(0, 0, 320, 200, getColorString(proBack[0], audioEase.sat * 0.33 + 66, audioEase.lit * 0.9 + 10, ambienceAlpha / 100))
                break
        }
    }

    const ZONE_COLS   = 28
    const ZONE_ROWS   = 20
    const TOTAL_ZONES = ZONE_COLS * ZONE_ROWS

    function copyScreenAudio(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat       = new Int8Array(engine.zone.saturation)
        const hue       = new Int16Array(engine.zone.hue)
        const w = 320 / ZONE_COLS
        const h = 200 / ZONE_ROWS
        const satMultiplier = audioEase.sat / 200 + 0.5
        const litMultiplier = audioEase.lit / 100
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            hiddenCtx.fillStyle = getColorString(
                hue[iZone],
                sat[iZone] * satMultiplier,
                lightness[iZone] * litMultiplier,
                alpha
            )
            hiddenCtx.fillRect(col * w, row * h, w, h)
        }
    }

    function copyScreen(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat       = new Int8Array(engine.zone.saturation)
        const hue       = new Int16Array(engine.zone.hue)
        const w = 320 / ZONE_COLS
        const h = 200 / ZONE_ROWS
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const finalHue = backgroundMode === 'Custom Ambience'
                ? proBack[0]
                : hue[iZone] + (backgroundMode === 'Color Cycle Ambience' ? gCycle : 0)
            hiddenCtx.fillStyle = getColorString(finalHue, sat[iZone], lightness[iZone], alpha)
            hiddenCtx.fillRect(col * w, row * h, w, h)
        }
    }
    //#endregion

    //#region Helper Functions
    // ═══════════════════════════════════════════════════════════
    // HELPER FUNCTIONS — draw primitives target hiddenCtx
    // ═══════════════════════════════════════════════════════════
    function DrawRect(x, y, w, h, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.fillRect(x, y, w, h)
    }

    function strokeRect(x, y, w, h, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.rect(x, y, w, h)
        hiddenCtx.stroke()
    }

    function DrawCircle(x, y, radius, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
        hiddenCtx.fill()
    }

    function DrawStroke(x, y, radius, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
        hiddenCtx.stroke()
    }

    function DrawArcStroke(x, y, radius, start, end, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.arc(x, y, radius, start, end)
        hiddenCtx.stroke()
    }

    function DrawLine(start, end, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.moveTo(start[0], start[1])
        hiddenCtx.lineTo(end[0], end[1])
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.stroke()
    }

    function DrawArc(x, y, start, end, radius, direction, color) {
        hiddenCtx.beginPath()
        hiddenCtx.arc(x, y, radius, start, end, direction)
        hiddenCtx.fillStyle = color
        hiddenCtx.fill()
    }

    function DrawEllipse(x, y, w, h, rotation, color) {
        hiddenCtx.beginPath()
        hiddenCtx.ellipse(x, y, w, h, rotation, 0, Math.PI * 2)
        hiddenCtx.fillStyle = color
        hiddenCtx.fill()
    }

    function DrawTriangle(x1, y1, x2, y2, x3, y3, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.moveTo(x1, y1)
        hiddenCtx.lineTo(x2, y2)
        hiddenCtx.lineTo(x3, y3)
        hiddenCtx.lineTo(x1, y1)
        hiddenCtx.fill()
    }

    function DrawPath(x, y, path, color, scaleX, scaleY) {
        hiddenCtx.fillStyle = color
        hiddenCtx.save()
        hiddenCtx.translate(x, y)
        hiddenCtx.scale(scaleX, scaleY)
        hiddenCtx.fill(new Path2D(path))
        hiddenCtx.restore()
    }

    // drawHeart: two lobes (circles) + a pointed base (triangle). Handy for a
    // game whose whole HUD is hearts. Uses the Draw* helpers, so it targets
    // hiddenCtx here automatically.
    function drawHeart(cx, cy, size, color) {
        let r = size / 2
        DrawTriangle(cx - r * 1.05, cy - r * 0.05, cx + r * 1.05, cy - r * 0.05, cx, cy + r * 1.25, color)
        DrawCircle(cx - r * 0.5, cy - r * 0.3, r * 0.62, color)
        DrawCircle(cx + r * 0.5, cy - r * 0.3, r * 0.62, color)
    }

    function hexToRgb(hex) {
        var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex)
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : null
    }

    function hexToHSL(hex) {
        const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || []
        const rgb = [r, g, b].map(x => parseInt(x, 16) / 255)
        const max = Math.max(...rgb)
        const min = Math.min(...rgb)
        const l = (max + min) / 2
        if (max === min) return [0, 0, Math.round(l * 100)]
        const d = max - min
        const s = l > 0.5 ? d / (2 - max - min) : d / (max + min)
        let h
        const [nr, ng, nb] = rgb
        if      (max === nr) h = (ng - nb) / d + (ng < nb ? 6 : 0)
        else if (max === ng) h = (nb - nr) / d + 2
        else                 h = (nr - ng) / d + 4
        return [Math.round(h * 60), Math.round(s * 100), Math.round(l * 100)]
    }

    // Meter(size, callback): frame-stabilizing debouncer for vision signals.
    // A reading must repeat identically `size` times before it commits and the
    // callback fires — filters out one-frame noise from the vision system.
    function Meter(size, callback) {
        this.size = size
        this.value = 0
        this.diff = 0
        this.increased = false
        this.decreased = false
        var values = []
        this.setValue = function (updatedValue) {
            values.push(updatedValue)
            if (values.length > this.size) values.shift()
            for (var i = 0; i < values.length - 1; i++) {
                if (values[i] !== values[i + 1]) return
            }
            if (this.value !== values[0]) {
                this.diff = Math.abs(this.value - values[0])
                this.increased = this.value < values[0]
                this.decreased = this.value > values[0]
                this.value = values[0]
                callback()
            }
        }
    }
    //#endregion

    //#region Effects
    // ═══════════════════════════════════════════════════════════
    // EFFECTS  (draw to hiddenCtx via the Draw* helpers)
    //
    // Each effect is a constructor exposing:
    //   this.lifetime = 1        → alive; update() removes it when it hits 0
    //   this.draw = function(){} → called once per frame
    // and is SELF-TERMINATING: fade in → play → fade out → set lifetime = 0
    // AND reset its "...Going" flag so it can trigger again next time.
    //
    // Keep these in sync with BindingOfIsaacStaging.html (same visuals, minus
    // the "...Going" bookkeeping) so you can preview them there.
    // ═══════════════════════════════════════════════════════════

    // HurtEffect: a red heart pulses center-screen, then shatters into flying
    // shards with a red damage flash. Fires when Isaac takes damage.
    function HurtEffect() {
        this.frame = 0
        this.alpha = 0
        this.lifetime = 1
        this.fadingOut = false
        this.broken = false
        this.breakFrame = 0
        this.parts = []
        for (let i = 0; i < 24; i++) {
            let ang = Math.random() * Math.PI * 2
            let spd = 1 + Math.random() * 3
            this.parts.push({
                x: 160, y: 96,
                vx: Math.cos(ang) * spd,
                vy: Math.sin(ang) * spd - 1,
                size: 12 + Math.random() * 5,
                rot: Math.random() * Math.PI,
                spin: (Math.random() - 0.5) * 0.4,
                live: false
            })
        }
        this.draw = function () {
            this.frame++
            if (!this.fadingOut) {
                if (this.alpha < 1) this.alpha += 0.08
                if (this.alpha > 1) this.alpha = 1
                if (!this.broken && this.frame > 22) {
                    this.broken = true
                    this.breakFrame = this.frame
                    for (let p of this.parts) p.live = true
                }
                // Self-terminate once the shards have flown out (or the trigger cleared).
                if (!enableHurtEffectOn || (this.broken && this.frame - this.breakFrame > 60)) this.fadingOut = true
            } else {
                this.alpha -= 0.05
                if (this.alpha <= 0) {
                    this.alpha = 0
                    this.lifetime = 0
                    hurtEffectGoing = false
                    return
                }
            }
            let a = this.alpha
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)
            let flash = this.broken ? Math.max(0, 1 - (this.frame - this.breakFrame) / 30) : 0.4
            DrawRect(0, 0, 320, 200, `hsla(0, 90%, 45%, ${0.35 * a * (flash + 0.2)})`)
            if (!this.broken) {
                let pulse = 1 + Math.sin(this.frame * 0.3) * 0.08
                drawHeart(160, 96, 80 * pulse, `hsla(0, 85%, 55%, ${a})`)
            } else {
                for (let p of this.parts) {
                    if (!p.live) continue
                    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.rot += p.spin
                    let pa = a * Math.max(0, 1 - (this.frame - this.breakFrame) / 60)
                    DrawEllipse(p.x, p.y, p.size, p.size * 0.8, p.rot, `hsla(0, 85%, ${45 + Math.random() * 15}%, ${pa})`)
                }
            }
        }
    }

    function LowHealthEffect() {
        this.frame = 0
        this.alpha = 0
        this.fadingOut = false
        this.draw = function () {
            this.frame++
            if (!lowHealthGoing && !this.fadingOut) {
                this.fadingOut = true
            }
            if (this.fadingOut) {
                this.alpha -= 0.05
                if (this.alpha <= 0) {
                    this.alpha = 0
                    this.lifetime = 0
                    return
                }
            } else if (this.alpha < 1) {
                this.alpha += 0.03
                if (this.alpha > 1) this.alpha = 1
            }
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${this.alpha})`)
            let pulse = 0.5 + 0.5 * Math.sin(this.frame * 0.15)
            let scale = 20 + pulse * 2
            let cx = 50
            let cy = 50
            let lit = 40 + pulse * 20
            let col = `hsla(0, 90%, ${lit}%, ${this.alpha})`
            let px = [
                [-3, -2], [-2, -2], [1, -2], [2, -2],
                [-4, -1], [-3, -1], [-2, -1], [-1, -1], [0, -1], [1, -1], [2, -1], [3, -1],
                [-4, 0], [-3, 0], [-2, 0], [-1, 0], [0, 0], [1, 0], [2, 0], [3, 0],
                [-3, 1], [-2, 1], [-1, 1], [0, 1], [1, 1], [2, 1],
                [-2, 2], [-1, 2], [0, 2], [1, 2],
                [-1, 3], [0, 3]
            ]
            for (let i = 0; i < px.length; i++) {
                let bx = cx + px[i][0] * (scale / 3.2)
                let by = cy + px[i][1] * (scale / 2.0)
                DrawRect(bx * 3.2 - scale / 2, by * 2.0 - scale / 2, scale, scale, col)
            }
        }
    }

    // ItemPickupEffect: a holy radiance — golden halo rings expand from center
    // over a glowing core with sparkle rays. Fires on picking up an item.
    function ItemPickupEffect() {
        this.frame = 0
        this.alpha = 0
        this.lifetime = 1
        this.duration = 150
        this.fadingOut = false
        this.rings = []
        this.draw = function () {
            this.frame++
            if (!this.fadingOut && this.alpha < 1) {
                this.alpha += 0.06
                if (this.alpha > 1) this.alpha = 1
            }
            if (!this.fadingOut && (!enableItemPickupOn || this.frame > this.duration)) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.04
                if (this.alpha <= 0) {
                    this.alpha = 0
                    this.lifetime = 0
                    itemPickupGoing = false
                    return
                }
            }
            let a = this.alpha
            let cx = 160, cy = 100
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)
            if (this.frame % 18 === 0 && !this.fadingOut) this.rings.push({ r: 10 })
            for (let i = this.rings.length - 1; i >= 0; i--) {
                let ring = this.rings[i]
                ring.r += 2.2
                let la = a * Math.max(0, 1 - ring.r / 150)
                if (la <= 0) { this.rings.splice(i, 1); continue }
                DrawStroke(cx, cy, ring.r, `hsla(48, 100%, 65%, ${la})`, 9)
            }
            let pulse = 0.6 + 0.4 * Math.sin(this.frame * 0.15)
            DrawCircle(cx, cy, 60, `hsla(48, 100%, 60%, ${0.25 * a * pulse})`)
            DrawCircle(cx, cy, 40, `hsla(52, 100%, 70%, ${0.6 * a})`)
            DrawCircle(cx, cy, 18,  `hsla(55, 100%, 92%, ${a})`)
            let n = 8
            for (let i = 0; i < n; i++) {
                let ang = (i / n) * Math.PI * 2 + this.frame * 0.02
                let r1 = 22, r2 = 40 + Math.sin(this.frame * 0.1 + i) * 6
                DrawLine([cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1],
                         [cx + Math.cos(ang) * r2, cy + Math.sin(ang) * r2],
                         `hsla(50, 100%, 85%, ${a * 0.7})`, 2)
            }
        }
    }

    // DeathEffect: big blood drips fall while a blood pool rises from the bottom
    // to fill the whole screen — then the effect ends. Isaac's "you died" moment.
    // Drops sit behind the pool, fading out as they slip behind the red, and stop
    // drawing once it's full so no residual drops linger over the fade-out.
    function DeathEffect() {
        this.frame = 0
        this.alpha = 0
        this.lifetime = 1
        this.fadingOut = false
        this.pool = 0            // blood pool rising from the bottom until it fills the screen
        this.drops = []
        for (let i = 0; i < 22; i++) {
            this.drops.push({
                x: Math.random() * 320,
                y: -Math.random() * 200,
                vy: 1.5 + Math.random() * 3,
                len: 18 + Math.random() * 30,   // bigger streaks
                w: 5 + Math.random() * 6        // thicker drops
            })
        }
        this.draw = function () {
            this.frame++
            if (!this.fadingOut && this.alpha < 1) {
                this.alpha += 0.03
                if (this.alpha > 1) this.alpha = 1
            }
            // End early if the effect is toggled off mid-play.
            if (!this.fadingOut && !enableDeathEffectOn) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.03
                if (this.alpha <= 0) {
                    this.alpha = 0
                    this.lifetime = 0
                    deathEffectGoing = false
                    return
                }
            }
            let a = this.alpha
            // Dark backdrop + deep blood-red vignette.
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)
            DrawRect(0, 0, 320, 200, `hsla(0, 85%, 12%, ${0.3 * a})`)
            // Advance the pool first so we know where its top edge is this frame.
            if (!this.fadingOut) {
                this.pool += 0.8
                if (this.pool >= 200) { this.pool = 200; this.fadingOut = true }
            }
            let poolTop = 200 - this.pool
            // Falling blood drops — drawn BEHIND the pool. Each fades out over the
            // last 25px as it nears the surface, so it vanishes just as it slips
            // behind the red. Once the pool is full and fading, drops stop drawing
            // entirely so no residual drops linger over the fading rectangle.
            if (!this.fadingOut) {
                for (let d of this.drops) {
                    d.y += d.vy
                    if (d.y - d.len > 200) { d.y = -d.len; d.x = Math.random() * 320; d.vy = 1.5 + Math.random() * 3 }
                    let dist = poolTop - d.y                    // gap from head to the surface (>0 above)
                    let df = dist >= 25 ? 1 : Math.max(0, dist / 25)
                    let da = a * df
                    DrawRect(d.x - d.w / 2, d.y - d.len, d.w, d.len, `hsla(0, 90%, 30%, ${da})`)
                    DrawCircle(d.x, d.y, d.w * 0.9, `hsla(0, 90%, 35%, ${da})`)
                }
            }
            // Rising blood pool — drawn on top of the drops; fills the whole
            // screen (up to the top), then fades out on its own.
            DrawRect(0, poolTop, 320, this.pool, `hsla(0, 90%, 22%, ${a})`)
            DrawRect(0, poolTop, 320, 3, `hsla(0, 90%, 35%, ${a})`)   // glossy rising edge
        }
    }

    // CoinEffect: a spinning gold coin over a golden coin-shower. STUB — restyle
    // the visuals freely; the lifecycle + coinGoing reset are already wired.
    // (Currently shared by coin / bomb / key pickups via coinCallback.)
    function CoinEffect() {
        this.frame = 0
        this.alpha = 0
        this.lifetime = 1
        this.duration = 90
        this.fadingOut = false
        this.coins = []
        for (let i = 0; i < 16; i++) {
            this.coins.push({
                x: Math.random() * 320,
                y: -20 - Math.random() * 200,
                vy: 1.5 + Math.random() * 2.5,
                r: 15 + Math.random() * 5,
                phase: Math.random() * Math.PI * 2
            })
        }
        this.draw = function () {
            this.frame++
            if (!this.fadingOut && this.alpha < 1) { this.alpha += 0.08; if (this.alpha > 1) this.alpha = 1 }
            if (!this.fadingOut && (!enableCoinEffectOn || this.frame > this.duration)) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.05
                if (this.alpha <= 0) { this.alpha = 0; this.lifetime = 0; coinGoing = false; return }
            }
            let a = this.alpha
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)
            // Falling coin shower — width oscillates to fake a flipping coin.
            for (let c of this.coins) {
                c.y += c.vy
                if (c.y > 220) { c.y = -20; c.x = Math.random() * 320 }
                let w = Math.abs(Math.cos(this.frame * 0.15 + c.phase)) * c.r + 1
                DrawEllipse(c.x, c.y, w, c.r, 0, `hsla(48, 100%, 55%, ${a})`)
            }
            // Big flipping coin in the center.
            let cx = 160, cy = 100
            let w = Math.abs(Math.cos(this.frame * 0.12)) * 55 + 5
            DrawEllipse(cx, cy, w, 55, 0, `hsla(46, 100%, 55%, ${a})`)
            DrawEllipse(cx, cy, w * 0.7, 40, 0, `hsla(52, 100%, 68%, ${a})`)
        }
    }

    // BossEffect: an ominous pulsing-red wash behind a blocky skull silhouette.

    // reset are already wired.
    function BossEffect() {

        this.fadingOut = false

            this.frame++

            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)
            DrawRect(0, 0, 320, 200, `hsla(0, 90%, ${18 + pulse * 12}%, ${0.4 * a})`)
            let cx = 160, cy = 86
            DrawEllipse(cx, cy, 66, 50, 0, `hsla(0, 0%, 92%, ${a})`)                      // cranium
            DrawRect(cx - 32, cy + 42, 66, 40, `hsla(0, 0%, 92%, ${a})`)                  // jaw
            DrawCircle(cx - 18, cy - 4, 16, `hsla(0, 90%, ${30 + pulse * 30}%, ${a})`)    // left eye socket
            DrawCircle(cx + 18, cy - 4, 16, `hsla(0, 90%, ${30 + pulse * 30}%, ${a})`)    // right eye socket
            DrawTriangle(cx - 6, cy + 14, cx + 6, cy + 14, cx, cy + 26, `hsla(0, 0%, 5%, ${a})`)  // nose
        }
    }

    // EternalEffect: two big white X marks over a blue wash. Fires when soul
    // (blue) health is high (> .6). Simple fade in → hold → fade out one-shot.
    function EternalEffect() {
        this.frame = 0
        this.alpha = 0
        this.lifetime = 1
        this.duration = 120
        this.fadingOut = false
        this.draw = function () {
            this.frame++
            if (!this.fadingOut && this.alpha < 1) { this.alpha += 0.05; if (this.alpha > 1) this.alpha = 1 }
            if (!this.fadingOut && (!enableEternalEffectOn || this.frame > this.duration)) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.05
                if (this.alpha <= 0) { this.alpha = 0; this.lifetime = 0; return }
            }
            let a = this.alpha
            // Blue background.
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)
            DrawRect(0, 0, 320, 200, `hsla(210, 50%, 45%, ${0.85 * a})`)
            // Two white X marks.
            let s = 40, cy = 100
            let xs = [110, 210]
            for (let i = 0; i < xs.length; i++) {
                let cx = xs[i]
                DrawLine([cx - s, cy - s], [cx + s, cy + s], `hsla(0, 0%, 100%, ${a})`, 20)
                DrawLine([cx - s, cy + s], [cx + s, cy - s], `hsla(0, 0%, 100%, ${a})`, 20)
            }
        }
    }

    // BombEffect: a black bomb with a sparking fuse that flashes faster and then
    // detonates in a fireball with flying debris. Fires on a bomb pickup.
    function BombEffect() {
        this.frame = 0
        this.alpha = 0
        this.lifetime = 1
        this.fadingOut = false
        this.exploded = false
        this.explodeFrame = 0
        this.fuseAt = 70          // frames until detonation
        this.parts = []
        for (let i = 0; i < 24; i++) {
            let ang = Math.random() * Math.PI * 2
            let spd = 1.5 + Math.random() * 3.5
            this.parts.push({ x: 160, y: 100, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, size: 3 + Math.random() * 5, live: false })
        }
        this.draw = function () {
            this.frame++
            if (!this.fadingOut && this.alpha < 1) { this.alpha += 0.08; if (this.alpha > 1) this.alpha = 1 }
            if (!this.exploded && !enableBombEffectOn) this.fadingOut = true
            if (!this.exploded && this.frame >= this.fuseAt) {
                this.exploded = true
                this.explodeFrame = this.frame
                for (let p of this.parts) p.live = true
            }
            if (this.exploded && this.frame - this.explodeFrame > 60 && !this.fadingOut) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.05
                if (this.alpha <= 0) { this.alpha = 0; this.lifetime = 0; bombGoing = false; return }
            }
            let a = this.alpha
            let cx = 160, cy = 100
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)
            if (!this.exploded) {
                let near = this.frame / this.fuseAt           // 0..1, grows toward the boom
                // Bomb body + highlight.
                DrawCircle(cx, cy + 6, 68, `hsla(0, 0%, 12%, ${a})`)
                DrawCircle(cx - 10, cy - 2, 18, `hsla(0, 0%, 32%, ${a})`)
                // Fuse cap + fuse + sparking tip.
                DrawRect(cx - 5, cy - 78, 20, 20, `hsla(30, 55%, 38%, ${a})`)
                DrawLine([cx, cy - 68], [cx + 12, cy - 88], `hsla(30, 55%, 45%, ${a})`, 6)
                let spark = 0.5 + 0.5 * Math.sin(this.frame * 0.8)
                DrawCircle(cx + 12, cy - 88, 9 + spark * 3 * near, `hsla(45, 100%, ${60 + spark * 30}%, ${a})`)
                // Whole bomb flashes red, faster as detonation nears.
                let rate = Math.max(3, 12 - near * 10)
                if (Math.floor(this.frame / rate) % 2 === 0) {
                    DrawCircle(cx, cy + 6, 68, `hsla(0, 90%, 45%, ${0.4 * a * near})`)
                }
            } else {
                let ef = this.frame - this.explodeFrame
                let burst = Math.min(ef / 15, 1)
                let flick = 0.6 + Math.random() * 0.4
                DrawCircle(cx, cy, 100 * burst, `hsla(20, 100%, 55%, ${0.35 * a * flick})`)
                DrawCircle(cx, cy, 70 * burst,  `hsla(12, 100%, 50%, ${0.6 * a * flick})`)
                DrawCircle(cx, cy, 38 * burst,  `hsla(45, 100%, 65%, ${0.9 * a * flick})`)
                for (let p of this.parts) {
                    if (!p.live) continue
                    p.x += p.vx; p.y += p.vy; p.vy += 0.05
                    let pa = a * Math.max(0, 1 - ef / 60)
                    DrawCircle(p.x, p.y, p.size, `hsla(20, 90%, ${40 + Math.random() * 20}%, ${pa})`)
                }
            }
        }
    }

    // KeyEffect: a golden key with a glowing halo and a sparkle. Fires on a key
    // pickup. Simple fade in → hold → fade out one-shot.
    function KeyEffect() {
        this.frame = 0
        this.alpha = 0
        this.lifetime = 1
        this.duration = 120
        this.fadingOut = false
        this.draw = function () {
            this.frame++
            if (!this.fadingOut && this.alpha < 1) { this.alpha += 0.06; if (this.alpha > 1) this.alpha = 1 }
            if (!this.fadingOut && (!enableKeyEffectOn || this.frame > this.duration)) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.05
                if (this.alpha <= 0) { this.alpha = 0; this.lifetime = 0; keyGoing = false; return }
            }
            let a = this.alpha
            let cx = 160, cy = 100
            let pulse = 0.5 + 0.5 * Math.sin(this.frame * 0.12)
            let gold = `hsla(46, 100%, 55%, ${a})`
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)
            // Glow behind the key.
            DrawCircle(cx, cy, 80 + pulse * 8, `hsla(48, 100%, 55%, ${0.15 * a})`)
            // Key: ring head (bow) on the left, shaft, teeth on the right.
            let bowX = cx - 58
            DrawStroke(bowX, cy, 20, "grey", 14)
            DrawRect(bowX + 16, cy - 5, 95, 10, "grey")
            DrawRect(bowX + 103, cy + 5, 8, 16, "grey")
            DrawRect(bowX + 90, cy + 5, 8, 11, "grey")
            // Sparkle near the teeth.
            let sx = cx + 74
            DrawLine([sx - 6, cy - 30], [sx + 6, cy - 30], `hsla(52, 100%, 92%, ${a * pulse})`, 6)
            DrawLine([sx, cy - 36], [sx, cy - 24], `hsla(52, 100%, 92%, ${a * pulse})`, 6)
        }
    }

    // LevelUpEffect: a brown treasure chest whose lid hinges open while golden
    // light and rays pour out. Fade in → chest opens → hold → fade out.
    function LevelUpEffect() {
        this.frame = 0
        this.alpha = 0
        this.lifetime = 1
        this.duration = 150
        this.fadingOut = false
        this.lid = 0             // 0 = closed, eases toward 1 = fully open
        this.draw = function () {
            this.frame++
            if (!this.fadingOut && this.alpha < 1) { this.alpha += 0.06; if (this.alpha > 1) this.alpha = 1 }
            if (!this.fadingOut && (!enableLevelUpEffectOn || this.frame > this.duration)) this.fadingOut = true
            if (this.fadingOut) {
                this.alpha -= 0.05
                if (this.alpha <= 0) { this.alpha = 0; this.lifetime = 0; levelUpGoing = false; return }
            }
            let a = this.alpha
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${a})`)

            // After a short beat, ease the lid open.
            if (this.frame > 20 && this.lid < 1) this.lid += (1 - this.lid) * 0.06
            let open = this.lid

            let cx = 160
            let baseTop = 118
            let baseW = 130
            let baseH = 46
            let bx = cx - baseW / 2

            // Golden light pouring out of the opening — grows with how open it is.
            if (open > 0.05) {
                let pulse = 0.6 + 0.4 * Math.sin(this.frame * 0.2)
                let glowA = a * open
                DrawCircle(cx, baseTop, 75 * open, `hsla(45, 100%, 60%, ${0.25 * glowA * pulse})`)
                DrawCircle(cx, baseTop, 42 * open, `hsla(50, 100%, 70%, ${0.4 * glowA})`)
            }

            // Chest base (brown box) with rim, shadow and a metal lock.
            DrawRect(bx, baseTop, baseW, baseH, `hsla(28, 65%, 32%, ${a})`)                              // body
            DrawRect(bx, baseTop, baseW, 8, `hsla(30, 60%, 42%, ${a})`)                                 // top rim
            DrawRect(bx, baseTop + baseH - 8, baseW, 8, `hsla(28, 60%, 22%, ${a})`)                      // bottom shadow
            DrawRect(bx + baseW / 2 - 9, baseTop + baseH / 2 - 9, 18, 20, `hsla(45, 90%, 55%, ${a})`)    // lock plate
            DrawRect(bx + baseW / 2 - 3, baseTop + baseH / 2 - 2, 6, 8, `hsla(30, 40%, 15%, ${a})`)      // keyhole

            // Lid — hinged at the top-back corner, swinging up and back as it opens.
            hiddenCtx.save()
            hiddenCtx.translate(bx, baseTop)
            hiddenCtx.rotate(-open * 2.1)
            DrawRect(0, -20, baseW, 22, `hsla(28, 60%, 38%, ${a})`)     // lid body
            DrawRect(0, -20, baseW, 7,  `hsla(30, 60%, 48%, ${a})`)     // lid highlight
            DrawRect(0, -6, baseW, 6,   `hsla(28, 60%, 24%, ${a})`)     // lid lower band
            hiddenCtx.restore()
        }
    }
    //#endregion

    window.requestAnimationFrame(update)
</script>
