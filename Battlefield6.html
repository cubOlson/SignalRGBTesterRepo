<script>
    // Canvas initialization
    const canvas = document.getElementById('exCanvas');
    const ctx = canvas.getContext('2d');
    const width = 320;
    const height = 200;
    let effects = [];

    let gInGame = false

    let InGameWhiteMeter = new Meter(5, inGameCallback)
    let InGameNotWhiteMeter = new Meter(5, inGameCallback)
    let InGameBlackMeter = new Meter(5, inGameCallback)
    let InGameNotBlackMeter = new Meter(5, inGameCallback)

    let HPMeter = new Meter(5, inGameCallback)
    let LowHealthMeter = new Meter(5, lowHealthCallback)

    let KillRedMeter = new Meter(5, killCallback)
    let KillWhiteMeter = new Meter(5, killCallback)

    let DownedWhiteMeter = new Meter(5, downedCallback)
    let RequestWhiteMeter = new Meter(5, downedCallback)
    let ReviveGreenMeter = new Meter(5, downedCallback)

    let VictoryBlueMeter = new Meter(5, endGameCallback)
    let DefeatRedMeter = new Meter(5, endGameCallback)

    let VehicleMeter = new Meter(5, vehicleCallback)
    let VehicleNotMeter = new Meter(5, vehicleCallback)
    let VehicleHPMeter = new Meter(5, vehicleCallback)
   
    //#region Update
    function update() {
      DrawRect(0, 0, 320, 200, "black")
      backgroundHandler()

      InGameWhiteMeter.setValue(engine.vision.inGameWhite)
      InGameNotWhiteMeter.setValue(engine.vision.inGameNotWhite)
      InGameBlackMeter.setValue(engine.vision.inGameBlack)
      InGameNotBlackMeter.setValue(engine.vision.inGameNotBlack)

      if(engine.vision.healthNotGreen <= .05) HPMeter.setValue(engine.vision.healthGreen + engine.vision.healthRed)
      LowHealthMeter.setValue(engine.vision.healthRed)

      KillRedMeter.setValue(engine.vision.killRed)
      KillWhiteMeter.setValue(engine.vision.killWhite + engine.vision.killRed2)

      DownedWhiteMeter.setValue(engine.vision.downedWhite)
      RequestWhiteMeter.setValue(engine.vision.requestWhite)
      ReviveGreenMeter.setValue(engine.vision.reviveGreen)

      VictoryBlueMeter.setValue(engine.vision.victoryBlue)
      DefeatRedMeter.setValue(engine.vision.defeatRed)

      VehicleMeter.setValue(engine.vision.vehicleConfirm)
      VehicleNotMeter.setValue(engine.vision.vehicleNot)
      VehicleHPMeter.setValue(engine.vision.vehicleHealth)
  
      effects.forEach((ele, i) => {
        ele.draw()
        if(ele.lifetime <= 0){
          effects.splice(i, 1)
        }
      })

      if(adjOn){
        if(hpOn) DrawRect(hpX * 3.2, hpY * 2, hpWidth * 3.2, hpHeight * 2, "red")
      }
  
      window.requestAnimationFrame(update);
    };

    let healthHUDGoing = false
    function inGameCallback(){
      if(((InGameWhiteMeter.value >= .95 && engine.vision.inGameNotWhite < .1) || (VehicleMeter.value >= .95 && engine.vision.vehicleNot < .1)) && InGameBlackMeter.value >= .95 && engine.vision.inGameNotBlack <= .7) gInGame = true
      else if (InGameWhiteMeter.value <= .05 && VehicleMeter.value <= .1) gInGame = false

      if(gInGame && !healthHUDGoing){
        healthHUDGoing = true
        if(hpOn) effects.push(new healthHUD())
      } else if (!gInGame) healthHUDGoing = false
    }

    let vehicleGoing = false
    function vehicleCallback(){
      if(gInGame && VehicleMeter.value >= .95 && engine.vision.vehicleNot <= .1 && !vehicleGoing){
        vehicleGoing = true
        if(vehicleOn) effects.push(new vehicle())
      } else if (!gInGame || VehicleMeter.value <= .1) vehicleGoing = false
    }

    function vehicle(){
      this.val = 0
      this.points = []
      this.draw = function(){
        this.val += (VehicleHPMeter.value - this.val) / 20
        DrawRect(0, 0, 320, 200, getColorString(this.val * 120, 100, 20, .5 + Math.sin(Date.now() / 100) * (1 - this.val) * .25))
        if(this.points.length > Math.floor(20 - this.val * 20)) this.points.pop()
        else if(this.points.length < Math.floor(20 - this.val * 20)){
          this.points.push(new vehicleHelp())
        }
        this.points.forEach((ele, i)=>{
          ele.draw(this.val)
          ele.tRad = 3 * this.points.length - i * 2
        })
        if(!vehicleGoing) this.lifetime = 0
      }
    }

    function vehicleHelp(){
      this.x = Math.random() * 320
      this.y = Math.random() * 200
      this.rad = 1
      this.tRad = 10
      this.draw = function(val){
        this.rad += (this.tRad - this.rad) / 10
        DrawCircle(this.x, this.y, this.rad, getColorString(0, 100, 50, .5 + Math.sin(Date.now() / 100) * (1 - val) * .25))
        DrawCircle(this.x, this.y, this.rad * .75, getColorString(0, 100, 90, .75 + Math.sin(Date.now() / 100) * (1 - val) * .25))
      }
    }

    let lowHealthGoing = false
    function lowHealthCallback(){
      if(gInGame && LowHealthMeter.value >= .05 && engine.vision.healthGreen < .1 && !lowHealthGoing){
        lowHealthGoing = true
        if(healthOn) effects.push(new lowHealth())
      } else if (gInGame && HPMeter.value >= .25 && LowHealthMeter.value < .05 && lowHealthGoing){
        lowHealthGoing = false
        if(healthOn) effects.push(new healed())
      }
    }

    function healed(){
      this.rad = 300
      this.draw = function(){
        DrawStroke(160, 100, this.rad, getColorString(120, 100, 50, .75), 200)
        this.rad > 5 ? this.rad-=5 : this.lifetime = 0
      }
    }

    function lowHealth(){
      this.alpha = 0
      this.draw = function(){
        DrawRect(0, 0, 320, 200, getColorString(0, 100, 20, this.alpha))
        if(!lowHealthGoing || !gInGame) this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
        else this.alpha = Math.sin(Date.now() / 100) * .5 + .25
        if(Math.random() > .9) effects.push(new lowHealthHelp())
      }
    }

    function lowHealthHelp(){
      this.x = Math.random() * 320
      this.y = Math.random() * 200
      this.x2 = this.x
      this.y2 = this.y
      this.alpha = .75
      this.rad = 1
      this.count = 0
      this.draw = function(){
        this.count < 50 ? this.count++ : this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
        if(this.count % 10 == 0){
          this.x2 = Math.random() * 320
          this.y2 = Math.random() * 200
        }
        this.x += (this.x2 - this.x) / 20
        this.y += (this.y2 - this.y) / 20
        DrawCircle(this.x, this.y, this.rad, getColorString(0, 100, 30, this.alpha))
        this.rad+=.5
      }
    }

    let killGoing = false
    function killCallback(){
      if(gInGame && KillRedMeter.value >= .2 && KillWhiteMeter.value >= .45 && engine.vision.killNotRed1 <= .1 && engine.vision.killNotRed2 <= .1 && !killGoing){
        killGoing = true
        if(killOn) effects.push(new killedEnemy())
      } else if (gInGame && KillRedMeter.value <= .05 && KillWhiteMeter.value <= .1) killGoing = false
    }

    function killedEnemy(){
        this.alpha = 0
        this.l1 = 0
        this.l2 = 0
        this.stroke = 10
        this.draw = function(){
            DrawRect(0, 0, 320, 200, getColorString(0, 0, 0, this.alpha))
            ctx.save()
            ctx.rotate(-1)
            DrawLine([0, 0], [0, this.l1], getColorString(0, 100, 50, this.alpha), this.stroke)
            ctx.restore()
            ctx.save()
            ctx.translate(320, 0)
            ctx.rotate(1)
            ctx.translate(-320, 0)
            DrawLine([320, 0], [320, this.l2], getColorString(0, 100, 50, this.alpha), this.stroke)
            ctx.restore()
            if(!this.half) this.alpha <= .95 ? this.alpha += .05 : this.l1 < 400 ? this.l1 += (410 - this.l1) / 10 : this.l2 < 400 ? this.l2 += (410 - this.l2) / 10: this.half = true;
            else this.alpha >= .025 ? this.alpha -= .025 :this.lifetime = 0
            this.stroke+=.75
        }
    }

    let downedGoing = false
    let requestGoing = false
    let saveGoing = false
    function downedCallback(){
      if(gInGame && HPMeter.value <= .05 && DownedWhiteMeter.value >= .95 && !downedGoing){
        downedGoing = true
        if(downedOn) effects.push(new playerDowned())
      } else if (gInGame && downedGoing && RequestWhiteMeter.value >= .95 && !requestGoing){
        requestGoing = true
        if(downedOn) effects.push(new calledForHelp())
      } else if (gInGame && downedGoing && requestGoing && ReviveGreenMeter.value >= .95 && !saveGoing){
        saveGoing = true
        if(downedOn) effects.push(new beingSaved())
      } else if (!gInGame || ((downedGoing || requestGoing) && HPMeter.value >= .25)){
        deadOrAliveCheck()
        downedGoing = false
        requestGoing = false
        saveGoing = false
      }
    }

      function beingSaved(){
        this.alpha = 0
        this.rot = 0
        this.val1 = 0
        this.val2 = 0
        this.stage = 0
        this.draw = function(){
            DrawRect(0, 0, 320, 200, getColorString(120, 100, 20 + Math.sin(Date.now() / 200) * 5, this.alpha / 2))
            ctx.beginPath()
            ctx.arc(160, 100, 100, this.val1, this.val2, false)
            ctx.strokeStyle = "green"
            ctx.lineWidth = 50
            ctx.stroke()
            ctx.save()
            ctx.translate(160, 100)
            ctx.rotate(this.rot)
            ctx.translate(-160, -100)
            DrawPath(125, 127 + Math.sin(Date.now() / 100) * 10, jaw1, getColorString(0, 0, 90, this.alpha), 1, 1)
            DrawPath(105, 10, skull, getColorString(0, 100, 100, this.alpha), 1, 1)
            ctx.restore()
            this.rot < Math.PI * 2 ? this.rot += .05 : this.rot = 0
            if(this.rot == 0){
              this.stage < 1 ? this.stage++ : this.stage = 0
            }
            if(this.stage == 0){
              this.val2 = this.rot
              if(this.val2 > Math.PI * 2) this.val2 = Math.PI * 2
            } else if (this.stage == 1){
              this.val1 = this.rot
              if(this.val1 > Math.PI * 2) this.val1 = Math.PI * 2
            }
            if(downedOn && saveGoing) this.alpha <= .95 ? this.alpha += .05 : this.alpha = 1
            else this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
        }
    }

    let deadGoing = false
    let reviveGoing = false
    function deadOrAliveCheck(){
      if(!gInGame && downedGoing){
        deadGoing = true
        if(downedOn) effects.push(new playerDied())
      } else if (gInGame) deadGoing = false

      if(gInGame && (downedGoing || requestGoing)){
        reviveGoing = true
        if(downedOn) effects.push(new playerRevived())
      } else setTimeout(()=>{
        reviveGoing = false
      }, 3000)
    }

    function playerRevived(){
        this.y = 200
        this.draw = function(){
            DrawTriangle(160, this.y, 330, this.y + 100, -10, this.y + 100, getColorString(120, 100, 50, 1))
            this.y > -300 ? this.y -= 5 : this.lifetime = 0
            let grad = ctx.createLinearGradient(160, this.y + 100, 160, this.y + 300)
            grad.addColorStop(0, getColorString(120, 100, 50, 1))
            grad.addColorStop(1, getColorString(120, 100, 50, 0))
            DrawRect(0, this.y + 100, 320, 200, grad)
        }
    }

    function playerDied(){
      this.alpha = 0
      this.draw = function(){
        DrawRect(0, 0, 320, 200, getColorString(0, 0, 0, this.alpha))
        if(this.alpha <= .7 && deadGoing && !gInGame) this.alpha += .01
        else this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
        this.count < 20 ? this.count++ : this.count = 0
        if(!this.count) effects.push(new blood())
      }
    }

    function blood(){
      this.y = -20
      this.x = Math.random() * 320
      this.points = []
      this.count = 0
      this.alpha = 1
      this.draw = function(){
        this.count < 10 ? this.count++ : this.count = 0
        if(!this.count) this.points.unshift([this.x, this.y])
        if(this.points.length > 8) this.points.pop()
        DrawCircle(this.x, this.y, 20, getColorString(0, 100, 50, this.alpha))
        this.points.forEach((ele, i)=>{
          DrawCircle(ele[0], ele[1], 20 - i * 2, getColorString(0, 100, 50, this.alpha))
        })
        this.y < 350 ? this.y += 2 : this.lifetime = 0
        this.x += Math.sin(this.y / 10)
        if(gInGame) this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
      }
    }

    let victoryGoing = false
    let defeatGoing = false
    function endGameCallback(){
      if(!gInGame && VictoryBlueMeter.value >= .95 && engine.vision.victoryNotBlue <= .05 && !victoryGoing){
        if(endOn) effects.push(new endEffect(200))
        victoryGoing = true
      } else setTimeout(()=>{
        victoryGoing = false
      }, 10000)

      if(!gInGame && DefeatRedMeter.value >= .95 && engine.vision.defeatNotRed <= .05 && !defeatGoing){
        if(endOn) effects.push(new endEffect(0))
        defeatGoing = true
      } else setTimeout(()=>{
        defeatGoing = false
      }, 10000)
    }

    function endEffect(hue){
      this.width = 0
      this.alpha = 0
      this.switch = false
      this.hue = hue
      this.draw = function(){
        let grad = ctx.createLinearGradient(-100, 0, 420, 0)
        grad.addColorStop(.5 - this.width, getColorString(this.hue, 100, 50, 0))
        grad.addColorStop(.5, getColorString(this.hue, 100, 50, this.alpha))
        grad.addColorStop(.5 + this.width, getColorString(this.hue, 100, 50, 0))
        DrawRect(-100, 0, 520, 200, grad)
        if(!this.switch) this.alpha <= .975 ? this.alpha += .025 : this.width < .49 ? this.width += .0025 : this.switch = true
        else this.alpha >= .01 ? this.alpha -= .01 : this.lifetime = 0
        if(Math.random() > .95) {
          let tempX = Math.random() * 320
          let tempY = Math.random() * 200
          for(let i = 0; i < 20; i++) effects.push(new endHelp(this.hue, tempX, tempY))
        }
      }
    }

    function endHelp(hue, x, y){
      this.hue = hue
      this.x = x
      this.y = y
      this.vx = Math.random() * 4 - 2
      this.vy = Math.random() * 4 - 2
      this.lifetime = 100
      this.draw = function(){
        DrawCircle(this.x, this.y, this.hue == 0 ? 25 : 10, getColorString(this.hue, 100, this.hue == 0 ? 10 : 75, this.lifetime / 100))
        this.x+=this.vx
        this.y+=this.vy
        this.lifetime--
      }
    }

    function healthHUD(){
      this.val = 0
      this.dead = false
      this.draw = function(){
        if (!adjOn) DrawRect(hpX * 3.2, hpY * 2, hpWidth * 3.2 * this.val, hpHeight * 2, "red")
        if(!healthHUDGoing || this.dead) {
          this.val > .1 ? this.val -= .1 : this.lifetime = 0
          this.dead = true
        } else this.val += (HPMeter.value - this.val) / 20
      }
    }
    //#region Background Modes
    // Background Configuration
    let proBack = [0, 0, 0];
    function onbackColorChanged() {
        proBack = hexToHSL(backColor);
    }

    // Audio and Color Cycle State
    let audioEase = { sat: 0, lit: 0 };
    let gCycle = 0;
    
    // Background Utility Functions
    function updateAudioEase() {
        const targetDensity = engine.audio.density * 100;
        audioEase.sat += (targetDensity - audioEase.sat) / 10;
        audioEase.lit += (targetDensity - audioEase.lit) / 10;
    }

    function getColorString(hue, sat, lit, alpha) {
        return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`;
    }

    function updateColorCycle() {
        gCycle = (gCycle + 0.5) % 360;
    }

    // Main Background Handler
    function backgroundHandler() {
        const alpha = ambienceAlpha / 100;

        // Handle color cycling first if needed
        if (backgroundMode.includes("Color Cycle")) {
            updateColorCycle();
        }

        // Handle audio processing if needed
        if (backgroundMode.includes("Audio")) {
            updateAudioEase();
        }

        // Render background based on mode
        if (backgroundMode.includes("Ambience")) {
            if (backgroundMode === "Ambience Audio Visualizer") {
                copyScreenAudio(alpha);
            } else {
                copyScreen(alpha);
            }
            return;
        }

        // Handle custom and cycle modes
        const hue = proBack[0] + (backgroundMode.includes("Color Cycle") ? gCycle : 0);
        const sat = backgroundMode.includes("Audio") ? audioEase.sat * 0.33 + 66 : proBack[1];
        const lit = backgroundMode.includes("Audio") ? audioEase.lit * 0.9 + 10 : proBack[2];
        
        DrawRect(0, 0, 320, 200, getColorString(hue, sat, lit, alpha));
    }

    // Zone Configuration Constants
    const ZONE_COLS = 28;
    const ZONE_ROWS = 20;
    const TOTAL_ZONES = ZONE_COLS * ZONE_ROWS;

    function copyScreenAudio(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat = new Int8Array(engine.zone.saturation)
        const hue = new Int16Array(engine.zone.hue)
        
        const width = 320 / ZONE_COLS
        const height = 200 / ZONE_ROWS
        
        // Use the global audioEase values we already calculated
        const satMultiplier = audioEase.sat / 200 + 0.5
        const litMultiplier = audioEase.lit / 100

        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const x = col * width
            const y = row * height
            
            ctx.fillStyle = getColorString(
                hue[iZone],
                sat[iZone] * satMultiplier,
                lightness[iZone] * litMultiplier,
                alpha
            )
            ctx.fillRect(x, y, width, height)
        }
    }
  
    function copyScreen(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat = new Int8Array(engine.zone.saturation)
        const hue = new Int16Array(engine.zone.hue)
        
        const width = 320 / ZONE_COLS
        const height = 200 / ZONE_ROWS
        
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const x = col * width
            const y = row * height
            
            const finalHue = backgroundMode === "Custom Ambience" 
                ? proBack[0] 
                : hue[iZone] + (backgroundMode === "Color Cycle Ambience" ? gCycle : 0)
            
            ctx.fillStyle = getColorString(
                finalHue,
                sat[iZone],
                lightness[iZone],
                alpha
            )
            ctx.fillRect(x, y, width, height)
        }
    }

    //#region Helper Functions
  function DrawArc(x, y, start, end, radius, direction, color){
    ctx.beginPath()
    ctx.arc(x, y, radius, start, end, direction)
    ctx.fillStyle = color
    ctx.fill()
  }

  function DrawLine(start, end, color, stroke){
    ctx.beginPath()
    ctx.moveTo(start[0], start[1])
    ctx.lineTo(end[0], end[1])
    ctx.strokeStyle = color
    ctx.lineWidth = stroke
    ctx.stroke()
  }

  function DrawEllipse(x, y, width, height, rotation, color){
    ctx.beginPath()
    ctx.ellipse(x, y, width, height, rotation, 0, Math.PI * 2)
    ctx.fillStyle = color
    ctx.fill()
  }

  function DrawPath(x, y, path, color, scaleX, scaleY) {
    ctx.fillStyle = color;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scaleX, scaleY)
    let ex = new Path2D(path);
    ctx.fill(ex);
    ctx.restore();
  };

  function DrawTriangle(cord1X, cord1Y, cord2X, cord2Y, cord3X, cord3Y, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.moveTo(cord1X, cord1Y);
    ctx.lineTo(cord2X, cord2Y);
    ctx.lineTo(cord3X, cord3Y);
    ctx.lineTo(cord1X, cord1Y);
    ctx.fill();
  };

  function DrawCircle(x, y, radius, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.fill();
  };

  function DrawStroke(x, y, radius, color, stroke) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = stroke;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.stroke();
  };

  function DrawRect(x, y, width, height, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
  };

  function strokeRect(x, y, width, height, color, stroke){
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = stroke
    ctx.rect(x, y, width, height);
    ctx.stroke()
  }

  function hexToHSL(hex) {
      const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || [];
      const rgb = [r, g, b].map(x => parseInt(x, 16) / 255);
      const max = Math.max(...rgb);
      const min = Math.min(...rgb);
      const l = (max + min) / 2;
      
      if (max === min) return [0, 0, Math.round(l * 100)];
      
      const d = max - min;
      const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      
      let h;
      const [nr, ng, nb] = rgb;
      if (max === nr) h = (ng - nb) / d + (ng < nb ? 6 : 0);
      else if (max === ng) h = (nb - nr) / d + 2;
      else h = (nr - ng) / d + 4;
      
      return [
        Math.round(h * 60),
        Math.round(s * 100),
        Math.round(l * 100)
      ];
    }
  
    function Meter(size, callback) {
      this.size = size;
      this.value = 0;
      this.diff = 0;
      this.increased = false;
      this.decreased = false;
      var values = [];
  
      this.setValue = function (updatedValue) {
        values.push(updatedValue);
        if (values.length > this.size) {
          values.shift();
        }
  
        for (var i = 0; i < values.length - 1; i++) {
          if (values[i] !== values[i + 1]) return;
        }
        if (this.value !== values[0]) {
          this.diff = Math.abs(this.value - values[0]);
          this.increased = this.value < values[0];
          this.decreased = this.value > values[0];
          this.value = values[0];
          callback();
        }
      }
    }
