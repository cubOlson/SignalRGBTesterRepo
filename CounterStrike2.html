<body style="margin: 0; padding: 0; background: #000;">
  <canvas id="exCanvas" width="320" height="200"></canvas>
</body>

<script>
  var canvas, ctx;
  var stateMgr = new StateHandler();
  var effects = [];
  var healthMeter = new Meter(10, onHealthChanged);
  var lowHealthMeter = new Meter(5, onLowHealthChanged)

  var InGameOrange1Meter = new Meter(15, onGameChanged);
  var InGameOrange2Meter = new Meter(15, onGameChanged);

  var InGameBlue1Meter = new Meter(15, onGameChanged);
  var InGameBlue2Meter = new Meter(15, onGameChanged);

  let SpectateConfirmOrangeMeter = new Meter(15, onSpectatingChanged)
  let SpectateConfirmBlueMeter = new Meter(15, onSpectatingChanged)

  var InShopBlackMeter = new Meter(10, onShopChanged)
  var InShopWhiteMeter = new Meter(10, onShopChanged)
  
  var KillMeter = new Meter(2, onKillChanged)
  var KillConfirmMeter = new Meter(2, onKillChanged)

  var RoundWinTMeter = new Meter(20, roundEndChanged);
  var RoundWinCTMeter = new Meter(20, roundEndChanged);
  var RoundLossMeter = new Meter(20, roundEndChanged);
  var RoundWhiteMeter = new Meter(10, roundEndChanged);

  var BombPlantedMeter = new Meter(3, onBombPlanted)
  var BombPlantedConfirmationMeter = new Meter(3, onBombPlanted)

  var gLowHpGoing = false;
  var gInGame = false;
  var gIsSpectating = false;
  var gInShop = false;
  var gBombPlantedPlaying = false;
  var gPlayerIsTerrorist = false
  var gTerroristPlaying = false;

  let crouchButton = ["none", 0]

  function update() {
    checkTeaBag()
    DrawRect(0, 0, 320, 200, "black")
    backgroundHandler()

    if(gInGame && crouchButton[0] == "none" && TeaToggle){
      DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, .75)`)
      ctx.font = "30px Arial";
      ctx.fillStyle = "red"
      ctx.fillText("Press Crouch Key", 40, 50);
      ctx.fillText("For Teabag Effect", 40, 100);
    }

    RoundWinTMeter.setValue(engine.vision.roundWinT)
    RoundWinCTMeter.setValue(engine.vision.roundWinCT)
    RoundLossMeter.setValue(engine.vision.roundLoss)
    RoundWhiteMeter.setValue(engine.vision.roundWhite)

    InGameOrange1Meter.setValue(engine.vision.inGameOrange1);
    InGameOrange2Meter.setValue(engine.vision.inGameOrange2)
    InGameBlue1Meter.setValue(engine.vision.inGameBlue1)
    InGameBlue2Meter.setValue(engine.vision.inGameBlue2)

    SpectateConfirmOrangeMeter.setValue(engine.vision.spectateConfirmOrange)
    SpectateConfirmBlueMeter.setValue(engine.vision.spectateConfirmBlue)

    InShopBlackMeter.setValue(engine.vision.inShopBlack)
    InShopWhiteMeter.setValue(engine.vision.inShopWhite)

    BombPlantedMeter.setValue(engine.vision.bombPlanted)
    BombPlantedConfirmationMeter.setValue(engine.vision.bombPlantedConfirmation)
    lowHealthMeter.setValue(engine.vision.lowHealth)
    KillMeter.setValue(engine.vision.kill)
    KillConfirmMeter.setValue(engine.vision.killConfirmation)
    healthMeter.setValue(engine.vision.healthBlue + engine.vision.healthOrange) 
    if (gInGame) {
      if(InGameOrange1Meter.value > InGameBlue1Meter.value && InGameOrange2Meter.value > InGameBlue2Meter.value){
          gPlayerIsTerrorist = true
      }
      
    }
    DrawHud()
    for (let i = 0; i < effects.length; i++) {
      effects[i].draw();
      if (effects[i].lifetime <= 0) {
        effects.splice(i, 1);
      }
    }
    stateMgr.Process();

    window.requestAnimationFrame(update);
  }

  let proBack = []
    function onbackColorChanged(){
      proBack = hexToHSL(backColor)
    }

    let backgroundEaseHue = 0;
    let backgroundEaseLit = 0;
    let backgroundEaseSat = 0
    let gCycle = 0
    function backgroundHandler(){
        switch(backgroundMode){
            case "Color Cycle": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Color Cycle Ambience": 
            copyScreen(ambienceAlpha / 100)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Custom": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            break;
            case "Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Custom Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Ambience Audio Visualizer": 
            copyScreenAudio(ambienceAlpha / 100)
            break;
            case "Custom Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
            case "Color Cycle Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
        }
    }

    let audioScreenSat = 0
    let audioScreenLit = 0
    function copyScreenAudio(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      audioScreenSat += (engine.audio.density * 100 - audioScreenSat) / 10
      audioScreenLit += (engine.audio.density * 100 - audioScreenLit) / 10
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        ctx.fillStyle = `hsla(${hue[iZone]}, ${sat[iZone] * (audioScreenSat / 200 + .5)}%, ${lightness[iZone] * (audioScreenLit / 100)}%, ${alpha})`;
        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }
  
    function copyScreen(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        ctx.fillStyle = `hsla(${(backgroundMode == "Custom Ambience" ? proBack[0] : hue[iZone] + gCycle * (backgroundMode == "Color Cycle Ambience"))}, ${sat[iZone]}%, ${lightness[iZone]}%, ${alpha})`;
        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }

  function onTeaResetChanged(){
    crouchButton = ["none", 0]
  }

  function DrawHud() {
    ctx.beginPath();
    ctx.fillStyle = healthColor;
    if (gInGame && !gIsSpectating) {
      ctx.fillRect((HealthBarX * 3.2),(HealthBarY * 2), healthMeter.value * (HealthBarWidth * 3.2), (HealthBarHeight * 2))
    }
    if(adjToggle) {
      ctx.fillRect((HealthBarX * 3.2), (HealthBarY * 2), (HealthBarWidth * 3.2), (HealthBarHeight * 2))
    }
  }

  function roundEndChanged(){
    if(WinToggle){
      if (!gTerroristPlaying && RoundWhiteMeter.value > .2 && engine.vision.roundNotWhite < .1) {
          if(RoundWinTMeter.value >= .95 && engine.vision.roundWinNotT <= .2) {
            effects.push(new TerroristWinsEffect()) 
            gTerroristPlaying = true;
          }
          else if (RoundWinCTMeter.value >= .95 && engine.vision.roundWinNotCT <= .2) {
            effects.push(new CounterTerroristWinsEffect())
            gTerroristPlaying = true;
          }
      }
      if (RoundLossMeter.value >= .95 && engine.vision.roundNotLoss <= .1 && !gTerroristPlaying && RoundWhiteMeter.value > .28 && engine.vision.roundNotWhite < .1) {
          if(gPlayerIsTerrorist) {
            effects.push(new CounterTerroristWinsEffect())
            gTerroristPlaying = true;
          }
          else {
            effects.push(new TerroristWinsEffect())
            gTerroristPlaying = true;
          }
      }
    }
    
  }

  function onSpectatingChanged() {
    if(SpectatingToggle){
      if (!gInGame && (SpectateConfirmBlueMeter.value > .9 || SpectateConfirmOrangeMeter.value > .9)) {
        if (!gPlayerIsTerrorist && !gIsSpectating) {
          effects.push(new SpectatingEffect(201, 98, 41))
        } else if (gPlayerIsTerrorist && !gIsSpectating) {
          effects.push(new SpectatingEffect(19, 98, 41))
        }
        gIsSpectating = true
      } else if (gInGame || (SpectateConfirmBlueMeter.value <= .25 && SpectateConfirmOrangeMeter.value <= .25)) {
          gIsSpectating = false;
      }  
    }

  }


  let killGoing = false
  function onKillChanged() {
    if(KillToggle){
      if (KillMeter.value >= .05 && engine.vision.killNot <= .05 && KillConfirmMeter.value >= .75 && KillMeter.diff > 0.05 && !killGoing) {
        effects.push(new killEffect())
        killGoing = true
      }

    }
    
  }

  function onBombPlanted() {
    if(BombToggle){
      if((gInGame || gIsSpectating) && BombPlantedMeter.value > 0.9 && BombPlantedConfirmationMeter.value > .9 && !gBombPlantedPlaying) {
        effects.push(new BombPlantedEffect());
        gBombPlantedPlaying = true;
      }
    }
    
  }

  function onShopChanged() {
    if (ShopToggle) {
      if (gInGame && InShopBlackMeter.value >= 0.8 && InShopWhiteMeter.value >= 0.25) {
        if (!gInShop) {
          effects.push(new ShopEffect())
        }
        gInShop = true;
      } else {
        gInShop = false;
      }
    }
  }

  function onGameChanged() {
    if ((InGameOrange1Meter.value >= .5 && InGameOrange2Meter.value >= .5 || InGameBlue1Meter.value >= .5 && InGameBlue2Meter.value >= .5) && engine.vision.inGameNot < .1){
      gInGame = true
    } else if(InGameOrange1Meter.value < .1 && InGameBlue1Meter.value < .1){
      gInGame = false
    }
  }

  function onHealthChanged() {
    if (healthToggle) {
      if (gInGame && healthMeter.decreased && !gIsSpectating && healthMeter.diff > .15 && InShopBlackMeter.value < 0.8 && InShopWhiteMeter.value < 0.25) {
        effects.push(new damaged());
      }
      onLowHealthChanged()
    }
  }

  function onLowHealthChanged() {
    if(healthToggle){
      if (lowHealthMeter.value >= .25 && !gLowHpGoing && !gIsSpectating && gInGame) {
        effects.push(new lowHpState())
        gLowHpGoing = true;
      }
    }
    
  }

  function damaged(){
    this.draw = function(){
      for (let index = 0; index < 30; index++) {
        setTimeout(() => {
          effects.push(new DamageState(160, 200, Math.random() * 10 + 15, "red"));
        }, 20 * index);
      }
      this.lifetime = 0
    }
  }

  function ShopExit(){
    this.draw = function(){
      effects.push(new ringsOut(60))
      this.lifetime = 0
    }
  }

  function lowHpState() {
    this.start = GetTime();
    this.alpha = 0
    this.draw = function () {
      this.duration = GetTime() - this.start;
      ctx.fillStyle = `hsla(0, 100%, 5%,${this.alpha})`
      if(this.alpha < .5) this.alpha += .05
      ctx.fillRect(0, 0, 320, 200);
      for (let i = -1; i < 7; i++) {
        let temp = Math.cos(this.duration / 100 + i) * 50 + 100
        DrawCircle(i * 50 + 30, temp, 50, `hsla(0, 100%, ${temp * .4}%, ${this.alpha})`)
      }
      if (healthMeter.value >= 0.25 || !gInGame || gIsSpectating) {
        this.lifetime = 0;
        gLowHpGoing = false;
      }
    }
  }

  function TerroristWinsEffect() {
      this.lifetime = 10
      this.count2 = 0
      this.draw = function () {
        if(this.count2 % 50 == 0){
          effects.push(new ringsOut(40))
          setTimeout(()=>{
            effects.push(new ringsOut(0))
          }, 500)
        }
        this.count2 < 200 ? this.count2++ : this.lifetime = 0
        if(this.lifetime == 0) gTerroristPlaying = false
    }
  }

  function ringsOut(color){
    this.rad = 1
    this.color = color
    this.draw = function(){
      for(let i = 1; i < 11; i++) DrawStroke(160, 100, this.rad * (i / 5), `hsla(${this.color}, 100%, 40%, ${i / 11})`, 20)
      this.rad < 300 ? this.rad += 3 : this.lifetime = 0
    }
  }

  function DrawRect(x, y, width, height, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
  };

  function DrawStroke(x, y, radius, color, stroke) {
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = stroke;
      ctx.arc(x, y, radius, 0, 2 * Math.PI)
      ctx.stroke();
    };

  function CounterTerroristWinsEffect() {
    this.alpha = 0
    this.rot = -.5
    this.rot2 = 0
    this.y = 400
    this.draw = function () {
      DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${this.alpha})`)
      DrawPlier(-this.rot, 160, this.y, 1)
      ctx.save()
      ctx.translate(0, 100)
      ctx.rotate(this.half ? -this.rot2 : 0)
      ctx.translate(-0, -100)
      DrawRect(0, 90, 160, 20, `hsla(${this.half ? 60 : 0}, 100%, ${this.half ? 50 : Math.sin(Date.now() / 100) * 10 + 55}%, ${this.alpha})`)
      ctx.restore()
      ctx.save()
      ctx.translate(320, 100)
      ctx.rotate(this.half ? this.rot2 : 0)
      ctx.translate(-320, -100)
      DrawRect(160, 90, 200, 20, `hsla(${this.half ? 60 : 0}, 100%, ${this.half ? 50 : Math.sin(Date.now() / 100) * 10 + 55}%, ${this.alpha})`)
      ctx.restore()
      DrawPlier(this.rot, 160, this.y, 0)
      this.y > 120 ? this.y -= 2 : this.rot < .35 ? this.rot += .025 : this.half = true;
      if(this.half) {
        this.rot2 += (.4 - this.rot2) / 10
        if(Math.random() > .75) effects.push(new CTWinPart())
        this.alpha >= .005 ? this.alpha -= .005 : this.lifetime = 0
      } else this.alpha < 1 ? this.alpha += .025 : this.alpha = 1
      if(this.lifetime == 0) gTerroristPlaying = false
    }
  }

  function CTWinPart(){
    this.x = Math.random() * 320
    this.y = 50
    this.vx = 4 - Math.random() * 8
    this.vy = 4 - Math.random() * 8
    this.ay = .1
    this.color = Math.random() > .5 ? "yellow" : "blue"
    this.draw = function(){
      DrawCircle(this.x, this.y, 20, this.color)
      this.x += this.vx
      this.y < 250 ? this.y += this.vy : this.lifetime = 0
      this.vy += this.ay
    }
  }

  function DrawPlier(rot, x, y, flip){
    ctx.save()
    ctx.translate(x, y)
    ctx.rotate(rot)
    if(flip) ctx.scale(-1, 1)
    ctx.translate(-x, -y)
    ctx.beginPath()
    ctx.moveTo(x, y)
    ctx.lineTo(x + 100, y + 75)
    ctx.lineTo(x + 150, y + 150)
    ctx.lineTo(x + 90, y + 150)
    ctx.lineTo(x - 50, y + 10)
    ctx.lineTo(x - 50, y - 125)
    ctx.lineTo(x, y)
    ctx.fillStyle = "blue"
    ctx.fill()
    ctx.restore()
  }

  function ShopEffect() {
    this.draw = function () {
      DrawRect(0, 0, 320, 200, `hsla(60, 100%, 40%, ${Math.sin(Date.now() / 1000) * .25 + .5})`)
      if (!gInShop) {
        this.lifetime = 0;
        effects.push(new ShopExit())
      }
    }
  }

  function killEffect() {
    this.start = GetTime();
    this.effects = []
    this.draw = function () {
      this.duration = GetTime() - this.start;
      this.effects.forEach((ele, i)=>{
        ele.draw()
        if(ele.lifetime <= 0) this.effects.splice(i, 1)
      })
      DrawSkull(160, 250 - this.duration / 8, 80, "white")
      if(this.duration < 3000) this.effects.push(new DamageState(160, 200, Math.random() * 10 + 5, "red"));
      if (this.duration > 4000) {
        this.lifetime = 0
        killGoing = false
      }
    }
  }

  function DamageState(x, y, radius, color) {
    this.radius = radius;
    this.color = color;
    this.moneyTrue = false;
    this.x = x;
    this.vx = 7 * Math.sin(radius);
    this.y = y;
    this.vy = Math.random() * -10 - 10;
    this.ay = 1;
    this.lifetime = 10;
    this.draw = function () {
      ctx.beginPath();
      ctx.fillStyle = this.color;
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fill();
      this.x += this.vx;
      this.y += this.vy;
      this.vy += this.ay;
      if (this.y > 200) {
        this.lifetime = 0;
      }
    }
  };

  function BombPlantedEffect() {
    this.start = GetTime();
    this.size = 100;
    this.out = 400
    this.draw = function () {
      this.duration = GetTime() - this.start;
      if (this.duration > 6000) {
        this.lifetime = 0
        gBombPlantedPlaying = false
      }
      this.size = (Math.sin(this.duration / 350) + 1) * 150;
      if(this.size > 145) this.out = 140
      this.out += 20
      ctx.beginPath();
      ctx.moveTo(160 - this.size / 2, 100 + this.size / 2);
      ctx.lineTo(160 + this.size / 2, 100 + this.size / 2);
      ctx.lineTo(160, 100 - this.size / 2.5);
      ctx.lineTo(160 - this.size / 2, 100 + this.size / 2);
      ctx.fillStyle = "red";
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(160 - this.out / 2, 100 + this.out / 2);
      ctx.lineTo(160 + this.out / 2, 100 + this.out / 2);
      ctx.lineTo(160, 100 - this.out / 2.5);
      ctx.lineTo(160 - this.out / 2, 100 + this.out / 2);
      ctx.strokeStyle = "red";
      ctx.lineWidth = 20
      ctx.stroke();
    }
  }

  function SpectatingEffect(colorh, colors, colorl) {
    this.color = {
      h: colorh,
      s: colors,
      l: colorl
    }
    this.draw = function () {
      DrawRect(0, 0, 320, 200, `hsla(${this.color.h}, ${this.color.s}%, ${this.color.l}%, ${Math.sin(Date.now() / 1000) * .2 + .25})`)
      if ((this.color.h > 100 && gInGame) || (this.color.h < 100 && gInGame) || !SpectatingToggle || gInShop) {
        this.lifetime = 0;
      }
    }
  }

  function ParticleExplosion(x, y, color, speed, duration, particleAmount, particleSize, fadeSpeed, notrandomY, useHearts, hasPhysics) {
    this.start = GetTime();
    this.col = color;
    this.speed = speed;
    this.duration = duration;
    this.lifetime = 2000;
    this.amount = particleAmount;
    this.size = particleSize
    this.x = x;
    this.y = y;
    this.fadeSpeed = fadeSpeed;
    this.particles = [];
    this.useHearts = useHearts;
    this.hasPhysics = hasPhysics;

    while (this.particles.length < this.amount) {
      if (notrandomY) {
        this.yspeed = -this.speed / 1.5;
      } else {
        this.yspeed = ((Math.random() - 0.5) * this.speed);
      }
      if (this.useHearts == null || this.useHearts == false) {
        this.particles.push(new ExplosionParticle(this.x, this.y, this.size, this.col, this.fadeSpeed,
          {
            x: ((Math.random() - 0.5) * this.speed),
            y: this.yspeed
          }, this.hasPhysics))
      }

      this.draw = function () {
        this.lifetime = this.duration - (GetTime() - this.start)
        this.particles.forEach((Particle, index) => {
          Particle.draw()
        })
      }
    }
  };

  //helper functions
  function GetTime() {
    return new Date().getTime();
  }

  function DrawCircle(x, y, radius, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.fill();
  };


  function DrawSkull(x, y, radius, color) {
    ctx.beginPath();
    ctx.ellipse(x, y, radius, radius / 4, 0, Math.PI / 2, true)
    ctx.fillStyle = color;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - radius, y)
    ctx.lineTo(x - radius * 1.1, y + radius / 1.2)
    ctx.lineTo(x - radius / 1.8, y + radius / 1.2)
    ctx.lineTo(x - radius / 1.8, y + radius * 1.3)
    ctx.lineTo(x + radius / 1.8, y + radius * 1.3)
    ctx.lineTo(x + radius / 1.8, y + radius / 1.2)
    ctx.lineTo(x + radius * 1.1, y + radius / 1.2)
    ctx.lineTo(x + radius, y)
    ctx.strokeStyle = "white"
    ctx.stroke()
    // ctx.fill();
    DrawCircle(x - radius / 2, y + radius / 4, 20, "black")
    DrawCircle(x + radius / 2, y + radius / 4, 20, "black")
  };



  class ExplosionParticle {
    constructor(x, y, radius, color, fadeSpeed, velocity) {
      this.x = x;
      this.y = y;
      this.color = color;
      this.radius = radius;
      this.velocity = velocity;
      this.alpha = 1 * fadeSpeed;
    }
    draw() {
      ctx.globalAlpha = this.alpha;
      ctx.beginPath()
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false)
      ctx.fillStyle = this.color
      ctx.fill()
      this.x += this.velocity.x
      this.y += this.velocity.y
      this.alpha -= 0.01
      ctx.globalAlpha = 1;
    }
  }

  class
    CounterTerroristWinsParticle {
    constructor(x, y, radius, color, fade) {
      this.x = x;
      this.y = y;
      this.radius = radius;
      this.color = color;
      this.fade = fade;
      this.speed = (Math.random() + 0.1) * 4
    }
    Draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, 2 * Math.PI)
      ctx.fillStyle = this.color
      ctx.fill();
      this.y += this.speed * Math.random();
      this.x += (Math.random() - 0.5) * 20;
    }
  }

  class fallingMoney {
    constructor(x, speed, color) {
      this.speed = speed / 5;
      this.x = x;
      this.y = 0 - (Math.random() * 250);
      this.startVal = (Math.random() * 50);
      this.start = GetTime();
      this.color = color;
    }
    draw() {
      this.elapsed = GetTime() - this.start;
      this.moveVal = (this.elapsed / 1000);
      ctx.fillStyle = this.color;
      ctx.save();
      ctx.translate(this.x + Math.sin(this.startVal + this.moveVal) * 100, this.y);
      ctx.rotate(-Math.sin(this.moveVal + this.startVal) / 5);
      ctx.fillRect(this.x, this.y, 100, 35);
      ctx.restore();
      this.y += this.speed;
    }
  }

  function StateHandler() {
    var stack = [];
    var state = null;

    var updateState = function () {
      if (stack.length > 0) {
        state = stack[stack.length - 1];
      } else {
        state = null;
      }
    }

    this.Push = function (newState) {
      stack.push(newState);
      updateState();
    }

    this.Pop = function () {
      stack.pop();
      updateState();
    }

    this.Process = function () {
      if (state != null) {
        state.Process();
      }
    }
  }



  function Meter(count, callback) {
    this.size = count;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    var values = [];

    this.setValue = function (updatedValue) {
      // Add and shift.  
      values.push(updatedValue);
      if (values.length > this.size) { values.shift(); }

      // Exit early if we've got a long-term match.
      for (var i = 0; i < (values.length - 1); i++) {
        if (values[i] !== values[i + 1]) return;
      }

      // We got here, so we've got a matching value collection.
      if (this.value !== values[0]) {
        //var fromZero = this.value === 0;
        //var toZero = values[0] === 0;      
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        callback();
      }
    }
  }

  let teaInput = false
  let teaTimer = 3000
  let teaStart = 0
  let teaBagCount = 0
  let teaLastPress = Date.now()
  function onCanvasTapped(x, y) {
    if(crouchButton[0] == "none") crouchButton = [x, y]
    else {
      if(crouchButton[0] == x && crouchButton[1] == y){
        if(!teaInput){
          teaInput = true
          teaStart = Date.now()
        }
        if(Date.now() - teaLastPress > 100) teaBagCount++
        teaLastPress = Date.now()
      }
    }
  }

  function checkTeaBag(){
    if(teaInput && TeaToggle){
      if(Date.now() - teaStart < teaTimer && teaBagCount >= 3) {
        effects.push(new teabag())
        teaInput = false
        teaBagCount = 0
      }
      if(Date.now() - teaStart > teaTimer){
        teaInput = false
        teaBagCount = 0
      }
    }
  }

  function DrawLine(start, end, color, stroke){
    ctx.beginPath()
    ctx.moveTo(start[0], start[1])
    ctx.lineTo(end[0], end[1])
    ctx.strokeStyle = color
    ctx.lineWidth = stroke
    ctx.stroke()
  }

  function teabag(){
    this.alpha = 0
    this.half = false
    this.x = 120
    this.y = 50
    this.count = 0
    this.draw = function(){
      if(!this.half) this.alpha < 1 ? this.alpha += .025 : this.count++
      else this.alpha >= .0035 ? this.alpha -= .0035 : this.lifetime = 0
      if(this.count > 100) this.half = true
      ctx.globalAlpha = this.alpha
      DrawRect(0, 0, 320, 200, "black")
      ctx.save()
      ctx.translate(this.x, 120)
      ctx.scale(.6, .6)
      ctx.translate(-this.x, -120)
      DrawCircle(this.x, this.y - 110, 30, "white")
      DrawLine([this.x, this.y - 100], [this.x, this.y + 20], "white", 20)
      ctx.beginPath()
      ctx.moveTo(this.x - (50 + this.y / 2), 60)
      ctx.lineTo(this.x, this.y - 90)
      ctx.lineTo(this.x + (50 + this.y / 2), 60)
      ctx.lineWidth = 20
      ctx.strokeStyle = 20
      ctx.stroke()
      ctx.beginPath()
      ctx.moveTo(this.x, this.y + 20)
      ctx.lineTo(this.x - (30 + this.y / 2), 130)
      ctx.lineTo(this.x - 70, 200)
      ctx.stroke()
      ctx.beginPath()
      ctx.moveTo(this.x, this.y + 20)
      ctx.lineTo(this.x + (30 + this.y / 2), 130)
      ctx.lineTo(this.x + 70, 200)
      ctx.stroke()
      ctx.restore()


      this.y = Math.sin(Date.now() / 100) * 40 + 90

      ctx.globalAlpha = 1
    }
  }

  function hexToHSL(hex) {
      var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  
      var r = parseInt(result[1], 16);
      var g = parseInt(result[2], 16);
      var b = parseInt(result[3], 16);
  
      (r /= 255), (g /= 255), (b /= 255);
      var max = Math.max(r, g, b),
        min = Math.min(r, g, b);
      var h,
        s,
        l = (max + min) / 2;
  
      if (max === min) {
        h = s = 0; // achromatic
      } else {
        var d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r:
            h = (g - b) / d + (g < b ? 6 : 0);
            break;
          case g:
            h = (b - r) / d + 2;
            break;
          case b:
            h = (r - g) / d + 4;
            break;
        }
        h /= 6;
      }
  
      s = s * 100;
      s = Math.round(s);
      l = l * 100;
      l = Math.round(l);
      h = Math.round(360 * h);
  
      return [h, s, l];
    }
