  <body style="margin: 0; padding: 0; background: #000;">
    <canvas id="exCanvas" width="320" height="200"></canvas>
  </body>
  
  <script>
    var canvas, ctx;
    canvas = document.getElementById('exCanvas');
    ctx = canvas.getContext('2d');
    var width = 320;
    var height = 200;
    var effects = [];

    let gInGame = false
    let gStamina = false
    let gEnemy = 0

    let gResourceArr = [0, 0, 0]

    let InGameMeter = new Meter(10, inGameHandler)

    let HealthMeter = new Meter(3, lowResourceHandler)
    let StaminaMeter = new Meter(3, lowResourceHandler)
    let StaminaConfirmMeter = new Meter(5, staminaHandler)

    let Eliminate1Meter = new Meter(10, eliminateHandler)
    let Eliminate2Meter = new Meter(10, eliminateHandler)

    let ReinforceMeter = new Meter(5, reinforceHandler)
    let LowReinforceMeter = new Meter(5, reinforceHandler)

    let KillstreakMeter = new Meter(5, killstreakHandler)

    let CrisisMeter = new Meter(5, crisisHandler)

    let SuccessMeter = new Meter(10, successHandler)

    let MissionYellowMeter = new Meter(10, missionHandler)
    let MissionCyanMeter = new Meter(10, missionHandler)
    let MissionNotYCMeter = new Meter(10, missionHandler)

    let BugWhiteMeter = new Meter(5, enemyHandler)
    let AlienWhiteMeter = new Meter(5, enemyHandler)
    let BotWhiteMeter = new Meter(5, enemyHandler)

    let LoadGreyMeter = new Meter(10, loadHandler)
    let LoadBlackMeter = new Meter(10, loadHandler)

    let TimeRedMeter = new Meter(10, timeHandler)

    let StimRedMeter = new Meter(10, stimHandler)
    let StimWhiteMeter = new Meter(10, stimHandler)
    let StimUnitMeter = new Meter(10, stimHandler)
    
   
    function update() {
      DrawRect(0, 0, 320, 200, "black")
      backgroundHandler()
       
      InGameMeter.setValue(engine.vision.inGameBracketW + engine.vision.inGameBracketR)

      if(gInGame){
        checkStim()
        HealthMeter.setValue(engine.vision.healthWhite + engine.vision.healthRed)
        StaminaMeter.setValue(engine.vision.staminaWhite)
        StaminaConfirmMeter.setValue(engine.vision.staminaConfirm)

        Eliminate1Meter.setValue(engine.vision.eliminatedRed1)
        Eliminate2Meter.setValue(engine.vision.eliminatedRed2)

        ReinforceMeter.setValue(engine.vision.reinforceRed)
        LowReinforceMeter.setValue(engine.vision.lowReinforceRed)

        KillstreakMeter.setValue(engine.vision.killstreakYellow)

        CrisisMeter.setValue(engine.vision.crisisRed)

        BugWhiteMeter.setValue(engine.vision.bugWhite)
        AlienWhiteMeter.setValue(engine.vision.alienWhite)
        BotWhiteMeter.setValue(engine.vision.botWhite)

        MissionYellowMeter.setValue(engine.vision.missionYellow)
        MissionCyanMeter.setValue(engine.vision.missionCyan)
        MissionNotYCMeter.setValue(engine.vision.missionNotYC)

        TimeRedMeter.setValue(engine.vision.timeRed)

        StimRedMeter.setValue(engine.vision.stimRed)
        StimWhiteMeter.setValue(engine.vision.stimWhite)
        StimUnitMeter.setValue(engine.vision.stimUnit)
      } else {
        SuccessMeter.setValue(engine.vision.missionCompleteYellow)

        LoadGreyMeter.setValue(engine.vision.loadGrey)
        LoadBlackMeter.setValue(engine.vision.loadBlack)
      }

      gResourceArr = [HealthMeter.value, StaminaMeter.value]
  
      effects.forEach((ele, i) => {
        ele.draw()
        if(ele.lifetime <= 0){
          effects.splice(i, 1)
        }
      })

      drawHUD()
  
      window.requestAnimationFrame(update);
    };

    let stimGoing = false;
    let lowStimGoing = false;
    let stimInicial = null;
    let stimCurrent = null;

    // Helper function stim value (-1 = null)
    function getStimValue(value) {
        if (StimUnitMeter.value == 4) return 4;
        if (StimUnitMeter.value == 3) return 3;
        if (StimUnitMeter.value == 2) return 2;
        return null;
    }

    function captureStimInicial() { 
      stimInicial = getStimValue(StimUnitMeter.value); 
    }

    function stimHandler() {
        if (stimInicial === null && gInGame && StimWhiteMeter.value >= 0.95 && !lowStimGoing ) {
          captureStimInicial();
        } 

        if (gInGame && StimRedMeter.value >= 0.95 && !lowStimGoing) {
            lowStimGoing = true;
            if (stimOn) effects.push(new stimsLow());
            
        }
    }
    //this function is been call on update, to keep cheking the values and update then
    function checkStim() {
        if (gInGame && stimInicial !== null) {
          let newStimValue = getStimValue(StimUnitMeter.value);

          // Ignore null values
          if (newStimValue !== null) {
            stimCurrent = newStimValue;
          }
        }
        //when value change trig effect and update stimInicial
        if (gInGame && stimInicial !== null && stimCurrent !== null && stimCurrent !== stimInicial && !stimGoing) {
            stimGoing = true;
            if (stimOn) effects.push(new stimUse());
            stimInicial = stimCurrent;
        }
    }
    

    let timeGoing = false
    let lowTimeDelay = Date.now() - 60000
    function timeHandler(){
      if(gInGame && TimeRedMeter.value >= .1 && Date.now() - lowTimeDelay > 60000 && !timeGoing && timeOn){
        timeGoing = true
        lowTimeDelay = Date.now()
        effects.push(new lowTimer())
      }
    }

    let loadingGoing = false
    function loadHandler(){
      if(!gInGame && LoadGreyMeter.value >= .95 && LoadBlackMeter.value >= .95 && !loadingGoing){
        loadingGoing = true
        effects.push(new loadScreen())
      }
    }

    function enemyHandler(){
      
      if(gInGame && BugWhiteMeter.value >= .95 && AlienWhiteMeter.value <= .1 && BotWhiteMeter.value <= .1 && engine.vision.bugNotWhite <= .1){
        //bug
        gEnemy = 2
      }else if(gInGame && AlienWhiteMeter.value >= .95 && BotWhiteMeter.value >= .95 && BugWhiteMeter.value <= .1 && engine.vision.bugNotWhite <= .1){
        //alien
        gEnemy = 3
      }else if(gInGame && BotWhiteMeter.value >= .95 && BugWhiteMeter.value <= .1 && AlienWhiteMeter.value <= .1 && engine.vision.bugNotWhite <= .1){
        //bot
        gEnemy = 1} 
    }

    let lowGoing = false
    function lowResourceHandler(){
      if(gInGame && HealthMeter.value <= .25 && !lowGoing){
        lowGoing = true
        if(lowOn) effects.push(new lowResource(0))
      
      }
      if(gInGame && (StaminaConfirmMeter.value >= .95 && StaminaMeter.value <= .25 && StaminaMeter.value >= .05) && !lowGoing){
        lowGoing = true
        if(lowOn) effects.push(new lowResource(1))
     
      }
    }

    let successGoing = false
    function successHandler(){
      if(!gInGame && SuccessMeter.value >= .95 && !successGoing){
        successGoing = true
        if(missionOn) effects.push(new inGameComplete())
      }
    }

    let areaGoing = false
    function missionHandler(){
      if(gInGame && MissionYellowMeter.value >= .95 && MissionCyanMeter.value >= .95 && MissionNotYCMeter.value <= .1 && !areaGoing){
        areaGoing = true
        if(missionOn) effects.push(new inGameComplete())
      }
    }

    let crisisGoing = false
    function crisisHandler(){
      if(gInGame && CrisisMeter.value >= .6 && !crisisGoing){
        crisisGoing = true
        if(crisisOn) effects.push(new crisis())
        
      }
    }

    let killstreakGoing = false
    function killstreakHandler(){
      if(gInGame && KillstreakMeter.value >= .95 && engine.vision.killstreakNotYellow <= .1 && !killstreakGoing){
        killstreakGoing = true
        if(killOn) effects.push(new killStreak())
        
      }
    }

    let reinforceGoing = false
    let lowReinforceGoing = false
    let lowReinTimer = Date.now() - 120000
    function reinforceHandler(){
      if(gInGame && ReinforceMeter.value >= .95 && engine.vision.reinforceNotRed <= .1 && !reinforceGoing){
        reinforceGoing = true
        if(reinOn) effects.push(new reinforcement())
        
      }
      let delay = Date.now() - lowReinTimer
      if(gInGame && LowReinforceMeter.value >= .95 && !lowReinforceGoing && delay > 120000){
        lowReinforceGoing = true
        lowReinTimer = Date.now()
        if(lowReinOn) effects.push(new lowReinforcements())
        
      }
    }

    let eliminatedGoing = false
    function eliminateHandler(){
      if(gInGame && Eliminate1Meter.value >= .3 && Eliminate2Meter.value >= .3 && engine.vision.eliminatedNotRed <= .1 && !eliminatedGoing){
        eliminatedGoing = true
        if(deathOn){
          if(gEnemy == 0){ 
            effects.push(new eliminated1())
          }
          else if (gEnemy == 1){ 
            effects.push(new eliminatedBot())
          }
          else if (gEnemy == 2) {
            effects.push(new eliminatedBug())
          }
          else if (gEnemy == 3) {
            effects.push(new eliminatedAlien())
          }
        }
      }
    }

    function staminaHandler(){
      if(gInGame && StaminaConfirmMeter.value >= .95 && engine.vision.staminaNotConfirm <= .1) gStamina = true
      else if ((gInGame && StaminaConfirmMeter.value <= .05) || !gInGame) gStamina = false
    }

    function inGameHandler(){
      if(InGameMeter.value >= .95 && engine.vision.inGameBracketNotWR <= .1) gInGame = true
      else if (InGameMeter.value <= .1) gInGame = false
    }
  
    let proBack = [0, 0, 0]
    function onbackColorChanged(){
      proBack = hexToHSL(backColor)
    }

    let backgroundEaseHue = 0;
    let backgroundEaseLit = 0;
    let backgroundEaseSat = 0
    let gCycle = 0
    function backgroundHandler(){
        switch(backgroundMode){
            case "Color Cycle": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Color Cycle Ambience": 
            copyScreen(ambienceAlpha / 100)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Custom": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            break;
            case "Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Custom Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Ambience Audio Visualizer": 
            copyScreenAudio(ambienceAlpha / 100)
            break;
            case "Custom Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
            case "Color Cycle Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
        }
    }

    let audioScreenSat = 0
    let audioScreenLit = 0
    function copyScreenAudio(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      audioScreenSat += (engine.audio.density * 100 - audioScreenSat) / 10
      audioScreenLit += (engine.audio.density * 100 - audioScreenLit) / 10
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        ctx.fillStyle = `hsla(${hue[iZone]}, ${sat[iZone] * (audioScreenSat / 200 + .5)}%, ${lightness[iZone] * (audioScreenLit / 100)}%, ${alpha})`;
        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }
  
    function copyScreen(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        ctx.fillStyle = `hsla(${(backgroundMode == "Custom Ambience" ? proBack[0] : hue[iZone] + gCycle * (backgroundMode == "Color Cycle Ambience"))}, ${sat[iZone]}%, ${lightness[iZone]}%, ${alpha})`;
        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }

    function eliminatedAlien(){
        this.effects = []
        this.go = false
        this.alpha = 0
        this.count = 0
        this.effects.push(new elimRect(160, 100, 40, 60, 0))
        this.effects.push(new elimRect(160, 60, 30, 30, 0))
        this.effects.push(new elimRect(130, 100, 50, 20, -.5))
        this.effects.push(new elimRect(190, 100, 50, 20, .5))
        this.effects.push(new elimRect(175, 140, 50, 20, 1.25))
        this.effects.push(new elimRect(145, 140, 50, 20, -1.25))
        this.draw = function(){
            ctx.globalAlpha = this.alpha
            DrawRect(0, 0, 320, 200, "black")
            this.effects.forEach((ele, i)=>{
                ele.draw(this.go)
                if(ele.lifetime <= 0) this.effects.splice(i, 1)
            })
            if(this.go && Math.random() > .25) this.effects.push(new alienElimHelp())
            ctx.globalAlpha = 1
            if(!this.go) this.alpha <= .95 ? this.alpha += .05 : this.count < 15 ? this.count++ : this.go = true
            else this.alpha >= .003 ? this.alpha -= .003 : this.lifetime = 0
        }
    }

    function alienElimHelp(){
      this.x = 160
      this.y = 0
      this.width = 1
      this.alpha = 1
      this.draw = function(){
        DrawRect(this.x - this.width / 2, this.y, this.width, 200, `hsla(220, 100%, ${100 - this.width / 3.2}%, ${this.alpha})`)
        this.width += 5
        if(this.width > 100) this.alpha > .05 ? this.alpha -= .05 : this.lifetime = 0
      }
    }

    function stimUse(){
      this.draw = function(){
        effects.push(new drawArrow("green", Math.PI, 7, 40))
        setTimeout(()=>{
          effects.push(new drawArrow("hsl(120, 100%, 60%)", Math.PI, 7, 40))
        }, 300)
        setTimeout(()=>{
          effects.push(new drawArrow("hsl(120, 100%, 70%)", Math.PI, 7, 40))
        }, 600)
        this.lifetime = 0
        stimGoing = false
      }
    }

    function stimsLow(){
      this.draw = function(){
        effects.push(new drawArrow("red", 0, 5, 40))
        setTimeout(()=>{
          effects.push(new drawArrow("red", 0, 5, 40))
        }, 500)
        this.lifetime = 0
        setTimeout(()=>{
          lowStimGoing = false
        }, 10000)
      }
    }

    function drawArrow(color, rot, speed, stroke){
      this.y = 0
      this.color = color
      this.rot = rot
      this.speed = speed
      this.stroke = stroke
      this.draw = function(){
        testTranslate([160, 100], [-160, -100], this.rot, 1, 1)
        DrawLine([0, this.y - 100], [160, this.y], this.color, this.stroke)
        DrawLine([160, this.y], [320, this.y - 100], this.color, this.stroke)
        ctx.restore()
        this.y <= 300 ? this.y += this.speed : this.lifetime = 0
      }
    }

    function lowTimer(){
      this.rot = 0
      this.alpha = 0
      this.done = false
      this.draw = function(){
        if(!this.done) this.alpha <= .95 ? this.alpha += .05 : this.done = true
        ctx.globalAlpha = this.alpha
        DrawCircle(160, 100, 20, "red")
        testTranslate([160, 100], [-160, -100], this.rot, 1, 1)
        DrawLine([160, 100], [160, 500], "red", 40)
        ctx.restore()
        ctx.globalAlpha = 1
        this.rot += .05
        this.rot > Math.PI * 6 ? this.alpha >= .01 ? this.alpha -= .01 : this.lifetime = 0 : null
        if(this.lifetime == 0){
          timeGoing = false
        }
      }
    }

    function loadScreen(){
        this.bullet = new bullet(0)
        this.val = 0
        this.count = 0
        this.draw = function(){
            DrawRect(0, 0, 320, 200, `hsl(230, 100%, 1%)`)
            this.bullet.draw(this.val)
            if(!gInGame && LoadBlackMeter.value >= .95 && LoadGreyMeter.value >= .95){
                this.val < 30 ? this.val += (31 - this.val) / 60 : this.count++
            } else this.val < 150 ? this.val += 3 : this.lifetime = 0
            if(this.lifetime == 0) loadingGoing = false
        }
    }

    function eliminatedBug(){
        this.effects = []
        this.go = false
        this.alpha = 0
        this.count = 0
        this.effects.push(new elimRect(160, 100, 40, 60, 0))
        this.effects.push(new elimRect(160, 60, 30, 30, 0))
        this.effects.push(new elimRect(130, 100, 50, 20, -.5))
        this.effects.push(new elimRect(190, 100, 50, 20, .5))
        this.effects.push(new elimRect(175, 140, 50, 20, 1.25))
        this.effects.push(new elimRect(145, 140, 50, 20, -1.25))
        this.draw = function(){
            ctx.globalAlpha = this.alpha
            DrawRect(0, 0, 320, 200, "black")
            this.effects.forEach((ele, i)=>{
                ele.draw(this.go)
                if(ele.lifetime <= 0) this.effects.splice(i, 1)
            })
            if(this.go) this.effects.unshift(new bugElimHelp())
            ctx.globalAlpha = 1
            if(!this.go) this.alpha <= .95 ? this.alpha += .05 : this.count < 15 ? this.count++ : this.go = true
            else this.alpha >= .003 ? this.alpha -= .003 : this.lifetime = 0
            if(this.lifetime == 0) eliminatedGoing = false
        }
    }

    function bugElimHelp(){
      this.x = 330
      this.y = -10
      let endX = 20 - Math.random() * 40 + 160
      let endY = 20 - Math.random() * 40 + 100
      this.stepX = (endX - this.x) / 10
      this.stepY = (endY - this.y) / 10
      this.count = 0
      this.vx = 5 - Math.random() * 10
      this.vy = 5 - Math.random() * 10
      this.hue = Math.random() * 50 + 65
      this.alpha = 1
      this.draw = function(){
        if(this.count < 10){
          this.count++
          this.x += this.stepX
          this.y += this.stepY
        } else {
          this.x += this.vx
          this.y += this.vy
          this.alpha >= .01 ? this.alpha -= .01 : this.lifetime = 0
        }
        DrawCircle(this.x, this.y, 20, `hsla(${this.hue}, 100%, 50%, ${this.alpha})`)
      }
    }

    function eliminatedBot(){
        this.effects = []
        this.go = false
        this.alpha = 0
        this.count = 0
        this.effects.push(new elimRect(160, 100, 40, 60, 0))
        this.effects.push(new elimRect(160, 60, 30, 30, 0))
        this.effects.push(new elimRect(130, 100, 50, 20, -.5))
        this.effects.push(new elimRect(190, 100, 50, 20, .5))
        this.effects.push(new elimRect(175, 140, 50, 20, 1.25))
        this.effects.push(new elimRect(145, 140, 50, 20, -1.25))
        this.draw = function(){
            ctx.globalAlpha = this.alpha
            DrawRect(0, 0, 320, 200, "black")
            this.effects.forEach((ele, i)=>{
                ele.draw(this.go)
                if(ele.lifetime <= 0) this.effects.splice(i, 1)
            })
            if(this.go && Math.random() > .5) this.effects.unshift(new botElimHelp())
            ctx.globalAlpha = 1
            if(!this.go) this.alpha <= .95 ? this.alpha += .05 : this.count < 15 ? this.count++ : this.go = true
            else this.alpha >= .003 ? this.alpha -= .003 : this.lifetime = 0
            if(this.lifetime == 0) eliminatedGoing = false
        }
    }

    function botElimHelp(){
      this.x = Math.random() * 320 - 100
      this.alpha = 1
      this.draw = function(){
        DrawLine([this.x, -10], [this.x + 200, 210], `hsla(0, 100%, ${this.alpha * 100}%, ${this.alpha})`, 50 - (this.alpha * 40))
        this.alpha > .05 ? this.alpha -= .05 : this.lifetime = 0
      }
    }

    function eliminated1(){
        this.effects = []
        this.go = false
        this.alpha = 0
        this.count = 0
        this.effects.push(new elimRect(160, 100, 40, 60, 0))
        this.effects.push(new elimRect(160, 60, 30, 30, 0))
        this.effects.push(new elimRect(130, 100, 50, 20, -.5))
        this.effects.push(new elimRect(190, 100, 50, 20, .5))
        this.effects.push(new elimRect(175, 140, 50, 20, 1.25))
        this.effects.push(new elimRect(145, 140, 50, 20, -1.25))
        this.splat = false
        this.draw = function(){
            ctx.globalAlpha = this.alpha
            DrawRect(0, 0, 320, 200, "black")
            this.effects.forEach((ele, i)=>{
                ele.draw(this.go)
                if(ele.lifetime <= 0) this.effects.splice(i, 1)
            })
            ctx.globalAlpha = 1
            if(this.go && !this.splat){
              for(let i = 0; i < 30; i++) effects.push(new exPart(160, 100, 30, `hsl(${Math.random() * 30}, 100%, 30%)`, 2))
              this.splat = true
            }
            if(!this.go) this.alpha <= .95 ? this.alpha += .05 : this.count < 15 ? this.count++ : this.go = true
            else this.alpha >= .003 ? this.alpha -= .003 : this.lifetime = 0
            if(this.lifetime == 0) eliminatedGoing = false
        }
    }

    function elimRect(x, y, width, height, rot){
        this.x = x
        this.y = y
        this.width = width
        this.height = height
        this.rot = rot
        this.vx = (this.x - 160) / 5
        this.vy = (this.y - 100) / 5
        if(this.x == 160 && this.y == 100){
            this.vx = 2.5 - 5 * Math.random()
            this.vy = 2.5 - 5 * Math.random()
        }
        this.draw = function(go){
            testTranslate([this.x, this.y], [-this.x, -this.y], this.rot, 1, 1)
            DrawRect(this.x - this.width / 2, this.y - this.height / 2, this.width, this.height, "red")
            ctx.restore()
            if(go){
                this.rot+=.25
                if(this.x + this.vx < 320 && this.x + this.vx > 0) this.x += this.vx
                else {
                    this.vx *= -.95
                    this.x += this.vx
                }
                if(this.y + this.vy < 200 && this.y + this.vy > 0) this.y += this.vy
                else {
                    this.vy *= -.95
                    this.y += this.vy
                }
            }
        }
    }

    function exPart(x, y, size, color, speed){
        this.x = x
        this.y = y
        this.vx = 5 - Math.random() * 10
        this.vy = 5 - Math.random() * 10
        this.size = size
        this.color = color
        this.speed = speed
        this.draw = function(){
            DrawCircle(this.x, this.y, this.size, this.color)
            this.x += this.vx * this.speed
            this.y += this.vy * this.speed
            this.size > 2 ? this.size *= .99 : this.lifetime = 0
        }
    }

    function testTranslate(start, end, rot, scaleX, scaleY){
        ctx.save()
        ctx.translate(start[0], start[1])
        ctx.scale(scaleX, scaleY)
        ctx.rotate(rot)
        ctx.translate(end[0], end[1])
    }

    function lowReinforcements(){
        this.x = 320
        this.draw = function(){
            ctx.fillStyle = "red"
            ctx.font = "bolder 110px sans-serif";
            ctx.fillText("S U C K S  TO  S U C K", this.x, 140);
            this.x > - 1500 ? this.x -= 5 : this.lifetime = 0
            if(this.lifetime == 0) lowReinforceGoing = false
        }
    }

    function reinforcement(){
        this.val = 0
        this.alpha = 1
        this.bullet = new bullet(Math.PI / 2)
        this.rad = 1
        this.draw = function(){
            DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, .75)`)
            DrawStroke(160, 0, this.rad, "yellow", 30)
            ctx.globalAlpha = this.alpha
            this.bullet.draw(this.val)
            ctx.globalAlpha = 1
            this.rad < 270 ? this.rad += 10 : this.val < 100 ? this.val ++ : this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
            if(this.lifetime == 0) reinforceGoing = false
        }
    }

    function bullet(rot){
        this.x = 0
        this.y = 100
        this.rot = rot
        this.effects = []
        this.draw = function(val){
            this.effects.push(new bulletHelp(this.x + 40, this.y))
            let grad = ctx.createLinearGradient(this.x, this.y, this.x - 300, this.y)
            grad.addColorStop(0, `hsla(30, 100%, 50%, .3)`)
            grad.addColorStop(1, `hsla(30, 100%, 50%, 0)`)
            testTranslate([160, 100], [-160, -100], this.rot, 1, 1)
            this.x = 600 * val / 100
            drawTrail(this.x + 35, this.y, grad)
            DrawCircle(this.x, this.y, 30, `hsl(0, 100%, 20%)`)
            DrawRect(this.x, this.y - 30, -80, 60, `hsl(0, 100%, 20%)`)
            this.effects.forEach((ele, i)=>{
                ele.draw()
                if(ele.lifetime <= 0) this.effects.splice(i, 1)
            })
            ctx.restore()
        }
    }

    function bulletHelp(x, y){
        this.x = x
        this.y = y + (10 - Math.random() * 20)
        this.vx = -1
        this.gy = Math.random() >= .5 ? -Math.random() * 50 + this.y : Math.random() * 50 + this.y
        this.rad = 10
        this.color = `hsla(${Math.random() * 60}, 100%, ${Math.random() * 25 + 40}%, ${Math.random() * .5 + .25})`
        this.draw = function(){
            DrawCircle(this.x, this.y, this.rad, this.color)
            this.x += this.vx
            this.vx -= .1
            this.y += (this.gy - this.y) / 10
            this.rad > 1 ? this.rad -= .1 : this.lifetime = 0
        }
    }

    function drawTrail(x, y, color){
        ctx.beginPath()
        ctx.arc(x - 50, y, 50, -Math.PI / 2, Math.PI / 2)
        ctx.lineTo(x - 600, y + 100)
        ctx.lineTo(x - 600, y - 100)
        ctx.fillStyle = color
        ctx.fill()
    }

    function lowResource(index){
      this.stop = 0
      this.rad = 1
      this.done = false
      this.index = index
      this.draw = function(){
        let grad = ctx.createRadialGradient(160, 100, 10, 160, 100, 200)
        grad.addColorStop(this.stop, `hsla(0, 100%, 50%, 0)`)
        grad.addColorStop(this.stop + .01, `hsla(0, 100%, 50%, .25)`)
        grad.addColorStop(1, `hsla(0, 100%, 50%, .25)`)
        DrawCircle(160, 100, this.rad, grad)
        this.rad < 200 ? this.rad += 8 : this.stop <= .98 ? this.stop += .02 : this.done = true
        if(this.done){
          this.rad = 1
          this.stop = 0
          this.done = false
        }
        if(gResourceArr[this.index] >= .25 || !gInGame){
          this.lifetime = 0
          lowGoing = false
        }
        if(this.index == 1 && StaminaConfirmMeter.value <= .1){
          this.lifetime = 0
          lowGoing = false
        }
      }
    }

    function killStreak(){

            if(this.count == 0) effects.push(new killStreakHelp(Math.sin(Date.now() / 250) * .3 + .3))

    function crisis(){

    function crisisHelp(){
        this.x = Math.random() * 320
        this.y = 220

    function inGameComplete(){
      this.rad = 1
      this.width = 0
      this.alpha = 1
      this.draw = function(){

        DrawCircle(160, 100, this.rad, "orange")

        DrawRect(210, 112, this.width * .6, 20, "orange")
        DrawRect(110, 60, -this.width, 20, "orange")
        DrawRect(110, 86, -this.width * .8, 20, "orange")
        DrawRect(110, 112, -this.width * .6, 20, "orange")
        ctx.globalAlpha = 1
        this.rad < 40 ? this.rad += 2 : this.width < 100 ? this.width += 3 : this.alpha >= .01 ? this.alpha -= .01 : this.lifetime = 0
        if(this.lifetime == 0){
          successGoing = false
          objectiveGoing = false
          areaGoing = false
        }
      }
    }

    let designatedHealthSize = 0
    let designatedStaminaSize = 0
    let currentHealthSize = 0
    let currentStaminaSize = 0
    function drawHUD() {
      let hpColor = hexToHSL(healthColor)
      let stColor = hexToHSL(staminaColor)
      designatedHealthSize = gInGame? HealthMeter.value : 0;
      designatedStaminaSize = gInGame? gStamina? StaminaMeter.value : 0 : 0;
      currentHealthSize = lerp(currentHealthSize, designatedHealthSize, 0.05);
      currentStaminaSize = lerp(currentStaminaSize, designatedStaminaSize, 0.05);
      let healthString = `hsl(${hpColor[0]}, ${hpColor[1]}%, ${hpColor[2]}%)`
      let staminaString = `hsl(${stColor[0]}, ${stColor[1]}%, ${stColor[2]}%)`
      if (healthHUDOn){
        if(blackToggle) DrawRect(healthX * 3.2, healthY * 2, healthWidth * 3.2, healthHeight * 2, "black");
        DrawRect(healthX * 3.2, healthY * 2, adjToggle ? healthWidth * 3.2 : currentHealthSize * healthWidth * 3.2, healthHeight * 2, healthString);
      }
      if (staminaHUDOn){
        if(blackToggle) DrawRect(staminaX * 3.2, staminaY * 2, staminaWidth * 3.2, staminaHeight * 2, "black");
        DrawRect(staminaX * 3.2, staminaY * 2, adjToggle ? staminaWidth * 3.2 : currentStaminaSize * staminaWidth * 3.2, staminaHeight * 2, staminaString);
      }
    }

  function lerp(a, b, speed) {
    return a + speed * (b - a)
  }
  
    function DrawArc(x, y, start, end, radius, direction, color){
      ctx.beginPath()
      ctx.arc(x, y, radius, start, end, direction)
      ctx.fillStyle = color
      ctx.fill()
    }
  
    function DrawLine(start, end, color, stroke){
      ctx.beginPath()
      ctx.moveTo(start[0], start[1])
      ctx.lineTo(end[0], end[1])
      ctx.strokeStyle = color
      ctx.lineWidth = stroke
      ctx.stroke()
    }
  
    function DrawEllipse(x, y, width, height, rotation, color){
      ctx.beginPath()
      ctx.ellipse(x, y, width, height, rotation, 0, Math.PI * 2)
      ctx.fillStyle = color
      ctx.fill()
    }
  
    function DrawCircle(x, y, radius, color) {
      ctx.beginPath();
      ctx.fillStyle = color;
      ctx.arc(x, y, radius, 0, 2 * Math.PI)
      ctx.fill();
    };
  
    function DrawStroke(x, y, radius, color, stroke) {
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = stroke;
      ctx.arc(x, y, radius, 0, 2 * Math.PI)
      ctx.stroke();
    };
  
    function DrawRect(x, y, width, height, color) {
      ctx.beginPath();
      ctx.fillStyle = color;
      ctx.fillRect(x, y, width, height);
    };
  
    function hexToHSL(hex) {
      var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  
      var r = parseInt(result[1], 16);
      var g = parseInt(result[2], 16);
      var b = parseInt(result[3], 16);
  
      (r /= 255), (g /= 255), (b /= 255);
      var max = Math.max(r, g, b),
        min = Math.min(r, g, b);
      var h,
        s,
        l = (max + min) / 2;
  
      if (max === min) {
        h = s = 0; // achromatic
      } else {
        var d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r:
            h = (g - b) / d + (g < b ? 6 : 0);
            break;
          case g:
            h = (b - r) / d + 2;
            break;
          case b:
            h = (r - g) / d + 4;
            break;
        }
        h /= 6;
      }
  
      s = s * 100;
      s = Math.round(s);
      l = l * 100;
      l = Math.round(l);
      h = Math.round(360 * h);
  
      return [h, s, l];
    }
  
    function Meter(size, callback) {
      this.size = size;
      this.value = 0;
      this.diff = 0;
      this.increased = false;
      this.decreased = false;
      var values = [];
  
      this.setValue = function (updatedValue) {
        values.push(updatedValue);
        if (values.length > this.size) {
          values.shift();
        }
  
        for (var i = 0; i < values.length - 1; i++) {
          if (values[i] !== values[i + 1]) return;
        }
        if (this.value !== values[0]) {
          this.diff = Math.abs(this.value - values[0]);
          this.increased = this.value < values[0];
          this.decreased = this.value > values[0];
          this.value = values[0];
          callback();
        }
      }
    }
  
    window.requestAnimationFrame(update);
