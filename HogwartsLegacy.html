  var KeyWhiteMeter = new Meter(10, layoutCallback)

  var Ability1HueMeter = new Meter(10, spell1Callback)
  var Ability2HueMeter = new Meter(10, spell2Callback)
  var Ability3HueMeter = new Meter(10, spell3Callback)
  var Ability4HueMeter = new Meter(10, spell4Callback)

  var Ability2LightMeter = new Meter(1, ()=>"")
  var Ability3LightMeter = new Meter(1, ()=>"")
  var Ability4LightMeter = new Meter(1, ()=>"")

  var Black1Meter = new Meter(4, spell1Callback)
  var Black2Meter = new Meter(4, spell2Callback)
  var Black3Meter = new Meter(4, spell3Callback)
  var Black4Meter = new Meter(4, spell4Callback)

  var Magic1Meter = new Meter(15, ancientMagicCallback)
  var Magic2Meter = new Meter(15, ancientMagicCallback)

  var HPMeter = new Meter(5, ()=>{})

  var LoadGreyMeter = new Meter(8, inGameCallback)

  var MerchantMeter = new Meter(8, inGameCallback)

  var DeathMeter = new Meter(8, inGameCallback)

  function update() {

    DrawRect(0, 0, 320, 200, "black")
    copyScreen(1)

    InGameMeter.setValue(engine.vision.inGamePurple)

    if(playerInGame){
        ContBlackMeter.setValue(engine.vision.contCheckBlack)
        ContWhiteMeter.setValue(engine.vision.contCheckWhite)
        KeyBlackMeter.setValue(engine.vision.keyCheckBlack)
        KeyWhiteMeter.setValue(engine.vision.keyCheckWhite)

        if(controllerLayout == 1){
          Ability1HueMeter.setValue(engine.vision.contSpellTop[0])
          Ability2HueMeter.setValue(engine.vision.contSpellRight[0])
          Ability3HueMeter.setValue(engine.vision.contSpellBot[0])
          Ability4HueMeter.setValue(engine.vision.contSpellLeft[0])

          Black1Meter.setValue(engine.vision.topBlack)
          Black2Meter.setValue(engine.vision.rightBlack)
          Black3Meter.setValue(engine.vision.botBlack)
          Black4Meter.setValue(engine.vision.leftBlack)

          Ability1LightMeter.setValue(engine.vision.contSpellTop[2])
          Ability2LightMeter.setValue(engine.vision.contSpellRight[2])
          Ability3LightMeter.setValue(engine.vision.contSpellBot[2])
          Ability4LightMeter.setValue(engine.vision.contSpellLeft[2])

          Magic1Meter.setValue(engine.vision.contMagic1)
          Magic2Meter.setValue(engine.vision.contMagic2)
          HPMeter.setValue(engine.vision.contHP)
        } else if(controllerLayout == 2){
          Ability1HueMeter.setValue(engine.vision.keySpell1[0])
          Ability2HueMeter.setValue(engine.vision.keySpell2[0])
          Ability3HueMeter.setValue(engine.vision.keySpell3[0])
          Ability4HueMeter.setValue(engine.vision.keySpell4[0])

          Black1Meter.setValue(engine.vision.keySpell1Black)
          Black2Meter.setValue(engine.vision.keySpell2Black)
          Black3Meter.setValue(engine.vision.keySpell3Black)
          Black4Meter.setValue(engine.vision.keySpell4Black)

          Ability1LightMeter.setValue(engine.vision.keySpell1[2])
          Ability2LightMeter.setValue(engine.vision.keySpell2[2])
          Ability3LightMeter.setValue(engine.vision.keySpell3[2])
          Ability4LightMeter.setValue(engine.vision.keySpell4[2])

          Magic1Meter.setValue(engine.vision.keyMagic1)
          Magic2Meter.setValue(engine.vision.keyMagic2)
          HPMeter.setValue(engine.vision.keyHP)
        }
    } else {
        LoadGreyMeter.setValue(engine.vision.loadingGrey)
        MerchantMeter.setValue(engine.vision.merchantGold)
        DeathMeter.setValue(engine.vision.deathGold)
    }
    
    ctx.globalAlpha = effectBrightness / 100
      hudElements.forEach((ele, i)=>{
        ele.draw()
        if(ele.lifetime <= 0) hudElements.splice(i, 1)
      })

      effects.forEach((ele, i)=>{
        ele.draw()
        if(ele.lifetime <= 0) effects.splice(i, 1)
      })
      ctx.globalAlpha = 1;

      if (adjustHUD) {
          if(healthOn) DrawRect(hpX * 3.2, hpY * 2, hpWidth * 3.2, hpHeight * 2, "green")
      }

      if (hudElements.length < 1) {
          if(healthOn) hudElements.push(new genHUD(hpX * 3.2, hpY * 2, "hp"))
      }

    window.requestAnimationFrame(update);
  };

  function genHUD(x, y, type) {
  this.x = x;
  this.y = y;
  this.width = 0;
  this.height = 0;
  this.color = "black"
  this.type = type;
  this.lifetime = 10;
  this.draw = function () {
      this.x = hpX * 3.2
      this.y = hpY * 2
      this.width = hpWidth * 3.2 * HPMeter.value
      this.height = hpHeight * 2
      this.color = "green"
    if (playerInGame) DrawRect(this.x, this.y, this.width, this.height, this.color)
  }
}

  var magic1 = false;
  var magic2 = false;
  function ancientMagicCallback(){
      if(Magic1Meter.value < .25 && Magic1Meter.decreased && Magic1Meter.diff > .5 && magic1 && ancientOn && HPMeter.value > 0){
          effects.push(new ancientMagic())
          magic1 = false
      } else if (Magic1Meter.value == 1 && !magic1){
          magic1 = true
      }
      if(Magic2Meter.value < .25 && Magic2Meter.decreased && Magic2Meter.diff > .5 && magic2 && ancientOn && HPMeter.value > 0){
          effects.push(new ancientMagic())
          magic2 = false
      } else if (Magic2Meter.value == 1 && !magic2){
          magic2 = true
      }
  }

  var spell1 = false;
  var spell2 = false;
  var spell3 = false;
  var spell4 = false;
  function spell1Callback(){
      if(Black1Meter.value > .3 && Black1Meter.diff > .3 && Black1Meter.increased && !spell1 && engine.vision.inGamePurple > .75 && Ability1LightMeter.value < 8){
          spell1 = true;
          if(spell1On) effects.push(new spellBox(Ability1HueMeter.value))
      } else if(Black1Meter.value < .1 && Black1Meter.decreased && spell1 && engine.vision.inGamePurple > .75 && Ability1LightMeter.value > 6){
          spell1 = false;
      }
  }

  function spell2Callback(){
      if(Black2Meter.value > .3 && Black2Meter.diff > .3 && Black2Meter.increased && !spell2 && engine.vision.inGamePurple > .75 && Ability2LightMeter.value < 8){
          spell2 = true;
          if(spell2On) effects.push(new spellBox(Ability2HueMeter.value))
      } else if(Black2Meter.value < .1 && Black2Meter.decreased && spell2 && engine.vision.inGamePurple > .75 && Ability2LightMeter.value > 6){
          spell2 = false;
      }
  }

  function spell3Callback(){
      if(Black3Meter.value > .3 && Black3Meter.diff > .2 && Black3Meter.increased && !spell3 && engine.vision.inGamePurple > .75 && Ability3LightMeter.value < 8){
          spell3 = true;
          if(spell3On) effects.push(new spellBox(Ability3HueMeter.value))
      } else if(Black3Meter.value < .1 && Black3Meter.decreased && spell3 && engine.vision.inGamePurple > .75 && Ability3LightMeter.value > 6){
          spell3 = false;
      }
  }

  function spell4Callback(){
      if(Black4Meter.value > .3 && Black4Meter.diff > .3 && Black4Meter.increased && !spell4 && engine.vision.inGamePurple > .75 && Ability4LightMeter.value < 8){
          spell4 = true;
          if(spell4On) effects.push(new spellBox(Ability4HueMeter.value))
      } else if(Black4Meter.value < .1 && Black4Meter.decreased && spell4 && engine.vision.inGamePurple > .75 && Ability4LightMeter.value > 6 ){
          spell4 = false;
      }
  }

  function layoutCallback(){
      if(ContBlackMeter.value == 1  && KeyWhiteMeter.value != 1){
          controllerLayout = 1;
      } 
      else if(KeyBlackMeter.value == 1 && KeyWhiteMeter.value == 1 && ContWhiteMeter.value != 1){
          controllerLayout = 2;
      } else  controllerLayout = 0;
  }

  var merchantGo = false;
  var genericGo = false;
  var loadingGo = false;
  var deathGo = false;
  function inGameCallback(){
      if(InGameMeter.value == 1){
          playerInGame = true;
          loadingGo = false
          genericGo = false;
          merchantGo = false;
          deathGo = false;
      } 
      else if(InGameMeter.value == 0) {
          playerInGame = false;
          if(LoadGreyMeter.value == 1 && !loadingGo && loadOn) {
              effects.push(new loadMenu())
              loadingGo = true
          } else if(MerchantMeter.value > .75 && !merchantGo && merchantOn) {
              effects.push(new merchantMenu())
              merchantGo = true
          }  else if(DeathMeter.value == 1 && !deathGo && deathOn){
              effects.push(death())
              deathGo = true
          } else if(!genericGo && genericOn){
              effects.push(new genericMenu())
              genericGo = true
          }
      }
  }

  function death(){
  this.effects = []
  this.alpha = 1;
  this.lifetime = 10;
  this.backAlpha = 0;
  for(let i = 0; i < 3; i++){
    this.effects.push(new deathSquiggle())
  }
  this.draw = function(){
      ctx.globalAlpha = this.alpha
    this.backAlpha < .95 ? this.backAlpha += .05 : this.backAlpha = 1;
    DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${this.backAlpha})`)
    this.effects.forEach((ele, i)=>{
      ele.draw()
      this.alpha = 1 - ele.width / 100
      if(ele.lifetime <= 0) this.effects.splice(i, 1)
    })
    ctx.globalAlpha = 1
    if(this.alpha <= 0){
      this.lifetime = 0;
      deathGo = false
    } 
  }
}

function deathSquiggle(){
  this.x = 160
  this.y = 100
  this.hue = 60
  this.points = []
  this.mod = 1;
  this.width = 1;
  this.start = Date.now()
  this.draw = function(){
    let elapsed = Date.now() - this.start
    if(elapsed > 100){
      this.start = Date.now()
      this.x+=((20 * this.mod) - Math.random() * (40 * this.mod))
      this.y+=((20 * this.mod) - Math.random() * (40 * this.mod))
      this.points.push([this.x, this.y])
    }
    ctx.moveTo(160, 100)
    if(this.points.length > 0){
      this.points.forEach((ele)=>{
        ctx.lineTo(ele[0], ele[1])
      })
    }
    ctx.strokeStyle = `hsl(${this.hue}, 100%, 50%)`
    this.hue > 0 ? this.hue-=.5 : this.hue = 0;
    ctx.lineWidth = this.width;
    this.width < 120 ? this.width+=.3 : this.lifetime = 0;
    this.mod < 3 ? this.mod+=.01 : this.mod = 3;
    ctx.stroke()
  }
}

function lightning(size, color, width){
    this.points = [];
    this.color = color
    this.width = width
    while(this.points.length <= size){
      this.points.push([this.points.length * (350 / size) - 25, 100])
    }
    this.draw = function(){
      drawLightning(this.points, this.color, this.width)
      this.points.forEach((ele, i)=>{
        var mod = Math.sin(Date.now() / (100000 * Math.random()))
        switch(i){
          case 0:
            this.points[i][1] < 90 ? this.points[i][1]+=2 : 
              this.points[i][1] > 110 ? this.points[i][1]-=2 : 
                this.points[i][1] += mod * 10;
            break;
          case this.points.length - 1:
            this.points[i - 1][1] - this.points[i][1] < -30 ? this.points[i][1]-=5 : 
                this.points[i - 1][1] - this.points[i][1] > 30 ? this.points[i][1]+=5 : 
                    this.points[i][1] += mod * 10;
            break;
          default:
            this.points[i - 1][1] - this.points[i][1] < -30 ? this.points[i][1]-=5 : 
              this.points[i - 1][1] - this.points[i][1] > 30 ? this.points[i][1]+=5 : 
                  this.points[i][1] += mod * 10;
            this.points[i][0] < i * (320 / this.points.length) ? this.points[i][0]+=5 : 
              this.points[i][0] > i * (320 / this.points.length) + (320 / this.points.length) ? this.points[i][0]-=5 : 
                  this.points[i][0] += mod * 10;
            break;
        }
      })
    }
  }

  function drawLightning(array, color, width){
      ctx.beginPath()
      ctx.moveTo(...array[0])
      array.forEach((ele, i)=>{
        if(i){
          ctx.lineTo(...array[i])
        }
      });
      ctx.strokeStyle = color;
      ctx.lineJoin = "round";
      ctx.lineWidth = width + Math.random() * width;
      ctx.stroke()
  }

function ancientMagic(){
  this.lit = new lightning(10, "cyan", 25)
  this.lit2 = new lightning(10, "cyan", 25)
  this.lit3 = new lightning(10, "cyan", 25)
  this.alpha = 1;
  this.radius = 1;
  this.backAlpha = 0;
  this.count = 0;
  this.draw = function(){
    ctx.globalAlpha = this.alpha
    this.backAlpha < .97 ? this.backAlpha += .03 : this.backAlpha = 1;
    DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${this.backAlpha})`)
    DrawStroke(160, 100, this.radius, "grey", this.radius / 2)
    this.radius+=4
    this.lit.draw()
    ctx.save()
    ctx.translate(160, 100)
    ctx.rotate(Math.PI / 4)
    ctx.translate(-160, -100)
    this.lit2.draw()
    ctx.translate(160, 100)
    ctx.rotate(3 * Math.PI / 2)
    ctx.translate(-160, -100)
    this.lit3.draw()
    ctx.restore()
    this.lit.color = `hsla(${this.count}, 100%, 50%, ${this.backAlpha})`
    this.lit2.color = `hsla(${this.count + 30}, 100%, 50%, ${this.backAlpha})`
    this.lit3.color = `hsla(${this.count + 60}, 100%, 50%, ${this.backAlpha})`
    this.count < 360 ? this.count+=2.5 : this.lifetime = 0;
    this.alpha = 1 - this.count / 360
    ctx.globalAlpha = 1
  }
}

  function merchantMenu(){
  this.lifetime = 10;
  this.backAlpha = 1
  this.alpha = 0;
  this.start = Date.now()
  this.effects = []
  this.draw = function(){
    ctx.globalAlpha = this.backAlpha
    DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${this.alpha})`)
    this.alpha < .65 ? this.alpha+=.05 : this.alpha = .65;
    let elapsed = Date.now() - this.start
    if(elapsed > 400){
      this.start = Date.now()
      this.effects.push(new merchantCoin())
    }
    this.effects.forEach((ele, i)=>{
      ele.draw()
      if(ele.lifetime <= 0) this.effects.splice(i, 1)
    })
    ctx.globalAlpha = 1
    if(playerInGame || LoadGreyMeter.value == 1 || InGameMeter.value == 1 || MerchantMeter.value == 0) this.backAlpha > .05 ? this.backAlpha -= .05 : this.lifetime = 0;
    if(!this.lifetime) merchantGo = false
  }
}

function merchantCoin(){
  this.x = Math.random() * 320
  this.y = -30;
  this.rotate = Math.random() * 5;
  this.mod = Math.random()
  this.mod2 = Math.random() * 1000
  this.draw = function(){
    if(this.mod > .5){
      ctx.beginPath()
      ctx.ellipse(this.x, this.y, 30, Math.sin((Date.now() - this.mod2) / 250) * 14 + 16, 0, 0, Math.PI * 2)
      ctx.fillStyle = "gold"
      ctx.fill()
    } else {
      ctx.save()
      ctx.translate(this.x, this.y)
      ctx.rotate(this.rotate)
      ctx.translate(-this.x, -this.y)
      DrawRect(this.x - 30, this.y - 5, 60, 10, "gold")
      ctx.restore()
    }
    this.rotate+=.05
    this.y < 250 ? this.y++ : this.lifetime = 0;
  }
}

  function loadMenu(){
  this.lifetime = 10;
  this.paths = [[125, 50, load1, 60], [110, 60, load2, 220], [120, 60, load3, 0], [130, 55, load4, 120]]
  this.index = 0;
  this.alpha = 1;
  this.backAlpha = 1;
  this.go = false;
  this.scale = 1;
  this.draw = function(){
      ctx.globalAlpha = this.backAlpha
    DrawRect(0, 0, 320, 200, `hsla(190, 50%, 50%, ${this.alpha})`)
    this.scale = Math.sin(Date.now() / 1000) * .5 + 1
    this.alpha = this.scale / 3
    if(this.scale < .6 && !this.go){
      this.index < 3 ? this.index++ : this.index = 0;
      this.go = true;
      for(let i = 0; i < 10; i++){
        effects.push(new splashHelp(160, 100, 190, 10, true, 20, true))
      }
    } else if (this.scale > .6) this.go = false;
    ctx.save()
    ctx.translate(160, 100)
    ctx.scale(this.scale, this.scale)
    ctx.translate(-160, -100)
    DrawPath(this.paths[this.index][0], this.paths[this.index][1], .5, this.paths[this.index][2], `hsl(${this.paths[this.index][3]}, 100%, ${100 - this.scale / 1.5 * 50}%)`)
    ctx.restore()
    ctx.globalAlpha = 1
    if(playerInGame || InGameMeter.value == 1 || LoadGreyMeter.value < 1 || MerchantMeter.value > .75) this.backAlpha > .05 ? this.backAlpha-=.05 : this.lifetime = 0;
    if(!this.lifetime) loadingGo = false
  }
}

  function genericMenu(){
  this.effects = []
  this.alpha = 0;
  this.start = Date.now()
  this.lifetime = 10;
  this.draw = function(){
      if(playerInGame || LoadGreyMeter.value == 1 || MerchantMeter.value > .75 || DeathMeter.value == 1) this.alpha > .05 ? this.alpha-=.05 : this.lifetime = 0;
      else this.alpha < .999 ? this.alpha += .001 : this.alpha = 1;
    
    ctx.globalAlpha = this.alpha
    this.scale = Math.sin(Date.now() / 700) * .1 + .9
    let elapsed = Date.now() - this.start
    if(elapsed > 1000){
      this.start = Date.now()
      this.effects.push(new menuRing())
      for(let i = 0; i < 10; i++){
        this.effects.push(new menuParticle())
      }
    }

    this.effects.forEach((ele, i)=>{
      ele.draw()
      if(ele.lifetime <= 0) this.effects.splice(i, 1)
    })

    ctx.save()
    ctx.translate(160, 100)
    ctx.scale(this.scale, this.scale)
    ctx.translate(-160, -100)
    DrawPath(120, 5, .5, ancientPath, `hsl(50, 100%, ${this.scale / 1.1 * 90}%)`)
    ctx.restore()
    ctx.globalALpha = 1;
    if(!this.lifetime) genericGo = false
  }
}

function menuRing(){
  this.radius = 1;
  this.lifetime = 10;
  this.alpha = 0;
  this.draw = function(){
    DrawCircle(160, 100, this.radius, `hsla(${220}, 70%, 20%, .3)`)
    this.radius < 300 ? this.radius++ : this.lifetime = 0;
  }
}

function menuParticle(){
  this.x = Math.random() * 320
  this.y = 210
  this.vy = Math.random() + 1
  this.vx = 1 - Math.random() * 2
  this.radius = Math.random() * 10
  this.lifetime = 10;
  this.draw = function(){
    DrawCircle(this.x, this.y, this.radius, "hsla(40, 80%, 50%, .3)")
    this.x+=this.vx
    this.y-=this.vy
    if(this.x < 0 || this.x > 320 || this.y < 0) this.lifetime = 0;
  }
}

  function spellBox(hue){
      this.lifetime = 150;
      this.hue = hue
      this.anim = Math.floor(Math.random() * 2.999)
      this.effects = []
      this.go = false;
      this.backAlpha = 0;
      this.draw = () => {
        ctx.globalAlpha = this.lifetime / 150
        this.backAlpha <= .95 ? this.backAlpha += .05 : this.backAlpha = 1;
        DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${this.backAlpha})`)
        if(!this.go){
          this.go = true
          if(this.anim == 0){
            for(let i = 0; i < 10; i++){
              this.effects.push(new ringHelp(this.hue, 200 - 20 * i + 1, 20, i))
            }
          } else if(this.anim == 1){
              for(let i = 0; i < 20; i++){
                  this.effects.push(new splashHelp(160, 100, this.hue, 20, true, 50))
              }
          } else if(this.anim == 2){
              this.effects.push(new spiralHelp(this.hue))
          }
        }
        this.effects.forEach((ele, i)=>{
          ele.draw()
          if(ele.lifetime <= 0) this.effects.splice(i, 1)
        })
        this.lifetime--
        if(controllerLayout == 0) this.lifetime = 0
      }
  }

function ringHelp(hue, radius, stroke, offset){
  this.hue = hue;
  this.radius = radius;
  this.stroke = stroke
  this.offset = offset
  this.draw = () => {
    this.alpha = Math.sin(Date.now() / 250 - 100 * this.offset) * .25 + .5
    DrawStroke(160, 100, this.radius, `hsla(${this.hue}, 100%, 50%, ${this.alpha})`, this.stroke)
  }
}

function splashHelp(x, y, hue, radius, scatter, lifetime, lit){
  this.x = x;
  this.y = y;
  this.vx = 2.5 - Math.random() * 5
  this.vy = 2.5 - Math.random() * 5
  this.radius = radius;
  this.hue = hue;
  this.lit = lit
  this.scatter = scatter;
  this.alpha = 1;
  this.lifetime = lifetime;
  this.draw = function(){
    DrawCircle(this.x, this.y, this.radius, `hsla(${this.hue}, ${this.lit? 50 : 100}%, ${this.lit? 90 : 50}%, ${this.alpha})`)
    this.x+=this.vx;
    this.y+=this.vy;
    this.lifetime--;
    if(this.scatter){
      if(this.lifetime <= 0){
        for(let i = 0; i < 10; i++){
          effects.push(new splashHelp(this.x, this.y, this.hue, this.radius / 2, false, 90, this.lit))
        }
      }
    }
  }
}

function spiralHelp(hue){
  this.x = 160;
  this.y = 100;
  this.hue = hue;
  this.radius = 1;
  this.lifetime = 10;
  this.rotate = 0;
  this.draw = function(){
    let tempX = Math.cos(this.rotate) * this.radius + 160
    let tempY = Math.sin(this.rotate) * this.radius + 100
    let tempX2 = Math.cos(this.rotate) * -this.radius + 160
    let tempY2 = Math.sin(this.rotate) * -this.radius + 100
    effects.push(new spiralBall(tempX, tempY, this.hue))
    effects.push(new spiralBall(tempX2, tempY2, this.hue))
    this.radius < 200 ? this.radius += 3 : this.lifetime = 0;
    this.rotate+=.2
  }
}

function spiralBall(x, y, hue){
  this.x = x;
  this.y = y;
  this.radius = 10
  this.hue = hue;
  this.lifetime = 75;
  this.draw = function(){
    DrawCircle(this.x, this.y, this.radius, `hsla(${this.hue}, 100%, 50%, ${this.lifetime / 75})`)
    this.lifetime--;
    this.radius+=.5
  }
}

  function DrawPath(x, y, scale, path, color) {
    ctx.fillStyle = color;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale)
    let ex = new Path2D(path);
    ctx.fill(ex);
    ctx.restore();
  };

  function StrokePath(x, y, scale, stroke, path, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = stroke;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale)
    let ex = new Path2D(path);
    ctx.stroke(ex);
    ctx.restore();
  };

  function DrawTriangle(cord1X, cord1Y, cord2X, cord2Y, cord3X, cord3Y, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.moveTo(cord1X, cord1Y);
    ctx.lineTo(cord2X, cord2Y);
    ctx.lineTo(cord3X, cord3Y);
    ctx.lineTo(cord1X, cord1Y);
    ctx.fill();
  };

  function DrawCircle(x, y, radius, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.fill();
  };

  function DrawStroke(x, y, radius, color, stroke) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = stroke;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.stroke();
  };

  function DrawRect(x, y, width, height, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
  };

  function DrawHex(x, y, color, size) {
    ctx.beginPath();
    for (var i = 0; i < 7; i++) {
      ctx.lineTo(x + size * Math.cos(2 * Math.PI / 6 * i), y + size * 0.9 * Math.sin(2 * Math.PI / 6 * i));
    }
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = "black"
    ctx.stroke()
  };

  function hexToRgb(hex) {
    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
      r: parseInt(result[1], 16),
      g: parseInt(result[2], 16),
      b: parseInt(result[3], 16)
    } : null;
  }

  function hexToHSL(H) {
  // Convert hex to RGB first
  let r = 0, g = 0, b = 0;
  if (H.length == 4) {
    r = "0x" + H[1] + H[1];
    g = "0x" + H[2] + H[2];
    b = "0x" + H[3] + H[3];
  } else if (H.length == 7) {
    r = "0x" + H[1] + H[2];
    g = "0x" + H[3] + H[4];
    b = "0x" + H[5] + H[6];
  }
  // Then to HSL
  r /= 255;
  g /= 255;
  b /= 255;
  let cmin = Math.min(r,g,b),
      cmax = Math.max(r,g,b),
      delta = cmax - cmin,
      h = 0,
      s = 0,
      l = 0;

  if (delta == 0)
    h = 0;
  else if (cmax == r)
    h = ((g - b) / delta) % 6;
  else if (cmax == g)
    h = (b - r) / delta + 2;
  else
    h = (r - g) / delta + 4;

  h = Math.round(h * 60);

  if (h < 0)
    h += 360;

  l = (cmax + cmin) / 2;
  s = delta == 0 ? 0 : delta / (1 - Math.abs(2 * l - 1));
  s = +(s * 100).toFixed(1);
  l = +(l * 100).toFixed(1);

  return [h, s, l];
}

  function copyScreen(alpha) {
    var shine = engine.vision.ShineMeter
    let lightness = new Int8Array(engine.zone.lightness);
    let sat = new Int8Array(engine.zone.saturation);
    let hue = new Int16Array(engine.zone.hue);
    for (var iZone = 0; iZone < 560; iZone++) {
      var iRow = Math.floor(iZone / 28);
      var iCol = iZone % 28;
      var iWidth = 320 / 28;
      var iHeight = 200 / 20;
      var iZx = iCol * iWidth;
      var iZy = iRow * iHeight;
      ctx.fillStyle =
        "hsla(" +
        hue[iZone] +
        "," +
        sat[iZone] +
        "%," +
        lightness[iZone] * keyScreenBrightness / 100 +
        "%, " +
        `${alpha}` +
        ")";

      ctx.fillRect(iZx, iZy, iWidth, iHeight);
    }

  }

  function Meter(size, callback) {
    this.size = size;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    var values = [];

    this.setValue = function (updatedValue) {
      values.push(updatedValue);
      if (values.length > this.size) {
        values.shift();
      }

      for (var i = 0; i < values.length - 1; i++) {
        if (values[i] !== values[i + 1]) return;
      }
      if (this.value !== values[0]) {
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        callback();
      }
    }
  }

  window.requestAnimationFrame(update);
</script>
