<body style="margin: 0; padding: 0; background: #000;">
  <canvas id="exCanvas" width="320" height="200"></canvas>
</body>

<script>
  // #region Setup
  const canvas      = document.getElementById('exCanvas')
  const ctx         = canvas.getContext('2d')
  const hiddenCanvas = document.createElement('canvas')
  hiddenCanvas.width  = 320
  hiddenCanvas.height = 200
  const hiddenCtx = hiddenCanvas.getContext('2d')

  let effects     = []
  let gInGame     = false
  let cloudTimer  = 0
  let xpAnim      = false
  let cloudDiff   = 0
  let healthPrev  = 0
  let shieldPrev  = 0

  // ── In-Game ──
  const inGame1Meter = new Meter(5, onGameChanged)
  const inGame2Meter = new Meter(5, onGameChanged)

  // ── Health & Shield ──
  const healthM       = new Meter(25, healthHelper)
  const healthDamageM = new Meter(3,  healthHelper)
  const shieldsM      = new Meter(20, shieldHelper)
  const shields2M     = new Meter(20, shieldHelper)

  // ── XP ──
  const xpM1 = new Meter(25, xpHelper)
  const xpM2 = new Meter(25, xpHelper)

  // ── Storm ──
  const cloudCloseM = new Meter(3, cloudHelper)

  // ── Vehicle ──
  const vehicleWhiteMeter = new Meter(5, () => '')
  const vehicleRedMeter   = new Meter(5, () => '')

  // ── Battlebus ──
  const BattleBusMeter       = new Meter(10, battlebusHelper)
  const BattleBusConfirmMeter = new Meter(10, battlebusHelper)

  // ── Sprint ──
  const SprintMeter = new Meter(5, sprintHelper)

  // ── Kill ──
  const KillMeter      = new Meter(5, killHelper)
  const KillWhiteMeter = new Meter(5, killHelper)

  // ── Win ──
  const winDarkBlueMeter = new Meter(5, winHelper)
  const winYellowMeter   = new Meter(5, winHelper)
  const winOrangeMeter   = new Meter(5, winHelper)

  // ── Build ──
  const buildRedMeter   = new Meter(5, buildHelper)
  const buildWhiteMeter = new Meter(5, buildHelper)
  // #endregion

  // #region Update
  function update() {
    DrawRect(0, 0, 320, 200, 'black')

    backgroundHandler()

    inGame1Meter.setValue(engine.vision.inGame1)
    inGame2Meter.setValue(engine.vision.inGame2)

    BattleBusMeter.setValue(engine.vision.battlebus)
    BattleBusConfirmMeter.setValue(engine.vision.battlebusConfirm)

    KillMeter.setValue(engine.vision.killRed)
    KillWhiteMeter.setValue(engine.vision.killWhite)
    SprintMeter.setValue(engine.vision.sprintWhite)
    vehicleWhiteMeter.setValue(engine.vision.vehicleWhite)
    vehicleRedMeter.setValue(engine.vision.vehicleRed)
    healthM.setValue(engine.vision.Health)
    healthDamageM.setValue(engine.vision.HealthRed)
    shieldsM.setValue(engine.vision.Shields)
    shields2M.setValue(engine.vision.Shields2)
    xpM1.setValue(engine.vision.xp)
    xpM2.setValue(engine.vision.xp2)
    cloudCloseM.setValue(engine.vision.cloudClose)
    winDarkBlueMeter.setValue(engine.vision.winDarkBlue)
    winYellowMeter.setValue(engine.vision.winYellow)
    winOrangeMeter.setValue(engine.vision.winOrange)
    buildRedMeter.setValue(engine.vision.buildRed)
    buildWhiteMeter.setValue(engine.vision.buildWhite)

    if (engine.vision.battlebus || engine.vision.exit) {
      enableVehicle = false
    }

    renderExtensions()

    effects.forEach(ele => { ele.draw() })
    effects = effects.filter(ele => !(ele.lifetime <= 0))

    DrawHUD()
    ctx.drawImage(hiddenCanvas, 0, 0)

    window.requestAnimationFrame(update)
  }
  // #endregion

  // #region Background Modes
  let proBack = [0, 0, 0]
  function onbackColorChanged() {
    proBack = hexToHSL(backColor)
  }

  let gCycle = 0
  const audioEase = { sat: 0, lit: 0 }

  function updateColorCycle() {
    gCycle < 360 ? gCycle += .5 : gCycle = 0
  }

  function updateAudioEase() {
    audioEase.sat += (engine.audio.density * 100 - audioEase.sat) / 10
    audioEase.lit += (engine.audio.density * 100 - audioEase.lit) / 10
  }

  function backgroundHandler() {
    const alpha = ambienceAlpha / 100
    if (backgroundMode.includes('Color Cycle')) updateColorCycle()
    if (backgroundMode.includes('Audio'))       updateAudioEase()
    if (backgroundMode.includes('Ambience')) {
      if (backgroundMode === 'Ambience Audio Visualizer') copyScreenAudio(alpha)
      else copyScreen(alpha)
      return
    }
    const h = proBack[0] + (backgroundMode.includes('Color Cycle') ? gCycle : 0)
    const s = backgroundMode.includes('Audio') ? audioEase.sat * 0.33 + 66 : proBack[1]
    const l = backgroundMode.includes('Audio') ? audioEase.lit * 0.9  + 10 : proBack[2]
    DrawRect(0, 0, 320, 200, getColorString(h, s, l, alpha))
  }
  // #endregion

  // #region Callbacks
  let buildGoing = false
  function buildHelper() {
    if (enableBuild) {
      if ((buildRedMeter.value >= .95 && engine.vision.buildNotRed < .1) || (buildWhiteMeter.value >= .95 && engine.vision.buildNotWhite < .1) && !buildGoing) {
        buildGoing = true
        effects.push(new buildOpen())
      }
    }
  }

  let winGoing = false
  function winHelper() {
    if (enableWin) {
      if ((winDarkBlueMeter.value >= .95 || winOrangeMeter.value >= .95) && winYellowMeter.value >= .95 && !winGoing) {
        effects.push(new victoryEffect())
        winGoing = true
      }
    }
  }

  let KillGoing = false
  function killHelper() {
    if (KillMeter.value >= .95 && engine.vision.killNotRed < .1 && KillWhiteMeter.value >= .1 && !KillGoing) {
      if (enableKill) effects.push(new kill())
      KillGoing = true
    }
  }

  let SprintGoing = false
  function sprintHelper() {
    if (SprintMeter.value >= .4 && engine.vision.sprintNoWhite < .1 && !SprintGoing) {
      if (enableSprinting) effects.push(new sprinting())
      SprintGoing = true
    }
  }

  let BBGoing = false
  function battlebusHelper() {
    if (BattleBusMeter.value >= .95 && BattleBusConfirmMeter.value >= .95 && engine.vision.battlebusNotWhite < .1 && engine.vision.Health < .05 && !BBGoing) {
      if (enableBattlebus) {
        effects.push(new battlebus())
        BBGoing = true
      }
    }
  }

  function onGameChanged() {
    if (inGame1Meter.value >= 0.33 && inGame2Meter.value >= .6 && engine.vision.notInGame2 < .1 && engine.vision.Health > .2) {
      gInGame = true
    }
    if (engine.vision.Health < .05 && inGame1Meter.value < .1 && inGame2Meter.value < .1) gInGame = false
  }

  function DrawHUD() {
    if (gInGame) {
      if (enableHP)     DrawRect(HealthBarX * 3.2, HealthBarY * 2, healthM.value * (HealthBarWidth * 3.2), HealthBarHeight * 2, healthColor)
      if (enableShield) DrawRect(ShieldBarX * 3.2, ShieldBarY * 2, shieldsM.value * (ShieldBarWidth * 3.2), ShieldBarHeight * 2, ShieldColor)
    } else if (adjToggle && !gInGame) {
      if (enableHP)     DrawRect(HealthBarX * 3.2, HealthBarY * 2, HealthBarWidth * 3.2, HealthBarHeight * 2, healthColor)
      if (enableShield) DrawRect(ShieldBarX * 3.2, ShieldBarY * 2, ShieldBarWidth * 3.2, ShieldBarHeight * 2, ShieldColor)
    }
  }

  function shieldHelper() {
    if (gInGame) {
      if (shieldsM.decreased && shieldsM.value != shieldPrev && healthM.value > .1 && Math.abs(shieldsM.value - shields2M.value) < .05 && shieldsM.diff > 0.05) {
        if (enableDamage) {
          effects.push(new Wave('#ffffff', 'down'))
          setTimeout(() => { effects.push(new Wave('#ff0000', 'down')) }, 150)
          setTimeout(() => { effects.push(new Wave('#ff0000', 'down')) }, 300)
          shieldPrev = shieldsM.value
        }
      } else if (shieldsM.increased && shieldsM.value != shieldPrev && healthM.value > .1 && shieldsM.diff > 0.05) {
        if (enableHealing) {
          effects.push(new Wave('#ffffff', 'up'))
          setTimeout(() => { effects.push(new Wave('#00ffff', 'up')) }, 150)
          setTimeout(() => { effects.push(new Wave('#00ffff', 'up')) }, 300)
          shieldPrev = shieldsM.value
        }
      }
    }
  }

  function healthHelper() {
    if (gInGame) {
      if (healthM.diff < 0.95) {
        if (healthM.decreased && healthM.value != healthPrev && healthM.value > .1 && !engine.vision.battlebus && healthM.diff > 0.08) {
          if (enableDamage) {
            effects.push(new Wave('#ffffff', 'down'))
            setTimeout(() => { effects.push(new Wave('#ff0000', 'down')) }, 150)
            setTimeout(() => { effects.push(new Wave('#ff0000', 'down')) }, 300)
            healthPrev = healthM.value
          }
        } else if (healthM.increased && healthM.value != healthPrev && healthM.value > .1 && !engine.vision.battlebus && healthM.diff > 0.08) {
          if (enableHealing) {
            effects.push(new Wave('#ffffff', 'up'))
            setTimeout(() => { effects.push(new Wave('#00ff00', 'up')) }, 150)
            setTimeout(() => { effects.push(new Wave('#00ff00', 'up')) }, 300)
            healthPrev = healthM.value
          }
        }
      }
    }
  }

  function xpHelper() {
    if (gInGame) {
      if (xpM1.value >= 0.9 && xpM2.value >= 0.85 && !xpAnim) {
        if (enableXP) effects.push(new xpGain())
        xpAnim = true
      } else if (xpM1.value == 0 || !gInGame) {
        xpAnim = false
      }
    }
  }

  function cloudHelper() {
    if (enableCloud) {
      cloudDiff = Date.now() - cloudTimer
      if (cloudCloseM.value >= .6 && cloudDiff > 3500) {
        cloudTimer = Date.now()
        effects.push(new effectPulse(310))
        setTimeout(() => { effects.push(new effectPulse(310)) }, 300)
      }
    }
  }

  let vehicleGoing   = false
  let lowHealthGoing = false
  let knockedGoing   = false
  function renderExtensions() {
    if (enableVehicle) {
      if (healthM.value > 0.1 && vehicleWhiteMeter.value >= .95 && vehicleRedMeter.value >= .95 && engine.vision.vehicleNotWhite < .1 && !vehicleGoing) {
        effects.push(new vehicle())
        vehicleGoing = true
      }
    }
    if (healthM.value > .1 && healthM.value < .4 && !lowHealthGoing) {
      effects.push(new lowHealth())
      lowHealthGoing = true
    } else if (healthM.value < .1 && healthDamageM.value > .1 && !knockedGoing) {
      if (enableKnock) {
        effects.push(new knocked())
        knockedGoing = true
      }
    }
  }
  // #endregion

  // #region Effects
  function closePulse(hue) {
    this.lifetime = 500
    this.hue      = hue
    this.pulses   = 0
    this.active   = true

    this.draw = function () {
      if (!this.active) return

      hiddenCtx.strokeStyle = `hsl(${this.hue}, 100%, 50%)`
      hiddenCtx.lineWidth   = 50
      hiddenCtx.beginPath()
      hiddenCtx.arc(160, 100, this.lifetime, 0, Math.PI * 2)
      hiddenCtx.stroke()

      this.lifetime -= 10

      if (this.lifetime <= 0) {
        this.pulses++
        if (this.pulses < 1) {
          this.lifetime = 500
        } else {
          this.active = false
        }
      }
    }
  }

  function buildOpen() {
    this.lifetime = 1
    this.done     = false
    this.alpha    = 0
    this.alpha2   = .1
    this.count    = 0
    this.effects  = []

    this.draw = function () {
      this.count++
      DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${this.alpha})`)

      this.alpha2 = Math.abs(Math.sin(Date.now() / 500)) * .1 + .1
      this.alpha <= .95 ? this.alpha += .05 : this.alpha = 1

      let count = 0
      if (this.effects.length < 4) {
        this.effects.push(new menuRow(this.effects.length * 110))
      }

      this.effects.forEach((ele, i) => {
        ele.draw(this.done)
        ele.done ? count++ : null
      })

      if (count == 8 && !this.done) {
        this.done = true
      }
      if (buildRedMeter.value < .1 && buildWhiteMeter.value < .1 && !this.done) {
        this.done = true
        buildGoing = false
        this.lifetime = 0
        effects.push(new closePulse(170))
      }
    }
  }

  function menuRow(x) {
    this.x       = x
    this.start   = Date.now()
    this.speed   = 100
    this.effects = []
    this.done    = false
    this.lifetime = 1

    this.draw = function (donezo) {
      let elapsed = Date.now() - this.start
      let count   = 0
      if (elapsed > this.speed && this.effects.length < 5) {
        let check = this.effects.length % 2 == 0
        this.effects.push(new menuSquare(this.x + (check ? 0 : -55), 200 - (this.effects.length * 40 + 40), 5, 110, 40))
        this.start = Date.now()
      }

      this.effects.forEach((ele, i) => {
        ele.draw(donezo)
        if (ele.done) {
          count++
          if (this.effects[i - 1]) {
            this.effects[i - 1].grass = false
          }
        }
      })

      count == 5 ? this.done = true : null
    }
  }

  function menuSquare(x, y2, speed, width, height) {
    this.x        = x
    this.y        = 0
    this.alpha    = 1
    this.width    = width
    this.height   = height
    this.y2       = y2
    this.speed    = speed
    this.grass    = true
    this.done     = false
    this.lifetime = 1

    this.draw = function (donezo) {
      hiddenCtx.globalAlpha = this.alpha
      DrawRect(this.x, this.y, this.width, this.height, `hsla(220, 100%, 50%, 0.9)`)
      this.grass ? DrawRect(this.x, this.y, this.width, this.height * .75, `hsla(200, 100%, 50%, 0.3)`) : null
      StrokeRect(this.x, this.y, this.width, this.height, `hsla(190, 100%, 60%, 0.9)`, 10)
      hiddenCtx.globalAlpha = 1
      let dy = 10
      this.y < this.y2 ? this.y += dy : this.done = true
      donezo ? this.alpha >= .05 ? this.alpha -= .05 : this.alpha = 0 : null
    }
  }

  function kill() {
    this.alpha    = 1
    this.alpha2   = 0
    this.rad      = 1
    this.stroke   = 10
    this.lifetime = 1
    this.width    = 0
    this.width2   = 0
    this.draw = function () {
      hiddenCtx.globalAlpha = this.alpha
      DrawRect(0, 0, 320, 200, `hsla(0, 100%, 0%, ${this.alpha2})`)
      DrawStroke(160, 100, this.rad, 'red', this.stroke)
      DrawLine([0, 0], [this.width * 1.6, this.width], 'red', 40)
      DrawLine([320, 0], [320 - this.width2 * 1.6, this.width2], 'red', 40)
      hiddenCtx.globalAlpha = 1
      this.rad < 300 ? this.rad += 10 : this.width < 200 ? this.width += 10 : this.width2 < 200 ? this.width2 += 10 : this.alpha >= .025 ? this.alpha -= .025 : this.lifetime = 0
      if (this.stroke < 100) this.stroke += 5
      if (this.alpha2 <= .95) this.alpha2 += .05
      if (this.lifetime == 0) KillGoing = false
    }
  }

  function sprinting() {
    this.sprintValue = 1
    this.count       = 0
    this.lifetime    = 1
    this.draw = function () {
      if (Math.abs(this.sprintValue - SprintMeter.value) > .02 && this.count == 0) {
        effects.push(new sprintHelp(this.sprintValue * 120))
        this.count++
      }
      this.sprintValue = SprintMeter.value
      if (this.count > 0) this.count < 20 ? this.count++ : this.count = 0
      if (engine.vision.sprintNoWhite > .25 || SprintMeter.value < .05) {
        this.lifetime = 0
        SprintGoing = false
      }
    }
  }

  function sprintHelp(hue) {
    this.rad      = 1
    this.vrad     = 0
    this.stroke   = 1
    this.lifetime = 1
    this.hue      = hue
    this.draw = function () {
      DrawStroke(160, 100, this.rad, `hsl(${this.hue}, 100%, 50%)`, this.stroke)
      this.rad < 300 ? this.rad += this.vrad : this.lifetime = 0
      this.vrad   += .5
      this.stroke += 3
    }
  }

  function battlebus() {
    this.alpha    = 0
    this.half     = false
    this.lifetime = 1
    this.count    = 0
    this.draw = function () {
      DrawRect(0, 0, 320, 200, `hsla(240, 100%, 30%, ${this.alpha})`)
      effects.push(new battlebusHelp())
      if (!this.half) this.alpha <= .95 ? this.alpha += .05 : this.half = true
      if ((BattleBusMeter.value < .1 && BattleBusConfirmMeter.value < .1) && engine.vision.Health > .75 || engine.vision.inGame1 < .1) this.alpha >= .02 ? this.alpha -= .02 : this.lifetime = 0
      BBGoing = false
      if (this.lifetime == 0 && gInGame) {
        effects.push(new parachute())
      }
    }
  }

  function battlebusHelp() {
    this.x        = Math.random() * 320
    this.lifetime = 1
    this.y        = 250
    this.rad      = 50
    this.mod      = Math.random() * 30
    this.draw = function () {
      DrawCircle(this.x, this.y, this.rad, `hsla(${240 - this.rad}, 100%, ${50 + this.mod}%, ${this.rad / 70})`)
      this.y -= 10
      this.rad >= 3 ? this.rad -= 1.5 : this.lifetime = 0
    }
  }

  function parachute() {
    this.effects  = []
    this.count    = 0
    this.alpha    = 0
    this.lifetime = 700

    this.draw = function () {
      DrawRect(0, 0, 320, 200, `hsla(240, 100%, 1%, ${this.alpha})`)
      if (engine.vision.Health > .75) this.alpha < 1 ? this.alpha += .025 : this.alpha = 1
      this.lifetime--
      if (this.lifetime == 0 || engine.vision.inGame1 < .1) this.alpha >= .01 ? this.alpha -= .01 : this.lifetime = 0
      if (Math.random() > .95) this.effects.push(new paraFront())

      this.effects.forEach((ele, i) => { ele.draw() })
      this.effects = this.effects.filter(ele => ele.lifetime > 0)
    }
  }

  function paraFront() {
    this.x        = Math.random() * 100 + 110
    this.vx       = 1 - Math.random() * 2
    this.y        = -25
    this.hue      = Math.random() * 360
    this.count    = 0
    this.lifetime = 1
    this.effects  = []
    this.draw = function () {
      DrawCircle(this.x, this.y, 30, `hsla(${this.hue}, 100%, 50%, 1)`)
      if (this.count == 0) this.effects.unshift([this.x, this.y])
      this.count < 1 ? this.count++ : this.count = 0
      this.effects.forEach((ele, i) => {
        DrawCircle(ele[0], ele[1], 30 - i * 2, `hsla(${this.hue}, 100%, 50%, ${1 - i / 10})`)
      })
      if (this.effects.length > 10) this.effects.pop()
      this.x += this.vx
      this.y < 400 ? this.y += 10 : this.lifetime = 0
    }
  }

  function victoryEffect() {
    this.lifetime = 1
    this.draw = function () {
      effects.push(new victoryBalls())
      DrawRect(0, 0, 320, 200, 'hsl(200, 80%, 30%)')
      if (winDarkBlueMeter.value < .1 && winYellowMeter.value < .1 && winGoing) {
        winGoing = false
        this.lifetime = 0
      }
    }
  }

  function victoryBalls() {
    this.x        = Math.random() * 320
    this.y        = Math.random() * 200
    this.lifetime = 1
    this.alpha    = 0
    this.half     = false
    this.draw = function () {
      DrawCircle(this.x, this.y, 30, `hsla(50, 100%, 50%, ${this.alpha})`)
      if (!this.half) this.alpha < 1 ? this.alpha += .1 : this.half = true
      else this.alpha >= .1 ? this.alpha -= .1 : this.lifetime = 0
      this.x += 5 - Math.random() * 10
      this.y += 5 - Math.random() * 10
    }
  }

  function knocked() {
    this.timer     = 0
    this.active    = true
    this.fadeAlpha = 1
    this.lifetime  = 1
    this.fading    = false

    this.draw = function () {
      if (!this.active) return

      if (healthDamageM.value < .1) {
        this.lifetime = 0
        this.fading   = true
        knockedGoing  = false
      }

      this.timer += 0.05

      if (this.fading) {
        this.fadeAlpha -= 0.02
        if (this.fadeAlpha <= 0) {
          this.active = false
          return
        }
      }

      hiddenCtx.globalAlpha = 0.9 * this.fadeAlpha
      DrawRect(0, 0, 320, 200, 'hsl(0, 100%, 10%)')
      hiddenCtx.globalAlpha = 1

      const bigPulse  = (Math.sin(this.timer) + 1) / 2
      const bigRadius = 100 + bigPulse * 110
      hiddenCtx.beginPath()
      hiddenCtx.fillStyle   = 'hsl(0, 100%, 30%)'
      hiddenCtx.globalAlpha = 0.6 * this.fadeAlpha
      hiddenCtx.arc(160, 100, bigRadius, 0, Math.PI * 2)
      hiddenCtx.fill()

      const mediumPulse = Math.max(0, (bigPulse - 0.3) / 0.7)
      hiddenCtx.beginPath()
      hiddenCtx.fillStyle   = 'hsl(0, 100%, 45%)'
      hiddenCtx.globalAlpha = mediumPulse * this.fadeAlpha
      hiddenCtx.arc(160, 100, 120 * mediumPulse, 0, Math.PI * 2)
      hiddenCtx.fill()

      const smallPulse = Math.max(0, (bigPulse - 0.6) / 0.4)
      hiddenCtx.beginPath()
      hiddenCtx.fillStyle   = 'hsl(0, 100%, 60%)'
      hiddenCtx.globalAlpha = smallPulse * this.fadeAlpha
      hiddenCtx.arc(160, 100, 80 * smallPulse, 0, Math.PI * 2)
      hiddenCtx.fill()

      hiddenCtx.globalAlpha = 1
    }
  }

  function lowHealth() {
    this.lifetime = 1
    this.draw = function () {
      effects.push(new lowHealthHelp())
      if (healthM.value < .1 || healthM.value > .4 || !gInGame) {
        this.lifetime = 0
        lowHealthGoing = false
      }
    }
  }

  function lowHealthHelp() {
    this.x        = Math.random() * 320
    this.y        = Math.random() * 200
    this.lifetime = 1
    this.alpha    = 0
    this.half     = false
    this.draw = function () {
      DrawCircle(this.x, this.y, 30, `hsla(0, 100%, 50%, ${this.alpha})`)
      if (!this.half) this.alpha < 1 ? this.alpha += .1 : this.half = true
      else this.alpha >= .1 ? this.alpha -= .1 : this.lifetime = 0
      this.x += 5 - Math.random() * 10
      this.y += 5 - Math.random() * 10
    }
  }

  const carSVG = 'm221.34,32h-1.21v-8.04c-3.85-5.61-71.89-7.6-71.89-7.6L127.66,1.28c-6.39-1.76-47.34,0-47.34,0l-28.73,8.15C40.68,15.48,2.81,19.12,2.81,19.12c-1.54.88-1.54,8.48-1.54,8.48-2.75,1.87,2.75,5.83,2.75,5.83l3.52,4.51s36,4.4,58.57,6.72c22.57,2.31,127.6-1.32,127.6-1.32,11.78-.33,21.91-5.94,21.91-5.94,7.16.44,5.72-5.39,5.72-5.39ZM84.5,14.05l14.64-6.39h20.92l7.71,7.72s-39.41.64-43.27-1.34Z'

  function vehicle() {
    this.x        = 0
    this.y        = 60
    this.rad      = 1
    this.alpha    = 0
    this.half     = false
    this.lifetime = 1
    this.rot      = 0
    this.draw = function () {
      DrawRect(0, 0, 320, 200, `hsla(20, 100%, 50%, ${this.alpha})`)
      if (!this.half) this.alpha < .75 ? this.alpha += .025 : this.half = true
      DrawPath(this.x, this.y, carSVG, 'black', 1.2, 1.5)
      DrawCircle(this.x, this.y + 35, 10, 'red')
      wheel(this.x + 60,  this.y + 60, `hsla(20, 100%, 50%, ${this.alpha})`, this.rot)
      wheel(this.x + 200, this.y + 60, `hsla(20, 100%, 50%, ${this.alpha})`, this.rot + Math.PI)
      this.rot += .2
      this.rot %= Math.PI * 2
      this.x < 330 ? this.x += 5 : this.x = -320
      if (healthM.value < 0.1 || (vehicleWhiteMeter.value < .1 && vehicleRedMeter.value < .1) || !gInGame) {
        this.lifetime = 0
        vehicleGoing  = false
      }
    }
  }

  function xpGain() {
    this.count    = 0
    this.lifetime = 1
    this.draw = function () {
      effects.push(new xpHelp())
      this.count < 150 ? this.count++ : this.lifetime = 0
    }
  }

  function xpHelp() {
    this.x        = Math.random() * 320
    this.y        = 230
    this.vy       = 0
    this.lifetime = 1
    this.ay       = -.1
    this.rad      = 30
    this.draw = function () {
      DrawCircle(this.x, this.y, this.rad, 'yellow')
      this.y  += this.vy
      this.vy += this.ay
      this.rad > 1 ? this.rad -= .25 : this.lifetime = 0
    }
  }

  function Wave(color, direction) {
    this.color     = color
    this.direction = direction
    this.lifetime  = 300
    this.draw = function () {
      if (this.direction == 'up') {
        hiddenCtx.fillStyle = this.color
        hiddenCtx.beginPath()
        hiddenCtx.moveTo(160, this.lifetime - 100)
        hiddenCtx.lineTo(320, this.lifetime)
        hiddenCtx.lineTo(320, this.lifetime + 50)
        hiddenCtx.lineTo(160, this.lifetime - 50)
        hiddenCtx.lineTo(0,   this.lifetime + 50)
        hiddenCtx.lineTo(0,   this.lifetime)
        hiddenCtx.lineTo(160, this.lifetime - 100)
        hiddenCtx.fill()
      } else if (this.direction = 'down') {
        hiddenCtx.fillStyle = this.color
        hiddenCtx.beginPath()
        hiddenCtx.moveTo(160, 300 - this.lifetime)
        hiddenCtx.lineTo(320, 200 - this.lifetime)
        hiddenCtx.lineTo(320, 100 - this.lifetime)
        hiddenCtx.lineTo(160, 200 - this.lifetime)
        hiddenCtx.lineTo(0,   100 - this.lifetime)
        hiddenCtx.lineTo(0,   200 - this.lifetime)
        hiddenCtx.lineTo(160, 300 - this.lifetime)
        hiddenCtx.fill()
      }
      this.lifetime -= 10
    }
  }

  function tookHit(hue) {
    this.lifetime = 25
    this.start    = new Date().getTime()
    this.elapsed  = 0
    this.draw = function () {
      this.elapsed = new Date().getTime() - this.start
      DrawRect(0, 0, 320, 200, `hsl(${hue}, 100%, ${Math.sin(this.elapsed / 10) * 25 + 50}%`)
      this.lifetime--
    }
  }

  function effectPulse(hue) {
    this.lifetime = 500
    this.hue      = hue
    this.draw = function () {
      hiddenCtx.strokeStyle = `hsl(${hue}, 100%, 50%)`
      hiddenCtx.lineWidth   = 50
      hiddenCtx.beginPath()
      hiddenCtx.arc(160, 100, this.lifetime, 0, Math.PI * 2)
      hiddenCtx.stroke()
      this.lifetime -= 10
    }
  }
  // #endregion

  // #region Helper Functions
  function DrawRect(x, y, width, height, color) {
    hiddenCtx.beginPath()
    hiddenCtx.fillStyle = color
    hiddenCtx.fillRect(x, y, width, height)
  }

  function DrawLine(start, end, color, stroke) {
    hiddenCtx.beginPath()
    hiddenCtx.moveTo(start[0], start[1])
    hiddenCtx.lineTo(end[0], end[1])
    hiddenCtx.strokeStyle = color
    hiddenCtx.lineWidth   = stroke
    hiddenCtx.stroke()
  }

  function DrawStroke(x, y, radius, color, stroke) {
    hiddenCtx.beginPath()
    hiddenCtx.strokeStyle = color
    hiddenCtx.lineWidth   = stroke
    hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
    hiddenCtx.stroke()
  }

  function DrawCircle(x, y, radius, color) {
    hiddenCtx.beginPath()
    hiddenCtx.fillStyle = color
    hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
    hiddenCtx.fill()
  }

  function DrawPath(x, y, path, color, scaleX, scaleY) {
    hiddenCtx.fillStyle = color
    hiddenCtx.save()
    hiddenCtx.translate(x, y)
    hiddenCtx.scale(scaleX, scaleY)
    hiddenCtx.fill(new Path2D(path))
    hiddenCtx.restore()
  }

  function StrokeRect(x, y, width, height, color, stroke) {
    hiddenCtx.beginPath()
    hiddenCtx.strokeStyle = color
    hiddenCtx.lineWidth   = stroke
    hiddenCtx.rect(x, y, width, height)
    hiddenCtx.stroke()
  }

  function wheel(x, y, color, rot) {
    hiddenCtx.save()
    hiddenCtx.translate(x, y)
    hiddenCtx.rotate(rot)
    hiddenCtx.translate(-x, -y)
    DrawCircle(x, y, 30, 'black')
    hiddenCtx.beginPath()
    hiddenCtx.arc(x, y, 20, 0, Math.PI)
    hiddenCtx.fillStyle = color
    hiddenCtx.fill()
    hiddenCtx.restore()
  }

  function getColorString(h, s, l, a = 1) {
    return `hsla(${h}, ${s}%, ${l}%, ${a})`
  }

  function hexToHSL(hex) {
    let [r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex).slice(1).map(x => parseInt(x, 16) / 255)
    const max = Math.max(r, g, b), min = Math.min(r, g, b)
    let h, s
    const l = (max + min) / 2
    if (max === min) {
      h = s = 0
    } else {
      const d = max - min
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min)
      h = max === r ? (g - b) / d + (g < b ? 6 : 0)
        : max === g ? (b - r) / d + 2
        :             (r - g) / d + 4
      h /= 6
    }
    return [Math.round(360 * h), Math.round(s * 100), Math.round(l * 100)]
  }

  const ZONE_COLS   = 28
  const ZONE_ROWS   = 20
  const TOTAL_ZONES = ZONE_COLS * ZONE_ROWS

  function copyScreenAudio(alpha) {
    const lightness = new Int8Array(engine.zone.lightness)
    const sat       = new Int8Array(engine.zone.saturation)
    const hue       = new Int16Array(engine.zone.hue)
    for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
      const iCol = iZone % ZONE_COLS
      const iRow = Math.floor(iZone / ZONE_COLS)
      const iZx  = iCol * (320 / ZONE_COLS)
      const iZy  = iRow * (200 / ZONE_ROWS)
      hiddenCtx.fillStyle = `hsla(${hue[iZone]}, ${sat[iZone] * (audioEase.sat / 200 + .5)}%, ${lightness[iZone] * (audioEase.lit / 100)}%, ${alpha})`
      hiddenCtx.fillRect(iZx, iZy, 320 / ZONE_COLS, 200 / ZONE_ROWS)
    }
  }

  function copyScreen(alpha) {
    const lightness = new Int8Array(engine.zone.lightness)
    const sat       = new Int8Array(engine.zone.saturation)
    const hue       = new Int16Array(engine.zone.hue)
    const customHue = backgroundMode.includes('Custom Ambience')
    const cycleOff  = backgroundMode.includes('Color Cycle') ? gCycle : 0
    for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
      const iCol = iZone % ZONE_COLS
      const iRow = Math.floor(iZone / ZONE_COLS)
      const iZx  = iCol * (320 / ZONE_COLS)
      const iZy  = iRow * (200 / ZONE_ROWS)
      const h    = customHue ? proBack[0] : hue[iZone] + cycleOff
      hiddenCtx.fillStyle = `hsla(${h}, ${sat[iZone]}%, ${lightness[iZone]}%, ${alpha})`
      hiddenCtx.fillRect(iZx, iZy, 320 / ZONE_COLS, 200 / ZONE_ROWS)
    }
  }

  function Meter(count, callback) {
    this.size      = count
    this.value     = 0
    this.diff      = 0
    this.increased = false
    this.decreased = false
    const values   = []

    this.setValue = function (updatedValue) {
      values.push(updatedValue)
      if (values.length > this.size) {
        values.shift()
      }

      for (let i = 0; i < values.length - 1; i++) {
        if (values[i] !== values[i + 1]) return
      }

      if (this.value !== values[0]) {
        this.diff      = Math.abs(this.value - values[0])
        this.increased = this.value < values[0]
        this.decreased = this.value > values[0]
        this.value     = values[0]
        callback()
      }
    }
  }
  // #endregion

  window.requestAnimationFrame(update)

</script>
