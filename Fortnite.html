<body style="margin: 0; padding: 0; background: #000;">
  <canvas id="exCanvas" width="320" height="200"></canvas>
</body>

<script>
  var canvas, ctx;
  canvas = document.getElementById('exCanvas');
  ctx = canvas.getContext('2d');
  var width = 320;
  var height = 200;
  var hiddenCanvas = document.createElement("canvas");
  hiddenCanvas.width = width;
  hiddenCanvas.height = height;
  var hctx = hiddenCanvas.getContext("2d");
  let gAlpha = 1
  var effects = [];
  var hue = 200;
  var sat = 100;
  var latency = 6;
  var gInGame = false;
  var vehiclePhase = 0;
  var BuildingAnim = false;
  var lobbyAnim = false;
  var cloudTimer = 0;
  var xpAnim = false;
  var move = 0;
  var cloudDiff = 0;
  var healthPrev = 0;
  var shieldPrev = 0;

  var inGame1Meter = new Meter(5, onGameChanged)
  var inGame2Meter = new Meter(5, onGameChanged)

  var healthM = new Meter(25, healthHelper);
  var healthDamageM = new Meter(3, healthHelper);

  var shieldsM = new Meter(20, shieldHelper);
  var shields2M = new Meter(20, shieldHelper);

  var xpM1 = new Meter(25, xpHelper);
  var xpM2 = new Meter(25, xpHelper);

  var cloudCloseM = new Meter(3, cloudHelper);

  var vehicleWhiteMeter = new Meter(5, () => "");
  var vehicleRedMeter = new Meter(5, () => "");

  let BattleBusMeter = new Meter(10, battlebusHelper)
  let BattleBusConfirmMeter = new Meter(10, battlebusHelper)
  let BattleSurfMeter = new Meter(10, battlebusHelper)
  let BattleSurfConfirmMeter = new Meter(10, battlebusHelper)

  let SprintMeter = new Meter(5, sprintHelper)

  let KillMeter = new Meter(5, killHelper)
  let KillWhiteMeter = new Meter(5,killHelper)

  let winDarkBlueMeter = new Meter(5,winHelper)
  let winYellowMeter = new Meter(5,winHelper)
  let winOrangeMeter = new Meter(5,winHelper)
  let buildRedMeter = new Meter(5,buildHelper)
  let buildWhiteMeter = new Meter(5,buildHelper)


  function update() {

    hctx.clearRect(0, 0, hiddenCanvas.width, hiddenCanvas.height);
    hctx.fillStyle = `hsla(0, 0%, 0%, ${gAlpha})`;
    hctx.fillRect(0, 0, 320, 200);

    backgroundHandler()


    inGame1Meter.setValue(engine.vision.inGame1)
    inGame2Meter.setValue(engine.vision.inGame2)

    BattleBusMeter.setValue(engine.vision.battlebus);
    BattleBusConfirmMeter.setValue(engine.vision.battlebusConfirm);
    BattleSurfMeter.setValue(engine.vision.battleSurf);
    BattleSurfConfirmMeter.setValue(engine.vision.battleSurfConfirm);

    
    KillMeter.setValue(engine.vision.killRed)
    KillWhiteMeter.setValue(engine.vision.killWhite)
    SprintMeter.setValue(engine.vision.sprintWhite)
    vehicleWhiteMeter.setValue(engine.vision.vehicleWhite);
    vehicleRedMeter.setValue(engine.vision.vehicleRed);
    healthM.setValue(engine.vision.Health);
    healthDamageM.setValue(engine.vision.HealthRed);
    shieldsM.setValue(engine.vision.Shields);
    shields2M.setValue(engine.vision.Shields2);
    xpM1.setValue(engine.vision.xp);
    xpM2.setValue(engine.vision.xp2);
    cloudCloseM.setValue(engine.vision.cloudClose);
    winDarkBlueMeter.setValue(engine.vision.winDarkBlue)
    winYellowMeter.setValue(engine.vision.winYellow)
    winOrangeMeter.setValue(engine.vision.winOrange)
    buildRedMeter.setValue(engine.vision.buildRed)
    buildWhiteMeter.setValue(engine.vision.buildWhite)

    if (engine.vision.battlebus || engine.vision.exit) {
      enableVehicle = false;
    }

    

    renderExtensions();

    //Effect handler 
    for (let i = 0; i < effects.length; i++) {
      effects[i].draw(hctx);
    } 
    // Remove dead effects with filter
    effects = effects.filter(effect => !(effect.lifetime <= 0));

    
    if(enableHUD) DrawHUD();
    ctx.clearRect(0, 0, width, height);
    ctx.drawImage(hiddenCanvas, 0, 0);
    
    
    window.requestAnimationFrame(update);
  }

  let proBack = []
    function onbackColorChanged(){
      proBack = hexToHSL(backColor)
    }

    let backgroundEaseHue = 0;
    let backgroundEaseLit = 0;
    let backgroundEaseSat = 0
    let gCycle = 0
    function backgroundHandler(){
        switch(backgroundMode){
            case "Color Cycle": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Color Cycle Ambience": 
            copyScreen(ambienceAlpha / 100)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Custom": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            break;
            case "Ambience": 
            copyScreen(ambienceAlpha / 100,hctx)
            break;
            case "Custom Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Ambience Audio Visualizer": 
            copyScreenAudio(ambienceAlpha / 100)
            break;
            case "Custom Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
            case "Color Cycle Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
        }
    }


  let buildGoing = false
  function buildHelper(){
    if(enableBuild){
      if((buildRedMeter.valeu >=.95 && engine.vision.buildNotRed <.1) || (buildWhiteMeter.value >=.95 && engine.vision.buildNotWhite <.1) && !buildGoing){
        buildGoing = true
        effects.push(new buildOpen())
      }

    }
  }

  let winGoing = false
  function winHelper(){
    if(enableWin){
      if((winDarkBlueMeter.value >= .95 || winOrangeMeter.value >=.95) && winYellowMeter.value >=.95 && !winGoing){
        effects.push(new victoryEffect())
        winGoing = true
      }
    }
  }

  let KillGoing = false
  function killHelper(){
    if(KillMeter.value >= .95 && engine.vision.killNotRed < .1 && KillWhiteMeter.value >=.1 && !KillGoing){
      if(enableKill) effects.push(new kill())
      KillGoing = true
    }
  }

  let SprintGoing = false
  function sprintHelper(){
    if(SprintMeter.value >= .4 && engine.vision.sprintNoWhite < .1 && !SprintGoing){
      if(enableSprinting) effects.push(new sprinting())
      SprintGoing = true
    }
  }

  let BBGoing = false
  function battlebusHelper(){
    if(((BattleBusMeter.value >= .95 && BattleBusConfirmMeter.value >= .95 && engine.vision.battlebusNotWhite <.1) || (BattleSurfMeter.value >= .95 && BattleSurfConfirmMeter.value >= .95 && engine.vision.battleSurfNotWhite <.1)) && engine.vision.Health < .05 && !BBGoing){
      if(enableBattlebus){
        effects.push(new battlebus())
        BBGoing = true

      } 
    } 
  }

  function onGameChanged() {
    if (inGame1Meter.value >= 0.33 && inGame2Meter.value >= .6 && engine.vision.notInGame2 < .1 && engine.vision.Health >.3) {
      //setTimeout(() => {
        gInGame = true;
      //}, 1000);
    }
    if (engine.vision.Health < .05 && inGame1Meter.value <.1 && inGame2Meter.value <.1) gInGame = false;
  }

  function DrawHUD() {
    if (gInGame) {
      hctx.beginPath()
      hctx.fillStyle = healthColor;
      hctx.fillRect((HealthBarX * 3.2), (HealthBarY * 2), healthM.value * (HealthBarWidth * 3.2), (HealthBarHeight * 2))
      //shield
      hctx.beginPath()
      hctx.fillStyle = ShieldColor;
      hctx.fillRect((ShieldBarX * 3.2), (ShieldBarY * 2), shieldsM.value * (ShieldBarWidth * 3.2), (ShieldBarHeight * 2))
    } else if (adjToggle || !gInGame) {
      hctx.beginPath()
      hctx.fillStyle = healthColor;
      hctx.fillRect((HealthBarX * 3.2), (HealthBarY * 2), (HealthBarWidth * 3.2), (HealthBarHeight * 2))
      //shield
      hctx.beginPath()
      hctx.fillStyle = ShieldColor;
      hctx.fillRect((ShieldBarX * 3.2), (ShieldBarY * 2), (ShieldBarWidth * 3.2), (ShieldBarHeight*2))
    }
    //health
  }
    
  function shieldHelper() {
    if (gInGame) {
      if (shieldsM.decreased && shieldsM.value != shieldPrev && healthM.value > .1 && Math.abs(shieldsM.value - shields2M.value) < .05 && shieldsM.diff > 0.05) {
        if (enableDamage) {
          effects.push(new Wave('#ffffff', "down"));
          setTimeout(() => { effects.push(new Wave('#ff0000', "down")); }, 150);
          setTimeout(() => { effects.push(new Wave('#ff0000', "down")); }, 300);
          shieldPrev = shieldsM.value;
        }
      } else if (shieldsM.increased && shieldsM.value != shieldPrev && healthM.value > .1 && shieldsM.diff > 0.05) {
        if (enableHealing) {
          effects.push(new Wave('#ffffff', "up"));
          setTimeout(() => { effects.push(new Wave('#00ffff', "up")); }, 150);
          setTimeout(() => { effects.push(new Wave('#00ffff', "up")); }, 300);
          shieldPrev = shieldsM.value;
        }
      };
    }
  };

  function healthHelper() {
    if (gInGame) {
      if (healthM.diff < 0.95) {
        if (healthM.decreased && healthM.value != healthPrev && healthM.value > .1 && !engine.vision.battlebus && healthM.diff > 0.08) {
          if (enableDamage) {
            effects.push(new Wave('#ffffff', "down"));
            setTimeout(() => { effects.push(new Wave('#ff0000', "down")); }, 150);
            setTimeout(() => { effects.push(new Wave('#ff0000', "down")); }, 300);
            healthPrev = healthM.value;
          }
        } else if (healthM.increased && healthM.value != healthPrev && healthM.value > .1 && !engine.vision.battlebus && healthM.diff > 0.08) {
          if (enableHealing) {
            effects.push(new Wave('#ffffff', "up"));
            setTimeout(() => { effects.push(new Wave('#00ff00', "up")); }, 150);
            setTimeout(() => { effects.push(new Wave('#00ff00', "up")); }, 300);
            healthPrev = healthM.value;
          }
        };
      }
    }
  };

  function xpHelper() {
    if (gInGame) {
      if (xpM1.value >= 0.9 && xpM2.value >= 0.85 && !xpAnim) {
        if (enableXP) effects.push(new xpGain())
        xpAnim = true;
      } else if (xpM1.value == 0 || !gInGame) {
        xpAnim = false;
      };
    }
  };

  function cloudHelper() {
    if (enableCloud) {
      cloudDiff = Date.now() - cloudTimer;
      if (cloudCloseM.value >= .6 && cloudDiff > 3500) {
        cloudTimer = Date.now();
        effects.push(new effectPulse(310));
        setTimeout(() => { effects.push(new effectPulse(310)) }, 300);
      };
    }
  };

  let vehicleGoing = false
  let lowHealthGoing = false
  let knockedGoing = false
  function renderExtensions() {
    if (enableVehicle) {
      if (healthM.value > 0.1 && vehicleWhiteMeter.value >= .95 && vehicleRedMeter.value >=.95 && engine.vision.vehicleNotWhite <.1 && !vehicleGoing) {
        effects.push(new vehicle())
        vehicleGoing = true
      };
    };
    if (healthM.value > .1 && healthM.value < .4 && !lowHealthGoing) {
      effects.push(new lowHealth())
      lowHealthGoing = true
    } else if (healthM.value < .1 && healthDamageM.value > .1 && !knockedGoing) {
      if (enableKnock) {
        effects.push(new knocked())
        knockedGoing = true
      }
    };
  }

  function closePulse(hue) {
      this.lifetime = 500;
      this.hue = hue;
      this.pulses = 0; 
      this.active = true;

      this.draw = function () {
        if (!this.active) return;

        hctx.strokeStyle = `hsl(${this.hue}, 100%, 50%)`;
        hctx.lineWidth = 50;
        hctx.beginPath();
        hctx.arc(160, 100, this.lifetime, 0, Math.PI * 2);
        hctx.stroke();

        this.lifetime -= 10;

       
        if (this.lifetime <= 0) {
          this.pulses++;
          if (this.pulses < 1) {
            this.lifetime = 500; 
          } else {
            this.active = false; 
          }
        }
      };
  
  }

  function buildOpen() {
    this.lifetime = 1;
    this.done = false;
    this.alpha = 0;
    this.alpha2 = .1;
    this.count = 0;
    this.effects = [];
    
    this.draw = function () {
      this.count++
      DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${this.alpha})`);
  
      this.alpha2 = Math.abs(Math.sin(Date.now() / 500)) * .1 + .1;
      this.alpha <= .95 ? this.alpha += .05 : this.alpha = 1;

      let count = 0;
      if (this.effects.length < 4) {
        this.effects.push(new menuRow(this.effects.length * 110))
      }
      
      this.effects.forEach((ele, i) => {
        ele.draw(this.done);
        ele.done ? count++ : null;
      })
      
      
      if (count == 8 && !this.done) {
        this.done = true
      }
      if (buildRedMeter.value <.1 && buildWhiteMeter.value <.1 && !this.done) {
        this.done = true
        buildGoing = false
        this.lifetime = 0
        effects.push(new closePulse(170))
      }
    }
  }

  
  function menuRow(x) {
    this.x = x;
    this.start = Date.now();
    this.speed = 100;
    this.effects = [];
    this.done = false;
    this.lifetime = 1; 
    
    this.draw = function (donezo) {
      let elapsed = Date.now() - this.start;
      let count = 0;
      if (elapsed > this.speed && this.effects.length < 5) {
        let check = this.effects.length % 2 == 0
        this.effects.push(new menuSquare(this.x + (check ? 0 : -55), 200 - (this.effects.length * 40 + 40), 5, 110, 40))
        this.start = Date.now()
      }
      
      this.effects.forEach((ele, i) => {
        ele.draw(donezo);
        if (ele.done) {
          count++;
          if (this.effects[i - 1]) {
            this.effects[i - 1].grass = false;
          }
        }
      })
      
      count == 5 ? this.done = true : null;
    }
  }

  function menuSquare(x, y2, speed, width, height) {
    this.x = x;
    this.y = 0;
    this.alpha = 1;
    this.width = width;
    this.height = height;
    this.y2 = y2;
    this.speed = speed;
    this.grass = true;
    this.done = false;
    this.lifetime = 1; 
    
    this.draw = function (donezo) {
      hctx.globalAlpha = this.alpha;
      DrawRect(this.x, this.y, this.width, this.height, `hsla(220, 100%, 50%, 0.9)`)
      this.grass ? DrawRect(this.x, this.y, this.width, this.height * .75, `hsla(200, 100%, 50%, 0.3)`) : null;
      StrokeRect(this.x, this.y, this.width, this.height, `hsla(190, 100%, 60%, 0.9)`, 10)
      hctx.globalAlpha = 1;
      let dy = 10
      this.y < this.y2 ? this.y += dy : this.done = true;
      donezo ? this.alpha >= .05 ? this.alpha -= .05 : this.alpha = 0 : null;
    }
  }

  function kill(){
        this.alpha = 1
        this.alpha2 = 0
        this.rad = 1
        this.stroke = 10
        this.lifetime = 1
        this.width = 0
        this.width2 = 0
        this.draw = function(){
          hctx.globalAlpha = this.alpha
          DrawRect(0, 0, 320, 200, `hsla(0, 100%, 0%, ${this.alpha2})`)
          DrawStroke(160, 100, this.rad, "red", this.stroke)
          DrawLine([0, 0], [this.width * 1.6, this.width], "red", 40)
          DrawLine([320, 0], [320 - this.width2 * 1.6, this.width2], "red", 40)
          hctx.globalAlpha = 1
          this.rad < 300 ? this.rad += 10 : this.width < 200 ? this.width += 10 : this.width2 < 200 ? this.width2 += 10 : this.alpha >= .025 ? this.alpha -= .025 : this.lifetime = 0;
          if(this.stroke < 100) this.stroke+=5
          if(this.alpha2 <= .95) this.alpha2 += .05
          if(this.lifetime == 0) KillGoing = false
        }
    }

    function DrawRect(x, y, width, height, color) {
      hctx.beginPath();
      hctx.fillStyle = color;
      hctx.fillRect(x, y, width, height);
    };

  function DrawLine(start, end, color, stroke){
    hctx.beginPath()
    hctx.moveTo(start[0], start[1])
    hctx.lineTo(end[0], end[1])
    hctx.strokeStyle = color
    hctx.lineWidth = stroke
    hctx.stroke()
  }

  function sprinting(){
        this.sprintValue = 1
        this.count = 0
        this.lifetime = 1
        this.draw = function(){
            if(Math.abs(this.sprintValue - SprintMeter.value) > .02 && this.count == 0) {
              effects.push(new sprintHelp(this.sprintValue * 120))
              this.count++
            }
            this.sprintValue = SprintMeter.value
            if(this.count > 0) this.count < 20 ? this.count++ : this.count = 0
            if(engine.vision.sprintNoWhite > .25 || SprintMeter.value < .05) {
              this.lifetime = 0
              SprintGoing = false
            }
        }
    }

    function DrawStroke(x, y, radius, color, stroke) {
    hctx.beginPath();

    function knocked() {
      this.timer = 0;
      this.active = true;
      this.fadeAlpha = 1;
      this.lifetime = 1
      this.fading = false; 
      

      this.draw = function() {
        if (!this.active) return;


        if (healthDamageM.value <.1) {
          this.lifetime = 0;
          this.fading = true
          knockedGoing = false
        }

        this.timer += 0.05;

        if (this.fading) {
          this.fadeAlpha -= 0.02;  
          if (this.fadeAlpha <= 0) {
            this.active = false;   
            return;
          }
        }

        hctx.globalAlpha = 0.9 * this.fadeAlpha;
        hctx.fillStyle = "hsl(0, 100%, 10%)";
        hctx.fillRect(0, 0, 320, 200);
        hctx.globalAlpha = 1;

        let bigPulse = (Math.sin(this.timer) + 1) / 2;
        let bigRadius = 100 + bigPulse * 110;
        hctx.beginPath();
        hctx.fillStyle = "hsl(0, 100%, 30%)";
        hctx.globalAlpha = 0.6 * this.fadeAlpha;
        hctx.arc(160, 100, bigRadius, 0, Math.PI * 2);
        hctx.fill();

        let mediumPulse = Math.max(0, (bigPulse - 0.3) / 0.7);
        hctx.beginPath();
        hctx.fillStyle = "hsl(0, 100%, 45%)";
        hctx.globalAlpha = mediumPulse * this.fadeAlpha;
        hctx.arc(160, 100, 120 * mediumPulse, 0, Math.PI * 2);
        hctx.fill();

        let smallPulse = Math.max(0, (bigPulse - 0.6) / 0.4);
        hctx.beginPath();
        hctx.fillStyle = "hsl(0, 100%, 60%)";
        hctx.globalAlpha = smallPulse * this.fadeAlpha;
        hctx.arc(160, 100, 80 * smallPulse, 0, Math.PI * 2);
        hctx.fill();

        hctx.globalAlpha = 1;
      };
    }

    function DrawPath(x, y, path, color, scaleX, scaleY) {
      hctx.fillStyle = color;
      hctx.save();
      hctx.translate(x, y);
      hctx.scale(scaleX, scaleY)
      let ex = new Path2D(path);
      hctx.fill(ex);
      hctx.restore();
    };

    function wheel(x, y, color, rot){
      hctx.save()
      hctx.translate(x, y)
      hctx.rotate(rot)
      hctx.translate(-x, -y)
      DrawCircle(x, y, 30, "black")
      hctx.beginPath()
      hctx.arc(x, y, 20, 0, Math.PI)
      hctx.fillStyle = color
      hctx.fill()
      hctx.restore()

  function Wave(color, direction) {
    this.color = color;
    this.direction = direction;
    this.lifetime = 300;
    this.draw = function () {
      if (this.direction == "up") {
        hctx.fillStyle = this.color;
        hctx.beginPath();
        hctx.moveTo(160, this.lifetime - 100);
        hctx.lineTo(320, this.lifetime);
        hctx.lineTo(320, this.lifetime + 50);
        hctx.lineTo(160, this.lifetime - 50);
        hctx.lineTo(0, this.lifetime + 50);
        hctx.lineTo(0, this.lifetime);
        hctx.lineTo(160, this.lifetime - 100);
        hctx.fill();
      } else if (this.direction = "down") {
        hctx.fillStyle = this.color;
        hctx.beginPath();
        hctx.moveTo(160, 300 - this.lifetime);
        hctx.lineTo(320, 200 - this.lifetime);
        hctx.lineTo(320, 100 - this.lifetime);
        hctx.lineTo(160, 200 - this.lifetime);
        hctx.lineTo(0, 100 - this.lifetime);
        hctx.lineTo(0, 200 - this.lifetime);
        hctx.lineTo(160, 300 - this.lifetime);
        hctx.fill();
      }
      this.lifetime -= 10;
    };
  };

  function Meter(count, callback) {
    this.size = count;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    var values = [];

    this.setValue = function (updatedValue) {
      // Add and shift.
      values.push(updatedValue);
      if (values.length > this.size) {
        values.shift();
      }

      // Exit early if we've got a long-term match.
      for (var i = 0; i < values.length - 1; i++) {
        if (values[i] !== values[i + 1]) return;
      }

      // We got here, so we've got a matching value collection.
      if (this.value !== values[0]) {
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        callback();
      }
    };
  }

    function StrokeRect(x, y, width, height, color, stroke){
      hctx.beginPath();

      hctx.stroke()
    }

    function hexToHSL(hex) {
      var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  
      var r = parseInt(result[1], 16);
      var g = parseInt(result[2], 16);
      var b = parseInt(result[3], 16);
  
      (r /= 255), (g /= 255), (b /= 255);
      var max = Math.max(r, g, b),
        min = Math.min(r, g, b);
      var h,
        s,
        l = (max + min) / 2;
  
      if (max === min) {
        h = s = 0; // achromatic
      } else {
        var d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r:
            h = (g - b) / d + (g < b ? 6 : 0);
            break;
          case g:
            h = (b - r) / d + 2;
            break;
          case b:
            h = (r - g) / d + 4;
            break;
        }
        h /= 6;
      }
  
      s = s * 100;
      s = Math.round(s);
      l = l * 100;
      l = Math.round(l);
      h = Math.round(360 * h);
  
      return [h, s, l];
    }

    let audioScreenSat = 0
    let audioScreenLit = 0
    function copyScreenAudio(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      audioScreenSat += (engine.audio.density * 100 - audioScreenSat) / 10
      audioScreenLit += (engine.audio.density * 100 - audioScreenLit) / 10
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        hctx.fillStyle = `hsla(${hue[iZone]}, ${sat[iZone] * (audioScreenSat / 200 + .5)}%, ${lightness[iZone] * (audioScreenLit / 100)}%, ${alpha})`;
        hctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }
  
    function copyScreen(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      for (var iZone = 0; iZone < 560; iZone++) {

        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        hctx.fillStyle = `hsla(${(backgroundMode == "Custom Ambience" ? proBack[0] : hue[iZone] + gCycle * (backgroundMode == "Color Cycle Ambience"))}, ${sat[iZone]}%, ${lightness[iZone]}%, ${alpha})`;
        hctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }
