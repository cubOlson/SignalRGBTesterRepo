<script>
  var canvas, ctx;
  var effects = [];
  var hue = 200;
  var sat = 100;
  var latency = 6;
  var stateMgr = new StateHandler();
  var inGame = false;
  var vehiclePhase = 0;
  var BuildingAnim = false;
  var lobbyAnim = false;
  var cloudTimer = 0;
  var xpAnim = false;
  var move = 0;
  var cloudDiff = 0;
  var healthPrev = 0;
  var shieldPrev = 0;

  var inGame1Meter = new Meter(5, onGameChanged)
  var inGame2Meter = new Meter(5, onGameChanged)

  var healthM = new Meter(25, healthHelper);
  var healthDamageM = new Meter(3, healthHelper);

  var shieldsM = new Meter(20, shieldHelper);
  var shields2M = new Meter(20, shieldHelper);

  var xpM1 = new Meter(25, xpHelper);
  var xpM2 = new Meter(25, xpHelper);

  var cloudCloseM = new Meter(3, cloudHelper);

  var vehicleM = new Meter(10, () => "");

  let BattleBusMeter = new Meter(10, battlebusHelper)
  let BattleBusConfirmMeter = new Meter(10, battlebusHelper)

  let ParachuteMeter = new Meter(3, ()=>"")

  let SprintMeter = new Meter(5, sprintHelper)

  let KillMeter = new Meter(5, killHelper)

  function update() {
    inGame1Meter.setValue(engine.vision.inGame1)
    inGame2Meter.setValue(engine.vision.inGame2)

    BattleBusMeter.setValue(engine.vision.battlebus);
    BattleBusConfirmMeter.setValue(engine.vision.battlebusConfirm);
    
    if(inGame) {
      KillMeter.setValue(engine.vision.killRed)
      if(engine.vision.sprintNoWhite < .1) SprintMeter.setValue(engine.vision.sprintWhite)
      ParachuteMeter.setValue(engine.vision.parachute)
      vehicleM.setValue(engine.vision.vehicle);
      healthM.setValue(engine.vision.BuildHealth);
      healthDamageM.setValue(engine.vision.BuildHealthRed);
      shieldsM.setValue(engine.vision.BuildShields);
      shields2M.setValue(engine.vision.BuildShields2);
      xpM1.setValue(engine.vision.xp);
      xpM2.setValue(engine.vision.xp2);
      cloudCloseM.setValue(engine.vision.cloudClose);
    }

    if (engine.vision.battlebus || engine.vision.exit) {
      enableVehicle = false;
    }

    DrawRect(0, 0, 320, 200, "black")
    backgroundHandler()

    renderExtensions();

    for (let i = 0; i < effects.length; i++) {
      effects[i].draw();
      if (effects[i].lifetime <= 0) {
        effects.splice(i, 1);
      }
    }
    
    if(enableHUD) DrawHUD();
    stateMgr.Process();
    window.requestAnimationFrame(update);
  }

  let proBack = []
    function onbackColorChanged(){
      proBack = hexToHSL(backColor)
    }

    let backgroundEaseHue = 0;
    let backgroundEaseLit = 0;
    let backgroundEaseSat = 0
    let gCycle = 0
    function backgroundHandler(){
        switch(backgroundMode){
            case "Color Cycle": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Color Cycle Ambience": 
            copyScreen(ambienceAlpha / 100)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Custom": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            break;
            case "Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Custom Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Ambience Audio Visualizer": 
            copyScreenAudio(ambienceAlpha / 100)
            break;
            case "Custom Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
            case "Color Cycle Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)

    function sprintHelp(hue){

  let carSVG = "m221.34,32h-1.21v-8.04c-3.85-5.61-71.89-7.6-71.89-7.6L127.66,1.28c-6.39-1.76-47.34,0-47.34,0l-28.73,8.15C40.68,15.48,2.81,19.12,2.81,19.12c-1.54.88-1.54,8.48-1.54,8.48-2.75,1.87,2.75,5.83,2.75,5.83l3.52,4.51s36,4.4,58.57,6.72c22.57,2.31,127.6-1.32,127.6-1.32,11.78-.33,21.91-5.94,21.91-5.94,7.16.44,5.72-5.39,5.72-5.39ZM84.5,14.05l14.64-6.39h20.92l7.71,7.72s-39.41.64-43.27-1.34Z"

  function Wave(color, direction) {
    this.color = color;
    this.direction = direction;
    this.lifetime = 300;
    this.draw = function () {
      if (this.direction == "up") {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.moveTo(160, this.lifetime - 100);
        ctx.lineTo(320, this.lifetime);
        ctx.lineTo(320, this.lifetime + 50);
        ctx.lineTo(160, this.lifetime - 50);
        ctx.lineTo(0, this.lifetime + 50);
        ctx.lineTo(0, this.lifetime);
        ctx.lineTo(160, this.lifetime - 100);
        ctx.fill();
      } else if (this.direction = "down") {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.moveTo(160, 300 - this.lifetime);
        ctx.lineTo(320, 200 - this.lifetime);
        ctx.lineTo(320, 100 - this.lifetime);
        ctx.lineTo(160, 200 - this.lifetime);
        ctx.lineTo(0, 100 - this.lifetime);
        ctx.lineTo(0, 200 - this.lifetime);
        ctx.lineTo(160, 300 - this.lifetime);
        ctx.fill();
      }
      this.lifetime -= 10;
    };
  };

  function reversePulseRippleState(color, hollow) {
    this.start = new Date().getTime();
    this.duration = 2000;
    this.count = 2000;
    this.color = color;
    this.isHollow = hollow;

    this.Process = function () {
      this.elapsed = new Date().getTime() - this.start;

      this.Draw();

    this.Draw = function () {

        ctx.lineWidth = 20;
        ctx.beginPath();
        ctx.arc(160, 100, 200 * pctUp, 0, 2 * Math.PI);
        ctx.stroke();
      } else {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(160, 100, 200 * pctUp, 0, 2 * Math.PI);

      if (this.count < 100) {

  function tookHit(hue) {
    this.lifetime = 25;

    this.draw = function () {

  function effectPulse(hue) {

      ctx.arc(160, 100, this.lifetime, 0, Math.PI * 2);

  function PulseRippleState(color, hollow, duration) {
    this.start = new Date().getTime();
    this.duration = duration;
    this.count = 2000;
    this.color = color;
    this.isHollow = hollow;

    this.Process = function () {
      this.elapsed = new Date().getTime() - this.start;
      if (this.elapsed > this.duration) {
        stateMgr.Pop();
      }
      this.Draw();
    };

    this.Draw = function () {
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, 320, 200);
      var pctUp = this.count / 2000;
      if (this.isHollow) {
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 20;
        ctx.beginPath();
        ctx.arc(160, 100, 200 - 200 * pctUp, 0, 2 * Math.PI);
        ctx.stroke();
      } else {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(160, 100, 200 - 200 * pctUp, 0, 2 * Math.PI);
        ctx.fill();
      }

      if (this.count < 100) {
        this.count = 2000;
      } else {
        this.count -= 75;
      }
    };
  }

  function StateHandler() {
    var stack = [];
    var state = null;

    var updateState = function () {
      if (stack.length > 0) {
        state = stack[stack.length - 1];
      } else {
        state = null;
      }
    };

    this.Push = function (newState) {
      stack.push(newState);
      updateState();
    };

    this.Pop = function () {
      stack.pop();
      updateState();
    };

    this.Process = function () {
      if (state != null) {
        state.Process();
      }
    };
  }

  function Meter(count, callback) {
    this.size = count;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    var values = [];

    this.setValue = function (updatedValue) {
      // Add and shift.
      values.push(updatedValue);
      if (values.length > this.size) {
        values.shift();
      }

      // Exit early if we've got a long-term match.
      for (var i = 0; i < values.length - 1; i++) {
        if (values[i] !== values[i + 1]) return;
      }

      // We got here, so we've got a matching value collection.
      if (this.value !== values[0]) {
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        callback();
      }
    };
  }

    function StrokeRect(x, y, width, height, color, stroke){
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = stroke
      ctx.rect(x, y, width, height);
      ctx.stroke()
    }

    function hexToHSL(hex) {
      var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  
      var r = parseInt(result[1], 16);
      var g = parseInt(result[2], 16);
      var b = parseInt(result[3], 16);
  
      (r /= 255), (g /= 255), (b /= 255);
      var max = Math.max(r, g, b),
        min = Math.min(r, g, b);
      var h,
        s,
        l = (max + min) / 2;
  
      if (max === min) {
        h = s = 0; // achromatic
      } else {
        var d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r:
            h = (g - b) / d + (g < b ? 6 : 0);
            break;
          case g:
            h = (b - r) / d + 2;
            break;
          case b:
            h = (r - g) / d + 4;
            break;
        }
        h /= 6;
      }
  
      s = s * 100;
      s = Math.round(s);
      l = l * 100;
      l = Math.round(l);
      h = Math.round(360 * h);
  
      return [h, s, l];
    }

    let audioScreenSat = 0
    let audioScreenLit = 0
    function copyScreenAudio(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      audioScreenSat += (engine.audio.density * 100 - audioScreenSat) / 10
      audioScreenLit += (engine.audio.density * 100 - audioScreenLit) / 10
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        ctx.fillStyle = `hsla(${hue[iZone]}, ${sat[iZone] * (audioScreenSat / 200 + .5)}%, ${lightness[iZone] * (audioScreenLit / 100)}%, ${alpha})`;
        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }
  
    function copyScreen(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        ctx.fillStyle = `hsla(${(backgroundMode == "Custom Ambience" ? proBack[0] : hue[iZone] + gCycle * (backgroundMode == "Color Cycle Ambience"))}, ${sat[iZone]}%, ${lightness[iZone]}%, ${alpha})`;
        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }

  function onEngineReady() {
    // Grab canvas and rendering context.
    canvas = document.getElementById("exCanvas");
