<body style="margin: 0; padding: 0; background: #000;">
    <canvas id="exCanvas" width="320" height="200"></canvas>
</body>
  
<script>
    // Canvas initialization
    const canvas = document.getElementById('exCanvas');
    const ctx = canvas.getContext('2d');
    const width = 320;
    const height = 200;
    let effects = [];

    let InGameYellowMeter = new Meter(5, inGameCallback)
    let InGameGreenMeter = new Meter(5, inGameCallback)
    let InGameRedMeter = new Meter(5, inGameCallback)
    let InGame2Meter = new Meter(5, inGameCallback)
    let NotYellowMeter = new Meter(2, inGameCallback)

    let HealthCheckMeter = new Meter(10, healthCallback)
    let HealthBarMeter = new Meter(5, healthCallback)

    let ShieldCyanMeter = new Meter(5, energyCallback)

    let EnergyCheckMeter = new Meter(10, energyCallback)
    let EnergyBarMeter = new Meter(5, energyCallback)
    // let EnergyNotMeter = new Meter(2, energyCallback)

    let VitalCheckMeter = new Meter(10, vitalCallback)
    let VitalBarMeter = new Meter(5, vitalCallback)

    let WaterBlueMeter = new Meter(5, waterCallback)
    let WaterRedMeter = new Meter(5, waterCallback)

    let RideFuelMeter = new Meter(5, rideCallback)
    let RideBlackMeter = new Meter(5, rideCallback)
    let RideNotBlackMeter = new Meter(2, rideCallback)
    let RideNotYellowMeter = new Meter(2, rideCallback)
    

    let LevelUpMeter = new Meter(20, levelCallback)
    let LevelUpNotOrangeMeter = new Meter(20, levelCallback)
    let LevelUpNotOrange2Meter = new Meter(20, levelCallback)

    let SunYellowMeter = new Meter(5, sunCallback)
    let SunRedMeter = new Meter(5, sunCallback)

    let WormMeter = new Meter(5, wormCallback)

    //#region Update
    function update() {
      DrawRect(0, 0, 320, 200, "black")
      backgroundHandler()

      InGameYellowMeter.setValue(engine.vision.inGameYellow1)
      InGameGreenMeter.setValue(engine.vision.inGameGreen)
      InGameRedMeter.setValue(engine.vision.inGameRed)
      InGame2Meter.setValue(engine.vision.inGameYellow2)
      NotYellowMeter.setValue(engine.vision.inGameNotYellow)

      HealthCheckMeter.setValue(engine.vision.healthCheckRed)
      HealthBarMeter.setValue(engine.vision.healthBarRed)
      ShieldCyanMeter.setValue(engine.vision.shieldCyan)

      EnergyCheckMeter.setValue(engine.vision.energyCheckYellow)
      EnergyBarMeter.setValue(engine.vision.energyBarYellow)
      // EnergyNotMeter.setValue(engine.vision.energyCheckNotYellow)

      VitalCheckMeter.setValue(engine.vision.vitalCheckGreen)
      VitalBarMeter.setValue(engine.vision.vitalBarGreen)

      WaterBlueMeter.setValue(engine.vision.waterBlue)
      WaterRedMeter.setValue(engine.vision.vitalRed)

      RideFuelMeter.setValue(engine.vision.rideYellow)
      RideBlackMeter.setValue(engine.vision.rideBlack)
      RideNotBlackMeter.setValue(engine.vision.rideNotBlack)
      RideNotYellowMeter.setValue(engine.vision.rideNotYellow)

      LevelUpMeter.setValue(engine.vision.levelUpOrange)
      LevelUpNotOrangeMeter.setValue(engine.vision.levelUpNotOrange)
      LevelUpNotOrange2Meter.setValue(engine.vision.levelUpNotOrange2)

      SunYellowMeter.setValue(engine.vision.sunYellow)
      SunRedMeter.setValue(engine.vision.sunRed)

      WormMeter.setValue(engine.vision.wormRed)

      effects.forEach((ele, i) => {
        ele.draw()
        if(ele.lifetime <= 0){
          effects.splice(i, 1)
        }
      })

      if(adjOn){
        DrawRect(hpX * 3.2, hpY * 2, hpWidth * 3.2, hpHeight * 2, "red")
        DrawRect(energyX * 3.2, energyY * 2, energyWidth * 3.2, energyHeight * 2, "yellow")
      }

      window.requestAnimationFrame(update);
    };

    let gInGame = false
    function inGameCallback(){
      if((InGameYellowMeter.value >= .95 || InGameGreenMeter.value >= .95 || InGameRedMeter.value >= .95) && InGame2Meter.value >= .95 && engine.vision.inGameNotYellow <= .05) gInGame = true
      else if (InGameYellowMeter.value <= .25 && InGameGreenMeter.value <= .25 && InGameRedMeter.value <= .25) gInGame = false

      checkZone()
    }

    let zoneState = "no combat"
    function checkZone(){
      if(gInGame && zoneOn){
        if(InGameYellowMeter.value >= .95 && zoneState != "PVE"){
          zoneState = "PVE"
          effects.push(new zone(30))
        }
        else if (InGameGreenMeter.value >= .95 && zoneState != "safe"){
          zoneState = "safe"
          effects.push(new zone(100))
        }
        else if (InGameRedMeter.value >= .95 && zoneState != "PVP"){
          zoneState = "PVP"
          effects.push(new zone(350))
        }
      }
    }

    let lowHealthGoing = false
    let healthHUDGoing = false
    function healthCallback(){
      if(gInGame && HealthCheckMeter.value >= .95 && HealthBarMeter.value <= .25 && engine.vision.healthCheckNotRed <= .05 && !lowHealthGoing){
        lowHealthGoing = true
        if(healthOn) effects.push(new lowHealth())
      } else if (!gInGame || (gInGame && HealthCheckMeter.value >= .95 && HealthBarMeter.value > .25 && lowHealthGoing) || (gInGame && HealthCheckMeter.value <= .05)){
        lowHealthGoing = false
        if(gInGame && healthOn && HealthBarMeter.value >= .25 && engine.vision.healthCheckNotRed <= .05) effects.push(new healthUp())
      }

      if(gInGame && HealthCheckMeter.value >= .95 && HealthBarMeter.value >= .05 && engine.vision.healthCheckNotRed <= .05 && !healthHUDGoing){
        healthHUDGoing = true
        if(hpOn) effects.push(new healthHUD())
      } else if (!gInGame || (gInGame && HealthCheckMeter.value <= .05)){
        healthHUDGoing = false
      }
    }

    let lowEnergyGoing = false
    let energyHUDGoing = false
    let shieldGoing = false
    function energyCallback(){
      //low energy, shield up, shield down
      if(gInGame && EnergyCheckMeter.value >= .95 && EnergyBarMeter.value <= .25 && engine.vision.energyCheckNotYellow <= .05 && !lowEnergyGoing){
        lowEnergyGoing = true
        if(energyOn) effects.push(new lowEnergy())
      } else if (!gInGame || (gInGame && EnergyCheckMeter.value >= .95 && EnergyBarMeter.value > .25 && engine.vision.energyCheckNotYellow <= .05) || engine.vision.energyCheckNotYellow >= .95){
        lowEnergyGoing = false
      }

      if(gInGame && EnergyCheckMeter.value >= .95 && EnergyBarMeter.value >= .05 && engine.vision.energyCheckNotYellow <= .05 && !energyHUDGoing){
        energyHUDGoing = true
        if(energyOn) effects.push(new energyHUD())
      } else if (!gInGame || (gInGame && EnergyCheckMeter.value <= .05)){
        energyHUDGoing = false
      }

      if(gInGame && ShieldCyanMeter.value >= .9 && EnergyCheckMeter.value >= .95 && engine.vision.energyCheckNotYellow <= .05 && !shieldGoing){
        shieldGoing = true
        if(shieldOn) effects.push(new shieldsUp())
      } else if (!gInGame || (gInGame && ShieldCyanMeter.value <= .05 && shieldGoing)){
        shieldGoing = false
        if(shieldOn && gInGame) effects.push(new shieldsDown())
      }
    }

    let lowVitalGoing = false
    function vitalCallback(){
      //Vital HUD, low vital
      if(gInGame && VitalCheckMeter.value >= .95 && VitalBarMeter.value <= .25 && engine.vision.vitalCheckNotGreen <= .05 && !lowVitalGoing){
        lowVitalGoing = true
        if(vitalOn) effects.push(new lowVital())
      } else if (!gInGame || (gInGame && VitalCheckMeter.value >= .95 && VitalBarMeter.value > .25 && engine.vision.vitalCheckNotGreen <= .05 && lowVitalGoing)) lowVitalGoing = false
    }

    let waterBlueGoing = false
    let waterRedGoing = false
    function waterCallback(){
      //sheltered, not sheltered
      if(gInGame && HealthCheckMeter.value >= .95 && WaterBlueMeter.value >= .95 && !waterBlueGoing){
        waterBlueGoing = true
        waterRedGoing = false
        if(waterOn) effects.push(new sheltered())
      }
      if(gInGame && HealthCheckMeter.value >= .95 && WaterRedMeter.value >= .95 && !waterRedGoing){
        waterBlueGoing = false
        waterRedGoing = true
        if(waterOn) effects.push(new exposed())
      }
    }
 
    let rideGoing = false
    function rideCallback(){
      //in vehicle
      if(gInGame && RideBlackMeter.value >= .95 && RideFuelMeter.value >= .95 && engine.vision.rideNotBlack <= .05 && engine.vision.rideNotYellow <= 0.05 && !rideGoing){
        rideGoing = true
        if(rideOn) effects.push(new inVehicle())
      } else if (!gInGame || (gInGame && RideBlackMeter.value <= .05 && RideFuelMeter.value <= .05)){
        rideGoing = false
      }
    }

    let levelUpGoing = false
    function levelCallback(){
      //level up
      if(gInGame && LevelUpMeter.value >= .95 && engine.vision.levelUpNotOrange <= .05 && engine.vision.levelUpNotOrange2 <= 0.05 && !levelUpGoing){
        levelUpGoing = true
        if(questOn) effects.push(new levelUp())
      } else if (!gInGame || (gInGame && LevelUpMeter.value <= .05)){
        levelUpGoing = false
      }
    }

    let sunYellowGoing = false
    let sunRedGoing = false
    function sunCallback(){
      //sun warning, heatstroke
      if(gInGame && HealthCheckMeter.value >= .95 && SunYellowMeter.value >= .95 && engine.vision.sunNotYellow <= .05 && !sunYellowGoing){
        sunYellowGoing = true
        if(heatOn) effects.push(new heatWarning(60))
      } else if (!gInGame || (HealthCheckMeter.value >= .95 && SunYellowMeter.value <= .05)) sunYellowGoing = false
      if(gInGame && HealthCheckMeter.value >= .95 && SunRedMeter.value >= .95 && engine.vision.sunNotRed <= .05 && !sunRedGoing){
        sunRedGoing = true
        if(heatOn) effects.push(new heatWarning(0))
      } else if (!gInGame || (HealthCheckMeter.value >= .95 && SunRedMeter.value <= .05)) sunRedGoing = false
    }

    let wormGoing = false
    function wormCallback(){
      //worm warning
      if(gInGame && WormMeter.value >= .95 && engine.vision.wormNotRed <= .05 && !wormGoing){
        wormGoing = true
        if(wormOn) effects.push(new worm())
      } else if (!gInGame || (gInGame && WormMeter.value <= .05)){
        wormGoing = false
      }
    }

    function zone(hue){
      this.hue = hue
      this.alpha = 0
      this.rad = 1
      this.draw = function(){
        DrawRect(0, 0, 320, 200, getColorString(this.hue, 100, 20, this.alpha))
        DrawCircle(160, 100, this.rad, getColorString(this.hue, 100, 60, this.alpha))
        if(this.half) this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
        else this.alpha <= .95 ? this.alpha += .05 : this.rad < 250 ? this.rad += 5 : this.half = true
        this.hue += .25
      }
    }

    function worm(){
        this.rot = 0
        this.alpha = 0
        this.draw = function(){
            DrawRect(0, 0, 320, 200, getColorString(0, 0, 0, this.alpha))
            ctx.save()
            ctx.translate(160, 100)
            ctx.rotate(-Math.PI / 2)
            ctx.translate(-160, -100)
            for(let i = 0; i < 10; i++){
                let x = Math.cos(this.rot * i) * i * 20 + 60
                let y = Math.sin(this.rot * i) * i * 15 + (Math.sin(-Date.now() / 1000 - 400) * (110 - i * 10) + 100)
                DrawCircle(x, y, 50 - i * 2, getColorString(i * 3, 100, 50, 1))
                if(i == 9){
                    for(let j = 0; j < 3; j++){
                        ctx.translate(x, y)
                        ctx.rotate(Math.PI * 2 / 3)
                        ctx.translate(-x, -y)
                        DrawTriangle(x - 25, y + 20, x + 25, y + 20, x, y + 80, getColorString(i * 3, 100, 50, 1))
                    }
                }
            }
            ctx.restore()
            if(Math.random() > .5) effects.push(new wormHelp(Math.random() * 320, 200))
            this.rot = Math.sin(Date.now() / 1000) / 7
            if(!wormGoing) this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
            else if(this.alpha <= .49) this.alpha += .01
        }
    }

    function wormHelp(x, y){
        this.x = x
        this.y = y
        this.vx = 3 - Math.random() * 6
        this.vy = -Math.random() * 3
        this.rad = 50
        this.alpha = 0
        this.draw = function(){
            DrawCircle(this.x, this.y, this.rad, getColorString(20, 60, 30, this.alpha))
            if(this.alpha <= .95) this.alpha += .05
            this.rad > 1 ? this.rad -= 1 : this.lifetime = 0
            this.x += this.vx
            this.y += this.vy
        }
    }

    function heatWarning(hue){
      this.yellow = sunYellowGoing
      this.red = sunRedGoing
      this.hue = hue
        this.draw = function(){
          if(Math.random() < .5) effects.push(new heatHelp(this.hue))
          if(this.yellow != sunYellowGoing || this.red != sunRedGoing) this.lifetime = 0
        }
    }

    function heatHelp(hue){
      this.y = 220
      this.x = Math.random() * 320
      this.hue = hue
      this.radius = 20
      this.mod = Math.random() * 1000
      this.draw = function(){
        DrawCircle(this.x, this.y, this.radius, getColorString(this.hue, 100, 50, 1))
        this.radius >= 1 ? this.radius -= .5 : this.lifetime = 0
        this.y -= 5
        this.x += Math.sin((Date.now() - this.mod) / 300) * 2
      }
    }

    function levelUp(){
        this.alpha = 0
        this.lifetime = 100
        this.draw = function(){
            let grad = ctx.createRadialGradient(160, 100, 10, 160, 100, 200)
            grad.addColorStop(0, getColorString(40, 100, 50 - Math.abs(50 - this.lifetime), this.lifetime / 100))
            grad.addColorStop(1, getColorString(10, 100, 50 - Math.abs(50 - this.lifetime), 1))
            DrawRect(0, 0, 320, 200, grad)
            ctx.save()
            ctx.translate(160, 100)
            ctx.rotate(Math.PI / 4)
            ctx.translate(-160, -100)
            DrawRect(60 + this.lifetime, this.lifetime, 500 - this.lifetime * 4, 500 - this.lifetime * 4, getColorString(30, 100, 50, this.alpha * this.lifetime / 50))
            DrawRect(60 + this.lifetime, this.lifetime, 350 - this.lifetime * 3, 350 - this.lifetime * 3, getColorString(45, 100, 50, this.alpha * this.lifetime / 50))
            DrawRect(60 + this.lifetime, this.lifetime, 200 - this.lifetime * 2, 200 - this.lifetime * 2, getColorString(60, 100, 50, this.alpha * this.lifetime / 50))
            this.lifetime-=.5
            if(this.alpha <= .99) this.alpha += .01
            ctx.restore()
        }
    }

    function inVehicle(){
        this.alpha = 0
        this.count = 0
        this.draw = function(){
            DrawRect(0, 0, 320, 200, getColorString(210, 100, 60, this.alpha))
            DrawRect(0, 100, 320, 100, getColorString(30, 60, 40, this.alpha))
            if(this.count == 0) effects.push(new vehicleHelp())
            this.count < 3 ? this.count++ : this.count = 0
            if(!rideGoing) this.alpha >= .1 ? this.alpha -= .1 : this.lifetime = 0
            else this.alpha <= .95 ? this.alpha += .05 : this.alpha = 1
        }
    }

    function vehicleHelp(){
        this.x = 350
        this.y = Math.random() * 200
        this.rad = Math.random() * 40 + 20
        this.hue = Math.random() * 20 + 10
        this.draw = function(){
            DrawCircle(this.x, this.y, this.rad, getColorString(this.hue, 100, 100 - this.y / 1.5, .5))
            this.x > -50 ? this.x -= 5 : this.lifetime = 0
        }
    }

    function exposed(){
        this.count = 0
        this.lifetime = 300
        this.draw = function(){
            if(this.count == 0) effects.push(new exposedHelp())
            this.count < 5 ? this.count++ : this.count = 0
            this.lifetime--
        }
    }

    function exposedHelp(){
        this.y = 200
        this.x = Math.random() * 320
        this.draw = function(){
            DrawCircle(this.x, this.y, this.y / 4 + 1, getColorString(-this.y, 100, 50, 1 - Math.abs(100 - this.y)/100))
            this.y > 0 ? this.y -= 3 : this.lifetime = 0
        }
    }

    function sheltered(){
        this.count = 0
        this.lifetime = 300
        this.draw = function(){
            if(this.count == 0) effects.push(new shelterHelp())
            this.count < 8 ? this.count++ : this.count = 0
            this.lifetime--
        }
    }

    function shelterHelp(){
        this.y = 0
        this.x = Math.random() * 320
        this.draw = function(){
            DrawEllipse(this.x, this.y, 30, 70, 0, getColorString(190 + this.y / 3, 100, 50, 1 - (Math.abs(100 - this.y))/100))
            this.y < 250 ? this.y += 3 : this.lifetime = 0
        }
    }

    function lowVital(){
        this.alpha = 0
        this.width = 320
        this.draw = function(){
            DrawRect(0, 0, this.width, 200, getColorString(this.width / 3, 100, this.width / 6.4, this.alpha))
            if(this.alpha <= .7) this.alpha += .05
            else this.width += (0 - this.width) / 50
            if(this.width < 1) this.lifetime = 0
        }
    }

    function shieldsDown(){
        this.alpha = 0
        this.y = 0
        this.draw = function(){
            DrawRect(0, this.y, 320, 200, getColorString(190 + this.y / 3, 100, 50, this.alpha))
            this.alpha <= .35 ? this.alpha += .05 : this.y < 200 ? this.y += 6 : this.lifetime = 0
        }
    }

    function shieldsUp(){
        this.count = 0
        this.lifetime = 100
        this.draw = function(){
            if(this.count == 0) effects.push(new shieldUpHelp())
            this.count < 5 ? this.count++ : this.count = 0
            this.lifetime--
        }
    }

    function shieldUpHelp(){
        this.x = Math.random() * 320
        this.y = Math.random() * 200
        this.rad = 1
        this.draw = function(){
            DrawStroke(this.x, this.y, this.rad, getColorString(190 + this.rad / 2, 100, 50, 1 - this.rad / 100), 40)
            DrawStroke(this.x, this.y - this.rad / 2, this.rad / 2, getColorString(190, 100, 80, .5 - this.rad / 200), 10)
            this.rad < 100 ? this.rad += 2 : this.lifetime = 0
        }
    }

    function energyHUD(){
        this.val = 0
        this.draw = function(){
            this.val += (EnergyBarMeter.value - this.val) / 20
            DrawRect(energyX * 3.2, energyY * 2, this.val * energyWidth * 3.2, energyHeight * 2, "yellow")
        }
    }

    function lowEnergy(){
        this.alpha = 0
        this.draw = function(){
            let mod = Math.sin(Date.now() / 200)
            let grad = ctx.createLinearGradient(160, 0, 160, 200)
            grad.addColorStop(0, getColorString(60, 100, 50, 0))
            grad.addColorStop(1, getColorString(20, 100, 50, mod * this.alpha))
            DrawRect(0, 0, 320, 200, grad)
            this.alpha < 1 ? this.alpha += .05 : this.alpha = 1
            if(!lowEnergyGoing) this.lifetime = 0
        }
    }

    function healthHUD(){
        this.val = 0
        this.val2 = 0
        this.draw = function(){
            if(this.val > this.val2) this.val2 = this.val
            DrawRect(hpX * 3.2, hpY * 2, this.val2 * hpWidth * 3.2, hpHeight * 2, getColorString(0, 100, 75, 1))
            DrawRect(hpX * 3.2, hpY * 2, this.val * hpWidth * 3.2, hpHeight * 2, "red")
            if(!healthHUDGoing){
              this.val >= .05 ? this.val -= .05 : this.lifetime = 0
              this.val2 = this.val
            } else {
              this.val += (HealthBarMeter.value - this.val) / 20
              this.val2 += (HealthBarMeter.value - this.val2) / 50
            }
        }
    }

    function healthUp(){
        this.y = 240
        this.draw = function(){
            let grad = ctx.createLinearGradient(160, this.y - 40, 160, this.y + 40)
            grad.addColorStop(0, getColorString(120, 100, 50, 0))
            grad.addColorStop(.5, getColorString(100, 100, 50, 1))
            grad.addColorStop(1, getColorString(80, 100, 50, 0))
            this.y > -20 ? this.y -= 8 : this.lifetime = 0
            DrawRect(0, 0, 320, 200, grad)
        }
    }

    function lowHealth(){
        this.alpha = 0
        this.draw = function(){
            let mod = Math.sin(Date.now() / 200)
            let grad = ctx.createLinearGradient(160, 0, 160, 200)
            grad.addColorStop(0, getColorString(0, 100, 50, mod * this.alpha))
            grad.addColorStop(1, getColorString(0, 100, 50, 0))
            DrawRect(0, 0, 320, 200, grad)
            this.alpha < 1 ? this.alpha += .05 : this.alpha = 1
            if(!lowHealthGoing) this.lifetime = 0
        }
    }

    //#endregion
    //#region Background Modes
    // Background Configuration
    let proBack = [0, 0, 0];
    function onbackColorChanged() {
        proBack = hexToHSL(backColor);
    }

    // Audio and Color Cycle State
    let audioEase = { sat: 0, lit: 0 };
    let gCycle = 0;
    
    // Background Utility Functions
    function updateAudioEase() {
        const targetDensity = engine.audio.density * 100;
        audioEase.sat += (targetDensity - audioEase.sat) / 10;
        audioEase.lit += (targetDensity - audioEase.lit) / 10;
    }

    function getColorString(hue, sat, lit, alpha) {
        return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`;
    }

    function updateColorCycle() {
        gCycle = (gCycle + 0.5) % 360;
    }

    // Main Background Handler
    function backgroundHandler() {
        const alpha = ambienceAlpha / 100;

        // Handle color cycling first if needed
        if (backgroundMode.includes("Color Cycle")) {
            updateColorCycle();
        }

        // Handle audio processing if needed
        if (backgroundMode.includes("Audio")) {
            updateAudioEase();
        }

        // Render background based on mode
        if (backgroundMode.includes("Ambience")) {
            if (backgroundMode === "Ambience Audio Visualizer") {
                copyScreenAudio(alpha);
            } else {
                copyScreen(alpha);
            }
            return;
        }

        // Handle custom and cycle modes
        const hue = proBack[0] + (backgroundMode.includes("Color Cycle") ? gCycle : 0);
        const sat = backgroundMode.includes("Audio") ? audioEase.sat * 0.33 + 66 : proBack[1];
        const lit = backgroundMode.includes("Audio") ? audioEase.lit * 0.9 + 10 : proBack[2];
        
        DrawRect(0, 0, 320, 200, getColorString(hue, sat, lit, alpha));
    }

    // Zone Configuration Constants
    const ZONE_COLS = 28;
    const ZONE_ROWS = 20;
    const TOTAL_ZONES = ZONE_COLS * ZONE_ROWS;

    function copyScreenAudio(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat = new Int8Array(engine.zone.saturation)
        const hue = new Int16Array(engine.zone.hue)
        
        const width = 320 / ZONE_COLS
        const height = 200 / ZONE_ROWS
        
        // Use the global audioEase values we already calculated
        const satMultiplier = audioEase.sat / 200 + 0.5
        const litMultiplier = audioEase.lit / 100

        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const x = col * width
            const y = row * height
            
            ctx.fillStyle = getColorString(
                hue[iZone],
                sat[iZone] * satMultiplier,
                lightness[iZone] * litMultiplier,
                alpha
            )
            ctx.fillRect(x, y, width, height)
        }
    }
  
    function copyScreen(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat = new Int8Array(engine.zone.saturation)
        const hue = new Int16Array(engine.zone.hue)
        
        const width = 320 / ZONE_COLS
        const height = 200 / ZONE_ROWS
        
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const x = col * width
            const y = row * height
            
            const finalHue = backgroundMode === "Custom Ambience" 
                ? proBack[0] 
                : hue[iZone] + (backgroundMode === "Color Cycle Ambience" ? gCycle : 0)
            
            ctx.fillStyle = getColorString(
                finalHue,
                sat[iZone],
                lightness[iZone],
                alpha
            )
            ctx.fillRect(x, y, width, height)
        }
    }

  function DrawLine(start, end, color, stroke){
    ctx.beginPath()
    ctx.moveTo(start[0], start[1])
    ctx.lineTo(end[0], end[1])
    ctx.strokeStyle = color
    ctx.lineWidth = stroke
    ctx.stroke()
  }

  function DrawEllipse(x, y, width, height, rotation, color){
    ctx.beginPath()
    ctx.ellipse(x, y, width, height, rotation, 0, Math.PI * 2)
    ctx.fillStyle = color
    ctx.fill()
  }

  function DrawTriangle(cord1X, cord1Y, cord2X, cord2Y, cord3X, cord3Y, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.moveTo(cord1X, cord1Y);
    ctx.lineTo(cord2X, cord2Y);
    ctx.lineTo(cord3X, cord3Y);
    ctx.lineTo(cord1X, cord1Y);
    ctx.fill();
  };

  function DrawCircle(x, y, radius, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.fill();
  };

  function DrawStroke(x, y, radius, color, stroke) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = stroke;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.stroke();
  };

  function DrawRect(x, y, width, height, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
  };

  function hexToRgb(hex) {
    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
      r: parseInt(result[1], 16),
      g: parseInt(result[2], 16),
      b: parseInt(result[3], 16)
    } : null;
  }

  function hexToHSL(hex) {
      const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || [];
      const rgb = [r, g, b].map(x => parseInt(x, 16) / 255);
      const max = Math.max(...rgb);
      const min = Math.min(...rgb);
      const l = (max + min) / 2;
      
      if (max === min) return [0, 0, Math.round(l * 100)];
      
      const d = max - min;
      const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      
      let h;
      const [nr, ng, nb] = rgb;
      if (max === nr) h = (ng - nb) / d + (ng < nb ? 6 : 0);
      else if (max === ng) h = (nb - nr) / d + 2;
      else h = (nr - ng) / d + 4;
      
      return [
        Math.round(h * 60),
        Math.round(s * 100),
        Math.round(l * 100)
      ];
    }
  
    function Meter(size, callback) {
      this.size = size;
      this.value = 0;
      this.diff = 0;
      this.increased = false;
      this.decreased = false;
      var values = [];
  
      this.setValue = function (updatedValue) {
        values.push(updatedValue);
        if (values.length > this.size) {
          values.shift();
        }
  
        for (var i = 0; i < values.length - 1; i++) {
          if (values[i] !== values[i + 1]) return;
        }
        if (this.value !== values[0]) {
          this.diff = Math.abs(this.value - values[0]);
          this.increased = this.value < values[0];
          this.decreased = this.value > values[0];
          this.value = values[0];
          callback();
        }
      }
    }
    //#endregion


  window.requestAnimationFrame(update);
</script>
