  <script>
    var canvas, ctx;
    canvas = document.getElementById('exCanvas');
    ctx = canvas.getContext('2d');
    var width = 320;
    var height = 200;
    var effects = [];
    let gInGame = false
    let gInCombat = false

    let HealthHUD = new healthHUD()
    let StaminaHUD = new staminaHUD()

    let InGame01Meter = new Meter(5, inGameHandler)
    let InGame02Meter = new Meter(5, inGameHandler)

    let InCombat01Meter = new Meter(5, inCombatHandler)
    let InCombat02Meter = new Meter(5, inCombatHandler)

    let Health1Meter = new Meter(2, healthHandler)
    let Health2Meter = new Meter(2, healthHandler)
    let Health3Meter = new Meter(2, healthHandler)
    let Health4Meter = new Meter(2, healthHandler)
    let Health5Meter = new Meter(2, healthHandler)
    let RedHealthMeter = new Meter(5, healthHandler)

    let Stamina1Meter = new Meter(2, staminaHandler)
    let Stamina2Meter = new Meter(2, staminaHandler)
    let Stamina3Meter = new Meter(2, staminaHandler)

    let PalicoMeter = new Meter(5, palicoHandler)

    let TimerConfirmGreyMeter = new Meter(10, timerHandler)
    let TimerConfirmRedMeter = new Meter(10, timerHandler)
    let Timer1Meter = new Meter(8, timerHandler)
    let Timer2Meter = new Meter(8, timerHandler)
    let Timer3Meter = new Meter(8, timerHandler)
    let Timer4Meter = new Meter(8, timerHandler)

    let SharpLengthMeter = new Meter(5, sharpHandler)
    let SharpColorMeter = new Meter(1, sharpHandler)
    let SharpConfirmMeter = new Meter(5, sharpHandler)
   
    function update() {
      DrawRect(0, 0, 320, 200, "black")
      backgroundHandler()


      InGame01Meter.setValue(engine.vision.inGame01)
      InGame02Meter.setValue(engine.vision.inGame02)

      InCombat01Meter.setValue(engine.vision.inCombat01)
      InCombat02Meter.setValue(engine.vision.inCombat02)

      Health1Meter.setValue(engine.vision.health1)
      Health2Meter.setValue(engine.vision.health2)
      Health3Meter.setValue(engine.vision.health3)
      Health4Meter.setValue(engine.vision.health4)
      Health5Meter.setValue(engine.vision.health5)
      RedHealthMeter.setValue(engine.vision.healthRed)

      Stamina1Meter.setValue(engine.vision.stamina1)
      Stamina2Meter.setValue(engine.vision.stamina2)
      Stamina3Meter.setValue(engine.vision.stamina3)

      PalicoMeter.setValue(engine.vision.palicoLow)

      TimerConfirmRedMeter.setValue(engine.vision.timerConfirmRed)
      TimerConfirmGreyMeter.setValue(engine.vision.timerConfirmGrey)
      Timer1Meter.setValue(engine.vision.timeYellow1)
      Timer2Meter.setValue(engine.vision.timeYellow2)
      Timer3Meter.setValue(engine.vision.timeYellow3)
      Timer4Meter.setValue(engine.vision.timeYellow4)

      SharpLengthMeter.setValue(engine.vision.sharpLength)
      SharpColorMeter.setValue(engine.vision.sharpColor[0])
      SharpConfirmMeter.setValue(engine.vision.sharpConfirm)
  
      effects.forEach((ele, i) => {
        ele.draw()
        if(ele.lifetime <= 0){
          effects.splice(i, 1)
        }
      })

      if(healthHUDGoing) HealthHUD.draw()
      if(staminaHUDGoing) StaminaHUD.draw()

      if(adjToggle){
        DrawRect(staminaX * 3.2, staminaY * 2, staminaWidth * 3.2, staminaHeight * 2, staminaColor)
        DrawRect(hpX * 3.2, hpY * 2, hpWidth * 3.2, hpHeight * 2, hpColor)
      }
  
      window.requestAnimationFrame(update);
    };

    function inGameHandler(){
      if(((InGame01Meter.value >= .95 && engine.vision.inGameNot <= .1) || (InGame02Meter.value >= .95 && engine.vision.inGameNot <= .1)) && !gInGame){
        gInGame = true

      } else if (InGame01Meter.value <= .05 && InGame02Meter.value <= .05 && gInGame){
        gInGame = false

      }
    }

    function inCombatHandler(){
      if((InCombat01Meter.value >= .95 || InCombat02Meter.value >= .95) && (engine.vision.inCombatNot <= .05 || (engine.vision.health1 > .2 && engine.vision.palicoLow > .2)) && gInGame && !gInCombat){
        gInCombat = true

      } else if (InCombat01Meter.value <= .05 && InCombat02Meter.value <= .05 && gInCombat){
        gInCombat = false
      }
    }


    let healthHUDGoing = false
    let redHealthGoing = false
    let lowHealthGoing = false
    function healthHandler(){
      if(gInGame && (Health1Meter.value >= .3 || Health2Meter.value >= .1) && !healthHUDGoing){ 
        healthHUDGoing = true
      }
      if(gInGame && gInCombat && RedHealthMeter.value >= .1 && RedHealthMeter.diff >= .05 && !redHealthGoing){
        redHealthGoing = true
        if(redHealthOn) effects.push(new redHealth())
      }
      if(gInGame && gInCombat && Health1Meter.value >= .2 && Health2Meter.value <= 0 && !lowHealthGoing){
        lowHealthGoing = true
        if(lowHealthOn) effects.push(new lowHealth())
      }
    }

    let staminaHUDGoing = false
    let lowStaminaGoing = false
    function staminaHandler(){
      if(gInGame && (Stamina1Meter.value >= .05 || Stamina2Meter.value >= .1) && !staminaHUDGoing){
        staminaHUDGoing = true
      }
      if(Stamina1Meter.value >= .05 && Stamina2Meter.value <= 0 
        && gInGame && gInCombat
        && (Health1Meter.value >= .2 || Health2Meter.value >= .15) 
        && !lowStaminaGoing){
        lowStaminaGoing = true
        if(lowStaminaOn) effects.push(new lowStamina())
      }
    }

    let palicoGoing = false  
    function palicoHandler(){
      if(gInGame && gInCombat && PalicoMeter.value <= .01 && !palicoGoing){
        palicoGoing = true
        if(palicoOn) effects.push(new palicoLow())
      }
    }

    let gTimer = false
    let timeGoing = false
    let timePhase = 0
    function timerHandler(){
      if(gInGame && gInCombat && TimerConfirmRedMeter.value >= .1 && TimerConfirmGreyMeter.value >= .95 && !gTimer) gTimer = true
      else if(!gInGame || (gInGame && TimerConfirmRedMeter.value <= .05 && TimerConfirmGreyMeter.value <= .05)) {
        gTimer = false
        timePhase = 0
      }
      if(gTimer && Timer1Meter.value >= .95 && timePhase != 1 && !timeGoing){
        timeGoing = true
        timePhase = 1
        if(timerOn) effects.push(new timeQuest(0))
      }
      if(gTimer && Timer2Meter.value >= .95 && timePhase != 2 && !timeGoing){
        timeGoing = true
        timePhase = 2
        if(timerOn) effects.push(new timeQuest(.25))
      }
      if(gTimer && Timer3Meter.value >= .95 && timePhase != 3 && !timeGoing){
        timeGoing = true
        timePhase = 3
        if(timerOn) effects.push(new timeQuest(.5))
      }
      if(gTimer && Timer4Meter.value >= .95 && timePhase != 4 && !timeGoing){
        timeGoing = true
        timePhase = 4
        if(timerOn) effects.push(new timeQuest(.75))
      }
    }

    let sharpGoing = false
    let sharpValue = 1
    let sharpColor = 120
    function sharpHandler(){
      if(gInGame && SharpConfirmMeter.value >= .95 && SharpLengthMeter.value >= .15 && !sharpGoing){
        sharpGoing = true
        sharpValue = SharpLengthMeter.value
        sharpColor = SharpColorMeter.value
      }
      if(gInGame && SharpConfirmMeter.value >= .95 && (Math.abs(SharpLengthMeter.value - sharpValue) >= .2 || Math.abs(SharpColorMeter.value - sharpColor) >= 30) && sharpGoing){
        sharpGoing = false
        sharpValue = SharpLengthMeter.value
        sharpColor = SharpColorMeter.value
        if(sharpOn) effects.push(new sharpness(SharpColorMeter.value))
      }
      if(!gInGame) sharpGoing = false
    }

    function sharpness(hue){
      this.hue = hue ? hue : 120
      this.rot = 0
      this.x = -50
      this.a = 0
      this.draw = function(){
          DrawRect(0, 0, 320, 200, getColorString(0, 0, 0, this.a / 4))
          ctx.save()
          ctx.translate(-50, 250)
          ctx.rotate(this.rot)
          ctx.translate(50, -250)
          DrawRect(-50, 250, 500, 150, getColorString(this.hue, 100, 40, this.a))
          DrawRect(this.x, 250, 80, 150, getColorString(0, 0, 100, this.a / 2))
          ctx.restore()
          this.x < 400 ? this.a < 1 ? this.a += .05 : this.a = 1 : this.a > .05 ? this.a -= .05 : this.lifetime = 0
          this.rot > -.79 ? this.rot += (-.8 - this.rot) / 10 : this.x < 500 ? this.x += 15 : this.x = 500
      }
  }

    function timeQuest(angle){
      this.angle = angle 
      this.a = 0
      this.val = 0
      this.rad = 1
      this.switch = false
      this.draw = function(){
          DrawStroke(160, 100, this.rad, getColorString(60, 100, 50, this.a), 15)
          if(this.rad < 300) this.rad += 5
          ctx.beginPath()
          ctx.moveTo(160, 100)
          ctx.arc(160, 100, 100, -Math.PI / 2, Math.PI * 2 * (this.val + .001) - Math.PI / 2, true)
          ctx.fillStyle = getColorString(60, 100, 30, this.a * .75)
          ctx.fill()
          ctx.beginPath()
          if(this.half) this.a >= .01 ? this.a -= .01 : this.lifetime = 0
          else this.a <= .95 ? this.a += .05 : this.val < this.angle ? this.val += (this.angle + .01 - this.val) / 20 : this.half = true
          ctx.save()
          ctx.translate(160, 100)
          ctx.rotate(this.val * 6.25)
          ctx.translate(-160, -100)
          ctx.moveTo(160, 100)
          ctx.lineTo(160, 0)
          ctx.strokeStyle = getColorString(60, 100, 75, this.a)
          ctx.lineWidth = 20
          ctx.stroke()
          ctx.restore()
          DrawCircle(160, 100, 10, getColorString(60, 100, 75, this.a))
          if(this.lifetime <= 0) timeGoing = false
      }
    }

    function lowStamina(){
      this.a = 0
      this.hue = 0
      this.switch = false
      this.draw = function(){
          let grad = ctx.createRadialGradient(160, 100, 10, 160, 100, 200)
          grad.addColorStop(0, getColorString(this.hue, 100, 50, 0))
          grad.addColorStop(1, getColorString(this.hue, 100, 50, 1 * this.a))
          DrawRect(0, 0, 320, 200, grad)
          if(!this.switch) this.hue < 59.5 ? this.hue += (60 - this.hue) / 8 : this.switch = true
          else this.hue > .5 ? this.hue += (0 - this.hue) / 8 : this.switch = false
          if(!gInGame || !gInCombat || (gInCombat && gInGame && Stamina1Meter.value >= .2)){
            lowStaminaGoing = false
            this.a >= .1 ? this.a -= .1 : this.lifetime = 0
          } else this.a <= .99 ? this.a += .01 : this.a = 1
      }
    }

    function lowHealth(){
      this.a = 0
      this.hue = 120
      this.switch = true
      this.draw = function(){
          let grad = ctx.createRadialGradient(160, 100, 10, 160, 100, 200)
          grad.addColorStop(0, getColorString(this.hue, 100, 50, 0))
          grad.addColorStop(1, getColorString(this.hue, 100, 50, 1 * this.a))
          DrawRect(0, 0, 320, 200, grad)
          if(!this.switch) this.hue < 119.5 ? this.hue += (120 - this.hue) / 8 : this.switch = true
          else this.hue > .5 ? this.hue += (0 - this.hue) / 8 : this.switch = false
          if(!gInGame || !gInCombat || Health1Meter.value > .2 ) {
            lowHealthGoing = false
            this.a >= .1 ? this.a -= .1 : this.lifetime = 0
          } else this.a <= .99 ? this.a += .01 : this.a = 1
      }
    }

    function palicoLow(){
      this.count = 0
      this.draw = function(){
          this.count < 50 ? this.count++ : this.count = 0
          if(!this.count) effects.push(new palicoHelp())
          if(!gInGame || !gInCombat || PalicoMeter.value >= .25){
            this.lifetime = 0
            palicoGoing = false
          }
      }
    }

    function palicoHelp(){
      this.scale = .1
      this.a = 1
      this.draw = function(){
          ctx.save()
          ctx.translate(160, 100)
          ctx.scale(this.scale, this.scale)
          ctx.translate(-160, -100)
          DrawCircle(150, 90, 10, getColorString(0, 100, 50, this.a))
          DrawCircle(170, 90, 10, getColorString(0, 100, 50, this.a))
          DrawCircle(160, 100, 10, getColorString(0, 100, 50, this.a))
          ctx.beginPath()
          ctx.moveTo(141, 95)
          ctx.lineTo(179, 95)
          ctx.lineTo(160, 120)
          ctx.fillStyle = getColorString(0, 100, 50, this.a)
          ctx.fill()
          ctx.restore()
          this.scale < 20 ? this.scale += (21 - this.scale) / 40 : this.lifetime = 0
          if(this.scale <= 5) this.a = this.scale * .2
          else this.a = 1 - this.scale * .05
          if(this.a <= 0) this.lifetime = 0
      }
    }

    function redHealth(){
      this.count = 0
      this.draw = function(){
          if(!this.count) effects.push(new redHealthHelp())
          this.count < 5 ? this.count++ : this.count = 0
        if(RedHealthMeter.value <= .01 || !gInGame || !gInCombat) {
          this.lifetime = 0
          redHealthGoing = false
        }
      }
    }

  function redHealthHelp(){
      this.x = Math.random() * 320
      this.y = -10
      this.draw = function(){
          DrawCircle(this.x, this.y - 50, 5, getColorString(0, 100, 50, .25))
          DrawCircle(this.x, this.y - 40, 10, getColorString(0, 100, 50, .5))
          DrawCircle(this.x, this.y - 20, 15, getColorString(0, 100, 50, .75))
          DrawCircle(this.x, this.y, 18, getColorString(0, 100, 50, 1))
          this.y < 250 ? this.y += 3 : this.lifetime = 0
      }
  }

    function healthHUD(){
      this.val = 0
      this.draw = function(){
        if(!gInGame || Health1Meter.value <= .15) this.val *= .95
        else {
          if(Health5Meter.value >= .05) this.val += (.8 + Health5Meter.value * 3 / 5 - this.val) / 10
          else if(Health4Meter.value >= .05) this.val += (.6 + Health4Meter.value * 3 / 5 - this.val) / 10
          else if(Health3Meter.value >= .05) this.val += (.4 + Health3Meter.value * 3 / 5 - this.val) / 10
          else if(Health2Meter.value >= .05) this.val += (.2 + Health2Meter.value * 3 / 5 - this.val) / 10
          else if(Health1Meter.value >= .05) this.val += (0 + Health1Meter.value * 3 / 5 - this.val) / 10
        }
        if(hpHUDOn) DrawRect(hpX * 3.2, hpY * 2, this.val * hpWidth * 3.2, hpHeight * 2, hpColor)
      }
    }

    function staminaHUD(){
      this.val = 0
      this.draw = function(){
        if(!gInGame || (Stamina1Meter.value <= .05 && Stamina2Meter.value <= 0)) this.val *= .95  
        else {
          if(Stamina3Meter.value >= .05) this.val += (.66 + Stamina3Meter.value / 2.4 - this.val) / 10
          else if(Stamina2Meter.value >= .05) this.val += (.33 + Stamina2Meter.value / 2.4 - this.val) / 10
          else if(Stamina1Meter.value >= .05) this.val += (0 + Stamina1Meter.value / 2.4 - this.val) / 10
        }
        if(staminaHUDOn) DrawRect(staminaX * 3.2, staminaY * 2, this.val * staminaWidth * 3.2, staminaHeight * 2, staminaColor)
      }
    }

  let proBack = []
  function onbackColorChanged(){
    proBack = hexToHSL(backColor)
  }

  let backgroundEaseHue = 0;
  let backgroundEaseLit = 0;
  let backgroundEaseSat = 0
  let gCycle = 0
  function backgroundHandler(){
      switch(backgroundMode){
          case "Color Cycle": 
          DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
          gCycle < 360 ? gCycle += .5 : gCycle = 0
          break;
          case "Color Cycle Ambience": 
          copyScreen(ambienceAlpha / 100)
          gCycle < 360 ? gCycle += .5 : gCycle = 0
          break;
          case "Custom": 
          DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
          break;
          case "Ambience": 
          copyScreen(ambienceAlpha / 100)
          break;
          case "Custom Ambience": 
          copyScreen(ambienceAlpha / 100)
          break;
          case "Ambience Audio Visualizer": 
          copyScreenAudio(ambienceAlpha / 100)
          break;
          case "Custom Audio Visualizer": 
          backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
          backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
          DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
          break;
          case "Color Cycle Audio Visualizer": 
          backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
          backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
          gCycle < 360 ? gCycle += .5 : gCycle = 0
          DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
          break;
      }
  }

  function DrawRect(x, y, width, height, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
  };

  function hexToHSL(hex) {
    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);

    var r = parseInt(result[1], 16);
    var g = parseInt(result[2], 16);
    var b = parseInt(result[3], 16);

    (r /= 255), (g /= 255), (b /= 255);
    var max = Math.max(r, g, b),
      min = Math.min(r, g, b);
    var h,
      s,
      l = (max + min) / 2;

    if (max === min) {
      h = s = 0; // achromatic
    } else {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r:
          h = (g - b) / d + (g < b ? 6 : 0);
          break;
        case g:
          h = (b - r) / d + 2;
          break;
        case b:
          h = (r - g) / d + 4;
          break;
      }
      h /= 6;
    }

    s = s * 100;
    s = Math.round(s);
    l = l * 100;
    l = Math.round(l);
    h = Math.round(360 * h);

    return [h, s, l];
  }

  let audioScreenSat = 0
  let audioScreenLit = 0
  function copyScreenAudio(alpha) {
    let lightness = new Int8Array(engine.zone.lightness);
    let sat = new Int8Array(engine.zone.saturation);
    let hue = new Int16Array(engine.zone.hue);
    audioScreenSat += (engine.audio.density * 100 - audioScreenSat) / 10
    audioScreenLit += (engine.audio.density * 100 - audioScreenLit) / 10
    for (var iZone = 0; iZone < 560; iZone++) {
      var iRow = Math.floor(iZone / 28);
      var iCol = iZone % 28;
      var iWidth = 320 / 28;
      var iHeight = 200 / 20;
      var iZx = iCol * iWidth;
      var iZy = iRow * iHeight;
      ctx.fillStyle = `hsla(${hue[iZone]}, ${sat[iZone] * (audioScreenSat / 200 + .5)}%, ${lightness[iZone] * (audioScreenLit / 100)}%, ${alpha})`;
      ctx.fillRect(iZx, iZy, iWidth, iHeight);
    }
  }

  function copyScreen(alpha) {
    let lightness = new Int8Array(engine.zone.lightness);
    let sat = new Int8Array(engine.zone.saturation);
    let hue = new Int16Array(engine.zone.hue);
    for (var iZone = 0; iZone < 560; iZone++) {
      var iRow = Math.floor(iZone / 28);
      var iCol = iZone % 28;
      var iWidth = 320 / 28;
      var iHeight = 200 / 20;
      var iZx = iCol * iWidth;
      var iZy = iRow * iHeight;
      ctx.fillStyle = `hsla(${(backgroundMode == "Custom Ambience" ? proBack[0] : hue[iZone] + gCycle * (backgroundMode == "Color Cycle Ambience"))}, ${sat[iZone]}%, ${lightness[iZone]}%, ${alpha})`;
      ctx.fillRect(iZx, iZy, iWidth, iHeight);
    }
  }

  function DrawCircle(x, y, radius, color) {
  ctx.beginPath();
  ctx.fillStyle = color;
  ctx.arc(x, y, radius, 0, 2 * Math.PI)
  ctx.fill();
};

function DrawStroke(x, y, radius, color, stroke) {
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = stroke;
  ctx.arc(x, y, radius, 0, 2 * Math.PI)
  ctx.stroke();
};

function DrawRect(x, y, width, height, color) {
  ctx.beginPath();
  ctx.fillStyle = color;
  ctx.fillRect(x, y, width, height);
};

function strokeRect(x, y, width, height, color, stroke){
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = stroke
  ctx.rect(x, y, width, height);
  ctx.stroke()
}

function getColorString(hue, sat, lit, alpha) {
      return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`
  }

function hexToHSL(hex) {
    const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || [];
    const rgb = [r, g, b].map(x => parseInt(x, 16) / 255);
    const max = Math.max(...rgb);
    const min = Math.min(...rgb);
    const l = (max + min) / 2;
    
    if (max === min) return [0, 0, Math.round(l * 100)];
    
    const d = max - min;
    const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    
    let h;
    const [nr, ng, nb] = rgb;
    if (max === nr) h = (ng - nb) / d + (ng < nb ? 6 : 0);
    else if (max === ng) h = (nb - nr) / d + 2;
    else h = (nr - ng) / d + 4;
    
    return [
      Math.round(h * 60),
      Math.round(s * 100),
      Math.round(l * 100)
    ];
  }

  function Meter(size, callback) {
    this.size = size;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    var values = [];

    this.setValue = function (updatedValue) {
      values.push(updatedValue);
      if (values.length > this.size) {
        values.shift();
      }

      for (var i = 0; i < values.length - 1; i++) {
        if (values[i] !== values[i + 1]) return;
      }
      if (this.value !== values[0]) {
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        callback();
      }
    }
  }

  window.requestAnimationFrame(update);
</script>
