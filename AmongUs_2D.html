<script>
  //Declaring variables
  var canvas, ctx;
  canvas = document.getElementById('exCanvas');
  ctx = canvas.getContext('2d');
  var effects = [];
  var width = 320;
  var height = 200;
  var hiddenCanvas = document.createElement("canvas");
  hiddenCanvas.width = width;
  hiddenCanvas.height = height;
  var hctx = hiddenCanvas.getContext("2d");
  let gAlpha = 1
  var totalTasksMultiplyValue = 0;
  var taskValue = 0;
  var theHUD = new drawHud()
  var meetingPushed = false;


  //Declaring meters
  var ChoseCrewmate_Meter = new Meter(10, crewmateCallback)
  var ChoseImposter_Meter = new Meter(10, imposterCallback)
  var TotalTasks_Meter = new Meter(10, () => "")
  var BodyFoundWhite_Meter = new Meter(20, () => "")
  var BodyFoundColor_Meter = new Meter(20, () => "")
  var BodyFoundConfirm_Meter = new Meter(20, meetingCallback)
  var VotingGrey_Meter = new Meter(20, () => "")
  var GetKilledRed_Meter = new Meter(20, GetKillCallback)
  var SettingGray_Meter = new Meter(10, () => "")
  var MapWhite_Meter = new Meter(10, () => "")
  var FirstTask_Meter = new Meter(20, () => "")
  var VictoryBlue_Meter = new Meter(30, VictoryCallback);
  var DefeatRed_Meter = new Meter(30, DefeatCallback);
  var ImposterConfirm_Meter = new Meter(20, () => "");
  var KillButton_Meter = new Meter(20, KillCallback)
  var MainMenuMeter = new Meter(10, MenuCallback)
  var MapBlue1Meter = new Meter(10, MapCallback)
  var MapRedMeter = new Meter(10, MapCallback)
  var DeadRedMeter = new Meter(30, DeadCallback)
  var meetingBlue_Meter = new Meter(20,meetingCallback)


  function update() {

    hctx.clearRect(0, 0, hiddenCanvas.width, hiddenCanvas.height);
    hctx.fillStyle = `hsla(0, 0%, 0%, ${gAlpha})`;
    hctx.fillRect(0, 0, 320, 200);

    backgroundHandler()
    
  
    ChoseCrewmate_Meter.setValue(engine.vision.ChoseCrewmate);
    ChoseImposter_Meter.setValue(engine.vision.ChoseImposter)
    TotalTasks_Meter.setValue(engine.vision.TotalTasks)
    BodyFoundWhite_Meter.setValue(engine.vision.BodyFoundWhite)
    BodyFoundColor_Meter.setValue(engine.vision.BodyFoundColor[0])
    BodyFoundConfirm_Meter.setValue(engine.vision.BodyFoundConfirm)
    VotingGrey_Meter.setValue(engine.vision.VotingGrey)
    SettingGray_Meter.setValue(engine.vision.SettingGray)
    MapWhite_Meter.setValue(engine.vision.MapWhite)
    FirstTask_Meter.setValue(engine.vision.FirstTaskCompleted)
    VictoryBlue_Meter.setValue(engine.vision.VictoryBlue);
    DefeatRed_Meter.setValue(engine.vision.DefeatRed);
    GetKilledRed_Meter.setValue(engine.vision.GetKilledRed)

  let proBack = []
    function onbackColorChanged(){
      proBack = hexToHSL(backColor)
    }

    let backgroundEaseHue = 0;
    let backgroundEaseLit = 0;
    let backgroundEaseSat = 0
    let gCycle = 0
    function backgroundHandler(){
        switch(backgroundMode){
            case "Color Cycle": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Color Cycle Ambience": 
            copyScreen(ambienceAlpha / 100)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Custom": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            break;
            case "Ambience": 
            copyScreen(ambienceAlpha / 100,hctx)
            break;
            case "Custom Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Ambience Audio Visualizer": 
            copyScreenAudio(ambienceAlpha / 100)
            break;
            case "Custom Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
            case "Color Cycle Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
        }
    }
    let audioScreenSat = 0
    let audioScreenLit = 0
    function copyScreenAudio(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      audioScreenSat += (engine.audio.density * 100 - audioScreenSat) / 10
      audioScreenLit += (engine.audio.density * 100 - audioScreenLit) / 10
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        hctx.fillStyle = `hsla(${hue[iZone]}, ${sat[iZone] * (audioScreenSat / 200 + .5)}%, ${lightness[iZone] * (audioScreenLit / 100)}%, ${alpha})`;
        hctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }
  
    function copyScreen(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        hctx.fillStyle = `hsla(${(backgroundMode == "Custom Ambience" ? proBack[0] : hue[iZone] + gCycle * (backgroundMode == "Color Cycle Ambience"))}, ${sat[iZone]}%, ${lightness[iZone]}%, ${alpha})`;
        hctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }

  function drawHud() {

        hctx.fillStyle = taskColor;
        this.width = adjToggle ? TaskBarWidth * 3.2 : FirstTask_Meter.value < .1 ? 0 : (1 - TotalTasks_Meter.value) * 320
        if(this.width != this.old){

          this.alpha = .75
        }
        hctx.fillRect(TaskBarX * 3.2, TaskBarY * 2, this.width, TaskBarHeight * 2)
        hctx.globalAlpha = this.alpha
        DrawRect(TaskBarX * 3.2, TaskBarY * 2, this.width, TaskBarHeight * 2, "white")

      }

  function dead(){
    this.boi = new deadBoi(50, `hsl(${Math.random() * 360}, 100%, 50%)`, "left")
    this.alpha = 0;
    this.done = false;
    this.lifetime = 1
    this.draw = function(){
      DrawRect(0, 0, 320, 200, "hsla(0, 0%, 0%, 1)")
      hctx.globalAlpha = this.alpha;
      DrawRect(0, 0, 320, 200, "grey")
      hctx.globalAlpha = this.alpha * 3 / 4;
      this.boi.draw()
      hctx.globalAlpha = 1;
      if(!this.done){
        this.alpha <= .55 ? this.alpha+=.05 : this.alpha = .6;
      } else {
        this.alpha >= .05 ? this.alpha-=.05 : this.lifetime = 0;
      }
      if(!deadGoing) this.done = true;

  function deadBoi(scale, color, direction){
    this.rotate = Math.random() * 5;

    this.y = 100;

  }

  function menuEffect(){
    this.stars = []
    this.effects = []
    this.start = Date.now()
    this.lifetime = 1;
    this.done = false;
    this.alpha = 1;
    
    this.draw = function(){
      var elapsed = Date.now() - this.start
      if(elapsed > 2000){
        this.effects.push(new menuBoi(Math.random() * 320, Math.random() * 200, Math.random() * 20 + 10, `hsl(${Math.random() * 360}, 90%, 50%)`, Date.now() % 2 == 0 ? "right" : "left"))
        this.start = Date.now()
      }
      hctx.globalAlpha = this.alpha;
      DrawRect(0, 0, 320, 200, "black")
      
      this.effects.forEach((ele, i) => {
        ele.draw()
      })
      
      this.effects = this.effects.filter(ele => ele.lifetime > 0);
      
      if(this.stars.length < 50 && Date.now() % 4 == 0) this.stars.push(new menuStar())
      
      this.stars.forEach((ele, i) => {
        ele.draw()
      })
      
      this.stars = this.stars.filter(ele => ele.lifetime > 0);
      
      hctx.globalAlpha = 1;
      hctx.globalAlpha = 1;
      if(this.done){
        if(this.alpha >= .05){
          this.alpha-=.05
          if(this.alpha < .05){
            this.lifetime = 0;
            menuPushed = false;
          }
        }
      }
      if(MainMenuMeter.value < .2 || (MapWhite_Meter.value >= .95 || SettingGray_Meter.value >= .95)) {
        this.done = true;
      }
    }
  }

  function menuStar(){
    this.x = Math.random() * 300 - 20;
    this.speed = Math.random() * .5 + .1;
    this.y = Math.random() * 200 - 10;
    this.lifetime = 1;
    this.alpha = 0;
    this.draw = function(){
      hctx.globalAlpha = this.alpha
      DrawCircle(this.x, this.y, 5, "grey")
      this.x < 340 ? this.x+=this.speed : this.lifetime = 0;
      this.y+=.01
      hctx.globalAlpha = 1;
      this.alpha <= .95 ? this.alpha+=.05 : this.alpha = 1;
    }
  }
  
  function menuBoi(x, y, scale, color, direction){
    this.rotate = 0;
    this.rv = .15 - Math.random() * .3
    this.xv = 1 - Math.random() * 2
    this.yv = 1 - Math.random() * 2
    this.x = x;
    this.y = y;
    this.color = color;
    this.scale = scale;
    this.direction = direction;
    this.lifetime = 1;
    this.alpha = 0;
    this.draw = function(){
      hctx.globalAlpha = this.alpha
      DrawCharacter(this.x, this.y, this.scale, this.color, this.direction, this.rotate)
      this.rotate+=this.rv;
      this.x+=this.xv;
      this.y+=this.yv;
      if(this.x > 350 || this.x < -30 || this.y > 230 || this.y < -30) this.lifetime = 0;
      hctx.globalAlpha = 1;
      this.alpha <= .95 ? this.alpha+=.05 : this.alpha = 1;
    }
  }


  function pulseEffect(color, speed){
    this.alpha = 0;
    this.start = Date.now();
    this.lifetime = 1
    this.draw = function (){
      this.elapsed = Date.now() - this.start;
      hctx.beginPath();
      this.alpha = Math.sin(this.elapsed / speed);
      hctx.globalAlpha = this.alpha;
      hctx.fillStyle = color;
      hctx.fillRect(0,0,320,200);
      if(this.alpha < 0 ){
        this.lifetime = 0;
        hctx.globalAlpha = 1;
      }
    }
  }

  function deadBodyEffect(color) {
    this.bloodSplatter = [];
    this.firstPoint = ({ x: 160, y: 100 })
    this.globalX = 80;
    this.start = Date.now();
    this.elapsed = 0;
    this.secondElapsed = 0;
    this.lifetime = 1; 
    
    this.draw = function () {
      this.elapsed = Date.now() - this.start;

      if (200 - (this.elapsed - 7000) / 15 < 0) {
        let gradient = hctx.createRadialGradient(160, 100, 0, 160, 100, 200)
        this.calculateVal = -1440 * Math.floor((-(this.elapsed - 200) / 1440) / 1) + ((-(this.elapsed + 100) / 1440) * (1440 / 1));
        gradient.addColorStop(SetRange((-0 + (this.calculateVal)), 0, 1000) / 1000, "hsla(0, 0%, 0%,0)");
        gradient.addColorStop(SetRange((-200 + (this.calculateVal)), 0, 1000) / 1000, "red");
        hctx.beginPath();
        hctx.fillStyle = gradient;
        hctx.fillRect(0, 0, 320, 200)
        if (this.elapsed > 11400) {
          this.lifetime = 0;
        }
      } else {
        if (this.elapsed < 1300) {
          let gradient = hctx.createRadialGradient(160, 100, 0, 160, 100, 200)
          this.calculateVal = -1440 * Math.floor((-(this.elapsed - 200) / 1440) / 1) + ((-(this.elapsed + 100) / 1440) * (1440 / 1));
          gradient.addColorStop(SetRange((-0 + (this.calculateVal)), 0, 1000) / 1000, color);
          gradient.addColorStop(SetRange((-200 + (this.calculateVal)), 0, 1000) / 1000, "hsla(0, 0%, 0%,0)");
          hctx.beginPath();
          hctx.fillStyle = gradient;
          hctx.fillRect(0, 0, 320, 200)
        } else {
          hctx.beginPath()
          hctx.fillStyle = "black"
          hctx.fillRect(0, 0, 320, 200);
          DrawCharacter(160, 120, SetRange(1300 - ((this.elapsed - 1400)), 35, 1300), color, "left", 90 * (Math.PI / 180));
          if (this.elapsed > 3000) {
            if (Math.random() > 0.9) {
              this.bloodSplatter.push(new bloodSplatter([{ x: this.firstPoint.x, y: this.firstPoint.y }, { x: this.globalX + 100 + Math.random() * 20, y: 0 + Math.random() * 20 }, { x: this.globalX + 200, y: 50 }, { x: this.globalX + 200 + Math.random() * 40, y: 200 + Math.random() * 40 }], 5, 20, 15, "red"))
            }
            if (Math.random() > 0.9) {
              this.bloodSplatter.push(new bloodSplatter([{ x: this.firstPoint.x, y: this.firstPoint.y }, { x: this.firstPoint.x - 40 + Math.random() * 20, y: 0 + Math.random() * 20 }, { x: this.globalX - 20, y: 50 }, { x: this.globalX - 20 + Math.random() * 40, y: 200 + Math.random() * 40 }], 5, 20, 15, "red"))
            }
          }
          if (this.elapsed > 6000) {
            if (Math.random() > 0.8) {
              this.bloodSplatter.push(new bloodSplatter([{ x: Math.random() * 320, y: -50 }, { x: Math.random() * 320, y: 50 }, { x: Math.random() * 320, y: 100 }, { x: Math.random() * 320, y: 200 }], 25, 20, 5, "red"))
            }
            hctx.beginPath();
            hctx.fillStyle = "red";
            if((220 - (this.elapsed - 7000) / 15) < 5) {
              this.lifetime = 0;
              this.bloodSplatter = []
              meetingPushed = false;
            }
            hctx.fillRect(0, 220 - (this.elapsed - 7000) / 15, 320, 200)
          }
          
          this.bloodSplatter.forEach(element => {
            element.draw();
          });
          
          this.bloodSplatter = this.bloodSplatter.filter(element => element.lifetime > 0);
        }
      }
    }
  }

  function mapRow(color){
      this.effects = []
      this.alpha = 0;
      this.lifetime = 1; 
      this.color = color
      this.done = false;
      
      for(let i = 0; i < 20; i++){
        let loopX = (i % 5) * 60 + 15
        let loopY = Math.floor(i / 5) * 60 + 15
        this.effects.push(new mapSquare(loopX, loopY, 50, Math.random() < .05 ? "white" : this.color))
      }
      
      this.draw = function(){
        hctx.globalAlpha = this.alpha
        DrawRect(0, 0, 320, 200, "black")
        
        this.effects.forEach((ele, i) => {
          ele.draw()
          if(ele.lifetime <= 0){
            this.effects.push(new mapSquare(ele.x, -45, ele.size, Math.random() < .05 ? "white" : this.color))
          }
        })
        
        
        this.effects = this.effects.filter(ele => ele.lifetime > 0);
        
        hctx.globalAlpha = 1;
        if(!this.done){
          this.alpha <= .45 ? this.alpha += .05 : this.alpha = .5;
        } else {
          this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0;
        }
        if(!mapGoing) this.done = true;
      }
  }

  function mapSquare(x, y, size, color){
      this.x = x;
      this.y = y;
      this.size = size;
      this.color = color;
      this.lifetime = 1; 
      this.vy = Math.random() * 2 + .5
      this.draw = function(){
        DrawRect(this.x, this.y, this.size, this.size, this.color)
        this.y+=this.vy
        if(this.y > 200) this.lifetime = 0;
      }
  }

  function voting(){
      this.start = Date.now()
      this.effects = []
      this.num = true;
      this.lifetime = 1; 
      this.count = 0;
      
      this.draw = function(){
        var elapsed = Date.now() - this.start;
        DrawRect(0, 0, 320, 200, "hsla(0, 0%, 0%, 1)")
        if(elapsed > 1000){
          this.start = Date.now()
          this.effects.push(new votingHelper(this.num))
          this.count++
          if(this.num == 0){
            this.num = !this.num;
            this.count = 0;
          }
          if(this.count == 2){
            this.num = !this.num;
            this.count = 0;
          }
        }
        
        this.effects.forEach((ele, i) => {
          ele.draw()
        })
        
        this.effects = this.effects.filter(ele => ele.lifetime > 0);
        
        if (VotingGrey_Meter.value < .3 || MapWhite_Meter.value < .1 || !meetingOn){
          voteGoing = false;
          this.lifetime = 0;
        }
      }
  }

  function votingHelper(dir){
    this.x = dir ? 10 : 310;
    this.y = 170;
    this.hue = Math.random() * 360
    this.target = 150;
    this.width = dir ? 200 : -200;
    this.offset = dir ? 30 : -30;
    this.lifetime = 1;
    this.start = Date.now()
    this.draw = function(){
      var elapsed = Date.now() - this.start;
      if(elapsed > 1000){
        this.target = this.y - 31;
        this.start = Date.now()
      }
      if(this.target != this.y){
        this.y -= (this.y - this.target) / 2
        if(this.y < this.target) this.y = this.target
      }
      DrawRect(this.x, this.y, this.width, 30, "hsl(0, 0%, 90%)")
      DrawCircle(this.x + this.offset, this.y + 15, 14, `hsl(${this.hue}, 75%, 50%)`)
      if(this.y < -20) this.lifetime = 0;
    }
  }

  
  function emergencyMeeting(){
    this.start = Date.now()
    this.radius = 1;
    this.radius2 = 40;
    this.stroke = 55;
    this.lit = 50;
    this.lifetime = 1;
    this.draw = function(){
      var elapsed = Date.now() - this.start
      if(elapsed < 900){
        DrawCircle(160, 100, this.radius, `hsl(0, 100%, ${this.lit}%)`)
        DrawStroke(160, 100, this.radius, `white`, 10)
        this.radius < 70 ? this.radius+=5 : this.lit+=.5;
      } else if (elapsed < 1800){
        this.lit = 50;
        DrawStroke(160, 100, this.radius2, "red", this.stroke)
        this.radius2+=5;
        this.stroke--;
      } else {
        this.lifetime = 0;
        meetingPushed = false;
      }
    }
  }

  function DrawStroke(x, y, radius, color, stroke) {
    hctx.beginPath();
    hctx.strokeStyle = color;
    hctx.lineWidth = stroke;
    hctx.arc(x, y, radius, 0, 2 * Math.PI)
    hctx.stroke();
  };

  function VDEffect(color){
    this.x = 0;
    this.color = color;
    this.lifetime = 1; 
    this.effects = []
    
    this.draw = function(){
      if(this.x % 5 == 0 && this.x <= 160) this.effects.push(new VDHelper(this.x, this.color))
      
      this.effects.forEach((ele, i) => {
        ele.draw()
      })
      
      this.effects = this.effects.filter(ele => ele.lifetime > 0);
      
      this.x++
      if(this.effects.length == 0){
        this.lifetime = 0;
        if(mainOn) effects.push(new menuEffect())
      } 
    }
  }

 function VDHelper(offset, color){
  this.x = offset;
  this.alpha = 1;
  this.radius = 1;
  this.lifetime = 1;
  this.color = color;
  this.draw = function(){
    hctx.globalAlpha = this.alpha;
    DrawCircle(160 + this.x, 100, this.radius, this.color)
    DrawCircle(160 - this.x, 100, this.radius, this.color)
    hctx.globalAlpha = 1;
    this.alpha > .01 ? this.alpha-=.01 : this.lifetime = 0;
    this.radius++
  }
 }


  function GettingKilledEffect(murder) {
    this.bloodSplatter = [];
    this.start = Date.now();
    this.elapsed = 0;
    this.globalX = 80;
    this.curve = [{ x: this.globalX, y: 100 }, { x: this.globalX, y: 140 }, { x: this.globalX + 200, y: 50 }, { x: this.globalX, y: 100 }];
    this.rotation = 0;
    this.firstPoint = ({ x: this.globalX + 80, y: 100 })
    this.murder = murder;
    this.lifetime = 1;

    let percentage = 0;
    this.draw = function () {
      this.elapsed = Date.now() - this.start;
      if (this.elapsed < 1400) {
        let gradient = hctx.createRadialGradient(160, 100, 0, 160, 100, 200)
        this.calculateVal = -1660 * Math.floor((this.elapsed / 1660) / 1) + ((this.elapsed / 1660) * (1660 / 1));
        gradient.addColorStop(SetRange((-0 + (this.calculateVal)), 0, 1000) / 1000, "hsla(0, 0%, 0%,0)");
        gradient.addColorStop(SetRange((-200 + (this.calculateVal)), 0, 1000) / 1000, "hsla(0, 100%, 50%,1)");
        gradient.addColorStop(SetRange((-400 + (this.calculateVal)), 0, 1000) / 1000, "hsla(0, 0%, 0%,1)");
        hctx.fillStyle = gradient;
        hctx.fillRect(0, 0, 320, 200);
      }
      if (this.elapsed > 1400) {
        hctx.globalAlpha = SetRange(percentage < 3 ? 1 : 4 - percentage, 0, 1);
        hctx.fillStyle = "black";
        hctx.fillRect(0, 0, 320, 200);
      }
      if (this.elapsed > 1800) {
        percentage += 0.01;
      }
      hctx.beginPath();

      DrawCharacter(this.firstPoint.x, this.firstPoint.y, 30, this.murder == "do" ? "red" : "green", "left", this.rotation)
      DrawCharacter(this.globalX, 100, 30, this.murder == "do" ? "green" : "red", "right", 0)
      if (percentage > 0 && percentage < 1) {
        hctx.beginPath();
        let point = getCubicBezierXYatPercent(this.curve[0], this.curve[1], this.curve[2], this.curve[3], percentage);
        hctx.arc(point.x, point.y, 10, 0, Math.PI * 2);
        hctx.fillStyle = this.murder == "do" ? "green" : "red"
        hctx.fill();
      }
      if (percentage > 0.6 && percentage < 0.95) {
        this.rotation += 0.044
        if (percentage < 0.75) {
          this.firstPoint.y -= 1;
        } else {
          this.firstPoint.y += 1.5;
        }
        this.firstPoint.x += 1;
      }
      if (percentage > 0.6) {
        if (Math.random() > 0.9) {
          this.bloodSplatter.push(new bloodSplatter([{ x: this.firstPoint.x, y: this.firstPoint.y }, { x: this.globalX + 100 + Math.random() * 20, y: 0 + Math.random() * 20 }, { x: this.globalX + 200, y: 50 }, { x: this.globalX + 200 + Math.random() * 40, y: 200 + Math.random() * 40 }], 5, 20, 15, "red"))
        }
        if (Math.random() > 0.9) {
          this.bloodSplatter.push(new bloodSplatter([{ x: this.firstPoint.x, y: this.firstPoint.y }, { x: this.firstPoint.x - 20 + Math.random() * 20, y: 0 + Math.random() * 20 }, { x: this.globalX + 50, y: 50 }, { x: this.globalX + 40 + Math.random() * 40, y: 200 + Math.random() * 40 }], 5, 20, 15, "red"))
        }
      }
      this.bloodSplatter.forEach(element => {
        element.draw();
      });
      
      this.bloodSplatter = this.bloodSplatter.filter(element => element.lifetime > 0);
      if (percentage > 4) {
        this.lifetime = 0;
      }
      hctx.globalAlpha = 1;
    }
  }

  function bloodSplatter(curve, width, size, speed, color) {
    this.curve = curve;
    this.percentage = 0;
    this.width = width;
    this.size = size;
    this.color = color;
    this.speed = speed;
    this.lifetime = 1;

    this.draw = function () {
      this.percentage += this.speed / 1000;
      hctx.beginPath();
      hctx.fillStyle = this.color;
      let point = getCubicBezierXYatPercent(this.curve[0], this.curve[1], this.curve[2], this.curve[3], this.percentage)
      hctx.moveTo(point.x, point.y);
      for (let index = 0; index < this.size; index++) {
        let point2 = getCubicBezierXYatPercent(this.curve[0], this.curve[1], this.curve[2], this.curve[3], this.percentage + index / 100);
        hctx.lineTo(point2.x, point2.y);
      }

      hctx.strokeStyle = color;
      hctx.lineWidth = this.width;
      hctx.stroke()

      if (this.percentage > 1.2) {
        this.lifetime = 0;
      }
    }
  }

  function DrawCharacter(x, y, size, color, direction, rotation) {
    hctx.save();
    hctx.translate(x, y)
    hctx.rotate(rotation);
    hctx.beginPath();
    hctx.ellipse(0, 0 - size / 3, size / 1.5, size / 1.1, 0, 0, 2 * Math.PI)
    let moddedSize = 1.32;
    hctx.rect(0 - (size * moddedSize / 2), 0 - size / 2, size * moddedSize, size * 1.1)
    hctx.rect(0 - (size * moddedSize / 2), 0 + size / 2, size / 2, size / 1.5)
    hctx.rect(0 + size / 6, 0 + size / 2, size / 2, size / 1.5)
    hctx.fillStyle = color;
    hctx.strokeStyle = "black";
    hctx.fill();
    hctx.beginPath();
    hctx.ellipse(direction == "right" ? 0 + size / 2.5 : 0 - size / 2.5, 0 - size / 2.5, size / 2, size / 3, 0, 0, 2 * Math.PI)
    hctx.fillStyle = "#476270";
    hctx.fill();
    hctx.beginPath();
    hctx.fillStyle = "#8ec6d5"
    hctx.ellipse(direction == "right" ? 0 + size / 2 : 0 - size / 2, 0 - size / 2, size / 3, size / 5, 0, 0, 2 * Math.PI)
    hctx.fill();
    hctx.restore();
  }

  function getCubicBezierXYatPercent(startPt, controlPt1, controlPt2, endPt, percent) {
    var x = CubicN(percent, startPt.x, controlPt1.x, controlPt2.x, endPt.x);
    var y = CubicN(percent, startPt.y, controlPt1.y, controlPt2.y, endPt.y);

    return ({ x: x, y: y });
  }

  function CubicN(pct, a, b, c, d) {
    var t2 = pct * pct;
    var t3 = t2 * pct;
    return a + (-a * 3 + pct * (3 * a - a * pct)) * pct
      + (3 * b + pct * (-6 * b + b * 3 * pct)) * pct
      + (c * 3 - c * 3 * pct) * t2
      + d * t3;
  }


  function SetRange(num, min, max) {
    return Math.min(Math.max(num, min), max)
  }

  //helper functions
  function GetTime() {
    return new Date().getTime();
  }

  function DrawCircle(x, y, radius, color) {
    hctx.beginPath();
    hctx.fillStyle = color;
    hctx.arc(x, y, radius, 0, 2 * Math.PI)
    hctx.fill();
  };


  function Meter(count, callback) {
    this.size = count;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    var values = [];

    this.setValue = function (updatedValue) {
      // Add and shift.  
      values.push(updatedValue);
      if (values.length > this.size) { values.shift(); }

      // Exit early if we've got a long-term match.
      for (var i = 0; i < (values.length - 1); i++) {
        if (values[i] !== values[i + 1]) return;
      }

      // We got here, so we've got a matching value collection.
      if (this.value !== values[0]) {
        //var fromZero = this.value === 0;
        //var toZero = values[0] === 0;      
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        callback();
      }
    }
  }

 
  window.requestAnimationFrame(update);
  

</script>
