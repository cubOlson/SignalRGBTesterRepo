<body style="margin: 0; padding: 0; background: #000;">
    <canvas id="exCanvas" width="320" height="200"></canvas>
</body>
  
<script>
    // Canvas initialization
    //Health Bar, Taking Damage, Low Health
    //Got a kill
    //Player died
    //Victory, Defeat
    //Low Ammo
    //Tactical / Lethal / Special Ready

    const canvas = document.getElementById('exCanvas');
    const ctx = canvas.getContext('2d');
    const width = 320;
    const height = 200;
    let effects = [];
    let gState = "Out of Game"

            // Create a hidden canvas
    const hiddenCanvas = document.createElement('canvas');
    hiddenCanvas.width = 320;
    hiddenCanvas.height = 200;
    // Don't attach to DOM
    const hiddenCtx = hiddenCanvas.getContext('2d');

    let IGYellowMeter = new Meter(5, inGameCallback)
    let IGNotYellowMeter = new Meter(5, inGameCallback)
    let CheckMeter = new Meter(8, inGameCallback)

    let EndGameBMeter = new Meter(4, inGameCallback)
    let EndGameYMeter = new Meter(4, inGameCallback)
    let ZombieWMeter = new Meter(4, inGameCallback)
    let ZombieYMeter = new Meter(4, inGameCallback)

    let HealthMeter = new Meter(3, healthCallback)
    let HealthRedMeter = new Meter(3, healthCallback)

    let KillWhiteMeter = new Meter(6, killCallback)
    let KillNW1Meter = new Meter(5, killCallback)
    let KillNW2Meter = new Meter(5, killCallback)

    let DeathRedMeter = new Meter(5, deathCallback)
    let DeathNotRedMeter = new Meter(5, deathCallback)
    let DeathRoundRMeter = new Meter(5, deathCallback)
    let DeathRoundBMeter = new Meter(5, deathCallback)

    let EndGameMeter = new Meter(5, endGameCallback)
    let EndGameNotMeter = new Meter(5, endGameCallback)
    let VictoryMeter = new Meter(3, endGameCallback)
    let DefeatMeter = new Meter(3, endGameCallback)

    let LowAmmoMeter = new Meter(5, lowAmmoCallback)
    let LowAmmoNotMeter = new Meter(5, lowAmmoCallback)

    let TacOrangeMeter = new Meter(5, utilityCallback)
    let LetOrangeMeter = new Meter(5, utilityCallback)
    let UltOrangeMeter = new Meter(5, utilityCallback)
   
    //#region Update
    function update() {
      DrawRect(0, 0, 320, 200, "black")
      backgroundHandler()

      IGYellowMeter.setValue(engine.vision.inGameYellow)
      IGNotYellowMeter.setValue(engine.vision.inGameNotYellow)
      CheckMeter.setValue(engine.vision.inGameCheck[0])
      EndGameBMeter.setValue(engine.vision.endGameBlue)
      EndGameYMeter.setValue(engine.vision.endGameYellow)
      ZombieYMeter.setValue(engine.vision.zombieYellow)
      ZombieWMeter.setValue(engine.vision.zombieWhite)

      let healthData = 0
      let redHealthData = 0
      let tacData = 0
      let letData = 0
      let ultData = 0
      if(gState == "Multiplayer") {
        healthData = (engine.vision.health1 + engine.vision.health2) / 2
        redHealthData = (engine.vision.healthRed1 + engine.vision.healthRed2) / 2
        tacData = engine.vision.tacticalOrange
        letData = engine.vision.lethalOrange
        ultData = engine.vision.ultimateOrange
      } else if (gState == "Zombies"){
        healthData = (engine.vision.zHealth1 + engine.vision.zHealth2) / 2
        redHealthData = (engine.vision.zHealthRed1 + engine.vision.zHealthRed2) / 2
      } else if (gState == "Endgame"){
        healthData = (engine.vision.endGHealth1 + engine.vision.endGHealth2) / 2
        redHealthData = (engine.vision.endGHealthRed1 + engine.vision.endGHealthRed2) / 2
      }

      HealthMeter.setValue(healthData)
      HealthRedMeter.setValue(redHealthData)

      KillWhiteMeter.setValue(engine.vision.killWhite)
      KillNW1Meter.setValue(engine.vision.killNotWhite1)
      KillNW2Meter.setValue(engine.vision.killNotWhite2)

      DeathRedMeter.setValue(engine.vision.deathRed)
      DeathNotRedMeter.setValue(engine.vision.deathNotRed)
      DeathRoundRMeter.setValue(engine.vision.deathRoundRed)
      DeathRoundBMeter.setValue(engine.vision.deathRoundBlack)

      EndGameMeter.setValue(engine.vision.endGameWhite)
      EndGameNotMeter.setValue(engine.vision.endGameNotWhite)
      VictoryMeter.setValue(engine.vision.victoryBlue)
      DefeatMeter.setValue(engine.vision.defeatRed)

      LowAmmoMeter.setValue(engine.vision.lowAmmoRed)
      LowAmmoNotMeter.setValue(engine.vision.lowAmmoNotRed)

      TacOrangeMeter.setValue(tacData)
      LetOrangeMeter.setValue(letData)
      UltOrangeMeter.setValue(ultData)
  
      effects.forEach((ele, i) => {
        ele.draw()
        if(ele.lifetime <= 0){
          effects.splice(i, 1)
        }
      })

      if(adjHUD && !gInGame) DrawRect(healthX * 3.2, healthY * 2, healthWidth * 3.2, healthHeight * 2, "red")

      ctx.drawImage(hiddenCanvas, 0, 0)
  
      window.requestAnimationFrame(update);
    };
    //#endregion

    let gInGame = false
    function inGameCallback(){
      if(IGYellowMeter.value >= .2 && engine.vision.inGameNotYellow < .1){
        gInGame = true
        if(EndGameBMeter.value >= .75 && EndGameYMeter.value >= .75) gState = "Endgame"
        else if(ZombieWMeter.value >= .5 && ZombieYMeter.value >= .5) gState = "Zombies"
        else if(EndGameBMeter.value <= .25 && EndGameYMeter.value <= .25 && ZombieYMeter.value <= .25) gState = "Multiplayer"
        if(hpBarOn && !deathGoing) effects.push(new healthBar())
      } else if(IGYellowMeter.value <= .05 && HealthMeter.value <= .1 && HealthRedMeter.value <= .1) gInGame = false
    }

    function healthBar(){
        this.val = 0
        this.done = false
        this.draw = function(){
            DrawRect(healthX * 3.2, healthY * 2, healthWidth * 3.2 * this.val, healthHeight * 2, "red")
            if(!gInGame || !hpBarOn || deathGoing) this.done = true
            if(this.done) this.val > .01 ? this.val *= .95 : this.lifetime = 0
            else this.val += ((HealthMeter.value * 1.05) - this.val) / 20
        }
    }

    let lowHPGoing = false
    let damageGoing = false
    function healthCallback(){
      if(gInGame && HealthMeter.value <= .33 && engine.vision.inGameYellow >= .2 && !lowHPGoing){
        lowHPGoing = true
        if(lowHPOn) effects.push(new lowHealth())
      } else if(!gInGame || (gInGame && HealthMeter.value > .33)) lowHPGoing = false

      if(gInGame && HealthRedMeter.value >= .15 && !damageGoing){
        damageGoing = true
        if(damageOn) effects.push(new tookDamage())
      } else if(!gInGame || (gInGame && HealthRedMeter.value < .05)) damageGoing = false
    }

    function tookDamage(){
        this.alpha = 0
        this.rot = Math.PI / 4 * Math.random() - Math.PI / 8
        this.draw = function(){
            DrawRect(0, 0, 320, 200, getColorString(20, 100, 60, this.alpha / 2))
            if(!this.half) this.alpha <= .75 ? this.alpha += .25 : this.half = true
            else this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
            hiddenCtx.save()
            hiddenCtx.translate(160, 350)
            hiddenCtx.rotate(this.rot)
            hiddenCtx.translate(-160, -350)
            DrawStroke(160, 350, 250, getColorString(0, 100, 50, this.alpha * 2), 30)
            DrawTriangle(100, 100, 220, 100, 160, 40, getColorString(0, 100, 50, this.alpha * 2))
            DrawTriangle(105, 105, 215, 105, 160, 50, getColorString(0, 100, 75, this.alpha))
            hiddenCtx.restore()
        }
    }

    function lowHealth(){
        this.count = 0
        this.draw = function(){
            this.count < 5 ? this.count++ : this.count = 0
            if(!this.count) effects.push(new lhRect(Math.cos(Date.now() / 110) * 20 + 20))
            if(!lowHPGoing || !gInGame || !lowHPOn) this.lifetime = 0
        }
    }

    function lhRect(mod){
        this.x = -20
        this.y = 200
        this.height = Math.sin(Date.now() / 200) * 50 + 100
        this.mod = mod
        this.draw = function(){
            DrawRect(this.x, this.y, 30, -this.height - this.mod, getColorString(0, 100, 50, .66))
            this.x < 350 ? this.x += 5 : this.lifetime = 0
        }
    }


    let killGoing = false
    function killCallback(){
      if(gInGame && KillWhiteMeter.value >= .2 && engine.vision.killNotWhite1 < .05 && engine.vision.killNotWhite2 < .05 && !killGoing){
        killGoing = true
        if(killOn) effects.push(new gotAKill())
      } else if(!gInGame || (gInGame && KillWhiteMeter.value <= .1)) killGoing = false
    }

    function gotAKill(){
        this.alpha = 0
        this.alpha2 = 0
        this.width = 0
        this.rad = 1
        this.stroke = 1
        this.x = 160
        this.y = 100
        this.y2 = 0
        this.count = 0
        this.now = false
        this.draw = function(){
            if(!this.half) {
                this.alpha <= .95 ? this.alpha += .05 : this.half = true
                this.rad = this.alpha * 100
                this.stroke = this.alpha * 45
                this.width = this.alpha * 75
            }
            else {
                if(this.count == 10){
                    this.alpha2 = .75
                    this.y = 50
                }
                if(this.count <= 10) this.count++ 
                else this.y2 < 150 ? this.y2 += 5 : this.alpha >= .025 ? this.alpha -= .025 : this.lifetime = 0
            }
            if(this.alpha2) this.alpha2 *= .95
            DrawCircle(160, this.y2 + 100, 40, getColorString(0, 100, 0, this.alpha * 2))
            DrawCircle(160, this.y2 + 165, 50, getColorString(0, 100, 0, this.alpha * 2))
            DrawRect(110, this.y2 + 165, 100, 100, getColorString(0, 100, 0, this.alpha * 2))
            DrawRect(0, 0, 320, 200, getColorString(45, 100, 60, this.alpha2 * this.alpha))
            DrawStroke(this.x, this.y, this.rad, getColorString(0, 100, 20, this.alpha), this.stroke)
            DrawRect(this.x - 10, this.y - this.width, 20, this.width * 2, getColorString(0, 100, 20, this.alpha)) 
            DrawRect(this.x - this.width, this.y - 10, this.width * 2, 20, getColorString(0, 100, 20, this.alpha)) 
            this.y += (100 - this.y) / 20
        }
    }

    let deathGoing = false
    function deathCallback(){
      if(!gInGame && DeathRedMeter.value >= .3 && engine.vision.deathNotRed < .1 && !deathGoing){
        deathGoing = true
        if(deathOn) effects.push(new playerDied())
      } else if (gInGame) deathGoing = false

      if(gInGame && DeathRoundRMeter.value >= .95 && DeathRoundBMeter.value >= .95 && !deathGoing){
        deathGoing = true
        if(deathOn) effects.push(new playerDied())
      } else if (gInGame && DeathRoundRMeter.value <= .1 && DeathRoundBMeter.value <= .1) deathGoing = false
    }

    function playerDied(){
        this.x = -20
        this.y = 150
        this.vx = 4.5
        this.vy = -3.5
        this.ay = .1
        this.rot = Math.random() * Math.PI * 2
        this.effects = []
        this.alpha = 0
        this.draw = function(){
            if(!this.done) this.alpha <= .95 ? this.alpha += .05 : this.alpha = 1
            else this.alpha *= .95
            DrawRect(0, 0, 320, 200, getColorString(0, 0, 0, this.alpha))
            this.effects.forEach((ele, i)=>{
                ele.draw()
                if(ele.lifetime <= 0) this.effects.splice(i, 1)
            })
            hiddenCtx.save()
            hiddenCtx.translate(this.x, this.y)
            hiddenCtx.rotate(this.rot)
            hiddenCtx.translate(-this.x, -this.y)
                DrawRect(this.x - 20, this.y - 20, 40, 50, getColorString(0, 0, 100, 1))
                DrawCircle(this.x, this.y - 20, 20, getColorString(0, 100, 100, 1))
                DrawCircle(this.x, this.y - 50, 18, getColorString(0, 100, 100, 1))
            hiddenCtx.save()
            hiddenCtx.translate(this.x - 10, this.y - 35)
            hiddenCtx.rotate(this.rot * -1.25)
            hiddenCtx.translate(-(this.x - 10), -(this.y - 35))
                DrawRect(this.x - 10, this.y - 35, -60, 10, getColorString(0, 100, 100, 1))
            hiddenCtx.restore()
            hiddenCtx.save()
            hiddenCtx.translate(this.x + 10, this.y - 35)
            hiddenCtx.rotate(this.rot * 1.5)
            hiddenCtx.translate(-(this.x + 10), -(this.y - 35))
                DrawRect(this.x + 10, this.y - 35, 60, 10, getColorString(0, 100, 100, 1))
            hiddenCtx.restore()
            hiddenCtx.save()
            hiddenCtx.translate(this.x - 20, this.y + 20)
            hiddenCtx.rotate(this.rot * 1.15)
            hiddenCtx.translate(-(this.x - 20), -(this.y + 20))
                DrawRect(this.x - 20, this.y + 20, 10, 60, getColorString(0, 100, 100, 1))
            hiddenCtx.restore()
            hiddenCtx.save()
            hiddenCtx.translate(this.x + 10, this.y + 20)
            hiddenCtx.rotate(this.rot * -1.33)
            hiddenCtx.translate(-(this.x + 10), -(this.y + 20))
                DrawRect(this.x + 10, this.y + 20, 10, 60, getColorString(0, 100, 100, 1))
            hiddenCtx.restore()
            hiddenCtx.restore()
            this.x < 350 ? this.x += this.vx : this.done = true
            this.y += this.vy
            this.vy += this.ay
            this.rot += .05
            if(!this.done) this.effects.push(new diedHelp(this.x - 20 + Math.random() * 40, this.y + Math.random() * 40))
            if(this.done && this.effects.length == 0) this.lifetime = 0
        }
    }

    function diedHelp(x, y){
        this.x = x
        this.y = y
        this.rad = Math.random() * 10 + 5
        this.draw = function(){
            DrawCircle(this.x, this.y, this.rad, getColorString(0, 100, 50, 1))
            this.rad > 1 ? this.rad-=.2 : this.lifetime = 0
        }
    }

    let endGoing = false
    function endGameCallback(){
      if(!gInGame && EndGameMeter.value >= .2 && engine.vision.endGameNotWhite < .1 && !endGoing){
        if(VictoryMeter.value >= .35) {
          if(endOn) effects.push(new victory())
          endGoing = true
        }
        else if(DefeatMeter.value >= .3) {
          if(endOn) effects.push(new defeat())

    //#region Background Modes
    // Background Configuration
    let proBack = [0, 0, 0];
    function onbackColorChanged() {
        proBack = hexToHSL(backColor);
    }

    // Audio and Color Cycle State
    let audioEase = { sat: 0, lit: 0 };
    let gCycle = 0;
    
    // Background Utility Functions
    function updateAudioEase() {
        const targetDensity = engine.audio.density * 100;
        audioEase.sat += (targetDensity - audioEase.sat) / 10;
        audioEase.lit += (targetDensity - audioEase.lit) / 10;
    }

    function getColorString(hue, sat, lit, alpha) {
        return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`;
    }

    function updateColorCycle() {
        gCycle = (gCycle + 0.5) % 360;
    }

    // Main Background Handler
    function backgroundHandler() {
        const alpha = ambienceAlpha / 100;

        // Handle color cycling first if needed
        if (backgroundMode.includes("Color Cycle")) {
            updateColorCycle();
        }

        // Handle audio processing if needed
        if (backgroundMode.includes("Audio")) {
            updateAudioEase();
        }

        // Render background based on mode
        if (backgroundMode.includes("Ambience")) {
            if (backgroundMode === "Ambience Audio Visualizer") {
                copyScreenAudio(alpha);
            } else {
                copyScreen(alpha);
            }
            return;
        }

        // Handle custom and cycle modes
        const hue = proBack[0] + (backgroundMode.includes("Color Cycle") ? gCycle : 0);
        const sat = backgroundMode.includes("Audio") ? audioEase.sat * 0.33 + 66 : proBack[1];
        const lit = backgroundMode.includes("Audio") ? audioEase.lit * 0.9 + 10 : proBack[2];
        
        DrawRect(0, 0, 320, 200, getColorString(hue, sat, lit, alpha));
    }

    // Zone Configuration Constants
    const ZONE_COLS = 28;
    const ZONE_ROWS = 20;
    const TOTAL_ZONES = ZONE_COLS * ZONE_ROWS;

    function copyScreenAudio(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat = new Int8Array(engine.zone.saturation)
        const hue = new Int16Array(engine.zone.hue)
        
        const width = 320 / ZONE_COLS
        const height = 200 / ZONE_ROWS
        
        // Use the global audioEase values we already calculated
        const satMultiplier = audioEase.sat / 200 + 0.5
        const litMultiplier = audioEase.lit / 100

        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const x = col * width
            const y = row * height
            
            hiddenCtx.fillStyle = getColorString(
                hue[iZone],
                sat[iZone] * satMultiplier,
                lightness[iZone] * litMultiplier,
                alpha
            )
            hiddenCtx.fillRect(x, y, width, height)
        }
    }
  
    function copyScreen(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat = new Int8Array(engine.zone.saturation)
        const hue = new Int16Array(engine.zone.hue)
        
        const width = 320 / ZONE_COLS
        const height = 200 / ZONE_ROWS
        
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const x = col * width
            const y = row * height
            
            const finalHue = backgroundMode === "Custom Ambience" 
                ? proBack[0] 
                : hue[iZone] + (backgroundMode === "Color Cycle Ambience" ? gCycle : 0)
            
            hiddenCtx.fillStyle = getColorString(
                finalHue,
                sat[iZone],
                lightness[iZone],
                alpha
            )
            hiddenCtx.fillRect(x, y, width, height)
        }
    }

  function hexToRgb(hex) {
    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
      r: parseInt(result[1], 16),
      g: parseInt(result[2], 16),
      b: parseInt(result[3], 16)
    } : null;
  }

  function hexToHSL(hex) {
      const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || [];
      const rgb = [r, g, b].map(x => parseInt(x, 16) / 255);
      const max = Math.max(...rgb);
      const min = Math.min(...rgb);
      const l = (max + min) / 2;
      
      if (max === min) return [0, 0, Math.round(l * 100)];
      
      const d = max - min;
      const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      
      let h;
      const [nr, ng, nb] = rgb;
      if (max === nr) h = (ng - nb) / d + (ng < nb ? 6 : 0);
      else if (max === ng) h = (nb - nr) / d + 2;
      else h = (nr - ng) / d + 4;
      
      return [
        Math.round(h * 60),
        Math.round(s * 100),
        Math.round(l * 100)
      ];
    }
  
    function Meter(size, callback) {
      this.size = size;
      this.value = 0;
      this.diff = 0;
      this.increased = false;
      this.decreased = false;
      var values = [];
  
      this.setValue = function (updatedValue) {
        values.push(updatedValue);
        if (values.length > this.size) {
          values.shift();
        }
  
        for (var i = 0; i < values.length - 1; i++) {
          if (values[i] !== values[i + 1]) return;
        }
        if (this.value !== values[0]) {
          this.diff = Math.abs(this.value - values[0]);
          this.increased = this.value < values[0];
          this.decreased = this.value > values[0];
          this.value = values[0];
          callback();
        }
      }
    }
    //#endregion


  window.requestAnimationFrame(update);
