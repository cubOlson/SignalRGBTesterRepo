  let NautilusReturnHolder = false;

  var recallMeter = new Meter(1, RecallBlock)
  var allyMeter1 = new Meter(8, allyEffects);

  var d_Meter = new Meter(5, Utility_Effects);

  let settBarMeter = new Meter(15, ()=>{});

  var manaRMeter = new Meter(3, manaR);
  var manaQMeter = new Meter(3, manaQ);
  var manaEMeter = new Meter(3, manaE);
  var manaWMeter = new Meter(3, manaW);
  var playingMeter1 = new Meter(3, playingGame1);
  var playingMeter2 = new Meter(15, playingGame2);
  var lowHealthMeter = new Meter(2, () => "");
  var greyDragonMeter = new Meter(25, dragonEffects);
  var yellowDragonMeter = new Meter(25, dragonEffects);
  var greyBaronMeter = new Meter(25, baronEffects);
  var yellowBaronMeter = new Meter(25, baronEffects);
  var goldMeter = new Meter(10, goldLimitCalculator);

  function update() {
    hctx.clearRect(0, 0, hiddenCanvas.width, hiddenCanvas.height);
    hctx.fillStyle = `hsla(0, 0%, 0%, ${gAlpha})`;
    hctx.fillRect(0, 0, 320, 200);

    backgroundHandler()

    if (freezeCount === 0) {
      copyScreen(gAlpha);
    }

    if(play1 && play2)
      if(respawnDelay < 50) respawnDelay++
    else respawnDelay = 0
    recallMeter.setValue(engine.vision.RecallMeter);
    allyMeter1.setValue(engine.vision.allyDeath1);
    allyMeter2.setValue(engine.vision.allyDeath2);
    allyMeter3.setValue(engine.vision.allyDeath3);
    allyMeter4.setValue(engine.vision.allyDeath4);
    if (play1) {
      alliedTurretMeter.setValue(engine.vision.alliedTurret);
      enemyTurretMeter.setValue(engine.vision.enemyTurret);
      firstAlliedTurretMeter.setValue(engine.vision.firstAlliedTurret);
      firstEnemyTurretMeter.setValue(engine.vision.firstEnemyTurret);
    }
    if (play1 && play2 && !Stunned) {
      lowHealthMeter.setValue(engine.vision.lowHealth);
      levelUpMeter.setValue(engine.vision.levelUp);
      manaWMeter.setValue(engine.vision.ManaW);
      manaQMeter.setValue(engine.vision.ManaQ);
      manaEMeter.setValue(engine.vision.ManaE);
      manaRMeter.setValue(engine.vision.ManaR);
      if (!StopEffects) {
        if (!noQ && enableChampions) {
          q_Meter.setValue(engine.vision.qButton);
        }
        if (!noW && enableChampions) {
          w_Meter.setValue(engine.vision.wButton);
        }
        if (!noE && enableChampions) {
          e_Meter.setValue(engine.vision.eButton);
        }
        if (!noR && enableChampions) {
          r_Meter.setValue(engine.vision.rButton);
        }
        d_Meter.setValue(engine.vision.dButton);
        f_Meter.setValue(engine.vision.fButton);
        greyDragonMeter.setValue(engine.vision.greyDragon);
        yellowDragonMeter.setValue(engine.vision.yellowDragon);
        greyBaronMeter.setValue(engine.vision.greyBaron);
        yellowBaronMeter.setValue(engine.vision.yellowBaron);
        goldMeter.setValue(engine.vision.gold)
        settBarMeter.setValue(engine.vision.BlueBar);
        if (enableChampions) {
          Extendedq_Meter.setValue(engine.vision.ExtendedqButton)
          if (!ActiveExtendedW) {
            Extendedw_Meter.setValue(engine.vision.ExtendedwButton);
          }
          if (!ActiveExtendedE) {
            Extendede_Meter.setValue(engine.vision.ExtendedeButton);
          }
          Extendedr_Meter.setValue(engine.vision.ExtendedrButton);
        }
      }
    }

    playingMeter1.setValue(engine.vision.inGame1);
    playingMeter2.setValue(engine.vision.inGame2);

    champion = character;
    if (champion == "Karthus") checkKarthusQ()

    if (enableGold && play1 && play2) {
      if (currentNum >= goldLimit && !goldAnimPushed) {
        goldAnimPushed = true;
        effects.push(new goldEffect());
      }
    }

    var damage = engine.vision.tookDamage;
    if (damage > .001 && play1 && play2 && enableHealth && recallMeter.value != 0) {
      for (let i = 0; i < 2; i++) {
        effects.push(new ballPhysics(160, 200, Math.random() * 10 + 15, "red"))
      }
    }

    if (lowHealthMeter.value < .9 && lowHealthMeter.value > .05 && recallMeter.value != 0 && play1 && play2 && enableHealth) {
      for (let i = 0; i < 2; i++) {
        effects.push(new ballPhysics(160, 200, Math.random() * 10 + 15, "red"))
      }
    }

    for (let i = 0; i < effects.length; i++) {
      effects[i].draw(hctx);
    }
    effects = effects.filter(ele =>
      ele.lifetime === undefined || ele.lifetime > 0
    );
    ctx.clearRect(0, 0, width, height);
    ctx.drawImage(hiddenCanvas, 0, 0);

    window.requestAnimationFrame(update);
  }

  let proBack = [0, 0, 0]
    function onbackColorChanged(){
      proBack = hexToHSL(backColor)
    }

    let backgroundEaseHue = 0;
    let backgroundEaseLit = 0;
    let backgroundEaseSat = 0
    let gCycle = 0
    function backgroundHandler(){
        switch(backgroundMode){
            case "Color Cycle": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Color Cycle Ambience": 
            copyScreen(ambienceAlpha / 100)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Custom": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            break;
            case "Ambience": 
            copyScreen(ambienceAlpha / 100,hctx)
            break;
            case "Custom Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Ambience Audio Visualizer": 
            copyScreenAudio(ambienceAlpha / 100)
            break;
            case "Custom Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${backgroundEaseSat * .33 + 66}%, ${(backgroundEaseLit * .9 + 10) * (ambienceAlpha / 100)}%, 1)`)
            break;
            case "Color Cycle Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${backgroundEaseSat * .33 + 66}%, ${(backgroundEaseLit * .9 + 10) * (ambienceAlpha / 100)}%, 1)`)
            break;
        }
    }

    let audioScreenSat = 0
    let audioScreenLit = 0
    function copyScreenAudio(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      audioScreenSat += (engine.audio.density * 100 - audioScreenSat) / 10
      audioScreenLit += (engine.audio.density * 100 - audioScreenLit) / 10
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        hctx.fillStyle = `hsla(${hue[iZone]}, ${sat[iZone] * (audioScreenSat / 200 + .5)}%, ${lightness[iZone] * (audioScreenLit / 100)}%, ${alpha})`;
        hctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }
  
    function copyScreen(alpha, ctxTarget = hctx) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        if (backgroundMode === "Custom Ambience") {

        } else {
            let h = hue[iZone] + (backgroundMode == "Color Cycle Ambience" ? gCycle : 0);
            ctxTarget.fillStyle = `hsla(${h}, ${sat[iZone]}%, ${lightness[iZone]}%, ${alpha})`;

    function hexToHSL(hex) {
    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);

    var r = parseInt(result[1], 16);
    var g = parseInt(result[2], 16);
    var b = parseInt(result[3], 16);

    (r /= 255), (g /= 255), (b /= 255);
    var max = Math.max(r, g, b),
      min = Math.min(r, g, b);
    var h,
      s,
      l = (max + min) / 2;

    if (max === min) {
      h = s = 0; 
    } else {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r:
          h = (g - b) / d + (g < b ? 6 : 0);
          break;
        case g:
          h = (b - r) / d + 2;
          break;
        case b:
          h = (r - g) / d + 4;
          break;
      }
      h /= 6;
    }

    s = s * 100;
    s = Math.round(s);
    l = l * 100;
    l = Math.round(l);
    h = Math.round(360 * h);

    return [h, s, l];
  }

  function AkaliE(){
    this.rot = 0

    this.rad = 20
    this.a = 0
    this.half = false
    this.draw = function(){
      if(!this.half) this.a <= .45 ? this.a += .025 : this.half = true
      else this.a >= .01 ? this.a -= .01 : this.a = 0
      DrawRect(0, 0, 320, 200, getColorString(140, 100, 40, this.a))
      DrawStroke(this.x, 100, this.rad, "grey", 5)
      hctx.save()
      hctx.translate(this.x, 100)
      hctx.rotate(this.rot)
      hctx.translate(-this.x, -100)
      DrawTriangle(this.x, 100 - this.rad * 3, this.x + this.rad, 100 - this.rad, this.x - this.rad, 100 - this.rad, "grey")
      hctx.translate(this.x, 100)
      hctx.rotate(Math.PI / 2)
      hctx.translate(-this.x, -100)
      DrawTriangle(this.x, 100 - this.rad * 3, this.x + this.rad, 100 - this.rad, this.x - this.rad, 100 - this.rad, "grey")
      hctx.translate(this.x, 100)
      hctx.rotate(Math.PI / 2)
      hctx.translate(-this.x, -100)

      DrawTriangle(this.x, 100 - this.rad * 3, this.x + this.rad, 100 - this.rad, this.x - this.rad, 100 - this.rad, "grey")
