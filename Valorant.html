      let hue = new Int16Array(engine.zone.hue);
      audioScreenSat += (engine.audio.density * 100 - audioScreenSat) / 10
      audioScreenLit += (engine.audio.density * 100 - audioScreenLit) / 10
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        ctx.fillStyle = `hsla(${hue[iZone]}, ${sat[iZone] * (audioScreenSat / 200 + .5)}%, ${lightness[iZone] * (audioScreenLit / 100)}%, ${alpha})`;
        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }
  
    function copyScreen(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      for (var iZone = 0; iZone < 560; iZone++) {

        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;

  function BackgroundFade(speed, color) {
    this.alpha = 0;
    this.there = false;
    this.start = Date.now();
    this.lifetime = 10
    this.stop = 0;
    this.a = 0;
    this.color = hexToHSL(color)
    this.draw = function () {
      var fadeGrad = ctx.createRadialGradient(160, 100, 10, 160, 100, 250)
      fadeGrad.addColorStop(0, `hsla(${this.color.h}, ${this.color.s}%, ${this.color.l}%, 0)`)
      fadeGrad.addColorStop(this.stop, color)
      this.stop <= (1 - this.a) ? this.stop += this.a : null;
      this.a += .0002
      ctx.globalAlpha = this.alpha;
      DrawRect(0, 0, 320, 200, fadeGrad);
      ctx.globalAlpha = 1;
      if (this.there) {
        this.alpha >= .02 ? this.alpha -= .02 : this.lifetime = 0;
      } else {
        this.alpha <= .98 ? this.alpha += .02 : this.there = true;
      }
    }
  }

  function bounceBar(x, y, width, height, speed, bA, color) {
    this.reverse = false;
    this.speed = speed;
    this.color = color;
    this.x = x;
    this.y = y;
    this.width = width;
    this.height = height;
    this.bA = bA;
    this.bounces = 0;

    this.draw = function () {
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x, this.y, this.width, this.height);
      this.y += this.speed.y;
      this.x += this.speed.x;
      if (this.y > 200 - height) {
        this.speed.y = -this.speed.y;
        this.bounces++;
      }
      if (this.y < 0) {
        this.speed.y = -this.speed.y;
        this.bounces++;
      }
      if (this.x < 0) {
        this.speed.x = -this.speed.x;
        this.bounces++;
      }
      if (this.x > 320 - width) {
        this.speed.x = -this.speed.x;
        this.bounces++;
      }
      if (this.bounces > this.bA) {
        this.lifetime = 0;
      }
    }
  }

        }

          gradient.addColorStop(SetRange((-0 + (this.calculateVal)), 0, 1000) / 1000, "hsla(0, 0%, 0%,0.9)");

  function throwBall(startpos,endpos,speed,color,size){
      this.startPos = startpos;
      this.endPos = endpos;
      this.speed = speed;
      this.color = color;
      this.size = size;
      this.currentPos = {x: this.startPos.x, y: this.startPos.y};
      let tempAngle = Math.atan2(this.endPos.y - this.startPos.y, this.endPos.x - this.startPos.x);
      this.dirSpeed = {x: Math.cos(tempAngle) * this.speed, y: Math.sin(tempAngle) * this.speed};
      this.draw = function(){
        let percentage = getPercentageBasedOnPoints(this.startPos,this.endPos,this.currentPos);
        this.currentPos.x += this.dirSpeed.x;
        this.currentPos.y += this.dirSpeed.y;
        let sizeMod =1- Math.abs(percentage - 50) / 50;
        if (percentage<100){
          DrawCircle(this.currentPos.x,this.currentPos.y,this.size+ (sizeMod*this.size*2),this.color);
        } else {
          this.lifetime = 0;
        }
      }
  }
  
  

  function getPercentageBasedOnPoints(startPoint, endPoint, point) {
   
  const totalDistance = Math.sqrt((endPoint.x - startPoint.x) ** 2 + (endPoint.y - startPoint.y) ** 2);

  const distanceToPoint = Math.sqrt((point.x - startPoint.x) ** 2 + (point.y - startPoint.y) ** 2);

  return (distanceToPoint / totalDistance) * 100;
}

    function Fase2Effect() {
      this.start = Date.now();
      this.lifetime = 1;
      
      let ballRadius = 0;
      let pulse = 30;
      let pulseDir = 1;
      this.stripes = [];
      let explosionTriggered = false;

      this.draw = () => {
          const elapsed = Date.now() - this.start;

          if (Math.random() > 0.85 && ballRadius < 300) {
              this.stripes.push(new stripe({ x: Math.random() > 0.5 ? 0 : 320, y: Math.random() * 200 },{ x: 160, y: 100 },40, 10, 5,"hsl(0,0%,75%)",700));
          }

          this.stripes.forEach(s => s.draw());
          this.stripes = this.stripes.filter(s => !s.shouldStop);
          ballRadius = Math.min(elapsed / 120, 300);

          DrawCircle(160, 100, ballRadius, "hsl(0,0%,65%)", 6);

          pulse += pulseDir * 2;
          if (pulse >= 60 || pulse <= 30) pulseDir *= -1;
          DrawCircle(160, 100, Math.max(ballRadius - 6, 0), `hsl(0,100%,${pulse}%)`);

          if (ballRadius >= 75 && !explosionTriggered) {
              explosionTriggered = true;

                  this.lifetime = 0;
                  bombPushed = false;

          }
        };
            
      }

  function stripe(beginPoint, endPoint, width, height, speed, color, duration) {
    this.x = beginPoint.x;
    this.y = beginPoint.y;
    this.endPoint = endPoint;
    this.endX = endPoint.x;
    this.endY = endPoint.y;
    this.width = width;
    this.height = height;
    this.speed = speed;
    this.color = color;
    this.start = Date.now();
    this.duration = duration;

    this.rot = Math.atan2(this.endY - this.y, this.endX - this.x);
    this.draw = function () {
      ctx.beginPath();
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot);
      ctx.fillStyle = this.color;
      ctx.fillRect(0, 0, this.width, this.height);
      ctx.restore();
      this.x += this.speed * Math.cos(this.rot);
      this.y += this.speed * Math.sin(this.rot);

      if (Date.now() - this.start > this.duration) {
        this.shouldStop = true;
      }

    }
  }

  function rippleEffect(colors, speed, isHollow, direction, duration, backgroundcol = "null", repeatAmount = 0, circleDistance = 50, strokeSize = 1, autodelete = true) {
    this.start = new Date().getTime();
    this.isHollow = isHollow;
    this.direction = direction;
    this.colors = colors;
    this.speed = speed
    this.duration = duration;
    this.autodelete = autodelete;

    this.radius = [];
    this.strokeSize = strokeSize;
    this.background = backgroundcol;
    let colLength = this.colors.length;
    for (let index = 0; index < repeatAmount; index++) {
      for (let i = 0; i < colLength; i++) {
        this.colors.push(colors[i]);
      }
    }
    colors.forEach((color, i) => {
      if (this.direction == "out") {
        this.radius.push((-circleDistance * i));
      } else {
        this.radius.push(200 + (circleDistance * i));
      }
    });

    this.draw = function () {
      if (this.background != "null") {
        ctx.fillStyle = this.background;
        ctx.fillRect(0, 0, 320, 200);
      }
      this.elapsed = new Date().getTime() - this.start;
      colors.forEach((color, i) => {
        ctx.beginPath();
        ctx.arc(160, 100, SetRange(this.radius[i], 0, 500), 0, 2 * Math.PI);
        if (this.isHollow) {
          ctx.strokeStyle = color;
          ctx.lineWidth = this.strokeSize;
          ctx.stroke();
        } else {
          if (this.radius[i] < 200 || !this.autodelete) {
            ctx.fillStyle = color;
            ctx.fill();
          }
        }
        if (this.direction == "out") {
          this.radius[i] += this.speed;
        } else {
          this.radius[i] -= this.speed;
        }
      });
      if (this.elapsed > this.duration) this.lifetime = 0;
    }
  }

  function hexToHSL(hex) {
    var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);

    var r = parseInt(result[1], 16);
    var g = parseInt(result[2], 16);
    var b = parseInt(result[3], 16);

    (r /= 255), (g /= 255), (b /= 255);
    var max = Math.max(r, g, b),
      min = Math.min(r, g, b);
    var h,
      s,
      l = (max + min) / 2;

    if (max === min) {
      h = s = 0; // achromatic
    } else {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r:
          h = (g - b) / d + (g < b ? 6 : 0);
          break;
        case g:
          h = (b - r) / d + 2;
          break;
        case b:
          h = (r - g) / d + 4;
          break;
      }
      h /= 6;
    }

    s = s * 100;
    s = Math.round(s);
    l = l * 100;
    l = Math.round(l);
    h = Math.round(360 * h);

    var colors = [];
    colors['h'] = h;
    colors['s'] = s;
    colors['l'] = l;

    return colors;
  }

  function StateHandler() {
    this.stack = [];
    this.state = null;

    this.updateState = function () {
      if (this.stack.length > 0) {
        this.state = this.stack[this.stack.length - 1];
      } else {
        this.state = null;
      }
    };

    this.Push = function (newState) {
      this.stack.push(newState);
      this.updateState();
    };

    this.Pop = function () {
      this.stack.pop();
      this.updateState();
    };

    this.Process = function () {
      if (this.state != null) {
        this.state.Process();
      }
    };
  }

  function Meter(count, callback) {
    this.size = count;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    var values = [];

    this.setValue = function (updatedValue) {
      // Add and shift.
      values.push(updatedValue);
      if (values.length > this.size) {
        values.shift();
      }

      // Exit early if we've got a long-term match.
      for (var i = 0; i < values.length - 1; i++) {
        if (values[i] !== values[i + 1]) return;
      }

      // We got here, so we've got a matching value collection.
      if (this.value !== values[0]) {
        //var fromZero = this.value === 0;
        //var toZero = values[0] === 0;
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];
        callback();
      }
    };
  }

  function onEngineReady() {
    // Grab canvas and rendering context. 
    canvas = document.getElementById("exCanvas");
    ctx = canvas.getContext("2d");
    // Start updates *after* our engine is accessible and ready. 

    window.requestAnimationFrame(update);
  }  
</script>
