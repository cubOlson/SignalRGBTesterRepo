    function hexToHSL(hex) {
      var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  
      var r = parseInt(result[1], 16);
      var g = parseInt(result[2], 16);
      var b = parseInt(result[3], 16);
  
      (r /= 255), (g /= 255), (b /= 255);
      var max = Math.max(r, g, b),
        min = Math.min(r, g, b);
      var h,
        s,
        l = (max + min) / 2;
  
      if (max === min) {
        h = s = 0; // achromatic
      } else {
        var d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r:
            h = (g - b) / d + (g < b ? 6 : 0);
            break;
          case g:
            h = (b - r) / d + 2;
            break;
          case b:
            h = (r - g) / d + 4;
            break;
        }
        h /= 6;
      }
  
      s = s * 100;
      s = Math.round(s);
      l = l * 100;
      l = Math.round(l);
      h = Math.round(360 * h);
  
      return [h, s, l];
    }

    let lucioEq = false
    function handleHeroMainAbilities(){
      const hero = heroAbilities[heroChoice];
      if (!hero) return;

      if (heroChoice === "Zenyatta") {
        zenyattaaAbilities();
        return;
      }
      if(heroChoice === "Lucio" && !lucioEq){
        effects.push(new lucioEqualizer())
        lucioEq = true
      }

      if(hero.tag == "blocked"){
        handleHeroBlockedAbilities(hero)
      }else{
        handleHeroAbilities(hero)
      }
    }
    
    const pendingBlockedEffects = [];
    function handleHeroBlockedAbilities(hero) {

      const {meters,orangemeters, effects: heroEffects, flags, heroflags} = hero;

      for (let i = 0; i < hero.abilities; i++) {
        const meter = meters[i];
        const orangemeter = orangemeters[i];
        const effectFunc = heroEffects[i];
        const flagName = flags[i];
        const heroFlagName = heroflags[i];
       

        if (!meter || typeof meter.value !== "number") {
          continue;
        }
        if (!orangemeter || typeof orangemeter.value !== "number") {
          continue;
        }
  
        
        if (meter.value == 0 && effectsCanTrigger && skillFlags[flagName]) {
          setTimeout(() => {
            if (
              meter.value == 0 &&
              orangemeter.value >= 0.95 &&
              effectsCanTrigger &&
              skillFlags[flagName]
            ) {
              effects.push(effectFunc());
              skillFlags[flagName] = false;
              heroFlags[heroFlagName] = true;
            }
          }, 500); 
        }
        else if (meter.value >= .95  && effectsCanTrigger && engine.vision.SmallGroupNotWhite < 0.1) {
          skillFlags[flagName] = true;     
        }
      } 
    }



    function handleHeroAbilities(hero) {
      const { meters, effects: heroEffects, flags, heroflags } = hero;
   
      for (let i = 0; i < hero.abilities; i++) {
        const meter = meters[i];
        const effectFunc = heroEffects[i];
        const flagName = flags[i];
        const heroFlagName = heroflags[i];
       

        if (!meter || typeof meter.value !== "number") {
          continue;
        }

        if (meter.value == 0 && effectsCanTrigger && skillFlags[flagName]) {
          effects.push(effectFunc());       
          skillFlags[flagName] = false;     
          heroFlags[heroFlagName] = true;
        } 
        else if (meter.value >= 0.95 && effectsCanTrigger && engine.vision.SmallGroupNotWhite < 0.1) {
          skillFlags[flagName] = true;      
        }
      }
    }

    function zenyattaaAbilities(){
      const hero = heroAbilities.Zenyatta;
      if(ZenYellowMeter.value >= 0.95 && effectsCanTrigger && skillFlags[hero.flags[0]]){
          effects.push(new zenHeal(60))
          skillFlags[hero.flags[0]] = false
        } else if (ZenYellowMeter.value < .25 && effectsCanTrigger){
          skillFlags[hero.flags[0]] = true
        }
        if(ZenPurpleMeter.value >= 0.95 && effectsCanTrigger && skillFlags[hero.flags[1]]){
          effects.push(new zenHeal(260))
          skillFlags[hero.flags[1]] = false
        } else if (ZenPurpleMeter.value < .25 && effectsCanTrigger){
          skillFlags[hero.flags[1]] = true
        }
    }

  function brigitteBash(){
    this.mod = 0
    this.half = false
    this.draw = function(){
      if(!this.half) this.mod < 48 ? this.mod += (50 - this.mod) / 5 : this.half = true
      else this.mod > .1 ? this.mod *= .9 : this.lifetime = 0
      gBrigitteShieldMod = this.mod
    }
  }

  let gBrigitteShieldMod = 0
  function brigitteShield(){
    this.count = 0
    gAlpha = .1
    this.draw = function(){
      DrawRect(0, 0, 320, 200, `hsla(220, 100%, 50%, ${Math.sin(Date.now() / 500) * .02 + .03})`)
      if(this.count == 0){
        effects.push(new brigitteShieldHelp(320, 0, 0))
        effects.push(new brigitteShieldHelp(380, 30, 1))
      }
      this.count < 50 ? this.count++ : this.count = 0
      if(SmallGroup2WhiteMeter.value >= .75 || !effectsCanTrigger){
        this.lifetime = 0
        gAlpha = 1
      }
    }
  }

  function brigitteShieldHelp(x, y, mod){
    this.x = x
    this.y = y
    this.mod = mod % 3
    this.stepX = (this.x - (this.x - 60)) / 10
    this.stepY = (this.y - (this.y - (this.mod == 0 ? -60 : this.mod == 1 ? 0 : 60))) / 10
    this.step = 0
    this.draw = function(){
      if(this.x < 0) this.lifetime = 0
      for(let i = 0; i < 6; i++) DrawCircle(this.x - this.stepX * this.step, this.y - this.stepY * this.step + i * 120, 20 + gBrigitteShieldMod, `hsla(${240 - gBrigitteShieldMod}, 100%, 50%, 1)`)
      this.step < 10 ? this.step+=.5 : this.lifetime = 0
      if(this.x - this.stepX * this.step > 0 && this.lifetime == 0){
        effects.push(new brigitteShieldHelp(this.x - this.stepX * this.step, this.y - this.stepY * this.step, this.mod + 1))
      }
    }
  }

  function brigitteHeal(){
    this.rad = 1
    this.lifetime = 100
    this.draw = function(){
      effects.push(new brigitteHealHelp())
      this.lifetime--
    }
  }

  function brigitteHealHelp(){
    this.y = Math.random() * 200
    this.rot = Math.random() * Math.PI * 2
    this.stop = this.rot
    this.vy = Math.random() * 10 - 5
    this.draw = function(){
      hctx.save()
      hctx.translate(160, 100)
      hctx.rotate(this.rot)
      hctx.translate(-160, -100)
      DrawCircle(160, this.y, 20, `hsla(60, 100%, 50%, ${6 * (Math.PI / 4 - (this.rot - this.stop)) / Math.PI / 4})`)
      hctx.restore()
      this.rot-=.025
      if(this.stop - this.rot > Math.PI / 2) this.lifetime = 0
      this.y += this.vy
    }
  }

    this.rad = 1
    this.draw = function(){
      DrawStroke(160, 100, this.rad, `hsla(40, 100%, 50%)`, 50)
      this.rad < 300 ? this.rad += 5 : this.lifetime = 0
      effects.push(new brigitteWhipHelp())
    }

  function sombraHackHelp(){
    this.radX = Math.random() * 120 + 40
    this.radY = Math.random() * 120 + 40
    this.rot = Math.random() * Math.PI * 2
    this.rotMod = Math.random() * .5 + .75
    this.count = 0

      DrawCircle(tempX, tempY, 30, `hsla(30, 100%, 50%, 1)`)

      tempY = Math.sin(this.rot - .9) * this.radY + 100
      DrawCircle(tempX, tempY, 20, `hsla(0, 100%, 50%, .4)`)
      tempX = Math.cos(this.rot - 1.2) * this.radX + 160
      tempY = Math.sin(this.rot - 1.2) * this.radY + 100
      DrawCircle(tempX, tempY, 20, `hsla(0, 100%, 50%, .2)`)
      hctx.globalAlpha = 1

  function DrawGear(x, y, radius, stroke, teeth, color){
    DrawStroke(x, y, radius, color, stroke)
    for(let i = 0; i < teeth; i++){
      var ix = Math.cos(Math.PI * 2 / teeth * i) * radius + x;
      var iy = Math.sin(Math.PI * 2 / teeth * i) * radius + y;
      var rotate = Math.atan2(y - iy, x - ix) + Math.PI / 2;
      hctx.save()
      hctx.translate(ix, iy)
      hctx.rotate(rotate)
      hctx.translate(-ix, -iy)
      DrawRect(ix, iy, Math.PI * radius * 2 / teeth * .75, radius / 3 + stroke / 2, color)
      hctx.restore()
    }
  }

  function spark(x, y, scale){
    this.startX = x
    this.endX = x + (30 - Math.random() * 60)
    this.stepX = (this.endX - this.startX) / 5
    this.startY = y
    this.endY = y + (30 - Math.random() * 60)
    this.stepY = (this.endY - this.startY) / 5
    this.count = 1
    this.scale = scale
    this.done = false
    this.lifetime = 10
    this.draw = function(){
      if(this.scale < .1) this.lifetime = 0;
      hctx.beginPath()
      hctx.moveTo(this.startX, this.startY)
      hctx.lineTo(this.startX + this.stepX * this.count, this.startY + this.stepY * this.count)
      if(this.count < 5){
        this.count++
        if(this.count >= 5) {
          effects.push(new spark(this.endX, this.endY, this.scale * .8))
          if(Math.random() > .75) effects.push(new spark(this.endX, this.endY, this.scale * .8))
          if(!this.done){
            this.done = true
            setTimeout(()=>{
              this.lifetime = 0;
            }, 250)
          }
        }
      }
      hctx.lineWidth = 15 * this.scale
      hctx.strokeStyle = `white`
      hctx.stroke()
    }
  }

      this.backAlpha = this.effects.length / 4
      if(this.count == 0) this.effects.push(new rJumpHelp(240, 100, 100))
      if(this.count == 5) this.effects.push(new rJumpHelp(240, 100, 75))
      if(this.count == 10) this.effects.push(new rJumpHelp(240, 100, 50))
      if(this.count == 15) this.effects.push(new rJumpHelp(240, 100, 25))
      this.count < 16 ? this.count++ : this.count = 16;
      hctx.save()
      hctx.translate(160, 100)
      hctx.rotate(Math.PI)
      hctx.translate(-160, -100)
      for (let i = 0; i < this.effects.length; i++) {
            this.effects[i].draw()
        }
      this.effects = this.effects.filter(ele => ele.lifetime > 0)
      hctx.restore()
      if(this.effects.length == 0) this.lifetime = 0
    }
  }

  // ===================== NEW HERO: Domina =====================
  function dominaBarrierArray(){

    this.phase = 0
    this.y = 200
    this.alpha = 1
    this.time = 0
    this.cells = []

    for(let i = 0; i < 12; i++){
      this.cells.push({
        x: Math.floor(Math.random() * 8),
        y: Math.floor(Math.random() * 5),
        alpha: Math.random()
      })
    }

    this.draw = function(){

      if(this.phase == 0){

        DrawRect(0,this.y,320,200-this.y,`hsla(195,100%,65%,.35)`)
        drawBarrierGrid(this.y)
        this.y -= 8

        if(this.y <= 0){
          this.phase = 1
        }

      }else if(this.phase == 1){

        DrawRect(0,0,320,200,`hsla(195,100%,65%,.35)`)
        drawBarrierGrid(0)

        this.cells.forEach(cell=>{

          cell.alpha -= .04

          if(cell.alpha <= 0){
            cell.x = Math.floor(Math.random() * 8)
            cell.y = Math.floor(Math.random() * 5)
            cell.alpha = 1
          }

          let px = cell.x * 40 + 14
          let py = cell.y * 40 + 14

          hctx.globalAlpha = cell.alpha
          DrawRect(px,py,30,30,"white")
        })

        hctx.globalAlpha = 1
        this.time++

        if(this.time > 90){
          this.phase = 2
        }

      }else{

        hctx.globalAlpha = this.alpha
        DrawRect(0,0,320,200,`hsla(195,100%,65%,.35)`)
        drawBarrierGrid(0)
        hctx.globalAlpha = 1

        this.alpha -= .03

        if(this.alpha <= 0){
          this.lifetime = 0
        }
      }
    }
  }

  function drawBarrierGrid(offsetY){

    for(let x = 0; x < 320; x += 40){
      DrawRect(x,offsetY,6,200-offsetY,`hsla(210,100%,85%,.4)`)
    }

    for(let y = offsetY; y < 200; y += 40){
      DrawRect(0,y,320,6,`hsla(210,100%,85%,.25)`)
    }
  }

  function dominaSonicRepulsors(){

    this.phase = 0

    this.rad1 = 10
    this.rad2 = 30
    this.rad3 = 50

    this.explosionRad = 20

    this.alpha = 0;
    this.fadeOut = false;
    this.lifetime = 1;
    this.timer = 0;

    this.draw = function(){
      if(!this.fadeOut){

        if(this.alpha < .65)
          this.alpha += .04;
        else
          this.alpha = .65;

      }else{

        this.alpha -= .04;

        if(this.alpha <= 0){
          this.lifetime = 0;
          return;
        }
      }

      DrawRect(0,0,320,200,`hsla(0,0%,0%,${this.alpha})`);

      if(this.phase == 0){

        DrawStroke(160,100,this.rad1,`hsla(195,100%,60%,.8)`,30)
        DrawStroke(160,100,this.rad2,`hsla(200,100%,90%,.7)`,20)
        DrawStroke(160,100,this.rad3,`hsla(195,100%,75%,.6)`,15)

        drawRepulsorBits(this.rad1)
        drawRepulsorBits(this.rad2)
        drawRepulsorBits(this.rad3)

        this.rad1 += 3
        this.rad2 += 4
        this.rad3 += 5

        if(this.rad1 >= 200 && !this.fadeOut){
          this.fadeOut = true;
        }
      }
    }
  }

  function drawRepulsorBits(rad){

    for(let i = 0; i < 8; i++){

      let angle = i * Math.PI / 4

      let x = 160 + Math.cos(angle) * rad
      let y = 100 + Math.sin(angle) * rad

      DrawRect(x-6,y-6,12,12,"white")
    }
  }

  function dominaCrystalCharge(){

    this.phase = 0
    this.progress = 0
    this.time = 0
    this.alpha = 0;
    this.fadeIn = true;
    this.fadeOut = false;
    this.lifetime = 1;
    this.explosionRad = 10

    this.fragments = [
      { x:160, y:-40,  tx:160, ty:75,  type:"top" },
      { x:360, y:100,  tx:205, ty:100, type:"right" },
      { x:160, y:240,  tx:160, ty:125, type:"bottom" },
      { x:-40, y:100,  tx:115, ty:100, type:"left" }
    ]

    this.particles = []

    this.draw = function(){
      if(this.fadeIn){

        this.alpha += .04;

        if(this.alpha >= .65){
          this.alpha = .65;
          this.fadeIn = false;
        }

      }else if(this.fadeOut){

        this.alpha -= .04;

        if(this.alpha <= 0){
          this.alpha = 0;
          this.lifetime = 0;
          return;
        }
      }

      DrawRect(0,0,320,200,`hsla(0,0%,0%,${this.alpha})`);

      if(this.phase == 0){

        this.progress += .05

        this.fragments.forEach(f=>{
          let x = f.x + (f.tx-f.x)*this.progress
          let y = f.y + (f.ty-f.y)*this.progress
          drawCrystalPiece(x,y,40,f.type)
        })

        if(this.progress >= 1){
          this.phase = 1
          this.time = 0
        }

      }else if(this.phase == 1){

        let size = 60 + Math.sin(this.time/4)*5
        drawCrystal(160,100,size)
        this.time++

        if(this.time > 25){
          this.phase = 2
          this.time = 0
        }

      }else if(this.phase == 2){

        if(this.time == 0){

          for(let i = 0; i < 40; i++){

            let angle = Math.random()*Math.PI*2

            this.particles.push({
              x:160,
              y:100,
              dx:Math.cos(angle),
              dy:Math.sin(angle),
              speed:Math.random()*4+2,
              alpha:1,
              size:Math.random()*16+5
            })
          }
        }

        this.explosionRad += 12

        DrawStroke(160,100,this.explosionRad,`hsla(180,100%,80%,.8)`,16)

        this.particles.forEach(p=>{

          p.x += p.dx*p.speed
          p.y += p.dy*p.speed
          p.alpha -= .025

          hctx.globalAlpha = p.alpha
          drawCrystalTriangle(p.x,p.y,p.size + 10,"white")
          hctx.globalAlpha = 1
        })

        this.time++

        if(this.explosionRad > 250){
          this.phase = 3
        }

      }else{

        DrawRect(0,0,320,200,`hsla(180,100%,65%,${this.alpha})`);

  function FireParticle(x, y, speedX, speedY, size, decayRates = [0.03, 0.06]) {
    this.x = x;
    this.y = y;
    this.vx = speedX;
    this.vy = speedY;
    this.size = size;
    this.life = 1.0;
    this.decay = decayRates[0] + Math.random() * decayRates[1];
    this.lifetime = 100;

    this.draw = function() {
        this.x += this.vx;
        this.y += this.vy;

        this.vx *= 0.98;
        this.vy *= 0.98;

        this.life -= this.decay;

        if (this.life > 0) {
            hctx.save();
            hctx.globalCompositeOperation = 'lighter';
            hctx.globalAlpha = this.life;

            let hue = this.life * 50;

            hctx.beginPath();
            hctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
            hctx.fillStyle = `hsl(${hue}, 100%, 50%)`;

            hctx.shadowBlur = 10;
            hctx.shadowColor = `hsl(${hue}, 100%, 50%)`;

            hctx.fill();
            hctx.restore();
        } else {
            this.lifetime = 0;
        }
    }
  }

        hctx.fillStyle=`hsla(0,0%,0%,${this.alpha})`;

              let dx = tx - this.x;

              let dist = Math.sqrt(dx*dx + dy*dy);

              if (dist > this.speed) {

  function getPercentageBasedOnPoints(startPoint, endPoint, point) {

    const totalDistance = Math.sqrt((endPoint.x - startPoint.x) ** 2 + (endPoint.y - startPoint.y) ** 2);

    const distanceToPoint = Math.sqrt((point.x - startPoint.x) ** 2 + (point.y - startPoint.y) ** 2);

    return (distanceToPoint / totalDistance) * 100;
  }

  function throwBall(startpos,endpos,speed,color,size){
      this.startPos = startpos;
      this.endPos = endpos;
      this.speed = speed;
      this.color = color;
      this.size = size;
      this.currentPos = {x: this.startPos.x, y: this.startPos.y};
      let tempAngle = Math.atan2(this.endPos.y - this.startPos.y, this.endPos.x - this.startPos.x);
      this.dirSpeed = {x: Math.cos(tempAngle) * this.speed, y: Math.sin(tempAngle) * this.speed};
      this.draw = function(){
        let percentage = getPercentageBasedOnPoints(this.startPos,this.endPos,this.currentPos);
        this.currentPos.x += this.dirSpeed.x;
        this.currentPos.y += this.dirSpeed.y;
        let sizeMod =1- Math.abs(percentage - 50) / 50;
        if (percentage<100){
          DrawCircle(this.currentPos.x,this.currentPos.y,this.size+ (sizeMod*this.size*2),this.color);
        } else {
          this.lifetime = 0;
        }
      }
  }

  function sierraTremorCharge() {

    const cx = 160
    const cy = 20

    const spacing  = 40
    const rows     = [
      [0, 1, 2, -1, -2, 3, -3, -4,4],
      [0, 1, 2, -1, -2, 3, -3],
      [0, 1, 2, -1, -2],
      [0, 1, -1],
      [0]
    ]
    const rowCount = rows.length
    const rowH     = 40

    this.dots = []
    rows.forEach((offsets, ri) => {
      offsets.forEach(off => {
        this.dots.push({ x: cx + off * spacing, y: cy + ri * rowH, ri })
      })
    })

    const rowDelay   = 5
    const explodeDur = 21
    const pauseAfter = 30
    const totalFrames = rowCount * rowDelay + explodeDur + pauseAfter

    this.frame    = 0
    this.alpha = 0;
    this.fadeOut = false;
    this.lifetime = 1;

    this.draw = function () {
      if(!this.fadeOut){

        if(this.alpha < .65)
          this.alpha += .04;
        else
          this.alpha = .65;

      }else{

        this.alpha -= .04;

        if(this.alpha <= 0){
          this.alpha = 0;
          this.lifetime = 0;
          return;
        }
      }

      hctx.fillStyle=`hsla(0,0%,0%,${this.alpha})`;
      hctx.fillRect(0,0,320,200);

      this.dots.forEach(d => {

        const fireAt = (rowCount - 1 - d.ri) * rowDelay
        const local  = this.frame - fireAt

        if (local < 0) {
          DrawCircle(d.x, d.y, 16, `rgba(255,79,163,0.5)`)

        } else if (local < explodeDur) {
          const p = local / explodeDur

          const r = 4 + p * 28
          DrawCircle(d.x, d.y, 15,       `rgba(300,1,163,${1 - p})`,      2)
          DrawCircle(d.x, d.y, 30, `rgba(300,1,255,${(1-p)*0.4})`, 1)
          DrawCircle(d.x, d.y, 4 * (1 - p),   `rgba(300,255,255,${1 - p})`)
        }
      })

      this.frame++

      if (this.frame >= totalFrames)
        this.fadeOut = true;
    }
  }

  function sierraTrackingShot() {

    const cx = 160
    const cy = 100

    const sources = [
      { ax: cx - 250, ay: cy + 200 },
      { ax: cx + 250, ay: cy + 200 },
      { ax: cx - 250, ay: cy - 200 },
      { ax: cx + 250, ay: cy - 200 },
    ]

    const R            = 80
    const gap          = 0.25
    const span         = Math.PI / 2 - gap
    const stopDist     = R - 50
    const bulletW      = 60
    const bulletH      = 20
    const travelFrames = 33
    const pauseFrames  = 18
    const totalFrames  = travelFrames + pauseFrames

    this.frame    = 0
    this.alpha = 0;
    this.fadeOut = false;
    this.lifetime = 1;
    this.endDelay = 20;

    this.draw = function () {
      if(!this.fadeOut){

        if(this.alpha < .65)
          this.alpha += .04;
        else
          this.alpha = .65;

      }else{

        this.alpha -= .015;

        if(this.alpha <= 0){
          this.alpha = 0;
          this.lifetime = 0;
          return;
        }
      }

      hctx.fillStyle=`hsla(0,0%,0%,${this.alpha})`;
      hctx.fillRect(0,0,320,200);

      const p    = Math.min(1, this.frame / travelFrames)
      const done = this.frame >= travelFrames
      const pulse = done
        ? (0.7 + 0.3 * Math.sin(this.frame / 3))
        : (0.5 + p * 0.4)

      const fadeAlpha = pulse * this.alpha;

      for (let i = 0; i < 4; i++) {
        const mid   = (i / 4) * (Math.PI * 2)
        const start = mid - span / 2
        const end   = mid + span / 2
        drawArc(cx, cy, R, start, end, `rgba(255,0,255,${fadeAlpha})`, 25)
      }

      DrawCircle(cx, cy, 25, `rgba(255,0,163,${fadeAlpha * 2})`)

      if (!done) {
        sources.forEach(src => {
          const dx        = cx - src.ax
          const dy        = cy - src.ay
          const totalDist = Math.sqrt(dx * dx + dy * dy)
          const angle     = Math.atan2(dy, dx)
          const traveled  = p * (totalDist - stopDist)
          const bx        = src.ax + Math.cos(angle) * traveled
          const by        = src.ay + Math.sin(angle) * traveled
          drawRectRotated(bx, by, bulletW,        bulletH, angle, `rgba(255,255,255,0.9)`)
        })
      }

      if (done) {
        const ip = (this.frame - travelFrames) / pauseFrames
        DrawCircle(cx,cy,R + 4 + ip * 20,`rgba(255,0,163,${(1 - ip) * 0.5 * this.alpha})`,2)
      }

      this.frame++

      if(this.frame >= totalFrames + this.endDelay)
        this.fadeOut = true;
    }
  }

  function sierraAnchorDrone() {

    const cx = 160
    const cy = 100

    const riseFrames   = 30
    const hoverFrames  = 18
    const tetherFrames = 30
    const pauseFrames  = 24
    const totalFrames  = riseFrames + hoverFrames + tetherFrames + pauseFrames

    const tetherDirs = [
      { angle: 0 },
      { angle: Math.PI / 2 },
      { angle: Math.PI },
      { angle: Math.PI * 1.5 },
    ]

    const s = 3

    this.frame    = 0
    this.alpha = 0;
    this.fadeOut = false;
    this.lifetime = 1;

    this.draw = function () {

      if(!this.fadeOut){

        if(this.alpha < .65)
          this.alpha += .04;
        else
          this.alpha = .65;

      }else{

        this.alpha -= .04;

        if(this.alpha <= 0){
          this.alpha = 0;
          this.lifetime = 0;
          return;
        }
      }

      hctx.fillStyle=`hsla(0,0%,0%,${this.alpha})`;
      hctx.fillRect(0,0,320,200);

      const f = this.frame

      let droneY, droneAlpha
      if (f < riseFrames) {
        const p  = f / riseFrames
        const ep = 1 - Math.pow(1 - p, 3)
        droneY     = 220 - ep * (220 - cy)
        droneAlpha = p
      } else {
        droneY     = cy
        droneAlpha = 1
      }

      if (f >= riseFrames + hoverFrames) {
        const tp = Math.min(1, (f - riseFrames - hoverFrames) / tetherFrames)

        tetherDirs.forEach(dir => {
          const maxLen = dir.angle === 0           ? 320 - cx
                      : dir.angle === Math.PI     ? cx
                      : dir.angle === Math.PI / 2 ? 200 - cy
                      : cy

          const len = tp * maxLen
          const ex  = cx + Math.cos(dir.angle) * len
          const ey  = cy + Math.sin(dir.angle) * len

          hctx.beginPath()
          hctx.moveTo(cx, cy)
          hctx.lineTo(ex, ey)
          hctx.strokeStyle = `rgba(300,1,163,0.15)`
          hctx.lineWidth = 50
          hctx.stroke()

          hctx.beginPath()
          hctx.moveTo(cx, cy)
          hctx.lineTo(ex, ey)
          hctx.strokeStyle = `rgba(300,1,163,0.85)`
          hctx.lineWidth = 30
          hctx.stroke()

          const nx = cx + Math.cos(dir.angle) * len * 0.75
          const ny = cy + Math.sin(dir.angle) * len * 0.75
          DrawCircle(nx, ny, 5, `rgba(200,120,255,${tp})`)

          if (tp > 0.85) {
            const ep2 = (tp - 0.85) / 0.15
            DrawStroke(ex, ey, 5 * ep2, `rgba(255,255,255,${ep2 * 0.8})`, 1.5)
          }
        })
      }

      if (f >= riseFrames) {
        const hp = (f - riseFrames) / (hoverFrames + tetherFrames + pauseFrames)
        for (let i = 0; i < 2; i++) {
          const rp = ((hp * 2 + i * 0.5) % 1)
          DrawStroke(cx, cy, 10 + rp * 30, `rgba(300,1,163,${(1 - rp) * 0.25})`, 1)
        }
      }

      if (f < riseFrames) {
        const p = f / riseFrames
        for (let i = 0; i < 6; i++) {
          const tp2 = i / 6
          const ty  = droneY + tp2 * 30
          DrawCircle(cx, ty, 1.5 - tp2, `rgba(200,120,255,${(1 - tp2) * 0.4 * p})`)
        }
      }

      const arms = [[-10,-8],[10,-8],[-10,8],[10,8]]
      arms.forEach(([ax, ay]) => {
        const fromX = cx + (ax > 0 ? 8 : -8) * s
        const fromY = droneY + (ay > 0 ? 4 : -4) * s
        hctx.beginPath()
        hctx.moveTo(fromX, fromY)
        hctx.lineTo(cx + ax * s, droneY + ay * s)
        hctx.strokeStyle = `rgba(136,136,170,${droneAlpha})`
        hctx.lineWidth = 2 * s
        hctx.stroke()
        DrawCircle(cx + ax * s* 1.5, droneY + ay * s * 2.3, 8 * s, `rgba(68,68,85,${droneAlpha})`)
        DrawStroke(cx + ax * s* 1.5, droneY + ay * s * 2.3 , 8 * s, `rgba(153,153,187,${droneAlpha})`, s)
      })


      DrawRect(cx - 16 * s, droneY - 10 * s, 32 * s, 20 * s, `rgba(200,200,216,${droneAlpha})`)

      const pulse = 0.85 + 0.15 * Math.sin(f / 3)
      DrawCircle(cx, droneY, 10 * s, `rgba(300,20,120,${pulse * droneAlpha})`)
      DrawCircle(cx, droneY, 5 * s, `rgba(255,120,200,${pulse * droneAlpha})`)
      DrawCircle(cx, droneY, 3 * s, `rgba(300,1,255,${pulse * droneAlpha})`)

      this.frame++

        this.fadeOut = true;

            this.particles[i].draw()
        }
      this.particles = this.particles.filter(ele => ele.lifetime > 0)
      hctx.globalAlpha = 1;

      if (this.counter == 30) {
        if (this.alpha > 0) {
          this.alpha -= 0.05;
        } else {
          this.lifetime = 0;
        }

  function movingPlus(x, y, size, color, speed) {
    this.x = x;
    this.y = y;
    this.size = size;
    this.start = Date.now();
    this.color = color;
    this.speed = speed;
    this.lifetime = 100  
    this.draw = function () {
      this.y += this.speed;
      hctx.save();
      hctx.beginPath();
      hctx.translate(this.x, this.y);
      hctx.rotate((Date.now() - this.start) / 700);
      hctx.moveTo(-this.size, -this.size);
      hctx.lineTo(this.size, this.size);
      hctx.moveTo(-this.size, this.size);
      hctx.lineTo(this.size, -this.size);
      hctx.strokeStyle = this.color;
      hctx.lineWidth = 20;
      hctx.stroke();
      hctx.restore();
      if(this.y > 300 || this.y < -50) this.lifetime = 0 
    }
  }


  function victoryDefeat(type) {
    this.lifetime = 10;
    this.alpha = 0;
    this.count = 0;
    var theLightning = new lightning(8, type ? "yellow" : "hsl(0, 0%, 10%)")
    var theLightning2 = new lightning(8, type ? "cyan" : "red")
    this.start = Date.now()
    this.draw = function () {
      var elapsed = Date.now() - this.start;
      if (elapsed < 3000) this.alpha <= .95 ? this.alpha += .05 : this.alpha = 1;
      hctx.globalAlpha = this.alpha;
      drawRect(0, 0, 320, 200, "black")
      if (theLightning.points.length > 1 && theLightning2.points.length > 1) {
        theLightning2.draw()
        theLightning.draw()
      }
      hctx.globalAlpha = 1;
      if (elapsed > 3000 && this.count % 5 == 0) {
        theLightning.points.pop()
        theLightning2.points.shift()
      }
      if (elapsed > 3000) this.count++;
      if (elapsed > 3500) {
        this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0;
        if (this.lifetime == 0) victoryGoing = false;
      }
    }
  }

  function lightning(size, color) {
    this.points = [];
    while (this.points.length <= size) {
      this.points.push([this.points.length * (350 / size) - 25, 100])
    }
    this.draw = function () {
      drawLightning(this.points, color, 15)
      this.points.forEach((ele, i) => {
        var mod = Math.sin(Date.now() / (100000 * Math.random()))
        switch (i) {
          case 0:
            this.points[i][1] < 90 ? this.points[i][1] += 2 :
              this.points[i][1] > 110 ? this.points[i][1] -= 2 :
                this.points[i][1] += mod * 10;
            break;
          case this.points.length - 1:
            this.points[i - 1][1] - this.points[i][1] < -30 ? this.points[i][1] -= 5 :
              this.points[i - 1][1] - this.points[i][1] > 30 ? this.points[i][1] += 5 :
                this.points[i][1] += mod * 10;
            break;
          default:
            this.points[i - 1][1] - this.points[i][1] < -30 ? this.points[i][1] -= 5 :
              this.points[i - 1][1] - this.points[i][1] > 30 ? this.points[i][1] += 5 :
                this.points[i][1] += mod * 10;
            this.points[i][0] < i * (320 / this.points.length) ? this.points[i][0] += 5 :
              this.points[i][0] > i * (320 / this.points.length) + (320 / this.points.length) ? this.points[i][0] -= 5 :
                this.points[i][0] += mod * 10;
            break;
        }
      })
    }
  }


  function drawLightning(array, color, width) {
    hctx.beginPath()
    hctx.moveTo(...array[0])
    array.forEach((ele, i) => {
      if (i) {
        hctx.lineTo(...array[i])
      }
    });
    hctx.strokeStyle = color;
    hctx.lineJoin = "round";
    hctx.lineWidth = width + Math.random() * width;
    hctx.stroke()
  }

        this.counter = checkCounter(this.counter, 30, healthBarLengthMeter.value > .33)
      hctx.beginPath();
      hctx.lineWidth = 10;
      hctx.moveTo(-10, 100);
      for (let index = 0; index < 320; index++) {
        if (Math.sin((index + this.elapsed * 1.3) / 320) < 0) {
          hctx.lineTo(index, 100 + Math.sin((index + this.elapsed * 1.3) / 160) * 50);
        } else {
          hctx.lineTo(index, 100)
        }
      }
      hctx.lineTo(330, 300);
      hctx.lineTo(-10, 300);
      hctx.lineTo(-10, 100);
      hctx.fillStyle = "hsla(0, 100%, 50%, .8)";

      } else if (engine.vision.healthBarLength == 0) {

  function KillEffect() {
    this.x = 0;
    this.y = 0;
    this.size = 0;
    this.rot = 0;
    this.start = Date.now();
    this.counter = 0;
    this.draw = function () {

      hctx.beginPath();
      hctx.fillStyle = `hsla(0, 0%, 0%, ${this.elapsed < 1000 ? this.elapsed / 1200 : this.elapsed > 2000 ? 0.8 - (this.elapsed - 2000) / 1200 : 0.9})`;
      hctx.fillRect(0, 0, 320, 200)
      drawSkullHalf(160 - this.x, 90 + Math.sin(this.elapsed / 100) * 2 + this.y, 40, "white", "l", this.rot)
      drawSkullHalf(160 + this.x, 90 + Math.sin(this.elapsed / 100) * 2 + this.y, 40, "white", "r", -this.rot)
      if (this.elapsed < 1000) {
        hctx.beginPath();
        let grad = hctx.createLinearGradient(150, -100 + ((this.elapsed) / 4), 150, 0 + ((this.elapsed) / 4));
        grad.addColorStop(0, "hsla(0, 100%, 50%, 0)");
        grad.addColorStop(0.5, "hsla(0, 100%, 50%, 1)")
        grad.addColorStop(0.95, "hsla(0, 100%, 50%, 1)")
        grad.addColorStop(1, "hsla(0, 100%, 50%, 0)");
        hctx.fillStyle = grad;
        hctx.fillRect(150, 30, 20, 140)
      } else {
        this.x += 1.8;
        this.rot -= 0.03;
        this.y += 1;
        effects.push(new bloodSplatter(160, 100, 10, { x: (Math.random() - 0.5) * 5, y: (Math.random() - 0.5) * 5 }))
      }
      if (this.elapsed > 3000 || (engine.vision.inGameBlueRight == 0 && engine.vision.inGameBlueLeft == 0 && engine.vision.inGameBlueBottom == 0)) {
        this.lifetime = 0;
      }
    }

  function bloodSplatter(x, y, size, dir) {
    this.x = x;
    this.y = y;
    this.size = size;
    this.dir = dir;
    this.start = Date.now();
    this.draw = function () {
      this.elapsed = Date.now() - this.start;
      hctx.beginPath();
      hctx.fillStyle = "hsla(0, 100%, 50%, 1)";
      hctx.arc(this.x, this.y, this.size, 0, 2 * Math.PI);
      hctx.fill();
      this.x += this.dir.x;
      this.y += this.dir.y;
      if (this.elapsed > 1000) {
        this.lifetime = 0;
      }
    }

  }

  function drawSkullHalf(x, y, size, color, dir, rotate) {
    hctx.beginPath();
    hctx.save();
    hctx.translate(x, y);
    hctx.rotate(rotate);
    hctx.ellipse(0, 0, size * 1.5, size, 0, dir == "l" ? 0.5 * Math.PI : 1.5 * Math.PI, dir == "l" ? 1.5 * Math.PI : 0.5 * Math.PI);
    hctx.fillStyle = color;
    hctx.fill();
    hctx.fillRect(dir == "l" ? -size : 0, size / 1.5, size, size);
    hctx.beginPath();
    if (dir == "l") {
      hctx.arc(-size / 2, 0, size / 3, 0, 2 * Math.PI);
    } else {
      hctx.arc(size / 2, 0, size / 3, 0, 2 * Math.PI);
    }


    hctx.fillStyle = "black";
    hctx.fill();
    hctx.restore();

  }

  function healEffect() {
    this.alpha = 0;
    this.counter = 0;
    this.start = Date.now();
    healgoing = true;
    this.particles = [];
    this.lifetime = 1
    this.draw = function () {
      if (Math.random() > 0.9) {
        this.particles.push(new movingPlus(Math.random() * 320, 250, 30, "yellow", -5))
      }
      if (this.alpha < 1 && this.counter < 30) {
        this.alpha += 0.025;
      }
      this.elapsed = this.start - Date.now();
      this.counter = checkCounter(this.counter, 30, gettingHealedTRMeter.value < 0.8)
      hctx.globalAlpha = this.alpha;
      drawRadialGradient('hsla(0,0%,0%,0)', "orange", Math.sin(this.elapsed / 190) * 40 + 150, 10);
      for (let i = 0; i < this.particles.length; i++) {
            this.particles[i].draw()
        }
      this.particles = this.particles.filter(ele => ele.lifetime > 0)
      hctx.globalAlpha = 1;
      if (this.counter == 30) {
        if (this.alpha > 0) {
          this.alpha -= 0.05;
        } else {
          healgoing = false;
          this.lifetime = 0;
        }
        if (!healgoing || !effectsCanTrigger) {
          this.lifetime = 0;
        }
      }
    }
  }


  function checkCounter(counter, max, condition) {
    if (condition) {
      if (counter < max) {
        counter++;
      }
    } else {
      return 0;
    }
    return counter;
  }

  function overTimeEffect() {
    this.particles = [];
    this.lifetime = 1
    this.draw = function () {
      healgoing = false
      this.particles.push(new randomParticle(OverTimeBarMeter.value * 320, Math.random() * 200, { x: -Math.random() * 6 - 3, y: 0 }, ` hsla(${15 + Math.random() * 20}, 100%, 50%, 1)`, 40))
      drawRect(0, 0, OverTimeBarMeter.value * 320, 200, "hsla(63, 100%, 50%, 0.8)")
      drawRect(OverTimeBarMeter.value * 320 - 10, 0, 10, 200, "hsla(33, 100%, 50%, 1)")
      for (let i = 0; i < this.particles.length; i++) {
            this.particles[i].draw()
        }
        this.particles = this.particles.filter(ele => ele.lifetime > 0)
      if (!overTimeGoing) {
        this.lifetime = 0;
      }
    }
  }

  function randomParticle(x, y, speed, color, xSize, ySize) {
    this.data = { x: x, y: y, size: Math.random() * xSize };
    this.speed = speed;
    this.start = Date.now();
    this.lifetime = 1
    this.draw = function () {
      hctx.beginPath();
      hctx.fillStyle = color;
      hctx.fillRect(this.data.x - this.data.size, this.data.y, this.data.size, this.data.size);
      this.data.x += this.speed.x;
      this.data.y += this.speed.y;
      if (Date.now() - this.start > 2000) {
        this.lifetime = 0;
      }
    }
  }

  function ultReadyEffect() {
    this.elapsed;
    this.blackEdgeGradient;
    this.finalRing;
    this.pushedRipples = false;
    this.start = GetTime();
    this.draw = function () {
      this.elapsed = GetTime() - this.start
      hctx.beginPath();
      if (this.elapsed < 800) {
        this.blackEdgeGradient = hctx.createRadialGradient(160, 100, 5, 160, 100, 900 - this.elapsed)
        this.blackEdgeGradient.addColorStop(0, "hsla(0,0%,0%,0)")
        this.blackEdgeGradient.addColorStop(1, "black")
      }
      hctx.fillStyle = this.blackEdgeGradient
      hctx.fillRect(0, 0, 320, 200)
      if (this.elapsed < 2000) {
        hctx.beginPath();
        hctx.arc(160, 100, 50, 0, (this.elapsed / 500) * Math.PI);
        hctx.strokeStyle = "orange"
        hctx.lineWidth = 20
        hctx.stroke();
        hctx.lineWidth = 1;
      }

      if (this.pushedRipples == false && this.elapsed > 1400) {
        effects.push(new RippleEffect(160, 100, 8, 800, 30, `hsla(35, 100%, 58%, 1)`, "out", "fill", 1))
        for (let i = 0; i < 5; i++) {
          setTimeout(() => {

            effects.push(new RippleEffect(160, 100, 8, 800, 30, `hsla(${243 - i * 20}, 100%, 58%, 1)`, "out", "fill", 1))

          }, 150 * i)
          this.pushedRipples = true
        }
      }
      if (this.elapsed > 2500) {
        this.finalRing = hctx.createRadialGradient(160, 100, 5, 160, 100, 5 + ((this.elapsed - 2500) / 4))
        this.finalRing.addColorStop(0 + (this.elapsed - 2500) / 1200, "hsla(0,0%,0%,0)")
        this.finalRing.addColorStop(1, `hsla(${143}, 100%, 58%, 1)`)
        hctx.fillStyle = this.finalRing
        hctx.fillRect(0, 0, 320, 200)
        if (this.elapsed > 3300) {
          this.lifetime = 0
        }
      }
    }
  }

  function FadeInOut(inOrOut) {
    this.start = GetTime();
    this.x = inOrOut == "in" ? -600 : 0;
    this.draw = function () {
      this.elapsed = GetTime() - this.start;
      hctx.fillStyle = "black";
      hctx.fillRect(this.x, 0, 600, 200)
      this.x += 20;
      if (this.elapsed > 700) {
        this.lifetime = 0;
      }
    }
  }



  function renderPath(x, y, path, color, xsize, ysize) {
    hctx.fillStyle = color;
    hctx.save();
    hctx.transform(xsize / 10, 0, 0, ysize / 10, 160 - 10 * 16.5, 79 - xsize * 7.5);
    hctx.translate(x, y);
    let ex = new Path2D(path);
    hctx.fill(ex);
    hctx.restore()
  }

  function drawRadialGradient(color1, color2, inneRadius, fade) {
    hctx.beginPath();
    let gradient = hctx.createRadialGradient(160, 100, inneRadius, 160, 100, inneRadius + fade)
    gradient.addColorStop(0, color1);
    gradient.addColorStop(1, color2);
    hctx.fillStyle = gradient;
    hctx.fillRect(0, 0, 320, 200);
  }


  function DrawCircle(x, y, radius, color) {
    hctx.beginPath();
    hctx.fillStyle = color;
    hctx.arc(x, y, radius, 0, 2 * Math.PI)
    hctx.fill();
  };

  function DrawStroke(x, y, radius, color, stroke) {
    hctx.beginPath();
    hctx.strokeStyle = color;
    hctx.lineWidth = stroke;
    hctx.arc(x, y, radius, 0, 2 * Math.PI)
    hctx.stroke();
  };

  function DrawStrokeCircle(x, y, radius, color, stroke) {
    hctx.beginPath();
    hctx.strokeStyle = color;
    hctx.lineWidth = stroke;
    hctx.arc(x, y, radius, 0, 2 * Math.PI)
    hctx.stroke();
  };

  function drawRect(x, y, height, width, color) {
    hctx.beginPath();
    hctx.fillStyle = color;
    hctx.fillRect(x, y, height, width);
  }

  function GetTime() {
    return new Date().getTime()
  }

  function RippleEffect(x, y, speed, duration, rippleWidth, color, inOrOut, fillOrStroke, amountOfRipples) {
    this.col = color;
    this.speed = speed;
    this.dur = duration;
    this.width = rippleWidth;
    this.start = GetTime();
    this.lifetime;
    this.x = x;
    this.y = y;
    this.fill = fillOrStroke;
    this.radius = 0;
    this.amount = amountOfRipples;
    if (inOrOut == "in") {
      this.radius = 200 + (this.width * (this.amount * 2));
      this.speed = -this.speed
    }

    this.draw = function () {
      hctx.lineWidth = this.width;
      hctx.beginPath();
      for (let i = 0; i < this.amount; i++) {
        if (this.radius - i * (this.width * 2) > 0) {
          hctx.arc(this.x, this.y, this.radius - i * (this.width * 2), 0, 2 * Math.PI);
        }
      }
      if (this.fill == "fill") {
        hctx.fillStyle = this.col;
        hctx.fill();
      } else {
        hctx.strokeStyle = this.col;
        hctx.stroke();
      }
      this.radius += this.speed;
      this.lifetime = this.dur - (GetTime() - this.start);
      if (this.lifetime <= 0) {
        utilityPlayed = false;
      }
    }
  }


  function Meter(size, callback) {
    this.size = size;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    var values = [];

    this.setValue = function (updatedValue) {
      values.push(updatedValue);
      if (values.length > this.size) {
        values.shift();
      }

      for (var i = 0; i < values.length - 1; i++) {
        if (values[i] !== values[i + 1]) return;
      }
      if (this.value !== values[0]) {
        this.diff = Math.abs(this.value - values[0])
        this.increased = this.value < values[0]
        this.decreased = this.value > values[0]
        this.value = values[0]
        callback()
      }
    }
  }
  window.requestAnimationFrame(update)
</script>
