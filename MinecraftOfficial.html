  let proBack = [0, 0, 0]

    let backgroundEaseHue = 0;
    let backgroundEaseLit = 0;
    let backgroundEaseSat = 0
    let gCycle = 0
    function backgroundHandler(){
        switch(backgroundMode){
            case "Color Cycle": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Color Cycle Ambience": 
            copyScreen(ambienceAlpha / 100)
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            break;
            case "Custom": 
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${proBack[1]}%, ${proBack[2]}%, ${ambienceAlpha / 100})`)
            break;
            case "Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Custom Ambience": 
            copyScreen(ambienceAlpha / 100)
            break;
            case "Ambience Audio Visualizer": 
            copyScreenAudio(ambienceAlpha / 100)
            break;
            case "Custom Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0]}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
            case "Color Cycle Audio Visualizer": 
            backgroundEaseSat += (engine.audio.density * 100 - backgroundEaseSat) / 10
            backgroundEaseLit += (engine.audio.density * 100 - backgroundEaseLit) / 10
            gCycle < 360 ? gCycle += .5 : gCycle = 0
            DrawRect(0, 0, 320, 200, `hsla(${proBack[0] + gCycle}, ${backgroundEaseSat * .33 + 66}%, ${backgroundEaseLit * .9 + 10}%, ${ambienceAlpha / 100})`)
            break;
        }
    }

    let audioScreenSat = 0
    let audioScreenLit = 0
    function copyScreenAudio(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      audioScreenSat += (engine.audio.density * 100 - audioScreenSat) / 10
      audioScreenLit += (engine.audio.density * 100 - audioScreenLit) / 10
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        ctx.fillStyle = `hsla(${hue[iZone]}, ${sat[iZone] * (audioScreenSat / 200 + .5)}%, ${lightness[iZone] * (audioScreenLit / 100)}%, ${alpha})`;
        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }
  
    function copyScreen(alpha) {
      let lightness = new Int8Array(engine.zone.lightness);
      let sat = new Int8Array(engine.zone.saturation);
      let hue = new Int16Array(engine.zone.hue);
      for (var iZone = 0; iZone < 560; iZone++) {
        var iRow = Math.floor(iZone / 28);
        var iCol = iZone % 28;
        var iWidth = 320 / 28;
        var iHeight = 200 / 20;
        var iZx = iCol * iWidth;
        var iZy = iRow * iHeight;
        ctx.fillStyle = `hsla(${(backgroundMode == "Custom Ambience" ? proBack[0] : hue[iZone] + gCycle * (backgroundMode == "Color Cycle Ambience"))}, ${sat[iZone]}%, ${lightness[iZone]}%, ${alpha})`;
        ctx.fillRect(iZx, iZy, iWidth, iHeight);
      }
    }

    this.y = healthY * 2

  function lerp(a, b, speed) {

  function TrailParticle(x=160,y=100,size=10,color="red",duration=2000){
      this.x = x;
      this.y = y;
      this.size = size;
      this.color = color;
      this.duration = duration;
      this.start = Date.now();
      this.draw = function(){
        this.elapsed = (Date.now() - this.start);
        this.alpha = SetRange(1-(this.elapsed / this.duration),0,1);
        ctx.globalAlpha = this.alpha;
        DrawCircle(this.x,this.y,this.size*this.alpha,this.color)
        ctx.globalAlpha = 1;
        if(this.elapsed > this.duration){
          this.lifetime = 0;
        }
      }
    }

    function SetRange(num, min, max) {
      return Math.min(Math.max(num, min), max)
    }

    function openChestEffect(){
    this.y = 0
    this.alpha = 0
    this.half = false
    this.draw = function (){
      DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${this.alpha})`)
      DrawRect(0, this.y, 320, 100, `hsla(20, 100%, 29%, ${this.alpha})`)
      DrawRect(0, 100 - this.y, 320, 100, `hsla(20, 100%, 15%, ${this.alpha})`)
      DrawRect(135, this.y + 75, 50, 50, `hsla(20, 0%, 50%, ${this.alpha})`)
      if(!this.half) this.alpha <= .95 ? this.alpha += .05 : this.y > -100 ? this.y-- : this.half = true
      else this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
    }
  }

  class ExplosionParticle {
    constructor(x, y, radius, color, fadeSpeed, velocity) {
      this.x = x;
      this.y = y;
      this.color = color;
      this.radius = radius;
      this.velocity = velocity;
      this.alpha = 1 * fadeSpeed;
    }
    draw() {
      ctx.globalAlpha = this.alpha;
      ctx.beginPath()
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false)
      ctx.fillStyle = this.color
      ctx.fill()
      this.x += this.velocity.x
      this.y += this.velocity.y
      this.alpha -= 0.01
      ctx.globalAlpha = 1;
      if (this.alpha <= 0) {
        this.lifetime = 0;
      }
    }
  }

  function childArray(){
    this.children = [];
    this.push = function(child){
      this.children.push(child);
    }
    this.draw = function(){
      this.children.forEach((child,i) => {
        child.draw();
        if (child.lifetime <=0){
          this.children.splice(i,1);
        }
      });
    }
    this.clear = function(){
      this.children = [];
    }
  }

  function xpParticle() {
    this.x = 160;
    this.y = 100;
    this.radius = Math.random() * 10 + 10;
    this.vx = 10 - Math.random() * 20;
    this.vy = 10 - Math.random() * 20;
    this.lifetime = 10;
    this.color = Math.floor(Math.random() * 10) % 2 == 0 ? "green" : "yellow";
    this.draw = function () {
      DrawCircle(this.x, this.y, this.radius, this.color)
      this.x += this.vx;
      this.y += this.vy;
      this.vx > 0 ? this.vx -= .005 : this.vx += .005;
      this.vy += .5;
      this.y > 250 ? this.lifetime = 0 : null;
    }
  }

  function DrawStroke(x, y, radius, color, stroke) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = stroke;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.stroke();
  };

  function sleeping() {
    this.start = Date.now();
    this.rot1 = -2;
    this.rot2 = -2;
    this.y1 = 200;
    this.hue = 240;
    this.sat = 0;
    this.lit = 0;
    this.night = false;
    this.morning = false;
    this.done = false;
    this.alpha2 = 1;
    this.lifetime = 10;
    this.draw = function () {
      let elapsed = Date.now() - this.start;
      if (this.morning) {
        ctx.globalAlpha = this.alpha2;
      } else {
        ctx.globalAlpha = (200 - this.y1) / 200;
      }
      DrawRect(0, this.y1, 320, 200, `hsl(${this.hue}, ${this.sat}%, ${this.lit}%)`)
      if (!this.morning) {
        ctx.globalAlpha = 1;
      }
      this.y1 > 0 ? this.y1 -= 3 : this.night = true;
      if (this.morning) {
        ctx.save()
        ctx.translate(160, 200)
        ctx.rotate(this.rot2)
        ctx.translate(-160, -200)
        DrawRect(135, 75, 50, 50, "yellow")
        ctx.restore()
        this.rot2 < 0 ? this.rot2 += .03 : this.done = true;
        this.hue = 40;
        this.lit = 50 + this.rot2 * 25
        this.sat = 50 - (this.rot2 * 25)
      } else if (this.night) {
        ctx.save()
        ctx.translate(160, 200)
        ctx.rotate(this.rot1)
        ctx.translate(-160, -200)
        DrawRect(135, 75, 50, 50, "white")
        ctx.restore()
        this.rot1 < 2 ? this.rot1 += .03 : this.morning = true;
        this.lit = 24 - (Math.abs(this.rot1) * 12)
        this.sat = 50 - (Math.abs(this.rot1) * 25)
      }
      ctx.globalAlpha = 1;

      this.done ? this.alpha2 > .01 ? this.alpha2 -= .01 : this.lifetime = 0 : null;
      this.lifetime == 0 ? sleepGoing = false : null;
    }
  }

  function inEnchanter() {

    this.alpha = 0
    this.alpha2 = 0
    this.count = 0

    this.cover1 = new pageOpen(160, 70, 160, 120, "hsl(28, 57%, 33%)", 100, true);
    this.cover2 = new pageOpen(160, 70, 160, 120, "hsl(28, 57%, 33%)", 100, false);
    this.page1 = new pageOpen(160, 70, 160, 120, "hsl(48, 43%, 72%)", 85, true);
    this.page2 = new pageOpen(160, 70, 160, 120, "hsl(48, 43%, 72%)", 85, false);
    this.page3 = new pageOpen(160, 70, 160, 120, "hsl(56, 43%, 76%)", 80, true);

      ctx.translate(0, Math.sin(Date.now() / 800) * 10)
      let elapsed = Date.now() - this.start;
      this.cover1.draw(this.done)
      this.cover2.draw(this.done)
      if (elapsed > 500) {

        this.page4.draw(this.done)
      }
      ctx.restore()

      if(this.done) this.alpha >= .01 ? this.alpha -= .01 : this.alpha2 >= .01 ? this.alpha2 -= .01 : this.lifetime = 0
      else this.alpha2 <= .95 ? this.alpha2 += .05 : this.alpha = Math.abs(Math.sin(Date.now() / 500)) * .15 + .15
    };
  }

  function pageOpen(x, y, x2, y2, color, scale, direction) {
    this.dir = direction;
    this.x = x;
    this.y = y;
    this.ox = x;
    this.x2 = x;
    this.y2 = y2;
    this.height = scale;
    this.color = color;
    this.rot = Math.PI / 2
    this.draw = function (done) {
      ctx.beginPath()
      ctx.moveTo(this.x, this.y)
      ctx.lineTo(this.x2, this.y2)
      ctx.lineTo(this.x2, this.y2 + this.height)
      ctx.lineTo(this.x, this.y + this.height)
      ctx.lineTo(this.x, this.y)
      ctx.fillStyle = this.color;
      ctx.fill()
      if (done) {
        if (this.dir) {
          if(this.x < this.ox) this.x += (this.ox - this.x) / 30
        } else {
          if(this.x > this.ox) this.x -= (this.x - this.ox) / 30
        }
      } else {
        if (this.dir) {
          if(this.x > (this.x2 - this.height * .8)) this.x -= (this.x - (this.x2 - this.height * .8)) / 30
        } else {
          if(this.x < (this.x2 + this.height * .8)) this.x += ((this.x2 + this.height * .8) - this.x) / 30
        }
      }
    }
  }

  function inAnvil() {

    this.oldDir = false;

      DrawRect(0, 0, 320, 200, `hsla(0, 100%, 50%, ${this.alpha2})`)

      ctx.translate(this.x, 130)

      anvilHammer(this.x, 130)
      ctx.restore()
      if (this.dir) {
        this.rotate < Math.PI / 2 - .01 ? this.rotate += (Math.PI / 2 - this.rotate) / 8 : this.dir = false;
      } else {
        this.rotate > .01 ? this.rotate -= this.rotate / 8 : this.dir = true;
      }
      if (this.dir != this.oldDir) {
        for (let i = 0; i < 10; i++) {
          setTimeout(() => {

        this.oldDir = this.dir
      }
      if(!menuGoing || inGame) this.done = true
      if (this.done) this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
      else {

  function anvilHammer(x, y, color = "white") {

  function DrawPath(x, y, scale, path, color) {
    ctx.fillStyle = color;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale)
    let ex = new Path2D(path);
    ctx.fill(ex);
    ctx.restore();

  function spark(x, y) {
    this.x = x;
    this.y = y;
    this.radius = Math.random() * 10 + 5;

    this.dir = Math.random() < .5;

    this.draw = function () {
      DrawCircle(this.x, this.y, this.radius, `hsla(${this.hue}, 100%, 50%, ${this.lifetime / 100})`)
      this.x += this.dir ? Math.random() * this.mod : -Math.random() * this.mod;
      this.y -= Math.random() * this.mod2
      this.lifetime--;
    }
  }

  function genericMenu() {
    this.lifetime = 10;
    this.done = false;
    this.alpha = 0;
    this.alpha2 = .1;
    this.count = 0;
    this.redo = false;
    this.effects = [];
    this.stop = false
    this.draw = function () {
      this.count++
      DrawRect(0, 0, 320, 200, `hsla(0, 0%, 0%, ${this.alpha})`);
      DrawRect(0, 0, 320, 200, `hsla(120, 100%, 50%, ${this.alpha2})`)
      if (this.redo) {
        this.effects = [];
        this.redo = false;
        this.done = false;
      }
      let count = 0;
      if (this.effects.length < 8) {
        this.effects.push(new menuRow(this.effects.length * 40))
      }
      ctx.globalAlpha = this.alpha
      this.effects.forEach((ele, i) => {
        ele.draw(this.done);
        ele.done ? count++ : null;
      })
      ctx.globalAlpha = 1
      if (count == 8 && !this.done) {
        this.done = true
        setTimeout(() => {
          this.redo = true;
        }, 500)
      }
      if(!menuGoing || inGame || enchantmentTableBrownMeter.value >= .75) this.stop = true
      if (this.stop) {
        this.alpha >= .05 ? this.alpha -= .05 : this.lifetime = 0
        if(enchantmentTableBrownMeter.value >= .75 && this.lifetime == 0) sleep.push(new inEnchanter())
      } else {
        this.alpha2 = Math.abs(Math.sin(Date.now() / 500)) * .1 + .1;
        this.alpha <= .95 ? this.alpha += .05 : this.alpha = 1;
      }
    }
  }

  function menuRow(x) {
    this.x = x;
    this.start = Date.now();
    this.speed = Math.random() * 800 + 800;
    this.effects = [];
    this.done = false;
    this.draw = function (donezo) {
      let elapsed = Date.now() - this.start;
      let count = 0;
      if (elapsed > this.speed && this.effects.length < 5) {
        this.effects.push(new menuSquare(this.x, 200 - (this.effects.length * 40 + 40), 5, 40, 40))
        this.start = Date.now()
      }
      this.effects.forEach((ele, i) => {
        ele.draw(donezo);
        if (ele.done) {
          count++;
          if (this.effects[i - 1]) {
            this.effects[i - 1].grass = false;
          }
        }
      })
      count == 5 ? this.done = true : null;
    }
  }

  function menuSquare(x, y2, speed, width, height) {
    this.x = x;
    this.y = 0;
    this.alpha = 1;
    this.width = width;
    this.height = height;
    this.y2 = y2;
    this.speed = speed;
    this.grass = true;
    this.done = false;
    this.draw = function (donezo) {
      ctx.globalAlpha = this.alpha;
      DrawRect(this.x, this.y, this.width, this.height, "rgb(130, 60, 35)")
      this.grass ? DrawRect(this.x, this.y, this.width, this.height * .75, "green") : null;
      ctx.globalAlpha = 1;
      this.y <= this.y2 - this.speed ? this.y += this.speed : this.done = true;
      donezo ? this.alpha >= .05 ? this.alpha -= .05 : this.alpha = 0 : null;
    }
  }

  function statusEffect(direction, color1, color2) {
    this.lifetime = 150;
    this.dir = direction;
    this.c1 = color1;
    this.c2 = color2;
    this.start = Date.now()
    this.draw = function () {
      ctx.globalAlpha = this.lifetime > 100 ? (150 - this.lifetime) * .02 : this.lifetime / 100;
      DrawRect(0, 0, 320, 200, "black")
      ctx.globalAlpha = 1;
      let elapsed = Date.now() - this.start;
      if (elapsed > 250) {
        effects.push(new effectSpiral(Date.now() % 2 == 0 ? this.c1 : this.c2, Math.random() * 2 + 2, this.dir))
        this.start = Date.now()
      }
      this.lifetime -= .6;
      if (this.lifetime <= 0) {
        this.dir ? goodStatusGoing = false : badStatusGoing = false;
      }
    }
  }

  function effectSpiral(color, scale, dir) {
    this.x = Math.random() * 200 + 60;
    this.dir = dir;
    this.y = this.dir ? 220 : -20;
    this.lifetime = 10;
    this.scale = scale;
    this.color = color;
    this.rotate = 0;
    this.start = Date.now()
    this.mod = Math.random() * 10;
    this.draw = function () {
      let elapsed = Date.now() - this.start;
      if (elapsed > 200) {
        this.rotate += (Math.PI / 2)
        this.start = Date.now()
      }
      ctx.save()
      ctx.translate(this.x, this.y)
      ctx.rotate(-this.rotate)
      ctx.translate(-this.x, -this.y)
      ctx.save()
      for (let i = 0; i < 18; i++) {
        ctx.translate(this.x, this.y)
        ctx.rotate(.6)
        ctx.translate(-this.x, -this.y)
        DrawCircle(this.x, this.y + i * this.scale, this.scale * 2, this.color)
      }
      ctx.restore()
      ctx.restore()
      if (this.dir) {
        this.y > -20 ? this.y -= 3 : this.lifetime = 0;
      } else {
        this.y < 220 ? this.y += 3 : this.lifetime = 0;
      }
      this.x += Math.sin(Date.now() / (50 * this.mod)) * 3
    }
  }

  function DrawCircle(x, y, radius, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.arc(x, y, radius, 0, 2 * Math.PI)
    ctx.fill();
  };

  function DrawRect(x, y, width, height, color) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
  };

  function XpUpState() {
    this.start = new Date().getTime();
    this.lifetime = 60;
    this.draw = function () {
      this.lifetime--
      effects.push(new xpUpHelp())
    };
  }

  function xpUpHelp(){
    this.x = Math.random() * 320
    this.y = Math.random() * 200
    this.lifetime = 50
    this.col = Math.random() > .5 ? 120 : 240
    this.draw = function(){
      DrawCircle(this.x, this.y, 30, `hsla(${this.col}, 100%, 50%, ${1 - Math.abs(25 - this.lifetime) / 25})`)
      this.lifetime--
    }
  }

  function FreezeEffect() {
    this.start = Date.now();
    this.lifetime = 500;
    this.snowflakes = [new freezeCrack(50, 250, 25, 25, true, 1), new freezeCrack(270, 250, 25, 25, true, -1)];
    this.split = false;
    this.alpha = 0;
    this.draw = function () {
      ctx.fillStyle = `hsla(206, 100%, 40%, ${this.alpha})`;
      this.alpha <= .975 ? this.alpha += .025 : this.alpha = 1;
      ctx.globalAlpha = this.lifetime / 150
      ctx.fillRect(0, 0, 320, 200)
      this.snowflakes.forEach((ele) => {
        ele.draw()
        if (ele.done && !ele.cracked && ele.width > 5) {
          if (this.split) {
            this.snowflakes.push(new freezeCrack(ele.x2, ele.y2, ele.width * .9, ele.speed * 1.1, true, 1))
            this.snowflakes.push(new freezeCrack(ele.x2, ele.y2, ele.width * .9, ele.speed * 1.1, true, -1))
            this.split = false;
          } else {
            this.snowflakes.push(new freezeCrack(ele.x2, ele.y2, ele.width * .9, ele.speed * 1.1, false, 0))
            this.split = true;
          }
          ele.cracked = true;
        }
      })
      ctx.globalAlpha = 1
      this.lifetime--
      if (freezeMeter.value == 0 || this.lifetime == 0) {
        this.lifetime = 0;
        freezeGoing = false;
      }
    }
  }

  function freezeCrack(x, y, width, speed, set, dir) {
    this.x = x;
    this.y = y;
    this.x1 = x;
    this.y1 = y;
    this.x2 = !set ? (Math.random() * 80 - 40) + this.x : (Math.random() * 10 + 40) * dir + this.x;
    this.y2 = this.y - (Math.random() * 10 + 30);
    this.width = width;
    this.speed = speed;
    this.done = false;
    this.cracked = false;
    this.vx = (this.x2 - this.x) / this.speed;
    this.vy = (this.y2 - this.y) / this.speed;
    this.draw = function () {
      ctx.beginPath()
      ctx.moveTo(this.x, this.y)
      ctx.lineTo(this.x1, this.y1)
      ctx.lineWidth = this.width;
      ctx.strokeStyle = "white";
      ctx.stroke()
      if (Math.abs(this.x1 - this.x2) > 1 || Math.abs(this.y1 - this.y2) > 1) {
        this.x1 += this.vx;
        this.y1 += this.vy;
      } else {
        this.done = true;
      }
    }
  }

  function bubbleEffect(bgColor, BubblecColor, strokecolor) {
    this.bgColor = bgColor;
    this.bubbleColor = BubblecColor;
    this.strokeColor = strokecolor;
    this.bubbles = [];
    for (let index = 0; index < 15; index++) {
      this.bubbles.push(new Bubble(this.bubbleColor, this.strokeColor, 30))
    }

    this.draw = function () {
      ctx.fillStyle = this.bgColor;
      ctx.fillRect(0, 0, 320, 200)
      this.bubbles.forEach((bubble, i) => {
        bubble.draw();
        if (bubble.y < -50) {
          this.bubbles.splice(i, 1)
          this.bubbles.push(new Bubble(this.bubbleColor, this.strokeColor, 30))
        }
      });
      if ((bubbleMeter.value <= .1 && engine.vision.bubble2 <= .1 && engine.vision.bubble3 <= .1) || !inGame) {
        this.lifetime = 0;
        bubblegoing = false;
      }
    }
  }

  function DamageState(x, y, radius, color) {
    this.radius = radius;
    this.color = color;
    this.x = x;
    this.vx = 2 - Math.random() * 4;
    this.y = y;
    this.vy = Math.random() * -8
    this.ay = .2;
    this.lifetime = 10;
    this.draw = function () {
      ctx.beginPath();
      ctx.fillStyle = this.color;
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fill();
      this.x += this.vx;
      this.y += this.vy;
      this.vy += this.ay;
      if (this.y > 200) {
        this.lifetime = 0;
      }
    }
  };

  function HealState() {
    this.rad = 1
    this.lifetime = 45;
    this.draw = function () {
      DrawRect(0, 0, 320, 200, `hsla(311,100%,50%, ${1 - Math.abs(100 - this.rad) / 100})`)
      DrawStroke(160, 100, this.rad, "white", 30)
      this.rad < 199 ? this.rad += (200 - this.rad) / 30 : this.lifetime = 0
    };
  }

  function lowHealthState() {
    this.lifetime = 10;
    this.start = getTime();
    this.draw = function () {
      this.duration = getTime() - this.start;
      ctx.fillStyle = `hsla(0, 100%, 50%, ${((Math.sin(this.duration / 600) + 1) / 3) + 0.1})`
      ctx.fillRect(0, 0, 320, 200);
      if (lowHpMeter.value == 0 || lowHpMeter.value > 0.8 || !inGame || healthMeter.value >= .25) {
        this.lifetime = 0;
        lowHpGoing = false;
      }
    }
  }

  function BossState() {
    bossGoing = true;
    this.draw = function () {
      ctx.fillStyle = "hsla(282, 100%, 50%, 0.4)"
      ctx.fillRect(0, 0, bossMeter.value * 350, 200)
      if (bossMeter.value == 0) {
        this.lifetime = 0;
        bossGoing = false;
        bossKillListen = true;
      }
    }
  }

  function FoodState() {
    this.start = getTime();
    this.lifetime = 100;
    this.arrow = new ArrowEffect("down", "orange", 1, 0.5, 3000)
    this.draw = function () {
      this.dur = getTime() - this.start;
      ctx.beginPath();
      ctx.fillStyle = "hsla(26, 100%, 50%, 0.4)"
      ctx.fillRect(0, 0, 320, 200)
      if (this.dur % 3000 < 100) {
        this.arrow = new ArrowEffect("down", "orange", 1, 0.5, 3000)
      }
      this.arrow.draw();
      if ((lowFoodMeter.value >= .95 && lowFoodMeter.increased) || onMountGoing || !inGame || inChest) {
        this.lifetime = 0;
        if(!inChest) effects.push(new RippleEffect(160, 100, 10, 3000, 30, "orange", "out", "stroke", 10))
      }
    };
  }

  function getTime() {
    return new Date().getTime();
  }

  function ArrowEffect(direction, color, amount, speed, duration) {
    this.start = getTime();
    this.speed = speed;
    this.duration = duration;
    this.lifetime = this.duration;
    this.direction = direction;
    this.color = color;
    this.amount = amount;
    this.draw = function () {
      if (this.direction == 'up') {
        this.speed = -this.speed;
        ctx.fillStyle = this.color;
        for (let i = 0; i < this.amount; i++) {
          ctx.beginPath();
          ctx.moveTo(160, this.lifetime / 1.5 - 150 - (200 * i));
          ctx.lineTo(320, this.lifetime / 1.5 - (200 * i));
          ctx.lineTo(320, this.lifetime / 1.5 - (200 * i) + 100);
          ctx.lineTo(160, this.lifetime / 1.5 - (200 * i) - 100);
          ctx.lineTo(0, this.lifetime / 1.5 - (200 * i) + 100);
          ctx.lineTo(0, this.lifetime / 1.5 - (200 * i));
          ctx.lineTo(160, this.lifetime / 1.5 - (200 * i) - 150);
          ctx.fill();
        }
      } else {
        ctx.fillStyle = this.color;
        for (let i = 0; i < this.amount; i++) {
          ctx.beginPath();
          ctx.moveTo(160, 300 - this.lifetime / 2.5 + (200 * i));
          ctx.lineTo(320, 240 - this.lifetime / 2.5 + (200 * i));
          ctx.lineTo(320, 180 - this.lifetime / 2.5 + (200 * i));
          ctx.lineTo(160, 240 - this.lifetime / 2.5 + (200 * i));
          ctx.lineTo(0, 180 - this.lifetime / 2.5 + (200 * i));
          ctx.lineTo(0, 240 - this.lifetime / 2.5 + (200 * i));
          ctx.lineTo(160, 300 - this.lifetime / 2.5 + (200 * i));
          ctx.fill();
        }
      }
      this.Ymin += this.speed;
      this.elapsed = new Date().getTime() - this.start;
      this.lifetime = this.duration - this.elapsed;
    }
  }
  function RippleEffect(x, y, speed, duration, rippleWidth, color, inOrOut, fillOrStroke, amountOfRipples, background) {
    this.col = color;
    this.speed = speed;
    this.dur = duration;
    this.width = rippleWidth;
    this.start = getTime();
    this.lifetime;
    this.x = x;
    this.y = y;
    this.fill = fillOrStroke;
    this.radius = 0;
    this.amount = amountOfRipples;
    this.background = background;
    if (inOrOut == "in") {
      this.radius = 200 + (this.width * (this.amount * 2));
      this.speed = -this.speed
    }
    this.draw = function () {
      if (this.background) {
        DrawBackground("black");
      }


      ctx.lineWidth = this.width;
      ctx.beginPath();
      for (let i = 0; i < this.amount; i++) {
        if (this.radius - i * (this.width * 2) > 0) {
          ctx.arc(this.x, this.y, this.radius - i * (this.width * 2), 0, 2 * Math.PI);
        }
      }
      if (this.fill == "fill") {
        ctx.fillStyle = this.col;
        ctx.fill();
      } else {
        ctx.strokeStyle = this.col;
        ctx.stroke();
      }
      this.radius += this.speed;
      this.lifetime = this.dur - (getTime() - this.start);
      if (this.lifetime <= 0) {
        utilityPlayed = false;
      }
    }
  }

  class Bubble {
    constructor(bubbleColor, strokeColor, bubbleSize) {
      this.bubbleColor = bubbleColor
      this.strokeColor = strokeColor;
      this.size = bubbleSize;
      this.x = Math.random() * 320;
      this.lifetime = 100;
      this.startval = Math.random() * 100;
      this.y = 200 + Math.random() * 400;
      this.start = getTime();
      this.speed = 5;
    }
    draw() {
      ctx.lineWidth = 5;
      this.lifetime = (getTime() - this.start);
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, 2 * Math.PI)
      ctx.strokeStyle = this.strokeColor;
      ctx.fillStyle = this.bubbleColor;
      ctx.fill();
      ctx.stroke();
      this.x += (Math.sin((this.lifetime / 400 + this.startval)) * 2)
      this.y -= this.speed
    }
  }

  function Meter(count, callback) {
    this.size = count;
    this.value = 0;
    this.diff = 0;
    this.increased = false;
    this.decreased = false;
    let values = [];

    this.setValue = function (updatedValue) {
      // Add and shift.
      values.push(updatedValue);
      if (values.length > this.size) {
        values.shift();
      }

      // Exit early if we've got a long-term match.
      for (let i = 0; i < values.length - 1; i++) {
        if (values[i] !== values[i + 1]) return;
      }

      // We got here, so we've got a matching value collection.
      if (this.value !== values[0]) {
        //let fromZero = this.value === 0;
        //let toZero = values[0] === 0;
        this.diff = Math.abs(this.value - values[0]);
        this.increased = this.value < values[0];
        this.decreased = this.value > values[0];
        this.value = values[0];

        callback();
      }
    };
  }

  function hexToHSL(hex) {
    // Remove the '#' if present
    hex = hex.replace("#", "");

    // Convert hex to RGB
    let r = parseInt(hex.substring(0, 2), 16);
    let g = parseInt(hex.substring(2, 4), 16);
    let b = parseInt(hex.substring(4, 6), 16);

    // Normalize RGB values
    r /= 255;
    g /= 255;
    b /= 255;

    // Calculate HSL values
    let max = Math.max(r, g, b);
    let min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;

    if (max === min) {
      h = s = 0; // Achromatic
    } else {
      let d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);

      switch (max) {
        case r:
          h = (g - b) / d + (g < b ? 6 : 0);
          break;
        case g:
          h = (b - r) / d + 2;
          break;
        case b:
          h = (r - g) / d + 4;
          break;
      }

      h /= 6;
    }

    // Convert to percentages
    h = Math.round(h * 360);
    s = Math.round(s * 100);
    l = Math.round(l * 100);

    return [h, s, l];
  }

    window.requestAnimationFrame(update);
</script>
