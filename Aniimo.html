       color during baseline/off state). A state is considered active
       only when positive is high AND negative is low, preventing
       false positives from ambient lighting or UI transitions.

       TESTER NOTE: If an effect never fires, first check the QA Tool

<body style="margin: 0; padding: 0; background: #000;">
    <canvas id="exCanvas" width="320" height="200"></canvas>
</body>

<script>
    // ═══════════════════════════════════════════════════════════
    // CANVAS SETUP
    // SignalRGB renders this 320x200 canvas onto the device layout.
    // All effects draw to the hidden canvas, composited to ctx once per frame.
    // ═══════════════════════════════════════════════════════════
    const canvas = document.getElementById('exCanvas');
    const ctx    = canvas.getContext('2d');
    const width  = 320;
    const height = 200;

    const hiddenCanvas = document.createElement('canvas');
    hiddenCanvas.width  = 320;
    hiddenCanvas.height = 200;
    const hiddenCtx = hiddenCanvas.getContext('2d');

    let effects = [];

    //#region Update
    function update() {
        DrawRect(0, 0, 320, 200, 'black')
        backgroundHandler()

        battleRedBar_Meter.setValue(engine.vision.battleRedBar)
        battleNotRed_Meter.setValue(engine.vision.battleNotRed)
        battleWhiteName_Meter.setValue(engine.vision.battleWhiteName)
        battleWonOrange_Meter.setValue(engine.vision.battleWonOrange)
        wonOrange_Meter.setValue(engine.vision.wonOrange)
        wonNotOrange_Meter.setValue(engine.vision.wonNotOrange)
        captureAniimoWhite_Meter.setValue(engine.vision.captureAniimoWhite)
        captureWhiteP_Meter.setValue(engine.vision.captureWhiteP)
        captureNotWhite_Meter.setValue(engine.vision.captureNotWhite)
        inGameWhite1_Meter.setValue(engine.vision.inGameWhite1)
        inGameWhite2_Meter.setValue(engine.vision.inGameWhite2)
        ingameNotWhite_Meter.setValue(engine.vision.ingameNotWhite)
        waterBlue_Meter.setValue(engine.vision.waterBlue)
        waterWhite_Meter.setValue(engine.vision.waterWhite)
        levelWhite_Meter.setValue(engine.vision.levelWhite)
        levelblue_Meter.setValue(engine.vision.levelblue)
        levelNotWhite_Meter.setValue(engine.vision.levelNotWhite)
        healthGreen2_Meter.setValue(engine.vision.healthGreen2)
        healthGreen1_Meter.setValue(engine.vision.healthGreen1)
        healthWhite_Meter.setValue(engine.vision.healthWhite)
        newStoryYellow_Meter.setValue(engine.vision.newStoryYellow)
        newStoryWhite_Meter.setValue(engine.vision.newStoryWhite)
        newStoryWhite2_Meter.setValue(engine.vision.newStoryWhite2)
        newStoryNotWhite_Meter.setValue(engine.vision.newStoryNotWhite)
        passedOutwhite1_Meter.setValue(engine.vision.passedOutwhite1)
        passedOutWhite2_Meter.setValue(engine.vision.passedOutWhite2)
        passedOutNotWhite_Meter.setValue(engine.vision.passedOutNotWhite)
        twineWhiteText_Meter.setValue(engine.vision.twineWhiteText)
        twineWhite2_Meter.setValue(engine.vision.twineWhite2)
        untwineWhite2_Meter.setValue(engine.vision.untwineWhite2)

        if (damageCool > 0) damageCool--

        effects.forEach(ele => { ele.draw() })
        effects = effects.filter(ele => !(ele.lifetime <= 0))

        ctx.drawImage(hiddenCanvas, 0, 0)
        window.requestAnimationFrame(update)
    }
    //#endregion

    //#region Meter Declarations

    // -------------------------------------------------------------------------
    // Meter objects
    // -------------------------------------------------------------------------
    const battleRedBar_Meter = new Meter(5, battleCallback)
    const battleNotRed_Meter = new Meter(5, battleCallback)
    const battleWhiteName_Meter = new Meter(5, battleCallback)
    const battleWonOrange_Meter = new Meter(3, battleWonCallback)
    const wonOrange_Meter = new Meter(3, battleWonCallback)
    const wonNotOrange_Meter = new Meter(3, battleWonCallback)
    const captureAniimoWhite_Meter = new Meter(3, captureCallback)
    const captureWhiteP_Meter = new Meter(3, captureCallback)
    const captureNotWhite_Meter = new Meter(3,captureCallback)
    const inGameWhite1_Meter = new Meter(3, inGameDetect)
    const inGameWhite2_Meter = new Meter(3, inGameDetect)
    const ingameNotWhite_Meter = new Meter(3, inGameDetect)
    const waterBlue_Meter = new Meter(5, waterCallback)
    const waterWhite_Meter = new Meter(5, waterCallback)
    const levelWhite_Meter = new Meter(3, levelCallback)
    const levelblue_Meter = new Meter(3, levelCallback)
    const levelNotWhite_Meter = new Meter(3, levelCallback)
    const healthGreen2_Meter = new Meter(3, useHealth)
    const healthGreen1_Meter = new Meter(3, useHealth)
    const healthWhite_Meter = new Meter(3, useHealth)
    const newStoryYellow_Meter = new Meter(3, newStoryCallback)
    const newStoryWhite_Meter = new Meter(3, newStoryCallback)
    const newStoryWhite2_Meter = new Meter(3, newStoryCallback)
    const newStoryNotWhite_Meter = new Meter(3, newStoryCallback)
    const passedOutwhite1_Meter = new Meter(5, passedOutCallback)
    const passedOutWhite2_Meter = new Meter(5, passedOutCallback)
    const passedOutNotWhite_Meter = new Meter(3, passedOutCallback)
    const twineWhiteText_Meter = new Meter(3, twineCallback)
    const twineWhite2_Meter = new Meter(3, twineCallback)
    const untwineWhite2_Meter = new Meter(3, twineCallback)
    //#endregion

    //#region Callbacks

    // -------------------------------------------------------------------------
    // Global gameplay gate + per-effect latches (set true on spawn, cleared when
    // the meter drops, so each event fires once per occurrence). Thresholds are
    // QA-tunable starting points.
    // -------------------------------------------------------------------------
    let gInGame = false
    let battleStartGoing = false
    let battleWonGoing = false
    let captureGoing = false
    let waterGoing = false
    let levelUpGoing = false
    let lowHealthGoing = false
    let newStoryGoing = false
    let passedOutGoing = false
    let twineState = null   // null = unknown yet; then true = twined, false = untwined
    let prevHp = 1          // last HP reading, to detect a drop (Damage is change-based)
    let damageCool = 0      // frames to suppress a repeat Damage (dedupe two-halves / re-entry)

    function useHealth(){
        inGameDetect()
        healthCallback()
    }

    function inGameDetect() {
        if (((inGameWhite1_Meter.value >= .95 && inGameWhite2_Meter.value >= .95 && ingameNotWhite_Meter.value < .1) || ((healthGreen1_Meter.value >=.1 || healthGreen2_Meter.value >=.1) && healthWhite_Meter.value >=.05 )) && !gInGame) {
            gInGame = true
        } else if (!((inGameWhite1_Meter.value >= .95 && inGameWhite2_Meter.value >= .95 && ingameNotWhite_Meter.value < .1) || ((healthGreen1_Meter.value >= .1 || healthGreen2_Meter.value >= .1) && healthWhite_Meter.value >= .05)) && gInGame) {
            gInGame = false
        }
    }

    // Battle Start — enemy red HP bar + white name appear
    function battleCallback() {
        if (gInGame && battleStartOn && battleRedBar_Meter.value >= .95 && battleWhiteName_Meter.value >= .15 && battleNotRed_Meter.value < .1 && !battleStartGoing) {
            effects.push(new BattleStart()); 
            battleStartGoing = true
        } else if (battleRedBar_Meter.value < .1 || battleWhiteName_Meter.value < .1) {
            battleStartGoing = false
        }
    }

    // Battle Won — the orange victory banner appears; fires the Win effect once
    function battleWonCallback() {
        if (!gInGame && battleWonOn && battleWonOrange_Meter.value >= .4 && wonOrange_Meter.value >= .4 && wonNotOrange_Meter.value < .15 && !battleWonGoing) {
            effects.push(new Win()); battleWonGoing = true
        } else if (battleWonOrange_Meter.value < .1 || wonOrange_Meter.value < .1) {
            battleWonGoing = false
        }
    }

    // Capture — aniimo name + the "P" prompt appear
    function captureCallback() {
        if (captureOn && (captureAniimoWhite_Meter.value >= .11 && captureAniimoWhite_Meter.value <=.4) && captureWhiteP_Meter.value >= .95 && captureNotWhite_Meter.value <.1 && !captureGoing && !battleStartGoing) {
            effects.push(new Capture()); captureGoing = true
        } else if (captureAniimoWhite_Meter.value < .1 || captureWhiteP_Meter.value < .1) {
            captureGoing = false
        }
    }

    // Water — blue drop + white highlight on the swim icon (lingering)
    function waterCallback() {
        if (waterOn && waterBlue_Meter.value >= .95 && waterWhite_Meter.value >= .95 && !waterGoing) {
            effects.push(new Water()); waterGoing = true
        } else if (waterBlue_Meter.value < .1 || waterWhite_Meter.value <.1) {
            waterGoing = false
        }
    }

    // Level Up — level number + blue bar appear
    function levelCallback() {
        if (gInGame && levelOn && levelWhite_Meter.value >= .25 && levelNotWhite_Meter.value < .1 && (levelblue_Meter.value >= .2 && levelblue_Meter.value < .4 ) && !levelUpGoing && !battleStartGoing) {
            effects.push(new LevelUp()); levelUpGoing = true
        } else if (!gInGame || levelWhite_Meter.value < .1 || levelblue_Meter.value < .1 || levelNotWhite_Meter.value > .1) {
            levelUpGoing = false
        }
    }

    // Health — a drop fires Damage (once); critically low fires Low Health (lingering)
    function healthCallback() {
        let hp = (healthGreen1_Meter.value + healthGreen2_Meter.value) / 2

        // Out of game: keep prevHp fresh so entering a battle never reads as a "drop".
        if (!gInGame) { prevHp = hp; lowHealthGoing = false; return }

        // Damage — fire on the actual HP DROP since the last reading (not on the
        // meter's stale decreased/diff flags, which persist across unrelated
        // healthWhite / other-half changes and caused repeat/phantom triggers).
        // A short cooldown dedupes the two bar halves draining one after another.
        if (damageOn && (prevHp - hp) >= 0.03 && hp > 0.05 && healthWhite_Meter.value >= 0.1 && damageCool === 0) {
            effects.push(new Damage())
            damageCool = 20
        }
        prevHp = hp

        // Low Health — lingering warning while HP is critical.
        if (lowHealthOn && hp <= 0.1 && hp > 0.02 && healthWhite_Meter.value >= 0.1 && !lowHealthGoing) {
            effects.push(new LowHealth()); lowHealthGoing = true
        } else if (hp > 0.30 || hp <= 0.02) {
            lowHealthGoing = false
        }
    }

    // New Story — yellow star + white text + white circle on the chapter card
    function newStoryCallback() {
        if (newStoryOn && newStoryYellow_Meter.value >= .95 && newStoryWhite_Meter.value >= .2 && newStoryWhite2_Meter.value >= .2 && newStoryNotWhite_Meter.value < .1 && !newStoryGoing) {
            effects.push(new NewStory()); newStoryGoing = true
        } else if (newStoryYellow_Meter.value < .1 || newStoryWhite_Meter.value < .1) {
            newStoryGoing = false
        }
    }

    // Passed Out — the retry + exit banners of the defeat screen (lingering)
    function passedOutCallback() {
        if (!gInGame && passedOutOn && passedOutwhite1_Meter.value >= .95 && passedOutWhite2_Meter.value >= .95 && passedOutNotWhite_Meter.value < .1 && !passedOutGoing) {
            effects.push(new PassOut()); passedOutGoing = true
        } else if (gInGame && passedOutwhite1_Meter.value < .1 || passedOutWhite2_Meter.value < .1) {
            passedOutGoing = false
        }
    }

    // Twine / Untwine — one shared text meter gates it; twineWhite2 & untwineWhite2 swap to
    // tell which state we're in. We remember the state and fire only on a TRANSITION:
    //   untwined -> twined   => Twine effect
    //   twined   -> untwined => Untwine effect
    function twineCallback() {
        if (twineWhiteText_Meter.value < 0.15) return   // prompt not readable — don't touch the state
        let nowTwined
        if (gInGame && twineWhite2_Meter.value > 0.7 && untwineWhite2_Meter.value < 0.5) nowTwined = true
        else if (gInGame && untwineWhite2_Meter.value > 0.7 && twineWhite2_Meter.value < 0.5) nowTwined = false
        else return                                    // mid-swap / ambiguous — wait for a clear state
        if (twineState === null) { twineState = nowTwined; return }   // first read: record, don't fire
        if (nowTwined !== twineState) {
            twineState = nowTwined
            if (nowTwined) { if (twineOn) effects.push(new Untwine()) }   // just became twined
            else { if (twineOn) effects.push(new Twine()) }           // just became untwined
        }
    }

    //#region Background Modes
    // ═══════════════════════════════════════════════════════════
    // BACKGROUND SYSTEM
    // Eight modes selected by the backgroundMode control.
    // ═══════════════════════════════════════════════════════════
    let proBack = [0, 0, 0]
    function onbackColorChanged() {
        proBack = hexToHSL(backColor)
    }

    let audioEase = { sat: 0, lit: 0 }
    let gCycle = 0

    function updateAudioEase() {
        const targetDensity = engine.audio.density * 100
        audioEase.sat += (targetDensity - audioEase.sat) / 10
        audioEase.lit += (targetDensity - audioEase.lit) / 10
    }

    function getColorString(hue, sat, lit, alpha) {
        return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`
    }

    function updateColorCycle() {
        gCycle = (gCycle + 0.5) % 360
    }

    function backgroundHandler() {
        const alpha = ambienceAlpha / 100

        if (backgroundMode.includes('Color Cycle')) updateColorCycle()
        if (backgroundMode.includes('Audio'))       updateAudioEase()

        if (backgroundMode.includes('Ambience')) {
            if (backgroundMode === 'Ambience Audio Visualizer') {
                copyScreenAudio(alpha)
            } else {
                copyScreen(alpha)
            }
            return
        }

        const hue = proBack[0] + (backgroundMode.includes('Color Cycle') ? gCycle : 0)
        const sat = backgroundMode.includes('Audio') ? audioEase.sat * 0.33 + 66 : proBack[1]
        const lit = backgroundMode.includes('Audio') ? audioEase.lit * 0.9  + 10 : proBack[2]
        DrawRect(0, 0, 320, 200, getColorString(hue, sat, lit, alpha))
    }

    const ZONE_COLS   = 28
    const ZONE_ROWS   = 20
    const TOTAL_ZONES = ZONE_COLS * ZONE_ROWS

    function copyScreenAudio(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat       = new Int8Array(engine.zone.saturation)
        const hue       = new Int16Array(engine.zone.hue)
        const w = 320 / ZONE_COLS
        const h = 200 / ZONE_ROWS
        const satMultiplier = audioEase.sat / 200 + 0.5
        const litMultiplier = audioEase.lit / 100
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            hiddenCtx.fillStyle = getColorString(
                hue[iZone],
                sat[iZone] * satMultiplier,
                lightness[iZone] * litMultiplier,
                alpha
            )
            hiddenCtx.fillRect(col * w, row * h, w, h)
        }
    }

    function copyScreen(alpha) {
        const lightness = new Int8Array(engine.zone.lightness)
        const sat       = new Int8Array(engine.zone.saturation)
        const hue       = new Int16Array(engine.zone.hue)
        const w = 320 / ZONE_COLS
        const h = 200 / ZONE_ROWS
        for (let iZone = 0; iZone < TOTAL_ZONES; iZone++) {
            const row = Math.floor(iZone / ZONE_COLS)
            const col = iZone % ZONE_COLS
            const finalHue = backgroundMode === 'Custom Ambience'
                ? proBack[0]
                : hue[iZone] + (backgroundMode === 'Color Cycle Ambience' ? gCycle : 0)
            hiddenCtx.fillStyle = getColorString(finalHue, sat[iZone], lightness[iZone], alpha)
            hiddenCtx.fillRect(col * w, row * h, w, h)
        }
    }

    //#region Helper Functions
    // ═══════════════════════════════════════════════════════════
    // HELPER FUNCTIONS — draw primitives target hiddenCtx
    // ═══════════════════════════════════════════════════════════
    function DrawRect(x, y, w, h, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.fillRect(x, y, w, h)
    }

    function strokeRect(x, y, w, h, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.rect(x, y, w, h)
        hiddenCtx.stroke()
    }

    function DrawCircle(x, y, radius, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
        hiddenCtx.fill()
    }

    function DrawStroke(x, y, radius, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.arc(x, y, radius, 0, 2 * Math.PI)
        hiddenCtx.stroke()
    }

    function DrawLine(start, end, color, stroke) {
        hiddenCtx.beginPath()
        hiddenCtx.moveTo(start[0], start[1])
        hiddenCtx.lineTo(end[0], end[1])
        hiddenCtx.strokeStyle = color
        hiddenCtx.lineWidth = stroke
        hiddenCtx.stroke()
    }

    function DrawArc(x, y, start, end, radius, direction, color) {
        hiddenCtx.beginPath()
        hiddenCtx.arc(x, y, radius, start, end, direction)
        hiddenCtx.fillStyle = color
        hiddenCtx.fill()
    }

    function DrawEllipse(x, y, w, h, rotation, color) {
        hiddenCtx.beginPath()
        hiddenCtx.ellipse(x, y, w, h, rotation, 0, Math.PI * 2)
        hiddenCtx.fillStyle = color
        hiddenCtx.fill()
    }

    function DrawTriangle(x1, y1, x2, y2, x3, y3, color) {
        hiddenCtx.beginPath()
        hiddenCtx.fillStyle = color
        hiddenCtx.moveTo(x1, y1)
        hiddenCtx.lineTo(x2, y2)
        hiddenCtx.lineTo(x3, y3)
        hiddenCtx.lineTo(x1, y1)
        hiddenCtx.fill()
    }

    function DrawPath(x, y, path, color, scaleX, scaleY) {
        hiddenCtx.fillStyle = color
        hiddenCtx.save()
        hiddenCtx.translate(x, y)
        hiddenCtx.scale(scaleX, scaleY)
        hiddenCtx.fill(new Path2D(path))
        hiddenCtx.restore()
    }

    function hexToRgb(hex) {
        var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex)
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : null
    }

    function hexToHSL(hex) {
        const [, r, g, b] = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex) || []
        const rgb = [r, g, b].map(x => parseInt(x, 16) / 255)
        const max = Math.max(...rgb)
        const min = Math.min(...rgb)
        const l = (max + min) / 2
        if (max === min) return [0, 0, Math.round(l * 100)]
        const d = max - min
        const s = l > 0.5 ? d / (2 - max - min) : d / (max + min)
        let h
        const [nr, ng, nb] = rgb
        if      (max === nr) h = (ng - nb) / d + (ng < nb ? 6 : 0)
        else if (max === ng) h = (nb - nr) / d + 2
        else                 h = (nr - ng) / d + 4
        return [Math.round(h * 60), Math.round(s * 100), Math.round(l * 100)]
    }

    // Meter(size, callback): frame-stabilizing debouncer for vision signals.
    function Meter(size, callback) {
        this.size = size
        this.value = 0
        this.diff = 0
        this.increased = false
        this.decreased = false
        var values = []
        this.setValue = function (updatedValue) {
            values.push(updatedValue)
            if (values.length > this.size) values.shift()
            for (var i = 0; i < values.length - 1; i++) {
                if (values[i] !== values[i + 1]) return
            }
            if (this.value !== values[0]) {
                this.diff = Math.abs(this.value - values[0])
                this.increased = this.value < values[0]
                this.decreased = this.value > values[0]
                this.value = values[0]
                callback()
            }
        }
    }

    function onCanvasTapped(x, y) {}

    // EFFECTS — ported from the staging file; colors grounded in Aniimo's palette.

    // Battle Start — red igniting into purple, clashing in the center
    function BattleStart() {
        this.frame = 0; this.lifetime = 72;
        this.draw = function () {
            this.frame++; let f = this.frame;
            if (f >= 72) { this.lifetime = 0; return; }
            let out = f > 52 ? (72 - f) / 20 : 1;
            DrawRect(0, 0, width, height, `rgba(0, 0, 0, ${out})`);
            let e = 1 - Math.pow(1 - Math.min(1, f / 24), 3);
            let mid = width / 2;
            DrawRect(0, 0, mid * e, height, `rgba(40, 160, 255, ${0.85 * out})`);          // bright blue from left
            DrawRect(width - mid * e, 0, mid * e, height, `rgba(235, 55, 110, ${0.85 * out})`); // pinkish red from right
            if (f >= 24) {
                let seam = hiddenCtx.createLinearGradient(mid - 45, 0, mid + 45, 0);
                seam.addColorStop(0, 'rgba(0,0,0,0)'); seam.addColorStop(0.5, `rgba(255, 190, 225, ${0.8 * out})`); seam.addColorStop(1, 'rgba(0,0,0,0)');
                hiddenCtx.fillStyle = seam; hiddenCtx.fillRect(mid - 45, 0, 90, height);
            }
        }
    }

    // Battle Won — orange floods up, then a big white star spins in (fired by battleWonCallback)
    function Win() {
        this.frame = 0; this.lifetime = 150; this.spk = [];
        this.draw = function () {
            this.frame++; let f = this.frame;
            if (f >= 150) { this.lifetime = 0; return; }
            let a = f > 125 ? (150 - f) / 25 : 1;
            DrawRect(0, 0, width, height, `rgba(0, 0, 0, ${Math.min(1, f / 8) * a})`);
            let fill = Math.min(1, f / 45);
            let fh = fill * height;
            let g = hiddenCtx.createLinearGradient(0, height, 0, height - fh - 1);
            g.addColorStop(0, `rgba(255, 115, 10, ${a})`); g.addColorStop(1, `rgba(255, 165, 45, ${a})`);
            hiddenCtx.fillStyle = g; hiddenCtx.fillRect(0, height - fh, width, fh);
            if (f >= 45) {
                let cx = 160, cy = 100;
                let appear = Math.min(1, (f - 45) / 16);
                drawStar(cx, cy, 5, 82 * appear, 37 * appear, f * 0.03 - Math.PI / 2, `rgba(255, 255, 255, ${0.95 * a})`);
                let gg = hiddenCtx.createRadialGradient(cx, cy, 5, cx, cy, 120); gg.addColorStop(0, `rgba(255, 245, 215, ${0.45 * a * appear})`); gg.addColorStop(1, 'rgba(0,0,0,0)'); hiddenCtx.fillStyle = gg; hiddenCtx.fillRect(0, 0, width, height);
                if (f === 49) for (let i = 0; i < 34; i++) { let ang = Math.random() * 6.28, spd = 2 + Math.random() * 6; this.spk.push({ x: cx, y: cy, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life: 1, size: 5 + Math.random() * 6 }); }
            }
            for (let i = this.spk.length - 1; i >= 0; i--) { let p = this.spk[i]; p.x += p.vx; p.y += p.vy; p.vx *= 0.97; p.vy *= 0.97; p.life -= 0.014; if (p.life <= 0) { this.spk.splice(i, 1); continue; } DrawCircle(p.x, p.y, p.size * (0.55 + 0.45 * p.life), `rgba(255, 255, 255, ${Math.min(1, p.life * 1.7) * a})`); }
        }
    }

    // Capture — cube reticle locks, creature sucked in, prismatic rainbow burst
    function Capture() {
        this.frame = 0; this.lifetime = 140; this.spark = [];
        this.draw = function () {
            this.frame++; let f = this.frame;
            if (f >= 140) { this.lifetime = 0; return; }
            let a = f < 10 ? f / 10 : (f > 120 ? (140 - f) / 20 : 1);
            DrawRect(0, 0, width, height, `rgba(0, 0, 0, ${a})`);
            let cx = width / 2, cy = height / 2;
            if (f <= 45) {
                let t = f / 45, sz = 150 - 90 * t;
                hiddenCtx.save(); hiddenCtx.translate(cx, cy); hiddenCtx.rotate(t * Math.PI * 0.5);
                hiddenCtx.strokeStyle = `rgba(97, 149, 195, ${a})`; hiddenCtx.lineWidth = 13; hiddenCtx.strokeRect(-sz / 2, -sz / 2, sz, sz);
                hiddenCtx.restore(); DrawCircle(cx, cy, 7, `rgba(237, 247, 255, ${a})`);
            }
            if (f > 45 && f <= 72) {
                let t = (f - 45) / 27, sz = 60 * (1 - t);
                hiddenCtx.save(); hiddenCtx.translate(cx, cy); hiddenCtx.rotate(t * 6);
                hiddenCtx.strokeStyle = `rgba(97, 149, 195, ${a})`; hiddenCtx.lineWidth = 10 + t * 9; hiddenCtx.strokeRect(-sz / 2, -sz / 2, sz, sz); hiddenCtx.restore();
                let g = hiddenCtx.createRadialGradient(cx, cy, 2, cx, cy, 85 * (1 - t) + 14);
                g.addColorStop(0, `rgba(150, 200, 255, ${0.65 * a})`); g.addColorStop(1, 'rgba(0,0,0,0)'); hiddenCtx.fillStyle = g; hiddenCtx.fillRect(0, 0, width, height);
            }
            if (f > 72 && f < 80) { let w = 1 - (f - 72) / 8; DrawRect(0, 0, width, height, `rgba(255, 255, 255, ${0.8 * w * a})`); }
            if (f === 73) for (let i = 0; i < 80; i++) this.spark.push({ x: cx, y: cy, ang: Math.random() * 6.28, sp: 2.5 + Math.random() * 8, life: 1, size: 5 + Math.random() * 6, hue: Math.random() * 360 });
            for (let i = this.spark.length - 1; i >= 0; i--) { let p = this.spark[i]; p.x += Math.cos(p.ang) * p.sp; p.y += Math.sin(p.ang) * p.sp; p.sp *= 0.97; p.life -= 0.015; p.hue = (p.hue + 4) % 360; if (p.life <= 0) { this.spark.splice(i, 1); continue; } DrawCircle(p.x, p.y, p.size * p.life, `hsla(${p.hue}, 100%, 65%, ${p.life * a})`); }
            if (f > 73) { let t = (f - 73) / 50; DrawStroke(cx, cy, 24 + t * 210, `hsla(${(f * 6) % 360}, 100%, 60%, ${Math.max(0, 1 - t) * a})`, 14); }
        }
    }

    // Water — azure + white caustics and rising bubbles (lingering)
    function Water() {
        this.frame = 0; this.lifetime = 99999; this.fadingOut = false; this.fadeFrame = 0; this.bub = [];
        this.draw = function () {
            this.frame++;
            if (!waterGoing) this.fadingOut = true;
            let env; if (this.fadingOut) { this.fadeFrame++; env = 1 - this.fadeFrame / 30; if (env <= 0) { this.lifetime = 0; return; } } else env = Math.min(1, this.frame / 25);
            hiddenCtx.globalAlpha = env;
            let g = hiddenCtx.createLinearGradient(0, 0, 0, height);
            g.addColorStop(0, 'rgba(20, 90, 160, 0.6)'); g.addColorStop(1, 'rgba(8, 40, 95, 0.9)');
            hiddenCtx.fillStyle = g; hiddenCtx.fillRect(0, 0, width, height);
            for (let i = 0; i < 5; i++) {
                let yb = (i / 5) * height + 20;
                hiddenCtx.strokeStyle = `rgba(210, 240, 255, ${0.18 + 0.12 * Math.sin(this.frame * 0.05 + i)})`; hiddenCtx.lineWidth = 7; hiddenCtx.beginPath();
                for (let x = 0; x <= width; x += 16) { let y = yb + Math.sin(x * 0.04 + this.frame * 0.06 + i) * 15; x === 0 ? hiddenCtx.moveTo(x, y) : hiddenCtx.lineTo(x, y); } hiddenCtx.stroke();
            }
            if (this.frame % 4 === 0) this.bub.push({ x: Math.random() * width, y: height + 12, r: 8 + Math.random() * 8, sp: 2.2 + Math.random() * 2.8, wob: Math.random() * 6.28 });
            for (let i = this.bub.length - 1; i >= 0; i--) {
                let b = this.bub[i]; b.y -= b.sp; b.x += Math.sin(this.frame * 0.06 + b.wob) * 0.5;
                if (b.y < -b.r) { this.bub.splice(i, 1); continue; }
                DrawCircle(b.x, b.y, b.r, 'rgba(200, 235, 255, 0.22)');
                DrawStroke(b.x, b.y, b.r, 'rgba(230, 248, 255, 0.7)', 6);
                DrawCircle(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.22, 'rgba(255, 255, 255, 0.8)');
            }
            hiddenCtx.globalAlpha = 1;
        }
    }

    // Level Up — a blue hexagon fills like a clock, then explodes with particles
    function LevelUp() {
        this.frame = 0; this.lifetime = 150; this.spk = [];
        this.draw = function () {
            this.frame++; let f = this.frame;
            if (f >= 150) { this.lifetime = 0; return; }
            let a = f < 12 ? f / 12 : (f > 125 ? (150 - f) / 25 : 1);
            DrawRect(0, 0, width, height, `rgba(0, 0, 0, ${a})`);
            let cx = 160, cy = 100, R = 70, rot = -Math.PI / 2;
            const hex = () => { let p = new Path2D(); for (let i = 0; i < 6; i++) { let ang = rot + i * Math.PI / 3; let x = cx + Math.cos(ang) * R, y = cy + Math.sin(ang) * R; i === 0 ? p.moveTo(x, y) : p.lineTo(x, y); } p.closePath(); return p; };
            let hp = hex();
            let fill = Math.max(0, Math.min(1, (f - 20) / 75));
            hiddenCtx.save(); hiddenCtx.clip(hp);
            hiddenCtx.fillStyle = `rgba(30, 60, 110, ${0.35 * a})`; hiddenCtx.fill(hp);
            if (fill > 0) {
                let sweep = fill * Math.PI * 2;
                let grad = hiddenCtx.createRadialGradient(cx, cy, 4, cx, cy, R * 1.1);

    // 5-point / N-point star polygon (used by Win and New Story)
    function drawStar(cx, cy, points, outer, inner, rot, color) {
        hiddenCtx.beginPath();
        for (let i = 0; i < points * 2; i++) {
            let r = i % 2 === 0 ? outer : inner;
            let ang = rot + i * Math.PI / points;
            let x = cx + Math.cos(ang) * r, y = cy + Math.sin(ang) * r;
            i === 0 ? hiddenCtx.moveTo(x, y) : hiddenCtx.lineTo(x, y);
        }
        hiddenCtx.closePath(); hiddenCtx.fillStyle = color; hiddenCtx.fill();
    }

    // New Story — a yellow star spirals in inside a white ring, settles, then sparkles
    function NewStory() {
        this.frame = 0; this.lifetime = 150; this.spk = [];
        this.draw = function () {
            this.frame++; let f = this.frame; if (f >= 150) { this.lifetime = 0; return; }
            let a = f < 12 ? f / 12 : (f > 125 ? (150 - f) / 25 : 1);
            DrawRect(0, 0, width, height, `rgba(0, 0, 0, ${a})`);
            let cx = width / 2, cy = height / 2;
            let t = Math.min(1, f / 55);
            let spin = (1 - t) * 14 + f * 0.03;
            let scale = 0.2 + 0.8 * (1 - Math.pow(1 - t, 3));
            let ringR = 92 * scale;
            let g = hiddenCtx.createRadialGradient(cx, cy, 2, cx, cy, ringR + 40); g.addColorStop(0, `rgba(255, 240, 180, ${0.4 * a})`); g.addColorStop(1, 'rgba(0,0,0,0)'); hiddenCtx.fillStyle = g; hiddenCtx.fillRect(0, 0, width, height);
            DrawStroke(cx, cy, ringR, `rgba(237, 247, 255, ${a * 0.9})`, 10);
            drawStar(cx, cy, 5, 56 * scale, 25 * scale, spin - Math.PI / 2, `rgba(255, 205, 50, ${a})`);
            if (f === 60) for (let i = 0; i < 44; i++) this.spk.push({ x: cx, y: cy, ang: Math.random() * 6.28, sp: 2 + Math.random() * 5, life: 1, size: 1.5 + Math.random() * 2.5 });
            for (let i = this.spk.length - 1; i >= 0; i--) { let p = this.spk[i]; p.x += Math.cos(p.ang) * p.sp; p.y += Math.sin(p.ang) * p.sp; p.sp *= 0.95; p.life -= 0.02; if (p.life <= 0) { this.spk.splice(i, 1); continue; } DrawCircle(p.x, p.y, p.size * p.life, `rgba(255, 240, 170, ${p.life * a})`); }

    }
